 주시기 바랍니다. 계획이 미확정인 경우, 공모 설계에 적용할 기준 레벨과 계획 조건을 안내하여 주시기 바랍니다.\r\n\r\n질의답변: 아래 묶음 6~8 공통 답변.\r\n\r\n### 8-2\r\n\r\n질의내용\r\n\r\n**획지1의 주차장 진출입구 및 차량동선 계획**\r\n\r\n본 공영주차장의 차량 진출입 계획 시, 인접한 획지1의 차량동선과 주변도로 접속 관계를 함께 검토하여 동선의 상호 간섭 가능성을 파악할 필요가 있습니다. 이에 획지1 주차장 진출입구의 위치, 접속 도로 및 차량 진입·진출 방향을 확인할 수 있는 자료를 제공하여 주시기 바랍니다. 특히 소(국) 3-64를 통한 획지1의 차량 진출입이 계획되어 있는지 함께 확인하여 주시기 바랍니다.\r\n\r\n질의답변: 아래 묶음 6~8 공통 답변.\r\n\r\n#### 6~8 공통 답변\r\n\r\n적용 범위: 묶음 6 No 1~3, 묶음 7, 묶음 8 No 1~2의 병합 답변.\r\n\r\n- 지상1층 유효높이 3.5m 이상 확보 외 건축물 높이제한 45m 이하 내 설계자가 제안\r\n- 소로3-64 : 획지1 공공보행통로로 연결 (레벨 관계에 따라 경사로 계획 가능)\r\n- 소로3-64 를 거쳐 획지1로의 차량진입 계획 없음\r\n- 계획 시 획지1,2 대지경계 내 3m 도로는 고려하지 않음 (미유지 전제로 계획)\r\n\r\n※ 스케치업 파일 및 획지1 지붕층 배치도(추가 제공자료) 참고\r\n\r\n## PDF 5쪽\r\n\r\n### 9-1\r\n\r\n질의내용\r\n\r\n**프로그램 면적의 ±10% 조정 범위에 대한 질의 (p.19)**\r\n\r\n세부 설계지침의 실별 프로그램 면적표에서는 각 시설별 기준면적을 ±10% 범위 내에서 조정할 수 있는 것으로 명시하고 있습니다.\r\n이와 관련하여 공영주차장 공용부 19,441㎡를 포함한 전체 세부시설의 기준면적에 ±10%를 적용할 수 있는 것인지, 또는 시민안내센터·서부관리소·장애인콜택시·따릉이 거점센터 등 부속 업무시설에 한하여 적용하는 것인지 확인 부탁드립니다.\r\n\r\n질의답변\r\n\r\n- 전체 연면적(20,847.64㎡ 이하) 내 각 시설별 기준면적\r\n  (공영주차장 ↔ 부속 업무시설)\r\n  (시민안내센터 ↔ 서부관리소 ↔ 장애인콜택시 ↔ 따릉이 거점센터)\r\n  상호 간 ±10% 범위 내에서 조정 가능\r\n\r\n### 9-2\r\n\r\n질의내용\r\n\r\n**차량 출입구의 설치 기준에 대한 질의 (p.20)**\r\n\r\n설계지침에서는 차량 출입구에 대하여 진출입 분리, 대기공간 및 만차 시 회차동선을 계획하도록 제시하고 있습니다. 이에 따라 차량 진입구와 진출구를 각각 별도의 출입구로 설치하여야 하는지, 또는 하나의 출입구에서 진입과 진출을 함께 처리하는 계획도 가능한지 확인 부탁드립니다.\r\n\r\n질의답변\r\n\r\n- 주차대수 규모가 50대 이상인 주차장으로서 관련 법령 및 기준을 준수하여 설계자가 제안\r\n  (진출입구 분리, 통합에 대하여 제한하지 않음)\r\n\r\n### 9-3\r\n\r\n질의내용\r\n\r\n**미래 모빌리티 및 주차수요 변화에 대응한 가변·확장형 구조계획의 범위에 대한 질의 (p.1)**\r\n\r\n공모 배경 및 설계지침에서는 전기차·자율주행차·공유모빌리티의 확대 및 주차수요 변화에 대응하여 공간의 일부 또는 전체를 변경할 수 있도록 가변·확장이 가능한 구조계획을 적극 고려하도록 제시하고 있습니다.\r\n이와 관련하여 해당 사항이 향후 주차공간의 일부를 다른 용도로 전환할 수 있도록 구조·층고·설비 등을 계획하는 것을 의미하는지, 또는 가변·확장형 구조계획에 대하여 별도로 요구되는 구체적인 조건이나 계획 수준이 있는지 확인 부탁드립니다.\r\n\r\n질의답변\r\n\r\n- 질의답변 4-5 참고\r\n\r\n### 9-4\r\n\r\n질의내용\r\n\r\n**장애인콜택시·따릉이 배송차량 등 운영차량의 주차대수 산정에 대한 질의 (p.20)**\r\n\r\n본 공모에서 제시한 최소 주차대수 390대에 장애인콜택시, 따릉이 배송차량 및 기타 시설 운영을 위한 전용 주차구획을 포함하여 산정할 수 있는지 확인 부탁드립니다.\r\n또한 해당 운영차량에 대하여 390대와 별도로 확보하여야 하는 차종별 주차대수가 정해져 있는지, 아울러 운영차량의 대기·승하차·하역 등을 위한 별도의 공간 확보 기준 및 차량별 규격이 있는 경우 해당 기준을 제시하여 주시기 바랍니다.\r\n\r\n질의답변\r\n\r\n- 질의답변 4-7 참고\r\n\r\n### 9-5\r\n\r\n질의내용\r\n\r\n**인접지 및 공공보행통로 연계 조건에 대한 질의**\r\n\r\n본 사업 대상지와 인접지 또는 공공보행통로를 직접 연결하거나 향후 연결을 고려하여 계획하여야 하는 별도의 조건이나 계획이 있는지 확인 부탁드립니다.\r\n또한 향후 주변 개발계획과의 연계성을 고려할 필요가 있는 경우, 설계 시 참고할 수 있도록 인접지의 건축물 배치·단면 및 공공보행통로의 위치·폭·레벨 등 관련 계획자료를 제공할 수 있는지 확인 부탁드립니다.\r\n\r\n질의답변\r\n\r\n- 질의답변 2, 3 참고\r\n\r\n### 9-6\r\n\r\n질의내용\r\n\r\n**업무시설(부속용도) 프로그램의 지하·지상 배치 가능 여부**\r\n\r\n설계지침에서 시민안내센터, 서부관리사무소, 장애인콜택시 관련 시설, 따릉이 거점센터 및 기타 창고 등 업무시설(부속용도)의 세부 프로그램을 지하층 또는 지상층에 배치하는 것이 가능한지, 그리고 프로그램별로 반드시 지상층 또는 1층에 배치하여야 하는 시설이 있는지 확인하여 주시기 바랍니다.\r\n\r\n질의답변\r\n\r\n- 시민안내센터, 자전거주차장 지상1층 배치 외 업무시설(부속용도)의 층별 배치는 제한 없음\r\n- 다만, 업무시설 중 사람이 상주하는 정주 공간인 경우 지상 배치를 권장하며\r\n  2.3. 세부 설계지침을 따라 설계자가 제안\r\n\r\n## PDF 6쪽\r\n\r\n### 10-1\r\n\r\n질의내용\r\n\r\n**획지1 건축계획의 확정 여부**\r\n\r\n제공된 3D 현황자료(SKP)에 표현된 획지1 건축물의 높이, 규모 및 동수 등이 확정된 계획인지, 설계공모를 위한 참고용 계획인지 질의드립니다. 향후 변경 가능성이 있는지도 확인 부탁드립니다.\r\n\r\n질의답변\r\n\r\n- 획지1 건축계획은 건축허가 단계로 획지1 건축물의 높이, 규모 및 동수는 제공된 스케치업을 참고\r\n\r\n### 10-2\r\n\r\n질의내용\r\n\r\n**자전거 주차장 배치의 자율성**\r\n\r\n설계공모 지침서에 명시된 자전거 주차장의 1층 배치가 필수 조건인지, 이용 편의성과 동선계획 등을 고려하여 설계자의 제안에 따라 다른 층으로 변경하거나 여러 층에 분산 배치할 수 있는지 질의드립니다.\r\n\r\n질의답변\r\n\r\n- 자전거 주차장 : 지상1층 배치\r\n\r\n### 10-3\r\n\r\n질의내용\r\n\r\n**획지1과의 공중보행통로 연결 가능 여부**\r\n\r\n획지1과 획지2의 보행 연계성을 확보하기 위해, 공영주차장 상층부에서 획지1 건축물로 직접 연결되는 공중보행통로(연결 브릿지)를 설계자가 추가로 제안할 수 있는지 질의드립니다.\r\n\r\n질의답변\r\n\r\n- 공중공공보행통로는 획지2 청파로변(30m)에 조성\r\n- 획지2 ↔ 획지1 간 공중보행통로(연결 브릿지) 제안 불가\r\n\r\n### 11-1\r\n\r\n질의내용\r\n\r\n**획지2의 혼합 용도지역 및 정부일조 높이제한 적용**\r\n\r\n획지2는 제2종,제3종일반주거지역과 일반상업지역에 걸쳐 있으나 상업지역이 대지의 과반을 차지하는 것으로 판단됩니다. 획지2 전체를 하나의 건축대지로 계획하는 경우 건축법 제54조 및 시행령 제77조에 따라 일반상업지역의 건축법 규정을 대지와 건축물 전체에 적용하여 시행령 제86조 제1항의 정북방향 일조 높이제한을 적용하지 않은 것으로 이해해도 되는지 확인 부탁드립니다.\r\n\r\n질의답변\r\n\r\n- 정북일조 높이제한 미적용(일반상업지역 적용)\r\n\r\n### 11-2\r\n\r\n질의내용\r\n\r\n**획지2의 확정 경계 용도지역별 면적**\r\n\r\n사업대상지인 획지2 *2,216.30제곱미터*의 확정 경계와 용도지역 경계를 중첩한 도면 및 제2종일반주거지역, 제3종이란주거지역,일반상업지역별 면적표를 제공해 주시기 바랍니다. 아울러 해당 공모에 적용할 기준선은 제공된 현황측량도 도면의 경계선으로 적용하여도 무방한지 질의 드립니다.\r\n\r\n질의답변\r\n\r\n- 용도지역 별 면적표 미제공 (건폐율, 용적율, 높이 기준은 세부개발계획 결정도를 따름)\r\n- 현황측량도(제공자료, CAD파일) 내 경계선 적용\r\n\r\n### 11-3\r\n\r\n질의내용\r\n\r\n**건축한계선 및 벽면한계선 및 높이 9미터**\r\n\r\n획지2 각 경계 구간에 적용되는 건축한계선 후퇴거리(3미터,1.5미터,1미터)와 벽면한계선 3미터의 시작, 종점 및 기준선을 CAD도면으로 제시해 주시기 바랍니다. 소로 3-64변의 **필로티 계획으로 높이 9미터 이상(3개층) 확보**는 해당 구간에 기둥, 보행자 램프 , 조경시설 설치 등 가능 여부 질의 드립니다.\r\n\r\n질의답변: 아래 묶음 11 No 3~4 공통 답변.\r\n\r\n### 11-4\r\n\r\n질의내용\r\n\r\n**공개공지, 개방형 녹지 및 보행 연결**\r\n\r\n고시의 개방형 녹지 20%이상, 공개공지 최소 폭9미터, 필로티형 공개공지 유효높이 8미터 조건이 특별계획구역 전체 기준인지, 획지2에도 별도 확보해야 하는 조건인지 질의 드립니다.\r\n\r\n질의답변: 아래 묶음 11 No 3~4 공통 답변.\r\n\r\n#### 11 No 3~4 공통 답변\r\n\r\n- 질의답변 2 참고\r\n- 획지1 개방형 녹지 20% 이상 확보\r\n\r\n### 11-5\r\n\r\n질의내용\r\n\r\n**연면적 시설별 면적 조정 기준**\r\n\r\n총 연면적 기준 별도 최소 연면적은 없는지, 세부시설 기준 면적 ±10%는 각 실별로 적용하는지, 실별 소계에 적용하는지 질의 드립니다.\r\n\r\n질의답변\r\n\r\n- 질의답변 9-1 참고\r\n\r\n## PDF 7쪽\r\n\r\n### 11-6. 운영기관 전용 주차 필요여부\r\n\r\n질의: 운영기관별 전용 주차면, 전용 구역, 차고지 등 확보가 필요한 경우 요구 대수와 차량 제원을 제시 바랍니다.\r\n\r\n답변: 질의답변 4-7 참고\r\n\r\n### 11-7. 전기차 충전, 화재 대응 및 운영 기준\r\n\r\n질의: 전기차 충전구역 위치(지상1층 혹은 최상층)에 관하여 운영기관의 추가 요구사항이나 별도 전기차충전구역에 관한 메뉴얼이 있는지 질의 드립니다.\r\n\r\n답변:\r\n- 市 전기자동차 전용주차구역의 화재 예방 및 안전시설 지원에 관한 조례 참고\r\n- 전기차 충전구역 : 정주공간(부속 업무시설)이 없는 저층부 주차층 우선 배치하고 한쪽 벽면 집적 배치 및 소방 개구부 확보\r\n\r\n### 11-8. 미래 용도 전환의 목표와 필수 성능\r\n\r\n질의: 미래 용도 전환은 설계 개념과 전환 시나리오 제시 수준인지 질의 드립니다.\r\n\r\n답변: 질의답변 4-5 참고\r\n\r\n### 11-9.\r\n\r\n질의: 별도 과업지지서가 있는 경우 제공 바랍니다.\r\n\r\n답변: 없음(미제공)\r\n\r\n### 11-10. 서비스 차량 하역과 따릉이 작업 조건\r\n\r\n질의: 서비스 차량의 최대 제원 중량 등의 자료를 제시해 주시기 바라며, 따릉이 정비 입출고 방식과 하루 처리규모, 전용 화물승강기 필요 여부 등 확인 부탁드립니다.\r\n\r\n답변:\r\n- 전용 화물승강기 불필요\r\n- 따릉이 운반 차량 : (대부분) 1톤 또는 연장형 1톤 트럭\r\n\r\n### 12.\r\n\r\n질의: 신축되는 공영주차장의 주차수요가 획지 1의 이용객을 대상으로 운영되는지, 인근 방문객들을 대상으로 운영되는지 주이용대상에 대해 질의드립니다.\r\n\r\n답변: 개방형 공영주차장(이용객 제한 없음)\r\n\r\n### 13.\r\n\r\n질의: 중로 3-8과 소로 3-64가 접속하는 구간이 도로교통법 상 교차로에 해당하는지 확인 부탁드립니다. 해당 구간이 교차로에 해당하는 경우, 교차로와 마주하는 획지2의 대지 경계에도 차량 진출입구 설치와 관련된 제한사항이 적용되는지 질의 드립니다.\r\n\r\n답변: 주차장법 및 도로교통법 적용하여 진출입구 계획\r\n\r\n### 14-1.\r\n\r\n질의: 지구단위 계획도에 대지내 공지 - 공개공지 -공통 사항으로 최소 폭 9m 이상의 공개공지 확보에 대한 항목이 획지2에 동일하게 적용이 되어야 하는지 질의 드립니다.\r\n\r\n답변: 질의답변 2 참고 (14-1·14-2 병합 답변)\r\n\r\n### 14-2.\r\n\r\n질의: 결정도 상 획지2와 소로3-64가 접하는 구간에 벽면한계선이 표시되어 있으나 해당 위치에 건축한계선이 별도로 지정되어 있는지 명확하게 확인하기 어렵습니다. 해당 구간에는 벽면한계선만 지정되어 있는 것인지, 아니면 동일한 위치에 건축한계선과 벽면한계선이 중첩되어 표시된 것인지 확인 부탁드립니다. 만약 벽면한계선과 건축한계선이 중첩되어있을 경우 벽면한계선의 기준이 대지경계로부터인지, 건축한계선으로부터인지 질의 드립니다.\r\n\r\n답변: 질의답변 2 참고 (14-1·14-2 병합 답변)\r\n\r\n### 14-3.\r\n\r\n질의: 주차장을 효율적으로 계획하여 남는 면적으로 새로운 프로그램 제안이 가능한지 질의 드립니다.\r\n\r\n답변: 여유 면적 내 관련 프로그램(추가 세부시설) 제안 가능\r\n\r\n### 14-4.\r\n\r\n질의: 획지1의 건축개요(층수) 및 배치계획 자료 요청 드립니다.\r\n\r\n답변: 건축개요 미제공, 지붕층 배치도 제공\r\n\r\n## PDF 8쪽\r\n\r\n### 15. 지침서 9쪽 제출서류 관련\r\n\r\n질의: 국내 건축사사무소와 외국 건축사사무소가 공동 응모하는 경우, 공동 응모자인 외국 건축사는 건축사 자격증 원본만 제출하면 되는지, 아니면 국문 번역본을 함께 제출해야 하는지 문의드립니다.\r\n\r\n답변:\r\n- 해외 건축사 자격증 제출\r\n- 공인된 자격증이 없는 나라의 경우 해당국 건축가협회의 증명서(국문 번역본, 공증필) 제출\r\n- ※ 단, 참가자격 검증을 위하여 필요한 경우 추가 증빙자료를 요구할 수 있음\r\n\r\n### 16-1. 건축물 이격거리 및 건축한계선\r\n\r\n질의: 대상지의 도로 측 및 인접 대지 측 경계별로 적용되는 최소 이격거리와 건축한계선 지정 여부를 확인하여 주시기 바랍니다. 특히 건축물 외벽을 대지경계선으로부터 1.5m 이격하여 계획할 수 있는지, 추가 후퇴가 필요한 구간이 있다면 해당 위치·거리 및 적용 근거를 제시하여 주시기 바랍니다.\r\n\r\n답변: 질의답변 2 참고 (16-1·16-2·16-3 병합 답변)\r\n\r\n### 16-2. 현황측량도상 경계선의 의미\r\n\r\n질의: 제공된 현황측량도에서 'A-SITE-LINE-PROP' 레이어의 노란색 경계선 중 공영주차장 계획의 기준이 되는 대지 경계선을 명확히 확인하여 주시기 바랍니다. 또한 대상지 좌측 및 하측의 이중 노란선 사이 구역이 도로 등 별도의 도시계획시설 부지인지, 공모 대상 대지에 포함되는지 확인하여 주시기 바랍니다.\r\n\r\n답변: 질의답변 2 참고 (16-1·16-2·16-3 병합 답변)\r\n\r\n### 16-3. 관련 도면 제공\r\n\r\n질의: 위 사항을 확인할 수 있는 획지2의 도시계획시설 결정선, 건축한계선 및 후퇴 치수가 표시된 결정도면과 관련 시행지침의 제공 위치를 안내하여 주시기 바랍니다. 해당 자료가 누락된 경우 추가 제공을 요청드립니다.\r\n\r\n답변: 질의답변 2 참고 (16-1·16-2·16-3 병합 답변)\r\n\r\n### 16-4. 설계도판의 렌더링 및 포토샵 리터칭 허용 범위\r\n\r\n질의: 지침서에서는 \"3차원 이미지의 색상, 렌더링 및 이미지 편집 표현은 자유로 하되 참가자가 직접 생산한 자료만 사용한다\"고 명시하고 있습니다. 이에 따라 참가자가 직접 제작한 3차원 모델을 이용한 컬러 렌더링과 포토샵을 통한 재질·조명·색감 등의 리터칭을 설계도판에 적용하는 것이 허용되며, 별도의 감점 또는 심사상 불이익 대상에 해당하지 않는지 확인 부탁드립니다.\r\n\r\n답변: 별도의 감점, 심사상 불이익 없음 (단, 참가자가 직접 생산한 자료만 사용)\r\n\r\n### 16-5. 지하층 규모 조정 가능 여부\r\n\r\n질의: 지침서에 건축 규모는 '지하 4층·지상 10층 내외'로 제시되어 있으며, 층수·높이·연면적 허용범위 내에서 설계자가 합리적으로 제안하도록 명시되어 있습니다. 주차대수 390대 이상, 필수시설 및 면적 기준, 연면적·건폐율·용적률·높이 제한, 사업비 등 제반 조건을 모두 충족하는 경우, 지하층을 지하 2층으로 조정해 계획할 수 있는지 질의드립니다. 아울러 '지하 4층 굴착' 관련 지침이 지하 4개 층의 설치를 의무화하는 조건인지 확인 부탁드립니다.\r\n\r\n답변: 지상 및 지하 층수를 제한하지 않으며 제공된 인접부지 지반조사보고서, 예정공사비 등을 고려하여 설계자가 합리적으로 제안\r\n\r\n## PDF 9쪽\r\n\r\n### 17-1.\r\n\r\n질의: 지구단위계획상 획지2 남측(소로3-64변) 벽면한계선 3m의 필로티 구간에 기둥과 차량 출입구를 둘 수 있는지 확인 부탁드립니다.\r\n\r\n답변: 질의답변 2, 13 참고 (17-1·17-2 병합 답변)\r\n\r\n### 17-2.\r\n\r\n질의: 지구단위계획 기타사항의 '한강로2가 14-18 차량 회차공간 확보' 및 '14-18과 연접한 공개공지 통합조성'이 본 공모 설계 범위에 포함되는지 확인 부탁드립니다.\r\n\r\n답변: 질의답변 2, 13 참고 (17-1·17-2 병합 답변)\r\n\r\n### 17-3.\r\n\r\n질의: 자전거 주차장을 따릉이 거점센터 보관소(435㎡)와 별도로 산정하는지 확인 부탁드립니다.\r\n\r\n답변: 별도 산정\r\n\r\n### 17-4.\r\n\r\n질의: 지침 1.4의 공사비(50,411,760천 원)에 기존 주차장 철거와 흙막이 공사가 포함되는지 확인 부탁드립니다.\r\n\r\n답변: 기존 주차장 철거 제외, 흙막이 공사 포함\r\n\r\n### 17-5.\r\n\r\n질의: 획지1과 지하로 연결하는 계획이 전제인지 확인 부탁드립니다.\r\n\r\n답변: 지하 연결 고려하지 않음\r\n\r\n### 18.\r\n\r\n질의: 현재 특별계획구역8에 대한 제공자료는 [스케치업모델링+사이트]만 제공되어 있는데, 위 자료로는 주변여건이 어떻게 변화되는지 알 수 있는 한계가 있습니다. 계획시 변화된 주변환경에 대응하는 정확한 계획이 필요하다고 사료됩니다. 가능하다면 cad파일등으로 주변에 들어서는 시설들과 공개공지에 대한 배치도등을 제공해주실 수 있는지 질의드립니다.\r\n\r\n답변: 질의답변 3-1 참고\r\n\r\n### 19-1.\r\n\r\n질의: 대상지 서측에 접하는 소로3-64(계획 폭 6m)의 확정 폭원과 개통(준공) 예정 시기를 질의드립니다. 아울러 본 시설 준공 시점에 소로3-64가 개통되지 않았거나 폭원이 6m에 미치지 못하는 경우, 이 도로 쪽에 차량 출입구를 계획할 수 있는지 질의드립니다.\r\n\r\n답변: 계획 가능(제공된 도시계획 결정선을 따라 도로 조성 전제로 계획)\r\n\r\n### 19-2.\r\n\r\n질의: 지침 1.4는 지역지구를 \"일반상업지역\"으로 표기하고 있으나, 세부개발계획 결정 고시는 획지2에 \"제2종 및 제3종 일반주거지역, 일반상업지역 가중평균용적률\"을 적용하도록 하고 있습니다. 획지2의 용도지역별 면적을 알려 주시고, 대지 일부가 일반주거지역인 경우 정북방향 일조 확보를 위한 높이 제한이 적용되는지 질의드립니다.\r\n\r\n답변: 질의답변 11-1, 11-2 참고\r\n"};document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const href=a.getAttribute(' \uAD00\uB828 \uBC95\uADDC \uBC0F \uC548\uC804\xB7\uC6B4\uC601\uAE30\uC900\uC744 \uCDA9\uC871\uD558\uB294 \uAC83\uC744 \uC804\uC81C\uB85C, \uC790\uC8FC\uC2DD \uC8FC\uCC28\uC640 \uAE30\uACC4\uC2DD \uC8FC\uCC28\uB97C \uD63C\uC6A9\uD558\uC5EC \uACC4\uD68D\uD558\uB294 \uAC83\uC774 \uAC00\uB2A5\uD55C\uC9C0 \uC9C8\uC758\uD569\uB2C8\uB2E4.`,pl:"Punkt 2.2 wytycznych wymaga co najmniej 390 miejsc parkingowych, lecz nie okre\u015Bla odr\u0119bnego standardu sposobu parkowania. Czy przy spe\u0142nieniu przepis\xF3w oraz wymaga\u0144 bezpiecze\u0144stwa i eksploatacji mo\u017Cna po\u0142\u0105czy\u0107 parking z samodzielnym dojazdem do miejsc z parkingiem mechanicznym?"},answer:{kr:"- \uC790\uC8FC\uC2DD \uC8FC\uCC28 390\uB300 \uD655\uBCF4, \uAE30\uACC4\uC2DD \uC8FC\uCC28 \uACE0\uB824\uD558\uC9C0 \uC54A\uC74C",pl:"Nale\u017Cy zapewni\u0107 390 miejsc z samodzielnym dojazdem; parkingu mechanicznego nie nale\u017Cy uwzgl\u0119dnia\u0107."},topic:"access",slide:3,status:"forbidden"},{id:"2-1",page:2,question:{kr:`\uD68D\uC9C02 \uAC74\uCD95\uD55C\uACC4\uC120 \uD6C4\uD1F4\uAC70\uB9AC(1m \uC5EC\uBD80) \uD655\uC778

\uACE0\uC2DC\uC758 \uAC74\uCD95\uD55C\uACC4\uC120 \u300C\uC774\uBA74\uBD80(\uBD81\uCE21) 1.5m, \uC774\uBA74\uBD80(\uD68D\uC9C02) 1m\u300D\uC640 \uAD00\uB828\uD558\uC5EC, \uACB0\uC815\uB3C4\uC0C1 \uD68D\uC9C02 \uBD81\uC11C\uCE21 \uBCC0\uC740 1m\uB85C \uD45C\uAE30\uB418\uACE0 1.5m\uB294 \uD68D\uC9C01 \uBD81\uCE21\uC73C\uB85C \uD310\uB3C5\uB429\uB2C8\uB2E4. \uD68D\uC9C02\uC5D0 \uC801\uC6A9\uB418\uB294 \uAC74\uCD95\uD55C\uACC4\uC120\uC774 1m\uAC00 \uB9DE\uB294\uC9C0, \uD68D\uC9C02 \uBD81\uCE21\uBCC0\uC5D0\uB3C4 1m\uAC00 \uC801\uC6A9\uB418\uB294\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4. \uB610\uD55C \uAC74\uCD95\uD55C\uACC4\uC120\uC774 \uC9C0\uC815\uB418\uC9C0 \uC54A\uC740 \uBCC0(\uC18C\uB85C3-64 \uC11C\uCE21\xB7\uB0A8\uCE21\uBCC0)\uC740 \uBCBD\uBA74\uD55C\uACC4\uC120 3m\uAC00 \uC720\uC77C\uD55C \uD6C4\uD1F4 \uAE30\uC900\uC778\uC9C0 \uC9C8\uC758\uB4DC\uB9BD\uB2C8\uB2E4.`,pl:`Potwierdzenie odsuni\u0119cia nieprzekraczalnej linii zabudowy na dzia\u0142ce 2: czy wynosi 1 m?

W obwieszczeniu wskazano \u201Eod ty\u0142u, od p\xF3\u0142nocy: 1,5 m; od ty\u0142u, dzia\u0142ka 2: 1 m\u201D. Na rysunku decyzji p\xF3\u0142nocno-zachodni bok dzia\u0142ki 2 ma oznaczenie 1 m, a 1,5 m wydaje si\u0119 dotyczy\u0107 p\xF3\u0142nocnego boku dzia\u0142ki 1. Prosimy potwierdzi\u0107, czy na dzia\u0142ce 2, tak\u017Ce od p\xF3\u0142nocy, obowi\u0105zuje 1 m. Czy na bokach bez wskazanej linii zabudowy, przy zachodnim i po\u0142udniowym odcinku drogi 3-64, jedynym kryterium odsuni\u0119cia jest linia ograniczaj\u0105ca po\u0142o\u017Cenie elewacji, 3 m?`},answer:{kr:`- \uD68D\uC9C02 \uB0A8\uCE21 \uC18C\uB85C3-64\uBCC0\uC740 \uAC74\uCD95\uD55C\uACC4\uC120 3m \uBBF8\uC801\uC6A9 \uAD6C\uAC04\uC73C\uB85C \uBCBD\uBA74\uD55C\uACC4\uC120(\uD544\uB85C\uD2F0\uACC4\uD68D\uC73C\uB85C \uB192\uC774 9m \uC774\uC0C1(3\uAC1C\uCE35) \uD655\uBCF4) 3m \uBC0F \uB300\uC9C0\uC548\uC758 \uACF5\uC9C0 \uC801\uC6A9

\uB2F5\uBCC0 \uB3C4\uC2DD \uB0B4 \uD45C\uAE30

- \uD3C9\uBA74 \uB3C4\uC2DD: 669.36% \uC774\uD558 / 45m\uC774\uD558 / 90% / \uAC74\uCD95\uD55C\uACC4\uC120 1.5m / 1.5m / \uAC74\uCD95\uD55C\uACC4\uC120 1m / \uAC74\uCD95\uD55C\uACC4\uC120 3m / \uD68D\uC9C02 / \uC18C(\uAD6D) 3-64 / \uBCBD\uBA74\uD55C\uACC4\uC120 3m (\uB192\uC774 9m \uC774\uC0C1(3\uCE35) \uD655\uBCF4)
- \uB2E8\uBA74 \uB3C4\uC2DD: \uBCBD\uBA74\uD55C\uACC4\uC120 3m / \uAC74\uCD95\uD55C\uACC4\uC120 1.5m / \uC8FC\uCC28\uC7A5 / \uD544\uB85C\uD2F0 \uACC4\uD68D\uC2DC, 3\uAC1C\uCE35 \uC774\uC0C1 \uD655\uBCF4 / \uB3C4\uB85C / \uBCF4\uD589\uB85C 3m / \uBCF4\uD589\uB85C 1.5m
- \uD3C9\uBA74 \uB3C4\uC2DD \uBC30\uACBD\uC758 \uC791\uC740 \uC9C0\uC801\uBC88\uD638 \uC77C\uBD80: [\uD310\uB3C5 \uBD88\uAC00]`,pl:`Po\u0142udniowy bok dzia\u0142ki 2 przy drodze 3-64 nie podlega nieprzekraczalnej linii zabudowy 3 m. Obowi\u0105zuje linia ograniczaj\u0105ca po\u0142o\u017Cenie elewacji 3 m, z zapewnieniem wysoko\u015Bci co najmniej 9 m, odpowiadaj\u0105cej 3 kondygnacjom, przy rozwi\u0105zaniu na s\u0142upach (pilotis), oraz wymagania dotycz\u0105ce otwartej przestrzeni na dzia\u0142ce.

Oznaczenia na wsp\xF3lnym schemacie odpowiedzi:
- Rzut: intensywno\u015B\u0107 zabudowy do 669,36%; wysoko\u015B\u0107 do 45 m; powierzchnia zabudowy 90%; linie zabudowy 1,5 m, 1 m i 3 m; dzia\u0142ka 2; droga 3-64; linia elewacji 3 m z wysoko\u015Bci\u0105 co najmniej 9 m, 3 kondygnacje.
- Przekr\xF3j: linia elewacji 3 m; linia zabudowy 1,5 m; parking; przy pilotis zapewni\u0107 co najmniej 3 kondygnacje; droga; ci\u0105g pieszy 3 m i ci\u0105g pieszy 1,5 m.
- Niekt\xF3re drobne numery ewidencyjne w tle schematu rzutu s\u0105 nieczytelne.`},topic:"site",slide:5,status:"clarified"},{id:"2-2",page:2,question:{kr:`\uBCBD\uBA74\uD55C\uACC4\uC120 \uC18C(\uAD6C) 3-64\uBCC0 3m(\uD544\uB85C\uD2F0\uACC4\uD68D\uC73C\uB85C \uB192\uC774 9m\uC774\uC0C1(3\uAC1C\uCE35) \uD655\uBCF4)\uC758 \uBD80\uC5F0\uC124\uBA85 \uBC0F \uC801\uC6A9\uBC94\uC704 \uBA85\uD655\uD654

\uD574\uB2F9 \uBB38\uAD6C\uAC00 \uC18C\uB85C3-64\uBCC0 \uC800\uCE35\uBD80\uB97C \uD544\uB85C\uD2F0\uB85C \uACC4\uD68D\uD574\uC57C \uD558\uB294 \uC758\uBB34\uC778\uC9C0, \uD544\uB85C\uD2F0\uB85C \uACC4\uD68D\uD558\uB294 \uACBD\uC6B0\uC758 \uB192\uC774 \uC870\uAC74\uC778\uC9C0 \uBD80\uC5F0 \uC124\uBA85 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4. \uACB0\uC815\uB3C4\uC0C1 \uBCBD\uBA74\uD55C\uACC4\uC120 \uC810\uC120\uC740 \uB0A8\uCE21\uBCC0\uC5D0\uB9CC \uD45C\uAE30\uB418\uACE0 \uC11C\uCE21\uBCC0\uC740 3m \uCE58\uC218\uB9CC \uD45C\uAE30\uB418\uC5B4 \uC788\uC5B4, \uC801\uC6A9\uBC94\uC704\uAC00 \uC11C\uCE21\uBCC0\xB7\uB0A8\uCE21\uBCC0 \uC804 \uAD6C\uAC04\uC778\uC9C0 \uC77C\uBD80 \uAD6C\uAC04\uC778\uC9C0 \uB3C4\uBA74\uC73C\uB85C \uBA85\uD655\uD788 \uD45C\uAE30\uD574 \uC8FC\uC2DC\uAE30 \uBC14\uB78D\uB2C8\uB2E4.

\uC544\uC6B8\uB7EC \uD544\uB85C\uD2F0 \uAD6C\uAC04\uC758 \uAE4A\uC774, \uD544\uB85C\uD2F0 \uD558\uBD80\uC758 \uC8FC\uCC28\xB7\uC790\uC804\uAC70 \uC8FC\uCC28\xB7\uCC28\uB7C9 \uB300\uAE30 \uBC30\uCE58 \uAC00\uB2A5 \uC5EC\uBD80, \uB192\uC774 9m\uC758 \uC0B0\uC815 \uAE30\uC900(\uBC14\uB2E5\uBA74~\uC0C1\uBD80 \uC2AC\uB798\uBE0C \uD558\uB2E8 \uB4F1), \uD544\uB85C\uD2F0 \uC0C1\uBD80\uCE35\uC758 \uBCBD\uBA74 \uB3CC\uCD9C \uBC0F \uC8FC\uCC28\xB7\uBD80\uC18D\uC6A9\uB3C4 \uBC30\uCE58 \uAC00\uB2A5 \uC5EC\uBD80\uB97C \uC9C8\uC758\uB4DC\uB9BD\uB2C8\uB2E4.`,pl:`Wyja\u015Bnienie i zakres linii ograniczaj\u0105cej po\u0142o\u017Cenie elewacji przy drodze 3-64: 3 m, a przy pilotis wysoko\u015B\u0107 co najmniej 9 m, 3 kondygnacje.

\uACE0\uC2DC\uC5D0 \u300C\uCCAD\uD30C\uB85C~\uC8FC\uCC28\uC7A5 \uAC04 \uC9C0\uC0C1\uBD80 \uACF5\uACF5\uBCF4\uD589\uD1B5\uB85C(\uD3ED 5m) \uC2DC\xB7\uC885\uC810 \uC9C0\uC815\u300D\uC774\uB77C \uB418\uC5B4 \uC788\uB294\uB370, \uC5EC\uAE30\uC11C \uC8FC\uCC28\uC7A5\uC774 \uD68D\uC9C02\uB97C \uB9D0\uD558\uB294 \uAC83\uC778\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4. \uD68D\uC9C02\uB97C \uB9D0\uD558\uB294 \uACBD\uC6B0 \uC2DC\uC810\xB7\uC885\uC810 \uC704\uCE58\uC640 \uB300\uC9C0 \uB0B4 \uACBD\uB85C\uB97C \uB3C4\uBA74\uC73C\uB85C \uC81C\uC2DC\uD574 \uC8FC\uC2DC\uAE30 \uBC14\uB78D\uB2C8\uB2E4. \uACB0\uC815\uB3C4\uC0C1 \uD1B5\uB85C \uD45C\uAE30\uB294 \uD68D\uC9C01 \uCABD\uC73C\uB85C \uD310\uB3C5\uB429\uB2C8\uB2E4. \uD1B5\uB85C\uB97C \uD544\uB85C\uD2F0 \uD558\uBD80\uC5D0 \uB450\uB294 \uACBD\uC6B0 \uD544\uB85C\uD2F0 \uB192\uC774 \uBC0F \uACF5\uAC1C\uACF5\uC9C0 \uAE30\uC900\uACFC\uC758 \uAD00\uACC4, 24\uC2DC\uAC04 \uAC1C\uBC29 \uC5EC\uBD80, \uD1B5\uB85C \uD3ED 5m \uB0B4 \uCC28\uB7C9 \uC9C4\uCD9C\uC785 \uAD50\uCC28 \uD5C8\uC6A9 \uC5EC\uBD80\uB3C4 \uC9C8\uC758\uB4DC\uB9BD\uB2C8\uB2E4.`,pl:`Pocz\u0105tek i koniec og\xF3lnodost\u0119pnego ci\u0105gu pieszego o szeroko\u015Bci 5 m.

\uC608\uC815\uACF5\uC0AC\uBE44 504\uC5B5 \uD3EC\uD568\uC5EC\uBD80 (\uB2E8\uACC4\uBCC4 \uCD94\uC9C4\uACC4\uD68D\uC5D0 \uD65C\uC6A9 \uC5EC\uBD80)`,pl:"Czy rozbi\xF3rka istniej\u0105cego Yongsan Parking Building nale\u017Cy do zakresu tego zam\xF3wienia i czy zawiera si\u0119 w planowanym koszcie budowy oko\u0142o 50,4 mld KRW, tak\u017Ce na potrzeby planu etapowania?"},answer:{kr:`- \uCD1D \uC0AC\uC5C5\uBE44(\uAE30\uBD80\uCC44\uB0A9 \uC124\uCE58\uBE44, 63,014,700\uCC9C\uC6D0) \uB0B4 \uCCA0\uAC70\uACF5\uC0AC \uD3EC\uD568

)",pl:"Zarz\u0105d zachodni to biuro Seoul Facilities Corporation odpowiedzialne za zintegrowane zarz\u0105dzanie centrum informacji dla mieszka\u0144c\xF3w, biurem taks\xF3wek i centrum Ddareungi oraz pozosta\u0142ymi obiektami. Odnie\u015B\u0107 si\u0119 do szczeg\xF3\u0142owych wytycznych projektowych w punkcie 2.3."},topic:"program",slide:2,status:"clarified"},{id:"4-9",page:3,question:{kr:"\uB530\uB989\uC774 \uAC70\uC810\uC13C\uD130\uC758 \uC2DC\uC124 \uACC4\uD68D \uC138\uBD80 \uAE30\uC900 (\uB9E4\uCF00\uB2C9, \uC0AC\uBB34\uC9C1 \uB4F1 \uC9C1\uC885\uBCC4 \uADFC\uBB34\uC608\uC815\uC778\uC6D0, \uACF5\uAC04\uACC4\uD68D\uC2DC \uACE0\uB824\uD544\uC694\uC0AC\uD56D \uB4F1)",pl:"Jakie szczeg\xF3\u0142owe kryteria dotycz\u0105 centrum Ddareungi, miejskiego systemu rower\xF3w: planowane zatrudnienie wed\u0142ug zawod\xF3w, w tym mechanik\xF3w i pracownik\xF3w biurowych, oraz wymagania planowania przestrzeni?"},answer:{kr:"- \uADFC\uBB34 \uC608\uC815\uC778\uC6D0 \uBBF8\uC815 (\uC124\uACC4\uACF5\uBAA8\uC9C0\uCE68\uC11C 2.3. \uC138\uBD80\uC124\uACC4\uC9C0\uCE68 \uCC38\uACE0)",pl:"Planowana liczba pracownik\xF3w nie zosta\u0142a ustalona. Odnie\u015B\u0107 si\u0119 do szczeg\xF3\u0142owych wytycznych projektowych w punkcie 2.3."},topic:"program",slide:2,status:"unprovided"},{id:"4-10",page:3,question:{kr:`[\uC11C\uC2DD 13] \uC608\uC815 \uACF5\uC0AC\uBE44 \uAC80\uD1A0 \uC758\uACAC\uC11C

status:"requirement"},{id:"4-13",page:3,question:{kr:"\uB85C\uBD07\uC8FC\uCC28(\uC790\uB3D9\uC774\uC1A1\uC8FC\uCC28\uC7A5\uCE58) \uB4F1 \uB3C4\uC785 \uC5EC\uBD80",pl:"Czy planuje si\u0119 parking robotyczny, np. urz\u0105dzenia automatycznie przemieszczaj\u0105ce zaparkowane samochody?"},answer:{kr:"- \uD604\uC7AC \uC5C6\uC73C\uB098 \uD5A5\uD6C4 \uB3C4\uC785 \uAC00\uB2A5\uC131 \uC874\uC7AC",pl:"Obecnie nie, ale istnieje mo\u017Cliwo\u015B\u0107 wprowadzenia go w przysz\u0142o\u015Bci."},topic:"future",slide:10,status:"clarified"},{id:"4-14",page:3,question:{kr:"\uAE30\uACC4\uC2DD\uC8FC\uCC28\uC7A5 \uD63C\uC6A9 \uAC00\uB2A5 \uC5EC\uBD80",pl:"Czy mo\u017Cna \u0142\u0105czy\u0107 parking z parkingiem mechanicznym?"},answer:{kr:"- \uD63C\uC6A9 \uBD88\uAC00",pl:"\u0141\u0105czenie z parkingiem mechanicznym jest niedopuszczalne."},topic:"access",slide:3,status:"forbidden"},{id:"5-1",page:4,question:{kr:'\uC9C0\uCE68 p19. "\uD544\uB85C\uD2F0, \uBC1C\uCF54\uB2C8 \uB4F1 \uC5F0\uBA74\uC801\uC5D0 \uD3EC\uD568\uB418\uC9C0 \uC54A\uB294 \uBA74\uC801\uC740 \uAD6C\uBD84\uD558\uC5EC \uC124\uACC4\uAC1C\uC694\uC640 \uBA74\uC801 \uD45C\uC5D0 \uBCC4\uB3C4 \uD45C\uAE30\uD55C\uB2E4."\uC640 \uAD00\uB828\uD558\uC5EC \uB300\uC0C1\uC9C0 \uB0B4 \uD544\uB85C\uD2F0\uB97C \uACC4\uD68D\uD55C \uACBD\uC6B0 \uACF5\uC911\uC758 \uD1B5\uD589\uC5D0 \uD574\uB2F9\uD55C\uB2E4\uACE0 \uD310\uB2E8\uD558\uC5EC \uBC14\uB2E5\uBA74\uC801 \uC0B0\uC785\uC5D0\uC11C \uC81C\uC678\uD574\uB3C4 \uB418\uB294\uC9C0 \uC9C8\uC758 \uB4DC\uB9BD\uB2C8\uB2E4.',pl:"Wytyczne na s. 19 wymagaj\u0105 osobnego wskazania w opisie i zestawieniu powierzchni pilotis, balkon\xF3w i innych element\xF3w niewliczanych do powierzchni ca\u0142kowitej. Czy pilotis na dzia\u0142ce mo\u017Cna potraktowa\u0107 jako przestrze\u0144 publicznego przej\u015Bcia i wy\u0142\u0105czy\u0107 z powierzchni kondygnacji?"},answer:{kr:"- \uD544\uB85C\uD2F0, \uBC1C\uCF54\uB2C8 \uB4F1 \uBC14\uB2E5\uBA74\uC801\uACFC \uC5F0\uBA74\uC801\uC5D0\uC11C \uC0B0\uC785 \uC81C\uC678\uB418\uB098 \uAC74\uBB3C\uC758 \uC678\uD53C \uBA74\uC801\uC744 \uC99D\uAC00\uC2DC\uD0A4\uB294\uBA74\uC801\uC740 \uAD6C\uBD84\uD558\uC5EC \uBCC4\uB3C4 \uD45C\uAE30",pl:"Powierzchnie pilotis, balkon\xF3w i podobnych element\xF3w, kt\xF3re s\u0105 wy\u0142\u0105czone z powierzchni kondygnacji i powierzchni ca\u0142kowitej, lecz zwi\u0119kszaj\u0105 powierzchni\u0119 obudowy budynku, nale\u017Cy wyodr\u0119bni\u0107 i wykaza\u0107 osobno."},topic:"envelope",slide:1,status:"clarified"},{id:"5-2",page:4,question:{kr:"\uC9C0\uCE68 P8. \uC124\uACC4\uB3C4\uD310\uC740 \uC544\uB798 \uB0B4\uC6A9\uC744 \uD3EC\uD568\uD558\uC5EC \uC790\uC728 \uAD6C\uC131\uD55C\uB2E4. \uC774\uD558 \uB0B4\uC6A9\uACFC \uAD00\uB828\uD558\uC5EC \uBC30\uCE58\uB3C4, \uD3C9\uBA74\uB3C4, \uC785\uBA74\uB3C4, \uB2E8\uBA74\uB3C4\uC758 \uCD95\uCC99\uC744 \uC8FC\uC5B4\uC9C4 \uCD95\uCC99\uACFC \uB2E4\uB974\uAC8C \uC790\uC728\uC801\uC73C\uB85C \uAD6C\uC131\uD560 \uC218 \uC788\uB294\uC9C0 \uC9C8\uC758 \uB4DC\uB9BD\uB2C8\uB2E4.",pl:"W zwi\u0105zku z zapisem na s. 8, \u017Ce plansze mo\u017Cna komponowa\u0107 swobodnie, uwzgl\u0119dniaj\u0105c podane tre\u015Bci: czy mo\u017Cna przyj\u0105\u0107 inne skale planu zagospodarowania, rzut\xF3w, elewacji i przekroj\xF3w ni\u017C wskazane?"},answer:{kr:"- \uC2EC\uC0AC\uC758 \uD3B8\uC758\uC640 \uD6A8\uC728\uC131\uC744 \uC704\uD558\uC5EC \uC8FC\uC5B4\uC9C4 \uCD95\uCC99\uC744 \uC900\uC218\uD560 \uAC83\uC744 \uAD8C\uC7A5\uD558\uB098 \uC124\uACC4\uC790\uC758 \uC758\uB3C4\uC5D0 \uB530\uB77C \uC790\uC728 \uAD6C\uC131 \uAC00\uB2A5",pl:"Dla wygody i sprawno\u015Bci oceny zaleca si\u0119 podane skale, lecz projektant mo\u017Ce dobra\u0107 je samodzielnie zgodnie z zamys\u0142em projektu."},topic:"overview",slide:14,status:"allowed"},{id:"5-3",page:4,question:{kr:"\uC81C\uACF5\uB41C \uB3C4\uC2DC\uAD00\uB9AC\uACC4\uD68D \uACB0\uC815 \uBC0F \uC9C0\uD615\uB3C4\uBA74 \uACE0\uC2DC P863. \uACF5\uAC1C\uACF5\uC9C0 \uD56D\uBAA9\uACFC \uAD00\uB828\uD558\uC5EC \uBCF8 \uC2DC\uC124\uC740 \uACF5\uAC1C\uACF5\uC9C0 \uC124\uCE58 \uB300\uC0C1\uC740 \uC544\uB2CC\uAC83\uC73C\uB85C \uD310\uB2E8\uB429\uB2C8\uB2E4. \uC774\uC5D0 \uACF5\uAC1C\uACF5\uC9C0\uB97C \uC758\uBB34\uC801\uC73C\uB85C \uD655\uBCF4\uD574\uC57C \uD558\uB294 \uC0AC\uD56D\uC778\uC9C0 \uB610\uB294 \uC124\uCE58 \uB300\uC0C1\uC5D0 \uD574\uB2F9\uD558\uB294 \uACBD\uC6B0\uC5D0 \uD55C\uD558\uC5EC \uD655\uBCF4\uD558\uBA74 \uB418\uB294 \uC0AC\uD56D\uC778\uC9C0 \uC9C8\uC758 \uD569\uB2C8\uB2E4.",pl:"W odniesieniu do og\xF3lnodost\u0119pnej przestrzeni otwartej w obwieszczeniu decyzji planistycznej i mapy topograficznej na s. 863: wydaje si\u0119, \u017Ce ten obiekt nie wymaga jej urz\u0105dzenia. Czy jest ona obowi\u0105zkowa, czy nale\u017Cy j\u0105 zapewni\u0107 wy\u0142\u0105cznie wtedy, gdy obiekt podlega takiemu obowi\u0105zkowi?"},answer:{kr:"- \uD68D\uC9C02 \uACF5\uAC1C\uACF5\uC9C0 \uC124\uCE58 \uBD88\uD544\uC694, \uD68D\uC9C01\uC5D0\uB9CC \uACF5\uAC1C\uACF5\uC9C0(\uC704\uCE58\uC9C0\uC815) \uC124\uCE58",pl:"Na dzia\u0142ce 2 og\xF3lnodost\u0119pna przestrze\u0144 otwarta nie jest wymagana; przestrze\u0144 o ustalonej lokalizacji powstaje wy\u0142\u0105cznie na dzia\u0142ce 1."},topic:"site",slide:5,status:"clarified"},{id:"6-1",page:4,question:{kr:"\uD68D\uC9C0 1\uC758 \uACC4\uD68D\uACE0\uB97C \uC9C8\uC758\uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Prosimy poda\u0107 projektowany poziom terenu dzia\u0142ki 1."},answer:{kr:`\uC801\uC6A9 \uBC94\uC704: \uBB36\uC74C 6 No 1~3, \uBB36\uC74C 7, \uBB36\uC74C 8 No 1~2\uC758 \uBCD1\uD569 \uB2F5\uBCC0.

\uC804\uAE30\uCC28 \uCDA9\uC804\uAD6C\uC5ED \uC704\uCE58(\uC9C0\uC0C11\uCE35 \uD639\uC740 \uCD5C\uC0C1\uCE35)\uC5D0 \uAD00\uD558\uC5EC \uC6B4\uC601\uAE30\uAD00\uC758 \uCD94\uAC00 \uC694\uAD6C\uC0AC\uD56D\uC774\uB098 \uBCC4\uB3C4 \uC804\uAE30\uCC28\uCDA9\uC804\uAD6C\uC5ED\uC5D0 \uAD00\uD55C \uBA54\uB274\uC5BC\uC774 \uC788\uB294\uC9C0 \uC9C8\uC758 \uB4DC\uB9BD\uB2C8\uB2E4.`,pl:`\u0141adowanie samochod\xF3w elektrycznych, ochrona przeciwpo\u017Carowa i eksploatacja.

Czy operator ma dodatkowe wymagania albo odr\u0119bny podr\u0119cznik dotycz\u0105cy lokalizacji stref \u0142adowania pojazd\xF3w elektrycznych, np. na parterze lub najwy\u017Cszej kondygnacji?`},answer:{kr:`- \u5E02 \uC804\uAE30\uC790\uB3D9\uCC28 \uC804\uC6A9\uC8FC\uCC28\uAD6C\uC5ED\uC758 \uD654\uC7AC \uC608\uBC29 \uBC0F \uC548\uC804\uC2DC\uC124 \uC9C0\uC6D0\uC5D0 \uAD00\uD55C \uC870\uB840 \uCC38\uACE0

18\uC5B4 \uD45C\uC2DC\uB41C \uAC83\uC778\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4. \uB9CC\uC57D \uBCBD\uBA74\uD55C\uACC4\uC120\uACFC \uAC74\uCD95\uD55C\uACC4\uC120\uC774 \uC911\uCCA9\uB418\uC5B4\uC788\uC744 \uACBD\uC6B0 \uBCBD\uBA74\uD55C\uACC4\uC120\uC758 \uAE30\uC900\uC774 \uB300\uC9C0\uACBD\uACC4\uB85C\uBD80\uD130\uC778\uC9C0, \uAC74\uCD95\uD55C\uACC4\uC120\uC73C\uB85C\uBD80\uD130\uC778\uC9C0 \uC9C8\uC758 \uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Na rysunku decyzji przy granicy dzia\u0142ki 2 i drogi 3-64 zaznaczono lini\u0119 ograniczaj\u0105c\u0105 po\u0142o\u017Cenie elewacji, ale trudno potwierdzi\u0107 odr\u0119bn\u0105 lini\u0119 zabudowy. Czy obowi\u0105zuje wy\u0142\u0105cznie linia elewacji, czy w tym samym miejscu nak\u0142adaj\u0105 si\u0119 obie linie? Je\u017Celi si\u0119 nak\u0142adaj\u0105, czy odleg\u0142o\u015B\u0107 linii elewacji liczy si\u0119 od granicy dzia\u0142ki, czy od linii zabudowy?"},answer:{kr:"\uC9C8\uC758\uB2F5\uBCC0 2 \uCC38\uACE0 (14-1\xB714-2 \uBCD1\uD569 \uB2F5\uBCC0)",pl:"Zobacz odpowied\u017A 2. Wsp\xF3lna odpowied\u017A dla pyta\u0144 14-1 i 14-2."},topic:"site",slide:5,status:"clarified"},{id:"14-3",page:7,question:{kr:"\uC8FC\uCC28\uC7A5\uC744 \uD6A8\uC728\uC801\uC73C\uB85C \uACC4\uD68D\uD558\uC5EC \uB0A8\uB294 \uBA74\uC801\uC73C\uB85C \uC0C8\uB85C\uC6B4 \uD504\uB85C\uADF8\uB7A8 \uC81C\uC548\uC774 \uAC00\uB2A5\uD55C\uC9C0 \uC9C8\uC758 \uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Czy po efektywnym rozplanowaniu parkingu mo\u017Cna zaproponowa\u0107 now\u0105 funkcj\u0119 w pozosta\u0142ej powierzchni?"},answer:{kr:"\uC5EC\uC720 \uBA74\uC801 \uB0B4 \uAD00\uB828 \uD504\uB85C\uADF8\uB7A8(\uCD94\uAC00 \uC138\uBD80\uC2DC\uC124) \uC81C\uC548 \uAC00\uB2A5",pl:"W dost\u0119pnej nadwy\u017Cce powierzchni mo\u017Cna proponowa\u0107 powi\u0105zane funkcje, czyli dodatkowe szczeg\xF3\u0142owe obiekty lub pomieszczenia."},topic:"future",slide:11,status:"allowed"},{id:"14-4",page:7,question:{kr:"\uD68D\uC9C01\uC758 \uAC74\uCD95\uAC1C\uC694(\uCE35\uC218) \uBC0F \uBC30\uCE58\uACC4\uD68D \uC790\uB8CC \uC694\uCCAD \uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Prosimy udost\u0119pni\u0107 opis og\xF3lny budynk\xF3w dzia\u0142ki 1, w tym liczb\u0119 kondygnacji, oraz materia\u0142y planu zagospodarowania."},answer:{kr:"\uAC74\uCD95\uAC1C\uC694 \uBBF8\uC81C\uACF5, \uC9C0\uBD95\uCE35 \uBC30\uCE58\uB3C4 \uC81C\uACF5",pl:"Opis og\xF3lny nie jest udost\u0119pniany; udost\u0119pniany jest rzut dachu."},topic:"site",slide:5,status:"unprovided"},{id:"15",page:8,question:{kr:`\uC9C0\uCE68\uC11C 9\uCABD \uC81C\uCD9C\uC11C\uB958 \uAD00\uB828

Gdy korea\u0144ska i zagraniczna pracownia architektoniczna wsp\xF3lnie uczestnicz\u0105 w konkursie, czy zagraniczny wsp\xF3\u0142uczestnik sk\u0142ada wy\u0142\u0105cznie orygina\u0142 uprawnie\u0144 architektonicznych, czy r\xF3wnie\u017C t\u0142umaczenie na j\u0119zyk korea\u0144ski?`},answer:{kr:`- \uD574\uC678 \uAC74\uCD95\uC0AC \uC790\uACA9\uC99D \uC81C\uCD9C
- \uACF5\uC778\uB41C \uC790\uACA9\uC99D\uC774 \uC5C6\uB294 \uB098\uB77C\uC758 \uACBD\uC6B0 \uD574\uB2F9\uAD6D \uAC74\uCD95\uAC00\uD611\uD68C\uC758 \uC99D\uBA85\uC11C(\uAD6D\uBB38 \uBC88\uC5ED\uBCF8, \uACF5\uC99D\uD544) \uC81C\uCD9C
- \u203B \uB2E8, \uCC38\uAC00\uC790\uACA9 \uAC80\uC99D\uC744 \uC704\uD558\uC5EC \uD544\uC694\uD55C \uACBD\uC6B0 \uCD94\uAC00 \uC99D\uBE59\uC790\uB8CC\uB97C \uC694\uAD6C\uD560 \uC218 \uC788\uC74C`,pl:`Nale\u017Cy z\u0142o\u017Cy\u0107 zagraniczny dokument uprawnie\u0144 architektonicznych.
Je\u017Celi w danym kraju nie ma uznawanego dokumentu uprawnie\u0144, nale\u017Cy z\u0142o\u017Cy\u0107 za\u015Bwiadczenie tamtejszego stowarzyszenia architekt\xF3w z t\u0142umaczeniem na j\u0119zyk korea\u0144ski i po\u015Bwiadczeniem notarialnym.
W razie potrzeby mo\u017Cna za\u017C\u0105da\u0107 dodatkowych dokument\xF3w potwierdzaj\u0105cych spe\u0142nienie warunk\xF3w uczestnictwa.`},topic:"overview",slide:13,status:"requirement"},{id:"16-1",page:8,question:{kr:`\uAC74\uCD95\uBB3C \uC774\uACA9\uAC70\uB9AC \uBC0F \uAC74\uCD95\uD55C\uACC4\uC120

\uB300\uC0C1\uC9C0\uC758 \uB3C4\uB85C \uCE21 \uBC0F \uC778\uC811 \uB300\uC9C0 \uCE21 \uACBD\uACC4\uBCC4\uB85C \uC801\uC6A9\uB418\uB294 \uCD5C\uC18C \uC774\uACA9\uAC70\uB9AC\uC640 \uAC74\uCD95\uD55C\uACC4\uC120 \uC9C0\uC815 \uC5EC\uBD80\uB97C \uD655\uC778\uD558\uC5EC \uC8FC\uC2DC\uAE30 \uBC14\uB78D\uB2C8\uB2E4. \uD2B9\uD788 \uAC74\uCD95\uBB3C \uC678\uBCBD\uC744 \uB300\uC9C0\uACBD\uACC4\uC120\uC73C\uB85C\uBD80\uD130 1.5m \uC774\uACA9\uD558\uC5EC \uACC4\uD68D\uD560 \uC218 \uC788\uB294\uC9C0, \uCD94\uAC00 \uD6C4\uD1F4\uAC00 \uD544\uC694\uD55C \uAD6C\uAC04\uC774 \uC788\uB2E4\uBA74 \uD574\uB2F9 \uC704\uCE58\xB7\uAC70\uB9AC \uBC0F \uC801\uC6A9 \uADFC\uAC70\uB97C \uC81C\uC2DC\uD558\uC5EC \uC8FC\uC2DC\uAE30 \uBC14\uB78D\uB2C8\uB2E4.`,pl:`Odleg\u0142o\u015Bci budynku i linia zabudowy.

Prosimy okre\u015Bli\u0107 minimalne odleg\u0142o\u015Bci i linie zabudowy dla ka\u017Cdej granicy z drog\u0105 oraz s\u0105siedni\u0105 dzia\u0142k\u0105. W szczeg\xF3lno\u015Bci: czy elewacja mo\u017Ce znajdowa\u0107 si\u0119 1,5 m od granicy? Je\u017Celi wymagane jest wi\u0119ksze odsuni\u0119cie, prosimy poda\u0107 jego lokalizacj\u0119, wymiar i podstaw\u0119.`},answer:{kr:"\uC9C8\uC758\uB2F5\uBCC0 2 \uCC38\uACE0 (16-1\xB716-2\xB716-3 \uBCD1\uD569 \uB2F5\uBCC0)",pl:"Zobacz odpowied\u017A 2. Wsp\xF3lna odpowied\u017A dla pyta\u0144 16-1, 16-2 i 16-3."},topic:"site",slide:5,status:"clarified"},{id:"16-2",page:8,question:{kr:`\uD604\uD669\uCE21\uB7C9\uB3C4\uC0C1 \uACBD\uACC4\uC120\uC758 \uC758\uBBF8

\uC81C\uACF5\uB41C \uD604\uD669\uCE21\uB7C9\uB3C4\uC5D0\uC11C 'A-SITE-LINE-PROP' \uB808\uC774\uC5B4\uC758 \uB178\uB780\uC0C9 \uACBD\uACC4\uC120 \uC911 \uACF5\uC601\uC8FC\uCC28\uC7A5 \uACC4\uD68D\uC758 \uAE30\uC900\uC774 \uB418\uB294 \uB300\uC9C0 \uACBD\uACC4\uC120\uC744 \uBA85\uD655\uD788 \uD655\uC778\uD558\uC5EC \uC8FC\uC2DC\uAE30 \uBC14\uB78D\uB2C8\uB2E4. \uB610\uD55C \uB300\uC0C1\uC9C0 \uC88C\uCE21 \uBC0F \uD558\uCE21\uC758 \uC774\uC911 \uB178\uB780\uC120 \uC0AC\uC774 \uAD6C\uC5ED\uC774 \uB3C4\uB85C \uB4F1 \uBCC4\uB3C4\uC758 \uB3C4\uC2DC\uACC4\uD68D\uC2DC\uC124 \uBD80\uC9C0\uC778\uC9C0, \uACF5\uBAA8 \uB300\uC0C1 \uB300\uC9C0\uC5D0 \uD3EC\uD568\uB418\uB294\uC9C0 \uD655\uC778\uD558\uC5EC \uC8FC\uC2DC\uAE30 \uBC14\uB78D\uB2C8\uB2E4.`,pl:`Znaczenie linii granicznych na pomiarze geodezyjnym.

Prosimy jednoznacznie wskaza\u0107 granic\u0119 dzia\u0142ki, wed\u0142ug kt\xF3rej nale\u017Cy projektowa\u0107 parking, spo\u015Br\xF3d \u017C\xF3\u0142tych linii na warstwie A-SITE-LINE-PROP udost\u0119pnionego pomiaru. Czy pas mi\u0119dzy podw\xF3jnymi \u017C\xF3\u0142tymi liniami po lewej i dolnej stronie terenu jest terenem drogi lub innego obiektu infrastruktury planistycznej, czy nale\u017Cy do terenu konkursu?`},answer:{kr:"\uC9C8\uC758\uB2F5\uBCC0 2 \uCC38\uACE0 (16-1\xB716-2\xB716-3 \uBCD1\uD569 \uB2F5\uBCC0)",pl:"Zobacz odpowied\u017A 2. Wsp\xF3lna odpowied\u017A dla pyta\u0144 16-1, 16-2 i 16-3."},topic:"site",slide:5,status:"clarified"},{id:"16-3",page:8,question:{kr:`\uAD00\uB828 \uB3C4\uBA74 \uC81C\uACF5

\uC704 \uC0AC\uD56D\uC744 \uD655\uC778\uD560 \uC218 \uC788\uB294 \uD68D\uC9C02\uC758 \uB3C4\uC2DC\uACC4\uD68D\uC2DC\uC124 \uACB0\uC815\uC120, \uAC74\uCD95\uD55C\uACC4\uC120 \uBC0F \uD6C4\uD1F4 \uCE58\uC218\uAC00 \uD45C\uC2DC\uB41C \uACB0\uC815\uB3C4\uBA74\uACFC \uAD00\uB828 \uC2DC\uD589\uC9C0\uCE68\uC758 \uC81C\uACF5 \uC704\uCE58\uB97C \uC548\uB0B4\uD558\uC5EC \uC8FC\uC2DC\uAE30 \uBC14\uB78D\uB2C8\uB2E4. \uD574\uB2F9 \uC790\uB8CC\uAC00 \uB204\uB77D\uB41C \uACBD\uC6B0 \uCD94\uAC00 \uC81C\uACF5\uC744 \uC694\uCCAD\uB4DC\uB9BD\uB2C8\uB2E4.`,pl:`Udost\u0119pnienie odpowiednich rysunk\xF3w.

Prosimy wskaza\u0107, gdzie udost\u0119pniono rysunek decyzji z granic\u0105 obiektu infrastruktury planistycznej dzia\u0142ki 2, liniami zabudowy i wymiarami odsuni\u0119\u0107 oraz odpowiednie wytyczne wykonawcze. Je\u015Bli materia\u0142\xF3w brakuje, prosimy je uzupe\u0142ni\u0107.`},answer:{kr:"\uC9C8\uC758\uB2F5\uBCC0 2 \uCC38\uACE0 (16-1\xB716-2\xB716-3 \uBCD1\uD569 \uB2F5\uBCC0)",pl:"Zobacz odpowied\u017A 2. Wsp\xF3lna odpowied\u017A dla pyta\u0144 16-1, 16-2 i 16-3."},topic:"site",slide:5,status:"clarified"},{id:"16-4",page:8,question:{kr:`\uC124\uACC4\uB3C4\uD310\uC758 \uB80C\uB354\uB9C1 \uBC0F \uD3EC\uD1A0\uC0F5 \uB9AC\uD130\uCE6D \uD5C8\uC6A9 \uBC94\uC704

\uC9C0\uCE68\uC11C\uC5D0\uC11C\uB294 "3\uCC28\uC6D0 \uC774\uBBF8\uC9C0\uC758 \uC0C9\uC0C1, \uB80C\uB354\uB9C1 \uBC0F \uC774\uBBF8\uC9C0 \uD3B8\uC9D1 \uD45C\uD604\uC740 \uC790\uC720\uB85C \uD558\uB418 \uCC38\uAC00\uC790\uAC00 \uC9C1\uC811 \uC0DD\uC0B0\uD55C \uC790\uB8CC\uB9CC \uC0AC\uC6A9\uD55C\uB2E4"\uACE0 \uBA85\uC2DC\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uC774\uC5D0 \uB530\uB77C \uCC38\uAC00\uC790\uAC00 \uC9C1\uC811 \uC81C\uC791\uD55C 3\uCC28\uC6D0 \uBAA8\uB378\uC744 \uC774\uC6A9\uD55C \uCEEC\uB7EC \uB80C\uB354\uB9C1\uACFC \uD3EC\uD1A0\uC0F5\uC744 \uD1B5\uD55C \uC7AC\uC9C8\xB7\uC870\uBA85\xB7\uC0C9\uAC10 \uB4F1\uC758 \uB9AC\uD130\uCE6D\uC744 \uC124\uACC4\uB3C4\uD310\uC5D0 \uC801\uC6A9\uD558\uB294 \uAC83\uC774 \uD5C8\uC6A9\uB418\uBA70, \uBCC4\uB3C4\uC758 \uAC10\uC810 \uB610\uB294 \uC2EC\uC0AC\uC0C1 \uBD88\uC774\uC775 \uB300\uC0C1\uC5D0 \uD574\uB2F9\uD558\uC9C0 \uC54A\uB294\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4.`,pl:`Dopuszczalny rendering i retusz w Photoshopie na planszach.

Wytyczne pozwalaj\u0105 swobodnie stosowa\u0107 kolor, rendering i edycj\u0119 obraz\xF3w 3D, o ile uczestnik sam wytworzy\u0142 materia\u0142y. Czy kolorowy rendering w\u0142asnego modelu 3D oraz retusz materia\u0142\xF3w, \u015Bwiat\u0142a i kolorystyki w Photoshopie s\u0105 zatem dozwolone bez odj\u0119cia punkt\xF3w lub innych niekorzystnych skutk\xF3w w ocenie?`},answer:{kr:"\uBCC4\uB3C4\uC758 \uAC10\uC810, \uC2EC\uC0AC\uC0C1 \uBD88\uC774\uC775 \uC5C6\uC74C (\uB2E8, \uCC38\uAC00\uC790\uAC00 \uC9C1\uC811 \uC0DD\uC0B0\uD55C \uC790\uB8CC\uB9CC \uC0AC\uC6A9)",pl:"Nie przewiduje si\u0119 odj\u0119cia punkt\xF3w ani innego pogorszenia oceny, pod warunkiem u\u017Cycia wy\u0142\u0105cznie materia\u0142\xF3w wytworzonych przez uczestnika."},topic:"overview",slide:14,status:"allowed"},{id:"16-5",page:8,question:{kr:`\uC9C0\uD558\uCE35 \uADDC\uBAA8 \uC870\uC815 \uAC00\uB2A5 \uC5EC\uBD80

\uC9C0\uCE68\uC11C\uC5D0 \uAC74\uCD95 \uADDC\uBAA8\uB294 '\uC9C0\uD558 4\uCE35\xB7\uC9C0\uC0C1 10\uCE35 \uB0B4\uC678'\uB85C \uC81C\uC2DC\uB418\uC5B4 \uC788\uC73C\uBA70, \uCE35\uC218\xB7\uB192\uC774\xB7\uC5F0\uBA74\uC801 \uD5C8\uC6A9\uBC94\uC704 \uB0B4\uC5D0\uC11C \uC124\uACC4\uC790\uAC00 \uD569\uB9AC\uC801\uC73C\uB85C \uC81C\uC548\uD558\uB3C4\uB85D \uBA85\uC2DC\uB418\uC5B4 \uC788\uC2B5\uB2C8\uB2E4. \uC8FC\uCC28\uB300\uC218 390\uB300 \uC774\uC0C1, \uD544\uC218\uC2DC\uC124 \uBC0F \uBA74\uC801 \uAE30\uC900, \uC5F0\uBA74\uC801\xB7\uAC74\uD3D0\uC728\xB7\uC6A9\uC801\uB960\xB7\uB192\uC774 \uC81C\uD55C, \uC0AC\uC5C5\uBE44 \uB4F1 \uC81C\uBC18 \uC870\uAC74\uC744 \uBAA8\uB450 \uCDA9\uC871\uD558\uB294 \uACBD\uC6B0, \uC9C0\uD558\uCE35\uC744 \uC9C0\uD558 2\uCE35\uC73C\uB85C \uC870\uC815\uD574 \uACC4\uD68D\uD560 \uC218 \uC788\uB294\uC9C0 \uC9C8\uC758\uB4DC\uB9BD\uB2C8\uB2E4. \uC544\uC6B8\uB7EC '\uC9C0\uD558 4\uCE35 \uAD74\uCC29' \uAD00\uB828 \uC9C0\uCE68\uC774 \uC9C0\uD558 4\uAC1C \uCE35\uC758 \uC124\uCE58\uB97C \uC758\uBB34\uD654\uD558\uB294 \uC870\uAC74\uC778\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4.`,pl:`Mo\u017Cliwo\u015B\u0107 zmiany skali kondygnacji podziemnych.

Wytyczne wskazuj\u0105 oko\u0142o czterech kondygnacji podziemnych i dziesi\u0119ciu nadziemnych oraz racjonaln\u0105 propozycj\u0119 projektanta w granicach liczby kondygnacji, wysoko\u015Bci i powierzchni. Czy przy spe\u0142nieniu minimum 390 miejsc, funkcji obowi\u0105zkowych i ich powierzchni, limit\xF3w powierzchni ca\u0142kowitej, zabudowy, intensywno\u015Bci, wysoko\u015Bci i bud\u017Cetu mo\u017Cna zaprojektowa\u0107 dwie kondygnacje podziemne? Czy zapis o wykopie na cztery kondygnacje oznacza obowi\u0105zek wykonania czterech kondygnacji podziemnych?`},answer:{kr:"\uC9C0\uC0C1 \uBC0F \uC9C0\uD558 \uCE35\uC218\uB97C \uC81C\uD55C\uD558\uC9C0 \uC54A\uC73C\uBA70 \uC81C\uACF5\uB41C \uC778\uC811\uBD80\uC9C0 \uC9C0\uBC18\uC870\uC0AC\uBCF4\uACE0\uC11C, \uC608\uC815\uACF5\uC0AC\uBE44 \uB4F1\uC744 \uACE0\uB824\uD558\uC5EC \uC124\uACC4\uC790\uAC00 \uD569\uB9AC\uC801\uC73C\uB85C \uC81C\uC548",pl:"Nie ogranicza si\u0119 liczby kondygnacji nadziemnych ani podziemnych. Projektant powinien racjonalnie zaproponowa\u0107 ich liczb\u0119, uwzgl\u0119dniaj\u0105c udost\u0119pnione badania geotechniczne terenu s\u0105siedniego i planowany koszt budowy."},topic:"envelope",slide:1,status:"allowed"},{id:"17-1",page:9,question:{kr:"\uC9C0\uAD6C\uB2E8\uC704\uACC4\uD68D\uC0C1 \uD68D\uC9C02 \uB0A8\uCE21(\uC18C\uB85C3-64\uBCC0) \uBCBD\uBA74\uD55C\uACC4\uC120 3m\uC758 \uD544\uB85C\uD2F0 \uAD6C\uAC04\uC5D0 \uAE30\uB465\uACFC \uCC28\uB7C9 \uCD9C\uC785\uAD6C\uB97C \uB458 \uC218 \uC788\uB294\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Czy w strefie pilotis przy po\u0142udniowej granicy dzia\u0142ki 2, od drogi 3-64, odsuni\u0119tej lini\u0105 elewacji 3 m, mo\u017Cna umieszcza\u0107 s\u0142upy i wjazdy pojazd\xF3w?"},answer:{kr:"\uC9C8\uC758\uB2F5\uBCC0 2, 13 \uCC38\uACE0 (17-1\xB717-2 \uBCD1\uD569 \uB2F5\uBCC0)",pl:"Zobacz odpowiedzi 2 i 13. Wsp\xF3lna odpowied\u017A dla pyta\u0144 17-1 i 17-2."},topic:"site",slide:5,status:"clarified"},{id:"17-2",page:9,question:{kr:"\uC9C0\uAD6C\uB2E8\uC704\uACC4\uD68D \uAE30\uD0C0\uC0AC\uD56D\uC758 '\uD55C\uAC15\uB85C2\uAC00 14-18 \uCC28\uB7C9 \uD68C\uCC28\uACF5\uAC04 \uD655\uBCF4' \uBC0F '14-18\uACFC \uC5F0\uC811\uD55C \uACF5\uAC1C\uACF5\uC9C0 \uD1B5\uD569\uC870\uC131'\uC774 \uBCF8 \uACF5\uBAA8 \uC124\uACC4 \uBC94\uC704\uC5D0 \uD3EC\uD568\uB418\uB294\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Czy zapisy planu szczeg\xF3\u0142owego dotycz\u0105ce zapewnienia miejsca do zawracania pojazd\xF3w przy Hangang-ro 2-ga 14-18 oraz zintegrowania przyleg\u0142ej og\xF3lnodost\u0119pnej przestrzeni otwartej z terenem 14-18 nale\u017C\u0105 do zakresu tego konkursu?"},answer:{kr:"\uC9C8\uC758\uB2F5\uBCC0 2, 13 \uCC38\uACE0 (17-1\xB717-2 \uBCD1\uD569 \uB2F5\uBCC0)",pl:"Zobacz odpowiedzi 2 i 13. Wsp\xF3lna odpowied\u017A dla pyta\u0144 17-1 i 17-2."},topic:"site",slide:5,status:"clarified"},{id:"17-3",page:9,question:{kr:"\uC790\uC804\uAC70 \uC8FC\uCC28\uC7A5\uC744 \uB530\uB989\uC774 \uAC70\uC810\uC13C\uD130 \uBCF4\uAD00\uC18C(435\u33A1)\uC640 \uBCC4\uB3C4\uB85C \uC0B0\uC815\uD558\uB294\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Czy powierzchni\u0119 parkingu rowerowego nale\u017Cy liczy\u0107 osobno od magazynu centrum Ddareungi o powierzchni 435 m\xB2?"},answer:{kr:"\uBCC4\uB3C4 \uC0B0\uC815",pl:"Nale\u017Cy liczy\u0107 j\u0105 osobno."},topic:"program",slide:4,status:"requirement"},{id:"17-4",page:9,question:{kr:"\uC9C0\uCE68 1.4\uC758 \uACF5\uC0AC\uBE44(50,411,760\uCC9C \uC6D0)\uC5D0 \uAE30\uC874 \uC8FC\uCC28\uC7A5 \uCCA0\uAC70\uC640 \uD759\uB9C9\uC774 \uACF5\uC0AC\uAC00 \uD3EC\uD568\uB418\uB294\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Czy koszt budowy 50 411 760 tys. KRW wskazany w punkcie 1.4 wytycznych obejmuje rozbi\xF3rk\u0119 istniej\u0105cego parkingu i zabezpieczenie wykopu?"},answer:{kr:"\uAE30\uC874 \uC8FC\uCC28\uC7A5 \uCCA0\uAC70 \uC81C\uC678, \uD759\uB9C9\uC774 \uACF5\uC0AC \uD3EC\uD568",pl:"Rozbi\xF3rka istniej\u0105cego parkingu jest wy\u0142\u0105czona; zabezpieczenie wykopu jest uwzgl\u0119dnione."},topic:"budget",slide:8,status:"clarified"},{id:"17-5",page:9,question:{kr:"\uD68D\uC9C01\uACFC \uC9C0\uD558\uB85C \uC5F0\uACB0\uD558\uB294 \uACC4\uD68D\uC774 \uC804\uC81C\uC778\uC9C0 \uD655\uC778 \uBD80\uD0C1\uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Czy projekt zak\u0142ada podziemne po\u0142\u0105czenie z dzia\u0142k\u0105 1?"},answer:{kr:"\uC9C0\uD558 \uC5F0\uACB0 \uACE0\uB824\uD558\uC9C0 \uC54A\uC74C",pl:"Nie nale\u017Cy zak\u0142ada\u0107 po\u0142\u0105czenia podziemnego."},topic:"site",slide:5,status:"clarified"},{id:"18",page:9,question:{kr:"\uD604\uC7AC \uD2B9\uBCC4\uACC4\uD68D\uAD6C\uC5ED8\uC5D0 \uB300\uD55C \uC81C\uACF5\uC790\uB8CC\uB294 [\uC2A4\uCF00\uCE58\uC5C5\uBAA8\uB378\uB9C1+\uC0AC\uC774\uD2B8]\uB9CC \uC81C\uACF5\uB418\uC5B4 \uC788\uB294\uB370, \uC704 \uC790\uB8CC\uB85C\uB294 \uC8FC\uBCC0\uC5EC\uAC74\uC774 \uC5B4\uB5BB\uAC8C \uBCC0\uD654\uB418\uB294\uC9C0 \uC54C \uC218 \uC788\uB294 \uD55C\uACC4\uAC00 \uC788\uC2B5\uB2C8\uB2E4. \uACC4\uD68D\uC2DC \uBCC0\uD654\uB41C \uC8FC\uBCC0\uD658\uACBD\uC5D0 \uB300\uC751\uD558\uB294 \uC815\uD655\uD55C \uACC4\uD68D\uC774 \uD544\uC694\uD558\uB2E4\uACE0 \uC0AC\uB8CC\uB429\uB2C8\uB2E4. \uAC00\uB2A5\uD558\uB2E4\uBA74 cad\uD30C\uC77C\uB4F1\uC73C\uB85C \uC8FC\uBCC0\uC5D0 \uB4E4\uC5B4\uC11C\uB294 \uC2DC\uC124\uB4E4\uACFC \uACF5\uAC1C\uACF5\uC9C0\uC5D0 \uB300\uD55C \uBC30\uCE58\uB3C4\uB4F1\uC744 \uC81C\uACF5\uD574\uC8FC\uC2E4 \uC218 \uC788\uB294\uC9C0 \uC9C8\uC758\uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Dla specjalnego obszaru planistycznego 8 udost\u0119pniono obecnie tylko model SketchUp i teren, co utrudnia zrozumienie przysz\u0142ych zmian otoczenia. Do dok\u0142adnego projektu odpowiadaj\u0105cego na zmienione warunki potrzebne s\u0105 dodatkowe dane. Czy mo\u017Cna udost\u0119pni\u0107 np. rysunki CAD pokazuj\u0105ce uk\u0142ad przysz\u0142ych obiekt\xF3w i og\xF3lnodost\u0119pnych przestrzeni otwartych w otoczeniu?"},answer:{kr:"\uC9C8\uC758\uB2F5\uBCC0 3-1 \uCC38\uACE0",pl:"Zobacz odpowied\u017A 3-1."},topic:"site",slide:5,status:"clarified"},{id:"19-1",page:9,question:{kr:"\uB300\uC0C1\uC9C0 \uC11C\uCE21\uC5D0 \uC811\uD558\uB294 \uC18C\uB85C3-64(\uACC4\uD68D \uD3ED 6m)\uC758 \uD655\uC815 \uD3ED\uC6D0\uACFC \uAC1C\uD1B5(\uC900\uACF5) \uC608\uC815 \uC2DC\uAE30\uB97C \uC9C8\uC758\uB4DC\uB9BD\uB2C8\uB2E4. \uC544\uC6B8\uB7EC \uBCF8 \uC2DC\uC124 \uC900\uACF5 \uC2DC\uC810\uC5D0 \uC18C\uB85C3-64\uAC00 \uAC1C\uD1B5\uB418\uC9C0 \uC54A\uC558\uAC70\uB098 \uD3ED\uC6D0\uC774 6m\uC5D0 \uBBF8\uCE58\uC9C0 \uBABB\uD558\uB294 \uACBD\uC6B0, \uC774 \uB3C4\uB85C \uCABD\uC5D0 \uCC28\uB7C9 \uCD9C\uC785\uAD6C\uB97C \uACC4\uD68D\uD560 \uC218 \uC788\uB294\uC9C0 \uC9C8\uC758\uB4DC\uB9BD\uB2C8\uB2E4.",pl:"Prosimy poda\u0107 ostateczn\u0105 szeroko\u015B\u0107 i planowany termin otwarcia lub uko\u0144czenia drogi 3-64 po zachodniej stronie terenu, projektowanej na 6 m. Czy je\u015Bli w chwili oddania obiektu droga nie b\u0119dzie otwarta albo b\u0119dzie w\u0119\u017Csza ni\u017C 6 m, mo\u017Cna zaprojektowa\u0107 wjazd od jej strony?"},answer:{kr:"\uACC4\uD68D \uAC00\uB2A5(\uC81C\uACF5\uB41C \uB3C4\uC2DC\uACC4\uD68D \uACB0\uC815\uC120\uC744 \uB530\uB77C \uB3C4\uB85C \uC870\uC131 \uC804\uC81C\uB85C \uACC4\uD68D)",pl:"Mo\u017Cna projektowa\u0107 takie rozwi\u0105zanie, przyjmuj\u0105c wykonanie drogi zgodnie z udost\u0119pnion\u0105 lini\u0105 decyzji planistycznej."},topic:"access",slide:3,status:"allowed"},{id:"19-2",page:9,question:{kr:'\uC9C0\uCE68 1.4\uB294 \uC9C0\uC5ED\uC9C0\uAD6C\uB97C "\uC77C\uBC18\uC0C1\uC5C5\uC9C0\uC5ED"\uC73C\uB85C \uD45C\uAE30\uD558\uACE0 \uC788\uC73C\uB098, \uC138\uBD80\uAC1C\uBC1C\uACC4\uD68D \uACB0\uC815 \uACE0\uC2DC\uB294 \uD68D\uC9C02\uC5D0 "\uC81C2\uC885 \uBC0F \uC81C3\uC885 \uC77C\uBC18\uC8FC\uAC70\uC9C0\uC5ED, \uC77C\uBC18\uC0C1\uC5C5\uC9C0\uC5ED \uAC00\uC911\uD3C9\uADE0\uC6A9\uC801\uB960"\uC744 \uC801\uC6A9\uD558\uB3C4\uB85D \uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uD68D\uC9C02\uC758 \uC6A9\uB3C4\uC9C0\uC5ED\uBCC4 \uBA74\uC801\uC744 \uC54C\uB824 \uC8FC\uC2DC\uACE0, \uB300\uC9C0 \uC77C\uBD80\uAC00 \uC77C\uBC18\uC8FC\uAC70\uC9C0\uC5ED\uC778 \uACBD\uC6B0 \uC815\uBD81\uBC29\uD5A5 \uC77C\uC870 \uD655\uBCF4\uB97C \uC704\uD55C \uB192\uC774 \uC81C\uD55C\uC774 \uC801\uC6A9\uB418\uB294\uC9C0 \uC9C8\uC758\uB4DC\uB9BD\uB2C8\uB2E4.',pl:"Punkt 1.4 wytycznych opisuje teren jako og\xF3ln\u0105 stref\u0119 handlow\u0105, lecz obwieszczenie decyzji planu szczeg\xF3\u0142owego stosuje do dzia\u0142ki 2 \u015Bredni\u0105 wa\u017Con\u0105 intensywno\u015B\u0107 zabudowy dla stref og\xF3lnomieszkaniowych kategorii II i III oraz og\xF3lnej strefy handlowej. Prosimy poda\u0107 powierzchni\u0119 ka\u017Cdej strefy i wyja\u015Bni\u0107, czy przy cz\u0119\u015Bciowym po\u0142o\u017Ceniu w strefie mieszkaniowej obowi\u0105zuje ograniczenie wysoko\u015Bci dla ochrony nas\u0142onecznienia od p\xF3\u0142nocy."},answer:{kr:"\uC9C8\uC758\uB2F5\uBCC0 11-1, 11-2 \uCC38\uACE0",pl:"Zobacz odpowiedzi 11-1 i 11-2."},topic:"envelope",slide:1,status:"clarified"}],zy=[{term:{kr:"\uC6A9\uC801\uB960",pl:"Intensywno\u015B\u0107 zabudowy (FAR)"},definition:{kr:"\uC6A9\uC801\uB960 \uC0B0\uC815\uC5D0 \uD3EC\uD568\uB418\uB294 \uC5F0\uBA74\uC801\uC744 \uB300\uC9C0\uBA74\uC801\uC73C\uB85C \uB098\uB208 \uBE44\uC728\uC785\uB2C8\uB2E4. \uC9C0\uD558\uB97C \uD3EC\uD568\uD55C \uCD1D\uC5F0\uBA74\uC801\uACFC \uB2E4\uB985\uB2C8\uB2E4.",pl:"Stosunek powierzchni kondygnacji wliczanej do FAR do powierzchni dzia\u0142ki. To inna wielko\u015B\u0107 ni\u017C powierzchnia ca\u0142kowita obejmuj\u0105ca kondygnacje podziemne."}},{term:{kr:"\uAC74\uD3D0\uC728",pl:"Udzia\u0142 powierzchni zabudowy"},definition:{kr:"\uAC74\uCD95\uBA74\uC801\uC744 \uB300\uC9C0\uBA74\uC801\uC73C\uB85C \uB098\uB208 \uBE44\uC728\uC785\uB2C8\uB2E4. \uC0B0\uC220 \uC0C1\uD55C\uC774 \uC2E4\uC81C \uBC30\uCE58 \uAC00\uB2A5\uD55C \uC678\uACFD\uC744 \uBCF4\uC7A5\uD558\uC9C0\uB294 \uC54A\uC2B5\uB2C8\uB2E4.",pl:"Stosunek powierzchni zabudowy do powierzchni dzia\u0142ki. Maksimum arytmetyczne nie gwarantuje, \u017Ce taki obrys zmie\u015Bci si\u0119 przy wymaganych odsuni\u0119ciach."}},{term:{kr:"\uC720\uD6A8\uB192\uC774",pl:"Wysoko\u015B\u0107 w \u015Bwietle"},definition:{kr:"\uBCF4\uC640 \uC124\uBE44 \uB4F1 \uC7A5\uC560\uBB3C \uC544\uB798\uC5D0\uC11C \uC2E4\uC81C\uB85C \uD655\uBCF4\uB418\uB294 \uB192\uC774\uC785\uB2C8\uB2E4.",pl:"Rzeczywi\u015Bcie dost\u0119pna wysoko\u015B\u0107 pod belkami, instalacjami i innymi przeszkodami."}},{term:{kr:"\uCE35\uACE0",pl:"Wysoko\u015B\u0107 kondygnacji"},definition:{kr:"\uD55C \uCE35\uC758 \uBC14\uB2E5\uC5D0\uC11C \uB2E4\uC74C \uCE35\uC758 \uBC14\uB2E5\uAE4C\uC9C0\uC758 \uB192\uC774\uC785\uB2C8\uB2E4. \uC720\uD6A8\uB192\uC774\uC640 \uAC19\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.",pl:"Odleg\u0142o\u015B\u0107 od poziomu pod\u0142ogi jednej kondygnacji do poziomu pod\u0142ogi nast\u0119pnej. Nie jest to wysoko\u015B\u0107 w \u015Bwietle."}},{term:{kr:"\uD544\uC218\uC870\uAC74",pl:"Wym\xF3g obowi\u0105zkowy"},definition:{kr:"\uACC4\uD68D\uC774 \uBC18\uB4DC\uC2DC \uCDA9\uC871\uD574\uC57C \uD558\uB294 \uC870\uAC74\uC785\uB2C8\uB2E4. \uB2E4\uB978 \uC7A5\uC810\uC774\uB098 \uCD94\uAC00 \uD504\uB85C\uADF8\uB7A8\uC73C\uB85C \uB300\uC2E0\uD560 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4.",pl:"Warunek, kt\xF3ry projekt musi spe\u0142ni\u0107. Nie mo\u017Cna go zast\u0105pi\u0107 inn\u0105 zalet\u0105 ani dodatkow\u0105 funkcj\u0105."}},{term:{kr:"\uAD8C\uC7A5",pl:"Zalecenie"},definition:{kr:"\uACF5\uC2DD \uC790\uB8CC\uAC00 \uAD8C\uD558\uB294 \uBC29\uD5A5\uC785\uB2C8\uB2E4. \uC758\uBB34\uB098 \uC784\uC758\uC758 \uACE0\uC815\uAC12\uC73C\uB85C \uBC14\uAFB8\uC5B4 \uC77D\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.",pl:"Kierunek zalecany w oficjalnych materia\u0142ach. Nie nale\u017Cy zamienia\u0107 go w obowi\u0105zek ani arbitralnie ustalon\u0105 warto\u015B\u0107."}},{term:{kr:"\uAC00\uBCC0\uC131",pl:"Elastyczno\u015B\u0107 przestrzeni"},definition:{kr:"\uC8FC\uCC28\uC7A5\uACFC \uBD80\uC18D \uC5C5\uBB34\uC2DC\uC124 \uAC04 \uBA74\uC801, \uC8FC\uCC28\uAD6C\uD68D \uD06C\uAE30\uC640 \uBC30\uCE58\uAE30\uC900 \uB4F1\uC758 \uBCC0\uB3D9\uC5D0 \uB300\uC751\uD558\uB294 \uB2A5\uB825\uC785\uB2C8\uB2E4. \uD2B9\uC815 \uC0C1\uC5C5\uC6A9\uB3C4\uB85C\uC758 \uC804\uD658 \uD5C8\uAC00\uB294 \uC544\uB2D9\uB2C8\uB2E4.",pl:"Zdolno\u015B\u0107 przyjmowania zmian powierzchni parkingu i funkcji towarzysz\u0105cych, wymiar\xF3w miejsc i zasad ich uk\u0142adu. Nie oznacza zgody na konkretn\u0105 zmian\u0119 funkcji komercyjnej."}},{term:{kr:"\uC5EC\uC720 \uBA74\uC801",pl:"Dost\u0119pna nadwy\u017Cka powierzchni"},definition:{kr:"\uD544\uC218 \uC8FC\uCC28\xB7\uC6B4\uC601\uC2DC\uC124\uACFC \uBA74\uC801\xB7\uB192\uC774\xB7\uC608\uC0B0 \uC870\uAC74\uC744 \uCDA9\uC871\uD55C \uB4A4 \uAD00\uB828 \uD504\uB85C\uADF8\uB7A8\uC744 \uAC80\uD1A0\uD560 \uC218 \uC788\uB294 \uBA74\uC801\uC785\uB2C8\uB2E4. \uC218\uCE58\uB098 \uC2E4\uC81C \uD655\uBCF4 \uC5EC\uBD80\uB294 \uC124\uACC4\uB85C \uD655\uC778\uD574\uC57C \uD569\uB2C8\uB2E4.",pl:"Powierzchnia, w kt\xF3rej mo\u017Cna rozwa\u017Cy\u0107 powi\u0105zane funkcje po spe\u0142nieniu wymog\xF3w parkingu, zaplecza, powierzchni, wysoko\u015Bci i bud\u017Cetu. Jej wielko\u015B\u0107 i faktyczna dost\u0119pno\u015B\u0107 wymagaj\u0105 sprawdzenia w projekcie."}}];var z=xe(Qi(),1),g=(a,e)=>({kr:a,pl:e}),ry=[g("\uAC74\uBB3C\uACFC \uC870\uAC74","Budynek i warunki"),g("\uBCC0\uD654\uC640 \uAC00\uB2A5\uC131","Zmiana i mo\u017Cliwo\u015Bci"),g("\uD3C9\uAC00\uC640 \uB2E4\uC74C \uD310\uB2E8","Ocena i dalsze decyzje")],vu=[{title:g("\uD558\uB098\uC758 \uACF5\uACF5\uAC74\uCD95, \uB450 \uAC00\uC9C0 \uAE30\uBCF8 \uAE30\uB2A5","Jeden budynek publiczny, dwie podstawowe funkcje"),question:g("\uBB34\uC5C7\uC744 \uB9CC\uB4DC\uB294 \uACF5\uBAA8\uC778\uAC00?","Co projektujemy?"),takeaway:g("390\uB300 \uC774\uC0C1\uC758 \uACF5\uC601\uC8FC\uCC28\uC7A5\uACFC \uC6B4\uC601\xB7\uC9C0\uC6D0 \uC5C5\uBB34\uC2DC\uC124\uC744 \uD568\uAED8 \uC124\uACC4\uD569\uB2C8\uB2E4.","Projektujemy parking publiczny na co najmniej 390 samochod\xF3w wraz z zap pi\u0119ter, organizacji wjazdu i korekcie powierzchni. Ograniczenia dotycz\u0105 mostu i parkingu mechanicznego."),detail:[g("\uC9C4\uCD9C\uC785 \uD1B5\uD569\xB7\uBD84\uB9AC \uBAA8\uB450 \uAC00\uB2A5, \uC9C0\uC0C1\xB7\uC9C0\uD558 \uCE35\uC218\uB294 \uACE0\uC815\uD558\uC9C0 \uC54A\uC74C, \uC2DC\uC124 \uAC04 \xB110% \uBC94\uC704\uAC00 \uBA85\uD655\uD574\uC84C\uC2B5\uB2C8\uB2E4.","Dopuszczono wsp\xF3lny lub rozdzielony wjazd i wyjazd, potwierdzono brak sta\u0142ej liczby kondygnacji oraz wyja\u015Bniono tolerancj\u0119 \xB110% mi\u0119dzy funkcjami."),g("\uC2DC\uBBFC\uC548\uB0B4\uC13C\uD130\xB7\uC790\uC804\uAC70\uC8FC\uCC28\uC7A51\uCE35\uC740 \uC720\uC9C0\uD569\uB2C8\uB2E4. \uC0C1\uCE35 \uBE0C\uB9AC\uC9C0\uC640 \uAE30\uACC4\uC2DD\uC8FC\uCC28 \uD63C\uC6A9\uC740 \uBD88\uAC00\uD569\uB2C8\uB2E4.","Informacja miejska i parking rowerowy pozostaj\u0105 na parterze. G\xF3rny most i mieszany parking mechaniczny s\u0105 niedopuszczalne."),g("\uACF5\uC2DD \uB2F5\uBCC0\uC740 \uADDC\uC815\xB7\uC9C0\uCE68\uC758 \uCD94\uAC00 \uB610\uB294 \uC218\uC815\uC785\uB2C8\uB2E4. \uC804\uCCB470\uBB38\uD56D\uC5D0\uC11C \uC138\uBD80 \uC870\uAC74\uC744 \uD655\uC778\uD569\uB2C8\uB2E4.","Oficjalne odpowiedzi uzupe\u0142niaj\u0105 lub zmieniaj\u0105 regulamin. Wszystkie szczeg\xF3\u0142y s\u0105 dost\u0119pne w zbiorze 70 pyta\u0144.")],kind:9,tag:"official",section:1},{title:g("\uBBF8\uB798\uB97C \uACE0\uB824\uD558\uB418, \uBBF8\uB798 \uC6A9\uB3C4\uB97C \uB2E8\uC815\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4","Uwzgl\u0119dniamy przysz\u0142o\u015B\u0107, nie przes\u0105dzaj\u0105c funkcji"),question:g("\uBBF8\uB798 \uC6A9\uB3C4 \uC804\uD658\uC740 \uBC18\uB4DC\uC2DC \uD544\uC694\uD55C\uAC00?","Czy zmiana funkcji w przysz\u0142o\u015Bci jest obowi\u0105zkowa?"),takeaway:g("\uBCC0\uD654\uC5D0 \uB300\uC751\uD560 \uAC00\uBCC0\uC131\uC740 \uACE0\uB824\uD574\uC57C \uD569\uB2C8\uB2E4. \uC804\uBA74 \uC0AC\uBB34\uC2E4 \uC804\uD658\uC740 \uC9C0\uC815\uB41C \uD544\uC218 \uD574\uBC95\uC774 \uC544\uB2D9\uB2C8\uB2E4.","Elastyczno\u015B\u0107 wobec zmian jest wymagana do rozwa\u017Cenia. Ca\u0142kowita zmiana na biura nie jest narzuconym rozwi\u0105zaniem."),detail:[g("\uACF5\uC2DD \uB2F5\uBCC0\uC758 \uBC94\uC704\uB294 \uC8FC\uCC28\uC7A5\xB7\uBD80\uC18D \uC5C5\uBB34\uC2DC\uC124 \uAC04 \uBA74\uC801, \uC8FC\uCC28\uAD6C\uD68D \uD06C\uAE30\uC640 \uBC30\uCE58\uAE30\uC900\uC758 \uBCC0\uB3D9 \uAC00\uB2A5\uC131\uC785\uB2C8\uB2E4.","Oficjalna odpowied\u017A wskazuje na zmiany powierzchni parkingu i zaplecza oraz wymiar\xF3w i uk\u0142adu miejsc postojowych."),g("\uC218\uD3C9 \uBC14\uB2E5\xB7\uBD84\uB9AC \uB7A8\uD504\xB7\uC5EC\uC720 \uCE35\uACE0\uB294 \uAC00\uB2A5\uD55C \uC218\uB2E8\uC785\uB2C8\uB2E4. \uC9C0\uCE68\uC774 \uC9C0\uC815\uD55C \uC720\uC77C\uD55C \uD615\uD0DC\uB294 \uC544\uB2D9\uB2C8\uB2E4.","P\u0142askie stropy, oddzielne rampy i wi\u0119ksza wysoko\u015B\u0107 mog\u0105 by\u0107 \u015Brodkami projektowymi. Nie s\u0105 jedyn\u0105 form\u0105 wskazan\u0105 w konkursie."),g("\uD604\uC7AC \uC8FC\uCC28 \uAE30\uB2A5\uACFC \uC608\uC0B0\uC744 \uB9CC\uC871\uD558\uBA74\uC11C \uC5B4\uB5A4 \uBCC0\uD654\uAE4C\uC9C0 \uC218\uC6A9\uD560 \uC218 \uC788\uB294\uC9C0 \uBCF4\uC5EC\uC90D\uB2C8\uB2E4.","Pokazujemy zakres mo\u017Cliwych zmian, zachowuj\u0105c dzisiejsz\u0105 funkcj\u0119 parkingu i bud\u017Cet.")],kind:10,tag:"official",section:1},{title:g("\uC5EC\uC720 \uBA74\uC801\uC5D0\uB294 \uAD00\uB828 \uD504\uB85C\uADF8\uB7A8\uC744 \uC81C\uC548\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4","W wolnej powierzchni mo\u017Cna proponowa\u0107 funkcje powi\u0105zane"),question:g("\uC0C8\uB85C\uC6B4 \uD504\uB85C\uADF8\uB7A8\uC744 \uB123\uC5B4\uB3C4 \uB418\uB098?","Czy mo\u017Cna doda\u0107 nowy program?"),takeaway:g("\uACF5\uC2DD \uB2F5\uBCC014-3\uC740 \uCD94\uAC00 \uC138\uBD80\uC2DC\uC124\uC758 \uC81C\uC548\uC744 \uD5C8\uC6A9\uD569\uB2C8\uB2E4.","Odpowied\u017A 14-3 dopuszcza propozycje dodatkowych funkcji szczeg\xF3\u0142owych."),detail:[g("\uC6D0\uBB38: \u201C\uC5EC\uC720 \uBA74\uC801 \uB0B4 \uAD00\uB828 \uD504\uB85C\uADF8\uB7A8(\uCD94\uAC00 \uC138\uBD80\uC2DC\uC124) \uC81C\uC548 \uAC00\uB2A5\u201D. PDF7\uCABD\uC785\uB2C8\uB2E4.","Orygina\u0142: \u201EW dost\u0119pnej wolnej powierzchni mo\u017Cna proponowa\u0107 powi\u0105zane programy (dodatkowe funkcje szczeg\xF3\u0142owe)\u201D. Strona 7 PDF."),g("\uD544\uC218\uC2DC\uC124\uC744 \uBE7C\uAC70\uB098 \uC8FC\uCC28390\uB300\uB97C \uC904\uC77C \uC218 \uC788\uB2E4\uB294 \uB73B\uC740 \uC544\uB2D9\uB2C8\uB2E4.","Nie oznacza to zgody na usuni\u0119cie wymaganych funkcji lub zmniejszenie liczby miejsc poni\u017Cej 390."),g("\uAD00\uB828\uC131\xB7\uACF5\uACF5\uC131\xB7\uC6B4\uC601\xB7\uBA74\uC801\xB7\uC608\uC0B0\uC744 \uD568\uAED8 \uC124\uBA85\uD569\uB2C8\uB2E4. \uD2B9\uC815 \uC0C8 \uC2DC\uC124\uC774 \uC790\uB3D9\uC73C\uB85C \uD5C8\uC6A9\uB418\uC9C0\uB294 \uC54A\uC2B5\uB2C8\uB2E4.","Trzeba wykaza\u0107 zwi\u0105zek z zadaniem, publiczn\u0105 warto\u015B\u0107, dzia\u0142anie, powierzchni\u0119 i koszt. Ka\u017Cda nowa funkcja nadal wymaga uzasadnienia.")],kind:11,tag:"official",section:1},{title:g("\uB4DC\uB860 \uBC30\uC1A1\uC13C\uD130\uB294 \uC870\uAC74\uBD80 \uC544\uC774\uB514\uC5B4\uC785\uB2C8\uB2E4","Centrum dostaw dronami jest propozycj\u0105 warunkow\u0105"),question:g("\uB4DC\uB860 \uBC30\uC1A1\uC13C\uD130\uB97C \uC81C\uC548\uD55C\uB2E4\uBA74?","Co je\u015Bli proponujemy centrum dostaw dronami?"),takeaway:g("\uC81C\uC548\uC758 \uC5EC\uC9C0\uB294 \uC788\uC9C0\uB9CC, \uAD00\uB828\uC131\uACFC \uC2E4\uC81C \uC6B4\uC601 \uAC00\uB2A5\uC131\uC744 \uB530\uB85C \uC785\uC99D\uD574\uC57C \uD569\uB2C8\uB2E4.","Istnieje przestrze\u0144 na propozycj\u0119, lecz jej zwi\u0105zek z zadaniem i wykonalno\u015B\u0107 operacyjn\u0105 trzeba wykaza\u0107 osobno."),detail:[g("\uAD00\uB828 \uD504\uB85C\uADF8\uB7A8\uC758 \uC77C\uBC18 \uC81C\uC548 \uD5C8\uC6A9\uC774 \uB4DC\uB860 \uBC30\uC1A1\uC13C\uD130\uC758 \uAC1C\uBCC4 \uC2B9\uC778\uC744 \uB73B\uD558\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.","Og\xF3lna zgoda na funkcje powi\u0105zane nie oznacza indywidualnej akceptacji centrum dron\xF3w."),g("\uC2E4\uC81C \uC218\uC694\xB7\uC6B4\uC601\uC790\xB7\uC9C0\uC0C1 \uD558\uC5ED\xB7\uBCF4\uAD00\xB7\uC218\uC9C1\uC6B4\uC1A1\xB7\uC774\uCC29\uB959 \uB3D9\uC120\uC744 \uC124\uBA85\uD574\uC57C \uC13C\uD130 \uADDC\uBAA8\uB97C \uC815\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.","Skala centrum wymaga danych o popycie, operatorze, roz\u0142adunku, magazynowaniu, transporcie pionowym i obs\u0142udze start\xF3w."),g("\uB300\uC9C0\uC640 \uBC30\uC1A1 \uACBD\uB85C\uC758 \uACF5\uC5ED\xB7\uBE44\uD589 \uC2B9\uC778\uC740 \uBBF8\uD655\uC778\uC785\uB2C8\uB2E4. \uB4DC\uB860\uC2DC\uC124 \uC124\uCE58\uC640 \uBC30\uC1A1\uC6B4\uD56D \uD5C8\uAC00\uB294 \uBCC4\uAC1C\uC785\uB2C8\uB2E4.","Przestrze\u0144 powietrzna i zgody dla dzia\u0142ki oraz tras nie zosta\u0142y sprawdzone. Urz\u0105dzenie l\u0105dowiska i zezwolenie na dostawy to r\xF3\u017Cne sprawy.")],kind:12,tag:"interpretation",section:1},{title:g("\uC2EC\uC0AC\uB294 \uD55C \uAC00\uC9C0 \uC7A5\uC810\uC73C\uB85C \uB05D\uB098\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4","Oceny nie wygrywa si\u0119 jedn\u0105 zalet\u0105"),question:g("\uC2EC\uC0AC\uC704\uC6D0\uC740 \uBB34\uC5C7\uC744 \uD568\uAED8 \uBCF4\uB294\uAC00?","Co komisja ocenia \u0142\u0105cznie?"),takeaway:g("\uC8FC\uCC28\xB7\uB3D9\uC120, \uC6B4\uC601, \uB3C4\uC2DC\uC801 \uBC30\uCE58\uC640 \uBBF8\uB798 \uB300\uC751, \uACF5\uC0AC\uBE44\uAC00 \uD568\uAED8 \uD3C9\uAC00\uB429\uB2C8\uB2E4.","Razem oceniane s\u0105 parking i ruch, u\u017Cytkowanie, relacje miejskie, przysz\u0142a elastyczno\u015B\u0107 oraz koszty."),detail:[g("\uACC4\uD68D\uBC29\uD5A5\xB7\uACF5\uACF5\uC13115, \uC8FC\uCC28\xB7\uAD50\uD1B5\xB7\uB3D9\uC12025, \uACF5\uAC04\uACC4\uD68D\xB7\uC6B4\uC601\uD6A8\uC72820\uC785\uB2C8\uB2E4.","Kierunek i publiczna warto\u015B\u0107: 15; parking, transport i ruch: 25; przestrze\u0144 i sprawno\u015B\u0107 obs\u0142ugi: 20."),g("\uBC30\uCE58\xB7\uC785\uBA74\xB7\uC548\uC804\xB7\uC9C0\uC18D\uAC00\uB2A5\xB7\uBBF8\uB798\uB300\uC75130, \uACF5\uC0AC\uBE44\xB7\uC2DC\uACF5\uC13110\uC785\uB2C8\uB2E4.","Usytuowanie, elewacja, bezpiecze\u0144stwo, zr\xF3wnowa\u017Cenie i przysz\u0142o\u015B\u0107: 30; koszty i wykonalno\u015B\u0107 budowy: 10."),g("\uBC95\uADDC\xB7\uC218\uB7C9\xB7\uC608\uC0B0 \uCDA9\uC871\uACFC \uC124\uACC4\uC758 \uC9C8\uC740 \uB530\uB85C \uD655\uC778\uD569\uB2C8\uB2E4. \uB3C4\uC2DD\uB9CC\uC73C\uB85C \uC801\uD569\uC131\uC774 \uC99D\uBA85\uB418\uC9C0\uB294 \uC54A\uC2B5\uB2C8\uB2E4.","Zgodno\u015B\u0107 z prawem, liczbami i bud\u017Cetem oraz jako\u015B\u0107 architektury sprawdzamy oddzielnie. Sam diagram nie jest dowodem zgodno\u015Bci.")],kind:13,tag:"official",section:2},{title:g("\uB9C8\uAC10\uACFC \uC81C\uCD9C\uBB3C\uC740 \uC124\uACC4\uB97C \uD604\uC2E4\uB85C \uBB36\uC2B5\uB2C8\uB2E4","Termin i materia\u0142y zamykaj\u0105 projekt w realnym planie"),question:g("\uBB34\uC5C7\uC744 \uC5B8\uC81C\uAE4C\uC9C0 \uC81C\uCD9C\uD558\uB098?","Co i do kiedy sk\u0142adamy?"),takeaway:g("\uC791\uD488\uC811\uC218\uB29411\uC6D420\uC77C \uC11C\uC6B817:00, \uBC14\uC82409:00\uAE4C\uC9C0\uC785\uB2C8\uB2E4.","Termin zg\u0142oszenia pracy: 20 listopada, godz. 17:00 w Seulu, 09:00 w Bazylei."),detail:[g("\uD328\uB1102\uC7A5\uACFC \uACF5\uC2DD \uC694\uAD6C \uC11C\uB958\xB7\uC11C\uC2DD\uC744 \uC81C\uCD9C\uD569\uB2C8\uB2E4. \uCD95\uCC99\uC740 \uC124\uACC4 \uC758\uB3C4\uC5D0 \uB530\uB77C \uC870\uC815 \uAC00\uB2A5\uD569\uB2C8\uB2E4.","Sk\u0142adamy dwie plansze oraz wymagane dokumenty i formularze. Skal\u0119 rysunk\xF3w mo\u017Cna dostosowa\u0107 do intencji projektu."),g("\uC811\uC218\uB29411\uC6D416\uC77C\uBD80\uD13020\uC77C\uAE4C\uC9C0\uC785\uB2C8\uB2E4. \uACF5\uC2DD \uB204\uB9AC\uC9D1\uC758 \uC138\uBD80 \uADDC\uACA9\xB7\uC775\uBA85\uC131 \uC870\uAC74\uC744 \uB530\uB985\uB2C8\uB2E4.","Sk\u0142adanie prac trwa od 16 do 20 listopada. Obowi\u0105zuj\u0105 wymagania techniczne i anonimowo\u015B\u0107 okre\u015Blone na stronie konkursu."),g("\uBC1C\uD45C \uC804 \uC81C\uCD9C\uC548 \uC804\uCCB4\xB7\uC77C\uBD80\uC758 \uACF5\uAC1C \uAE08\uC9C0 \uC870\uAC74\uC744 \uC9C0\uD0B5\uB2C8\uB2E4. \uC774 \uD398\uC774\uC9C0\uB294 \uB0B4\uBD80 \uC774\uD574\uB97C \uC704\uD55C \uC790\uB8CC\uC785\uB2C8\uB2E4.","Przestrzegamy zakazu publikowania ca\u0142o\u015Bci lub cz\u0119\u015Bci pracy przed wynikami. Ta strona s\u0142u\u017Cy wewn\u0119trznemu zrozumieniu zadania.")],kind:14,tag:"official",section:2},{title:g("\uD604\uC7AC \uBAA8\uB378\uC758 \uC22B\uC790\uB97C \uAC80\uC99D \uACB0\uACFC\uB85C \uC77D\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4","Liczby z modelu nie s\u0105 jeszcze dowodem zgodno\u015Bci"),question:g("\uC9C0\uAE08 \uC548\uC5D0\uC11C \uBB34\uC5C7\uC774 \uD655\uC778\uB410\uACE0 \uB0A8\uC558\uB098?","Co wiemy o aktualnym wariancie, a co pozostaje otwarte?"),takeaway:g("\uC77C\uBC18394\uAC1C \uAC00\uBC30\uCE58\uB294390\uB300 \uD655\uBCF4 \uAC80\uC99D\uACFC \uB2E4\uB985\uB2C8\uB2E4.","Wst\u0119pne rozmieszczenie 394 standardowych stanowisk nie dowodzi spe\u0142nienia wymogu 390 miejsc."),detail:[g("\uCD5C\uADFC \uAC80\uD1A0\uB2948.4m6\uCE78\xB7\uB0A8\uCE21 \uB7A8\uD504\uB760\xB7\uC8FC\uACBD\uAC0416.4m\uC758 \uD0D0\uC0C9\uC548\uC785\uB2C8\uB2E4. \uCD5C\uC885\uC548 \uCC44\uD0DD\uC740 \uC544\uB2D9\uB2C8\uB2E4.","Ostatni wariant bada sze\u015B\u0107 modu\u0142\xF3w 8,4 m, pas ramp od po\u0142udnia i g\u0142\xF3wn\u0105 rozpi\u0119to\u015B\u0107 16,4 m. Nie jest zatwierdzonym projektem ko\u0144cowym."),g("\uC790\uC804\uAC70\xB7\uC6B4\uC601\uC2DC\uC124 \uC2E4\uC81C \uBA74\uC801, \uC804\uC6A9 \uC8FC\uCC28\uAD6C\uD68D, \uCC28\uB7C9 \uD68C\uC804\xB7\uB3C4\uB85C \uC811\uC18D\uC744 \uD655\uC778\uD574\uC57C \uD569\uB2C8\uB2E4.","Trzeba sprawdzi\u0107 rzeczywiste powierzchnie rower\xF3w i zaplecza, miejsca specjalne, manewry oraz w\u0142\u0105czenie do ulicy."),g("\uAD6C\uC870\xB7\uB0B4\uD654\xB7\uD53C\uB09C\xB7\uBA74\uC801 \uC0B0\uC815\xB7\uC608\uC0B0\uB3C4 \uAC80\uC99D\uC774 \uB0A8\uC544 \uC788\uC2B5\uB2C8\uB2E4. \uC774\uC804 \uBAA8\uB378\uC758 \uC131\uB2A5\uC744 \uD604\uC7AC\uC548\uC73C\uB85C \uC62E\uAE30\uC9C0 \uC54A\uC2B5\
