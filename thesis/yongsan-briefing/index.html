:root{--background:#e8edf1;--surface:#fff;--ink:#181a1b;--muted:#62686d;--line:#cdd2d6;--soft:#f1f3f4;--selected:#181a1b;--selected-ink:#fff;--accent:#181a1b;color-scheme:light;font-family:'YHLA Latin','Apple SD Gothic Neo','AppleGothic','Malgun Gothic',sans-serif;font-synthesis:none}
html[data-theme='dark']{--background:#1b1d20;--surface:#292b2e;--ink:#f1f2f3;--muted:#adb2b7;--line:#45494e;--soft:#222427;--selected:#f1f2f3;--selected-ink:#1b1d20;--accent:#f1f2f3;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-size:13px;line-height:1.5;background:var(--background);color:var(--ink)}button,input,select,textarea{font:inherit}button,a,input,summary{-webkit-tap-highlight-color:transparent}button{color:inherit;background:none;border:0;padding:0;cursor:pointer}button:disabled{opacity:.28;cursor:default}a{color:inherit;text-decoration:none}a:hover,.text-button:hover{text-decoration:underline;text-underline-offset:3px}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:4px}button svg{width:20px;height:20px;display:block}h1,h2,h3,h4,p{margin:0}h1,h2{font-size:20px;line-height:1.25;font-weight:500}h3,h4{font-size:13px;font-weight:500}small,.small-text{font-size:11px;line-height:1.4}

</style></head><body><div id="root"></div><script>const localFiles={"./references/competition-brief.txt":"\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n용산전자상가지구 특별계획구역8\r\n\r\n공공기여 공영주차장 건립 설계공모 지침서\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n2026. 10.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n서울특별시\r\n\r\n(미래공간담당관)\r\n\r\n목   차\r\n\r\n\r\n\r\n\r\n\r\n1. 일반지침\r\n\r\n  1.1 공모명칭 \t\r\n\r\n1\r\n\r\n  1.2 공모배경 및 목적 \t\r\n\r\n1\r\n\r\n  1.3 공모주관 및 발주처 \t\r\n\r\n1\r\n\r\n  1.4 공모개요 \t\r\n\r\n1\r\n\r\n  1.5 공모일정 \t\r\n\r\n3\r\n\r\n  1.6 공모관리 \t\r\n\r\n3\r\n\r\n  1.7 공모방식 \t\r\n\r\n4\r\n\r\n  1.8 참가자격 \t\r\n\r\n4\r\n\r\n  1.9 참가등록 \t\r\n\r\n5\r\n\r\n  1.10 현장설명회 \t\r\n\r\n5\r\n\r\n  1.11 질의접수 및 응답 \t\r\n\r\n6\r\n\r\n  1.12 제공자료 \t\r\n\r\n6\r\n\r\n  1.13 사용언어 및 단위 \t\r\n\r\n6\r\n\r\n  1.14 제출 \t\r\n\r\n7\r\n\r\n  1.15 전문위원회 \t\r\n\r\n10\r\n\r\n  1.16 심사 \t\r\n\r\n11\r\n\r\n  1.17 결과 공고 \t\r\n\r\n14\r\n\r\n  1.18 시상 \t\r\n\r\n14\r\n\r\n  1.19 계약 \t\r\n\r\n15\r\n\r\n  1.20 설계의도구현 \t\r\n\r\n17\r\n\r\n  1.21 기타 \t\r\n\r\n17\r\n\r\n\r\n\r\n\r\n\r\n2. 설계지침\r\n\r\n2.1 기본 방향 \t\r\n\r\n18\r\n\r\n2.2 설계의 주안점 \t\r\n\r\n18\r\n\r\n2.3 세부 설계지침 \t\r\n\r\n19\r\n\r\n\r\n\r\n\r\n\r\n3. 부록(별첨)\r\n\r\n\r\n\r\n   공고문\r\n\r\n\r\n\r\n   서식\r\n\r\n\r\n\r\n   현황도면 및 관련자료\r\n\r\n\r\n\r\n\r\n\r\n1. 일반지침\r\n\r\n1.1. 공모명칭\r\n\r\n● 용산전자상가지구 특별계획구역8 공공기여 공영주차장 건립\r\n\r\n\r\n\r\n1.2. 공모배경 및 목적 \r\n\r\n● 본 설계공모의 대상은 용산전자상가지구 특별계획구역8 개발 사업의 일환으로, 사업시행사인 ㈜용산라이프시티PFV가 서울시에 기부채납하는 공영주차장이다.\r\n\r\n● 사업 대상지는 용산전자상가지구 특별계획구역8 내 공공기여 부지(획지2)이다. 특별계획구역8은 용산국제업무지구 조성과 연계하여, 현재 기능이 상실된 유통업무설비를 폐지하고 신산업용도로 전환하기 위하여 지정된 구역이다.\r\n\r\n● 본 사업은 특별계획구역 내 노후화된 기존 주차장을 철거한 후 지역의 주차 수요에 대응하고 변화하는 미래의 교통‧모빌리티 환경을 고려한 새로운 유형의 공영주차장과 운영·지원 업무시설을 함께 건립하는 것을 목적으로 한다.\r\n\r\n● 설계자는 공영주차장의 본질적 기능인 안전성·편리성·운영효율성 및 유지관리성을 확보하고 동시에 미래도시 용산의 도시적 위상과 향후 주변지역의 변화에 대응할 수 있는 상징성 있는 공공건축 디자인을 제안하여야 한다. 특히 미래의 전기차·자율주행차·공유모빌리티 확대와 주차 수요 변화에 대응하여 공간의 일부 또는 전체를 변경할 수 있도록 가변‧확장이 가능한 구조계획을 적극 고려하여야 한다.\r\n\r\n● 기부채납 사업의 특성상 계획 수립부터 준공까지의 기간 중 운영계획이 변경될 가능성을 고려하여, 향후 운영기관의 요구와 시설 운영 변화에 대응할 수 있도록 계획한다.\r\n\r\n\r\n\r\n1.3. 공모주관 및 발주처\r\n\r\n● 공모주관 : 서울특별시 미래공간기획관 미래공간담당관\r\n\r\n● 발주처(도시계획시설 시행자, 계약주체) : ㈜용산라이프시티PFV\r\n\r\n● 운영주관 : 서울특별시 교통실 주차계획과, 서울시설공단(시설운영)\r\n\r\n\r\n\r\n1.4. 공모개요 \r\n\r\n● 공모방식 : 일반설계공모\r\n\r\n● 대 상 지 : 서울특별시 용산구 한강로2가 12-12 외 7필지 (용산전자상가지구 특별계획구역8 내)\r\n\r\n● 지역지구 : 도시지역, 일반상업지역, 개발행위허가제한지역, 지구단위계획구역, 주차장\r\n\r\n● 설계개요\r\n\r\n   - 대지면적 : 2,216.30㎡\r\n\r\n   - 용도 : 자동차 관련 시설(주차장) / 공영주차장(부속 업무시설 포함)\r\n\r\n   - 연면적 : 20,847.64㎡ 이하\r\n\r\n   - 건폐율 : 90% 이하\r\n\r\n   - 용적률 : 669.36% 이하\r\n\r\n   - 높이 : 45m 이하\r\n\r\n   - 건축 규모 : 지하 4층, 지상 10층 내외 (법정 기준 내 계획)\r\n\r\n   - 주차 대수 : 390대 이상\r\n\r\n● 사업비 개요 \r\n\r\n   - 기부채납 설치비(총 사업비) : 63,014,700천 원(부가세 별도)\r\n\r\n ※ ’25년 세부개발계획 결정 고시 기준 설치비(60,602,712천 원)를 ’24년 2월부터 ’26년 12월까지의건설공사비지수를 보정한 비용으로 향후 변동될 수 있음.\r\n\r\n   - 예정공사비 : 50,411,760천 원(부가세 별도)\r\n\r\n   - 예정설계비 : 2,544,173천 원(부가세 별도)\r\n\r\n ※ 공공발주사업에 대한 건축사의 업무범위와 대가기준(국토부 고시) 적용\r\n\r\n ※ 과업 범위 : 계획·중간·실시설계 및 이에 부수되는 건축 인·허가, 관련 심의 포함 \r\n\r\n ※ 인증 및 심의 대상 항목 : 설계VE(서울시 기술심사담당관 협의), 에너지절약계획서, ZEB, BF(관련 추가 업무대가 및 인증 수수료 포함)\r\n\r\n   - 설계의도구현비 : 159,393천 원 (부가세 별도)\r\n\r\n\r\n\r\n[사업 대상지 위치도]\r\n\r\n\r\n\r\n\r\n\r\n[용산전자상가지구 특별계획구역8 세부개발계획 결정도]\r\n\r\n\r\n\r\n1.1. 공모일정\r\n\r\n   \r\n\r\n구  분\r\n\r\n일  시\r\n\r\n비  고\r\n\r\n사전공고\r\n\r\n2026. 9. 28.(월)\r\n\r\n웹사이트 공고 (project.seoul.go.kr)\r\n\r\n공고\r\n\r\n2026. 10. 1.(목)\r\n\r\n웹사이트 공고 (project.seoul.go.kr)\r\n\r\n참가등록\r\n\r\n2026. 10. 1.(목) ~ 23.(금) 18:00 마감\r\n\r\n웹사이트를 통해서만 등록\r\n\r\n현장설명회\r\n\r\n2026. 10. 7.(수) 10:00\r\n\r\n세부사항은 웹사이트 공지 참조\r\n\r\n질의접수\r\n\r\n2026. 10. 7.(수) ~ 12.(월) 18:00 마감\r\n\r\n웹사이트를 통해서만 접수\r\n\r\n질의응답\r\n\r\n2026. 10. 16.(금) \r\n\r\n웹사이트에 일괄 게재\r\n\r\n작품 접수\r\n\r\n2026. 11. 16.(월) ~ 20.(금) 17:00 마감\r\n\r\n웹사이트를 통해서만 제출\r\n\r\n1차 기술분야검토\r\n\r\n2026. 11. 26.(목)\r\n\r\n심사 전 법규 및 지침 위반사항 등 검토\r\n\r\n결과 확인 기간: 11.27.(금)~12.1(화), 5일간 \r\n\r\n결과에 대한 의견이 있는 경우 [서식14]를 12.1(화) 17:00까지 제출\r\n\r\n2차 기술분야검토\r\n\r\n2026. 12. 3.(목)\r\n\r\n1차 심사\r\n\r\n2026. 12. 8.(화) 09:00\r\n\r\n디지털 패널 심사\r\n\r\n2차 심사\r\n\r\n2026. 12. 15.(화) 09:00\r\n\r\n디지털 패널, 발표심사\r\n\r\n발표\r\n\r\n2026. 12. 18.(금) 17:00\r\n\r\n웹사이트에 게시\r\n\r\n \r\n\r\n※ 위 내용 및 본 지침서에 사용한 모든 시각은 한국 시각(GMT+9) 기준으로 한다.\r\n\r\n※ 일정은 사업 추진 여건에 따라 일부 변경될 수 있으며, 변경 시 웹사이트(http://project.seoul.go.kr)에 이를 공지한다.\r\n\r\n※ 사전공고~작품접수 마감: 54일 (시행공고~작품접수 마감: 51일)\r\n\r\n\r\n\r\n1.2. 공모관리\r\n\r\n● 운영위원회와 설계공모 관리팀은 설계공모 일정과 규정을 준수하여 설계공모를 진행한다. \r\n\r\n● 운영위원장은 참가등록, 질의응답, 작품 접수 등 공모 전반에 대한 자문을 수행하고, 전문위원회 및 심사위원회 심사의 전 과정을 지원한다.\r\n\r\n● 운영위원회 구성 \r\n\r\n   - 박종훈 (㈜행림종합건축사사무소, 공공건축관리자, 위원장)    - 권유안 (서울특별시 교통실 주차계획과) \r\n\r\n   - 김상훈 (서울시설공단 주차시설운영처) \r\n\r\n   - 윤선영 (㈜블리츠자산운용)\r\n\r\n   - 전성열 (㈜마스터키 건축사사무소) \r\n\r\n   - 정아선 (서울특별시 미래공간담당관)\r\n\r\n● 공모 및 사업부서 : 서울특별시 미래공간기획관 미래공간담당관 (02-2133-7724)\r\n\r\n● 공모관리 : 비옥 (boq.competition@gmail.com / 070-4035-3706)\r\n\r\n● 공식 웹사이트 : http://project.seoul.go.kr\r\n\r\n1.3. 공모방식 \r\n\r\n● 본 설계공모는 일반설계공모로 진행한다.\r\n\r\n\r\n\r\n1.4. 참가자격\r\n\r\n1) 참가자격\r\n\r\n● 국내·외 건축사 모두 참여 가능하며 공동응모할 수 있으나 팀의 대표는 반드시 국내 건축사로 한다.\r\n\r\n● 팀의 대표는 「건축사법」 제7조에 의한 건축사 자격증을 소지하고, 같은 법 제23조에 의거 건축사사무소의 개설신고를 필한 업체로서 관계 법령에 결격사유가 없는 사무소이어야 한다.\r\n\r\n● 참가등록 시 컨소시엄을 구성할 수 있으며, 컨소시엄은 공동응모자를 포함하여 총 3인(팀) 이내로 한다. 단, 참가자는 타 팀에 중복으로 참여할 수 없다.\r\n\r\n● 공동응모 시 선임된 대표자는 공동참가자를 대표하여 본 설계공모 관련 문서의 제출 및 수령, 권리의 취득 및 포기 등에 관한 권한을 갖는다.\r\n\r\n● 자격등록을 한 국내 건축사의 개설신고된 건축사사무소가 아닌 경우, 당선 후 계약 전에 건축사사무소 개설신고를 마쳐야 하며 관계 법령에 결격사유가 없어야 한다.\r\n\r\n● 외국 건축사 자격 소지자인 경우 본 공모 참가등록 마감일까지 국내에 건축사사무소를 개설하거나, 대한민국 건축사사무소와 공동으로 응모하여야 한다. 공동응모 시 계약 당사자는 국내 건축사사무소로 한다.\r\n\r\n● 설계공모 참가등록 마감일 기준, 해당 관청으로부터 건축사사무소 개설신고의 효력상실처분, 휴업, 폐업, 업무정지 및 기타 이와 유사한 행정처분을 받은 자는 응모할 수 없다.※ 「지방자치단체 입찰 및 계약집행기준」 시행령 제12조에 따라 입찰 참가자격 판단 기준일은 입찰 참가등록 마감일(2026.10.23.)로 한다.\r\n\r\n\r\n\r\n2) 참가자격 제한\r\n\r\n● 본 사업 및 설계공모와 관련하여 기획설계, 자문 및 기본계획 수립용역 등 각종 심사위원 등으로 직·간접적으로 참여한 자는 본 공모에 참여할 수 없다.\r\n\r\n● 본 사업 및 설계공모 참가등록자는 1개의 작품만 제출할 수 있으며, 중복 공모가 확인될 경우 참가자격을 박탈한다.\r\n\r\n● 심사위원과 기피·회피·제척 관계에 있는 자 중 작품접수 마감일 3일 전까지 신청하지 않은 자는 참여할 수 없다.\r\n\r\n\r\n\r\n3) 심사위원 기피신청 및 회피\r\n\r\n● 참가자는 공개된 심사위원에게 제척사유가 있거나 심사의 공정성을 기대하기 어려운 사정이 있는 경우, 작품접수 마감일 3일 전까지 관련 증빙자료와 신고서[서식15]를 설계공모 담당자에게 제출하여야 한다.\r\n\r\n● 신청방법 및 유의사항은 사전접촉 등 비리·부정·불공정 행위 신고서[서식15]에 따른다.\r\n\r\n● 제척신청 시에는 참가등록 마감 후 관련 증빙자료를 제출하여야 한다.\r\n\r\n● 신청기한이 지난 이후 설계공모 참가자의 심사위원 기피신청은 불가하다.\r\n\r\n● 제출처: hanery101@seoul.go.kr\r\n\r\n4) 심사위원 제척 사항\r\n\r\n● 위원 또는 그 배우자나 배우자이었던 사람이 심사 대상 업체의 당사자가 되거나 그 업체의 당사자와 공동권리자 또는 공동의무자인 경우\r\n\r\n● 위원이 심사 대상 업체의 당사자와 친족이거나 친족이었던 경우\r\n\r\n● 위원이 심사 대상인 사업의 시행으로 이해당사자(대리관계를 포함한다)가 되는 경우\r\n\r\n● 위원이나 위원이 속한 법인ㆍ단체 등이 심사 대상 업체의 당사자의 대리인이거나 대리인이었던 경우\r\n\r\n● 위원이 공고일로부터 3년 이내에 해당 심사 대상 업체에 임원 또는 직원으로 재직한 경우\r\n\r\n● 위원이 공고일로부터 2년 이내에 해당 심사 대상 업체와 직접적인 자문, 연구, 용역(하도급을 포함한다), 감정 또는 조사를 한 경우\r\n\r\n● 위원이 심사 대상자와 같은 학교, 같은 학과의 조교수 이상으로 근무하는 경우\r\n\r\n\r\n\r\n5) 처리결과 공개\r\n\r\n● 신청에 따라 심사위원의 제척이 결정된 경우에는 신청자, 제척 대상 심사위원 및 제척사유를 공식 웹사이트에 공개한다.\r\n\r\n\r\n\r\n1.5. 참가등록\r\n\r\n● 등록기간: 2026. 10. 1.(목) ~ 2026. 10. 23.(금) 18:00 마감\r\n\r\n● 공식 웹사이트(http://project.seoul.go.kr)를 통해 참가등록한다.\r\n\r\n● 웹사이트에 접속하여 [회원가입(로그인) → Competition → 해당 공모전 선택 → 참가 신청] 후, 웹사이트 안내에 따라 요구되는 사항을 작성해야 등록이 완료되며, 이때 부여되는 고유식별번호(이하 ‘PIN 번호’)를 통해 공모 기간 동안 참가자 및 제출자료를 식별한다.\r\n\r\n● PIN 번호는 알파벳 2자와 아라비아 숫자 5자로 구성되며, 모든 제출 파일에 표기하고 공모 마감 시까지 일관되게 사용한다.\r\n\r\n● 등록기간 내 정보 변경은 가능하나, 참가등록 기간 이후에는 일체 수정할 수 없다.\r\n\r\n● 응모자는 설계공모에 응모함으로써 지침서의 규정을 준수하는 것에 동의하는 것으로 간주한다.\r\n\r\n● 참가등록업체의 명단공개는 마감일 이후에 한다.\r\n\r\n\r\n\r\n1.6. 현장설명회\r\n\r\n● 일시 : 2026. 10. 7. (수) 10:00 (현장설명회 참석은 의무사항 아님)\r\n\r\n● 장소 : 사업대상지\r\n\r\n● 발주기관 상황에 따라 현장 설명회 장소와 시간, 신청 방법 등이 변경될 수 있으므로 공식 웹사이트 공지사항에서 현장설명회 관련 사항을 최종 확인하여야 한다.\r\n\r\n● 현장설명회에서는 질의를 받지 않으며 질의접수 기간 동안 공식 웹사이트를 통해 접수해야 한다.\r\n\r\n● 현장설명회 참여가 어려운 참가자를 위하여 현장사진을 제공자료로 제공한다.\r\n\r\n1.7. 질의접수 및 응답 \r\n\r\n● 질의접수 : 2026. 10. 7. (수) 10:00 ~ 2026. 10. 12. (월) 18:00 마감\r\n\r\n● 질의응답 : 2026. 10. 16. (금)\r\n\r\n● 참가등록을 완료한 팀은 질의접수 기간 내에 공식 웹사이트에서 질의가 가능하며, 개별 이메일, 전화, 우편, FAX로는 질의를 받지 않는다.\r\n\r\n● 질의서는 질의기간(시간) 내 접수분에 한하여 유효하다.\r\n\r\n● 질의에 대한 답변은 모든 참가자가 볼 수 있도록 공식 웹사이트에 일괄 게시할 예정이며, 일정 변경 시 웹사이트를 통해 공지한다.\r\n\r\n● 질의에 대한 응답은 공고내용과 설계공모 지침서에 대한 수정 또는 보완으로 간주하며, 질의응답에 대한 미확인으로 인해 불이익이 발생하는 경우 이에 대한 책임은 설계공모 참가자에게 있다.\r\n\r\n\r\n\r\n1.8. 제공자료\r\n\r\n● 참가등록 후 공식 웹사이트에서 내려받을 수 있다.\r\n\r\n● 제공자료 목록\r\n\r\n   - 설계공모 지침서\r\n\r\n   - 대상지 현황측량도(dwg) ※ 도시계획시설 결정선 포함- 지장물매설물도(dwg)\r\n\r\n   - 지반조사보고서(인접부지 : 특별계획구역8 지반조사보고서)- 현장사진- 사업대상지 및 특별계획구역8 3D 현황(skp)\r\n\r\n   - 도시관리계획 결정 및 지형도면 고시(용산 지구단위계획(변경) 및 용산전자상가지구 특별계획구역8 세부개발계획)\r\n\r\n   - 별첨 서식 \r\n\r\n※ 제공 도서 및 자료 내용의 일부 또는 전부는 본 공모 외 다른 목적으로 사용할 수 없다.\r\n\r\n\r\n\r\n1.9. 사용언어 및 단위\r\n\r\n● 본 공모전의 공식 언어는 한국어와 영어이다.\r\n\r\n● 모든 공식 문서는 한국어로 작성·배포되며, 한국어와 영어 사이에 해석상 충돌이 있을 경우 한국어를 우선으로 한다.\r\n\r\n● 참가자의 제출 도면 및 문서는 한국어 또는 영어로 작성한다. \r\n\r\n● 계량 단위는 SI 미터법(Metric system)을 적용한다.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n1.10. 제출\r\n\r\n1) 제출방법 및 공통사항\r\n\r\n● 참가자는 공식 웹사이트를 통해 참가등록 시 전산으로 자동 부여받은 알파벳 2자와 아라비아 숫자 5자로 구성된 PIN 번호를 모든 제출 파일에 표기하며, PIN 번호는 공모 마감 시까지 일관되게 사용한다.\r\n\r\n● 공식 웹사이트(http://project.seoul.go.kr)를 통해 디지털 파일로 제출한다.\r\n\r\n● 제출기간: 2026. 11. 16.(월) ~ 2026. 11. 20.(금) 17:00까지\r\n\r\n● 모든 제출물은 마감시간(2026. 11. 20. (금) 17:00) 이전에 업로드를 완료해야 하므로, 참가자는 업로드에 소요되는 시간을 감안하여 제출하여야 한다. \r\n\r\n● 업로드 미완료 시 제출 시간 미준수로 판단하여 실격 처리될 수 있으며, 마감일 17:00 이후에는 업로드할 수 없다.\r\n\r\n● JPG 파일은 원본 크기로 출력 시 해상도를 유지할 수 있도록 300dpi로 제출한다. \r\n\r\n● 3차원 이미지의 색상, 렌더링 및 이미지 편집 표현은 자유로 하되 참가자가 직접 생산한 자료만 사용한다.\r\n\r\n● 참가자가 직접 생산하지 않은 참조 이미지나 사례 사진은 사용해서는 안 된다.\r\n\r\n● 제출확인서는 온라인 제출 완료 후 공식 웹사이트에서 출력할 수 있다.\r\n\r\n● 모든 제출물의 원본은 공모 참가자가 보관하고 있는 것으로 간주하며, 제출 과정 및 제출 후 발생한 손상에 대하여 발주기관은 책임지지 않는다. 또한, 특정할 수 없는 사유로 제출물이 손상 또는 분실된 경우, 발주처는 다시 제출하도록 요청할 수 있으며, 공모 참가자는 동일한 제출물을 다시 제출하여야 한다.\r\n\r\n● 어떤 이유든 오류 파일을 제출한 경우 심사위원회는 ‘제출 시간 미준수’로 판단하여 실격 처리할 수 있다.\r\n\r\n● 발주처는 필요한 경우 추가 서류를 요청할 수 있으며, 그 경우 서식과 제출 방법은 공식 웹사이트에 공지한다.\r\n\r\n● 제출하는 자료 파일은 설계공모 이후 작품집의 출판과 홍보에 사용될 수 있으며, 설계공모에 참여하는 것으로 이에 동의한 것으로 본다.\r\n\r\n\r\n\r\n2) 제출물\r\n\r\n(1) 제출방법\r\n\r\n● 온라인 제출자료는 다음과 같으며, 세부 사항은 아래 [온라인 제출물 목록]을 참고한다.\r\n\r\n   - 설계도판(디지털 패널) : 2매, 각 30MB 이하, JPG\r\n\r\n   - 대표 이미지, 배치도, 평면도, 입면도, 단면도, 개념도, 그 외 이미지 : 파일당 5MB 이하, JPG\r\n\r\n   - 기타 서식 및 증빙 서류 : 한 개의 ZIP 파일(10MB 이하)로 압축하여 ‘제출서류’ 항목에 등록한다.\r\n\r\n\r\n\r\n(2) 설계도판 (디지털 패널)\r\n\r\n● 설계도판 : 가로 14,400× 세로 8,100 픽셀 (300dpi) 2매 제출(용량 : 각 30MB 이하)\r\n\r\n● 도판의 배열 방법은 아래 그림과 같으며 2매를 위(1번), 아래(2번)로 하나의 세트로 구성한다.\r\n\r\n● 설계도판은 아래 내용을 포함하여 자율 구성한다. ① 설계개요 및 배치도(축척: 1/400)- 설계개요: 건물, 마감, 설비, 주차, 조경 개요 등을 작성하고 설계안의 특징을 나타내는 핵심개념 등에 대한 사항을 표기- 배치도: 시설 배치, 도로, 조경 및 부대시설, 주차장 진출입구 등의 배치 계획 및 이격 거리에 대한 사항 등을 작성하고 지하 구조물은 점선으로 표기② 평면도 (축척: 1/300)- 각 층별로 작성  ※ 평면이 동일한 경우 중복층 생략- 지상 1층 평면도의 경우 대상지 내외의 상황을 함께 표현③ 입면도, 단면도 (축척: 1/300)- 입면도 4면 (주요 마감재료 표기), 주단면도 2면(종/횡단면도)④ 입체 이미지 등⑤ 기타 계획 : 이외 참가자가 제시(강조)하고자 하는 계획\r\n\r\n  \r\n\r\n설계도판 1 \r\n\r\n(상)\r\n\r\n14,400 × 8,100 픽셀\r\n\r\n※ 1,219.2 mm × 685.8mm\r\n\r\n(mm 단위는 축척 참고용)\r\n\r\n\r\n\r\nPIN 번호_panel_01.jpg\r\n\r\nPIN 번호_panel_02.jpg\r\n\r\n\r\n\r\n(30MB 이하, 반드시 위 픽셀 수를 준수하여 업로드)\r\n\r\n설계도판 2 \r\n\r\n(하)\r\n\r\n\r\n\r\n● 파일명에 PIN 번호를 표기하여 제출한다. (예: PIN 번호_panel_01.jpg, PIN 번호_panel_02.jpg)\r\n\r\n● 평면, 입면, 단면의 축척은 동일하게 작성하고 축척과 방위는 각 도면에 정확히 표기한다.\r\n\r\n● 각종 개념도, 다이어그램 등은 자유롭게 표현할 수 있다.\r\n\r\n● 사용하는 글꼴이나 크기는 자유롭게 선택할 수 있다. 단, 사용한 글꼴은 적법한 구매 등을 통해 사용권을 가진 것으로 저작권법 위반의 문제가 없어야 한다.\r\n\r\n● 도면의 종류 및 표현의 정도는 참가자가 자유롭게 정할 수 있으나 계획 개념이 전달될 수 있도록 한다.\r\n\r\n\r\n\r\n(3) 발표자료\r\n\r\n● 발표자료는 2차 심사 발표 대상자에 한해, 추후 공지되는 일정에 따라 제출한다.\r\n\r\n● 내용은 설계도판 등 기 제출된 자료를 기반으로, 10분 이내 발표가 가능하도록 자유롭게 구성한다.\r\n\r\n● 제출물: PDF 파일 (300 dpi)\r\n\r\n[온라인 제출물 목록]\r\n\r\n\r\n\r\n제출물 \r\n\r\n제출 내용 \r\n\r\n파일명 \r\n\r\n설계도판\r\n\r\n설계도판 2매 (jpg, 300dpi, 각 30MB 이하)\r\n\r\nPIN 번호_panel_01.jpg\r\n\r\nPIN 번호_panel_02.jpg\r\n\r\n대표 이미지\r\n\r\n대표 이미지 1개 (jpg, 3,840x2,250 픽셀, 300dpi, 5MB 이하)\r\n\r\nPIN 번호_main.jpg\r\n\r\n그 외 이미지\r\n\r\n대표 이미지 외 조감도, 투시도 등 (jpg, 300dpi, 각 5MB 이하)\r\n\r\nPIN 번호_image_01.jpg\r\n\r\nPIN 번호_image_02.jpg…\r\n\r\n도면_배치도\r\n\r\n배치도 (jpg, 300dpi, 각 5MB 이하, 1/400)\r\n\r\nPIN 번호_siteplan.jpg\r\n\r\n도면_평면도\r\n\r\n각 층 평면도 (jpg, 300dpi, 각 5MB 이하, 1/300)\r\n\r\nPIN 번호_plan_01.jpg\r\n\r\nPIN 번호_plan_02.jpg…\r\n\r\n도면_입면도\r\n\r\n4면 입면도 (jpg, 300dpi, 각 5MB 이하, 1/300)\r\n\r\nPIN 번호_elev_01.jpg\r\n\r\nPIN 번호_elev_02.jpg…\r\n\r\n도면_단면도\r\n\r\n종/횡 단면도 (jpg, 300dpi, 각 5MB 이하, 1/300)\r\n\r\nPIN 번호_sec_01.jpg\r\n\r\nPIN 번호_sec_02.jpg…\r\n\r\n도면_설계 개념도\r\n\r\n설계 개념도 (jpg, 300dpi, 각 5MB 이하)\r\n\r\nPIN 번호_diagram_01.jpg\r\n\r\nPIN 번호_diagram_02.jpg…\r\n\r\n제출서류 \r\n\r\n  기타 서식 및 증빙 서류(PDF) 압축 파일 1개\r\n\r\n- 대표자 건축사 자격증 사본 1부 (원본대조필)   ※ 자격증이 없는 나라의 참가자는 해당국 건축가협회의\r\n\r\n     증명서, 국문 번역본 포함\r\n\r\n- 공동응모자 건축사 자격증 사본 1부 (공동응모 시 모두)\r\n\r\n- 사업자등록증 사본 1부 (공동응모 시 모두)\r\n\r\n- 건축사사무소 업무신고필증 사본 1부 (공동응모 시 모두)\r\n\r\n- 설계공모 참가신청서 1부 [서식1]\r\n\r\n- 대표자 선임계 1부 [서식2] (공동응모 시,   하나의 설계사무소에 대표 건축사가 2인 이상일 시) \r\n\r\n- 공동응모협정서 1부 [서식3] (공동응모 시)\r\n\r\n- 보안각서, 서약서, 확인서, 동의서 각 1부 [서식4~7]\r\n\r\n- 건축 개요 [서식8]- 설계설명서 [서식9]\r\n\r\n- 층별 세부용도 및 면적표 [서식10]\r\n\r\n- 면적산출근거표 [서식11]\r\n\r\n- 관련 법규 검토서 [서식12] \r\n\r\n- 예정 공사비 검토 의견서 [서식13]\r\n\r\n- 기술검토 참가자 소명 의견서 [서식14] (해당 시)\r\n\r\n  ※ 작품접수 시 제출 제외. 기술검토 결과에 대한 의견이 있는     경우 2026. 12. 1.(화) 17:00까지 별도 제출\r\n\r\n- 사전접촉 등 비리·부정·불공정 행위 신고서 [서식15] (해당 시)\r\n\r\nPIN 번호_document.zip\r\n\r\n\r\n\r\n제출서류를 순서대로 취합해 1개의 PDF 파일로 병합 후, 압축 파일(zip)로 제출.\r\n\r\n\r\n\r\n1.15. 전문위원회\r\n\r\n1) 구성\r\n\r\n● 전문위원회는 총 8인으로 구성한다. (가나다순)\r\n\r\n- 김동배 (㈜더에코엔지니어링, 친환경)\r\n\r\n- 김병준 (라인구조, 구조)\r\n\r\n- 김상훈 (서울시설공단 주차시설운영처, 교통)\r\n\r\n- 김진환 (㈜진성, 교통)\r\n\r\n- 선우원일 (㈜더블유에스이앤씨, 구조)\r\n\r\n- 이근식 (엘케이에스에이 건축사사무소, 건축)\r\n\r\n- 전성열 (㈜마스터키건축사사무소, 건축)\r\n\r\n- 추소연 (㈜건축사사무소 RE도시건축, 건축‧친환경)\r\n\r\n\r\n\r\n2) 기술분야검토 운영\r\n\r\n● 설계공모 규정 및 지침, 관련 법규에 기초하여 응모 작품의 위반사항에 대해 심사 전에 기술분야검토를 실시하고, 그 결과를 기술분야검토서로 작성하여 심사위원회에 보고 및 제출한다.\r\n\r\n● 응모작품이 심사에 영향을 미칠 수 있는 중대한 조건을 위배하여 심사대상으로 적절하지 않다고 인정되는 경우에는 심사위원회 의결을 거쳐 해당 공모안을 심사대상에서 제외할 수 있다.\r\n\r\n● 검토 내용 (※ 건축 설계공모 운영지침(국토교통부고시 2026-250호) 기준)\r\n\r\n   \r\n\r\n항목\r\n\r\n상세 내용\r\n\r\n가. 관련 법령을 중대하게 위배한 경우\r\n\r\n국토계획법, 건축법, 주차장법, 장애인등편의법 및 기타 관계 법규의 주요 사항 위반여부\r\n\r\n나. 설계지침서에서 요구한 사항을 미준수한 경우\r\n\r\n과도하게 초과하거나 미달한 건축규모, 총 공사비, 주요 기능별 면적 등\r\n\r\n다. 제출도서의 규격을 현저히 위반한 경우\r\n\r\n제출파일의 형식·용량, 설계도판의 규격·수량 등 제출 기준 미준수\r\n\r\n라. 익명성을 위반한 경우\r\n\r\n제출도서에 해당업체를 특정할 수 있는 문구나 이미지 등이 포함\r\n\r\n\r\n\r\n\r\n\r\n3) 검토 결과 확인 및 의견 제출\r\n\r\n● 검토 결과는 공식 웹사이트를 통해 열람 가능하며 참가자는 이를 확인하고 필요시 소명 의견서 [서식14]를 작성하여 설계공모 담당자에게 제출할 수 있다.\r\n\r\n● 제출기한: 2026. 12. 1.(화) 17:00까지\r\n\r\n● 제출처: hanery101@seoul.go.kr\r\n\r\n● 기한 내 제출하지 않을 경우 해당 사항이 없는 것으로 간주하며 2차 기술분야검토는 생략된다.\r\n\r\n1.16. 심사\r\n\r\n1) 심사위원회 구성\r\n\r\n● 심사위원회는 총 5인의 심사위원과 예비 심사위원 1인으로 구성한다. (가나다순)\r\n\r\n- 박현진 ((주)온디자인건축사사무소 대표)\r\n\r\n- 안기현 (한양대학교 교수)- 위진복 (UIA건축사사무소 대표)\r\n\r\n- 이승환 ((주)아이디알건축사사무소 대표)\r\n\r\n- 임진수 ((주)아크로마키 건축사사무소 대표)\r\n\r\n- 김택빈 (이_스케이프 건축사사무소 대표, 예비)\r\n\r\n\r\n\r\n2) 심사 운영\r\n\r\n● 심사위원회는 심사위원 과반수 이상이 참석한 상태에서 개회하며 참석 인원이 과반수 미만일 경우 심사위원회를 다시 개최한다.\r\n\r\n● 심사위원회의 위원장은 심사위원 중에서 호선한다.\r\n\r\n● 심사방식은 토론을 통한 투표제를 원칙으로 하나, 심사위원회의 의결을 통해 평가방식을 채점제, 투표제와 채점제의 혼합방식 등으로 적용할 수 있다. 다만, 어떠한 평가방식을 활용하든 심사위원은 반드시 공모안에 대한 충분한 토론을 거쳐 평가하여야 한다.\r\n\r\n● 심사위원은 심사에서 작품 선정의 근거를 사업부서에서 제공한 양식에 따라 구체적으로 작성하여 기록으로 남기며, 발주기관은 이를 공개할 수 있다.\r\n\r\n● 아래 사유에 해당하는 설계자와 그의 제출물은 발주기관 및 심사위원의 논의를 통하여 심사 진행과 관계없이 탈락시킬 수 있으며 사후에 발견하는 경우에도 심사위원회 결정으로 수상을 취소할 수 있다.- 동일인이 두 개 이상의 작품에 관여하여 응모한 경우- 이 공모와 관련하여 사전에 운영위원, 전문위원, 심사위원과 접촉하거나 접촉을 시도한 경우- 최종 심사결과 발표 이전에 작품을 공개한 경우(SNS 포함)- 저작권법을 위반한 경우- 참가자격에 해당하지 않은 자가 출품했을 경우- 「서울특별시 공공건축 설계공모 운영기준」 제13조 제1항에 따른 심사위원 제척 사항에 해당하는 자가 작품접수 마감일 3일 전까지 제척신청을 하지 않은 경우\r\n\r\n\r\n\r\n3) 심사 절차\r\n\r\n● 발표자가 익명성을 저해하는 표현, 타 작품과의 비교 설명, 시간 초과 등 공정한 발표에 지장을 주는 행위를 하는 경우 심사위원장은 즉시 발표를 중지하며 심사위원 논의를 거쳐 심사에서 제외하도록 조치할 수 있다.\r\n\r\n● 심사방식은 심사위원들의 의견 수렴을 통해 대상 작품들을 선정하며, 심사위원회는 선정의 근거를 사업부서에서 제공한 양식에 따라 작성하여 기록으로 남긴다.\r\n\r\n● 1차 심사에서는 전체 작품 중 2차 심사에 오를 5개 작품을 선정한다. 이때, 선정 작품의 수량은 심사위원회의 의결에 따라 변경될 수 있으며 1차 심사 후 선정 작품을 공식 웹사이트에 공지하고 2차 심사 진출 참가자(팀)에게 개별 통보한다.\r\n\r\n● 2차 심사에서는 1차 심사에서 선정된 작품들에 대해 최종 심사를 진행하여 당선작 및 입상작들을 선정한다.\r\n\r\n● 심사위원회는 전문위원회의 기술분야검토 결과와 심사위원들의 최종 심사를 거쳐, 당선작 및 입상작들을 최종 선정한다.\r\n\r\n● 당선작 및 입상작들의 선정이 완료되면, 사업부서에서 준비한 양식에 맞춰 아래의 의견서를 작성한다.- 당선작에 대한 심사위원장의 심사 총평- 당선작에 대한 각 심사위원의 심사평과 보완사항- 입상작들에 대한 선정 사유\r\n\r\n\r\n\r\n4) 심사 기준\r\n\r\n● 심사의 목표는 본 공모의 목적에 가장 부합되는 최상의 설계안을 선정하는 데 있다.\r\n\r\n● 심사기준은 국토부 「건축 설계공모 운영지침(국토부고시 제2026-250호)」, 「지방자치단체 설계공모 운영요령(행정안전부 예규)」, 「설계공모, 기본설계 등의 시행 및 설계의 경제성 등 검토에 관한 지침 (국토교통부 고시)」, 「서울특별시 공공건축 설계공모 운영 기준」 등을 고려하여 심사위원회가 최종 결정한다.\r\n\r\n● 심사의 방법 및 운영 등은 심사위원회의 의결을 거쳐 변경될 수 있다.\r\n\r\n● 심사위원 사전간담회를 통해 심사위원 전원이 설계공모 지침 및 평가항목(평가의 주안점)을 확인하여야 한다.\r\n\r\n● 심사 기준 (평가의 주안점)\r\n\r\n\r\n\r\n평가항목\r\n\r\n세부 사항\r\n\r\n계획방향 및 공공성\r\n\r\n(15)\r\n\r\n- 공영주차장과 공공기여 시설에 대한 이해\r\n\r\n- 창의성, 실현 가능성 및 24시간 안전한 공공시설 계획\r\n\r\n주차·교통 및 동선계획\r\n\r\n(25)\r\n\r\n- 390대 이상 확보, 주차효율 및 출입구·대기·램프·회전 계획\r\n\r\n- 보차분리, 교통약자·업무차량·물류·소방·긴급차량 동선의 적정성\r\n\r\n- 미래 주차 수요 변화에 대한 가변성과 수용성\r\n\r\n공간계획 및 운영효율\r\n\r\n(20)\r\n\r\n- 시민안내센터, 서부관리소, 장애인콜택시 사무실 및 창고 조닝\r\n\r\n- 독립 출입·보안, 24시간 운영, 가변성 및 유지관리 효율\r\n\r\n배치·입면·안전·지속가능성·\r\n\r\n미래대응\r\n\r\n(30)\r\n\r\n- 주변 도시 컨텍스트와 시각적, 공간적 어울림 \r\n\r\n- 기후 조건에 대응하는 기술적‧환경적‧혁신적 외관(외피)\r\n\r\n- 지속가능한 재료의 사용, 효율적 에너지 시스템\r\n\r\n- 주차장 사용을 위한 구조의 합리성 및 혁신성 \r\n\r\n공사비 및 시공성\r\n\r\n(10)\r\n\r\n- 공사비 준수, 합리적인 구조·재료·설비·공법과 생애주기 비용\r\n\r\n- 도심 공사기간, 인접건물 영향, 단계별 시공의 적정성\r\n\r\n\r\n\r\n5) 작품 심사\r\n\r\n(1) 심사일반사항\r\n\r\n● 심사 전 준비 및 과정 관련- 심사위원 사전간담회를 통해 심사위원 전원이 설계공모 지침 및 평가항목(평가의 주안점)을   확인하여야 한다.- 심사위원회는 전문위원회의 검토결과인「기술분야검토서」를 확인하고 심사 반영 여부를   결정한다.\r\n\r\n● 심사 진행 방식 및 절차- 평가 방식은 토론에 기반한 투표제를 원칙으로 하며, 작품에 대한 토론과 평가를 거쳐   심사위원의 협의를 통해 당선작 및 입상작을 선정한다. (투표 방식은 심사위원회의 의결로   결정한다.)- 작품 토론에는 심사위원 전원이 참여해야 하며, 지침에 명시된 사업 목적과 공모 목적을   바탕으로 제출안을 충분히 토론한 후 평가한다.\r\n\r\n● 결과 및 공정성 확보 관련- 1차 심사와 2차 발표 심사 과정은 전체 녹화되며, 2차 발표 심사는 정보통신 매체 등을 통해   실시간으로 공개한다. 구체적인 공개 방식은 서울특별시 설계공모 웹사이트   (https://project.seoul.go.kr)를 통해 공지한다.\r\n\r\n\r\n\r\n(2) 실격 기준\r\n\r\n● 아래 사유에 해당하는 작품은 심사위원의 합의에 따라 심사와 관계없이 탈락시킬 수 있으며, 사후에 발견된 경우에도 심사위원회의 결정에 따라 수상을 취소할 수 있다.- 사전에 심사위원과 접촉을 시도한 경우- 직·간접적으로 심사에 영향을 미치는 부당한 청탁이나 압력을 행사한 경우- 익명성 유지 등 공정한 평가에 영향을 미칠 의도로 불공정 행위를 한 경우- 제출 도서에 업체를 특정할 수 있는 문구나 이미지, 번호, 기호 등이 포함된 경우- 제출 도서의 규격 등을 현저히 위반한 경우- 제출한 서류에 허위 사실이 있거나 과제 누락 등 중대한 미비 사항이 발견된 경우- 응모안 제출 후 건축사사무소 개설신고의 효력상실처분, 휴업, 폐업, 업무정지 등의    행정처분을 받았거나 이를 숨기고 응모한 사실이 발견된 경우- 저작권법을 중대하게 위반한 경우- 최종 심사 결과 발표 이전에 작품을 공개한 경우(SNS 포함)\r\n\r\n● 발표자는 2차 심사 당일, 따로 공지할 시간까지 지정된 장소에 참석하여야 하며, 공지한 시간까지 지정한 장소에 참석하지 않는 경우, 작품설명 대상에서 제외하며 심사 대상에서 탈락하는 것으로 간주한다. - 단, 사전에 주최 측에 미리 연락하고, 심사위원들이 전원 일치로 합의하여 특별한 사정으로   인정하면 마지막 순서로 발표를 진행할 수 있다.\r\n\r\n(3) 1차 심사  \r\n\r\n● 심사일시: 2026.12.08(화) 09:00\r\n\r\n● 심사장소: 서울도시건축전시관 디지털심사장\r\n\r\n● 심사방법: 디지털 패널 심사- 1차 심사는 디지털 패널 심사로 진행하며, 설계도서에 대한 평가를 통해 2차 심사에 참여할  5개의 작품을 선정한다. 다만, 1차 공모 참여자가 7개 이하인 경우 원활한 심사를 위해 1차   심사를 생략할 수 있다.- 심사결과는 공식 웹사이트(https://project.seoul.go.kr)에 게시하고, 2차 심사 대상자에게   유선과 서면으로 통보한다.\r\n\r\n\r\n\r\n(4) 2차 심사 \r\n\r\n● 심사일시: 2026.12.15.(화) 09:00\r\n\r\n● 심사장소: 서울도시건축전시관 디지털심사장\r\n\r\n● 심사방법: 발표심사\r\n\r\n● - 발표자는 공모 공고일 이전부터 재직하고 작품 계획에 참여한 설계자에 한하며, 발표 당일   재직기간이 명시된 재직증명서(배석자 포함)를 제출하여야 한다. 발표 시 발표자 외 배석자   3인까지 참석할 수 있다.- 발표시간 10분, 질의응답 10분 이내로 실시한다.- 발표 순서는 당일 현장에서 추첨으로 정한다.- 발표에는 사전에 제출한 PDF 발표자료만 사용이 가능하며, 제출자는 이를 수정하거나   대체하여 발표할 수 없다.\r\n\r\n● 2차 심사는 유튜브 생중계로 진행할 예정이며, 공개 심사 시 참가자는 이에 따라야 한다.\r\n\r\n● 2차 심사 일시 및 방법은 변경될 수 있으며, 변경 시 참가자에게 사전 공지한다. \r\n\r\n\r\n\r\n1.17. 결과 공고 \r\n\r\n● 결과는 심사종료 이후 공식 웹사이트와 세움터에 게시하며 국내 주요 매체를 통해 공개한다.\r\n\r\n\r\n\r\n1.18. 시상\r\n\r\n● 1등 당선자는 발주처와 설계계약을 체결하고 설계권과 설계의도구현권을 가진다.※ 설계의도 구현권에 대한 비용은 「공공발주사업에 대한 건축사의 업무범위와 대가기준」 제11조 제3항에 따라 실비정액가산 방식 또는 설계비 요율 방식으로 산정하여, 상호 협의를 통해 결정한다.\r\n\r\n● 심사 결과, 공모 목적에 적합하지 않거나 작품 수준이 현저히 떨어진다고 의결하는 경우 1등작을 선정하지 아니할 수 있으며, 또한 입상작의 수를 조정할 수 있다. \r\n\r\n\r\n\r\n(1) 보상금 지급 방법\r\n\r\n● 국내 참가자는 한국 원화를 기준으로 지급하며, 국외 입상자의 경우 상금을 지급 시점(시상식 이후 30일 이내) 환율 기준으로 환산하여 미화(USD)로 지급한다.\r\n\r\n(2) 보상금\r\n\r\n● 1등자 외의 입상자에게는 등위에 따라 다음과 같이 응모대표자에게 보상비 총액 90백만 원을 차등 지급한다. \r\n\r\n등위\r\n\r\n보상비\r\n\r\n보상 내용(제세금 포함)\r\n\r\n1등(1작품)\r\n\r\n-\r\n\r\n기본 및 실시설계 계약 체결 우선 협상권\r\n\r\n2등(1작품)\r\n\r\n36백만원\r\n\r\n설계보상비의 40%\r\n\r\n3등(1작품)\r\n\r\n27백만원\r\n\r\n설계보상비의 30%\r\n\r\n4등(1작품)\r\n\r\n18백만원\r\n\r\n설계보상비의 20%\r\n\r\n5등(1작품)\r\n\r\n9백만원\r\n\r\n설계보상비의 10%\r\n\r\n※ 동순위자가 발생한 경우 보상 = 동일 점수 입상자의 보상금 합계/동일 점수 입상자의 수※ 입상작의 수가 조정될 경우 보상금액은「건축 설계공모 운영지침(국토부 고시, 제2026-250호)」에 따른다.\r\n\r\n● 발주기관은 1등 당선자가 우선 협상권을 포기하거나 부득이한 사유로 계약을 할 수 없는 경우 차순위 입상자에게 협상권을 부여할 수 있다. 이 경우 계약을 체결한 차순위 입상자는 수령한 보상금을 반환하여야 하며, 발주기관은 반환된 보상금을 1등 당선자에게 지급한다. \r\n\r\n\r\n\r\n1.19. 계약 \r\n\r\n1) 계약주체\r\n\r\n● 우선협상대상자는 국내법에 따라 발주처(㈜용산라이프시티PFV)와 직접 계약을 진행한다. \r\n\r\n● 공모 주관(서울특별시)은 1등작 선정까지 과정을 관리하며, 선정 이후 모든 계약 진행 및 절차는 발주처의 책임하에 진행한다. \r\n\r\n\r\n\r\n2) 계약 및 과업수행\r\n\r\n● 당선자는 우선협상대상자로서 발주처와 설계 계약을 체결할 우선 협상 권한을 가지며, 당선자가 없는 경우, 발주기관은 차순위 입상자와 승계하여 계약 체결을 협상할 수 있다.\r\n\r\n● 설계용역 계약은 대한민국 관계 법령 및 서울특별시 규정에 따르며, 계획설계·중간설계 및 실시설계와 이에 부수되는 인허가 등 행정절차의 수행을 포함한다.\r\n\r\n● 당선자는 용역 계약 시 통신·소방·기계(설비)분야 등의 설계자격이 없는 경우 다음과 같은 유자격 업체와 공동도급(분담이행방식, 5인 이내)으로 계약하여 본 용역을 진행하여야 하며, 이 경우 공모당선자가 대표자가 된다.- 정보통신분야 설계는 「정보통신공사업법」에 의한 설계유자격자- 소방분야 설계는 「소방시설공사업법」에 의한 일반소방시설 설계업(기계, 전기) 또는 전문소방시설 설계업을 등록한 자- 기계(설비)분야 설계는 엔지니어링 사업자로 등록한 자 또는 「기술사법」 제6조에 따라 기계분야의 공조냉동기계 또는 건설분야의 건축기계설비 기술사사무소를 개설한 자\r\n\r\n● 설계 계약 체결 기간은 특별한 사유가 없는 한 심사 결과 발표일로부터 60일 이내로 한다. 다만, 발주기관의 사정, 사업의 추진 여건에 따라 계약 상대자와 협의하여 계약 체결 기한을 조정할 수 있다.\r\n\r\n● 당선자는 사업에 필요한 다른 엔지니어, 특수 컨설턴트 등과 협업을 하고자 하는 경우 발주기관과 사전 협의하며 승인을 얻어야 한다. \r\n\r\n● 당선자는 발주기관의 사전 승인 없이 계약의 모든 사항에 대하여 하도급 계약을 할 수 없다. \r\n\r\n● 발주기관은 관련 예산, 정책, 사업계획의 변경, 심사위원회 보완 요구 등의 사유로 당선작의 수정을 요구할 수 있으며, 설계자는 그 적정성을 협의 후 계약 내용에 반영해야 한다. 단, 설계 변경 시 협상에 의하여 설계비는 변경될 수 있다.\r\n\r\n● 당선자는 이 사업을 성실하게 수행하고, 설계용역 수행 시 각종 법령이 정하는 모든 필요한 업무를 수급자 부담으로 이행하여야 하며, 발주기관은 이를 이행하기 위해 필요한 자료 제출 등의 업무수행에 협조하여야 한다.\r\n\r\n\r\n\r\n3) 공동수급체의 계약\r\n\r\n● 공동계약 시 건축사 업무 신고를 필하고, 계약 체결 당시 대한민국 법률에 의한 결격사유(부정당 업체)에 해당되지 않는 자를 대상으로 한다.\r\n\r\n● 공동으로 응모하는 경우, 구성원별 최소 지분율은 5% 이상으로 해야 하며 구성원 중 참여지분율(출자비율)이 가장 많은 1인을 대표자로 선임하여 등록해야 한다.\r\n\r\n● 국내 건축사와 외국 건축사가 공동수급체를 구성하여 계약할 시 아래의 사항을 준수하여야 한다. - 외국 건축사 자격을 가진 개인이나 법인이 한국 건축사와 공동계약을 구성할 때에는 업무단계(계획설계, 중간설계, 실시설계)에 따른 각 공동참여자의 구체적인 업무를 명시한 업무 분담계획서를 제출하고, 이에 따른 공동참여자 간 협정서(지분을 포함)와 대표자 선임계를 주최자와 기본 및 실시설계용역 계약 시 제출한다.- 공동수급체의 대표는 국내 건축사로 한다.- 대한민국 건축사법에 따라 계약서는 한국어로 작성한다.\r\n\r\n\r\n\r\n4) 계약의 무효 및 승계\r\n\r\n● 당선자에게 실격 사유가 발견된 경우 계약 체결 전에는 당선을 무효로 하며, 계약 체결 이후에는 체결된 계약을 무효(선금 및 기성금 회수)로 하고 관련 법령에서 정한 사업 지연에 따른 민·형사상의 책임을 진다. 기타 입상작의 경우에는 입상 무효와 함께 보상금을 회수하며 경우에 따라 민·형사상의 책임을 진다.\r\n\r\n● 당선자가 계약 시와 계약 후 업무를 수행함에 있어 관계 법령에 따른 자격 및 면허 등을 갖추지 못한 경우 용역 수행이 불가능하므로 차순위 자에게 계약 우선 협상권이 전환된다.\r\n\r\n● 당선자가 제출한 공모안의 내용이 고의적으로 왜곡되거나 진실과 부합되지 않는 경우, 당선자(설계자)는 본인의 비용으로 설계를 변경하여 발주기관이 수용할 수 있는 일정 내에서 사업을 추진할 수 있도록 해야 하며, 이러한 노력을 거부하거나 노력에도 불구하고 예산 초과나 기술적 사유 등으로 사업 진행에 심각한 차질이 생길 경우 발주기관은 설계자와의 계약을 해약할 수 있다. \r\n\r\n● 발주처는 계약 체결 이전에 불가피한 사정으로 이 사업을 전면 취소하는 경우에는 당선자에게 2등 입상자의 공모 보상비의 2배의 비용을 지급한다.\r\n\r\n1.20. 설계의도구현\r\n\r\n● 설계의도구현비: 159,393천 원 (부가세 별도)\r\n\r\n● 설계자는 「건축서비스산업 진흥법」제22조에 따라 ‘설계의도 구현’을 위한 별도의 용역계약을 하고 설계도서 해석 및 자문, 자재 및 장비의 선정 검토, 시공상세도 및 디자인 검토, 건축물대장 및 현황도 등록 등의 업무를 수행하여야 한다.\r\n\r\n● 설계의도 구현 대가는 ‘2024년 서울특별시 공공건축물 건립 공사비 책정 가이드라인’ 기준에 따른다.\r\n\r\n\r\n\r\n1.21. 기타\r\n\r\n1) 저작권\r\n\r\n● 응모 작품은 창작품이어야 하며 타인의 저작권을 침해해서는 안 된다. 타인의 저작권 침해에 따른 모든 책임은 참가자(팀)에게 있으며, 타인의 저작권을 침해했을 경우 수상을 취소한다.\r\n\r\n● 응모 작품의 모든 권리(저작권, 소유권 포함)는 참가자(팀)에게 있으며 발주기관은 필요한 경우 참가작에 관한 저작권을 양도받거나 이용 허락을 받을 수 있으며, 이 경우에는 참가자(팀)와 별도로 약정한다.\r\n\r\n● 다만, 발주기관은 참가작품에 대해 참가자(팀)와 별도의 보상이나 협의 없이 상업적 이익을 목적으로 하지 않는 콘텐츠 관련 사업(아카이빙, 저작물 복제, 전시, 배포, 공중송신, 2차 저작물 작성)과 출판물(백서 제작 및 판매)에 이용할 수 있다. 참가자는 이상의 전시, 게재 및 발간에 적극적으로 협조하여야 하며 응모 작품을 제출함으로써 이에 동의한 것으로 간주한다.\r\n\r\n\r\n\r\n2) 분쟁\r\n\r\n● 설계공모는 대한민국의 법률에 근거하여 집행되며 공모와 관련하여 분쟁이 발생하면, 대한민국에 있는 법원에서 조정하거나 판결한다.\r\n\r\n\r\n\r\n3) 전시 및 출판\r\n\r\n● 발주기관은 필요시 전시를 개최할 수 있으며, 설계공모 결과를 백서로 발간하여 시민에게 공개할 수 있으며, 참가자는 응모 작품을 제출함으로써 이에 동의한 것으로 간주한다.\r\n\r\n\r\n\r\n４) 익명성\r\n\r\n● 모든 제출자료에는 응모자를 인지할 수 있는 어떠한 암호나 기호, 작품 제목을 표기할 수 없다.\r\n\r\n● 웹사이트에 등록한 정보와 모든 제출물은 설계공모 전체 기간 동안 공개하지 않으며, 공정한 심사평가를 위하여 참가자 또한 결과 발표 시까지 SNS 등 매체를 통해 제출안의 전체 및 일부 등을 공개하지 않는다. 비공개 의무를 이행하지 않았을 경우 시상을 취소할 수 있다.\r\n\r\n\r\n\r\n５) 기타\r\n\r\n● 본 지침에서 명시하지 아니한 사항은 「건축 설계공모 운영지침」 (국토교통부고시 제2026-250호, 2026. 7. 1. 시행)을 준용한다.\r\n\r\n2. 설계지침\r\n\r\n2.1. 기본 방향\r\n\r\n● 보행자 중심의 안전한 공간 및 최적의 주차 환경 확보 : 차량과 보행 동선의 명확한 분리, 보행 안전을 고려한 충분한 차로 폭 확보, 차량 및 장치 주행 시 소음·진동을 최소화할 수 있는 바닥 마감 재료 및 구조 형식을 설정하여 이용 편의성과 안전성을 극대화한다. \r\n\r\n● 유연성, 안전성 및 지속가능한 공공성 확보 : 24시간 안전한 CPTED 방재·보안 체계를 구축하고, 기부채납 시설의 운영계획 변경 및 미래 기술 확장성에 유연하게 대응할 수 있는 가변적 공간 구조와 도시 맥락에 부합하는 공공성을 구현한다.\r\n\r\n● 미래 주차 수요 변화에 대한 대응  : 지속가능성, 미래 모빌리티(전기차, 공유차량 등) 등 주차 수요 변화 등에 대응하고 태양광 발전, 지열에너지 등 친환경 시스템을 적극 도입한다.\r\n\r\n\r\n\r\n2.2. 설계의 주안점\r\n\r\n1) 필수 주차 규모 및 공간 배치 기준 \r\n\r\n● 주차 규모 : 현행 관련 법규 및 지침 기준에 따라 총 390대 이상의 주차 대수를 반드시 확보하여야 한다. \r\n\r\n● 동선 분리 및 부속시설 조닝 : 차량과 보행 동선을 명확히 분리하고, 시민안내센터, 서부관리소, 장애인콜택시 사무실, 따릉이 거점센터 등 부속 업무시설의 독립적인 출입·보안·물류 동선을 반영하여야 한다.\r\n\r\n\r\n\r\n2) 교통·동선 및 구조·건축 기준 (차로 폭, 층고, 소음저감 바닥재 등) \r\n\r\n● 차로 폭 및 보차분리 : 보행자의 안전과 쾌적한 보행 환경을 우선적으로 고려하여 차로 폭 기준을 최대한 넓게 확보하고, 보행자 및 차량 동선을 명확히 분리하여야 한다. \r\n\r\n● 층고 및 유효 높이 기준 : 개정 주차장법 관련 기준을 준수하여 차로 및 통로 높이 2.3m 이상, 출입구 너비 6.0m 이상 유효높이 3.5m 이상을 확보하며, 주차단위구획 높이는 2.3m 이상 확보하도록 계획하여야 한다. 아울러, 지상 1층은 화물 차량 진출입과 정차 등을 고려하여 유효고 3.5m 이상을 확보한다. \r\n\r\n● 소음 및 진동 저감 계획 : 차량 및 주차장치 주행 시 발생하는 소음·진동을 최소화할 수 있는 저소음·고내구성 바닥 마감 재료 및 진동 감쇄형 구조 형식을 설정하여 제안하여야 한다. \r\n\r\n● 진출입 램프 및 전면공지 : 경사로 곡선부 내변반경 6m 이상, 차단기 전면 대기공간 및 만차 시 회차 동선을 확보하여야 한다. \r\n\r\n● 유형별 주차구획 확보 : 서울특별시 주차장 설치 및 관리 조례에 따라 유형별 주차구획을 관련 법규 및 기준에 맞게 확보하여야 한다.\r\n\r\n2.3. 세부 설계지침\r\n\r\n1) 실별 프로그램 면적표(안)\r\n\r\n\r\n\r\n구 분\r\n\r\n세부시설\r\n\r\n면적(㎡)\r\n\r\n비율(%)\r\n\r\n비 고\r\n\r\n공영주차장\r\n\r\n주차공간\r\n\r\n19,441\r\n\r\n-\r\n\r\n390대 이상\r\n\r\n공 용 부\r\n\r\n홀, 계단, ELV, 전기‧기계실, 화장실(장애인, 가족화장실 포함), 수유실 등\r\n\r\n자전거 주차장\r\n\r\n1층 배치, 자동차 주차 대수의 40%(250~300㎡)\r\n\r\n소 계\r\n\r\n19,441\r\n\r\n93.3\r\n\r\n\r\n\r\n업무 시설  \r\n\r\n\r\n\r\n(부속 용도)\r\n\r\n시민\r\n\r\n안내\r\n\r\n센터\r\n\r\n시민안내센터\r\n\r\n100\r\n\r\n-\r\n\r\n7명 근무, 주출입부 인접, 민원·안내·방재·관제\r\n\r\n직원(미화원)휴게실\r\n\r\n50\r\n\r\n남/여 구분\r\n\r\n탕비실\r\n\r\n20\r\n\r\n\r\n\r\n소 계\r\n\r\n170\r\n\r\n\r\n\r\n서부\r\n\r\n관리소\r\n\r\n사무실\r\n\r\n100\r\n\r\n-\r\n\r\n근무인원 10명\r\n\r\n회의실\r\n\r\n60\r\n\r\n탕비실 포함\r\n\r\n샤워실\r\n\r\n30\r\n\r\n남/여 구분\r\n\r\n창 고\r\n\r\n170\r\n\r\n사무공간과 분리, 외부 출입동선 별도 확보\r\n\r\n소 계\r\n\r\n360\r\n\r\n\r\n\r\n장애인\r\n\r\n콜택시\r\n\r\n사무실\r\n\r\n94\r\n\r\n-\r\n\r\n사용인원 12명, 독립 출입‧보안\r\n\r\n회의실(교육장)\r\n\r\n78\r\n\r\n교육 및 회의 겸용, 외부 출입동선 별도 확보\r\n\r\n소 계\r\n\r\n172\r\n\r\n\r\n\r\n따릉이\r\n\r\n거점센터\r\n\r\n사무실\r\n\r\n150\r\n\r\n-\r\n\r\n\r\n\r\n보관소\r\n\r\n435\r\n\r\n자전거 정비·보관\r\n\r\n소 계\r\n\r\n585\r\n\r\n\r\n\r\n기 타\r\n\r\n창 고\r\n\r\n120\r\n\r\n-\r\n\r\n별도 구획, 1톤 화물차 하역·물류동선 확보\r\n\r\n소 계\r\n\r\n1,407\r\n\r\n6.7\r\n\r\n\r\n\r\n총 연면적\r\n\r\n20,848\r\n\r\n100\r\n\r\n세부 면적은 반올림하여 표기함. 총연면적은 20,847.64㎡ 이하로 함.\r\n\r\n\r\n\r\n● 건축 규모는 지하 4층·지상 10층 내외로, 층수·높이·연면적 허용범위는 확정된 도시관리계획과 공고 조건을 따라 설계자가 합리적으로 제안한다.\r\n\r\n● 전체 연면적은 20,847.64㎡ 이하로 계획하여야 한다.\r\n\r\n● 세부시설 간 공간구성은 각 시설의 기능과 운영조건을 충족하는 범위에서 기준 면적의 ±10% 범위 내에서 합리적이고 창의적으로 제안할 수 있다.\r\n\r\n● 필로티, 발코니 등 연면적에 포함되지 않는 면적은 구분하여 설계개요와 면적표에 별도 표기한다.\r\n\r\n2) 시설별 고려사항\r\n\r\n\r\n\r\n시설명\r\n\r\n세부 고려사항\r\n\r\n시민안내센터\r\n\r\n- 차량 출입구와 보행 주출입부에 인접하여 민원응대·안내·방재·관제 기능을 수행\r\n\r\n- 7명 근무를 기준으로 안내데스크, 업무석, 관제모니터, 수납 및 내부회의 공간을 계획\r\n\r\n- 민원영역과 운영·전산·보안영역을 분리하고 휠체어 이용이 가능한 상담구간을 설치\r\n\r\n서부관리소\r\n\r\n- 10명 사무실, 60㎡ 회의실·탕비, 남녀 샤워실 각 15㎡와 170㎡ 창고를 연계하되 사무·물류 동선을 분리\r\n\r\n장애인 콜택시\r\n\r\n- 통신·배차·상담업무를 지원, 전원·데이터·흡음·프라이버시 조건을 고려\r\n\r\n- 휠체어 사용자의 접근, 회전, 근무 및 피난을 고려한 좌석 배치 및 유니버설디자인 적용\r\n\r\n- 회의실(교육장)은 외부 참석자가 사무실을 통과하지 않고 교육장과 공용화장실을 이용할 수 있도록 계획하고 교육·회의·브리핑에 활용 가능한 가변가구, AV, 차광 및 음향설비를 계획\r\n\r\n따릉이\r\n\r\n거점센터\r\n\r\n- 서울시 공공자전거(따릉이) 배송 및 정비 센터로 배송 및 정비 인력의 사무·휴게 공간과 공공자전거 관제 거점 역할, 공공자전거의 일상 정비와 입출고 및 보관\r\n\r\n기타 창고\r\n\r\n- 폐기물·소모품·자재·장비를 분리 보관하고 1톤 화물차 접근·하역, 방화·환기·오염관리를 고려\r\n\r\n\r\n\r\n\r\n\r\n3) 분야별 설계지침\r\n\r\n(1) 설계 시 고려사항\r\n\r\n● 대지·도로·교통·지구단위계획과 관계 법규를 종합 검토하여 사업규모, 주차 대수, 주차장 외 용도 비율 및 예정 공사비를 준수하여야 한다.\r\n\r\n● 24시간 운영과 장기 유지관리의 경제성을 확보하고, 전기차 화재·침수·정전 시에도 피난 및 관제 기능이 유지되는 방재·안전 계획을 수립하여야 한다. \r\n\r\n\r\n\r\n(2) 배치계획 및 동선계획\r\n\r\n● 차량 출입구는 외부 도로 정체와 보행로 단절을 최소화하도록 진출입 분리, 대기공간 및 만차 시 회차 동선을 계획하여야 한다. \r\n\r\n● 보행자의 안전한 이동을 위해 차로 폭을 최대한 확보하고, 각종 출입차량의 회전궤적, 경사로 곡선부 내변반경 6m 이상을 준수하여야 한다. \r\n\r\n\r\n\r\n(3) 평면계획\r\n\r\n● 주차구획, 차로, 기둥, 코어, 램프 및 설비공간을 통합 모듈로 계획하여 사각 주차면과 잔여 공간을 최소화한다.\r\n\r\n\r\n\r\n(4) 입면 및 단면계획\r\n\r\n● 단조로운 외관을 지양하고 자연환기·채광을 확보할 수 있는 친환경 입면을 계획하여야 한다. \r\n\r\n● 건물이 위치한 지역의 환경과 미래 변화를 고려한 외관디자인을 제안하여야 한다. \r\n\r\n● 자연환기와 채광을 확보하면서 차량 전조등, 소음, 매연, 낙하물과 우천 영향을 조절하고 경제적인 층고와 차량 유효높이를 확보한다.\r\n\r\n● 차량 및 이동장치의 반복 주행에 따른 소음·진동을 저감할 수 있는 저소음·고내구성 마감 재료(표면 강화 및 저소음 코팅재 등)를 제안하여야 하며 하중과 진동을 효과적으로 감쇄하고 미끄럼 방지, 균열·누수 점검 및 보수가 용이한 구조 형식을 적용하여야 한다. \r\n\r\n● 지상 1층의 층고는 화물용 차량의 진출입과 임시 정차 등을 고려하여 유효층고 3.5m 이상을 확보하여야 한다.\r\n\r\n● 지하층의 층고는 서비스 차량의 출입을 고려하여 충분한 층고를 확보한다.\r\n\r\n● 주차장 외 부속 사무공간 및 서비스 공간들은 사용에 부족함이 없도록 적절한 천장고 및 층고를 확보하여야 한다.\r\n\r\n\r\n\r\n(5) 재료 및 마감계획\r\n\r\n● 내·외부 재료는 불연·난연성, 내오염성, 내염화물성, 방수·방습, 시공성, 부분교체 및 유지 관리성을 종합적으로 고려한다.\r\n\r\n● 주차바닥과 배수시설은 차량하중, 오일·염화물, 반복 청소와 미끄럼에 견디며 균열·누수·물고임의 점검과 보수가 용이하도록 한다.\r\n\r\n\r\n\r\n(6) 보안계획\r\n\r\n● CPTED 원칙을 적용하여 출입구, 램프, 주차구역, 보행통로, 코어, 창고 및 외부경계부의 사각지대를 최소화하고 CCTV·비상통화를 연계한다.\r\n\r\n● 업무시설과 공용 주차공간의 출입통제선을 명확히 하고 시민안내센터, 서부관리소, 장애인콜택시 사무실과 창고에 권한별 보안을 적용한다.\r\n\r\n\r\n\r\n(7) 설비계획 \r\n\r\n● 주차유도, 차량번호인식, 요금정산, CCTV, 출입통제, 비상통화, 전기차 충전과 시설관리시스템을 통합 가능한 정보통신 기반으로 계획한다.\r\n\r\n● 환기·소방·배연·배수·비상전원은 차량화재, 전기차 열폭주, 집중호우, 침수와 정전 시에도 피난·소방·관제 기능이 유지되도록 계획한다.\r\n\r\n\r\n\r\n(8) 에너지절약 및 친환경계획\r\n\r\n● 환경적 특성, 경제성, 효율성, 쾌적성 등을 고려하여 에너지절감 요소 기술을 도입하고 LCC(생애주기비용)를 감안한 최적설계가 되도록 계획한다.\r\n\r\n● 에너지 소비를 최소화할 수 있도록 외피 개방률 계획, 선형열교 방지계획, 자연채광, 자연환기(통풍) 등을 활용하여 주차동선 및 주차구역의 배치, 공간구성, 외피설계에 적용한다.\r\n\r\n● 주요 공간인 주차구역 및 보행동선은 자연채광을 적정 수준으로 활용하여, 자연채광 자급 공간비율(spatial Daylight Autonomy, sDA300, 50%)을 확보하는 동시에, 주·야간 운전자의 명암 순응을 돕고 직사광선으로 인한 눈부심(현휘)을 방지할 수 있도록 계획한다.\r\n\r\n● 건강한 실내환경과 지속가능한 환경친화형 주차빌딩 구현을 위해 차량 배기가스 배출을 위한 지능형 환기 시스템, 지하층 결로 방지를 위한 제습·통풍 계획, 스마트 LED 조명 제어시스템을 포함하여 최적의 설비 제어시스템을 제안한다.\r\n\r\n\r\n\r\n● 신재생에너지 설비 도입 등 에너지 절약과 관련된 규정을 검토하고, 신재생에너지 시스템(태양광 패널 등) 구성 및 규모 산정 시 주차빌딩의 상시 전기차 충전 전력 수요 및 조명·환기 부하 특성을 반영하여 계획한다.\r\n\r\n\r\n\r\n(9) 기타계획\r\n\r\n● 차량 반복하중, 진동·충격, 지진, 지하수압과 장기처짐을 고려한 구조계획을 수립하고 지하 4층 굴착과 인접시설의 안전을 확보한다.\r\n\r\n● 무장애 동선, 통합 사인·웨이파인딩, 자전거·개인형 이동장치, 도심 공사 중 교통·보행·소음·분진 저감 및 공사비·시공성을 종합 검토한다.\r\n\r\n● 대상지 주위 주거시설에 빛 공해, 소음 공해 등의 방지를 고려한다.\r\n\r\n\r\n\r\n(10) 실내공간 설계지침\r\n\r\n● 건축과 인테리어, 가구, 사인, 조명 및 정보통신을 통합하여 공영주차장과 업무시설의 일관된 공간 정체성을 구현한다.\r\n\r\n● 교통약자와 외국인도 쉽게 이용하도록 무장애·유니버설디자인과 직관적인 층·구역·출구 안내체계를 적용한다.\r\n\r\n\r\n\r\n4) 대상지 관련 법규\r\n\r\n●  「국토의 계획 및 이용에 관한 법률」, 용산전자상가지구 지구단위계획 및 세부개발계획\r\n\r\n●  「건축법」 및 하위법령\r\n\r\n●  「주차장법」 및 하위법령, 「서울특별시 주차장 설치 및 관리 조례」\r\n\r\n●  「소방시설 설치 및 관리에 관한 법률」, 「화재의 예방 및 안전관리에 관한 법률」 및 하위법령\r\n\r\n●  「녹색건축물 조성 지원법」, 「건축물의 에너지절약설계기준」, 「신에너지 및 재생에너지  개발·이용·보급 촉진법」\r\n\r\n●  「장애인·노인·임산부 등의 편의증진 보장에 관한 법률」, 「교통약자의 이동편의 증진법」 및  BF 관련 기준\r\n\r\n●  「전기안전관리법」, 「개인정보 보호법」 및 기타 본 사업의 건축·교통·소방·환경·안전 관련 법령\r\n","./references/official-qa-pl.md":"# Yongsan: 70 oficjalnych pytań i odpowiedzi\r\n\r\nOryginał: 16 października 2026 r., 9 stron z okładką. Numery stron liczą okładkę jako stronę 1. Tłumaczenie pomocnicze na polski; w razie rozbieżności obowiązuje oficjalny oryginał koreański.\r\n\r\nOficjalne odpowiedzi stanowią uzupełnienie lub zmianę regulaminu i wytycznych konkursu.\r\n\r\n## 1 · PDF, strona 2\r\n\r\nPytanie\r\n\r\nPunkt 2.2 wytycznych wymaga co najmniej 390 miejsc parkingowych, lecz nie określa odrębnego standardu sposobu parkowania. Czy przy spełnieniu przepisów oraz wymagań bezpieczeństwa i eksploatacji można połączyć parking z samodzielnym dojazdem do miejsc z parkingiem mechanicznym?\r\n\r\nOdpowiedź\r\n\r\nNależy zapewnić 390 miejsc z samodzielnym dojazdem; parkingu mechanicznego nie należy uwzględniać.\r\n\r\n## 2-1 · PDF, strona 2\r\n\r\nPytanie\r\n\r\nPotwierdzenie odsunięcia nieprzekraczalnej linii zabudowy na działce 2: czy wynosi 1 m?\r\n\r\nW obwieszczeniu wskazano „od tyłu, od północy: 1,5 m; od tyłu, działka 2: 1 m”. Na rysunku decyzji północno-zachodni bok działki 2 ma oznaczenie 1 m, a 1,5 m wydaje się dotyczyć północnego boku działki 1. Prosimy potwierdzić, czy na działce 2, także od północy, obowiązuje 1 m. Czy na bokach bez wskazanej linii zabudowy, przy zachodnim i południowym odcinku drogi 3-64, jedynym kryterium odsunięcia jest linia ograniczająca położenie elewacji, 3 m?\r\n\r\nOdpowiedź\r\n\r\nPołudniowy bok działki 2 przy drodze 3-64 nie podlega nieprzekraczalnej linii zabudowy 3 m. Obowiązuje linia ograniczająca położenie elewacji 3 m, z zapewnieniem wysokości co najmniej 9 m, odpowiadającej 3 kondygnacjom, przy rozwiązaniu na słupach (pilotis), oraz wymagania dotyczące otwartej przestrzeni na działce.\r\n\r\nOznaczenia na wspólnym schemacie odpowiedzi:\r\n- Rzut: intensywność zabudowy do 669,36%; wysokość do 45 m; powierzchnia zabudowy 90%; linie zabudowy 1,5 m, 1 m i 3 m; działka 2; droga 3-64; linia elewacji 3 m z wysokością co najmniej 9 m, 3 kondygnacje.\r\n- Przekrój: linia elewacji 3 m; linia zabudowy 1,5 m; parking; przy pilotis zapewnić co najmniej 3 kondygnacje; droga; ciąg pieszy 3 m i ciąg pieszy 1,5 m.\r\n- Niektóre drobne numery ewidencyjne w tle schematu rzutu są nieczytelne.\r\n\r\n## 2-2 · PDF, strona 2\r\n\r\nPytanie\r\n\r\nWyjaśnienie i zakres linii ograniczającej położenie elewacji przy drodze 3-64: 3 m, a przy pilotis wysokość co najmniej 9 m, 3 kondygnacje.\r\n\r\nCzy zapis nakazuje wykonanie pilotis w dolnej części budynku przy drodze 3-64, czy jedynie ustala wysokość, jeśli projektuje się pilotis? Linia przerywana występuje na rysunku tylko od południa, a od zachodu podano jedynie wymiar 3 m. Prosimy zaznaczyć, czy wymóg dotyczy całych zachodnich i południowych boków, czy tylko ich części.\r\n\r\nProsimy również określić głębokość pilotis, dopuszczalność parkowania samochodów, rowerów i oczekiwania pojazdów pod nim, sposób mierzenia 9 m, np. od podłogi do spodu stropu, oraz możliwość wysunięcia elewacji i lokowania parkingu lub funkcji towarzyszących powyżej pilotis.\r\n\r\nOdpowiedź\r\n\r\nPołudniowy bok działki 2 przy drodze 3-64 nie podlega nieprzekraczalnej linii zabudowy 3 m. Obowiązuje linia ograniczająca położenie elewacji 3 m, z zapewnieniem wysokości co najmniej 9 m, odpowiadającej 3 kondygnacjom, przy rozwiązaniu na słupach (pilotis), oraz wymagania dotyczące otwartej przestrzeni na działce.\r\nSchemat znajduje się we wspólnej odpowiedzi 2-1.\r\n\r\n## 2-3 · PDF, strona 2\r\n\r\nPytanie\r\n\r\nCzy działka 2 wymaga ogólnodostępnej przestrzeni otwartej i czy można za nią uznać przestrzeń pod pilotis?\r\n\r\nJeżeli na działce 2 jest ona wymagana, czy obowiązują minimalna szerokość 9 m oraz wysokość w świetle 8 m pod pilotis? Na rysunku przestrzeń o ustalonej lokalizacji zaznaczono wyłącznie przy narożniku Cheongpa-ro na działce 1. Czy pilotis przy drodze 3-64 stanowi taką przestrzeń, a jeśli tak, czy musi równocześnie spełniać wysokość 9 m i wysokość w świetle 8 m? Czy pod nim dopuszcza się przejazd, parkowanie i oczekiwanie pojazdów?\r\n\r\nOdpowiedź\r\n\r\nNa działce 2 nie trzeba urządzać ogólnodostępnej przestrzeni otwartej; przestrzeń o wskazanej lokalizacji powstaje wyłącznie na działce 1.\r\nPasy odsunięcia od linii zabudowy, w tym od linii elewacji, należy urządzić jako otwartą przestrzeń przed zabudową: chodnik i zieleń; dopuszcza się wjazdy i wyjazdy.\r\nPowierzchnie należy obliczać według właściwych przepisów i standardów.\r\n\r\n## 2-4 · PDF, strona 2\r\n\r\nPytanie\r\n\r\nKryteria otwartej przestrzeni przed zabudową.\r\n\r\nCzy ustalenia obwieszczenia dotyczące tej przestrzeni na terenie działki odnoszą się do działki 2? Jeśli tak, prosimy wskazać na rysunku lub w tabeli lokalizację, bok działki, szerokość, powierzchnię i zasady urządzenia, w tym udział chodnika i zieleni. Czy można zaliczać te same powierzchnie jednocześnie do przestrzeni przed zabudową, pasa odsunięcia od linii zabudowy, pasa odsunięcia od linii elewacji 3 m oraz ogólnodostępnej przestrzeni otwartej?\r\n\r\nOdpowiedź\r\n\r\nNa działce 2 nie trzeba urządzać ogólnodostępnej przestrzeni otwartej; przestrzeń o wskazanej lokalizacji powstaje wyłącznie na działce 1.\r\nPasy odsunięcia od linii zabudowy, w tym od linii elewacji, należy urządzić jako otwartą przestrzeń przed zabudową: chodnik i zieleń; dopuszcza się wjazdy i wyjazdy.\r\nPowierzchnie należy obliczać według właściwych przepisów i standardów.\r\n\r\n## 2-5 · PDF, strona 2\r\n\r\nPytanie\r\n\r\nPoczątek i koniec ogólnodostępnego ciągu pieszego o szerokości 5 m.\r\n\r\nObwieszczenie wyznacza początek i koniec naziemnego ciągu pieszego między Cheongpa-ro a parkingiem. Czy parking oznacza działkę 2? Jeśli tak, prosimy wskazać początek, koniec i przebieg na działce. Rysunek wydaje się pokazywać ciąg na działce 1. Jeżeli przebiega pod pilotis, prosimy wyjaśnić relację do wysokości pilotis i wymagań przestrzeni publicznej, obowiązek całodobowego udostępnienia oraz dopuszczalność przecinania ciągu 5 m przez wjazd i wyjazd pojazdów.\r\n\r\nOdpowiedź\r\n\r\nCiąg pieszy łączy się z parkingiem na działce 2 przez centralną ogólnodostępną przestrzeń otwartą na działce 1.\r\nPoczątek i koniec ciągu należy przyjąć według rysunku decyzji szczegółowego planu zagospodarowania.\r\nNależy odnieść się do pliku SketchUp oraz dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 3-1 · PDF, strona 2\r\n\r\nPytanie\r\n\r\nCzy projekt konkursowy powinien opierać się na obecnym stanie terenu i otoczenia, czy na przyszłych zmianach środowiska miejskiego, w tym planowanych przebudowach i przekształceniach sąsiednich obszarów?\r\n\r\nOdpowiedź\r\n\r\nDziałka 1: odnieść się do pliku SketchUp i rzutu kondygnacji nadziemnej.\r\nPoza tym przy projektowaniu uwzględnić planowane przyszłe zmiany środowiska miejskiego w otoczeniu.\r\n\r\n## 3-2 · PDF, strona 2\r\n\r\nPytanie\r\n\r\nUkład i bryły budynków działki 1 w zwycięskim projekcie konkursowym różnią się od udostępnionego pliku SketchUp 3D. Które materiały należy przyjąć za podstawę projektu?\r\n\r\nOdpowiedź\r\n\r\nOdnieść się do pliku SketchUp oraz dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 4-1 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nCzy można udostępnić materiały oceny oddziaływania na ruch dla specjalnego obszaru planistycznego 8: pełny raport, uchwałę komisji i działania wynikające z oceny?\r\n\r\nOdpowiedź\r\n\r\nNie są udostępniane.\r\nOdnieść się do obwieszczenia decyzji o szczegółowym planie obiektów oraz dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 4-2 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nCzy można udostępnić projekt budynków biurowych i innych obiektów działki 1 oraz Seulskiego Centrum Weteranów: układ zabudowy, poziomy, komunikację, wjazdy na parkingi przypisane do budynków i kondygnacje podziemne?\r\n\r\nOdpowiedź\r\n\r\nOdnieść się do dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 4-3 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nSzczegółowe wytyczne obszaru podają, że nowa droga po południowej stronie służy dojazdowi do apartamentowca Nexus Valley. Czy planuje się przyszłe wjazdy i wyjazdy do Seulskiego Centrum Weteranów i innych obiektów przez nową drogę o szerokości 6 m?\r\n\r\nOdpowiedź\r\n\r\nNie planuje się dojazdu pojazdów na działkę 1 przez nową drogę 6 m.\r\nOdnieść się do dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 4-4 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nW związku z wymaganą wysokością w świetle parteru 3,5 m i jego różnymi sposobami użytkowania: czy należy uwzględnić wyłącznie wskazane pojazdy serwisowe, czy istnieją inne szczegółowe założenia, które można udostępnić?\r\n\r\nOdpowiedź\r\n\r\nNależy zapewnić wysokość w świetle parteru 3,5 m z uwzględnieniem wjazdu samochodu ciężarowego 2,5 t oraz zawracania na terenie parkingu.\r\n\r\n## 4-5 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nZakres „elastyczności” w kryteriach oceny i wytycznych.\r\n\r\nChodzi o zdolność przyjmowania zmian przyszłego zapotrzebowania na parking, strefowanie centrum informacji, zarządu zachodniego, biura taksówek dostępnych i magazynów, niezależne wejścia i bezpieczeństwo, całodobową eksploatację oraz sprawność utrzymania.\r\nCzy wystarczy umożliwić zmiany powierzchni między szczegółowymi funkcjami w obecnym zakresie powierzchni? Czy trzeba przewidzieć zmianę części parkingu na funkcję towarzyszącą? Jeżeli tak, czy możliwość zmiany należy rozpatrywać poza wymaganym przez miejską uchwałę udziałem parkingu wynoszącym 70%?\r\n\r\nOdpowiedź\r\n\r\nNależy uwzględnić możliwość przyszłych zmian powierzchni między funkcjami, czyli parkingiem i towarzyszącymi pomieszczeniami administracyjnymi, oraz zmian wymiarów miejsc parkingowych, zasad ich rozmieszczenia i podobnych parametrów.\r\n\r\n## 4-6 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nCzy rozbiórka istniejącego Yongsan Parking Building należy do zakresu tego zamówienia i czy zawiera się w planowanym koszcie budowy około 50,4 mld KRW, także na potrzeby planu etapowania?\r\n\r\nOdpowiedź\r\n\r\nRozbiórka jest uwzględniona w całkowitym koszcie przedsięwzięcia, 63 014 700 tys. KRW, czyli koszcie obiektu przekazywanego jako świadczenie publiczne.\r\nNie jest uwzględniona w zakresie tej budowy ani w planowanym koszcie budowy 50 411 760 tys. KRW; będzie oddzielnym zadaniem.\r\n\r\n## 4-7 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nCzy trzeba przewidzieć miejsca dla pojazdów serwisowych, czyli samochodów ciężarowych 1 t? Jeśli tak, jaka jest przewidywana liczba i czy można ją zaliczyć do wymaganych 390 miejsc?\r\n\r\nOdpowiedź\r\n\r\nProjektant może zaproponować miejsca dla pojazdów serwisowych i eksploatacyjnych w ramach całkowitej liczby 390 miejsc.\r\n\r\n## 4-8 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nCzy „zarząd zachodni” należy do Seoul Facilities Corporation? Jakie wykonuje zadania i jakie szczegóły należy uwzględnić przy jego projektowaniu?\r\n\r\nOdpowiedź\r\n\r\nZarząd zachodni to biuro Seoul Facilities Corporation odpowiedzialne za zintegrowane zarządzanie centrum informacji dla mieszkańców, biurem taksówek i centrum Ddareungi oraz pozostałymi obiektami. Odnieść się do szczegółowych wytycznych projektowych w punkcie 2.3.\r\n\r\n## 4-9 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nJakie szczegółowe kryteria dotyczą centrum Ddareungi, miejskiego systemu rowerów: planowane zatrudnienie według zawodów, w tym mechaników i pracowników biurowych, oraz wymagania planowania przestrzeni?\r\n\r\nOdpowiedź\r\n\r\nPlanowana liczba pracowników nie została ustalona. Odnieść się do szczegółowych wytycznych projektowych w punkcie 2.3.\r\n\r\n## 4-10 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nFormularz 13: opinia dotycząca planowanego kosztu budowy.\r\n\r\nCzy można udostępnić szczegółowe zasady obliczania powierzchni obudowy budynku „niekontaktującej się z gruntem”, w tym czy wlicza się otwarte elewacje naturalnie wentylowane: żaluzje, ekrany i blachę perforowaną?\r\n\r\nOdpowiedź\r\n\r\nDo powierzchni obudowy budynku należy wliczyć otwarte elewacje, których wykonanie generuje koszt budowy.\r\n\r\n## 4-11 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nCzy przewiduje się opracowanie nowego planu zagospodarowania dla budynków A i B Electronic Town?\r\n\r\nOdpowiedź\r\n\r\nBudynki A i B Hanshin Electronic Town znajdują się w obszarze planu szczegółowego rejonu Samgakji. Odnieść się do portalu przestrzennego Seulu: urban.seoul.go.kr.\r\n\r\n## 4-12 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nJakie są docelowe poziomy poszczególnych certyfikacji? Czy wystarczy ustalić, które obowiązują ustawowo, i spełnić poziom obowiązkowy lub wyższy?\r\n\r\nOdpowiedź\r\n\r\nNależy stosować certyfikacje wymagane prawem oraz poziomy nie niższe od obowiązkowych.\r\n\r\n## 4-13 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nCzy planuje się parking robotyczny, np. urządzenia automatycznie przemieszczające zaparkowane samochody?\r\n\r\nOdpowiedź\r\n\r\nObecnie nie, ale istnieje możliwość wprowadzenia go w przyszłości.\r\n\r\n## 4-14 · PDF, strona 3\r\n\r\nPytanie\r\n\r\nCzy można łączyć parking z parkingiem mechanicznym?\r\n\r\nOdpowiedź\r\n\r\nŁączenie z parkingiem mechanicznym jest niedopuszczalne.\r\n\r\n## 5-1 · PDF, strona 4\r\n\r\nPytanie\r\n\r\nWytyczne na s. 19 wymagają osobnego wskazania w opisie i zestawieniu powierzchni pilotis, balkonów i innych elementów niewliczanych do powierzchni całkowitej. Czy pilotis na działce można potraktować jako przestrzeń publicznego przejścia i wyłączyć z powierzchni kondygnacji?\r\n\r\nOdpowiedź\r\n\r\nPowierzchnie pilotis, balkonów i podobnych elementów, które są wyłączone z powierzchni kondygnacji i powierzchni całkowitej, lecz zwiększają powierzchnię obudowy budynku, należy wyodrębnić i wykazać osobno.\r\n\r\n## 5-2 · PDF, strona 4\r\n\r\nPytanie\r\n\r\nW związku z zapisem na s. 8, że plansze można komponować swobodnie, uwzględniając podane treści: czy można przyjąć inne skale planu zagospodarowania, rzutów, elewacji i przekrojów niż wskazane?\r\n\r\nOdpowiedź\r\n\r\nDla wygody i sprawności oceny zaleca się podane skale, lecz projektant może dobrać je samodzielnie zgodnie z zamysłem projektu.\r\n\r\n## 5-3 · PDF, strona 4\r\n\r\nPytanie\r\n\r\nW odniesieniu do ogólnodostępnej przestrzeni otwartej w obwieszczeniu decyzji planistycznej i mapy topograficznej na s. 863: wydaje się, że ten obiekt nie wymaga jej urządzenia. Czy jest ona obowiązkowa, czy należy ją zapewnić wyłącznie wtedy, gdy obiekt podlega takiemu obowiązkowi?\r\n\r\nOdpowiedź\r\n\r\nNa działce 2 ogólnodostępna przestrzeń otwarta nie jest wymagana; przestrzeń o ustalonej lokalizacji powstaje wyłącznie na działce 1.\r\n\r\n## 6-1 · PDF, strona 4\r\n\r\nPytanie\r\n\r\nProsimy podać projektowany poziom terenu działki 1.\r\n\r\nOdpowiedź\r\n\r\nWspólna odpowiedź na pytania 6-1 do 6-3, 7 oraz 8-1 i 8-2.\r\n\r\nPoza zapewnieniem wysokości w świetle parteru co najmniej 3,5 m projektant proponuje rozwiązanie w granicy wysokości budynku do 45 m.\r\nDroga 3-64 łączy się z ogólnodostępnym ciągiem pieszym działki 1; zależnie od różnicy poziomów można zaprojektować pochylnię.\r\nNie planuje się dojazdu pojazdów na działkę 1 przez drogę 3-64.\r\nIstniejącej drogi 3 m wewnątrz granic działek 1 i 2 nie należy uwzględniać; projekt przyjmuje, że nie będzie utrzymana.\r\nOdnieść się do pliku SketchUp oraz dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 6-2 · PDF, strona 4\r\n\r\nPytanie\r\n\r\nCzy przyszłe rozwiązanie drogi 3-64 zakłada połączenie pochylnią z działką 1? Prosimy również potwierdzić, czy droga przylegająca do ogólnodostępnego ciągu pieszego działki 1 na rysunku decyzji planu szczegółowego dopuszcza wjazd pojazdów.\r\n\r\nOdpowiedź\r\n\r\nWspólna odpowiedź na pytania 6-1 do 6-3, 7 oraz 8-1 i 8-2.\r\n\r\nPoza zapewnieniem wysokości w świetle parteru co najmniej 3,5 m projektant proponuje rozwiązanie w granicy wysokości budynku do 45 m.\r\nDroga 3-64 łączy się z ogólnodostępnym ciągiem pieszym działki 1; zależnie od różnicy poziomów można zaprojektować pochylnię.\r\nNie planuje się dojazdu pojazdów na działkę 1 przez drogę 3-64.\r\nIstniejącej drogi 3 m wewnątrz granic działek 1 i 2 nie należy uwzględniać; projekt przyjmuje, że nie będzie utrzymana.\r\nOdnieść się do pliku SketchUp oraz dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 6-3 · PDF, strona 4\r\n\r\nPytanie\r\n\r\nCzy różnica poziomów na granicy działek 1 i 2 będzie rozwiązana murem oporowym? Prosimy również podać układ kondygnacji podziemnych oraz funkcje budynków działki 1 sąsiadujących z działką 2.\r\n\r\nOdpowiedź\r\n\r\nWspólna odpowiedź na pytania 6-1 do 6-3, 7 oraz 8-1 i 8-2.\r\n\r\nPoza zapewnieniem wysokości w świetle parteru co najmniej 3,5 m projektant proponuje rozwiązanie w granicy wysokości budynku do 45 m.\r\nDroga 3-64 łączy się z ogólnodostępnym ciągiem pieszym działki 1; zależnie od różnicy poziomów można zaprojektować pochylnię.\r\nNie planuje się dojazdu pojazdów na działkę 1 przez drogę 3-64.\r\nIstniejącej drogi 3 m wewnątrz granic działek 1 i 2 nie należy uwzględniać; projekt przyjmuje, że nie będzie utrzymana.\r\nOdnieść się do pliku SketchUp oraz dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 7 · PDF, strona 4\r\n\r\nPytanie\r\n\r\nCzy istniejąca droga 3 m w północnej części terenu musi zostać zachowana?\r\n\r\nOdpowiedź\r\n\r\nWspólna odpowiedź na pytania 6-1 do 6-3, 7 oraz 8-1 i 8-2.\r\n\r\nPoza zapewnieniem wysokości w świetle parteru co najmniej 3,5 m projektant proponuje rozwiązanie w granicy wysokości budynku do 45 m.\r\nDroga 3-64 łączy się z ogólnodostępnym ciągiem pieszym działki 1; zależnie od różnicy poziomów można zaprojektować pochylnię.\r\nNie planuje się dojazdu pojazdów na działkę 1 przez drogę 3-64.\r\nIstniejącej drogi 3 m wewnątrz granic działek 1 i 2 nie należy uwzględniać; projekt przyjmuje, że nie będzie utrzymana.\r\nOdnieść się do pliku SketchUp oraz dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 8-1 · PDF, strona 4\r\n\r\nPytanie\r\n\r\nProjektowany poziom drogi 3-64.\r\n\r\nRelacja poziomów nowej drogi 3-64 przylegającej do terenu jest potrzebna do ustalenia poziomu podstawowej kondygnacji, wjazdów, dojść pieszych i przestrzeni zewnętrznych. Prosimy podać rzędne i spadki poszczególnych odcinków. Jeżeli projekt drogi nie jest ostateczny, prosimy wskazać poziom odniesienia i założenia dla projektu konkursowego.\r\n\r\nOdpowiedź\r\n\r\nWspólna odpowiedź na pytania 6-1 do 6-3, 7 oraz 8-1 i 8-2.\r\n\r\nPoza zapewnieniem wysokości w świetle parteru co najmniej 3,5 m projektant proponuje rozwiązanie w granicy wysokości budynku do 45 m.\r\nDroga 3-64 łączy się z ogólnodostępnym ciągiem pieszym działki 1; zależnie od różnicy poziomów można zaprojektować pochylnię.\r\nNie planuje się dojazdu pojazdów na działkę 1 przez drogę 3-64.\r\nIstniejącej drogi 3 m wewnątrz granic działek 1 i 2 nie należy uwzględniać; projekt przyjmuje, że nie będzie utrzymana.\r\nOdnieść się do pliku SketchUp oraz dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 8-2 · PDF, strona 4\r\n\r\nPytanie\r\n\r\nWjazdy na parking oraz ruch pojazdów na działce 1.\r\n\r\nPrzy planowaniu wjazdów i wyjazdów publicznego parkingu trzeba sprawdzić relację do ruchu pojazdów na sąsiedniej działce 1 i połączeń z drogami, aby rozpoznać możliwe kolizje. Prosimy o materiały potwierdzające lokalizację wjazdów i wyjazdów parkingu działki 1, drogi dojazdowe oraz kierunki ruchu. W szczególności prosimy potwierdzić, czy planuje się dojazd na działkę 1 przez drogę 3-64.\r\n\r\nOdpowiedź\r\n\r\nWspólna odpowiedź na pytania 6-1 do 6-3, 7 oraz 8-1 i 8-2.\r\n\r\nPoza zapewnieniem wysokości w świetle parteru co najmniej 3,5 m projektant proponuje rozwiązanie w granicy wysokości budynku do 45 m.\r\nDroga 3-64 łączy się z ogólnodostępnym ciągiem pieszym działki 1; zależnie od różnicy poziomów można zaprojektować pochylnię.\r\nNie planuje się dojazdu pojazdów na działkę 1 przez drogę 3-64.\r\nIstniejącej drogi 3 m wewnątrz granic działek 1 i 2 nie należy uwzględniać; projekt przyjmuje, że nie będzie utrzymana.\r\nOdnieść się do pliku SketchUp oraz dodatkowo udostępnionego rzutu dachu działki 1.\r\n\r\n## 9-1 · PDF, strona 5\r\n\r\nPytanie\r\n\r\nZakres korekty powierzchni programu o ±10%, s. 19.\r\n\r\nTabela powierzchni pomieszczeń w szczegółowych wytycznych dopuszcza zmianę powierzchni referencyjnej każdej funkcji o ±10%. Czy dotyczy to wszystkich funkcji, w tym parkingu i części wspólnych 19 441 m², czy tylko towarzyszących pomieszczeń administracyjnych: centrum informacji, zarządu zachodniego, centrum taksówek dostępnych i centrum Ddareungi?\r\n\r\nOdpowiedź\r\n\r\nW granicach powierzchni całkowitej do 20 847,64 m² można wzajemnie korygować powierzchnie referencyjne poszczególnych funkcji w zakresie ±10%: parking i funkcje towarzyszące oraz centrum informacji, zarząd zachodni, centrum taksówek dostępnych i centrum Ddareungi.\r\n\r\n## 9-2 · PDF, strona 5\r\n\r\nPytanie\r\n\r\nKryteria lokalizacji wjazdów i wyjazdów, s. 20.\r\n\r\nWytyczne wskazują rozdzielenie wjazdu i wyjazdu, strefę oczekiwania oraz możliwość zawracania przy pełnym parkingu. Czy trzeba wykonać osobne wjazd i wyjazd, czy dopuszczalne jest jedno wspólne połączenie obsługujące oba kierunki?\r\n\r\nOdpowiedź\r\n\r\nDla parkingu o co najmniej 50 miejscach projektant proponuje rozwiązanie zgodne z właściwymi przepisami i standardami. Nie narzuca się rozdzielenia ani połączenia wjazdu i wyjazdu.\r\n\r\n## 9-3 · PDF, strona 5\r\n\r\nPytanie\r\n\r\nZakres konstrukcji umożliwiającej zmianę i rozbudowę w odpowiedzi na przyszłą mobilność i popyt parkingowy, s. 1.\r\n\r\nTło konkursu i wytyczne wymagają aktywnego rozważenia konstrukcji pozwalającej zmienić część lub całość przestrzeni w reakcji na rozwój samochodów elektrycznych, autonomicznych i współdzielonej mobilności oraz zmiany popytu na parking. Czy oznacza to konieczność takiego zaprojektowania konstrukcji, wysokości kondygnacji i instalacji, aby część parkingu mogła w przyszłości przyjąć inną funkcję? Czy istnieją inne szczególne warunki albo wymagany poziom opracowania takiej konstrukcji?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 4-5.\r\n\r\n## 9-4 · PDF, strona 5\r\n\r\nPytanie\r\n\r\nWliczanie pojazdów eksploatacyjnych, m.in. taksówek dostępnych i pojazdów transportujących rowery Ddareungi, do liczby miejsc, s. 20.\r\n\r\nCzy dedykowane miejsca dla taksówek dostępnych, pojazdów dostawczych Ddareungi i innych pojazdów obsługi obiektu można wliczyć do minimum 390 miejsc? Czy poza tymi 390 wymagane są ustalone liczby miejsc dla poszczególnych typów pojazdów eksploatacyjnych? Jeżeli obowiązują osobne kryteria stref oczekiwania, wsiadania i wysiadania, przeładunku lub gabarytów pojazdów, prosimy je podać.\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 4-7.\r\n\r\n## 9-5 · PDF, strona 5\r\n\r\nPytanie\r\n\r\nWarunki połączeń z terenami sąsiednimi i ogólnodostępnymi ciągami pieszymi.\r\n\r\nCzy istnieją odrębne warunki lub plany wymagające bezpośredniego połączenia terenu inwestycji z sąsiednią działką lub ciągiem pieszym albo przygotowania do takiego połączenia? Jeżeli trzeba uwzględnić przyszłe zagospodarowanie otoczenia, czy można udostępnić materiały z układem i przekrojami sąsiednich budynków oraz lokalizacją, szerokością i poziomami ciągów pieszych?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedzi 2 i 3.\r\n\r\n## 9-6 · PDF, strona 5\r\n\r\nPytanie\r\n\r\nMożliwość lokalizacji towarzyszących funkcji administracyjnych pod ziemią i nad ziemią.\r\n\r\nCzy szczegółowe funkcje wskazane w wytycznych, czyli centrum informacji, biuro zarządu zachodniego, obsługa taksówek dostępnych, centrum Ddareungi i pozostałe magazyny, mogą znajdować się na kondygnacjach podziemnych lub nadziemnych? Które muszą znajdować się nad ziemią albo na parterze?\r\n\r\nOdpowiedź\r\n\r\nPoza centrum informacji dla mieszkańców i parkingiem rowerowym, które muszą znajdować się na parterze, nie ogranicza się wyboru kondygnacji dla towarzyszących funkcji administracyjnych.\r\nDla pomieszczeń, w których ludzie stale przebywają, zaleca się lokalizację nad ziemią. Projektant proponuje rozwiązanie według szczegółowych wytycznych w punkcie 2.3.\r\n\r\n## 10-1 · PDF, strona 6\r\n\r\nPytanie\r\n\r\nCzy projekt zabudowy działki 1 jest ostateczny?\r\n\r\nCzy wysokość, skala i liczba budynków działki 1 w udostępnionych materiałach 3D SKP są zatwierdzonym projektem, czy jedynie materiałem referencyjnym do konkursu? Czy mogą później ulec zmianie?\r\n\r\nOdpowiedź\r\n\r\nProjekt działki 1 jest na etapie pozwolenia na budowę. W zakresie wysokości, skali i liczby budynków należy odnieść się do udostępnionego modelu SketchUp.\r\n\r\n## 10-2 · PDF, strona 6\r\n\r\nPytanie\r\n\r\nSwoboda lokalizacji parkingu rowerowego.\r\n\r\nCzy wskazany w wytycznych parter jest obowiązkową lokalizacją parkingu rowerowego? Czy projektant, uwzględniając wygodę i komunikację, może przenieść go na inną kondygnację albo rozdzielić między kilka kondygnacji?\r\n\r\nOdpowiedź\r\n\r\nParking rowerowy należy zlokalizować na parterze.\r\n\r\n## 10-3 · PDF, strona 6\r\n\r\nPytanie\r\n\r\nMożliwość nadziemnego połączenia pieszego z działką 1.\r\n\r\nCzy dla poprawy powiązań pieszych między działkami 1 i 2 projektant może dodatkowo zaproponować bezpośrednią kładkę między górną kondygnacją publicznego parkingu a budynkiem działki 1?\r\n\r\nOdpowiedź\r\n\r\nNadziemny ogólnodostępny ciąg pieszy powstaje na działce 2 od strony Cheongpa-ro (30 m).\r\nNie można proponować kładki łączącej działki 2 i 1.\r\n\r\n## 11-1 · PDF, strona 6\r\n\r\nPytanie\r\n\r\nMieszane przeznaczenie działki 2 oraz ograniczenie wysokości z uwagi na nasłonecznienie od północy.\r\n\r\nDziałka 2 leży w strefach ogólnomieszkaniowych kategorii II i III oraz w ogólnej strefie handlowej, która wydaje się zajmować więcej niż połowę działki. Czy przy traktowaniu jej jako jednej działki budowlanej należy, zgodnie z art. 54 ustawy budowlanej i art. 77 rozporządzenia wykonawczego, stosować do całego terenu i budynku przepisy ogólnej strefy handlowej, bez ograniczenia wysokości dla ochrony nasłonecznienia od północy z art. 86 ust. 1 rozporządzenia?\r\n\r\nOdpowiedź\r\n\r\nOgraniczenie wysokości dla ochrony nasłonecznienia od północy nie ma zastosowania; obowiązują kryteria ogólnej strefy handlowej.\r\n\r\n## 11-2 · PDF, strona 6\r\n\r\nPytanie\r\n\r\nOstateczna granica działki 2 i powierzchnie poszczególnych stref przeznaczenia.\r\n\r\nProsimy o rysunek nakładający ostateczną granicę działki 2, 2 216,30 m², na granice stref przeznaczenia, oraz tabelę powierzchni stref ogólnomieszkaniowych kategorii II i III i ogólnej strefy handlowej. Czy za podstawę projektu konkursowego można przyjąć granicę z udostępnionego pomiaru geodezyjnego?\r\n\r\nOdpowiedź\r\n\r\nTabela powierzchni stref przeznaczenia nie jest udostępniana. Parametry powierzchni zabudowy, intensywności i wysokości należy przyjąć według rysunku decyzji szczegółowego planu.\r\nObowiązuje granica z udostępnionego pomiaru geodezyjnego CAD.\r\n\r\n## 11-3 · PDF, strona 6\r\n\r\nPytanie\r\n\r\nLinia zabudowy, linia elewacji i wysokość 9 m.\r\n\r\nProsimy przedstawić w CAD odsunięcia linii zabudowy na poszczególnych odcinkach granicy działki 2: 3 m, 1,5 m i 1 m, oraz początek, koniec i linię odniesienia ograniczenia elewacji 3 m. Czy w strefie przy drodze 3-64, gdzie przy pilotis należy zapewnić co najmniej 9 m, czyli 3 kondygnacje, można umieszczać słupy, pochylnię pieszą, elementy zieleni i podobne urządzenia?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 2.\r\nNa działce 1 należy zapewnić co najmniej 20% otwartej zieleni.\r\nOdpowiedź jest wspólna dla pytań 11-3 i 11-4.\r\n\r\n## 11-4 · PDF, strona 6\r\n\r\nPytanie\r\n\r\nOgólnodostępna przestrzeń otwarta, otwarta zieleń i połączenia piesze.\r\n\r\nCzy wymogi obwieszczenia dotyczące co najmniej 20% otwartej zieleni, minimalnej szerokości ogólnodostępnej przestrzeni otwartej 9 m oraz wysokości w świetle 8 m pod pilotis obowiązują cały specjalny obszar planistyczny, czy muszą być osobno spełnione także na działce 2?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 2.\r\nNa działce 1 należy zapewnić co najmniej 20% otwartej zieleni.\r\nOdpowiedź jest wspólna dla pytań 11-3 i 11-4.\r\n\r\n## 11-5 · PDF, strona 6\r\n\r\nPytanie\r\n\r\nZasady korekty powierzchni całkowitej i poszczególnych funkcji.\r\n\r\nCzy poza wskazaną powierzchnią całkowitą obowiązuje odrębne minimum powierzchni? Czy korekta ±10% referencyjnych powierzchni funkcji odnosi się do każdego pomieszczenia, czy do sumy powierzchni danej funkcji?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 9-1.\r\n\r\n## 11-6 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nCzy operatorzy wymagają dedykowanych miejsc parkingowych?\r\n\r\nJeżeli trzeba zapewnić poszczególnym operatorom wyłączne miejsca, strefy lub zajezdnie, prosimy podać wymagane liczby i gabaryty pojazdów.\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 4-7.\r\n\r\n## 11-7 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nŁadowanie samochodów elektrycznych, ochrona przeciwpożarowa i eksploatacja.\r\n\r\nCzy operator ma dodatkowe wymagania albo odrębny podręcznik dotyczący lokalizacji stref ładowania pojazdów elektrycznych, np. na parterze lub najwyższej kondygnacji?\r\n\r\nOdpowiedź\r\n\r\nOdnieść się do miejskiej uchwały dotyczącej zapobiegania pożarom i wspierania urządzeń bezpieczeństwa w strefach parkingowych dla samochodów elektrycznych.\r\nStrefy ładowania lokalizować w pierwszej kolejności na dolnych kondygnacjach parkingowych bez pomieszczeń stałego pobytu, czyli towarzyszących funkcji administracyjnych. Skupić je przy jednej ścianie i zapewnić otwory umożliwiające działania straży pożarnej.\r\n\r\n## 11-8 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nCel przyszłej zmiany funkcji i wymagane parametry.\r\n\r\nCzy przyszłą zmianę funkcji należy przedstawić na poziomie koncepcji projektowej i scenariusza przekształcenia?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 4-5.\r\n\r\n## 11-9 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nJeśli istnieje odrębny opis zakresu prac, prosimy go udostępnić.\r\n\r\nOdpowiedź\r\n\r\nNie ma; nie jest udostępniany.\r\n\r\n## 11-10 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nPrzeładunek pojazdów serwisowych i warunki pracy centrum Ddareungi.\r\n\r\nProsimy podać maksymalne gabaryty i masy pojazdów serwisowych oraz sposób przyjmowania i wydawania rowerów do serwisu, dzienną wielkość obsługi i ewentualny wymóg dedykowanej windy towarowej.\r\n\r\nOdpowiedź\r\n\r\nDedykowana winda towarowa nie jest wymagana.\r\nPojazdy transportujące rowery Ddareungi to przeważnie samochody ciężarowe 1 t lub wersje 1 t o wydłużonym nadwoziu.\r\n\r\n## 12 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nCzy nowy parking publiczny ma obsługiwać użytkowników działki 1, czy odwiedzających okolicę? Prosimy wskazać głównych użytkowników, dla których określono zapotrzebowanie parkingowe.\r\n\r\nOdpowiedź\r\n\r\nOtwarty parking publiczny, bez ograniczenia kręgu użytkowników.\r\n\r\n## 13 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nCzy połączenie drogi średniej 3-8 z drogą małą 3-64 jest skrzyżowaniem w rozumieniu ustawy o ruchu drogowym? Jeżeli tak, czy przy granicy działki 2 naprzeciw skrzyżowania obowiązują ograniczenia lokalizacji wjazdów i wyjazdów?\r\n\r\nOdpowiedź\r\n\r\nWjazdy i wyjazdy projektować zgodnie z ustawą o parkingach oraz ustawą o ruchu drogowym.\r\n\r\n## 14-1 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nCzy wymóg zapewnienia ogólnodostępnej przestrzeni otwartej o minimalnej szerokości 9 m, podany na rysunku planu szczegółowego w części wspólnej dotyczącej otwartej przestrzeni na działce, odnosi się również do działki 2?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 2. Wspólna odpowiedź dla pytań 14-1 i 14-2.\r\n\r\n## 14-2 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nNa rysunku decyzji przy granicy działki 2 i drogi 3-64 zaznaczono linię ograniczającą położenie elewacji, ale trudno potwierdzić odrębną linię zabudowy. Czy obowiązuje wyłącznie linia elewacji, czy w tym samym miejscu nakładają się obie linie? Jeżeli się nakładają, czy odległość linii elewacji liczy się od granicy działki, czy od linii zabudowy?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 2. Wspólna odpowiedź dla pytań 14-1 i 14-2.\r\n\r\n## 14-3 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nCzy po efektywnym rozplanowaniu parkingu można zaproponować nową funkcję w pozostałej powierzchni?\r\n\r\nOdpowiedź\r\n\r\nW dostępnej nadwyżce powierzchni można proponować powiązane funkcje, czyli dodatkowe szczegółowe obiekty lub pomieszczenia.\r\n\r\n## 14-4 · PDF, strona 7\r\n\r\nPytanie\r\n\r\nProsimy udostępnić opis ogólny budynków działki 1, w tym liczbę kondygnacji, oraz materiały planu zagospodarowania.\r\n\r\nOdpowiedź\r\n\r\nOpis ogólny nie jest udostępniany; udostępniany jest rzut dachu.\r\n\r\n## 15 · PDF, strona 8\r\n\r\nPytanie\r\n\r\nDokumenty składane według s. 9 wytycznych.\r\n\r\nGdy koreańska i zagraniczna pracownia architektoniczna wspólnie uczestniczą w konkursie, czy zagraniczny współuczestnik składa wyłącznie oryginał uprawnień architektonicznych, czy również tłumaczenie na język koreański?\r\n\r\nOdpowiedź\r\n\r\nNależy złożyć zagraniczny dokument uprawnień architektonicznych.\r\nJeżeli w danym kraju nie ma uznawanego dokumentu uprawnień, należy złożyć zaświadczenie tamtejszego stowarzyszenia architektów z tłumaczeniem na język koreański i poświadczeniem notarialnym.\r\nW razie potrzeby można zażądać dodatkowych dokumentów potwierdzających spełnienie warunków uczestnictwa.\r\n\r\n## 16-1 · PDF, strona 8\r\n\r\nPytanie\r\n\r\nOdległości budynku i linia zabudowy.\r\n\r\nProsimy określić minimalne odległości i linie zabudowy dla każdej granicy z drogą oraz sąsiednią działką. W szczególności: czy elewacja może znajdować się 1,5 m od granicy? Jeżeli wymagane jest większe odsunięcie, prosimy podać jego lokalizację, wymiar i podstawę.\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 2. Wspólna odpowiedź dla pytań 16-1, 16-2 i 16-3.\r\n\r\n## 16-2 · PDF, strona 8\r\n\r\nPytanie\r\n\r\nZnaczenie linii granicznych na pomiarze geodezyjnym.\r\n\r\nProsimy jednoznacznie wskazać granicę działki, według której należy projektować parking, spośród żółtych linii na warstwie A-SITE-LINE-PROP udostępnionego pomiaru. Czy pas między podwójnymi żółtymi liniami po lewej i dolnej stronie terenu jest terenem drogi lub innego obiektu infrastruktury planistycznej, czy należy do terenu konkursu?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 2. Wspólna odpowiedź dla pytań 16-1, 16-2 i 16-3.\r\n\r\n## 16-3 · PDF, strona 8\r\n\r\nPytanie\r\n\r\nUdostępnienie odpowiednich rysunków.\r\n\r\nProsimy wskazać, gdzie udostępniono rysunek decyzji z granicą obiektu infrastruktury planistycznej działki 2, liniami zabudowy i wymiarami odsunięć oraz odpowiednie wytyczne wykonawcze. Jeśli materiałów brakuje, prosimy je uzupełnić.\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 2. Wspólna odpowiedź dla pytań 16-1, 16-2 i 16-3.\r\n\r\n## 16-4 · PDF, strona 8\r\n\r\nPytanie\r\n\r\nDopuszczalny rendering i retusz w Photoshopie na planszach.\r\n\r\nWytyczne pozwalają swobodnie stosować kolor, rendering i edycję obrazów 3D, o ile uczestnik sam wytworzył materiały. Czy kolorowy rendering własnego modelu 3D oraz retusz materiałów, światła i kolorystyki w Photoshopie są zatem dozwolone bez odjęcia punktów lub innych niekorzystnych skutków w ocenie?\r\n\r\nOdpowiedź\r\n\r\nNie przewiduje się odjęcia punktów ani innego pogorszenia oceny, pod warunkiem użycia wyłącznie materiałów wytworzonych przez uczestnika.\r\n\r\n## 16-5 · PDF, strona 8\r\n\r\nPytanie\r\n\r\nMożliwość zmiany skali kondygnacji podziemnych.\r\n\r\nWytyczne wskazują około czterech kondygnacji podziemnych i dziesięciu nadziemnych oraz racjonalną propozycję projektanta w granicach liczby kondygnacji, wysokości i powierzchni. Czy przy spełnieniu minimum 390 miejsc, funkcji obowiązkowych i ich powierzchni, limitów powierzchni całkowitej, zabudowy, intensywności, wysokości i budżetu można zaprojektować dwie kondygnacje podziemne? Czy zapis o wykopie na cztery kondygnacje oznacza obowiązek wykonania czterech kondygnacji podziemnych?\r\n\r\nOdpowiedź\r\n\r\nNie ogranicza się liczby kondygnacji nadziemnych ani podziemnych. Projektant powinien racjonalnie zaproponować ich liczbę, uwzględniając udostępnione badania geotechniczne terenu sąsiedniego i planowany koszt budowy.\r\n\r\n## 17-1 · PDF, strona 9\r\n\r\nPytanie\r\n\r\nCzy w strefie pilotis przy południowej granicy działki 2, od drogi 3-64, odsuniętej linią elewacji 3 m, można umieszczać słupy i wjazdy pojazdów?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedzi 2 i 13. Wspólna odpowiedź dla pytań 17-1 i 17-2.\r\n\r\n## 17-2 · PDF, strona 9\r\n\r\nPytanie\r\n\r\nCzy zapisy planu szczegółowego dotyczące zapewnienia miejsca do zawracania pojazdów przy Hangang-ro 2-ga 14-18 oraz zintegrowania przyległej ogólnodostępnej przestrzeni otwartej z terenem 14-18 należą do zakresu tego konkursu?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedzi 2 i 13. Wspólna odpowiedź dla pytań 17-1 i 17-2.\r\n\r\n## 17-3 · PDF, strona 9\r\n\r\nPytanie\r\n\r\nCzy powierzchnię parkingu rowerowego należy liczyć osobno od magazynu centrum Ddareungi o powierzchni 435 m²?\r\n\r\nOdpowiedź\r\n\r\nNależy liczyć ją osobno.\r\n\r\n## 17-4 · PDF, strona 9\r\n\r\nPytanie\r\n\r\nCzy koszt budowy 50 411 760 tys. KRW wskazany w punkcie 1.4 wytycznych obejmuje rozbiórkę istniejącego parkingu i zabezpieczenie wykopu?\r\n\r\nOdpowiedź\r\n\r\nRozbiórka istniejącego parkingu jest wyłączona; zabezpieczenie wykopu jest uwzględnione.\r\n\r\n## 17-5 · PDF, strona 9\r\n\r\nPytanie\r\n\r\nCzy projekt zakłada podziemne połączenie z działką 1?\r\n\r\nOdpowiedź\r\n\r\nNie należy zakładać połączenia podziemnego.\r\n\r\n## 18 · PDF, strona 9\r\n\r\nPytanie\r\n\r\nDla specjalnego obszaru planistycznego 8 udostępniono obecnie tylko model SketchUp i teren, co utrudnia zrozumienie przyszłych zmian otoczenia. Do dokładnego projektu odpowiadającego na zmienione warunki potrzebne są dodatkowe dane. Czy można udostępnić np. rysunki CAD pokazujące układ przyszłych obiektów i ogólnodostępnych przestrzeni otwartych w otoczeniu?\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedź 3-1.\r\n\r\n## 19-1 · PDF, strona 9\r\n\r\nPytanie\r\n\r\nProsimy podać ostateczną szerokość i planowany termin otwarcia lub ukończenia drogi 3-64 po zachodniej stronie terenu, projektowanej na 6 m. Czy jeśli w chwili oddania obiektu droga nie będzie otwarta albo będzie węższa niż 6 m, można zaprojektować wjazd od jej strony?\r\n\r\nOdpowiedź\r\n\r\nMożna projektować takie rozwiązanie, przyjmując wykonanie drogi zgodnie z udostępnioną linią decyzji planistycznej.\r\n\r\n## 19-2 · PDF, strona 9\r\n\r\nPytanie\r\n\r\nPunkt 1.4 wytycznych opisuje teren jako ogólną strefę handlową, lecz obwieszczenie decyzji planu szczegółowego stosuje do działki 2 średnią ważoną intensywność zabudowy dla stref ogólnomieszkaniowych kategorii II i III oraz ogólnej strefy handlowej. Prosimy podać powierzchnię każdej strefy i wyjaśnić, czy przy częściowym położeniu w strefie mieszkaniowej obowiązuje ograniczenie wysokości dla ochrony nasłonecznienia od północy.\r\n\r\nOdpowiedź\r\n\r\nZobacz odpowiedzi 11-1 i 11-2.\r\n\r\n","./references/official-qa.md":"---\r\ncreated: 2026-10-26T17:58\r\ntype: Reference\r\nproject: 2625\r\nauthor: codex\r\n---\r\n# 용산 공영주차장 설계공모 공식 질의응답 전문\r\n\r\n원문: 2026년 10월 16일 공식 질의응답서, 표지 포함 9쪽. PDF 쪽수는 표지를 1쪽으로 센다.\r\n\r\n추출: GPU Marker 전체 재추출 후 원문 글자와 9쪽 이미지 대조. 질문·답변 70개를 복원했다. 합쳐진 답변 칸의 적용 범위를 표시했다. 원문 오탈자는 보존했다. 도식 배경의 작은 지적번호 일부만 판독 불가로 남아 있으며, 질문·답변 본문에 판독 불가 표시는 없다.\r\n\r\n[공식 원문](https://project.seoul.go.kr/downloadFile.do?fileSeq=185844)\r\n\r\n## PDF 1쪽 (표지)\r\n\r\n용산전자상가지구 특별계획구역8 공공기여 공영주차장 건립 설계공모\r\n\r\n질의응답서\r\n\r\nQ&A\r\n\r\n2026. 10. 16.\r\n\r\n질의에 대한 답변은 공모 규정 또는 지침에 대한 추가 또는 수정으로 간주됩니다.\r\n\r\nAnswers to queries are considered as additions or modifications to the public offering regulations or guidelines.\r\n\r\n## PDF 2쪽\r\n\r\n### 1\r\n\r\n질의내용\r\n\r\n설계공모 지침서 2.2에서는 총 390대 이상의 주차대수를 확보하도록 명시하고 있으나, 주차방식에 대한 별도의 기준은 제시되어 있지 않습니다.\r\n\r\n관련 법규 및 안전·운영기준을 충족하는 것을 전제로, 자주식 주차와 기계식 주차를 혼용하여 계획하는 것이 가능한지 질의합니다.\r\n\r\n질의답변\r\n\r\n- 자주식 주차 390대 확보, 기계식 주차 고려하지 않음\r\n\r\n### 2-1\r\n\r\n질의내용\r\n\r\n획지2 건축한계선 후퇴거리(1m 여부) 확인\r\n\r\n고시의 건축한계선 「이면부(북측) 1.5m, 이면부(획지2) 1m」와 관련하여, 결정도상 획지2 북서측 변은 1m로 표기되고 1.5m는 획지1 북측으로 판독됩니다. 획지2에 적용되는 건축한계선이 1m가 맞는지, 획지2 북측변에도 1m가 적용되는지 확인 부탁드립니다. 또한 건축한계선이 지정되지 않은 변(소로3-64 서측·남측변)은 벽면한계선 3m가 유일한 후퇴 기준인지 질의드립니다.\r\n\r\n질의답변: No 2-1, No 2-2 공통 답변\r\n\r\n- 획지2 남측 소로3-64변은 건축한계선 3m 미적용 구간으로 벽면한계선(필로티계획으로 높이 9m 이상(3개층) 확보) 3m 및 대지안의 공지 적용\r\n\r\n답변 도식 내 표기\r\n\r\n- 평면 도식: 669.36% 이하 / 45m이하 / 90% / 건축한계선 1.5m / 1.5m / 건축한계선 1m / 건축한계선 3m / 획지2 / 소(국) 3-64 / 벽면한계선 3m (높이 9m 이상(3층) 확보)\r\n- 단면 도식: 벽면한계선 3m / 건축한계선 1.5m / 주차장 / 필로티 계획시, 3개층 이상 확보 / 도로 / 보행로 3m / 보행로 1.5m\r\n- 평면 도식 배경의 작은 지적번호 일부: [판독 불가]\r\n\r\n### 2-2\r\n\r\n질의내용\r\n\r\n벽면한계선 소(구) 3-64변 3m(필로티계획으로 높이 9m이상(3개층) 확보)의 부연설명 및 적용범위 명확화\r\n\r\n해당 문구가 소로3-64변 저층부를 필로티로 계획해야 하는 의무인지, 필로티로 계획하는 경우의 높이 조건인지 부연 설명 부탁드립니다. 결정도상 벽면한계선 점선은 남측변에만 표기되고 서측변은 3m 치수만 표기되어 있어, 적용범위가 서측변·남측변 전 구간인지 일부 구간인지 도면으로 명확히 표기해 주시기 바랍니다.\r\n\r\n아울러 필로티 구간의 깊이, 필로티 하부의 주차·자전거 주차·차량 대기 배치 가능 여부, 높이 9m의 산정 기준(바닥면~상부 슬래브 하단 등), 필로티 상부층의 벽면 돌출 및 주차·부속용도 배치 가능 여부를 질의드립니다.\r\n\r\n질의답변: No 2-1, No 2-2 공통 답변\r\n\r\n- 획지2 남측 소로3-64변은 건축한계선 3m 미적용 구간으로 벽면한계선(필로티계획으로 높이 9m 이상(3개층) 확보) 3m 및 대지안의 공지 적용\r\n- 도식은 No 2-1의 공통 답변에 수록.\r\n\r\n### 2-3\r\n\r\n질의내용\r\n\r\n공개공지(획지2) 적용 여부 및 필로티 공간의 공개공지 인정 여부\r\n\r\n획지2에 공개공지 설치가 필요한 경우, 고시의 공개공지 최소 폭 9m 이상 확보 및 필로티형 유효높이 8m 확보 조건이 획지2에 그대로 적용되는지 확인 부탁드립니다. 고시상 위치가 지정된 공개공지는 청파로 가각부(획지1)에만 표기되어 있습니다. 또한 소로3-64변 필로티 공간을 공개공지로 보는지, 그렇다면 필로티 높이 9m와 유효높이 8m를 모두 충족해야 하는지, 해당 공간 하부에 차량 통행·주차·대기를 둘 수 있는지 질의드립니다.\r\n\r\n질의답변: No 2-3, No 2-4 공통 답변\r\n\r\n- 획지2 공개공지 설치 불필요, 획지1에만 공개공지(위치지정) 설치\r\n- 건축한계선(벽면한계선 포함) 후퇴부는 전면공지(보도 및 녹화공간 조성, 차량 진출입 허용)로 조성\r\n- 면적은 관련 법령 및 기준을 따라 산정\r\n\r\n### 2-4\r\n\r\n질의내용\r\n\r\n전면공지 적용 기준\r\n\r\n고시 대지 내 공지 계획의 전면공지가 획지2에 적용되는지, 적용된다면 위치(변), 폭, 면적, 조성 기준(보도 및 녹화공간 비율 등)을 도면 또는 표로 제시해 주시기 바랍니다. 아울러 전면공지, 건축한계선 후퇴부, 벽면한계선 후퇴부(3m), 공개공지 면적을 중복 산정할 수 있는지 질의드립니다.\r\n\r\n질의답변: No 2-3, No 2-4 공통 답변\r\n\r\n- 획지2 공개공지 설치 불필요, 획지1에만 공개공지(위치지정) 설치\r\n- 건축한계선(벽면한계선 포함) 후퇴부는 전면공지(보도 및 녹화공간 조성, 차량 진출입 허용)로 조성\r\n- 면적은 관련 법령 및 기준을 따라 산정\r\n\r\n### 2-5\r\n\r\n질의내용\r\n\r\n공공보행통로(5m)의 시점·종점 확인\r\n\r\n고시에 「청파로~주차장 간 지상부 공공보행통로(폭 5m) 시·종점 지정」이라 되어 있는데, 여기서 주차장이 획지2를 말하는 것인지 확인 부탁드립니다. 획지2를 말하는 경우 시점·종점 위치와 대지 내 경로를 도면으로 제시해 주시기 바랍니다. 결정도상 통로 표기는 획지1 쪽으로 판독됩니다. 통로를 필로티 하부에 두는 경우 필로티 높이 및 공개공지 기준과의 관계, 24시간 개방 여부, 통로 폭 5m 내 차량 진출입 교차 허용 여부도 질의드립니다.\r\n\r\n질의답변\r\n\r\n- 공공보행통로는 중앙의 공개공지(획지1)를 거쳐 주차장(획지2)으로 연결\r\n- 공공보행통로의 시·종점은 세부개발계획 결정도를 따름(결정도 내 위치 참고)\r\n\r\n※ 스케치업 파일 및 획지1 지붕층 배치도(추가 제공자료) 참고\r\n\r\n### 3-1\r\n\r\n질의내용\r\n\r\n공모안의 설계 시 현재의 대상지 및 주변 현황을 기준으로 계획하여야 하는지, 또는 향후 예정된 주변 지역의 재개발·정비계획 등 장래 도시환경의 변화를 기준으로 계획하여야 하는지 질의드립니다.\r\n\r\n질의답변\r\n\r\n- 획지1 : 스케치업 파일 및 지상층 배치도 참고\r\n- 그 외 향후 예정된 주변 지역의 도시환경 변화를 고려하여 계획\r\n\r\n### 3-2\r\n\r\n질의내용\r\n\r\n제공된 자료를 확인한 결과, 획지1의 공모 당선안과 제공된 SketchUp 3D 파일상의 획지1 건축물의 배치 및 형상 등이 상이한 것으로 확인됩니다. 어느 것을 기준으로 계획하여야 하는지 질의드립니다.\r\n\r\n질의답변\r\n\r\n※ 스케치업 파일 및 획지1 지붕층 배치도(추가 제공자료) 참고\r\n\r\n## PDF 3쪽\r\n\r\n### 4-1\r\n\r\n질의내용\r\n\r\n특별계획구역8 교통영향평가 관련 자료 제공 가능 여부 (본 보고서, 심의결과의결서 및 조치사항 등)\r\n\r\n질의답변\r\n\r\n- 미제공\r\n\r\n※ 세부시설계획 결정 고시 및 획지1 지붕층 배치도(추가 제공자료) 참고\r\n\r\n### 4-2\r\n\r\n질의내용\r\n\r\n[획지 1]의 업무시설등 및 서울특별시 보훈회관 계획안 제공 가능 여부\r\n\r\n(배치, 레벨계획. 동선계획, 각 건물의 부설주차장 차량출입구, 지하층 계획 등)\r\n\r\n질의답변\r\n\r\n※ 획지1 지붕층 배치도(추가 제공자료) 참고\r\n\r\n### 4-3\r\n\r\n질의내용\r\n\r\n특계구역 세부지침상 대지 남측 소로 신설은 넥서스벨리 오피스텔의 차량 통행을 위함으로 되어 있는데, 신설 6m 도로를 통한 추후 서울시 보훈회관 등 차량 진출입 계획 유무\r\n\r\n질의답변\r\n\r\n- 신설6m 도로를 통한 획지1로의 차량 진출입 계획 없음\r\n\r\n※ 획지1 지붕층 배치도(추가 제공자료) 참고\r\n\r\n### 4-4\r\n\r\n질의내용\r\n\r\n1층 유효높이 3.5m 확보에 대한 다양한 활용성 관련, 제시된 서비스차량 운영만 고려하면 되는지, 또다른 세부계획이 있다면 제공 여부\r\n\r\n질의답변\r\n\r\n- 2.5t 트럭 차량의 진입 및 주차장을 통한 회차 등을 고려하여 1층 유효높이 3.5m 확보\r\n\r\n### 4-5\r\n\r\n질의내용\r\n\r\n심사기준 및 지침상, '가변성' 의 적용 범위\r\n\r\n- 미래 주차수요 변화에 대한 가변성 및 수용성\r\n- 시민안내센터, 서부관리소, 장애인콜택시 사무실 및 창고 조닝\r\n- 독립 출입·보안, 24시간 운영, 가변성 및 유지관리 효율\r\n\r\n→ 현 시설 면적 범주 내, 세부시설간 면적 변동 가변성에 대응할 수 있도록 계획하면 되는것인지\r\n\r\n→ 주차 영역이 부속 용도로 가변 가능성 고려 필요한지\r\n\r\n→ 주차 영역이 부속 용도로 가변 가능성 고려 필요하다면 서울시 조례상의 주차전용비율 70% 외 가변 가능토록 고려하면 되는지 여부\r\n\r\n질의답변\r\n\r\n- 향후 세부시설(주차장, 부속 업무시설) 간 면적 및 주차구획 크기, 배치기준 등 변동 가능성 고려\r\n\r\n### 4-6\r\n\r\n질의내용\r\n\r\n용산주차빌딩 철거공사가 본 공사의 업무범위인지 확인 여부\r\n\r\n예정공사비 504억 포함여부 (단계별 추진계획에 활용 여부)\r\n\r\n질의답변\r\n\r\n- 총 사업비(기부채납 설치비, 63,014,700천원) 내 철거공사 포함\r\n- 본 공사 업무범위 및 예정공사비(50,411,760천원) 내 미포함(별도 공사)\r\n\r\n### 4-7\r\n\r\n질의내용\r\n\r\n서비스차량(1톤화물차) 주차구획 적용 필요 여부, 필요시 예상 대수, 필요시 주차계획대수 390대에 포함 여부\r\n\r\n질의답변\r\n\r\n- 총 주차계획 대수 내 390대 서비스차량, 운영차량 주차구획 설계자가 제안 가능\r\n\r\n### 4-8\r\n\r\n질의내용\r\n\r\n'서부관리소'는 서울시설공단 소속 관리소인지. '서부관리소'에서 하는 업무, 계획 시 고려 필요한 세부 사항\r\n\r\n질의답변\r\n\r\n- 서부관리소 : 서울시설공단 소속 관리 사무실로 시민안내센터, 콜택시 사무실, 따릉이거점센터 등 시설통합 관리 (설계공모지침서 2.3. 세부설계지침 참고)\r\n\r\n### 4-9\r\n\r\n질의내용\r\n\r\n따릉이 거점센터의 시설 계획 세부 기준 (매케닉, 사무직 등 직종별 근무예정인원, 공간계획시 고려필요사항 등)\r\n\r\n질의답변\r\n\r\n- 근무 예정인원 미정 (설계공모지침서 2.3. 세부설계지침 참고)\r\n\r\n### 4-10\r\n\r\n질의내용\r\n\r\n[서식 13] 예정 공사비 검토 의견서\r\n\r\n'지면에 닿지 않는 외피면적' 산정 시, 자연환기를 위한 개방 입면(루버, 스크린, 타공판 등)을 외피면적에 포함하는지 등 세부산정기준 제공 가능 여부\r\n\r\n질의답변\r\n\r\n- 외피면적 산정 시 공사비가 소요되는 개방 입면 포함\r\n\r\n### 4-11\r\n\r\n질의내용\r\n\r\n전자타운 A, B동의 신규 개발 계획 수립 예정 여부\r\n\r\n질의답변\r\n\r\n- 한신전자타운 A,B동 : 삼각지역 일대 지구단위계획구역 (서울도시공간포털(urban.seoul.go.kr) 참고)\r\n\r\n### 4-12\r\n\r\n질의내용\r\n\r\n각종 인증 목표 등급 (법정 대상 여부 및 의무 등급 이상 적용하면 되는지)\r\n\r\n질의답변\r\n\r\n- 법정 대상 여부 및 의무 등급 이상 적용\r\n\r\n### 4-13\r\n\r\n질의내용\r\n\r\n로봇주차(자동이송주차장치) 등 도입 여부\r\n\r\n질의답변\r\n\r\n- 현재 없으나 향후 도입 가능성 존재\r\n\r\n### 4-14\r\n\r\n질의내용\r\n\r\n기계식주차장 혼용 가능 여부\r\n\r\n질의답변\r\n\r\n- 혼용 불가\r\n\r\n## PDF 4쪽\r\n\r\n### 5-1\r\n\r\n질의내용\r\n\r\n지침 p19. \"필로티, 발코니 등 연면적에 포함되지 않는 면적은 구분하여 설계개요와 면적 표에 별도 표기한다.\"와 관련하여 대상지 내 필로티를 계획한 경우 공중의 통행에 해당한다고 판단하여 바닥면적 산입에서 제외해도 되는지 질의 드립니다.\r\n\r\n질의답변\r\n\r\n- 필로티, 발코니 등 바닥면적과 연면적에서 산입 제외되나 건물의 외피 면적을 증가시키는면적은 구분하여 별도 표기\r\n\r\n### 5-2\r\n\r\n질의내용\r\n\r\n지침 P8. 설계도판은 아래 내용을 포함하여 자율 구성한다. 이하 내용과 관련하여 배치도, 평면도, 입면도, 단면도의 축척을 주어진 축척과 다르게 자율적으로 구성할 수 있는지 질의 드립니다.\r\n\r\n질의답변\r\n\r\n- 심사의 편의와 효율성을 위하여 주어진 축척을 준수할 것을 권장하나 설계자의 의도에 따라 자율 구성 가능\r\n\r\n### 5-3\r\n\r\n질의내용\r\n\r\n제공된 도시관리계획 결정 및 지형도면 고시 P863. 공개공지 항목과 관련하여 본 시설은 공개공지 설치 대상은 아닌것으로 판단됩니다. 이에 공개공지를 의무적으로 확보해야 하는 사항인지 또는 설치 대상에 해당하는 경우에 한하여 확보하면 되는 사항인지 질의 합니다.\r\n\r\n질의답변\r\n\r\n- 획지2 공개공지 설치 불필요, 획지1에만 공개공지(위치지정) 설치\r\n\r\n### 6-1\r\n\r\n질의내용\r\n\r\n획지 1의 계획고를 질의드립니다.\r\n\r\n질의답변: 아래 묶음 6~8 공통 답변.\r\n\r\n### 6-2\r\n\r\n질의내용\r\n\r\n소로3-64의 향후 계획과 관련하여, 획지 1까지 경사로로 연결되는 계획인지 질의드립니다.\r\n또한 세부개발계획 결정도상 획지 1의 공공보행통로와 접하여 차량 진입이 가능한 도로인지 확인 부탁드립니다.\r\n\r\n질의답변: 아래 묶음 6~8 공통 답변.\r\n\r\n### 6-3\r\n\r\n질의내용\r\n\r\n획지 1과 획지 2 사이 경계부의 단차 처리가 옹벽으로 계획되는지 질의드립니다.\r\n또한 획지 2와 인접한 획지 1 건축물의 지하층 계획 및 어떤 프로그램이 들어가는지 확인 부탁드립니다.\r\n\r\n질의답변: 아래 묶음 6~8 공통 답변.\r\n\r\n### 7\r\n\r\n질의내용\r\n\r\n기존 대지 내 북측 3m 도로는 유지해야 하는지 질의 드립니다.\r\n\r\n질의답변: 아래 묶음 6~8 공통 답변.\r\n\r\n### 8-1\r\n\r\n질의내용\r\n\r\n**소(국) 3-64의 도로 계획고**\r\n\r\n대상지에 접하여 신설되는 소(국) 3-64와의 레벨 관계는 건축물의 기준층 높이, 차량 출입구, 보행 접근 및 외부공간 구성 등 전반적인 배치계획을 수립하는 데 필요한 조건입니다. 이에 해당 도로의 구간별 계획고와 경사를 확인할 수 있는 자료를 제공하여
