/* V12: paper leaves its folder; ribbons are pulled from the bookmark. */
.paper-transition{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden;isolation:isolate}
.motion-snapshot{position:absolute;z-index:0;margin:0!important;pointer-events:none}
.paper-window{position:fixed;inset:0;z-index:1;pointer-events:none}
.paper-flight{position:fixed!important;margin:0!important;transform-origin:top left;will-change:transform,opacity;pointer-events:none;box-shadow:2px 7px 12px #25282126}
.folder-front{position:fixed!important;z-index:2;margin:0!important;transform-origin:center bottom;pointer-events:none;will-change:transform,opacity}
html[data-moving=true]{scroll-behavior:auto}
html[data-moving=true] .shell{pointer-events:none}
.ribbon-popover{top:-11px;filter:drop-shadow(1px 5px 3px #25282126);clip-path:inset(-12px -4px -12px -10px);outline:none;pointer-events:none}
.ribbon{animation:none;pointer-events:auto;transform-origin:calc(100% - 17px) 50%;will-change:transform,clip-path}
.ribbon-popover[hidden]{display:none!important}
.punch{z-index:15}
@media(max-width:650px){.ribbon-popover{top:-11px}}
@media(prefers-reduced-motion:reduce){.paper-flight,.folder-front,.ribbon{will-change:auto}}
@media print{.paper-transition{display:none}}


/* Apple devices use their native Korean font; Windows uses the bundled font. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.intro h1{font-weight:450;letter-spacing:-.045em}
.folder-title{font-weight:450;letter-spacing:-.035em}
.page-title{font-weight:450;letter-spacing:-.04em}


.header-controls{display:flex;align-items:center;gap:8px}
.profile-switch{display:flex;align-items:center;gap:5px;padding:0 4px;font:11px var(--sans);white-space:nowrap}
.profile-switch span{font-size:12px}
html,body{touch-action:pan-y;overscroll-behavior-x:none;overscroll-behavior-y:none}
button,a{touch-action:pan-y}
textarea,input{touch-action:pan-y;font-size:16px}
body{overflow-x:hidden}
.touch-dragging{will-change:transform;user-select:none;-webkit-user-select:none;transition:none!important}
.loose-paper.touch-dragging{transform-origin:center bottom}
.paper-peek{position:absolute;right:4px;top:4px;width:44px;height:44px;padding:0;font:20px var(--mono);z-index:1;touch-action:none}
.paper-peek:after{content:"";position:absolute;right:7px;top:7px;width:13px;height:13px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.recall-deck{min-height:308px;transform-origin:center center}
.recall-deck .card-count{padding-right:27px}
.recall-deck.recall-back{background:var(--lavender)}
.recall-deck .answer{font:21px/1.5 var(--mono);letter-spacing:-.04em;margin:0 0 16px}
.recall-deck .hint{font-size:12px;line-height:1.7}
.card-turns{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.card-turns button{font-size:11px;padding:8px 0;min-width:66px;text-align:left}
.card-turns button:last-child{text-align:right}
.card-turns span{font-size:9px;opacity:.75}
.gesture-caption{font-size:9px;line-height:1.5;margin:-9px 0 15px;opacity:.7}
.word-note{pointer-events:auto;text-align:left;min-height:0}
.reading-paper>.eyebrow,.writing-paper>.eyebrow{padding-right:25px}
@media print{.paper-peek,.gesture-caption,.card-turns{display:none}}

/* Reusable paper rules and die-cut shapes, without bitmap backgrounds. */
:root{--stock:#f2eddb;--rule:#7399ad;--ticket-ink:#3f5974}
#screen h1:focus{outline:none}
.ribbon{will-change:auto}
.sentence-sheet{background-color:var(--stock);background-image:linear-gradient(#c8777866,#c8777866),repeating-linear-gradient(to bottom,transparent 0,transparent 26px,#7cabc23b 26px,#7cabc23b 27px);background-size:100% 1px,100% calc(100% - 44px);background-position:0 43px,0 44px;background-repeat:no-repeat}
.sentence-sheet .sentence{line-height:1.35}
.recall-deck{background:var(--stock);border-top:1px solid #fff9;box-shadow:1px 3px 2px #2528211c,0 5px 0 #e0ded1}
.recall-deck .card-count{border-bottom:1px solid #bd6c706b;padding-bottom:13px}
.recall-question{line-height:36px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,#7399ad38 35px,#7399ad38 36px)}
.recall-deck.recall-back{background-color:var(--lavender);background-image:linear-gradient(#53656820 1px,transparent 1px),linear-gradient(90deg,#53656820 1px,transparent 1px);background-size:32px 32px}
.recall-deck.recall-back .hint{background:#c3c1d9da;padding:6px 0}
.reading-paper{background-color:var(--stock);border-right-color:var(--green)}
.reading-paper>.eyebrow{border-bottom:1px solid #b5656d6b;padding-bottom:12px}
.reading-line>span:last-child{background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.65em - 1px),#7399ad2e calc(1.65em - 1px),#7399ad2e 1.65em)}
.word-note{background:var(--sage);clip-path:polygon(15px 0,100% 0,100% 100%,15px 100%,0 calc(100% - 16px),0 16px);padding-left:31px;border-right:1px solid #2528213a;box-shadow:none}
.word-note:before{content:"";position:absolute;left:9px;top:calc(50% - 5px);width:9px;height:9px;border-radius:50%;background:var(--desk);box-shadow:0 0 0 3px #8c855d66}
.word-note:after{content:"";position:absolute;left:23px;top:0;bottom:0;border-left:1px dashed #4d513d66}
.translation-slip{background-color:var(--stock);background-image:linear-gradient(90deg,transparent 0,transparent 18px,#b36c6f66 18px,#b36c6f66 19px,transparent 19px),repeating-linear-gradient(to bottom,transparent 0,transparent 25px,#5e778c42 25px,#5e778c42 26px);background-position:0 0,0 7px;padding-left:29px;padding-top:22px;border-top:1px solid #25282135;border-bottom:1px solid #25282135;mask:radial-gradient(circle at 0 6px,transparent 2.1px,#000 2.8px) 0 0/100% 12px repeat-y}
.translation-slip .eyebrow{padding-bottom:8px;border-bottom:2px dotted #7c75625e;background:var(--stock);margin-bottom:6px}
.translation-slip p:not(.eyebrow){line-height:26px;margin-top:0}
.reference-note{background-color:var(--orange);padding-right:40px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);mask:radial-gradient(circle at 0 6px,transparent 2px,#000 2.8px) 0 0/100% 12px repeat-y}
.reference-note:before{content:"";position:absolute;left:12px;right:31px;top:12px;bottom:12px;border:1px solid #8c4b3560;pointer-events:none}
.reference-note:after{content:"";position:absolute;right:22px;top:0;bottom:0;border-right:1px dashed #8c4b3560}
.note-paper,.writing-paper{background-color:var(--stock);background-image:linear-gradient(#87998b25 1px,transparent 1px),linear-gradient(90deg,#87998b25 1px,transparent 1px);background-size:15px 15px;border-left:3px double #598f98;padding-left:24px}
.note-paper textarea,.writing-paper textarea{background-color:#f2eddba6}
.writing-paper .note-label{background:var(--stock);width:max-content;max-width:100%}
.timer-paper{background-color:var(--lavender);background-image:linear-gradient(#53656832 1px,transparent 1px),linear-gradient(90deg,#53656832 1px,transparent 1px);background-size:36px 36px;box-shadow:0 3px 0 var(--paper),0 4px 0 #25282155,0 7px 0 var(--paper)}
.timer-paper .eyebrow{width:max-content;max-width:100%;background:var(--lavender)}
.month-paper{background:var(--stock);border-top:3px double #446279;box-shadow:0 3px 0 #d4d1c2}
.calendar-day.done{background:transparent;border-radius:0}
.calendar-day{isolation:isolate}
.calendar-day.stamped:before{content:"";position:absolute;inset:1px;z-index:-1;background:var(--stamp-color);transform:rotate(var(--stamp-angle));clip-path:var(--stamp-cut);box-shadow:inset 0 0 0 1px #25282128}
.calendar-day.stamped:after{content:"";position:absolute;inset:5px;z-index:-1;border:1px solid #3f59745e;transform:rotate(var(--stamp-angle));clip-path:var(--stamp-cut)}
.calendar-day[aria-pressed=true]{border-color:var(--ink);border-radius:2px;outline:1px solid #fff8;outline-offset:1px}
.stamp-label{--stamp-color:#f5e9c7;--stamp-cut:polygon(18% 0,82% 0,100% 18%,100% 82%,82% 100%,18% 100%,0 82%,0 18%);--stamp-angle:-5deg}
.stamp-oval{--stamp-color:#97b5e7;--stamp-cut:ellipse(49% 42% at 50% 50%);--stamp-angle:6deg}
.stamp-ticket{--stamp-color:#b6d4cc;--stamp-cut:polygon(0 18%,12% 18%,12% 0,88% 0,88% 18%,100% 18%,100% 82%,88% 82%,88% 100%,12% 100%,12% 82%,0 82%);--stamp-angle:-3deg}
.stamp-tag{--stamp-color:#c3c1d9;--stamp-cut:polygon(36% 0,64% 0,72% 16%,92% 30%,100% 54%,92% 82%,70% 100%,30% 100%,8% 82%,0 54%,8% 30%,28% 16%);--stamp-angle:5deg}
.sticker-drawer{margin-top:20px;padding:17px 18px 13px;background:var(--paper);border-top:1px dashed var(--line)}
.sticker-drawer p{font-size:11px;line-height:1.6}
.sticker-choices{display:flex;gap:12px;margin-top:10px}
.sticker-choice{height:48px;flex:1;min-width:44px;position:relative;padding:0;font:12px var(--mono);isolation:isolate}
.sticker-choice:before{content:"";position:absolute;inset:3px;z-index:-1;background:var(--stamp-color);clip-path:var(--stamp-cut);transform:rotate(var(--stamp-angle))}
.sticker-choice:after{content:"";position:absolute;inset:8px;z-index:-1;border:1px solid #3f597488;clip-path:var(--stamp-cut);transform:rotate(var(--stamp-angle))}
.sticker-choice[aria-pressed=true]{outline:1px solid var(--line);outline-offset:2px}
.sticker-choice[disabled]{opacity:.35}
.day-label{display:inline-block;position:relative;padding:10px 18px;margin:-4px 0 12px;background:#f5e9c7;color:#344f6b;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.day-label:before{content:"";position:absolute;inset:3px;border:3px double #48617e;clip-path:inherit;pointer-events:none}
.daily-checks{background:var(--stock)}
.daily-checks h3{font-size:13px;font-weight:400}
@media(max-width:650px){.word-note{width:174px;padding-left:31px}.translation-slip{padding-left:29px}.recall-question{line-height:34px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 33px,#7399ad38 33px,#7399ad38 34px)}.reference-note{padding-right:39px}.month-paper{padding-left:12px;padding-right:12px}}
@media(max-width:350px){.word-note{width:163px}.sticker-choices{gap:8px}}

</style></head>
<body><div class="shell"><header class="masthead"><button class="wordmark" data-view="home" aria-label="오늘의 파일로 돌아가기">LANGUAGE & SPACE<span>하루에 한 장씩</span></button><div class="header-controls"><button class="profile-switch" data-profile aria-label="현재 연호, 정현으로 바꾸기">연호 <span aria-hidden="true">↔</span></button><div class="languages" aria-label="학습 언어"><button data-language="de" aria-pressed="true">DE</button><button data-language="en" aria-pressed="false">EN</button></div></div></header><main id="screen"></main><footer class="edition"><span>LANGUAGE & SPACE / PAPER STUDY</span><span>V16 · 예시 교재</span></footer></div><div class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const text={de:{lang:'de-DE',sentence:'Ein Raum verändert sich, wenn wir ihn benutzen.',translation:'공간은 우리가 사용할 때 달라집니다.',reading:['Ein Raum ist nicht nur eine Form.','Am Morgen fällt Licht durch das Fenster.','Am Abend sitzen wir zusammen und erzählen.'],readko:['공간은 단순한 형태만이 아닙니다.','아침에는 창문으로 빛이 들어옵니다.','저녁에는 함께 앉아 이야기를 나눕니다.'],title:'Ein Raum, ein Tag.',titleko:'하나의 공간, 하루의 시간',prompt:'Beschreibe einen Ort, an dem du dich wohlfühlst.',promptko:'편안함을 느끼는 장소를 설명해 보세요.',write:'Am Morgen … / Am Abend …',cards:[['나는 매일 독일어를 배웁니다.','Ich lerne jeden Tag Deutsch.','jeden Tag는 “매일”입니다. 동사 lerne가 두 번째 자리에 옵니다.'],['우리는 창가에 앉아 있습니다.','Wir sitzen am Fenster.','am Fenster는 “창가에”라는 장소 표현입니다.'],['공간은 우리가 사용할 때 달라집니다.','Ein Raum verändert sich, wenn wir ihn benutzen.','wenn으로 시작하는 절에서는 동사 benutzen이 맨 끝에 옵니다.']]},en:{lang:'en-GB',sentence:'A room takes shape through the way we inhabit it.',translation:'방은 우리가 그 안에서 살아가는 방식에 따라 형태를 얻습니다.',reading:['A room is more than a fixed arrangement of walls.','Its character emerges through use: a chair pulled towards the light, a table cleared for a conversation.','Architecture makes these moments possible without prescribing them.'],readko:['방은 벽을 고정된 방식으로 배치한 것 이상입니다.','빛을 향해 끌어 놓은 의자, 대화를 위해 비운 탁자처럼 쓰임 속에서 그 성격이 드러납니다.','건축은 이러한 순간을 미리 규정하지 않으면서 가능하게 합니다.'],title:'Room for everyday life.',titleko:'일상을 위한 여지',prompt:'What can architecture make possible without prescribing how people live?',promptko:'건축은 사람들의 생활을 규정하지 않으면서 무엇을 가능하게 할 수 있을까요?',write:'Architecture makes room for … without …',cards:[['다른 방향도 제안해도 될까요, 아니면 이미 합의된 건가요?','Could I suggest another direction, or have we already agreed on this one?','another direction은 하나의 대안을, have we already agreed는 지금까지 합의가 이루어졌는지를 묻습니다.'],['이 선택은 맥락을 존중하면서도 공간에 새로운 성격을 부여합니다.','This choice respects the context while giving the space a new character.','while + -ing로 두 행동이 함께 이루어진다는 관계를 간결하게 묶습니다.'],['공간은 사람이 사용할 여지를 남겨야 합니다.','A space should leave room for people to make it their own.','make it their own은 사용자가 자기 방식으로 공간을 받아들이고 바꾼다는 뜻입니다.']]}};
const tasks=[['cards','문장 카드','표현을 기억에서 꺼내기','RECALL','var(--grey)',18],['reading','원문 읽기','공간과 일상을 읽는 세 문장','READ','var(--paper)',158],['speaking','소리 내기','90초, 60초, 45초로 말하기','SPEAK','var(--rose)',74],['writing','한 문장 남기기','오늘의 표현을 내 것으로','WRITE','var(--orange)',188]];
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const parse=s=>new Date(s+'T12:00:00'),key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const shift=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return key(d)},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search),allowed=['home','cards','reading','speaking','writing','calendar'];
let view=params.get('view')||document.documentElement.dataset.initial||'home';if(!allowed.includes(view))view='home';
let language='de',selected=today,month=today.slice(0,7),revealed=false,card=0,showTranslation=false,ribbonOpen=params.has('ribbon')||document.documentElement.hasAttribute('data-ribbon'),duration=90,remaining=90,timer=null,deadline=0;
const profiles={yeonho:{name:'연호',greeting:'연호야, 반가워!'},junghyun:{name:'정현',greeting:'정현아, 반가워!'}};
let person='yeonho';try{const saved=localStorage.getItem('study-files-person');if(Object.hasOwn(profiles,saved))person=saved}catch(e){}
let storage='study-files-v14:'+person+':';let stored={};try{stored=JSON.parse(localStorage.getItem(storage+'data'))||{}}catch(e){}
function seed(){const r={de:{},en:{},notes:{}};for(const lang of ['de','en']){for(const n of [1,2,3,5,6,8,9,10,12])r[lang][shift(today,-n)]=[true,true,true,true];r[lang][today]=[true,true,false,false]}return r}
let data=stored.de&&stored.en?stored:seed();if(!data.notes)data.notes={};
function persist(){try{localStorage.setItem(storage+'data',JSON.stringify(data));return true}catch(e){toast('저장 공간을 사용할 수 없습니다.');return false}}
function state(day=selected){return data[language][day]||[false,false,false,false]}
function count(day=selected){return state(day).filter(Boolean).length}
function monthCount(){return Object.entries(data[language]).filter(([d,v])=>d.startsWith(month)&&v.every(Boolean)).length}
function fmt(day=selected){return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(parse(day))}
function toast(s){$('.toast').textContent=s;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>$('.toast').textContent='',2600)}
function folder(t,i){const tab=t[5];return `<button class="folder" data-view="${t[0]}" style="--tab:${(tab+10)/3.54}%" aria-label="${t[1]} 열기, ${state()[i]?'완료':'아직'}"><svg viewBox="0 0 354 128" preserveAspectRatio="none" aria-hidden="true"><path fill="${t[4]}" d="M0 31 H${tab-10} Q${tab} 31 ${tab+4} 20 L${tab+8} 9 Q${tab+11} 1 ${tab+19} 1 H${tab+111} Q${tab+120} 1 ${tab+123} 10 L${tab+127} 22 Q${tab+131} 31 ${tab+140} 31 H354 V128 H0Z"/></svg><span class="folder-tab">0${i+1} / ${t[3]}</span><span class="folder-row"><span class="folder-title">${t[1]}</span><span class="folder-arrow" aria-hidden="true">↗</span></span><span class="folder-meta"><span>${t[2]}</span><small>${state()[i]?'✓ DONE':'05 MIN'}</small></span></button>`}
function ribbons(){return `<aside class="ribbon-popover" id="ribbon-stack" tabindex="-1" aria-label="숨은 문장 책갈피, 바깥 여백을 누르면 접힙니다" ${ribbonOpen?'':'hidden'}><div class="ribbon brown" style="--ribbon:#3f1a09;--angle:-2deg"><p class="eyebrow">EIN WORT NACH DEM ANDEREN.<br>ONE WORD AT A TIME.</p><p>한 번에 한 단어씩.</p></div><div class="ribbon" style="--ribbon:#97b5e7;--angle:1.5deg"><p class="eyebrow">AUCH LANGSAM IST EIN TEMPO.<br>SLOW IS A PACE, TOO.</p><p>천천히 가는 것도 하나의 속도.</p></div><div class="ribbon" style="--ribbon:#faecc9;--angle:-1deg"><p class="eyebrow">FÜR HEUTE REICHT DAS.<br>ENOUGH FOR TODAY.</p><p>오늘은 이만하면 됐어요.</p></div></aside>`}
function home(){const t=text[language];return `<div class="home-layout"><div><section class="intro"><p class="eyebrow">${fmt()} / DAILY FILE</p><div class="intro-line"><h1 aria-live="polite">${profiles[person].greeting}</h1><span class="progress-note"><b>0${count()}</b> / 04</span></div><p>읽고, 말하고, 내 문장으로 남겨 두기.</p></section><div class="paper-stage"><div class="back-sheet" aria-hidden="true"></div><div class="green-spine" aria-hidden="true"><span>${selected.slice(0,7).replace('-',' / ')} · ${language.toUpperCase()}</span></div><button class="sentence-sheet" data-view="reading" aria-label="오늘의 원문 읽기"><span class="eyebrow">A SENTENCE FOR TODAY / 오늘의 문장</span><span class="sentence" lang="${language}">${t.sentence}</span><span class="sheet-bottom">오늘의 원문 펼치기 ↗</span></button><button class="word-note" data-view="cards" aria-label="기억할 표현, 문장 카드 열기"><p class="eyebrow">KEEP THIS WORD / 기억할 표현</p><strong>${language==='de'?'jeden Tag':'make room for'}</strong><p>${language==='de'?'매일, 하루하루':'무언가를 위한 자리를 내다'}</p></button><button class="punch" data-secret aria-label="숨은 문장 펼치기" aria-expanded="${ribbonOpen}" aria-controls="ribbon-stack"></button>${ribbons()}</div></div><section class="folder-stack" aria-label="오늘의 네 가지 연습">${tasks.map(folder).join('')}</section></div><div class="home-foot"><p>네 가지 연습, 각 5분.<br>오늘은 한 장만 꺼내도 좋아요.</p><button class="archive-link" data-view="calendar">쌓인 날들 <b>${String(monthCount()).padStart(2,'0')}</b><span>↗</span></button></div>`}
function paperGrip(label,open=false){return `<button class="paper-peek" data-peek aria-label="${label}, 위로 젖히기" aria-expanded="${open}"><span aria-hidden="true">↟</span></button>`}
function heading(label,title){return `<div class="view-head"><button class="back" data-view="home">← 오늘의 파일</button><p class="eyebrow">${label} / ${selected.slice(5).replace('-','.')}<br>${language.toUpperCase()} · 05 MIN</p></div><h1 class="page-title">${title}</h1><p class="gesture-caption">옆으로 넘기기 · 맨 위에서 아래로 당겨 넣기</p>`}
function complete(id){const i=tasks.findIndex(t=>t[0]===id);return `<button class="action" data-complete="${i}" aria-pressed="${state()[i]}" ${selected>today?'disabled':''}>${state()[i]?'파일에 넣었어요':'파일에 넣기'}<span>${state()[i]?'✓':'↗'}</span></button>`}
function note(type,label,placeholder){const v=data.notes[language+':'+selected+':'+type]||'';return `<label class="note-label" for="${type}-note">${label}</label><textarea id="${type}-note" data-note="${type}" placeholder="${placeholder}">${esc(v)}</textarea><p class="save-status" aria-live="polite">${v?'이 브라우저에 저장됨':''}</p>`}
function reading(){const t=text[language];return `<section class="lesson">${heading('02 / READ','방을 읽는 법.')}<article class="loose-paper reading-paper">${paperGrip(showTranslation?'해석 접기':'해석 펼치기',showTranslation)}<p class="eyebrow">READING NOTE / 학습용 창작문</p><h2 lang="${language}">${t.title}</h2>${t.reading.map((line,i)=>`<p class="reading-line"><span class="line-number">0${i+1}</span><span lang="${language}">${line}</span></p>`).join('')}<div class="paper-tools"><button data-speak="reading">소리 듣기 ↗</button><button data-translation aria-expanded="${showTranslation}" aria-controls="reading-translation">${showTranslation?'해석 접기':'해석 펼치기'} ${showTranslation?'−':'+'}</button></div></article><aside class="translation-slip" id="reading-translation" ${showTranslation?'':'hidden'}><p class="eyebrow">ON THE OTHER SIDE / 문장별 해석</p>${t.readko.map((line,i)=>`<p><span class="number">0${i+1}</span> &nbsp;${line}</p>`).join('')}</aside><div class="lesson-actions">${complete('reading')}<button class="action secondary" data-view="speaking">소리 내기 →</button></div><div class="note-paper">${note('reading','내가 간직할 표현','한 줄을 옮겨 적어 두세요.')}</div></section>`}
function cards(){const c=text[language].cards[card];return `<section class="lesson">${heading('01 / RECALL','기억에서 꺼내기.')}<article class="loose-paper recall-deck ${revealed?'recall-back':''}"><div class="card-count"><p class="eyebrow" style="margin:0">${revealed?'꺼낸 표현':'한국어를 보고 먼저 말해 보세요.'}</p><span class="eyebrow">0${card+1} / 03</span></div>${paperGrip(revealed?'한국어로 뒤집기':'표현으로 뒤집기',revealed)}${revealed?`<p class="answer" lang="${language}">${c[1]}</p><p class="hint">${c[2]}</p><div class="paper-tools"><button data-speak="card">소리 듣기 ↗</button><button data-reveal aria-expanded="true">한국어 다시 보기 ↶</button></div><div class="ratings" aria-label="기억 정도"><button data-rate="다시">다시</button><button data-rate="기억">기억났어요</button><button data-rate="쉬움">쉬웠어요</button></div>`:`<p class="recall-question">${c[0]}</p><button class="action" data-reveal aria-expanded="false">위로 젖혀 표현 보기 <span>↟</span></button>`}</article><div class="card-turns"><button data-card-turn="-1">← ${card?'앞 문장':'파일 넣기'}</button><span>옆으로 넘겨도 돼요</span><button data-card-turn="1">${card===2?'원문 읽기':'다음 문장'} →</button></div><div class="lesson-actions">${complete('cards')}<button class="action secondary" data-view="reading">원문 읽기 →</button></div></section>`}
function clock(){return String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}
function speaking(){const t=text[language];return `<section class="lesson">${heading('03 / SPEAK','입 밖으로 꺼내기.')}<div class="loose-paper">${paperGrip(peekSpeaking?'뜻 접기':'뜻 펼치기',peekSpeaking)}<p class="eyebrow">A SMALL QUESTION / 오늘의 질문</p><p class="prompt mono" lang="${language}">${t.prompt}</p><p class="prompt-translation" ${peekSpeaking?'':'hidden'}>${t.promptko}</p></div><div class="timer-paper"><p class="eyebrow">생각을 끝까지 말해 보세요.</p><p class="timer" data-clock>${clock()}</p><div class="durations" aria-label="연습 시간">${[90,60,45].map(n=>`<button data-duration="${n}" aria-pressed="${duration===n}">${n}초</button>`).join('')}</div><div class="lesson-actions"><button class="action" data-timer>${timer?'잠시 멈춤':'말하기 시작'} <span>${timer?'Ⅱ':'↗'}</span></button><button class="action secondary" data-reset>처음부터</button></div></div><div class="lesson-actions">${complete('speaking')}<button class="action secondary" data-view="writing">한 문장 남기기 →</button></div><p class="save-status">타이머로 연습합니다. 음성은 녹음하지 않습니다.</p></section>`}

 touchState={x,y,lastX:x,lastY:y,target,surface,kind,start:performance.now(),axis:null,top:scrollY<=2,peek:!!target.closest('[data-peek]')||(view==='cards'&&!revealed&&!!target.closest('.recall-deck')),fromView:view};

function moveTouch(x,y,event){

  if(Math.abs(dx)>Math.abs(dy)*1.25)g.axis='x';
   else if(Math.abs(dy)>Math.abs(dx)*1.25){
   if(g.kind==='folder'&&dy<0||g.kind==='bookmark'||g.kind==='ribbon'||g.peek&&dy<0||g.top&&view!=='home'&&dy>0)g.axis='y';
   else{touchState=null;return}

 if(g.kind==='folder'){if(dx<0||dy<0)navigate(g.target.closest('[data-view]').dataset.view,g.target.closest('[data-view]'));return}
 if(g.axis==='x'){
  if(g.kind==='month')turnMonth(dx<0?1:-1);
  else if(view==='cards')turnCard(dx<0?1:-1);

// Safari gesture events supplement CSS so two fingers never scale the study surface.
