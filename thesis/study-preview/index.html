/* V12: paper leaves its folder; ribbons are pulled from the bookmark. */
.paper-transition{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden;isolation:isolate}
.motion-snapshot{position:absolute;z-index:0;margin:0!important;pointer-events:none}
.paper-window{position:fixed;inset:0;z-index:1;pointer-events:none}
.paper-flight{position:fixed!important;margin:0!important;transform-origin:top left;will-change:transform,opacity;pointer-events:none;box-shadow:2px 7px 12px #27272726}
.folder-front{position:fixed!important;z-index:2;margin:0!important;transform-origin:center bottom;pointer-events:none;will-change:transform,opacity}
html[data-moving=true]{scroll-behavior:auto}
html[data-moving=true] .shell{pointer-events:none}
.ribbon-popover{top:-11px;filter:drop-shadow(1px 5px 3px #27272726);clip-path:inset(-12px -4px -12px -10px);outline:none;pointer-events:none}
.ribbon{animation:none;pointer-events:auto;transform-origin:calc(100% - 17px) 50%;will-change:transform,clip-path}
.ribbon-popover[hidden]{display:none!important}
.punch{z-index:15}
@media(max-width:650px){.ribbon-popover{top:-11px}}
@media(prefers-reduced-motion:reduce){.paper-flight,.folder-front,.ribbon{will-change:auto}}
@media print{.paper-transition{display:none}}


/* Apple devices use their native Korean font; Windows uses the bundled font. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.intro h1{font-weight:450;letter-spacing:-.045em}
.folder-title{font-weight:450;letter-spacing:-.035em}
.page-title{font-weight:450;letter-spacing:-.04em}


.header-controls{display:flex;align-items:center;gap:8px}
.profile-switch{display:flex;align-items:center;gap:5px;padding:0 4px;font:11px var(--sans);white-space:nowrap}
.profile-switch span{font-size:12px}
html,body{touch-action:pan-y;overscroll-behavior-x:none;overscroll-behavior-y:none}
button,a{touch-action:pan-y}
textarea,input{touch-action:pan-y;font-size:16px}
body{overflow-x:hidden}
.touch-dragging{will-change:transform;user-select:none;-webkit-user-select:none;transition:none!important}
.loose-paper.touch-dragging{transform-origin:center bottom}
.paper-peek{position:absolute;right:4px;top:4px;width:44px;height:44px;padding:0;font:20px var(--mono);z-index:1;touch-action:none}
.paper-peek:after{content:"";position:absolute;right:7px;top:7px;width:13px;height:13px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.recall-deck{min-height:308px;transform-origin:center center}
.recall-deck .card-count{padding-right:27px}
.recall-deck.recall-back{background:var(--lavender)}
.recall-deck .answer{font:21px/1.5 var(--mono);letter-spacing:-.04em;margin:0 0 16px}
.recall-deck .hint{font-size:12px;line-height:1.7}
.card-turns{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.card-turns button{font-size:11px;padding:8px 0;min-width:66px;text-align:left}
.card-turns button:last-child{text-align:right}
.card-turns span{font-size:9px;opacity:.75}
.gesture-caption{font-size:9px;line-height:1.5;margin:-9px 0 15px;opacity:.7}
.word-note{pointer-events:auto;text-align:left;min-height:0}
.reading-paper>.eyebrow,.writing-paper>.eyebrow{padding-right:25px}
@media print{.paper-peek,.gesture-caption,.card-turns{display:none}}

/* Reusable paper rules and die-cut shapes, without bitmap backgrounds. */
:root{--stock:#ededed;--rule:#929292;--ticket-ink:#555555}
#screen h1:focus{outline:none}
.ribbon{will-change:auto}
.sentence-sheet{background-color:var(--stock);background-image:linear-gradient(#88888866,#88888866),repeating-linear-gradient(to bottom,transparent 0,transparent 26px,#a3a3a33b 26px,#a3a3a33b 27px);background-size:100% 1px,100% calc(100% - 44px);background-position:0 43px,0 44px;background-repeat:no-repeat}

.recall-deck .card-count{border-bottom:1px solid #7e7e7e6b;padding-bottom:13px}

.recall-deck.recall-back{background-color:var(--lavender);background-image:linear-gradient(#61616120 1px,transparent 1px),linear-gradient(90deg,#61616120 1px,transparent 1px);background-size:32px 32px}

   paper.animate([{transform:startTransform,opacity:1,offset:0},{transform:`perspective(900px) translate3d(${dx*.35}px,${Math.min(70,dy*.3)}px,0) rotateX(34deg) scale(.96)`,opacity:1,offset:.28},{transform:`perspective(900px) translate3d(${dx}px,${dy-65}px,0) rotateX(15deg) scale(${scale}) rotate(-1deg)`,opacity:1,offset:.66},{transform:`translate3d(${dx}px,${dy}px,0) scale(${scale}) rotate(0deg)`,opacity:0,offset:1}],{duration:560,easing:'cubic-bezier(.25,.55,.3,1)',fill:'both'}),
   windowNode.animate([{clipPath:'inset(0 0 0 0)'},{clipPath:`inset(0 0 ${cut}px 0)`}],{duration:520,fill:'both'}),
   oldScreen.animate([{opacity:1},{opacity:0,offset:.4},{opacity:0}],{duration:520,fill:'both'}),
   $('#screen').animate([{opacity:0},{opacity:1,offset:.4},{opacity:1}],{duration:520,fill:'both'})

}
function navigate(v,source){
 if(navigationBusy)return;
 if(v===view){if(source?.matches('.folder'))return putAway();return}
 if(source?.matches('.folder')||view==='home')return openFolder(v,source);
 if(v==='home')return putAway();
 return movePaper(()=>commitView(v),{direction:fileOrder.indexOf(v)>fileOrder.indexOf(view)?1:-1});
}
function nextFile(direction){
 const at=fileOrder.indexOf(view),next=fileOrder[at+direction]||'home';
 if(view==='reading'&&direction<0)card=text[language].cards.length-1;
 navigate(next);
}
function turnCard(direction){
 const next=card+direction;
 if(next<0)return putAway();
 if(next>=text[language].cards.length)return navigate('reading');
 return movePaper(()=>{card=next;revealed=false;render()},{direction,surface:'.recall-deck'});
}
function turnMonth(direction){
 return movePaper(()=>{const d=parse(month+'-01');d.setMonth(d.getMonth()+direction);month=key(d).slice(0,7);selected=month===today.slice(0,7)?today:month+'-01';card=0;revealed=false;remaining=duration;render()},{direction,surface:'.month-paper'});
}
function peelPaper(){
 if(!['cards','reading','speaking','writing'].includes(view))return;
 const focused=document.activeElement?.matches('[data-peek],[data-reveal],[data-translation]');
 return movePaper(()=>{
  if(view==='cards'){revealed=!revealed;if(revealed)recordCard()}
  else if(view==='reading')showTranslation=!showTranslation;
  else if(view==='speaking')peekSpeaking=!peekSpeaking;
  else if(view==='writing')peekWriting=!peekWriting;
  render();
 },{flip:true,surface:view==='cards'?'.recall-deck':'.loose-paper'}).then(()=>{if(focused)$('[data-peek],[data-reveal]')?.focus({preventScroll:true})});
}
function startTouch(x,y,target){
 if(navigationBusy||editable(target)||window.getSelection()?.toString())return;
 const special=target.closest('.folder,.sentence-sheet,.word-note,[data-peek],[data-secret],.ribbon');
 if(target.closest('button,a')&&!special)return;
 if(!special&&!target.closest('#screen'))return;
 const kind=ribbonOpen?'ribbon':target.closest('[data-secret]')?'bookmark':target.closest('.folder')?'folder':view==='home'?'folder':target.closest('.month-paper')?'month':'paper';
 if(kind==='folder'&&!special)return;
 const surface=kind==='folder'?special:kind==='ribbon'?target.closest('.ribbon'):kind==='month'?$('.month-paper'):$('#screen .lesson');
 touchState={x,y,lastX:x,lastY:y,target,surface,kind,start:performance.now(),axis:null,top:paperAtTop(),peek:!!target.closest('[data-peek]')||(view==='cards'&&!revealed&&!!target.closest('.recall-deck')),fromView:view};
}
function moveTouch(x,y,event){
 const g=touchState;if(!g)return;const dx=x-g.x,dy=y-g.y;g.lastX=x;g.lastY=y;
 if(!g.axis){
  if(Math.max(Math.abs(dx),Math.abs(dy))<7)return;
  if(Math.abs(dx)>Math.abs(dy)*1.25)g.axis='x';
   else if(Math.abs(dy)>Math.abs(dx)*1.25){
   if(g.kind==='folder'&&dy<0||g.kind==='bookmark'||g.kind==='ribbon'||g.peek&&dy<0||g.top&&view!=='home'&&dy>0)g.axis='y';
   else{touchState=null;return}
  }else return;
  if(g.kind==='paper'&&(g.axis==='y'||view==='cards'))g.surface=$('#screen .loose-paper')||g.surface;
 }
 if(event.cancelable)event.preventDefault();
 if(g.surface&&g.kind!=='ribbon'&&g.kind!=='bookmark'){
  g.surface.classList.add('touch-dragging');
  g.surface.style.transform=g.axis==='x'?`translate3d(${dx*.72}px,0,0)`:`perspective(1000px) translate3d(0,${dy*.4}px,0) rotateX(${Math.max(-22,Math.min(12,dy/7))}deg)`;
 }
}
function finishTouch(event,cancelled=false){
 const g=touchState;if(!g)return;const dx=g.lastX-g.x,dy=g.lastY-g.y,elapsed=performance.now()-g.start;
 const distance=g.axis==='x'?Math.abs(dx):Math.abs(dy),enough=distance>=(g.axis==='x'?66:74)||(distance>35&&distance/Math.max(elapsed,1)>.5),releaseTransform=g.surface?.style.transform||'none';
 if(g.axis){if(event.cancelable)event.preventDefault();suppressClickUntil=performance.now()+450}
 stopDrag();
 if(cancelled||!g.axis||!enough){if(g.surface&&distance>7&&!reducedMotion.matches)g.surface.animate([{transform:g.axis==='x'?`translateX(${dx*.72}px)`:`translateY(${dy*.4}px)`},{transform:'none'}],{duration:180,easing:'ease-out'});return}
 if(g.kind==='ribbon'){if(dx>0||dy>0)setRibbon(false);return}
 if(g.kind==='bookmark'){setRibbon(true);return}
 if(g.kind==='folder'){if(dx<0||dy<0)navigate(g.target.closest('[data-view]').dataset.view,g.target.closest('[data-view]'));return}
 if(g.axis==='x'){
  if(g.kind==='month')turnMonth(dx<0?1:-1);
  else if(view==='cards')turnCard(dx<0?1:-1);
  else nextFile(dx<0?1:-1);
 }else if(dy<0&&g.peek)peelPaper();
 else if(dy>0&&g.top)putAway(releaseTransform);
}
// Safari gesture events supplement CSS so two fingers never scale the study surface.
for(const type of ['gesturestart','gesturechange','gestureend'])document.addEventListener(type,e=>{e.preventDefault();stopDrag()},{passive:false});
document.addEventListener('dblclick',e=>{if(!editable(e.target))e.preventDefault()},{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1){e.preventDefault();stopDrag();return}const t=e.touches[0];startTouch(t.clientX,t.clientY,e.target)},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1){e.preventDefault();stopDrag();return}const t=e.touches[0];moveTouch(t.clientX,t.clientY,e)},{passive:false});
document.addEventListener('touchend',e=>finishTouch(e),{passive:false});
document.addEventListener('touchcancel',e=>finishTouch(e,true),{passive:false});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0){startTouch(e.clientX,e.clientY,e.target);if(touchState)e.preventDefault()}});
document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')moveTouch(e.clientX,e.clientY,e)});
document.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')finishTouch(e)});
document.addEventListener('pointercancel',e=>{if(e.pointerType==='mouse')finishTouch(e,true)});
document.addEventListener('click',e=>{if(performance.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('keydown',e=>{
 if(editable(e.target)||e.altKey||e.ctrlKey||e.metaKey||navigationBusy||ribbonOpen||$('#profile-dialog').open)return;
 if(e.key==='Escape'&&view!=='home'){e.preventDefault();putAway()}
 else if(view!=='notes'&&e.target.closest('#screen')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const d=e.key==='ArrowRight'?1:-1;if(view==='cards')turnCard(d);else if(view!=='home')nextFile(d)}
});
window.addEventListener('resize',stopDrag);
window.addEventListener('pagehide',stopDrag);

render();scrollToFile(view);initQuietScreen();
})();
