  const from=wasHidden?starts[i]:current[i],to=open?ends[i]:starts[i];
  const frames=open&&wasHidden?[from,{transform:`translate3d(${e.offsetWidth*.25}px,${-e.offsetTop*.55}px,0) rotate(0deg)`,clipPath:'inset(0 0 0 0)',offset:.55},to]:[from,to];
  return e.animate(frames,{duration:open?590:370,delay:open?i*65:(items.length-1-i)*38,easing:open?'cubic-bezier(.2,.65,.25,1)':'cubic-bezier(.45,0,.7,.45)',fill:'both'});
 });
 ribbonMoves=moves;await Promise.allSettled(moves.map(a=>a.finished));
 if(turn!==ribbonTurn||!panel.isConnected)return;
 items.forEach((e,i)=>Object.assign(e.style,open?ends[i]:starts[i]));moves.forEach(a=>a.cancel());ribbonMoves=[];panel.hidden=!open;
 if(keyboard)(open?panel:trigger)?.focus({preventScroll:true});
}
document.addEventListener('click',e=>{
 if(navigationBusy){e.preventDefault();e.stopImmediatePropagation();return}
 if(ribbonOpen&&!e.target.closest('.ribbon,[data-secret]')){
  setRibbon(false);e.preventDefault();e.stopImmediatePropagation();
 }
},true);
window.addEventListener('resize',()=>{if(navigationBusy)navigationMoves.forEach(a=>a.cancel())});
reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches){navigationMoves.forEach(a=>a.cancel());if($('#ribbon-stack'))setRibbon(ribbonOpen)}});

function render(){const current=profiles[person],other=profiles[person==='yeonho'?'junghyun':'yeonho'];const picker=$('[data-profile]');picker.innerHTML=current.name+' <span aria-hidden="true">↔</span>';picker.setAttribute('aria-label','현재 '+current.name+', '+other.name+'으로 바꾸기');picker.title=other.name+'으로 바꾸기';ribbonTurn++;ribbonMoves.forEach(a=>a.cancel());ribbonMoves=[];document.documentElement.dataset.view=view;$$('[data-language]').forEach(b=>b.setAttribute('aria-pressed',language===b.dataset.language));$('#screen').innerHTML=({home,cards,reading,speaking,writing,calendar}[view])()}
function changePerson(){
 person=person==='yeonho'?'junghyun':'yeonho';storage='study-files-v14:'+person+':';let saved={};
 try{localStorage.setItem('study-files-person',person);saved=JSON.parse(localStorage.getItem(storage+'data'))||{}}catch(e){}
 data=saved.de&&saved.en?saved:seed();if(!data.notes)data.notes={};
 card=0;revealed=false;selected=today;month=today.slice(0,7);commitView('home');remaining=duration;
}
function pause(){if(timer){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));clearInterval(timer);timer=null}}
function speak(which){if(!window.speechSynthesis){toast('이 브라우저는 읽어 주기를 지원하지 않습니다.');return}speechSynthesis.cancel();const t=text[language],u=new SpeechSynthesisUtterance(which==='card'?t.cards[card][1]:t.reading.join(' '));u.lang=t.lang;u.rate=.85;u.onerror=()=>toast('기기의 음성 설정을 확인해 주세요.');speechSynthesis.speak(u)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view)navigate(b.dataset.view,b);
 else if(b.hasAttribute('data-profile'))changePerson();
 else if(b.dataset.language){pause();language=b.dataset.language;card=0;revealed=false;render()}
 else if(b.hasAttribute('data-secret'))setRibbon(!ribbonOpen,{keyboard:e.detail===0});
 else if(b.hasAttribute('data-translation')){showTranslation=!showTranslation;$('#reading-translation').hidden=!showTranslation;b.setAttribute('aria-expanded',showTranslation);b.textContent=showTranslation?'해석 접기 −':'해석 펼치기 +'}
 else if(b.hasAttribute('data-reveal')){revealed=!revealed;render();$('[data-reveal]')?.focus()}
 else if(b.dataset.rate){card=(card+1)%3;revealed=false;render();toast(b.dataset.rate+' · 다음 문장입니다.')}
 else if(b.dataset.speak)speak(b.dataset.speak);
 else if(b.hasAttribute('data-complete')){if(selected>today)return;const i=Number(b.dataset.complete),s=[...state()];s[i]=!s[i];data[language][selected]=s;persist();render();$('[data-complete="'+i+'"]')?.focus()}
 else if(b.dataset.duration){pause();duration=Number(b.dataset.duration);remaining=duration;render()}
 else if(b.hasAttribute('data-timer')){if(timer){pause();render()}else{if(!remaining)remaining=duration;deadline=Date.now()+remaining*1000;timer=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));if($('[data-clock]'))$('[data-clock]').textContent=clock();if(!remaining){pause();render();toast('말하기 시간이 끝났습니다.')}},200);render()}}
 else if(b.hasAttribute('data-reset')){pause();remaining=duration;render()}
 else if(b.dataset.date){selected=b.dataset.date;month=selected.slice(0,7);render()}
 else if(b.dataset.month){const d=parse(month+'-01');d.setMonth(d.getMonth()+Number(b.dataset.month));month=key(d).slice(0,7);selected=month===today.slice(0,7)?today:month+'-01';render()}
 else if(b.hasAttribute('data-today')){selected=today;month=today.slice(0,7);render()}
});
document.addEventListener('input',e=>{const type=e.target.dataset.note;if(type){data.notes[language+':'+selected+':'+type]=e.target.value;const ok=persist();e.target.nextElementSibling.textContent=ok?'이 브라우저에 저장됨':'저장 공간을 사용할 수 없습니다.'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ribbonOpen){e.preventDefault();setRibbon(false,{keyboard:true})}});
window.addEventListener('pagehide',()=>{navigationMoves.forEach(a=>a.cancel());ribbonMoves.forEach(a=>a.cancel());pause();if(window.speechSynthesis)speechSynthesis.cancel()});
render();
})();
</script></body></html>
