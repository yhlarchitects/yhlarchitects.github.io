<template id="src">
<h3 class="sc fm">등장인물</h3>
<p class="ac li"><b>강도윤</b> (43) 구조기술사. 은월 태건 하임 구조설계자. 일곱 번째 생. 서울 표준말. 부재명과 수치를 먼저, 명사형으로 끊는다. 감정 대신 사실. 하은 앞에서만 문장이 길어진다</p>
<p class="ac li"><b>한서진</b> (39) 대학병원 간호사. 도윤의 아내. 여섯 번을 다 기억한다. 확인형 짧은 지시문. 시간은 늘 숫자(십 분·6주·여덟 달). 남편은 「당신」, 딸은 「강하은」 풀네임</p>
<p class="ac li"><b>강하은</b> (9) 딸. 초등 2학년. 심장 수술 대기. 아이 말에 「~거든」「~잖아」. 어른 말을 제 눈에 보인 대로 바꾸고, 무엇이든 셈으로 되묻는다</p>
<p class="ac li"><b>최태건</b> (68) 태건건설 회장. 그도 돌아온다, 세 번째 생부터. 오른손을 숨긴다. 「우리」를 붙인 직함 존댓말(「우리 강 기술사님」). 열아홉 살 회상에서만 충청 어미</p>
<p class="ac li"><b>문상혁</b> (61) 감리회사 부사장, 책임감리단장. 도윤의 대학원 은사. 교수 반말. 「도윤아」「~냐」「~잖냐」. 변명을 질문으로 되돌린다. 밥·넥타이·석사 시절</p>
<p class="ac li"><b>박재구</b> (52) 현장소장. 둘째가 하은과 같은 반. 경남 말. 「~입니더」「~입니꺼」「마」「고마」. 책임은 늘 도장과 본사에 있다</p>
<p class="ac li"><b>염기수</b> (64) 재건축 조합장. 부동산 아저씨 말. 반말과 존대가 섞이고 억·천이 먼저 나온다</p>
<p class="ac li"><b>노준석</b> (56) 원설계 건축사. 도윤의 선배. 피곤한 선배 반말. 문장을 끝까지 안 한다</p>
<p class="ac li"><b>비서실장</b> (40대) 최태건의 비서실장. 완전 격식. 「회장님께서」. 액수와 날짜만 정확하다</p>
<p class="ac li"><b>배수아</b> (34) 건설 전문 기자. 질문만 한다</p>
<p class="ac li"><b>직원</b> (20대) 도윤의 구조사무소 신입. 「~요」「와」「근데요」. 묻지 않아야 할 것을 묻는다</p>
<p class="ac li"><b>형사</b> (40대) 노준석 추락 담당. 「~더라고요」「~로 보고 있습니다」</p>
<h3 class="sc">관계도</h3>
<p class="ac dg">강씨 집</p>
<p class="ac dg">강도윤 (구조기술사, 일곱 번째 생)</p>
<p class="ac dg"> ├─ 아내: 한서진 (간호사, 지난 여섯 번을 기억한다)</p>
<p class="ac dg"> ├─ 딸: 강하은 (9, 심장 수술 대기 여덟 달)</p>
<p class="ac dg"> └─ 둘째: 강하율 (6주, 이름은 서진이 먼저 지었다)</p>
<p class="ac dg"></p>
<p class="ac dg">은월 태건 하임</p>
<p class="ac dg">최태건 (태건건설 회장. 그도 돌아온다. 오른손을 숨긴다)</p>
<p class="ac dg"> ├─ 비서실장 (봉투와 검토서)</p>
<p class="ac dg"> ├─ 박재구 (현장소장, 도장과 본사)</p>
<p class="ac dg"> ├─ 문상혁 (책임감리단장, 회장과 골프 3년) ─ 확인서 스무 장 ─ 강도윤 (제자)</p>
<p class="ac dg"> ├─ 염기수 (조합장) ─ 기둥 C7 삭제 요구 ─ 강도윤</p>
<p class="ac dg"> └─ 노준석 (원설계 건축사, 도윤의 선배) ─ 수장고 벽을 얇게 그림 → 추락</p>
<p class="ac dg"></p>
<p class="ac dg">밖</p>
<p class="ac dg">배수아 (기자) ─ 기사 ─ 강도윤</p>
<p class="ac dg">직원 (구조사무소 신입) ─ 월급 ─ 강도윤</p>
<p class="ac dg">형사 ─ 단순 추락 ─ 노준석</p>
<h2 class="ep" data-n="1"><span class="en">제1회</span> <span class="et">「첫 삽」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">25층 골조가 한 뼘 내려앉더니 층층이 포개진다. 먼지 구름 아래로 노란 우산 하나가 굴러 나온다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="pa">(V.O., 밝게)</p><p class="ln">아빠, 오늘 그거 하는 날이잖아. 삽으로 흙 퍼는 거.</p></div></div>
<p class="no">〔컷 - S#1으로. 같은 밤의 몇 분 전〕</p>
<h3 class="sc">S#1. 은월 태건 하임 공사 현장 앞 / 밤</h3>
<p class="ac">자막: 착공 364일째</p>
<p class="ac">비. 골조 꼭대기에서 펌프카 붐이 콘크리트를 붓고 있다. 현장 옆 버스정류장, 노란 우산 아래 <b>하은</b>(9)이 휴대폰을 귀에 댄다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">엄마 어디야? 비 엄청 오거든. 우산 썼는데도 다 젖어.</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="pa">(F, 전화 너머, 숨이 차다)</p><p class="ln">지금 나왔어. 십 분이면 가. 정류장에 딱 있어. 어디 가지 말고, 강하은.</p></div></div>
<p class="ac">길 건너편에 차가 선다. <b>강도윤</b>(43, 구조사무소 점퍼)이 내리며 정류장 쪽으로 손을 든다. 하은이 우산을 흔든다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">어, 아빠다!</p></div></div>
<p class="ac">땅 밑에서 둔한 소리가 올라온다. 하은이 발밑을 내려다본다. 건물 전체가 한 뼘 내려앉는다. 그다음 꼭대기 층이 기운다.</p>
<p class="no">〔VFX: 팬케이크 붕괴 - 정면 와이드. 슬래브가 차례로 떨어지고 먼지가 세로 화면 아래에서 위로 차오른다〕</p>
<p class="ac">도윤이 차도로 뛰어든다. 먼지가 그를 삼킨다.</p>
<p class="ac">먼지가 걷힌 자리에 잔해. 노란 우산 끝이 보인다.</p>
<h3 class="sc">S#2. 장례식장 / 낮</h3>
<p class="ac">영정 속 하은. 상주석의 <b>한서진</b>(39)은 도윤 쪽을 보지 않는다. 조문객 둘이 복도에서 낮게 말한다.</p>
<div class="dl" data-name="조문객"><div class="nm">조문객</div><div class="tx"><p class="ln">애 아빠가 글쎄 그 건물 구조를 한 사람이래. 저 사람. 상복 입고 혼자 서 있는.</p></div></div>
<p class="ac">조화가 들어온다. 리본에 「태건건설 회장 최태건」.</p>
<p class="ac">도윤이 일어나 리본을 뜯는다. 아무도 말리지 않는다.</p>
<h3 class="sc">S#3. 맞은편 건물 옥상 / 밤</h3>
<p class="ac">아래로 붕괴 현장의 조명. 도윤의 휴대폰에 문자 하나. 「협의이혼 의사확인 기일 안내」. 그 위에 파일 하나. 「구조검토서 - 1층 기둥 C7 삭제 - 검토자 강도윤」.</p>
<p class="ac">그가 휴대폰을 난간 위에 내려놓는다. 난간 너머로 한 걸음 내딛는다. 암전.</p>
<h3 class="sc">S#4. 도윤의 집 침실 / 아침</h3>
<p class="ac">알람. 도윤이 숨을 들이켜며 눈을 뜬다. 문이 열리고 하은이 침대 위로 뛰어든다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">아빠, 일어나! 오늘 그거 하는 날이잖아. 삽으로 흙 퍼는 거. 나도 가면 안 돼?</p></div></div>
<p class="ac">도윤이 두 손으로 하은의 얼굴을 감싼다. 오래 본다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="pa">(볼이 눌린 채)</p><p class="ln">아빠 왜 그래. 아프거든. 볼 늘어나.</p></div></div>
<p class="ac">부엌에서 서진의 목소리.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="pa">(O.S.)</p><p class="ln">강하은. 아빠 더 자게 두라고 했지. 나와서 양치.</p></div></div>
<p class="ac">도윤이 부엌 쪽을 본다. 연보라 근무복 차림으로 칼질을 하던 서진이 손을 멈추고, 한 박자 길게 그를 본다. 다시 칼질을 한다. 목에 건 병원 출입증이 도마 위에서 흔들린다.</p>
<p class="ac">휴대폰 일정: 「09:00 은월 태건 하임 착공식」.</p>
<p class="no">〔컷: 현관 신발장 옆에 노란 우산이 세워져 있다. 손잡이에 가격표가 그대로 달려 있다〕</p>
<p class="no">〔엔드컷: 새 노란 우산의 가격표가 문틈 바람에 흔들린다. 자막 「D-364」. 컷 아웃.〕</p>
<h2 class="ep" data-n="2"><span class="en">제2회</span> <span class="et">「이 건물, 무너집니다」</span></h2>
<h3 class="sc">S#1. 착공식장 / 낮</h3>
<p class="ac">흰 천막, 현수막 「은월 태건 하임 착공식」. 리본을 단 삽 일곱 자루가 모래 더미에 꽂혀 있다. 단상 옆에 <b>최태건</b>(68, 태건건설 회장), <b>염기수</b>(64, 재건축 조합장).</p>
<div class="dl" data-name="사회자"><div class="nm">사회자</div><div class="tx"><p class="ln">다음은 본 사업의 구조설계를 맡아 주신 강도윤 구조기술사님의 인사 말씀이 있겠습니다. 큰 박수로 맞아 주십시오.</p></div></div>
<p class="ac">도윤이 단상에 선다. 원고를 펼쳤다가 접는다. 맨 앞줄에 조합원들, 그 뒤로 펜스 너머 버스정류장이 보인다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">이 건물, 무너집니다.</p></div></div>
<p class="ac">천막 아래가 조용해진다. 조합장이 먼저 웃는다. 사람들이 따라 웃는다.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="pa">(마이크를 받아 들며)</p><p class="ln">하하. 우리 강 기술사님이 이렇게 꼼꼼하신 분이에요. 무너지지 않게 똑바로 지어라, 우리한테 숙제 주시는 말씀이시죠? 네. 우리 태건이 그렇게 짓겠습니다.</p></div></div>
<p class="ac">박수. 회장이 왼손으로 삽 한 자루를 내민다. 오른손에는 아직 시삽용 흰 장갑이 끼워져 있다. 도윤은 받지 않는다. 회장은 웃으며 그 삽을 조합장에게 건넨다.</p>
<p class="ac">회장이 웃는 얼굴 그대로 도윤의 어깨에 왼손을 얹는다. 박수 소리에 묻히게, 낮게.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="pa">(도윤에게만)</p><p class="ln">애기가 몇 살이랬지, 우리 강 기술사.</p></div></div>
<p class="ac">손이 어깨에서 떨어진다. 회장은 다시 조합원들을 향해 손을 흔든다.</p>
<p class="ac">단상을 내려오는 도윤 앞에 지팡이를 짚은 조합원 노인 하나가 선다.</p>
<div class="dl" data-name="조합원 노인"><div class="nm">조합원 노인</div><div class="tx"><p class="ln">여보쇼, 기술사 양반. 나 거기 들어갈라고 전세 빼서 지금 딸네 집에 얹혀살아. 재수 없는 소리 좀 하지 마쇼.</p></div></div>
<h3 class="sc">S#2. 현장사무소 컨테이너 / 낮</h3>
<p class="ac"><b>박재구</b>(52, 현장소장)가 서류철을 넘긴다.</p>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">이거 끝나믄 저 본사 들어갑니더. 현장 돈 지 십오 년 만에요. <span class="pi">(서류를 넘기다)</span> 아 참, 우리 둘째가 하은이랑 같은 반 됐다 카데요. 집사람이 좋아가 죽을라 캅니더.</p></div></div>
<p class="ac">책상 위에 「자재 공급원 승인 요청서 - 철근 SD400」과 시험성적서. 옆에 샘플 철근 한 토막. 도윤이 철근 표면의 마크를 엄지로 쓸고, 성적서의 제강사 이름과 번갈아 본다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">이 성적서, 발급 기관에 진위 조회 넣겠습니다. 롤마크하고 제강사명 대조부터요.</p></div></div>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">에이, 그건 감리가 할 일이죠. 기술사님은 도면만 봐 주시믄 됩니더.</p></div></div>
<p class="ac">박소장이 샘플 철근 토막을 집어 책상 서랍에 넣는다. 열쇠로 잠근다. 열쇠는 주머니로.</p>
<h3 class="sc">S#3. 도윤의 차 안 / 낮</h3>
<p class="ac">휴대폰으로 성적서와 철근 마크를 찍는다. 메일 제목: 「철근 시험성적서 진위 확인 요청」. 수신: 감리단, 공인시험기관.</p>
<p class="ac">알림 하나가 화면 위로 내려온다. 하은. 「아빠 흙 펐어??? 사진 보내줘!!」</p>
<p class="ac">도윤이 알림을 밀어 올린다. 오른손 새끼손가락이 전송 버튼을 누른다.</p>
<p class="ac">손톱 밑으로 못이 들어오는 통증. 도윤의 숨이 멎는다. 왼손이 오른손 손목을 움켜쥔다. 휴대폰은 오른손에 쥔 채다. 놓지 못한다.</p>
<p class="no">〔VFX: 석화 매크로 - 손톱 끝에서 첫 마디 관절까지 살갗이 회색으로 바뀌고, 표면에 나뭇결 같은 거푸집 송판 무늬가 떠오른다〕</p>
<p class="ac">통증이 첫 마디 관절에서 멈춘다. 도윤이 핸들에 이마를 댄 채 숨을 몰아쉰다. 관자놀이에 식은땀.</p>
<p class="ac">그가 손가락을 구부리려 한다. 구부러지지 않는다. 아무 느낌도 없다.</p>
<p class="no">〔엔드컷: 「전송 완료」 화면 위에 얹힌 새끼손가락, 첫 마디가 회색으로 굳어 있다. 컷 아웃.〕</p>
<h2 class="ep" data-n="3"><span class="en">제3회</span> <span class="et">「한 마디」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">굳은 손가락이 책상을 두드린다. 딱, 딱.</p>
<p class="no">〔컷 - S#1으로. 그날 낮〕</p>
<h3 class="sc">S#1. 도윤의 구조사무소 / 낮</h3>
<p class="ac">자막: D-350</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="pa">(결과지를 내밀며)</p><p class="ln">대표님, 그 철근이요, 결과 나왔는데요. 감리단이 시편 떠서 돌렸는데, 인장강도 미달이래요. 감리단에서 방금 반려 공문 왔어요.</p></div></div>
<p class="ac">직원이 결과지를 다시 내려다본다.</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="pa">(작게)</p><p class="ln">와…… 이게 진짜로 가짜였네. 성적서는 진짜 같았는데.</p></div></div>
<p class="ac">도윤이 오른손을 책상 아래로 내린다.</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="ln">근데 손은 왜 그러세요? 어디 찧으셨어요? 색이 좀……</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">아냐. 괜찮아. 결과지 이리 줘.</p></div></div>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="ln">아, 근데요. 업체는 성적서만 새로 떼서 다시 올린대요. 철근은 그대로고요. 그래도 되는 거예요?</p></div></div>
<h3 class="sc">S#2. 같은 곳, 대표실 / 낮</h3>
<p class="ac">도윤이 감리단에 전화를 건다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">강도윤입니다. 재반입분, 성적서 말고 현물 시험으로요. 다발마다 시편 하나씩, 전수. 한 다발도 빼지 마시고요.</p></div></div>
<p class="ac">전화를 끊는다. 책상 위에 놓인 오른손. 이번에는 그가 지켜보는 앞에서, 두 번째 마디가 천천히 회색으로 바뀐다.</p>
<p class="no">〔VFX: 석화 매크로 - 첫 마디의 경계가 관절을 넘어 번진다. 송판 무늬가 끊기지 않고 이어진다〕</p>
<p class="ac">도윤이 왼손으로 입을 틀어막는다. 소리가 손바닥 안에서 죽는다. 의자가 뒤로 밀려 벽을 친다. 유리벽 너머에서 직원이 고개를 든다.</p>
<p class="ac">회색이 관절 하나를 넘고 멈춘다. 통증도 거기서 멈춘다. 도윤이 손을 내린다. 아랫입술에 잇자국.</p>
<p class="ac">그가 다른 서류 한 장을 집어 든다. 아무 상관 없는 견적서다. 찢는다. 손가락을 본다. 그대로다.</p>
<h3 class="sc">S#3. 사무소 화장실 / 낮</h3>
<p class="ac">세면대. 뜨거운 물을 튼다. 김이 오른다. 도윤이 오른손을 물줄기 아래 둔다. 십 초. 이십 초. 옆 손가락들이 벌겋게 익어 간다. 굳은 두 마디만 회색 그대로다.</p>
<p class="ac">그가 손을 뺀다. 굳은 마디를 왼손으로 꺾어 본다. 뒤로, 더 뒤로. 아무것도 없다. 옆 손가락의 익은 자리만 쓰리다.</p>
<p class="ac">거울 속 자기 얼굴을 본다. 얼굴은 멀쩡하다.</p>
<h3 class="sc">S#4. 사무소 대표실 / 밤</h3>
<p class="ac">텅 빈 사무소. 도윤이 공책에 기억으로 적는다.</p>
<p class="ac">자막 없이 공책 클로즈업:</p>
<p class="ac">1. 철근</p>
<p class="ac">2. 겨울 양생</p>
<p class="ac">3. 1층 기둥 C7 삭제</p>
<p class="ac">4. 규명 불가</p>
<p class="ac">1번 옆에 줄을 긋는다.</p>
<p class="ac">모니터에 메일 알림이 뜬다. 감리단. 「책임감리단장 교체 통보 - 사유: 일신상. 후임 부임 시까지 결재 보류.」 수신 21:40. 낮에 전수 시험을 요구한 전화로부터 아홉 시간.</p>
<p class="ac">도윤이 알림을 닫는다. 펜을 놓는다. 굳은 손가락으로 책상을 두드린다. 딱, 딱. 뼈 소리가 아니다. 돌 소리다.</p>
<p class="ac">서랍에서 커터칼을 꺼낸다. 칼날을 길게 밀어낸다. 굳은 마디 위에 대고, 체중을 실어 누른다. 얼굴이 움직이지 않는다. 거기엔 아무것도 없다.</p>
<p class="no">〔엔드컷: 칼날이 손가락 위에서 휘다가 부러져 튄다. 손가락에는 긁힌 자국 하나 없다. 컷 아웃.〕</p>
<h2 class="ep" data-n="4"><span class="en">제4회</span> <span class="et">「명단」</span></h2>
<h3 class="sc">S#1. 도윤의 집 식탁 / 저녁</h3>
<p class="ac">자막: D-345</p>
<p class="ac">하은이 도윤의 회색 손가락을 두 손으로 쥔다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">아빠 손가락 왜 이렇게 딱딱해? 차갑거든. 완전 얼음이야.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">일하다가 좀 다쳤어. 금방 나아. 아빠가 약 바르고 있어.</p></div></div>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">돌멩이 손이네. 내가 호 해 줄게.</p></div></div>
<p class="ac">하은이 손가락에 입김을 분다. 도윤은 손가락을 보지 않고 하은의 얼굴만 본다. 서진이 접시를 놓는다. 퇴근한 그대로다. 카디건 아래 근무복, 목에 건 병원 출입증을 아직 벗지 않았다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">두 시에 집 전화 왔어. 문 교수. 당신 괜찮냐고.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">……집 번호를 어떻게 알고……?</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">응. 집으로.</p></div></div>
<p class="ac">서진, 하은의 숟가락을 바로 쥐여 준다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">엄마, 아빠 돌멩이 손 좀 봐 줘. 엄마 병원에서 아픈 사람 맨날 보잖아.</p></div></div>
<p class="ac">서진이 그의 오른손을 끌어다 손가락 끝을 하나씩 눌러 본다. 병동에서 하는 손놀림이다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">언제부터 그래? 감각은 있고?</p></div></div>
<p class="ac">도윤이 오른손을 식탁 아래로 내린다. 하은이 그 손을 따라 고개를 숙인다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">안 아파. <span class="pi">(사이)</span> 진짜 안 아파.</p></div></div>
<p class="ac">서진의 눈이 그의 아랫입술 잇자국에 잠깐 머문다. 더 묻지 않는다. 자기 밥그릇에 시선을 둔 채 숟가락을 든다.</p>
<h3 class="sc">S#2. 하은의 방 / 밤</h3>
<p class="ac">잠든 하은. 머리맡에 노란 우산. 도윤이 이불을 끌어 올리다 굳은 손가락이 하은의 이마에 닿는다. 아무 느낌이 없다.</p>
<p class="ac">그가 왼손으로 바꿔 다시 이마를 짚는다. 오래 그대로 있는다.</p>
<h3 class="sc">S#3. 서재 / 밤</h3>
<p class="ac">도윤이 공책에 이름을 적는다. 하나씩. 철근공, 타설공, 신호수, 버스를 기다리던 노인.</p>
<p class="no">〔VFX: 기억 속 추모비 - 검은 돌에 새긴 이름들이 공책 위로 반투명하게 겹친다〕</p>
<p class="ac">일곱 번째, 「강하은」. 펜이 멈춘다. 추모비에는 그 아래 이름이 하나 더 있다. 「강하율(태아)」.</p>
<p class="ac">그가 그 이름을 옮겨 적는다. 고개를 들어 닫힌 침실 문을 본다.</p>
<h3 class="sc">S#4. 같은 곳 / 밤</h3>
<p class="ac">서진이 찻잔을 들고 들어온다. 책상에 잔을 내려놓다가 공책에 눈이 간다. 손이 멈춘다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">이 이름…… 당신, 어디서 났어?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">……</p></div></div>
<p class="ac">서진이 공책을 덮는다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">차 식는다. 마시고 자. 열한 시야.</p></div></div>
<p class="no">〔엔드컷: 덮인 공책 위에 얹힌 서진의 손. 그 손이 떨리고 있다. 컷 아웃.〕</p>
<h2 class="ep" data-n="5"><span class="en">제5회</span> <span class="et">「감리단장」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">붉은 도장 「적합」. 날짜 칸은 내일.</p>
<p class="no">〔컷 - S#1으로. 그날 낮〕</p>
<h3 class="sc">S#1. 감리단 사무실 / 낮</h3>
<p class="ac">자막: D-330</p>
<p class="ac">새 현판 「책임감리단장 문상혁」. 옆자리, 전임 단장의 책상이 비어 있다. 철근을 반려한 사람이다. <b>문상혁</b>(61, 감리회사 부사장, 도윤의 대학원 은사)이 들어오며 도윤의 어깨를 잡고 흔든다. 손에 김밥 봉지.</p>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">어이, 강도윤이. 얼굴이 그게 뭐냐. 밥은 먹고 다니냐? 안 먹었지. 안 먹었잖냐.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">교수님이…… 여기 웬일이세요.</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="pa">(김밥 봉지를 책상에 놓으며)</p><p class="ln">웬일은 무슨 웬일이냐. 회사에서 단장 자리 비었다길래, 네 현장인데 내가 손 안 들게 생겼냐? 학교 그만두고 부사장 명함만 달고 앉았으니까 좀이 쑤셔서 살겠어야지.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">전임 단장님은요? 철근 반려하신 분.</p></div></div>
<p class="ac">문상혁이 빈 책상을 잠깐 본다. 의자를 밀어 넣는다.</p>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">몸이 안 좋다더라. 나이가 있으니까. <span class="pi">(도윤의 어깨를 두드리며)</span> 철근 건은 들었다. 잘했어. 잘했는데, 앞으로 그런 거 보이면 밖으로 보내지 말고 바로 나한테 가져와. 이제 내가 있잖냐.</p></div></div>
<h3 class="sc">S#2. 태건건설 본사 회장실 / 낮</h3>
<p class="ac">회장이 왼손으로 직접 차를 따른다. 오른손은 책상 아래에 있다. 벽에 골프 사진들. 그중 하나에서 회장 옆에 우승컵을 든 사람, 문상혁이다. 사진 아래 날짜는 3년 전.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="ln">우리 현장은요, 다 십 년 이십 년 같이 밥 먹은 사람들이에요. 우리 박 소장, 우리 문 단장. 손발이 척척 맞아요. 우리 강 기술사님도 이제 한 식구시고.</p></div></div>
<p class="ac">회장이 도윤의 찻잔 옆에 놓인 회색 손가락을 본다. 묻지 않는다. 책상 아래 오른손도 올라오지 않는다.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="ln">나 열아홉에 철근 메고 현장 들어간 사람이에요. 충청도 촌놈이. 그때 십장이 나한테 그러더라고. 야 이놈아, 집은 철근으로 서는 게 아니여. 도장으로 서는 거여. 그땐 그게 무슨 소린가 했지. <span class="pi">(차를 한 모금 마신다)</span> 서류에 도장만 맞으면 건물은 서요. 그건 우리 강 기술사님이 누구보다 잘 아실 거고.</p></div></div>
<h3 class="sc">S#3. 회장실 문 앞 복도 / 낮</h3>
<p class="ac">닫힌 회장실 문 앞. 둘만 있다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">교수님도 알고 계셨어요?</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">뭘.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">사진이요. 회장님하고. 철근도요.</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="pa">(회장실 문을 한 번 보고, 목소리를 낮춘다)</p><p class="ln">골프 한 번 같이 친 게 죄냐? 이 바닥에서 회장하고 사진 없는 사람 있으면 데려와 봐라. <span class="pi">(사이)</span> 도윤아, 너 석사 때 육교 처짐 계산 밤새 세 번 다시 돌린 거 기억나냐? 맞는 걸 자꾸 또 돌려. 그게 네 장점인데, 현장에선 그게 사람 잡는다. 너는 네 계산만 해. 나머진 내가 막을게. 그러라고 내가 온 거 아니냐.</p></div></div>
<p class="ac">문상혁이 도윤의 넥타이 매듭을 바로 잡아 준다. 예전에 학회장 앞에서 하던 손짓이다. 그리고 먼저 복도를 걸어 나간다.</p>
<h3 class="sc">S#4. 감리단 사무실 / 밤</h3>
<p class="ac">불 꺼진 사무실. 도윤이 책상 위 감리 일지를 펼친다. 내일 날짜의 검측 칸에 「적합」 도장과 문상혁의 서명.</p>
<p class="ac">한 장 넘긴다. 모레. 「적합」. 또 넘긴다.</p>
<p class="ac">복도에서 발소리. 도윤이 휴대폰을 꺼내 펼쳐진 쪽을 찍는다. 셔터 소리가 빈 사무실에 크게 울린다. 발소리가 문 앞에서 멈췄다가, 지나간다.</p>
<p class="ac">그가 일지를 끝까지 넘긴다.</p>
<p class="no">〔엔드컷: 빠르게 넘어가는 페이지마다, 아직 오지 않은 날짜에 붉은 「적합」 도장이 찍혀 있다. 컷 아웃.〕</p>
<h2 class="ep" data-n="6"><span class="en">제6회</span> <span class="et">「우회」</span></h2>
<h3 class="sc">S#1. 현장 철근 야적장 / 새벽</h3>
<p class="ac">자막: D-315</p>
<p class="ac">트럭에서 철근 다발이 내려진다. 납품서에 「건우스틸」.</p>
<p class="ac">도윤이 다발에 걸린 표찰을 젖히고 몸통의 롤마크를 왼손 엄지로 쓴다. 반려된 그 제강사다. 다음 다발. 그다음 다발도.</p>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="pa">(뒤에서)</p><p class="ln">업체 바뀠심더. 성적서 새로 붙었고예, 감리 승인도 났고예.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">롤마크가 그대로예요. 제강사 동일. 같은 철근입니다.</p></div></div>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">기술사님, 마크가 무슨 상관입니꺼. 도장 났으믄 끝난 깁니더. 마, 고마 가입시더.</p></div></div>
<p class="ac">박소장이 지게차 쪽으로 손짓한다. 다발이 들려 간다. 인부 하나가 도윤을 흘끗 보고 고개를 돌린다.</p>
<h3 class="sc">S#2. 도윤의 차 안 / 새벽</h3>
<p class="ac">휴대폰에 법인 등기 조회. 건우스틸, 설립일은 반려 공문 엿새 뒤. 본점 주소는 태건건설 본사와 같은 건물 7층.</p>
<p class="ac">도윤이 휴대폰을 조수석에 엎어 놓는다. 핸들에서 손을 뗀다. 두 손을 무릎 위에.</p>
<p class="ac">오른손 새끼손가락, 세 번째 마디의 살갗이 회색으로 번지기 시작한다. 왼손 손톱이 시트 가죽에 박힌다.</p>
<p class="no">〔VFX: 석화 매크로 - 이번에는 접촉 없이, 손가락 안쪽에서부터 회색이 배어 나온다〕</p>
<p class="ac">회색은 멈추지 않는다. 도윤은 소리를 내지 않는다. 이를 악문 채 앞유리만 본다. 유리에 김이 서린다. 그의 숨이다.</p>
<p class="no">〔엔드컷: 무릎 위의 오른손, 새끼손가락 세 마디가 모두 회색이다. 앞유리 너머로 철근 다발이 지하로 내려간다. 컷 아웃.〕</p>
<h2 class="ep" data-n="7"><span class="en">제7회</span> <span class="et">「영하 9도」</span></h2>
<h3 class="sc">S#1. 현장 지하 3층 / 밤</h3>
<p class="ac">자막: D-300 · 영하 9도</p>
<p class="ac">기초 매트 타설이 막 끝났다. 천막 아래 열풍기 세 대는 꺼져 있다. 기둥에 걸린 온도계, 영하 2도.</p>
<h3 class="sc">S#2. 현장사무소 / 밤</h3>
<p class="ac">현장 직원이 양생 일지를 채우고 있다. 이번 주 칸마다 「10℃」.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">밖이 영하 9도. 열풍기 세 대 전부 꺼져 있습니다. 매트가 얼면 강도 안 나옵니다.</p></div></div>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">기름값이 하루에 얼만지 아십니꺼? 공정 밀리가 다음 주엔 거푸집 떼야 됩니더. 마, 이거 본사에서 다 보고 있심더.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">문 단장님도 아십니까, 이거.</p></div></div>
<p class="ac">박소장이 대답 대신 일지 맨 아래 칸을 가리킨다. 감리 확인란에 문상혁의 서명이 이미 있다. 현장 직원은 고개를 들지 않고 다음 칸에 「10℃」를 쓴다.</p>
<h3 class="sc">S#3. 지하 3층 / 밤</h3>
<p class="ac">도윤이 무릎을 꿇고 장갑을 벗는다. 굳은 손가락을 갓 친 콘크리트 위에 댄다.</p>
<p class="no">〔VFX: 하중 흐름 - 손가락이 닿은 자리부터 콘크리트가 반투명해진다. 철근 격자 사이로 흰 빛의 선이 흐르다 군데군데 붉게 끊긴다〕</p>
<p class="ac">도윤이 손을 떼지 못한다. 붉게 끊긴 자리가 그의 눈 속에 비친다.</p>
<p class="ac">그가 일어나 천막 아래로 간다. 열풍기 세 대의 스위치를 하나씩 올린다. 더운 바람에 비닐이 부푼다.</p>
<h3 class="sc">S#4. 현장 주차장 / 밤</h3>
<p class="ac">박소장이 차 문을 연다. 조수석에 서류철 하나. 도윤이 그것을 잡는다. 박소장이 팔을 붙든다. 둘이 엉키고, 서류철이 눈 위에 떨어져 펼쳐진다.</p>
<p class="ac">표지 「거푸집·동바리 조기 해체 구조검토 확인서」. 확인자 강도윤. 그의 서명. 날짜는 어제.</p>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="pa">(숨을 고르며)</p><p class="ln">기술사님 사인 아입니꺼. 와 저한테 이라십니꺼. 지는 종이 받아 온 거밖에 없심더.</p></div></div>
<p class="no">〔엔드컷: 눈 위에 펼쳐진 확인서, 어제 날짜 옆의 서명. 마지막 획을 위로 꺾는 버릇까지 도윤의 것이다. 컷 아웃.〕</p>
<h2 class="ep" data-n="8"><span class="en">제8회</span> <span class="et">「백지」</span></h2>
<h3 class="sc">S#1. 구조사무소 / 낮</h3>
<p class="ac">자막: D-299</p>
<p class="ac">라이트 테이블 위에 확인서 사본과 도윤의 옛 서류가 겹쳐 있다. 두 서명이 획 하나 어긋나지 않고 포개진다.</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="ln">와, 똑같은데요. 획 하나도 안 틀려요. 대표님 사인 맞아요.</p></div></div>
<p class="ac">휴대폰 사진첩, 그저께 날짜. 학예회 무대의 하은, 객석의 도윤. 아침부터 저녁까지.</p>
<h3 class="sc">S#2. 대학원 연구실 / 낮 (회상)</h3>
<p class="ac">자막: 3년 전</p>
<p class="ac">짜장면 그릇들 사이로 문상혁이 서류 뭉치를 내민다.</p>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">도윤아, 먹으면서 여기 사인 좀 해 놔라. 용역 확인서. 학교 행정이 하도 느려서 미리 받아 두는 거야. 날짜는 내가 쓸게. 짜장면 불잖냐, 빨리.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">몇 장이에요?</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">스무 장. 왜, 손목 아프냐? 박사 학위 줄 사람한테 스무 장이 아까워?</p></div></div>
<p class="ac">연구실이 웃는다. 도윤이 웃으며, 읽지 않고 한 장씩 서명한다.</p>
<h3 class="sc">S#3. 도윤의 차 안 / 낮 (현재)</h3>
<p class="ac">도윤이 손가락으로 센다. 스무 장. 굳은 손가락은 접히지 않아 왼손으로 센다. 하나가 쓰였다. 열아홉 장이 남았다.</p>
<p class="ac">문상혁에게 전화를 건다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">교수님. 3년 전 연구실, 용역 확인서 스무 장. 기억나세요?</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="pa">(F, 잠시 뒤)</p><p class="ln">……그건 갑자기 왜 묻냐.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">한 장이 현장에서 나왔습니다. 거푸집 조기 해체 확인서. 날짜는 그저께.</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="pa">(F, 긴 사이)</p><p class="ln">너 지금 어디냐. 운전 중이냐?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">나머지 열아홉 장. 어디 있습니까.</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="pa">(F)</p><p class="ln">도윤아. 그거 다 너 지키려고 받아 둔 거야. 지금은 네가 모르는 게 나아. 전화로 할 얘기냐, 이게. 내일 밥 먹자. 응?</p></div></div>
<p class="ac">통화가 끊긴다.</p>
<h3 class="sc">S#4. 도윤의 집 식탁 / 밤</h3>
<p class="ac">식탁 위에 흑백 초음파 사진 한 장. 서진이 맞은편에 앉아 있다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">6주래.</p></div></div>
<p class="ac">도윤이 사진을 집는다. 손이 떨린다. 사진이 들어 있던 봉투가 식탁 위에 엎어져 있다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">……</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="pa">(봉투를 뒤집어 그의 쪽으로 민다)</p><p class="ln">이름도 벌써 정했어.</p></div></div>
<p class="no">〔엔드컷: 봉투 모서리, 서진의 글씨로 「하율」. 6주 된 아이에게 이름이 이미 있다. 컷 아웃.〕</p>
<h2 class="ep" data-n="9"><span class="en">제9회</span> <span class="et">「기둥 하나」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">계기판 14:19. 울리지 않는 휴대폰.</p>
<p class="no">〔컷 - S#1으로. 그날 낮〕</p>
<h3 class="sc">S#1. 조합 사무실 회의실 / 낮</h3>
<p class="ac">자막: D-290</p>
<p class="ac">스크린에 1층 평면도. 조합장이 레이저 포인터로 상가 앞 기둥 하나를 찍는다. C7.</p>
<div class="dl" data-name="염조합장"><div class="nm">염조합장</div><div class="tx"><p class="ln">자, 이 기둥 하나가 상가 입구를 딱 가려요. 이것만 빼면 두 칸이 한 칸으로 확 트여. 그럼 상가 분양가가 34억이 뛰어요, 34억. 조합원 한 집당 분담금이 2천씩 줄어. 2천이 뉘 집 개 이름이야.</p></div></div>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">위에 보를 쪼매 키우믄 됩니더. 전이보 말입니더.</p></div></div>
<p class="ac">문상혁은 회의 내내 볼펜 뚜껑만 딸깍거린다.</p>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="pa">(도윤을 보지 않고)</p><p class="ln">……검토서만 나오면, 감리는 뭐 어떻게든 맞춰 보죠. 검토서가 나오면.</p></div></div>
<p class="ac">모두 도윤을 본다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">C7. 위로 스물네 층. 그 축력이 기둥 하나로 내려옵니다. 한 집에 2천 아끼자고 그걸 빼자고요?</p></div></div>
<p class="ac">조합장이 계산기를 내려놓는다. 문상혁의 볼펜 소리가 멎는다. 아무도 말하지 않는다.</p>
<h3 class="sc">S#2. 도윤의 차 안 / 낮</h3>
<p class="ac">신호 대기. 도윤의 눈앞에 서류 표지가 겹친다.</p>
<p class="no">〔VFX: 첫 생의 기억 - 채도가 빠진 서류가 앞유리 위에 떠오른다. 「1층 기둥 C7 삭제에 따른 전이보 구조검토서 - 검토자 강도윤」. 그 아래 그의 도장〕</p>
<p class="ac">뒤차가 경적을 울린다.</p>
<h3 class="sc">S#3. 초등학교 정문 앞 / 낮</h3>
<p class="ac">교문 너머 운동장, 체육 시간. 줄넘기를 하는 아이들 사이에 노란 머리끈의 하은. 줄을 넘을 때마다 머리끈이 튄다.</p>
<p class="ac">도윤이 차를 세운다. 시동을 끄지 않는다. 계기판 시계, 14:19.</p>
<p class="ac">그가 휴대폰을 무릎 위에 올려놓고 기다린다.</p>
<p class="ac">14:20. 벨이 울린다. 화면에 「하은 담임」.</p>
<p class="no">〔엔드컷: 울리는 휴대폰, 그리고 이미 교문 앞에 서 있는 도윤의 차. 그는 전화를 받기 전에 문을 연다. 컷 아웃.〕</p>
<h2 class="ep" data-n="10"><span class="en">제10회</span> <span class="et">「같은 액수」</span></h2>
<h3 class="sc">S#1. 은월병원 소아심장 외래 / 낮</h3>
<p class="ac">자막: D-288</p>
<p class="ac">모니터에 하은의 심장 초음파. 하은은 진료 의자에서 다리를 흔든다. 서진이 하은의 손을 잡고 있다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">저게 내 심장이에요? 강낭콩 같잖아. 막 움직여.</p></div></div>
<div class="dl" data-name="의사"><div class="nm">의사</div><div class="tx"><p class="ln">수술은 하셔야 합니다. 지금 저희 대기가 여덟 달이에요.</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">저희 병원은 열네 달이에요. 여덟 달이 제일 빠른 거예요.</p></div></div>
<p class="ac">서진이 도윤을 본다. 도윤은 의사의 모니터만 본다.</p>
<h3 class="sc">S#2. 병원 복도 / 낮</h3>
<p class="ac">서진과 하은이 엘리베이터에 오른다. 문이 닫힌다.</p>
<p class="ac">정장 차림의 남자가 기다리고 있다. 회장 비서실장. 봉투 하나와 서류철을 내민다.</p>
<div class="dl" data-name="비서실장"><div class="nm">비서실장</div><div class="tx"><p class="ln">강 기술사님. 회장님께서 따님 말씀을 들으셨습니다. 재단 병원 쪽에 다음 달로 일정을 잡아 드릴 수 있다고 하십니다. 이쪽은 검토만 한번 해 주시면 됩니다.</p></div></div>
<p class="ac">서류철 표지: 「1층 기둥 C7 삭제에 따른 전이보 구조검토서」.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">검토만요.</p></div></div>
<div class="dl" data-name="비서실장"><div class="nm">비서실장</div><div class="tx"><p class="ln">네, 검토만요.</p></div></div>
<h3 class="sc">S#3. 같은 복도 / 낮 (첫 번째 생)</h3>
<p class="no">〔화면 채도를 낮춘다〕</p>
<p class="ac">같은 복도, 같은 남자, 같은 봉투. 그때의 도윤이 서류를 받아 서명하며 말한다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="pa">(첫 생)</p><p class="ln">전이보 춤만 키우면 구조적으로 문제없습니다.</p></div></div>
<p class="ac">비서실장이 고개를 숙인다. 그때의 도윤은 봉투를 주머니에 넣는다.</p>
<h3 class="sc">S#4. 병원 주차장, 도윤의 차 안 / 낮 (현재)</h3>
<p class="ac">봉투에서 띠지 두른 돈다발이 보인다. 띠지의 은행 지점명. 기억 속 띠지와 같다.</p>
<p class="ac">휴대폰에 서진의 문자. 「하은이 차에서 기다려. 어디야?」</p>
<p class="ac">주차장 건너편, 서진의 차 뒷좌석 창에 하은의 얼굴이 붙어 있다. 입김으로 창에 동그라미를 그린다. 도윤 쪽은 보지 못한다.</p>
<p class="ac">도윤이 서류를 펼쳐 무릎에 놓는다. 왼손으로 펜을 쥔다.</p>
<p class="no">〔VFX: 첫 생의 서류가 지금 서류 위에 반투명하게 겹친다. 서명란의 위치가 한 치도 어긋나지 않는다〕</p>
<p class="no">〔엔드컷: 펜촉이 서명란에 닿아 잉크 한 점이 번진다. 첫 생의 서명이 시작된 바로 그 자리. 컷 아웃.〕</p>
<h2 class="ep" data-n="11"><span class="en">제11회</span> <span class="et">「도면에 없는」</span></h2>
<h3 class="sc">S#1. 병원 주차장 / 낮</h3>
<p class="ac">잉크 한 점에서 펜이 멈춰 있다. 도윤이 펜을 든다. 서류를 덮고 봉투 위에 얹는다. 차에서 내려 비서실장에게 돌려준다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">서명 안 합니다.</p></div></div>
<div class="dl" data-name="비서실장"><div class="nm">비서실장</div><div class="tx"><p class="ln">알겠습니다. 그럼 따님은 원래 순번대로 진행되는 것으로 회장님께 보고드리겠습니다. 여덟 달이요.</p></div></div>
<p class="ac">비서실장이 고개를 한 번 숙이고 돌아선다.</p>
<p class="ac">도윤이 차 문을 잡는다. 손등에서 시작한다.</p>
<p class="no">〔VFX: 석화 매크로 - 오른손 손등에서 손목을 넘어 팔꿈치까지 회색이 단숨에 번진다〕</p>
<p class="ac">팔을 안에서부터 부수며 올라온다. 도윤이 무릎을 꿇는다. 아스팔트에 이마가 닿는다. 비명이 반쯤 나오다 턱 안에서 끊긴다. 저만치 비서실장의 구두가 한 번 멈췄다가, 다시 걷는다.</p>
<p class="ac">회색이 팔꿈치에서 멈춘다. 도윤이 일어난다. 두 번 만에. 왼손으로 입을 닦는다. 셔츠 소매를 내리고 단추를 잠근다. 서진의 차가 몇 칸 건너에 있다.</p>
<h3 class="sc">S#2. 같은 주차장, 서진의 차 뒷문 / 낮</h3>
<p class="ac">도윤이 회색 팔을 등 뒤로 감추고 뒷문을 연다. 하은이 창에 그린 입김 동그라미를 손가락으로 짚고 있다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">아빠, 나 수술 언제 해?</p></div></div>
<p class="ac">도윤이 숨을 고르고 나서야 답한다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">여름 지나고.</p></div></div>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">여덟 달이면 몇 밤이야?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">……많이. 아빠가 같이 세 줄게.</p></div></div>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">그럼 나 한 달에 하나씩 그릴래. 여기다. 지워지면 또 그리면 되거든.</p></div></div>
<p class="ac">하은이 유리에 입김을 불어 동그라미 하나를 더 그린다. 운전석의 서진이 사이드미러로 도윤의 소매를 본다. 소매에서 턱으로, 턱에서 아직 마르지 않은 땀으로.</p>
<h3 class="sc">S#3. 구조사무소 / 낮</h3>
<p class="ac">자막: D-270</p>
<p class="ac">책상 위에 내용증명 한 통. 「구조설계 용역 계약 해지 통보 - 은월동 재건축정비사업조합」. 조합장 염기수의 직인. 직원들이 상자에 짐을 싼다.</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="ln">대표님, 저희 다음 달부터는……</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">이번 달 치는 내가 어떻게든 넣을게. 미안하다.</p></div></div>
<p class="ac">직원이 고개를 끄덕이고 자기 머그잔을 상자에 넣는다. 벽에서 준공 사진 액자들을 내린다. 도윤이 설계한 건물들이다.</p>
<p class="ac">도윤은 더 말하지 못한다. 도면 보관함에서 원본 구조도면과 시공 상세도를 꺼내 도면 통에 넣는다.</p>
<h3 class="sc">S#4. 현장 지하 3층 / 밤</h3>
<p class="ac">손전등 하나. 코어 전단벽이 이미 서 있다. 위층에서 경비원의 손전등이 지나간다. 도윤이 기둥 뒤에 몸을 붙인다. 불빛이 멀어진다.</p>
<p class="ac">그가 소매를 걷는다. 팔꿈치까지 회색이다. 손바닥을 벽에 댄다.</p>
<p class="no">〔VFX: 하중 흐름 - 벽 속 빛의 선이 위에서 아래로 흐르다 어느 높이에서 갈라져 사각형 하나를 비켜 돌아간다. 선이 지나지 않는 빈 사각형이 벽 너머에 떠 있다〕</p>
<p class="ac">그가 바닥에 도면을 펼친다. 같은 자리. 벽 두께 400밀리미터, 그 뒤는 흙막이 벽까지 아무것도 없다.</p>
<p class="no">〔엔드컷: 빛의 선이 비켜 가는 빈 사각형. 도면 어디에도 없는 방 하나의 크기다. 컷 아웃.〕</p>
<h2 class="ep" data-n="12"><span class="en">제12회</span> <span class="et">「수장고」</span></h2>
<h3 class="sc">S#1. 지하 3층 기계실 자리 / 새벽</h3>
<p class="ac">자막: D-268</p>
<p class="ac">도윤이 합판 가림막을 젖힌다. 문틀만 선 개구부. 매립된 철제 문틀에 비닐이 감겨 있다.</p>
<p class="ac">그가 굳은 손바닥을 문틀 옆 벽에 댄다. 빛의 선이 가늘다. 벽 두께가 그의 손 한 뼘이 안 된다.</p>
<h3 class="sc">S#2. 노준석 건축사사무소 / 낮</h3>
<p class="ac"><b>노준석</b>(56, 원설계 건축사)이 도면 두 장을 겹쳐 라이트 테이블에 올린다. 오래 본다.</p>
<div class="dl" data-name="노준석"><div class="nm">노준석</div><div class="tx"><p class="ln">회장 개인 창고. 벽은 내가 얇게 그렸고. 구조계산은…… 안 돌렸어. 다시.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">선배님, 거기 코어 벽이에요.</p></div></div>
<div class="dl" data-name="노준석"><div class="nm">노준석</div><div class="tx"><p class="ln">알아. 아니까 그 방 도면이 나한테만 있지.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">그 안에 뭘 넣는데요?</p></div></div>
<div class="dl" data-name="노준석"><div class="nm">노준석</div><div class="tx"><p class="ln">몰라. 난 벽만 그렸어. <span class="pi">(도면을 내린다)</span> 내일 아침에 다 얘기해 줄게. 오늘은 가. 빨리. 뒷문으로.</p></div></div>
<p class="ac">노준석이 창밖을 본다. 길 건너 검은 승용차 한 대가 시동을 켠 채 서 있다.</p>
<h3 class="sc">S#3. 도윤의 집 침실 / 밤</h3>
<p class="ac">시계, 02:14. 협탁 위 무음으로 둔 휴대폰이 켜졌다 꺼진다. 다시 켜졌다 꺼진다. 한 번 더. 도윤과 서진은 등을 돌리고 누워 있다.</p>
<p class="ac">서진의 눈이 떠져 있다. 그녀는 휴대폰 불빛을 보고, 다시 눈을 감는다.</p>
<h3 class="sc">S#4. 같은 곳 / 아침</h3>
<p class="ac">도윤이 휴대폰을 집는다. 부재중 전화 세 통, 노준석, 오전 2시 14분.</p>
<p class="ac">그 아래로 문자 하나가 도착한다.</p>
<p class="no">〔엔드컷: 화면 「[부고] 노준석님께서 별세하셨기에 알려 드립니다」. 부재중 기록 바로 아래. 컷 아웃.〕</p>
<h2 class="ep" data-n="13"><span class="en">제13회</span> <span class="et">「몇 번째야」</span></h2>
<h3 class="sc">S#1. 장례식장 복도 / 밤</h3>
<p class="ac">자막: D-265</p>
<p class="ac">형사가 수첩을 덮는다.</p>
<div class="dl" data-name="형사"><div class="nm">형사</div><div class="tx"><p class="ln">안전고리를 안 걸고 올라가셨더라고요. 단순 추락으로 보고 있습니다.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">새벽 두 시 십사 분. 현장에 왜 가셨답니까.</p></div></div>
<div class="dl" data-name="형사"><div class="nm">형사</div><div class="tx"><p class="ln">글쎄요. 그건 저희도 모르죠. 건축사분들 원래 밤에도 현장 가시고 그러더라고요.</p></div></div>
<p class="ac">형사가 휴대폰 사진 한 장을 보여 주고 거둔다. 바닥에 놓인 안전대. 끊긴 끈의 단면이 반듯하다. 올이 풀린 데가 없다.</p>
<h3 class="sc">S#2. 장례식장 빈소 / 밤</h3>
<p class="ac">조화가 들어온다. 리본에 「태건건설 회장 최태건」. 1회 하은의 장례식과 같은 꽃, 같은 리본 글씨.</p>
<p class="ac">도윤은 이번에는 리본을 뜯지 않는다. 오래 본다.</p>
<p class="ac">옆에 문상혁이 와 선다. 검은 넥타이가 비뚤게 매여 있다. 향에 불을 붙이려는데 라이터가 세 번 만에 켜진다.</p>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">준석이 처음 현장 들어온 해에 내가 거기 감리였다. 스물여섯짜리가 내 계산에 빨간 줄을 긋더라. 끝까지 안 지웠어. <span class="pi">(향을 꽂는다)</span> ……가기 전에 너한테 전화했다며.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">그걸 어떻게 아세요?</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="pa">(영정만 보며)</p><p class="ln">무슨 얘기 하던? 응?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">못 받았습니다. 자느라고.</p></div></div>
<p class="ac">문상혁의 어깨가 조금 내려간다. 안도인지 아닌지 알 수 없다. 그가 도윤의 소매 끝으로 비어져 나온 회색 손을 본다.</p>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">너 요즘 잠은 자냐? 얼굴이 말이 아니다. 병원 한번 가 봐라. 내가 아는 데 있다.</p></div></div>
<p class="ac">그가 도윤의 등을 한 번 짚고 나간다.</p>
<h3 class="sc">S#3. 도윤의 집 식탁 / 밤</h3>
<p class="ac">도윤이 셔츠 소매를 어깨까지 걷어 회색 팔을 식탁 위에 올린다. 서진이 맞은편에 앉는다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">이거, 일하다 다친 거 아니야.</p></div></div>
<p class="ac">서진은 팔을 본다. 도윤이 한참 말을 고른다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">믿기 어려울 거야. 그 건물, 올가을에 무너져. 착공 364일째. 내가 봤어. 하은이가 그 앞 정류장에 서 있었고.</p></div></div>
<p class="ac">서진의 손이 식탁 위에서 멈춘다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">그때 기둥 빼는 서류에 내가 사인했어. 하은이 수술 당겨 준다길래. <span class="pi">(자기 팔을 내려다본다)</span> 이번엔 그런 걸 하나씩 막는데, 막을 때마다 여기가 굳어. 철근 때는 손가락 한 마디였고. 그 서류 돌려준 날은…… 팔 하나. 굳을 땐 뼈가 안에서 쪼개져. 굳고 나면 아무것도 없어.</p></div></div>
<p class="ac">서진이 손을 뻗어 그의 굳은 팔꿈치를 만진다. 놀라지 않는다. 손바닥으로 송판 무늬를 천천히 쓸어 본다. 어디가 어디로 이어지는지 아는 손이다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">굳을 때. 몇 분?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">……손가락은 몇 초. 팔은, 사 분쯤.</p></div></div>
<p class="ac">도윤이 자기 팔 위의 그 손을 본다. 쓸어 내리는 방향이, 굳음이 번진 방향과 같다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">……왜 안 놀라.</p></div></div>
<p class="ac">서진이 손을 거둔다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">당신, 이 얘기 하는 거……</p></div></div>
<p class="no">〔엔드컷: 서진이 고개를 든다. 「…… 몇 번째야?」 컷 아웃.〕</p>
<h2 class="ep" data-n="14"><span class="en">제14회</span> <span class="et">「일곱 번째」</span></h2>
<h3 class="sc">S#1. 도윤의 집 식탁 / 밤 (이어서)</h3>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">무슨 소리야.</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">일곱 번째야. 매번 똑같아. 처음 털어놓는 얼굴로.</p></div></div>
<p class="ac">도윤이 팔을 거둔다. 의자가 뒤로 밀린다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">처음엔 당신이 뛰어내렸고. 그다음 다섯 번은 다 끝에 돌이 돼서 죽었어. 하은이 손 잡고.</p></div></div>
<p class="ac">도윤이 일어선다. 의자가 넘어진다. 하은의 방문을 본다. 닫혀 있다. 다시 서진을 본다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">하은이는.</p></div></div>
<p class="ac">서진이 대답하지 않는다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">내가 굳고 나면. 하은이는.</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="pa">(식탁만 보며)</p><p class="ln">가을은 똑같이 왔어. 매번.</p></div></div>
<p class="ac">도윤이 식탁을 짚는다. 굳은 오른손이 식탁 위에서 돌 소리를 낸다. 하은의 방문 쪽을 보고 목소리를 낮춘다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">다섯 번을. 왜 말 안 했어. 알았으면…….</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">조금씩은 했어. 노 건축사님 전화. 두 시 십사 분. 그거 당신 깨운 적도 있어. 당신이 뛰어가도 그분은 죽더라. 당신만 더 굳고.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">그럼 당신은 왜. 당신은 사인한 거 없잖아. 당신이 왜 돌아와.</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="pa">(식탁만 보며)</p><p class="ln">그날 하은이한테 전화한 거, 나야. 지금 나왔다고. 십 분이면 간다고. 정류장에 딱 있으라고. 비 오는데 그 건물 앞에 세워 둔 게 나야.</p></div></div>
<p class="ac">도윤이 무언가 말하려 한다. 서진이 고개를 젓는다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">당신은 사인을 했고. 나는 거기 세웠고.</p></div></div>
<p class="ac">도윤이 넘어진 의자를 세우지 못하고 그 자리에 주저앉는다. 식탁 위 서진의 손을 굳지 않은 왼손으로 덮는다. 서진이 그 손을 빼서 자기 배 위에 얹는다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">하율이는 원래 그날 내 배 속에 있었어. 그래서 이번엔 일찍 가졌어. 그날엔 없게.</p></div></div>
<p class="ac">도윤이 그 손을 본다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">이번엔 그냥 다 말하기로 했어. 안 해 본 게 그거 하나라서.</p></div></div>
<p class="ac">초인종이 울린다.</p>
<h3 class="sc">S#2. 현관 / 밤</h3>
<p class="ac">경찰 둘, 그 뒤에 사설 구급차 요원 둘.</p>
<div class="dl" data-name="경찰"><div class="nm">경찰</div><div class="tx"><p class="ln">강도윤 씨 되시죠. 자해 위험 신고가 접수됐습니다. 저희랑 같이 좀 가 주셔야겠습니다.</p></div></div>
<p class="ac">요원이 서류를 내민다. 「응급입원 의뢰서」. 의뢰인란에 「문상혁」. 사유란: 「최근 망상 증세, 자해 언급」. 의사 동의란에 은월병원 의사의 서명.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">제가 언제 누구한테 죽겠다고 했는데요?</p></div></div>
<div class="dl" data-name="경찰"><div class="nm">경찰</div><div class="tx"><p class="ln">그건 병원 가셔서 말씀하시면 됩니다. 협조 부탁드립니다.</p></div></div>
<p class="ac">도윤이 뒤로 물러선다. 경찰이 그의 손목을 잡아 수갑을 채운다. 서진이 막아선다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">멀쩡한 사람이에요. 저 간호사예요. 제가 매일 봐요. 그 의뢰서, 동의한 의사 이름 누구예요.</p></div></div>
<p class="ac">경찰이 서진을 비켜 세운다. 방문 틈으로 잠옷 차림의 하은이 내다본다. 도윤이 하은을 보고, 웃어 보이려 한다.</p>
<h3 class="sc">S#3. 구급차 안 / 밤</h3>
<p class="ac">들것에 묶인 도윤. 뒷창 너머로 순찰차가 뒤를 따른다. 요원이 뒷창 커튼을 친다. 옆 창밖으로 은월 태건 하임의 가림막이 지나간다.</p>
<div class="dl" data-name="요원"><div class="nm">요원</div><div class="tx"><p class="ln">혈압 좀 재겠습니다.</p></div></div>
<p class="ac">요원의 손에는 주사기가 들려 있다. 도윤이 수갑 찬 손목을 당긴다. 오른쪽 손목, 회색이다.</p>
<p class="no">〔VFX: 석화 매크로 - 강철 고리가 굳은 손목에 눌려 휘고, 사슬 이음매가 벌어진다〕</p>
<p class="no">〔엔드컷: 끊어진 수갑 사슬이 구급차 바닥에 떨어진다. 손목에는 긁힌 자국 하나 없다. 컷 아웃.〕</p>
<h2 class="ep" data-n="15"><span class="en">제15회</span> <span class="et">「설계자」</span></h2>
<h3 class="sc">S#1. 은월천 둑길 / 새벽</h3>
<p class="ac">셔츠 차림에 점퍼만 걸친 도윤이 걷는다. 오른손에 아직 수갑 한쪽이 매달려 있다. 편의점 앞 공중전화.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">건설경제신문이죠. 배수아 기자 부탁드립니다. <span class="pi">(기다린다)</span></p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">배수아 기자님이십니까. ……은월 태건 하임 구조설계, 강도윤입니다. 쓰실 기사가 있습니다.</p></div></div>
<div class="dl" data-name="배수아"><div class="nm">배수아</div><div class="tx"><p class="pa">(F)</p><p class="ln">……지금 어디세요?</p></div></div>
<p class="ac">도윤이 수화기를 든 채 둑길 너머를 본다. 안개 속에 은월 태건 하임의 골조가 서 있다. 지하층을 다 올리고 지상 1층 거푸집이 걸려 있다.</p>
<h3 class="sc">S#2. 작은 언론사 회의실 / 낮</h3>
<p class="ac">자막: D-250</p>
<p class="ac">카메라 세 대. <b>배수아</b>(34, 건설 전문 기자)가 맨 앞에 앉아 있다. 도윤이 도면 두 장을 겹쳐 든다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">지하 3층 코어 벽. 도면 두께 400, 실제는 한 뼘이 안 됩니다. 그 뒤에 도면에 없는 방이 하나 있습니다. 그 방을……</p></div></div>
<p class="no">〔VFX: 석화 매크로 - 셔츠 깃 아래로 회색이 어깨를 넘어 쇄골로 번진다. 도윤은 도면을 내리지 않는다〕</p>
<p class="ac">문장이 끊긴다. 도면 위쪽이 떨린다. 관자놀이에서 턱까지 땀 한 줄. 카메라 세 대가 그것을 찍는다.</p>
<div class="dl" data-name="배수아"><div class="nm">배수아</div><div class="tx"><p class="ln">괜찮으세요?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">네. <span class="pi">(사이)</span> 계속하겠습니다. 그 방을 넣으려고, 벽을 깎아 냈습니다.</p></div></div>
<div class="dl" data-name="배수아"><div class="nm">배수아</div><div class="tx"><p class="ln">도면 말고 다른 증거 있으세요?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">벽이요. 가서 두께만 재 보시면 됩니다.</p></div></div>
<p class="ac">기자 하나가 노트북을 덮는다.</p>
<h3 class="sc">S#3. 모텔 방 / 밤</h3>
<p class="ac">텔레비전 화면 안, 태건건설 본사 브리핑룸. 플래시 세례. 회장이 서류 묶음을 들어 보인다. 맨 위 장에 도윤의 서명.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="pa">(화면 속)</p><p class="ln">벽이 얇다, 얇다 하시는데요. 그 두께면 괜찮다고 서명해 주신 분이 바로 우리 강도윤 기술사님입니다. 여기, 보십시오.</p></div></div>
<p class="ac">회장이 왼손으로 한 장씩 넘긴다. 오른손은 연단 아래에 있다. 도윤이 텔레비전 앞에서 센다. 열여덟 장. 한 장이 모자란다.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="pa">(화면 속)</p><p class="ln">우리 강 기술사님이 요즘 몸이 많이 안 좋으시다고 들었어요. 한 식구였던 분입니다. 얼른 나으셨으면 합니다.</p></div></div>
<p class="ac">뉴스 자막: 「구조기술사 자작극 의혹, 회사 측 서류 공개」.</p>
<p class="ac">도윤이 거울 앞에서 셔츠를 벗는다. 오른팔에서 어깨를 넘어 쇄골, 가슴 오른쪽 절반까지 회색이다.</p>
<p class="no">〔VFX: 석화 매크로 - 거울 속 몸 위로 송판 무늬가 이어진다. 경계선은 가슴뼈 앞에서 멈춰 있다〕</p>
<p class="ac">왼손 손가락으로 경계선을 누른다. 왼쪽은 아프고, 오른쪽은 없다.</p>
<p class="ac">굳은 오른손으로 모텔 벽을 짚는다. 싸구려 석고보드라 아무것도 보이지 않는다. 그가 손을 내린다.</p>
<p class="ac">휴대폰이 울린다. 서진의 문자.</p>
<p class="ac">「지난 여섯 번도 여기까지는 왔어.」</p>
<p class="ac">도윤이 답장 칸을 누른다. 쓰지 못한다. 창가로 간다. 멀리 타워크레인이 불을 켠 채 서 있다.</p>
<p class="no">〔엔드컷: 문자 화면 너머, 크레인이 다음 층 거푸집을 한 층 더 올린다. 자막 「D-250」. 컷 아웃.〕</p>

  function closeToc() { toc.hidden = true; bToc.setAttribute("aria-expanded", "false"); bToc.focus(); }
  function trapTab(e) {
    var all = toc.querySelectorAll("button"), first = all[0], last = all[all.length - 1];
    if (e.shiftKey && D.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && D.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  bToc.addEventListener("click", function () { if (toc.hidden) openToc(); else closeToc(); });
  tClose.addEventListener("click", closeToc);
  toc.addEventListener("click", function (e) { if (e.target === toc) closeToc(); });

  /* theme */
  function effDark() {
    var a = R.getAttribute("data-look");
    if (a === "dark" || a === "light") return a === "dark";
    try { return WIN.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; }
  }
  bTheme.setAttribute("aria-pressed", String(effDark()));
  bTheme.addEventListener("click", function () {
    var nd = !effDark();
    R.setAttribute("data-look", nd ? "dark" : "light");
    try { localStorage.setItem(THEMEKEY, nd ? "dark" : "light"); } catch (e) {}
    bTheme.setAttribute("aria-pressed", String(nd));
  });

  /* start */
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(POSKEY) || "null"); } catch (e) {}
  relayout(measureWindow(), saved);
  WIN.addEventListener("resize", onResize);
  ready = true;

  /* test hook */
  WIN.__royal = {
    get ready() { return ready; }, get mode() { return S.mode; }, get design() { return S.dk; }, get scale() { return S.sc; },
    get view() { return S.v; }, get viewCount() { return S.views.length; }, get pageCount() { return S.book.pages.length; },
    get contentCount() { return S.book.cc; },
    views: function () { return S.views.slice(); },
    pages: function () { return S.book.pages.map(function (p, i) { return { i: i, kind: p.kind, ep: p.ep || 0, folio: p.folio || 0, u: p.u }; }); },
    epStart: function () { return JSON.parse(JSON.stringify(S.book.epStart)); },
    viewOf: viewOf, renderPage: renderPage, go: jump, turn: turn, busy: busy,
    unitCount: UNITS.length
  };
})();
</script>
