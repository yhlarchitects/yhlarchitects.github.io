<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>D-364</title>
<meta name="description" content="무너지기 364일 전 - 1~15회 대본">
<meta name="theme-color" content="#e8e6e1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:,">
<script>try{var t=localStorage.getItem("yhl-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-look",t)}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --desk:#e8e6e1; --paper:#fbfaf7; --ink:#262523; --mute:#7d7870; --hair:rgba(0,0,0,.07);
  --cover:#dfdcd5; --coverInk:#34322e; --coverMute:#77736b;
  --gut:rgba(40,36,30,.11); --shade:rgba(40,36,30,.22); --drop:rgba(40,36,30,.30);
  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  --pw:560px; --ph:792px; --pt:62px; --pb:58px; --px:52px; --fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-look="light"]){
    color-scheme:dark;
    --desk:#171716; --paper:#262523; --ink:#e3dfd7; --mute:#9b968d; --hair:rgba(255,255,255,.08);
    --cover:#4d4a45; --coverInk:#ece8e0; --coverMute:#b9b4ab;
    --gut:rgba(0,0,0,.34); --shade:rgba(0,0,0,.5); --drop:rgba(0,0,0,.6);
  }
}
:root[data-look="dark"]{
  color-scheme:dark;
  --desk:#171716; --paper:#262523; --ink:#e3dfd7; --mute:#9b968d; --hair:rgba(255,255,255,.08);
  --cover:#4d4a45; --coverInk:#ece8e0; --coverMute:#b9b4ab;
  --gut:rgba(0,0,0,.34); --shade:rgba(0,0,0,.5); --drop:rgba(0,0,0,.6);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* desk, stage, slots */
#desk{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#shift{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph);z-index:1}
.slot[hidden]{display:none}
.slot>.pg{box-shadow:0 1px 2px var(--hair),0 14px 30px -14px var(--drop)}

/* page */
.pg{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);box-sizing:border-box;overflow:hidden;
  background:var(--paper);color:var(--ink);font-size:var(--fs);line-height:1.68;font-family:var(--sans)}
.pg.paper.l::after,.pg.paper.r::after,.pg.inner.l::after,.pg.inner.r::after{content:"";position:absolute;top:0;bottom:0;width:42px;pointer-events:none}
.pg.l::after{right:0;background:linear-gradient(to left,var(--gut),rgba(0,0,0,0))}
.pg.r::after{left:0;background:linear-gradient(to right,var(--gut),rgba(0,0,0,0))}
.pg.solo::after{display:none}
.hd,.ft{position:absolute;left:var(--px);right:var(--px);display:flex;align-items:center;font-size:.7em;color:var(--mute);letter-spacing:.02em}
.hd{top:0;height:var(--pt);justify-content:space-between;gap:1em}
.ft{bottom:0;height:var(--pb);justify-content:center;font-variant-numeric:tabular-nums}
.pg.l .ft{justify-content:flex-start}
.pg.r .ft{justify-content:flex-end}
.pg.solo .ft{justify-content:center}
.bd{position:absolute;left:var(--px);right:var(--px);top:var(--pt);bottom:var(--pb);overflow:hidden;
  word-break:keep-all;overflow-wrap:anywhere;line-break:strict}

/* screenplay */
.bd>*{margin:.6em 0 0}
.bd .ep{font-weight:700;margin:0}
.ep .en{display:block;font-size:.78em;font-weight:500;color:var(--mute);letter-spacing:.08em}
.ep .et{display:block;font-size:1.42em;line-height:1.35;margin-top:.12em}
.bd .sc{font-size:1em;font-weight:700;margin-top:1.5em;line-height:1.5}
.bd .ep+.sc{margin-top:2.2em}
.bd .ac.li{padding-left:1em;text-indent:-1em}
.bd .ac.li.cn{text-indent:0}
.bd .no{font-size:.82em;line-height:1.62;color:var(--mute)}
.bd .dl{display:grid;grid-template-columns:5em minmax(0,1fr);column-gap:.5em}
.dl .nm{font-weight:700;overflow-wrap:anywhere}
.dl .nm .ct{display:block;font-weight:400;font-size:.8em;color:var(--mute)}
.dl .tx p{margin:0}
.dl .pa,.dl .pi{color:var(--mute)}
.bd>:first-child{margin-top:0}

/* covers and front matter */
.pg.cover{background:var(--cover);color:var(--coverInk)}
.pg.cover.r{border-radius:0 3px 3px 0}
.pg.cover.l{border-radius:3px 0 0 3px}
.pg.cover.solo{border-radius:3px}
.cover .ct{position:absolute;left:13%;right:13%;top:22%}
.cover h1{margin:0;font-size:3.4em;line-height:1.15;font-weight:700;letter-spacing:.04em}
.cover .sub{margin:.7em 0 0;font-size:1.12em}
.cover .meta{margin:2.6em 0 0;font-size:.8em;color:var(--coverMute);letter-spacing:.02em}
.cover .au{position:absolute;left:13%;bottom:11%;margin:0;font-size:1em;letter-spacing:.14em}
.cover .bk{position:absolute;left:0;right:0;bottom:9%;margin:0;text-align:center;font-size:.72em;letter-spacing:.2em;color:var(--coverMute)}
.front .fm{position:absolute;left:var(--px);right:var(--px);top:30%}
.front .t{margin:0;font-size:1.7em;font-weight:700;letter-spacing:.04em}
.front .s{margin:.4em 0 0;color:var(--mute)}
.front .n{margin:3.2em 0 0;font-size:.86em;color:var(--mute);line-height:1.7}

/* turning */
.fx{position:absolute;top:0;width:var(--pw);height:var(--ph);z-index:5;pointer-events:none;transform-origin:50% 50%}
.fx-sh{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.fx-band{position:absolute;left:0;top:0;width:100px;height:100px;transform-origin:0 0;opacity:0;
  background:linear-gradient(90deg,var(--shade) 0,rgba(0,0,0,0) 100%),linear-gradient(90deg,var(--shade) 0,rgba(0,0,0,0) 40%),
  linear-gradient(90deg,rgba(0,0,0,.08) 0,rgba(0,0,0,0) 22%)}
.fx-leaf{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
.fx-flap{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;background:var(--paper);will-change:transform}
.fx-fs{position:absolute;left:0;top:0;width:100px;height:100px;transform-origin:0 0;
  background:linear-gradient(90deg,rgba(0,0,0,.2) 0,rgba(0,0,0,.09) 7%,rgba(0,0,0,.035) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.03) 100%)}
.fx.dk .fx-fs{background:linear-gradient(90deg,rgba(0,0,0,.32) 0,rgba(0,0,0,.11) 7%,rgba(255,255,255,.02) 40%,rgba(255,255,255,.045) 100%)}
.fx-bshade{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.04),rgba(0,0,0,.32))}
.pg.thru{opacity:.07}

/* bars */
.bar{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-left)) 0 max(12px,env(safe-area-inset-right));box-sizing:border-box}
#top{top:0;height:44px;justify-content:space-between}
#bot{bottom:0;height:52px;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.bar button{background:none;border:0;border-radius:6px;padding:6px 10px;font-size:14px;color:var(--mute);cursor:pointer;line-height:1.2}
.bar button:hover{background:var(--hair);color:var(--ink)}
.bar button:disabled{opacity:.35;cursor:default;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ttl{font-size:13px;color:var(--mute);letter-spacing:.12em}
#bPrev,#bNext{font-size:20px;padding:2px 12px}
#rng{width:min(38vw,300px);accent-color:var(--mute);margin:0}
#pn{min-width:7.5em;text-align:center;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

/* contents */
#toc{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(20,18,15,.32)}
#toc[hidden]{display:none}
.tin{background:var(--paper);color:var(--ink);width:min(440px,100%);max-height:100%;overflow:auto;border-radius:8px;
  padding:18px 18px 10px;box-sizing:border-box;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
.thd{display:flex;align-items:center;justify-content:space-between}
.thd h2{margin:0;font-size:15px;letter-spacing:.1em}
.thd button{background:none;border:0;border-radius:6px;padding:6px 10px;color:var(--mute);font-size:14px;cursor:pointer}
#tocList{list-style:none;margin:10px 0 0;padding:0}
#tocList button{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:.4em;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--hair);padding:9px 6px;font-size:15px;color:var(--ink);cursor:pointer}
#tocList button:hover{background:var(--hair)}
#tocList .tn{color:var(--mute);font-size:13px}
#tocList .tp{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}

#meas{position:absolute;left:-12000px;top:0;visibility:hidden;width:var(--pw);height:var(--ph);overflow:hidden}
</style>
</head>
<body>
<header id="top" class="bar">
  <button id="bToc" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="toc">차례</button>
  <span class="ttl" aria-hidden="true">D-364</span>
  <button id="bTheme" type="button" aria-label="밝기 바꾸기" aria-pressed="false">◐</button>
</header>
<main id="desk" role="region" aria-roledescription="책" aria-label="D-364 대본">
  <div id="stage"><div id="shift"><div id="slotL" class="slot"></div><div id="slotR" class="slot"></div></div></div>
</main>
<footer id="bot" class="bar">
  <button id="bPrev" type="button" aria-label="이전 쪽">‹</button>
  <input id="rng" type="range" min="0" max="0" value="0" step="1" aria-label="쪽 이동">
  <span id="pn" aria-hidden="true"></span>
  <button id="bNext" type="button" aria-label="다음 쪽">›</button>
</footer>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>

  <div class="tin">
    <div class="thd"><h2 id="tocH">차례</h2><button id="tClose" type="button" aria-label="차례 닫기">닫기</button></div>
    <ol id="tocList"></ol>
  </div>
</div>
<div id="meas" aria-hidden="true"></div>
<template id="src">
<h2 class="ep" data-n="1"><span class="en">제1회</span> <span class="et">「첫 삽」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">25층 골조가 한 뼘 내려앉더니 층층이 포개진다. 먼지 구름 아래로 노란 우산 하나가 굴러 나온다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="pa">(V.O., 밝게)</p><p class="ln">아빠, 오늘 첫 삽 뜨는 날이지?</p></div></div>
<p class="no">〔컷 - S#1으로. 같은 밤의 몇 분 전〕</p>
<h3 class="sc">S#1. 은월 태건 하임 공사 현장 앞 / 밤</h3>
<p class="ac">자막: 착공 364일째</p>
<p class="ac">비. 골조 꼭대기에서 펌프카 붐이 콘크리트를 붓고 있다. 현장 옆 버스정류장, 노란 우산 아래 <b>하은</b>(9)이 휴대폰을 귀에 댄다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">엄마, 언제 와?</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="pa">(F, 전화 너머, 숨이 차다)</p><p class="ln">지금 나왔어. 십 분만. 정류장에서 움직이지 마.</p></div></div>
<p class="ac">길 건너편에 차가 선다. <b>강도윤</b>(43, 구조사무소 점퍼)이 내리며 정류장 쪽으로 손을 든다. 하은이 우산을 흔든다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">아빠다.</p></div></div>
<p class="ac">땅 밑에서 둔한 소리가 올라온다. 하은이 발밑을 내려다본다. 건물 전체가 한 뼘 내려앉는다. 그다음 꼭대기 층이 기운다.</p>
<p class="no">〔VFX: 팬케이크 붕괴 - 정면 와이드. 슬래브가 차례로 떨어지고 먼지가 세로 화면 아래에서 위로 차오른다〕</p>
<p class="ac">도윤이 차도로 뛰어든다. 먼지가 그를 삼킨다.</p>
<p class="ac">먼지가 걷힌 자리에 잔해. 노란 우산 끝이 보인다.</p>
<h3 class="sc">S#2. 장례식장 / 낮</h3>
<p class="ac">영정 속 하은. 상주석의 <b>한서진</b>(39)은 도윤 쪽을 보지 않는다. 조문객 둘이 복도에서 낮게 말한다.</p>
<div class="dl" data-name="조문객"><div class="nm">조문객</div><div class="tx"><p class="ln">저 사람이 그 건물 구조 했대.</p></div></div>
<p class="ac">조화가 들어온다. 리본에 「태건건설 회장 최태건」.</p>
<p class="ac">도윤이 일어나 리본을 뜯는다. 아무도 말리지 않는다.</p>
<h3 class="sc">S#3. 맞은편 건물 옥상 / 밤</h3>
<p class="ac">아래로 붕괴 현장의 조명. 도윤의 휴대폰에 문자 하나. 「협의이혼 의사확인 기일 안내」. 그 위에 파일 하나. 「구조검토서 - 1층 기둥 C7 삭제 - 검토자 강도윤」.</p>
<p class="ac">그가 휴대폰을 난간 위에 내려놓는다. 난간 너머로 한 걸음 내딛는다. 암전.</p>
<h3 class="sc">S#4. 도윤의 집 침실 / 아침</h3>
<p class="ac">알람. 도윤이 숨을 들이켜며 눈을 뜬다. 문이 열리고 하은이 침대 위로 뛰어든다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">아빠, 오늘 첫 삽 뜨는 날이지?</p></div></div>
<p class="ac">도윤이 두 손으로 하은의 얼굴을 감싼다. 오래 본다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">아빠, 아파.</p></div></div>
<p class="ac">부엌에서 서진의 목소리.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="pa">(O.S.)</p><p class="ln">하은아, 아빠 깨우지 말랬지.</p></div></div>
<p class="ac">도윤이 부엌 쪽을 본다. 칼질을 하던 서진이 손을 멈추고, 한 박자 길게 그를 본다. 다시 칼질을 한다.</p>
<p class="ac">휴대폰 일정: 「09:00 은월 태건 하임 착공식」.</p>
<p class="no">〔컷: 현관 신발장 옆에 노란 우산이 세워져 있다. 손잡이에 가격표가 그대로 달려 있다〕</p>
<p class="no">〔엔드컷: 새 노란 우산의 가격표가 문틈 바람에 흔들린다. 자막 「D-364」. 컷 아웃.〕</p>
<h2 class="ep" data-n="2"><span class="en">제2회</span> <span class="et">「이 건물, 무너집니다」</span></h2>
<h3 class="sc">S#1. 착공식장 / 낮</h3>
<p class="ac">흰 천막, 현수막 「은월 태건 하임 착공식」. 리본을 단 삽 일곱 자루가 모래 더미에 꽂혀 있다. 단상 옆에 <b>최태건</b>(68, 태건건설 회장), <b>염기수</b>(64, 재건축 조합장).</p>
<div class="dl" data-name="사회자"><div class="nm">사회자</div><div class="tx"><p class="ln">구조설계를 맡으신 강도윤 구조기술사님의 인사 말씀이 있겠습니다.</p></div></div>
<p class="ac">도윤이 단상에 선다. 원고를 펼쳤다가 접는다. 맨 앞줄에 조합원들, 그 뒤로 펜스 너머 버스정류장이 보인다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">이 건물, 무너집니다.</p></div></div>
<p class="ac">천막 아래가 조용해진다. 조합장이 먼저 웃는다. 사람들이 따라 웃는다.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="pa">(마이크를 받아 들며)</p><p class="ln">우리 강 기술사님이 꼼꼼해서 그래요.</p></div></div>
<p class="ac">박수. 회장이 도윤에게 삽 한 자루를 내민다. 도윤은 받지 않는다. 회장은 웃으며 그 삽을 조합장에게 건넨다.</p>
<p class="ac">단상을 내려오는 도윤 앞에 지팡이를 짚은 조합원 노인 하나가 선다.</p>
<div class="dl" data-name="조합원 노인"><div class="nm">조합원 노인</div><div class="tx"><p class="ln">기술사 양반, 나 그 집 들어가려고 전세 뺐어. 그런 소리 마.</p></div></div>
<h3 class="sc">S#2. 현장사무소 컨테이너 / 낮</h3>
<p class="ac"><b>박재구</b>(52, 현장소장)가 서류철을 넘긴다.</p>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">저는 이 현장 끝나면 본사 들어가야 되는 사람입니다. 참, 우리 애가 하은이랑 같은 반이랍디다. 집사람이 좋아해요.</p></div></div>
<p class="ac">책상 위에 「자재 공급원 승인 요청서 - 철근 SD400」과 시험성적서. 옆에 샘플 철근 한 토막. 도윤이 철근 표면의 마크를 엄지로 쓸고, 성적서의 제강사 이름과 번갈아 본다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">이 성적서, 시험기관에 다시 확인하겠습니다.</p></div></div>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">그건 감리가 볼 일이고요. 기술사님 일은 도면까지예요.</p></div></div>
<h3 class="sc">S#3. 도윤의 차 안 / 낮</h3>
<p class="ac">휴대폰으로 성적서와 철근 마크를 찍는다. 메일 제목: 「철근 시험성적서 진위 확인 요청」. 수신: 감리단, 공인시험기관.</p>
<p class="ac">알림 하나가 화면 위로 내려온다. 하은. 「아빠 삽 떴어? 사진!!」</p>
<p class="ac">도윤이 알림을 밀어 올린다. 오른손 새끼손가락이 전송 버튼을 누른다.</p>
<p class="no">〔VFX: 석화 매크로 - 손톱 끝에서 첫 마디 관절까지 살갗이 회색으로 바뀌고, 표면에 나뭇결 같은 거푸집 송판 무늬가 떠오른다〕</p>
<p class="ac">도윤이 손가락을 구부리려 한다. 구부러지지 않는다.</p>
<p class="no">〔엔드컷: 「전송 완료」 화면 위에 얹힌 새끼손가락, 첫 마디가 회색으로 굳어 있다. 컷 아웃.〕</p>
<h2 class="ep" data-n="3"><span class="en">제3회</span> <span class="et">「한 마디」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">굳은 손가락이 책상을 두드린다. 딱, 딱.</p>
<p class="no">〔컷 - S#1으로. 그날 낮〕</p>
<h3 class="sc">S#1. 도윤의 구조사무소 / 낮</h3>
<p class="ac">자막: D-350</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="pa">(결과지를 내밀며)</p><p class="ln">대표님, 떨어졌답니다. 인장강도 미달. 감리단이 반려 쳤어요.</p></div></div>
<p class="ac">직원이 결과지를 다시 내려다본다.</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="pa">(작게)</p><p class="ln">진짜 가짜였네요.</p></div></div>
<p class="ac">도윤이 오른손을 책상 아래로 내린다.</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="ln">손은 왜 그러세요. 붕대라도.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">괜찮아.</p></div></div>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="ln">업체가 다른 성적서로 다시 올린답니다.</p></div></div>
<h3 class="sc">S#2. 같은 곳, 대표실 / 낮</h3>
<p class="ac">도윤이 감리단에 전화를 건다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">재신청 건도 전수로 시험해 주십시오. 성적서 말고 실물로요.</p></div></div>
<p class="ac">전화를 끊는다. 책상 위에 놓인 오른손. 이번에는 그가 지켜보는 앞에서, 두 번째 마디가 천천히 회색으로 바뀐다.</p>
<p class="no">〔VFX: 석화 매크로 - 첫 마디의 경계가 관절을 넘어 번진다. 송판 무늬가 끊기지 않고 이어진다〕</p>
<p class="ac">도윤이 숨을 참는다. 회색이 관절 하나를 넘고 멈춘다.</p>
<p class="ac">그가 다른 서류 한 장을 집어 든다. 아무 상관 없는 견적서다. 찢는다. 손가락을 본다. 그대로다.</p>
<h3 class="sc">S#3. 사무소 화장실 / 낮</h3>
<p class="ac">세면대. 뜨거운 물을 튼다. 김이 오른다. 도윤이 오른손을 물줄기 아래 둔다. 십 초. 이십 초. 옆 손가락들이 벌겋게 익어 간다. 굳은 두 마디만 회색 그대로다.</p>
<p class="ac">그가 손을 뺀다. 거울 속 자기 얼굴을 본다. 얼굴은 멀쩡하다.</p>
<h3 class="sc">S#4. 사무소 대표실 / 밤</h3>
<p class="ac">텅 빈 사무소. 도윤이 공책에 기억으로 적는다.</p>
<p class="ac">자막 없이 공책 클로즈업:</p>
<p class="ac">1. 철근</p>
<p class="ac">2. 겨울 양생</p>
<p class="ac">3. 1층 기둥 C7 삭제</p>
<p class="ac">4. 규명 불가</p>
<p class="ac">1번 옆에 줄을 긋는다. 펜을 놓는다. 굳은 손가락으로 책상을 두드린다. 딱, 딱. 뼈 소리가 아니다. 돌 소리다.</p>
<p class="ac">서랍에서 커터칼을 꺼낸다. 칼날을 길게 밀어낸다. 굳은 마디 위에 대고, 체중을 실어 누른다.</p>
<p class="no">〔엔드컷: 칼날이 손가락 위에서 휘다가 부러져 튄다. 손가락에는 긁힌 자국 하나 없다. 컷 아웃.〕</p>
<h2 class="ep" data-n="4"><span class="en">제4회</span> <span class="et">「명단」</span></h2>
<h3 class="sc">S#1. 도윤의 집 식탁 / 저녁</h3>
<p class="ac">자막: D-345</p>
<p class="ac">하은이 도윤의 회색 손가락을 두 손으로 쥔다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">아빠 손가락 왜 돌이야?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">장갑 끼고 일하다가.</p></div></div>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">돌손.</p></div></div>
<p class="ac">하은이 손가락에 입김을 분다. 도윤은 손가락을 보지 않고 하은의 얼굴만 본다. 서진이 접시를 놓는다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">손 다쳤어?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">안 아파. <span class="pi">(사이)</span> 진짜 안 아파.</p></div></div>
<p class="ac">서진은 더 묻지 않는다. 자기 밥그릇에 시선을 둔 채 숟가락을 든다.</p>
<h3 class="sc">S#2. 하은의 방 / 밤</h3>
<p class="ac">잠든 하은. 머리맡에 노란 우산. 도윤이 이불을 끌어 올리다 굳은 손가락이 하은의 이마에 닿는다. 아무 느낌이 없다.</p>
<p class="ac">그가 왼손으로 바꿔 다시 이마를 짚는다. 오래 그대로 있는다.</p>
<h3 class="sc">S#3. 서재 / 밤</h3>
<p class="ac">도윤이 공책에 이름을 적는다. 하나씩. 철근공, 타설공, 신호수, 버스를 기다리던 노인.</p>
<p class="no">〔VFX: 기억 속 추모비 - 검은 돌에 새긴 이름들이 공책 위로 반투명하게 겹친다〕</p>
<p class="ac">일곱 번째, 「강하은」. 펜이 멈춘다. 추모비에는 그 아래 이름이 하나 더 있다. 「강하율(태아)」.</p>
<p class="ac">그가 그 이름을 옮겨 적는다. 고개를 들어 닫힌 침실 문을 본다.</p>
<h3 class="sc">S#4. 같은 곳 / 밤</h3>
<p class="ac">서진이 찻잔을 들고 들어온다. 책상에 잔을 내려놓다가 공책에 눈이 간다. 손이 멈춘다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">이 이름, 어디서 봤어?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">……</p></div></div>
<p class="ac">서진이 공책을 덮는다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">늦었어. 자.</p></div></div>
<p class="no">〔엔드컷: 덮인 공책 위에 얹힌 서진의 손. 그 손이 떨리고 있다. 컷 아웃.〕</p>
<h2 class="ep" data-n="5"><span class="en">제5회</span> <span class="et">「감리단장」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">붉은 도장 「적합」. 날짜 칸은 내일.</p>
<p class="no">〔컷 - S#1으로. 그날 낮〕</p>
<h3 class="sc">S#1. 현장사무소 / 낮</h3>
<p class="ac">자막: D-330</p>
<p class="ac">새 현판 「책임감리단장 문상혁」. 옆자리, 전임 단장의 책상이 비어 있다. 철근을 반려한 사람이다. <b>문상혁</b>(61, 감리회사 부사장, 도윤의 대학원 은사)이 도윤의 어깨를 잡는다.</p>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">학교는 작년에 나왔다. 네 현장이라길래 내가 왔다.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">철근 건은 들으셨죠.</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">잘했다. 그런 건 바로 올려.</p></div></div>
<h3 class="sc">S#2. 태건건설 본사 회장실 / 낮</h3>
<p class="ac">회장이 직접 차를 따른다. 벽에 골프 사진들. 그중 하나에서 회장 옆에 우승컵을 든 사람, 문상혁이다. 사진 아래 날짜는 3년 전.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="ln">우리 현장은 다 아는 사이라 일이 빨라요.</p></div></div>
<p class="ac">회장이 도윤의 찻잔 옆에 놓인 회색 손가락을 본다. 묻지 않는다.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="ln">나도 열아홉에 철근 멨어요. 그때 알았지. 철근 굵다고 건물이 서는 게 아니더라고. 도장이 서야 서요. 건물은 서류로 서고, 서류로 무너집니다. 강 기술사님은 서류를 잘 아시는 분이고.</p></div></div>
<h3 class="sc">S#3. 회장실 문 앞 복도 / 낮</h3>
<p class="ac">닫힌 회장실 문 앞. 둘만 있다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">교수님도, 알고 계셨습니까.</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">뭘.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">철근이요.</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="pa">(회장실 문을 보며)</p><p class="ln">너는 계산을 해라. 현장은 내가 본다.</p></div></div>
<p class="ac">문상혁이 먼저 복도를 걸어 나간다.</p>
<h3 class="sc">S#4. 감리단 사무실 / 밤</h3>
<p class="ac">불 꺼진 사무실. 도윤이 책상 위 감리 일지를 펼친다. 내일 날짜의 검측 칸에 「적합」 도장과 문상혁의 서명.</p>
<p class="ac">한 장 넘긴다. 모레. 「적합」. 또 넘긴다.</p>
<p class="ac">복도에서 발소리. 도윤이 휴대폰을 꺼내 펼쳐진 쪽을 찍는다. 셔터 소리가 빈 사무실에 크게 울린다. 발소리가 문 앞에서 멈췄다가, 지나간다.</p>
<p class="ac">그가 일지를 끝까지 넘긴다.</p>
<p class="no">〔엔드컷: 빠르게 넘어가는 페이지마다, 아직 오지 않은 날짜에 붉은 「적합」 도장이 찍혀 있다. 컷 아웃.〕</p>
<h2 class="ep" data-n="6"><span class="en">제6회</span> <span class="et">「우회」</span></h2>
<h3 class="sc">S#1. 현장 철근 야적장 / 새벽</h3>
<p class="ac">자막: D-315</p>
<p class="ac">트럭에서 철근 다발이 내려진다. 납품서에 「건우스틸」.</p>
<p class="ac">도윤이 다발에 걸린 표찰을 젖히고 몸통의 롤마크를 왼손 엄지로 쓴다. 반려된 그 제강사다. 다음 다발. 그다음 다발도.</p>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="pa">(뒤에서)</p><p class="ln">유통사가 바뀐 겁니다. 성적서 새로 붙었고 감리 승인 났어요.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">같은 철근입니다.</p></div></div>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">마크가 서류를 이깁니까.</p></div></div>
<p class="ac">박소장이 지게차 쪽으로 손짓한다. 다발이 들려 간다. 인부 하나가 도윤을 흘끗 보고 고개를 돌린다.</p>
<h3 class="sc">S#2. 도윤의 차 안 / 새벽</h3>
<p class="ac">휴대폰에 법인 등기 조회. 건우스틸, 설립일은 반려 공문 엿새 뒤. 본점 주소는 태건건설 본사와 같은 건물 7층.</p>
<p class="ac">도윤이 휴대폰을 조수석에 엎어 놓는다. 핸들에서 손을 뗀다. 두 손을 무릎 위에.</p>
<p class="ac">오른손 새끼손가락, 세 번째 마디의 살갗이 회색으로 번지기 시작한다.</p>
<p class="no">〔VFX: 석화 매크로 - 이번에는 접촉 없이, 손가락 안쪽에서부터 회색이 배어 나온다〕</p>
<p class="ac">회색은 멈추지 않는다.</p>
<p class="no">〔엔드컷: 무릎 위의 오른손, 새끼손가락 세 마디가 모두 회색이다. 앞유리 너머로 철근 다발이 지하로 내려간다. 컷 아웃.〕</p>
<h2 class="ep" data-n="7"><span class="en">제7회</span> <span class="et">「영하 9도」</span></h2>
<h3 class="sc">S#1. 현장 지하 3층 / 밤</h3>
<p class="ac">자막: D-300 · 영하 9도</p>
<p class="ac">기초 매트 타설이 막 끝났다. 천막 아래 열풍기 세 대는 꺼져 있다. 기둥에 걸린 온도계, 영하 2도.</p>
<h3 class="sc">S#2. 현장사무소 / 밤</h3>
<p class="ac">직원이 양생 일지를 채우고 있다. 이번 주 칸마다 「10℃」.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">이 온도면 얼어요. 강도 안 나옵니다.</p></div></div>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">열풍기 기름값이 하루 얼만데요. 다음 주에 거푸집 뗍니다.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">감리단장님은 아십니까.</p></div></div>
<p class="ac">박소장이 대답 대신 일지 맨 아래 칸을 가리킨다. 감리 확인란에 문상혁의 서명이 이미 있다. 직원은 고개를 들지 않고 다음 칸에 「10℃」를 쓴다.</p>
<h3 class="sc">S#3. 지하 3층 / 밤</h3>
<p class="ac">도윤이 무릎을 꿇고 장갑을 벗는다. 굳은 손가락을 갓 친 콘크리트 위에 댄다.</p>
<p class="no">〔VFX: 하중 흐름 - 손가락이 닿은 자리부터 콘크리트가 반투명해진다. 철근 격자 사이로 흰 빛의 선이 흐르다 군데군데 붉게 끊긴다〕</p>
<p class="ac">도윤이 손을 떼지 못한다. 붉게 끊긴 자리가 그의 눈 속에 비친다.</p>
<p class="ac">그가 일어나 천막 아래로 간다. 열풍기 세 대의 스위치를 하나씩 올린다. 더운 바람에 비닐이 부푼다.</p>
<h3 class="sc">S#4. 현장 주차장 / 밤</h3>
<p class="ac">박소장이 차 문을 연다. 조수석에 서류철 하나. 도윤이 그것을 잡는다. 박소장이 팔을 붙든다. 둘이 엉키고, 서류철이 눈 위에 떨어져 펼쳐진다.</p>
<p class="ac">표지 「거푸집·동바리 조기 해체 구조검토 확인서」. 확인자 강도윤. 그의 서명. 날짜는 어제.</p>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="pa">(숨을 고르며)</p><p class="ln">기술사님이 하신 거잖아요.</p></div></div>
<p class="no">〔엔드컷: 눈 위에 펼쳐진 확인서, 어제 날짜 옆의 서명. 마지막 획을 위로 꺾는 버릇까지 도윤의 것이다. 컷 아웃.〕</p>
<h2 class="ep" data-n="8"><span class="en">제8회</span> <span class="et">「백지」</span></h2>
<h3 class="sc">S#1. 구조사무소 / 낮</h3>
<p class="ac">자막: D-299</p>
<p class="ac">라이트 테이블 위에 확인서 사본과 도윤의 옛 서류가 겹쳐 있다. 두 서명이 획 하나 어긋나지 않고 포개진다.</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="ln">대표님 서명 맞는데요.</p></div></div>
<p class="ac">휴대폰 사진첩, 그저께 날짜. 학예회 무대의 하은, 객석의 도윤. 아침부터 저녁까지.</p>
<h3 class="sc">S#2. 대학원 연구실 / 낮 (회상)</h3>
<p class="ac">자막: 3년 전</p>
<p class="ac">문상혁이 서류 뭉치를 내민다.</p>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">확인서 양식에 서명만 몇 장 해 둬라. 행정이 느려서 그래.</p></div></div>
<p class="ac">젊은 도윤이 읽지 않고 한 장씩 서명한다. 웃으며.</p>
<h3 class="sc">S#3. 도윤의 차 안 / 낮 (현재)</h3>
<p class="ac">도윤이 손가락으로 센다. 스무 장. 굳은 손가락은 접히지 않아 왼손으로 센다. 하나가 쓰였다. 열아홉 장이 남았다.</p>
<p class="ac">문상혁에게 전화를 건다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">교수님, 3년 전 그 양식 스무 장이요.</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="pa">(F, 잠시 뒤)</p><p class="ln">쓸 데가 있어서 받은 거다. 걱정 마라.</p></div></div>
<p class="ac">통화가 끊긴다.</p>
<h3 class="sc">S#4. 도윤의 집 식탁 / 밤</h3>
<p class="ac">식탁 위에 흑백 초음파 사진 한 장. 서진이 맞은편에 앉아 있다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">6주래.</p></div></div>
<p class="ac">도윤이 사진을 집는다. 손이 떨린다. 사진이 들어 있던 봉투가 식탁 위에 엎어져 있다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">……이름은.</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="pa">(봉투를 뒤집어 그의 쪽으로 민다)</p><p class="ln">정했어.</p></div></div>
<p class="no">〔엔드컷: 봉투 모서리, 서진의 글씨로 「하율」. 6주 된 아이에게 이름이 이미 있다. 컷 아웃.〕</p>
<h2 class="ep" data-n="9"><span class="en">제9회</span> <span class="et">「기둥 하나」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">계기판 14:19. 울리지 않는 휴대폰.</p>
<p class="no">〔컷 - S#1으로. 그날 낮〕</p>
<h3 class="sc">S#1. 조합 사무실 회의실 / 낮</h3>
<p class="ac">자막: D-290</p>
<p class="ac">스크린에 1층 평면도. 조합장이 레이저 포인터로 상가 앞 기둥 하나를 찍는다. C7.</p>
<div class="dl" data-name="염조합장"><div class="nm">염조합장</div><div class="tx"><p class="ln">이 기둥이 1층 상가 전면을 막아요. 빼면 두 칸이 한 칸으로 나가. 상가 분양에서 34억, 세대당 2천이야.</p></div></div>
<div class="dl" data-name="박소장"><div class="nm">박소장</div><div class="tx"><p class="ln">전이보 키우면 되죠.</p></div></div>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">구조검토서만 나오면 감리는 문제없고.</p></div></div>
<p class="ac">모두 도윤을 본다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">그 기둥이 스물네 층을 업고 있습니다. 한 집에 2천 받고 내려놓으라는 겁니까.</p></div></div>
<p class="ac">조합장이 계산기를 내려놓는다. 아무도 말하지 않는다.</p>
<h3 class="sc">S#2. 도윤의 차 안 / 낮</h3>
<p class="ac">신호 대기. 도윤의 눈앞에 서류 표지가 겹친다.</p>
<p class="no">〔VFX: 첫 생의 기억 - 채도가 빠진 서류가 앞유리 위에 떠오른다. 「1층 기둥 C7 삭제에 따른 전이보 구조검토서 - 검토자 강도윤」. 그 아래 그의 도장〕</p>
<p class="ac">뒤차가 경적을 울린다.</p>
<h3 class="sc">S#3. 초등학교 정문 앞 / 낮</h3>
<p class="ac">교문 너머 운동장, 체육 시간. 줄넘기를 하는 아이들 사이에 노란 머리끈의 하은. 줄을 넘을 때마다 머리끈이 튄다.</p>
<p class="ac">도윤이 차를 세운다. 시동을 끄지 않는다. 계기판 시계, 14:19.</p>
<p class="ac">그가 휴대폰을 무릎 위에 올려놓고 기다린다.</p>
<p class="ac">14:20. 벨이 울린다. 화면에 「하은 담임」.</p>
<p class="no">〔엔드컷: 울리는 휴대폰, 그리고 이미 교문 앞에 서 있는 도윤의 차. 그는 전화를 받기 전에 문을 연다. 컷 아웃.〕</p>
<h2 class="ep" data-n="10"><span class="en">제10회</span> <span class="et">「같은 액수」</span></h2>
<h3 class="sc">S#1. 은월병원 소아심장 외래 / 낮</h3>
<p class="ac">자막: D-288</p>
<p class="ac">모니터에 하은의 심장 초음파. 하은은 진료 의자에서 다리를 흔든다. 서진이 하은의 손을 잡고 있다.</p>
<div class="dl" data-name="의사"><div class="nm">의사</div><div class="tx"><p class="ln">수술은 해야 합니다. 대기가 여덟 달이에요.</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">제가 일하는 병원은 일 년이 넘어요.</p></div></div>
<p class="ac">서진이 도윤을 본다. 도윤은 의사의 모니터만 본다.</p>
<h3 class="sc">S#2. 병원 복도 / 낮</h3>
<p class="ac">서진과 하은이 엘리베이터에 오른다. 문이 닫힌다.</p>
<p class="ac">정장 차림의 남자가 기다리고 있다. 회장 비서실장. 봉투 하나와 서류철을 내민다.</p>
<div class="dl" data-name="비서실장"><div class="nm">비서실장</div><div class="tx"><p class="ln">다음 달로 당겨 드릴 수 있답니다. 서류는 검토만 해 주시면 되고요.</p></div></div>
<p class="ac">서류철 표지: 「1층 기둥 C7 삭제에 따른 전이보 구조검토서」.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">검토만요.</p></div></div>
<div class="dl" data-name="비서실장"><div class="nm">비서실장</div><div class="tx"><p class="ln">네. 검토만.</p></div></div>
<h3 class="sc">S#3. 같은 복도 / 낮 (첫 번째 생)</h3>
<p class="no">〔화면 채도를 낮춘다〕</p>
<p class="ac">같은 복도, 같은 남자, 같은 봉투. 그때의 도윤이 서류를 받아 서명하며 말한다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="pa">(첫 생)</p><p class="ln">구조적으로는 문제없습니다.</p></div></div>
<p class="ac">비서실장이 고개를 숙인다. 그때의 도윤은 봉투를 주머니에 넣는다.</p>
<h3 class="sc">S#4. 병원 주차장, 도윤의 차 안 / 낮 (현재)</h3>
<p class="ac">봉투에서 띠지 두른 돈다발이 보인다. 띠지의 은행 지점명. 기억 속 띠지와 같다.</p>
<p class="ac">휴대폰에 서진의 문자. 「하은이 차에서 기다려. 어디야?」</p>
<p class="ac">주차장 건너편, 서진의 차 뒷좌석 창에 하은의 얼굴이 붙어 있다. 입김으로 창에 동그라미를 그린다. 도윤 쪽은 보지 못한다.</p>
<p class="ac">도윤이 서류를 펼쳐 무릎에 놓는다. 왼손으로 펜을 쥔다.</p>
<p class="no">〔VFX: 첫 생의 서류가 지금 서류 위에 반투명하게 겹친다. 서명란의 위치가 한 치도 어긋나지 않는다〕</p>
<p class="no">〔엔드컷: 펜촉이 서명란에 닿아 잉크 한 점이 번진다. 첫 생의 서명이 시작된 바로 그 자리. 컷 아웃.〕</p>
<h2 class="ep" data-n="11"><span class="en">제11회</span> <span class="et">「도면에 없는」</span></h2>
<h3 class="sc">S#1. 병원 주차장 / 낮</h3>
<p class="ac">잉크 한 점에서 펜이 멈춰 있다. 도윤이 펜을 든다. 서류를 덮고 봉투 위에 얹는다. 차에서 내려 비서실장에게 돌려준다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">서명 안 합니다.</p></div></div>
<div class="dl" data-name="비서실장"><div class="nm">비서실장</div><div class="tx"><p class="ln">따님 순번은 그대로 두겠습니다. 여덟 달.</p></div></div>
<p class="ac">비서실장이 고개를 한 번 숙이고 돌아선다.</p>
<p class="no">〔VFX: 석화 매크로 - 오른손 손등에서 손목을 넘어 팔꿈치까지 회색이 단숨에 번진다〕</p>
<h3 class="sc">S#2. 같은 주차장, 서진의 차 뒷문 / 낮</h3>
<p class="ac">도윤이 회색 팔을 등 뒤로 감추고 뒷문을 연다. 하은이 창에 그린 입김 동그라미를 손가락으로 짚고 있다.</p>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">아빠, 나 언제 고쳐?</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">여름 지나고.</p></div></div>
<div class="dl" data-name="하은"><div class="nm">하은</div><div class="tx"><p class="ln">그럼 이거 여덟 개 그리면 돼?</p></div></div>
<p class="ac">하은이 유리에 입김을 불어 동그라미 하나를 더 그린다. 운전석의 서진이 백미러로 도윤의 소매를 본다.</p>
<h3 class="sc">S#3. 구조사무소 / 낮</h3>
<p class="ac">자막: D-270</p>
<p class="ac">책상 위에 내용증명 한 통. 「구조설계 용역 계약 해지 통보 - 은월동 재건축정비사업조합」. 조합장 염기수의 직인. 직원들이 상자에 짐을 싼다.</p>
<div class="dl" data-name="직원"><div class="nm">직원</div><div class="tx"><p class="ln">대표님, 다음 달부터는요.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">이번 달 치는 내가 넣을게.</p></div></div>
<p class="ac">직원이 고개를 끄덕이고 자기 머그잔을 상자에 넣는다. 벽에서 준공 사진 액자들을 내린다. 도윤이 설계한 건물들이다.</p>
<p class="ac">도윤은 더 말하지 못한다. 도면 보관함에서 원본 구조도면과 시공 상세도를 꺼내 도면 통에 넣는다.</p>
<h3 class="sc">S#4. 현장 지하 3층 / 밤</h3>
<p class="ac">손전등 하나. 코어 전단벽이 이미 서 있다. 위층에서 경비원의 손전등이 지나간다. 도윤이 기둥 뒤에 몸을 붙인다. 불빛이 멀어진다.</p>
<p class="ac">그가 소매를 걷는다. 팔꿈치까지 회색이다. 손바닥을 벽에 댄다.</p>
<p class="no">〔VFX: 하중 흐름 - 벽 속 빛의 선이 위에서 아래로 흐르다 어느 높이에서 갈라져 사각형 하나를 비켜 돌아간다. 선이 지나지 않는 빈 사각형이 벽 너머에 떠 있다〕</p>
<p class="ac">그가 바닥에 도면을 펼친다. 같은 자리. 벽 두께 400밀리미터, 그 뒤는 흙막이 벽까지 아무것도 없다.</p>
<p class="no">〔엔드컷: 빛의 선이 비켜 가는 빈 사각형. 도면 어디에도 없는 방 하나의 크기다. 컷 아웃.〕</p>
<h2 class="ep" data-n="12"><span class="en">제12회</span> <span class="et">「수장고」</span></h2>
<h3 class="sc">S#1. 지하 3층 기계실 자리 / 새벽</h3>
<p class="ac">자막: D-268</p>
<p class="ac">도윤이 합판 가림막을 젖힌다. 문틀만 선 개구부. 매립된 철제 문틀에 비닐이 감겨 있다.</p>
<p class="ac">그가 굳은 손바닥을 문틀 옆 벽에 댄다. 빛의 선이 가늘다. 벽 두께가 그의 손 한 뼘이 안 된다.</p>
<h3 class="sc">S#2. 노준석 건축사사무소 / 낮</h3>
<p class="ac"><b>노준석</b>(56, 원설계 건축사)이 도면 두 장을 겹쳐 라이트 테이블에 올린다. 오래 본다.</p>
<div class="dl" data-name="노준석"><div class="nm">노준석</div><div class="tx"><p class="ln">회장님 개인 창고야. 벽 두께는 내가 줄였고, 구조계산은 다시 안 했어.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">그 벽이 코어입니다.</p></div></div>
<div class="dl" data-name="노준석"><div class="nm">노준석</div><div class="tx"><p class="ln">알아. 그 방 도면은 나한테만 있어.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">안에 뭐가 있습니까.</p></div></div>
<div class="dl" data-name="노준석"><div class="nm">노준석</div><div class="tx"><p class="ln">나는 벽만 그렸어. <span class="pi">(도면을 내린다)</span> 내일 다 얘기하지. 오늘은 가.</p></div></div>
<p class="ac">노준석이 창밖을 본다. 길 건너 검은 승용차 한 대가 시동을 켠 채 서 있다.</p>
<h3 class="sc">S#3. 도윤의 집 침실 / 밤</h3>
<p class="ac">시계, 02:14. 협탁 위 무음으로 둔 휴대폰이 켜졌다 꺼진다. 다시 켜졌다 꺼진다. 한 번 더. 도윤과 서진은 등을 돌리고 잠들어 있다.</p>
<p class="ac">서진의 눈이 떠져 있다. 그녀는 휴대폰 불빛을 보고, 다시 눈을 감는다.</p>
<h3 class="sc">S#4. 같은 곳 / 아침</h3>
<p class="ac">도윤이 휴대폰을 집는다. 부재중 전화 세 통, 노준석, 오전 2시 14분.</p>
<p class="ac">그 아래로 문자 하나가 도착한다.</p>
<p class="no">〔엔드컷: 화면 「[부고] 노준석님께서 별세하셨기에 알려 드립니다」. 부재중 기록 바로 아래. 컷 아웃.〕</p>
<h2 class="ep" data-n="13"><span class="en">제13회</span> <span class="et">「몇 번째야」</span></h2>
<h3 class="sc">S#1. 장례식장 복도 / 밤</h3>
<p class="ac">자막: D-265</p>
<p class="ac">형사가 수첩을 덮는다.</p>
<div class="dl" data-name="형사"><div class="nm">형사</div><div class="tx"><p class="ln">안전대 고리를 안 걸고 올라가셨어요. 추락사입니다.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">새벽 두 시에 현장에는 왜 갔답니까.</p></div></div>
<div class="dl" data-name="형사"><div class="nm">형사</div><div class="tx"><p class="ln">그건 고인한테 물어보셔야죠.</p></div></div>
<p class="ac">형사가 휴대폰 사진 한 장을 보여 주고 거둔다. 바닥에 놓인 안전대. 끊긴 끈의 단면이 반듯하다. 올이 풀린 데가 없다.</p>
<h3 class="sc">S#2. 장례식장 빈소 / 밤</h3>
<p class="ac">조화가 들어온다. 리본에 「태건건설 회장 최태건」. 1회 하은의 장례식과 같은 꽃, 같은 리본 글씨.</p>
<p class="ac">도윤은 이번에는 리본을 뜯지 않는다. 오래 본다.</p>
<p class="ac">옆에 문상혁이 와 선다. 검은 넥타이.</p>
<div class="dl" data-name="문교수"><div class="nm">문교수</div><div class="tx"><p class="ln">준석이가 죽기 전에 너한테 전화했다더라.</p></div></div>
<p class="ac">도윤이 그를 돌아본다. 문상혁은 영정만 본다. 그리고 향을 꽂고 나간다.</p>
<h3 class="sc">S#3. 도윤의 집 식탁 / 밤</h3>
<p class="ac">도윤이 셔츠 소매를 어깨까지 걷어 회색 팔을 식탁 위에 올린다. 서진이 맞은편에 앉는다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">장갑 끼고 일하다 이런 거 아니야.</p></div></div>
<p class="ac">서진은 팔을 본다. 도윤이 한참 말을 고른다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">기둥 빼는 서류, 내가 서명했었어. 하은이 수술 당겨 준대서.</p></div></div>
<p class="ac">서진의 숟가락이 식탁 위에서 멈춘다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">그 건물이 올가을에 무너져. 하은이가 정류장에 있었어. 고칠 때마다 굳어. 작은 건 한 마디, 내 서명이 걸린 건 팔 하나.</p></div></div>
<p class="ac">서진이 손을 뻗어 그의 굳은 팔꿈치를 만진다. 놀라지 않는다. 손바닥으로 송판 무늬를 천천히 쓸어 본다. 어디가 어디로 이어지는지 아는 손이다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">당신, 이 얘기 하는 거……</p></div></div>
<p class="no">〔엔드컷: 서진이 고개를 든다. 「…… 몇 번째야?」 컷 아웃.〕</p>
<h2 class="ep" data-n="14"><span class="en">제14회</span> <span class="et">「일곱 번째」</span></h2>
<h3 class="sc">S#1. 도윤의 집 식탁 / 밤 (이어서)</h3>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">무슨 소리야.</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">일곱 번째야. 당신은 매번 처음이라고 해.</p></div></div>
<p class="ac">도윤이 팔을 거둔다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">여섯 번 다, 당신은 다 굳어서 죽었어. 하은이 손을 잡은 채로.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">그럼 당신은 왜…….</p></div></div>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="pa">(식탁만 보며)</p><p class="ln">십 분만이라고 했어. 정류장에서 움직이지 말라고, 내가 그랬어.</p></div></div>
<p class="ac">도윤이 무언가 말하려 한다. 서진이 고개를 젓는다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">노 건축사 전화, 깨운 적도 있어. 당신이 가도 그 사람은 죽어. 당신만 더 굳고. <span class="pi">(사이)</span> 하율이는 원래 그날 배 속에 있었어. 이번엔 내가 당겼어. 그날 배 속에 두지 않으려고. 이번엔 말해 주기로 했어. 다른 건 다 해 봤거든.</p></div></div>
<p class="ac">초인종이 울린다.</p>
<h3 class="sc">S#2. 현관 / 밤</h3>
<p class="ac">경찰 둘, 그 뒤에 사설 구급차 요원 둘.</p>
<div class="dl" data-name="경찰"><div class="nm">경찰</div><div class="tx"><p class="ln">자해 위험 신고가 들어왔습니다. 같이 가 주셔야겠습니다.</p></div></div>
<p class="ac">요원이 서류를 내민다. 「응급입원 의뢰서」. 의뢰인란에 「문상혁」. 사유란: 「최근 망상 증세, 자해 언급」. 의사 동의란에 은월병원 의사의 서명.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">제가 누구한테 자해를 말했습니까.</p></div></div>
<div class="dl" data-name="경찰"><div class="nm">경찰</div><div class="tx"><p class="ln">가서 말씀하시면 됩니다.</p></div></div>
<p class="ac">도윤이 뒤로 물러선다. 경찰이 그의 손목을 잡아 수갑을 채운다. 서진이 막아선다.</p>
<div class="dl" data-name="서진"><div class="nm">서진</div><div class="tx"><p class="ln">제 남편이에요. 아무 데도 안 가요.</p></div></div>
<p class="ac">경찰이 서진을 비켜 세운다. 방문 틈으로 잠옷 차림의 하은이 내다본다. 도윤이 하은을 보고, 웃어 보이려 한다.</p>
<h3 class="sc">S#3. 구급차 안 / 밤</h3>
<p class="ac">들것에 묶인 도윤. 뒷창 너머로 순찰차가 뒤를 따른다. 요원이 뒷창 커튼을 친다. 옆 창밖으로 은월 태건 하임의 가림막이 지나간다.</p>
<div class="dl" data-name="요원"><div class="nm">요원</div><div class="tx"><p class="ln">혈압 좀 재겠습니다.</p></div></div>
<p class="ac">요원의 손에는 주사기가 들려 있다. 도윤이 수갑 찬 손목을 당긴다. 오른쪽 손목, 회색이다.</p>
<p class="no">〔VFX: 석화 매크로 - 강철 고리가 굳은 손목에 눌려 휘고, 사슬 이음매가 벌어진다〕</p>
<p class="no">〔엔드컷: 끊어진 수갑 사슬이 구급차 바닥에 떨어진다. 손목에는 긁힌 자국 하나 없다. 컷 아웃.〕</p>
<h2 class="ep" data-n="15"><span class="en">제15회</span> <span class="et">「설계자」</span></h2>
<h3 class="sc">S#1. 은월천 둑길 / 새벽</h3>
<p class="ac">환자복 위로 점퍼를 걸친 도윤이 걷는다. 오른손에 아직 수갑 한쪽이 매달려 있다. 편의점 앞 공중전화.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">배수아 기자님이죠. 은월 태건 하임 구조설계자입니다.</p></div></div>
<div class="dl" data-name="배수아"><div class="nm">배수아</div><div class="tx"><p class="pa">(F)</p><p class="ln">……어디세요.</p></div></div>
<p class="ac">도윤이 수화기를 든 채 둑길 너머를 본다. 안개 속에 은월 태건 하임의 골조가 서 있다. 지하층을 다 올리고 지상 1층 거푸집이 걸려 있다.</p>
<h3 class="sc">S#2. 작은 언론사 회의실 / 낮</h3>
<p class="ac">자막: D-250</p>
<p class="ac">카메라 세 대. <b>배수아</b>(34, 건설 전문 기자)가 맨 앞에 앉아 있다. 도윤이 도면 두 장을 겹쳐 든다.</p>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">지하 3층 코어 벽 뒤에 도면에 없는 방이 있습니다. 그 방을 만들려고 벽을 깎았습니다.</p></div></div>
<p class="no">〔VFX: 석화 매크로 - 셔츠 깃 아래로 회색이 어깨를 넘어 쇄골로 번진다. 도윤은 도면을 내리지 않는다〕</p>
<div class="dl" data-name="배수아"><div class="nm">배수아</div><div class="tx"><p class="ln">증거는요.</p></div></div>
<div class="dl" data-name="도윤"><div class="nm">도윤</div><div class="tx"><p class="ln">벽입니다. 지금 가서 재 보시면 됩니다.</p></div></div>
<p class="ac">기자 하나가 노트북을 덮는다.</p>
<h3 class="sc">S#3. 모텔 방 / 밤</h3>
<p class="ac">텔레비전 화면 안, 태건건설 본사 브리핑룸. 플래시 세례. 회장이 서류 묶음을 들어 보인다. 맨 위 장에 도윤의 서명.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="pa">(화면 속)</p><p class="ln">그 벽이 얇다면, 그 두께에 적합하다고 서명한 분이 계십니다. 강도윤 기술사님입니다.</p></div></div>
<p class="ac">회장이 한 장씩 넘긴다. 도윤이 텔레비전 앞에서 센다. 열여덟 장. 한 장이 모자란다.</p>
<div class="dl" data-name="최회장"><div class="nm">최회장</div><div class="tx"><p class="pa">(화면 속)</p><p class="ln">강 기술사님이 요즘 많이 아프시다고 들었습니다. 빨리 쾌차하시길.</p></div></div>
<p class="ac">뉴스 자막: 「구조기술사 자작극 의혹, 회사 측 서류 공개」.</p>
<p class="ac">도윤이 거울 앞에서 셔츠를 벗는다. 오른팔에서 어깨를 넘어 쇄골, 가슴 오른쪽 절반까지 회색이다.</p>
<p class="no">〔VFX: 석화 매크로 - 거울 속 몸 위로 송판 무늬가 이어진다. 경계선은 가슴뼈 앞에서 멈춰 있다〕</p>
<p class="ac">굳은 오른손으로 모텔 벽을 짚는다. 싸구려 석고보드라 아무것도 보이지 않는다. 그가 손을 내린다.</p>
<p class="ac">휴대폰이 울린다. 서진의 문자.</p>
<p class="ac">「지난 여섯 번도 여기까지는 왔어.」</p>
<p class="ac">도윤이 답장 칸을 누른다. 쓰지 못한다. 창가로 간다. 멀리 타워크레인이 불을 켠 채 서 있다.</p>
<p class="no">〔엔드컷: 문자 화면 너머, 크레인이 다음 층 거푸집을 한 층 더 올린다. 자막 「D-250」. 컷 아웃.〕</p>

    if (anim) cancelAnimationFrame(anim);
    anim = 0;
    var r = pend; pend = null; if (r) r(false);
    teardown(d); drag = null;
    if (go) commit(S.v + d.dir); else showView(S.v);
  }
  function fadeTo(v) {
    commit(v);
    try { shift.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: 200, easing: "ease-out" }); } catch (e) {}
  }
  function turn(dir) {
    finishNow();
    if (!canTurn(dir)) return Promise.resolve();
    if (reduced) { fadeTo(S.v + dir); return Promise.resolve(); }
    var W = S.W, x = S.mode === "spread" ? (dir > 0 ? 2 * W - 1 : 1) : (dir > 0 ? W - 1 : 1);
    var d = begin(dir, x, S.H * 0.92);
    if (!d) return Promise.resolve();
    drag = d;
    return settle(d, true, true);
  }
  function jump(v) {
    finishNow();
    v = clamp(v | 0, 0, S.views.length - 1);
    if (v === S.v) return Promise.resolve();
    if (Math.abs(v - S.v) === 1 && !reduced) return turn(v - S.v);
    fadeTo(v);
    return Promise.resolve();
  }
  function busy() { return !!drag || !!anim; }

  /* ================= layout ================= */
  function measureWindow() {
    var vw = WIN.innerWidth, vh = WIN.innerHeight, aw = vw - 2 * GAP, ah = vh - BAR_T - BAR_B - 8;
    var b = DES.book, c = DES.compact, s2 = Math.min(aw / (2 * b.w), ah / b.h), s1 = Math.min(aw / b.w, ah / b.h), L;
    if (vw > vh * 1.05 && s2 >= 0.62) L = { mode: "spread", dk: "book", sc: s2 };
    else if (s1 >= 0.85) L = { mode: "single", dk: "book", sc: s1 };
    else L = { mode: "single", dk: "compact", sc: Math.min(aw / c.w, ah / c.h) };
    L.sc = Math.min(L.sc, 1.7); L.vw = vw; L.ah = ah;
    return L;
  }
  function relayout(L, a) {
    var changed = L.mode !== S.mode || L.dk !== S.dk;
    if (changed) {
      if (a === undefined) a = anchor();
      S.mode = L.mode; S.dk = L.dk; S.book = getBook(L.dk); buildViews();
    }
    var d = DES[L.dk], sw = (S.mode === "spread" ? 2 : 1) * d.w;
    S.W = d.w; S.H = d.h; S.sc = L.sc;
    setVars(stage, d);
    stage.style.width = sw + "px"; stage.style.height = d.h + "px";
    var left = Math.round((L.vw - sw * L.sc) / 2), top = Math.round(BAR_T + 4 + (L.ah - d.h * L.sc) / 2);
    stage.style.transform = "translate(" + left + "px," + top + "px) scale(" + r4(L.sc) + ")";
    slotL.style.left = "0px"; slotR.style.left = (S.mode === "spread" ? d.w : 0) + "px";
    R.setAttribute("data-mode", S.mode);
    if (changed) S.v = viewForAnchor(a);
    S.v = clamp(S.v, 0, S.views.length - 1);
    showView(S.v); updateUI();
  }
  var rsT = 0;
  function onResize() {
    clearTimeout(rsT);
    rsT = setTimeout(function () {
      if (busy()) { onResize(); return; }
      relayout(measureWindow());
    }, 150);
  }

  /* ================= input ================= */
  function local(e) { var r = shift.getBoundingClientRect(); return { x: (e.clientX - r.left) / S.sc, y: (e.clientY - r.top) / S.sc }; }
  var pd = null;
  function tap(x) {
    if (S.mode === "spread") turn(x >= S.W ? 1 : -1);
    else turn(x < S.W * 0.35 ? -1 : 1);
  }
  desk.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || !toc.hidden) return;
    var pt = local(e);
    pd = { id: e.pointerId, x0: pt.x, y0: pt.y, cx: e.clientX, cy: e.clientY, moved: false };
    try { desk.setPointerCapture(e.pointerId); } catch (err) {}
  });
  desk.addEventListener("pointermove", function (e) {
    if (!pd || e.pointerId !== pd.id) return;
    var dx = e.clientX - pd.cx, dy = e.clientY - pd.cy;
    if (!pd.moved) {
      if (dx * dx + dy * dy < 64) return;
      pd.moved = true;
      var dir = S.mode === "spread" ? (pd.x0 >= S.W ? 1 : -1) : (dx < 0 ? 1 : -1);
      finishNow();
      if (!canTurn(dir)) return;
      if (reduced) { pd.dir = dir; return; }
      drag = begin(dir, pd.x0, pd.y0);
    }
    var pt = local(e);
    if (drag) dragMove(pt.x, pt.y, e.timeStamp);
    else if (pd.dir) pd.last = progressReduced(pd, pt.x);
  });
  function progressReduced(p, x) { return p.dir > 0 ? p.x0 - x : x - p.x0; }
  function release(e) {
    if (!pd || e.pointerId !== pd.id) return;
    var p = pd; pd = null;
    try { desk.releasePointerCapture(e.pointerId); } catch (err) {}
    if (e.type === "pointercancel") { if (drag && drag.target === undefined) settle(drag, false, false); return; }
    if (!p.moved) { tap(local(e).x); return; }
    if (p.dir && !drag) { if ((p.last || 0) > 30) fadeTo(S.v + p.dir); return; }
    var d = drag;
    if (!d || d.target !== undefined) return;
    var h = d.hist, v = 0;
    /* a pointer that rested before letting go carries no flick */
    if (h.length > 1 && e.timeStamp - h[h.length - 1].t < 100) {
      var lastS = h[h.length - 1], j = h.length - 2;
      while (j > 0 && lastS.t - h[j].t < 80) j--;
      var dt = lastS.t - h[j].t;
      if (dt > 0) v = (lastS.pp - h[j].pp) / dt;
    }
    var go = v > FLICK || (d.p > 0.5 && v > -FLICK);
    settle(d, go, false);
  }
  desk.addEventListener("pointerup", release);
  desk.addEventListener("pointercancel", release);

  D.addEventListener("keydown", function (e) {
    if (!toc.hidden) {
      if (e.key === "Escape") { e.preventDefault(); closeToc(); }
      else if (e.key === "Tab") trapTab(e);
      return;
    }
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") && (e.key === " " || e.key === "Enter")) return;
    if (e.target && e.target.tagName === "INPUT" && e.key.indexOf("Arrow") === 0) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); turn(1); }
    else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); turn(-1); }
    else if (k === "Home") { e.preventDefault(); jump(0); }
    else if (k === "End") { e.preventDefault(); jump(S.views.length - 1); }
  });
  bPrev.addEventListener("click", function () { turn(-1); });
  bNext.addEventListener("click", function () { turn(1); });
  rng.addEventListener("input", function () { jump(+rng.value); });

  /* contents */
  TOC.forEach(function (t) {
    var li = D.createElement("li"), b = D.createElement("button"), a = D.createElement("span"), m = D.createElement("span"), c = D.createElement("span");
    b.type = "button"; a.className = "tn"; m.className = "tt"; c.className = "tp";
    a.textContent = "제" + t.n + "회"; m.textContent = "「" + t.t + "」";
    b.appendChild(a); b.appendChild(m); b.appendChild(c);
    b.addEventListener("click", function () { closeToc(); jump(viewOf(S.book.epStart[t.n])); });
    li.appendChild(b); tocList.appendChild(li); t.tp = c;
  });
  function openToc() { toc.hidden = false; bToc.setAttribute("aria-expanded", "true"); var f = tocList.querySelector("button"); if (f) f.focus(); }
  function closeToc() { toc.hidden = true; bToc.setAttribute("aria-expanded", "false"); bToc.focus(); }
  function trapTab(e) {
    var all = toc.querySelectorAll("button"), first = all[0], last = all[all.length - 1];
    if (e.shiftKey && D.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && D.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  bToc.addEventListener("click", function () { if (toc.hidden) openToc(); else closeToc(); });
  tClose.addEventListener("click", closeToc);
  toc.addEventListener("click", function (e) { if (e.target === toc) closeToc(); });

  /* theme */
  function effDark() {
    var a = R.getAttribute("data-look");
    if (a === "dark" || a === "light") return a === "dark";
    try { return WIN.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; }
  }
  bTheme.setAttribute("aria-pressed", String(effDark()));
  bTheme.addEventListener("click", function () {
    var nd = !effDark();
    R.setAttribute("data-look", nd ? "dark" : "light");
    try { localStorage.setItem(THEMEKEY, nd ? "dark" : "light"); } catch (e) {}
    bTheme.setAttribute("aria-pressed", String(nd));
  });

  /* start */
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(POSKEY) || "null"); } catch (e) {}
  relayout(measureWindow(), saved);
  WIN.addEventListener("resize", onResize);
  ready = true;

  /* test hook */
  WIN.__royal = {
    get ready() { return ready; }, get mode() { return S.mode; }, get design() { return S.dk; }, get scale() { return S.sc; },
    get view() { return S.v; }, get viewCount() { return S.views.length; }, get pageCount() { return S.book.pages.length; },
    get contentCount() { return S.book.cc; },
    views: function () { return S.views.slice(); },
    pages: function () { return S.book.pages.map(function (p, i) { return { i: i, kind: p.kind, ep: p.ep || 0, folio: p.folio || 0, u: p.u }; }); },
    epStart: function () { return JSON.parse(JSON.stringify(S.book.epStart)); },
    viewOf: viewOf, renderPage: renderPage, go: jump, turn: turn, busy: busy,
    unitCount: UNITS.length
  };
})();
</script>
</body>
</html>
