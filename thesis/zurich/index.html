<style>
:root{
  color-scheme:light;
  --paper:#f6f5f0; --card:#fffefa; --ink:#12120f; --mute:#77766e; --hair:#d6d4cc; --rule:#12120f;
  --y:#f2f06a; --bl:#c9e6f2; --blh:#c9e6f2; --g:#a8efc6; --gy:#e7e6e0; --must:#a8341c; --chip:#12120f;

  --b:"YDIYGO330","-윤고딕330",var(--r);
  --h:"YDIYGO350","-윤고딕350",var(--r);
  --n:"Helvetica Neue",Helvetica,Arial,var(--r);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#1d1d1b; --card:#262624; --ink:#ecebe6; --mute:#93918a; --hair:#3a3a36; --rule:#ecebe6;
    --gy:#31312d; --must:#e8846c; --blh:#2d4a56;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1d1d1b; --card:#262624; --ink:#ecebe6; --mute:#93918a; --hair:#3a3a36; --rule:#ecebe6;
  --gy:#31312d; --must:#e8846c; --blh:#2d4a56;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--r);font-size:15px;line-height:23px;-webkit-text-size-adjust:100%}
b,strong{font-family:var(--b);font-weight:400}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
.n{font-family:var(--n);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);
  margin:0 -16px;padding:0 16px;height:48px;display:flex;align-items:center;gap:10px}
.top .t{font-family:var(--h);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .s{font-family:var(--n);font-size:12px;color:var(--mute);white-space:nowrap}
.stat{margin-left:auto;font-size:11px;line-height:17px;padding:2px 10px;border-radius:999px;background:var(--gy);color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.stat.ok{background:var(--g);color:var(--chip)}
.stat.err{background:var(--y);color:var(--chip)}
.lang{flex:0 0 auto;appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:2px 10px;
  font-size:12px;line-height:17px;cursor:pointer}
.lang.ic{padding:2px 7px;display:inline-flex;align-items:center}
.lang.ic svg{width:15px;height:15px;display:block}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:29;background:var(--paper);border-bottom:1px solid var(--hair);
  margin:0 -16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;appearance:none;border:1px solid var(--hair);background:transparent;color:var(--mute);border-radius:999px;
  padding:4px 13px;font-size:13px;line-height:19px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab .pk{font-family:var(--n);font-size:10px;margin-left:5px;padding:0 5px;border-radius:999px;background:var(--y);color:var(--chip)}
.tab:focus-visible,.row:focus-visible,li:focus-visible,.pill:focus-visible,.sc:focus-visible,.cx:focus-visible,.lang:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mast{padding:24px 0 4px}
.eyb{font-family:var(--n);font-size:12px;line-height:18px;color:var(--mute);letter-spacing:.02em}
.mast h1{font-family:var(--h);font-size:28px;line-height:35px;letter-spacing:-.01em;text-wrap:balance;margin-top:4px}
.mast p{color:var(--mute);font-size:14px;line-height:22px;margin-top:8px;max-width:56ch}
.mast p.hy{color:var(--ink);font-size:15px;line-height:24px}
.now{font-family:var(--n);font-size:12px;line-height:18px;color:var(--mute);margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.now b{font-family:var(--b);color:var(--ink);font-size:13px}
.k{font-family:var(--h);font-size:12px;line-height:18px;letter-spacing:.06em;color:var(--mute);border-top:1px solid var(--rule);
  padding-top:6px;margin:28px 0 2px;display:flex;justify-content:space-between;gap:10px}
.k .c{font-family:var(--n);letter-spacing:0}
.box{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;margin-top:12px}
.box .lb{font-size:11px;line-height:17px;color:var(--mute)}
.box ul{margin-top:4px}
.box li{display:block;padding:5px 0;border-bottom:1px solid var(--hair);font-size:14px;line-height:22px}
.box li:last-child{border-bottom:0}
.src{font-family:var(--n);font-size:11px;color:var(--mute);margin-left:4px}
.box.fal{border-color:var(--must)}
.box.fal .lb{color:var(--must)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--n);font-size:11px;line-height:17px;padding:1px 9px;border-radius:999px;background:var(--gy);color:var(--ink);white-space:nowrap}
.chip.part{background:var(--y);color:var(--chip)}
.chip.full{background:var(--g);color:var(--chip)}
.chip.no{background:transparent;border:1px solid var(--must);color:var(--must)}
.chip.ink{background:var(--ink);color:var(--paper)}
.row{width:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 0;border:0;
  border-bottom:1px solid var(--hair);background:transparent;text-align:left}
button.row{cursor:pointer}
button.row:hover .nm{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.row .t{font-family:var(--n);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.row .t i{display:block;font-style:normal;color:var(--mute);font-size:11px}
.row .nm{font-family:var(--b);font-size:15px;line-height:22px}
.row .nm .cd{font-family:var(--n);font-size:11px;color:var(--mute);margin-right:6px}
.row .nm i{display:block;font-style:normal;font-family:var(--r);font-size:12px;line-height:18px;color:var(--mute);margin-top:1px}
.row .fl{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.mv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:12px;line-height:19px;color:var(--mute)}
.mv .t{font-family:var(--n)}
.mv.meal{color:var(--ink)}
.mv .alt{display:block;margin-top:2px}
.out{font-size:13px;line-height:21px;margin-top:14px;padding-top:8px;border-top:1px solid var(--hair)}
.out b{font-family:var(--b)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;
  line-height:19px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pill.dark{background:var(--ink);color:var(--paper)}
.pill.sm{padding:3px 11px;font-size:12px}
.sc{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:14px 0;border:0;border-bottom:1px solid var(--hair);
  background:transparent;text-align:left;cursor:pointer}
.sc .L{font-family:var(--n);font-size:13px;line-height:24px;width:26px;height:26px;border:1px solid var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center}
.sc.on .L{background:var(--ink);color:var(--paper)}
.sc .h3{display:block;font-family:var(--h);font-size:18px;line-height:25px;text-wrap:balance}
.sc .p{display:block;font-size:13px;line-height:21px;color:var(--mute);margin-top:3px}
.sc .stats{display:flex;margin-top:8px}
.rec{font-size:14px;line-height:23px;margin-top:14px}
.rec b{font-family:var(--b)}
.tw{overflow-x:auto;margin-top:10px;border-top:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px;line-height:19px}
th,td{text-align:left;vertical-align:top;padding:8px 8px 8px 0;border-bottom:1px solid var(--hair)}
thead th{font-family:var(--h);font-size:13px;line-height:19px;padding-top:10px}
thead th.on{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
tbody th{font-family:var(--b);color:var(--mute);font-size:12px;width:92px;white-space:nowrap}
td.dot{text-align:center;font-family:var(--n)}
.mx td,.mx th{padding:6px 8px 6px 0}
.mx td.dot{width:44px}
.cx{appearance:none;border:0;background:transparent;text-align:left;cursor:pointer;padding:0;font:inherit;color:inherit;text-decoration:underline;
  text-decoration-color:var(--hair);text-underline-offset:3px}
.sheetbox{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column}
.sheetbox .hd{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--rule)}
.sheetbox .hd b{font-family:var(--h);font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetbox .bd{flex:1;overflow:auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.sheetbox .in{max-width:680px;margin:0 auto}
.code{display:inline-block;font-family:var(--n);font-size:11px;line-height:16px;border:1px solid var(--ink);border-radius:999px;padding:1px 8px}
.pg h2{font-family:var(--h);font-size:24px;line-height:31px;letter-spacing:-.01em;margin-top:14px;text-wrap:balance}
.pg .de{font-family:var(--n);font-size:12px;line-height:19px;color:var(--mute);margin-top:2px}
.dl{margin-top:14px;border-top:1px solid var(--hair)}
.dl div{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:13px;line-height:20px}
.dl dt{color:var(--mute);font-size:12px}
.dl dd{overflow-wrap:anywhere}
.dl dd .no{color:var(--must)}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.facts{margin-top:18px}
.facts h4,.qs h4,.ctx h4{font-family:var(--h);font-size:12px;line-height:18px;letter-spacing:.06em;color:var(--mute);border-top:1px solid var(--rule);padding-top:6px}
.facts li{display:block;padding:6px 0;border-bottom:1px solid var(--hair);font-size:14px;line-height:22px}
.facts li:last-child{border-bottom:0}
.ctx{margin-top:22px}
.scsel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.role{font-size:15px;line-height:24px;margin-top:10px}
.role b{font-family:var(--b)}
.qs{margin-top:16px}
ul{list-style:none}
.qs li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;padding:8px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.qs li:last-child{border-bottom:0}
.qs li .mk{font-family:var(--n);font-size:11px;line-height:22px;color:var(--mute)}
.qs li .tx{font-size:14px;line-height:22px}
.qs li .ty{font-family:var(--n);font-size:10px;line-height:16px;padding:0 6px;border-radius:999px;border:1px solid var(--hair);color:var(--mute);margin-right:6px;vertical-align:1px}
.qs li.must .mk{color:var(--must)}
.qs.sense li .mk{color:var(--ink)}
.qs.sense li .tx{background:linear-gradient(transparent 58%,var(--blh) 58%);background-repeat:no-repeat}
.qs li.hit .tx{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px;background:none}
.qs li.hit .mk{color:var(--hair)}
.say{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;margin-top:12px}
.say .l{font-family:var(--n);font-size:14px;line-height:21px}
.say .kk{font-size:13px;line-height:20px;margin-top:4px}
.say .u{font-size:12px;line-height:18px;color:var(--mute);margin-top:3px}
.fl2{margin-top:16px}
.fl2 label{display:flex;gap:8px;align-items:baseline;font-family:var(--b);font-size:14px;line-height:21px}
.fl2 .ask{display:block;font-size:12px;line-height:18px;color:var(--mute);margin:1px 0 6px}
textarea{width:100%;display:block;background:var(--card);color:var(--ink);border:1px solid var(--hair);border-radius:10px;font-family:var(--r);
  font-size:15px;line-height:23px;padding:9px 11px;min-height:64px;resize:vertical;overflow:hidden}
textarea:focus{outline:0;border-color:var(--ink)}
.fl2.hand textarea{background:var(--y);color:var(--chip);border-color:var(--chip)}
.fl2.body textarea{background:var(--bl);color:var(--chip);border-color:var(--chip)}
.cnt{font-family:var(--n);font-size:11px;line-height:17px;color:var(--mute);margin-top:10px}
.else{margin-top:22px}
.else li{display:block;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px;line-height:21px}
.note{font-size:14px;line-height:23px;margin-top:10px}
.note b{font-family:var(--b)}
.gl{margin-top:10px;border-top:1px solid var(--hair)}
.gl div{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--hair);font-size:13px;line-height:20px}
.gl .dw{font-family:var(--n)}
.ck li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--hair);align-items:start}
.ck input{width:17px;height:17px;margin-top:3px;accent-color:var(--ink)}
.ck label{font-size:14px;line-height:22px;cursor:pointer}
.ck label span{display:block;font-size:12px;line-height:18px;color:var(--mute)}
.ck li.on label{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.ck li.on label span{text-decoration:none}
.rq{padding:16px 0 4px;border-top:1px solid var(--hair)}
.rq h3{font-family:var(--h);font-size:17px;line-height:25px;text-wrap:balance}
.rq p{font-size:13px;line-height:21px;color:var(--mute);margin:4px 0 8px}
.rq.hand textarea{background:var(--y);color:var(--chip);border-color:var(--chip);min-height:48px}
.big textarea{min-height:60vh;font-family:var(--n);font-size:12px;line-height:19px;overflow:auto}
.errbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:70;background:var(--must);color:#fff;border-radius:10px;
  padding:10px 14px;font-size:13px;line-height:20px}
footer{border-top:1px solid var(--rule);margin-top:34px;padding-top:10px;font-size:11px;line-height:18px;color:var(--mute)}
@media (max-width:400px){
  .wrap{padding:0 14px 96px}.top,.tabs{margin:0 -14px;padding-left:14px;padding-right:14px}
  .mast h1{font-size:24px;line-height:31px}.top .s{display:none}
  .row{grid-template-columns:46px minmax(0,1fr) auto;gap:8px}.mv{grid-template-columns:46px minmax(0,1fr);gap:8px}
}
@media (prefers-reduced-motion:no-preference){.sheetbox{animation:fi .14s ease-out}@keyframes fi{from{opacity:.5}to{opacity:1}}}
</style>

 privacy"}, "noPhoto": false, "stop": {"k": "버스 32 뢴트겐슈트라세 · 중앙역에서 걸어서", "e": "Bus 32 to Röntgenstrasse · walk from Zürich HB"}, "facts": [{"k": "싼 집과 여러 주거 형태, 잘게 나눈 가게들, 함께 쓰는 방이 많다", "e": "Affordable flats for many ways of living, a fine-grained mix of shops and many shared rooms"}, {"k": "3층 높이 공공 포럼과 바깥 계단 둘이 선로 테라스와 거리의 가게를 이어, 좁은 땅에 높은 공공성을 만든다", "e": "A three-storey public forum and two outdoor stairs link the track terrace to the street shops — high publicness on a tight plot"}, {"k": "철도 시설 같은 날것의 표정 — 시간이 지나며 바뀔 중립 화면. 나무·관목·허브 1,000여 포기", "e": "Raw, railway-like character — a neutral canvas that will change over the years; around 1,000 trees, shrubs and herbs planted"}]}}, "SC": {"A": {"tab": {"k": "장부", "e": "Ledger"}, "title": {"k": "장부 — 신앙은 해산했고, 장부는 살아남았나", "e": "The Ledger — faith was dissolved; did the ledger survive?"}, "eyb": {"k": "바젤과 종교 · 취리히 대조", "e": "Basel and religion · a Zürich comparison"}, "hy": {"k": "바젤은 종교개혁 때 수도원을 없애면서도 그 수입을 교회·학교 기금으로 남겼다. 바젤이 물려받은 것은 건물이 아니라 장부였다는 가설이다. 취리히에서 묻는다 — 수입에 붙은 꼬리표(학교 · 빈민 구제)가 건물의 다음 쓰임을 정했나.", "e": "When Basel dissolved its monasteries in the Reformation, it kept their income in a church-and-school fund. The hypothesis: what Basel inherited was not the buildings but the ledger. In Zürich the question is — did the label on the income (school, poor relief) decide what the buildings became next?"}, "known": [{"k": "그로스뮌스터 참사회원 녹봉이 신학교(카롤리눔, 1525 수업 시작) 교수 봉급이 됐고, 참사회는 1832년에야 폐지", "e": "The Grossmünster canons’ benefices paid the professors of the theological school (the Carolinum, teaching from 1525); the chapter was abolished only in 1832", "src": {"k": "영문 위키", "e": "Wikipedia (en)"}}, {"k": "카펠: 1527 수도회가 스스로 시에 넘김 → 소년 기숙학교 → 국유지 → 1834 사회 목적 → 1983 교회 교육관", "e": "Kappel: in 1527 the convent handed itself to the city → boys’ boarding school → state domain → social use from 1834 → church education centre from 1983", "src": {"k": "독일어 위키", "e": "Wikipedia (de)"}}, {"k": "칼 데어 그로세: 종교개혁 뒤 구빈청 등 → 여성협회 → 1974 노인센터 → 모두의 센터 → 토론의 집", "e": "Karl der Grosse: after the Reformation the poor-relief office among others → Women’s Association → 1974 senior centre → centre for all → debating house", "src": {"k": "공식 소개", "e": "official"}}, {"k": "헬페라이: 츠빙글리의 집 → 1855 부목사 거처 → 2014 문화의 집", "e": "Helferei: Zwingli’s home → assistant pastor’s house from 1855 → culture house 2014", "src": {"k": "reformiert-info.de", "e": "reformiert-info.de"}}, {"k": "2026 비프킹엔: 소유는 교구, 발주는 시, 쓰임은 학교·돌봄", "e": "Wipkingen 2026: owned by the parish, commissioned by the city, used as school and day care", "src": {"k": "공식 소개", "e": "official"}}, {"k": "ZAZ 전시: 교회세가 줄어 교구가 전용에서 철거까지 전략을 찾는다", "e": "ZAZ exhibition: with church tax falling, parishes look for strategies from conversion to demolition", "src": {"k": "공식 소개", "e": "official"}}], "fal": [{"k": "구빈 기금 · 학교 기금이 가진 건물이 꼬리표와 상관없는 쓰임(병영 · 창고 · 민간 매각)으로 흩어졌다 → 「꼬리표」 가설 기각", "e": "Buildings held by poor-relief or school funds scattered into uses unrelated to the label (barracks, stores, private sale) → the ‘label’ hypothesis fails"}, {"k": "전시의 오늘 사례에서 교구가 소유를 지킨 교회와 판 교회의 운명(전용 · 철거)에 차이가 없다 → 장부 가설 자체가 약해진다", "e": "In today’s cases in the exhibition, churches the parish kept and churches it sold fared no differently (conversion or demolition) → the ledger hypothesis itself weakens"}, {"k": "취리히도 바젤과 같은 구조다 → 「바젤만의 이야기」는 버리고 가설을 개혁 도시 일반으로 넓힌다 — 이것도 전진", "e": "Zürich shows the same structure as Basel → drop ‘a story only Basel tells’ and widen the hypothesis to Reformed cities in general — also progress"}], "read": {"k": "읽는 순서: 1525 그로스뮌스터·헬페라이(학교를 먹인 녹봉) → 1527 카펠(국유지·학교) → 종교개혁 뒤 칼 데어 그로세(구빈청) → 1834 카펠(사회 목적) → 2014 헬페라이(문화의 집) → 2026 비프킹엔(교회 속 학교) → 전시(지금 진행 중인 해산). 걷는 순서는 아래 시각표를 따른다.", "e": "Reading order: 1525 Grossmünster and Helferei (benefices feeding a school) → 1527 Kappel (state domain, school) → post-Reformation Karl der Grosse (poor-relief office) → 1834 Kappel (social use) → 2014 Helferei (culture house) → 2026 Wipkingen (a s emolish churches. <b>The data for failure test ② is here</b>."}, "qs": [{"k": "!사례 패널을 전부 찍는다 — 사례마다 「소유(교구 유지 · 매각 · 시)」와 「결과(전용 · 철거 · 그대로)」를 돌아와서 표로.", "e": "!Photograph every case panel — for each case, ‘ownership (kept by parish · sold · city)’ and ‘outcome (converted · demolished · unchanged)’, to tabulate later."}, {"k": "철거된 사례는 헐기 전에 기록(도면 · 사진 · 모사)을 남겼나 — 「헐릴 때는 먼저 베껴졌다」의 오늘판.", "e": "Were demolished cases recorded first (drawings, photos, copies)? — today’s version of ‘copied before it came down’."}, {"k": "교구가 판 교회 가운데 살아남은 것 — 누가 샀나.", "e": "Churches the parish sold that survived — who bought them?"}, {"k": "취리히 교회 가운데 전시에 나온 곳은 몇 곳인가.", "e": "How many Zürich churches appear in the exhibition?"}, {"k": "전시가 말하는 「지켜야 할 의례적 질」 — 건물의 무엇을 가리키나.", "e": "The ‘ritual qualities worth keeping’ the exhibition names — what in the building do they point to?"}], "ss": [{"k": "1931년 빌라 계단 난간 — 손에 닿는 재료", "e": "The 1931 villa’s stair handrail — the material under your hand"}, {"k": "전시실 빛 — 창인가 조명인가", "e": "Light in the exhibition rooms — windows or lamps?"}, {"k": "호숫가 쪽 창 — 빌라가 물을 어떻게 보나", "e": "The lakeside windows — how the villa looks at the water"}], "de": {"q": "Gibt es eine Liste aller gezeigten Beispiele?", "k": "전시된 사례 전체 목록이 있나요?", "e": "Is there a list of all the cases shown?", "r": "깁트 에스 아이네 리스테 알러 게차이크텐 바이슈필레?"}}, {"x": "18:14", "tx": {"k": "트램 15 → 슈타델호펜 · 18:22 S3 → 18:25 중앙역 · 18:36 IR36 → 19:52 바젤", "e": "Tram 15 → Stadelhofen · 18:22 S3 → 18:25 Zürich HB · 18:36 IR36 → 19:52 Basel"}, "alt": {"k": "저녁 먹고 18:59 IC → 19:58 · 빠른 막차 22:59 → 23:58", "e": "After dinner: 18:59 IC → 19:58 · last fast train 22:59 → 23:58"}}]}, "B": {"tab": {"k": "아틀리에", "e": "Atelier"}, "title": {"k": "아틀리에 — 공장의 빛은 작업실로 건너갔나", "e": "The Atelier — did factory light cross into the studio?"}, "eyb": {"k": "파리 답사에서 세운 가설 · 스위스 표본", "e": "A hypothesis from Paris · Swiss samples"}, "hy": {"k": "자유평면과 유리벽은 아방가르드의 발명이 아니라 산업 건물에서 옮겨 온 것이고, 그것을 나른 것은 아틀리에 단면 — 구조와 설비를 둘레로 밀고 바닥을 비우고, 유리를 구멍이 아니라 면으로 쓰는 단면 — 이라는 주장을 파리에서 세웠다. 그 주장을 독일어권 공업 도시에 건다.", "e": "In Paris I argued that the free plan and the glass wall were not avant-garde inventions but transfers from industrial buildings — carried by the atelier section: structure and services pushed to the edge, the floor left empty, glass used as a surface rather than a hole. This route puts that claim to a German-speaking industrial city."}, "known": [{"k": "(가) 처음부터 작업실로 지은 곳 — 할러 1932 · 기젤 1953 — 의 빛은 공장에서 빌렸나", "e": "(a) Places built as studios from the start — Haller 1932, Gisel 1953: was their light borrowed from the factory?"}, {"k": "(나) 공장이 학교·미술관이 된 곳 — 바나나하우스 1926 · 뢰벤브로이 1898 · 토니 우유 공장 — 은 단면을 물려받았나, 껍데기만 물려받았나", "e": "(b) Factories turned into a school or museum — Bananenhaus 1926, Löwenbräu 1898, the Toni dairy: did they inherit the section, or only the shell?"}, {"k": "(다) 유리 가게 창고(1888)가 작업실이 된 곳 — 그 창은 원래 창인가 새로 뚫은 창인가", "e": "(c) A glazier’s storehouse (1888) turned studio — are its windows original or cut later?"}, {"k": "곳마다 같은 여섯 가지를 묻는다 — 유형 · 단면 · 빛 · 자유도 · 물려받은 것과 끊긴 것 · 손으로 잰 것", "e": "The same six questions at every stop — type · section · light · freedom · inherited and broken · measured by hand"}], "fal": [{"k": "할러 · 기젤의 채광이 작업실용 특제이고 공장 부재와 상관없다 → 「이전」은 파리의 국지적 사정", "e": "Haller’s and Gisel’s daylighting is studio-specific and unrelated to factory parts → the ‘transfer’ was a Paris peculiarity"}, {"k": "전용된 공장들이 새 창을 뚫고 원래 빛을 버렸다 → 옮겨진 것은 단면이 아니라 부피다", "e": "The converted factories cut new windows and abandoned the original light → what moved was volume, not section"}], "dep": "09:06", "arr": "18:52", "arr2": {"k": "18:58 (17:59 IC)", "e": "18:58 (17:59 IC)"}, "tours": "11:30", "bk": false, "res": {"k": "없음", "e": "none"}, "ban": {"k": "기젤 · 라움슈타치온", "e": "Gisel · Raumstation"}, "load": {"k": "중 — 시내 여섯 곳 · 이동 여섯 번 · 한 번은 19분 걷기", "e": "Medium — six stops in town · six transfers · one 19-min walk"}, "risk": {"k": "할러는 토요일 투어가 없다(자유 관람) · 라움슈타치온은 작은 무리씩 들어가 줄이 설 수 있다", 다 — 란데스무제움: 굴 1898에 크리스트 & 간텐바인 2016", "e": "Confront — Landesmuseum: Gull 1898 and Christ & Gantenbein 2016"}, {"k": "파리 장면: 스위스관 유리벽 통째 교체 · 오르세 한 부재 안의 1900년 리벳과 나중 볼트", "e": "Paris scenes: the Pavillon Suisse glass wall replaced wholesale · 1900 rivets and later bolts in one Orsay member", "src": {"k": "파리 답사 기록", "e": "Paris field notes"}}], "fal": [{"k": "파리 결론이 법칙이라면 취리히에서도 흔적 없는 수선은 전부 교체여야 한다. 레텐 · 바나나하우스처럼 흔적 없이 「수리」한 곳이 있으면 → 파리 결론은 스위스관의 사정일 뿐이다", "e": "If the Paris conclusion were a rule, every traceless repair in Zürich would be a replacement. If a place like Letten or Bananenhaus was ‘repaired’ without a trace → the Paris conclusion was only the Pavillon Suisse’s circumstance"}], "dep": "09:06", "arr": "18:58", "arr2": {"k": "18:44 (17:19 올텐 환승)", "e": "18:44 (17:19, change at Olten)"}, "tours": "12:30 · 14:00", "bk": false, "res": {"k": "없음", "e": "none"}, "ban": {"k": "레텐", "e": "Letten"}, "load": {"k": "중하 — 시내만 · 9시 출발 · 건축가 해설 넷", "e": "Lower-medium — town only · 9 am start · four architect-led talks"}, "risk": {"k": "란데스무제움 해설은 건축가가 아니라 박물관 해설사 · 레텐은 14시에 닫는다", "e": "The Landesmuseum tour is by museum educators, not architects · Letten closes at 14:00"}, "rows": [{"x": "09:06", "tx": {"k": "바젤 SBB — ICE → 10:02 취리히 중앙역 · 10:14 S24 → 10:17 비프킹엔역 → 걸어서", "e": "Basel SBB — ICE → 10:02 Zürich HB · 10:14 S24 → 10:17 Zürich Wipkingen → walk"}}, {"p": "Z12", "t": "10:24", "e": "10:59", "k": {"k": "상시 해설", "e": "Continuous"}, "tour": false, "arr": {"k": "14시에 닫는다 · 촬영 금지", "e": "Closes 14:00 · no photos"}, "role": {"k": "<b>되돌린다</b> — 1910년 취리히 첫 「공기·햇빛 목욕장」. 1945년에 덧댄 것을 떼어 처음 대칭으로.", "e": "<b>Restore</b> — Zürich’s first ‘air and sun bath’ (1910). The 1945 additions removed, back to the first symmetry."}, "qs": [{"k": "!?「어디가 새것인가요?」 — 재구성한 나무창과 원래 부재를 문화재 담당이 짚어 줄 수 있나. 흔적을 일부러 남긴 곳이 있나.", "e": "!?‘Which parts are new?’ — can the heritage officer point out reconstructed windows versus original members? Is any trace left on purpose?"}, {"k": "?1945년 설 가 택했나.", "e": "?‘Weighting unity’ — did the heritage office ask for it, or did the architects choose it?"}, {"k": "새 난방 · 설비는 어디 숨었나.", "e": "Where are the new heating and services hidden?"}, {"k": "?옛 목사관을 공익 기관 주거로 빌려준 조건.", "e": "?On what terms was the old rectory let as non-profit housing?"}], "ss": [{"k": "새 계단 난간과 옛 계단 난간 — 손으로 견준다", "e": "New handrail versus old handrail — compare by hand"}, {"k": "큰 홀 — 박수 한 번의 울림", "e": "The great hall — the ring of a single clap"}, {"k": "정원 쪽 문 — 열 때의 무게", "e": "The garden door — its weight as you open it"}], "de": {"q": "Warum haben Sie Alt und Neu nicht bewusst unterschieden?", "k": "왜 옛것과 새것을 일부러 가르지 않았나요?", "e": "Why did you not deliberately distinguish old and new?", "r": "바룸 하벤 지 알트 운트 노이 니히트 베부스트 운터쉬덴?"}}, {"x": "15:43", "tx": {"k": "버스 33 → 15:59 샤프하우저플라츠 · 16:00 트램 50 → 16:02 부흐엑플라츠 → 걸어서", "e": "Bus 33 → 15:59 Schaffhauserplatz · 16:00 tram 50 → 16:02 Bucheggplatz → walk"}}, {"p": "Z04", "t": "16:10", "e": "16:45", "k": {"k": "상시 해설", "e": "Continuous"}, "tour": false, "arr": {"k": "17시에 닫는다", "e": "Closes 17:00"}, "role": {"k": "<b>넣는다</b> — 교회 안에 나무 상자, 난방하는 부피를 최소로.", "e": "<b>Insert</b> — a timber box inside the church, the heated volume kept minimal."}, "qs": [{"k": "!?나무 상자를 떼어 낼 수 있나 — 되돌릴 수 있는 수선인가.", "e": "!?Can the timber box be removed — is it a reversible repair?"}, {"k": "상자가 교회 벽 · 바닥에 닿는 방식 — 박았나, 세웠나.", "e": "How does the box meet the church walls and floor — fixed in, or standing free?"}, {"k": "?포기한 것 — 무엇을 안 하기로 했나 (위층 난방 · 단열).", "e": "?What was given up — what did they decide not to do (upper heating, insulation)?"}, {"k": "교회로 되돌리려면 무엇만 떼면 되나.", "e": "What would have to come out to make it a church again?"}], "ss": [{"k": "상자 위 바닥 — 걸을 때 나무 울림", "e": "The floor on top of the box — the timber’s ring as you walk"}, {"k": "상자와 옛 벽 사이 틈 — 손이 들어가나", "e": "The gap between box and old wall — does a hand fit?"}, {"k": "난방 구역 경계 — 피부로", "e": "The edge of the heated zone — on your skin"}], "de": {"q" var db=null,dbMode=(ED==="private"?"wait":"off"),timers={},lastStat=["",""];
var statEl=document.getElementById("stat");
function hhmm(d){d=d||new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function setStatus(key,cls,extra){lastStat=[key,cls||"",extra||""];statEl.textContent=U(key)+(extra||"");statEl.className="stat"+(cls?" "+cls:"");}
function idleStatus(){if(dbMode==="off")setStatus(ED==="private"?"sLocal":"sDevice");else setStatus("sLocalWait");}
function push(path,retried){
  if(!db){idleStatus();return;}
  db.doc(path).set(clone(PATHS[path].get())).then(function(){setStatus("sSaved","ok",hhmm());})
   .catch(function(e){
     if(e&&e.code==="unavailable"&&!retried){setTimeout(function(){push(path,true);},1500+Math.random()*1500);}
     else{setStatus("sFail","err");}
   });
}
function touch(path){
  PATHS[path].get().updatedAt=Date.now();persistLocal();
  if(!db){idleStatus();return;}
  setStatus("sSaving");clearTimeout(timers[path]);timers[path]=setTimeout(function(){push(path);},900);
}
function pullAll(){
  if(!db)return;
  var jobs=Object.keys(PATHS).map(function(p){
    return db.doc(p).get().then(function(snap){
      var cur=PATHS[p].get();
      if(snap.exists){var d=clone(snap.data());if(stamp(d)>=stamp(cur)){PATHS[p].put(Object.assign(PATHS[p].blank(),d));}else{push(p);}}
      else if(stamp(cur)>0){push(p);}
    }).catch(function(){});
  });
  Promise.all(jobs).then(function(){persistLocal();rerender();if(statEl.className==="stat")setStatus("sConn","ok");});
}

      if((mk.q||[]).length||(mk.s||[]).length){
        lines.push("["+r.p+"] "+t(P[r.p].nm)+" "+r.t+" — "+prog(s,r.p));
        (mk.q||[]).slice().sort(function(a,b){return a-b;}).forEach(function(i){lines.push("  ✓ "+parseQ(t(r.qs[i])).t.replace(/<[^>]+>/g,""));});
        (mk.s||[]).slice().sort(function(a,b){return a-b;}).forEach(function(i){lines.push("  ○ "+t(r.ss[i]));});
      }
    });
    if(lines.length){out.push("== "+s+" "+t(SC[s].title)+" ==");out=out.concat(lines);out.push("");}
  });
  var pl=[];PORD.forEach(function(z){var p=S.places[z];if((p.hand||"").trim()||(p.body||"").trim()){pl.push("["+z+"] "+t(P[z].nm));if((p.hand||"").trim())pl.push(U("expHand")+p.hand.trim());if((p.body||"").trim())pl.push(U("expBody")+p.body.trim());}});
  if(pl.length){out.push(U("expPlaces"));out=out.concat(pl);out.push("");}
  out.push(U("expVerdict"));VQ.forEach(function(r){out.push(t(r.q)+": "+((S.verdict[r.id]||"").trim()||"—"));});
  document.getElementById("exTitle").textContent=U("exportBtn");
  document.getElementById("copyBtn").textContent=U("copy");
  document.getElementById("closeBtn").textContent=U("close");
  document.getElementById("exportText").value=out.join("\n");
  document.getElementById("exportBox").hidden=false;
}
document.getElementById("closeBtn").addEventListener("click",function(){document.getElementById("exportBox").hidden=true;});
document.getElementById("copyBtn").addEventListener("click",function(){
  var ta=document.getElementById("exportText");ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(function(){setStatus("copied","ok");},function(){setStatus("longpress");});}
  else setStatus(ok?"copied":"longpress",ok?"ok":"");
});

/* ── 갱신 ── */
function updateChips(){
  chipRefs.forEach(function(c){
    var st=stopOf(c.s,c.z),n=nq(c.s,c.z),tot=st.qs.length+st.ss.length,sum=n[0]+n[1];
    c.el.textContent=sum+"/"+tot;c.el.className="chip"+(sum===tot?" full":(sum>0?" part":""));
  });
}
var curTab="cmp";
function paintChrome(){
  document.documentElement.lang=LANG;
  document.title=U("title");
  document.getElementById("topT").textContent=U("title");
  document.getElementById("topS").textContent=U("sub");
  document.getElementById("langBtn").textContent=LANG==="en"?"한국어":"EN";
  document.getElementById("foot").innerHTML=U("footer");
  statEl.textContent=U(lastStat[0]||"loading")+(lastStat[2]||"");
  paintThemeBtn();
}
function rerender(){
  var y=window.scrollY;main.innerHTML="";sections={};chipRefs=[];
  fieldEls=fieldEls.filter(function(o){return PBB.contains(o.t);});
  paintChrome();buildTabs();buildCmp();ORD.forEach(buildScen);buildPrep();buildAfter();
  showTab(curTab,true);window.scrollTo(0,y);
  if(!PB.hidden&&curPlace){var ae=document.activeElement;if(!(ae&&PBB.contains(ae)&&ae.tagName==="TEXTAREA"))openPlace(curPlace,curScen);}
  fieldEls.forEach(function(o){if(o.t!==document.activeElement){var v=o.get()||"";if(o.t.value!==v)o.t.value=v;}fit(o.t);});
  updateChips();paintNow();
}
function showTab(id,keep){
  if(!sections[id])id="cmp";curTab=id;
  Object.keys(sections).forEach(function(k){sections[k].hidden=(k!==id);});
  [].forEach.call(tabsEl.children,function(b){b.setAttribute("aria-selected",b.dataset.tab===id?"true":"false");});
  try{localStorage.setItem(TABKEY,id);}catch(e){}
  fieldEls.forEach(function(o){fit(o.t);});
  if(!keep)window.scrollTo(0,0);
}
document.getElementById("langBtn").addEventListener("click",function(){
  LANG=(LANG==="en"?"ko":"en");try{localStorage.setItem(LANGKEY,LANG);}catch(e){}rerender();
});
document.getElementById("themeBtn").addEventListener("click",function(){
  var nx=curTheme()==="dark"?"light":"dark";applyTheme(nx);try{localStorage.setItem(THEMEKEY,nx);}catch(e){}paintThemeBtn();
});

/* ── 시작 ── */
try{curTab=localStorage.getItem(TABKEY)||"cmp";}catch(e){}
lastStat=["loading","",""];
rerender();
idleStatus();
setInterval(paintNow,30000);
if(ED==="private"){

}
})();
</script>
