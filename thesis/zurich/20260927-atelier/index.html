}, {"k": "후반에는 조경과 환경으로 옮겨 1975년 환경디자인연구소를 세우고, 취리히대 이르헬 공원(1982-86)을 설계했다.", "src": [{"t": "gta 아카이브", "u": "https://archiv.gta.arch.ethz.ch/nachlaesse-vorlaesse/eduard-neuenschwander"}]}, {"k": "고크하우젠 아틀리에 단지에는 핀란드 경험을 옮겼다. 나무가 건물들을 느슨하게 두르고, 빗물은 연못으로 흘려 스며들게 한다.", "src": [{"t": "스테판 로츨러", "u": "https://bantliz.com/kuenstlerhaeuser-im-wald-ein-ausflug-nach-gockhausen"}]}]}, {"lb": "문화 간 영향", "ps": [{"k": "알토 사무소 시절(1949-52) 아내 클라우디아와 『Finnische Bauten. Atelier Alvar Aalto 1950-1951』(1954)을 냈다.", "src": [{"t": "위키(독)", "u": "https://de.wikipedia.org/wiki/Eduard_Neuenschwander"}]}, {"k": "ETH 동료였던 노르웨이 건축가 크리스티안 노르베르그슐츠와 출판 시리즈 TEAM을 함께 만들었다.", "src": [{"t": "위키(독)", "u": "https://de.wikipedia.org/wiki/Eduard_Neuenschwander"}]}]}, {"lb": "그래픽과의 관계 - 여섯 곳 가운데 가장 구체적", "ps": [{"k": "원래 주인 빅터 N. 코헨(1910-1975)은 그래픽 교육을 받은 광고인이다. 1946년 취리히에 광고 아틀리에를 열고 1958년 고크하우젠으로 옮겨, 1962년 대행사 Advico가 됐다. 원칙은 「단순화 · 객관화 · 인간화」.", "src": [{"t": "위키(독) 코헨", "u": "https://de.wikipedia.org/wiki/Victor_N._Cohen"}]}, {"k": "Advico는 BIC · 신알코 · 리리 지퍼 광고를 만들었다. 포스터 작가 루에디 퀼링이 1963년부터 여기서 BIC 포스터를 만들었고, 「올해의 스위스 포스터」를 여러 번 받았으며 작품이 MoMA에 있다.", "src": [{"t": "위키(독) 코헨", "u": "https://de.wikipedia.org/wiki/Victor_N._Cohen"}, {"t": "위키(독) 퀼링", "u": "https://de.wikipedia.org/wiki/Ruedi_K%C3%BClling"}]}, {"k": "화가 · 그래픽 디자이너 카를 슈미트가 노이엔슈반더 주택 파사드의 색을 맡았고, 삽화가 바르야 라바터가 고크하우젠 예술가 마을을 이끈 사람으로 꼽힌다.", "src": [{"t": "스테판 로츨러", "u": "https://bantliz.com/kuenstlerhaeuser-im-wald-ein-ausflug-nach-gockhausen"}, {"t": "BSLA", "u": "https://www.bsla.ch/de/aktuelles/agenda/eine-pirsch-durch-das-gockhauser-gartenreich/"}]}, {"k": "gta Verlag 모노그래프는 루체른 디자인 스튜디오 C2F가 기획 · 디자인했다.", "src": [{"t": "C2F", "u": "https://c2f.ch/en/works/eduard-neuenschwander/"}]}]}, {"lb": "ETH · EPFL 계보", "ps": [{"k": "1949년 ETH 졸업(디플롬 지도 한스 호프만). 유고 전체(약 50m 분량, 레미뷜 모형 4점)가 ETH gta 아카이브에 있다. 교수로 가르친 기록은 찾지 못했다.", "src": [{"t": "gta 아카이브", "u": "https://archiv.gta.arch.ethz.ch/nachlaesse-vorlaesse/eduard-neuenschwander"}, {"t": "위키(독)", "u": "https://de.wikipedia.org/wiki/Eduard_Neuenschwander"}]}]}, {"lb": "읽을 것", "ps": [{"k": "클라우디아 몰 · 악셀 지몬, 『Eduard Neuenschwander. Architekt und Umweltgestalter』, gta Verlag(연도 미확인).", "src": [{"t": "Hochparterre Bücher", "u": "https://www.hochparterre-buecher.ch/en/products/eduard-neuenschwander-9783856762353"}]}, {"k": "스테판 로츨러, 「Künstlerhäuser im Wald - ein Ausflug nach Gockhausen」, 2022.", "src": [{"t": "원문", "u": "https://bantliz.com/kuenstlerhaeuser-im-wald-ein-ausflug-nach-gockhausen"}]}]}]}, {"p": "M2", "h": "알리스 비로 · 비로 주택", "who": "Alice Biro 1923-2018 · 헝가리 죄르 출생 · 로잔 EPUL 1948 졸업", "secs": [{"lb": "건물 - 연도가 갈린다", "ps": [{"k": "오픈하우스는 1966년이라 적지만, EPFL 기사와 프랑스어 위키는 1965년이다.", "src": [{"t": "EPFL", "u": "https://actu.epfl.ch/news/women-in-architecture-and-the-archives-alice-biro/"}, {"t": "위키(불)", "u": "https://fr.wikipedia.org/wiki/Alice_Biro"}]}]}, {"lb": "스위스 건축에서의 위치", "ps": [{"k": "스위스에서 디플롬을 받은 첫 세대 여성 건축가 가운데 한 명이다. 같은 세대로 플로라 슈타이거크로퍼드 · 리스베트 작스 · 룩스 구이어가 꼽힌다.", "src": [{"t": "위키(불)", "u": "https://fr.wikipedia.org/wiki/Alice_Biro"}]}, {"k": "작업을 관통하는 것은 일상 공간에 대한 지속적인 성찰이었다는 평가다. 2025년 EPFL 근대건축아카이브가 여성 건축가 기획으로 조명했다.", "src": [{"t": "EPFL", "u": "https://actu.epfl.ch/news/women-in-architecture-and-the-archives-alice-biro/"}]}]}, {"lb": "문화 간 영향", "ps": [{"k": "헝가리 죄르에서 태어나 자그레브에서 자랐고, 전쟁 중 스위스로 왔다. 알토 사무소에서 6년 일했다(정확한 연도는 출처에 없다).", "src": [{"t": "위키(불)", "u": "https://fr.wikipedia.org/wiki/Alice_Biro"}]}, {"k": "취리히로 돌아와 카를 리페르트 · 아르놀트 폰 발트키르히 사무소를 거쳐, 1984년 은퇴할 때까지 노이엔슈반더와 협업했다.", "src": [{"t": "위키(불)", "u": "https://fr.wikipedia.org/wiki/Alice_Biro"}]}]}, {"lb": "그래픽과의 관계", "ps": [{"k": "비로 본인과 그래픽을 잇는 연결은 찾지 못했다. 같은 마을에 라바터와 Advico가 있었다는 이웃 관계뿐이다.", "src": []}]}, {"lb": "ETH · EPFL 계보", "ps": [{"k": "1948년 로잔 EPUL(EPFL의 전신) 졸업. 장 추미에게 배우고 기디온의 미술사 강의를 들었다. 아카이브는 gta가 아니라 EPFL 근대건축아카이브(ACM)에 있다.", "src": [{"t": "EPFL", "u": "https://actu.epfl.ch/news/women-in-architecture-and-the-archives-alice-biro/"}, {"t": "위키(불)", "u": "https://fr.wikipedia.org/wiki/Alice_Biro"}]}, {"k": "1979년 로베르트 체트 지도로 18세기 러시아 건축 용어에 관한 박사논문을 썼다.", "src": [{"t": "위키(불)", "u": "https://fr.wikipedia.org/wiki/Alice_Biro"}]}]}, {"lb": "읽을 것", "ps": [{"k": "알리스 비로 · 피에르 프레, 『Alice Biro Architektur 1943-2003. Toujours en charrette』, 2005.", "src": [{"t": "bookm-ark", "u": "https://www.bookm-ark.fi/product/alice-biro-architektur-1943-2003/"}]}, {"k": "가엘 파브르, 「Alice Biro, une femme architecte zurichoise formée en Suisse romande」, 2015.", "src": [{"t": "위키(불) 참고문헌", "u": "https://fr.wikipedia.org/wiki/Alice_Biro"}]}, {"k": "ACM-EPFL, 「Women in Architecture and the Archives: Alice Biro and Jeanne Bueche」, 2025.", "src": [{"t": "EPFL", "u": "https://actu.epfl.ch/news/women-in-architecture-and-the-archives-alice-biro/"}]}]}]}, {"p": "M3", "h": "E2A · 호프아커 학교", "who": "Piet Eckert 1968 뭄바이생 · Wim Eckert 1969 취리히생, 2001 창립 · 설계경기 2014 1등, 2018-21 공사", "secs": [{"lb": "건물", "ps": [{"k": "1898년 베를리의 학교와 1938년 헤르터의 체육관 사이에 딱 맞게 끼운 중간 건물. 조경은 간츠.", "src": [{"t": "E2A", "u": "https://e2a.ch/projects/public-buildings/school-building-hofacker"}]}, {"k": "3면 체육관을 땅속에 넣어, 새 동이 보호 건물 둘보다 낮게 물러서고 이웃의 조망을 지킨다. 두드린 콘크리트 파사드, 높은 띠창 채광.", "src": [{"t": "E2A", "u": "https://e2a.ch/projects/public-buildings/school-building-hofacker"}, {"t": "오픈하우스", "u": "https://openhouse-zuerich.org/orte/schulanlage-hofacker/"}]}]}, {"lb": "스위스 건축에서의 위치", "ps": [{"k": "E2A를 「스위스성」 담론 안에 자리매김한 평론은 이번에 찾지 못했다(미확인). 완공 뒤 『werk, bauen + wohnen』 · 『archithese』 비평도 찾지 못했다(미확인).", "src": []}]}, {"lb": "문화 간 영향", "ps": [{"k": "두 사람은 1995-97년 렘 콜하스의 OMA에서 로테르담 · 로스앤젤레스 · 서울 작업을 했다. 피트는 컬럼비아대 건축대학원에서도 공부했다.", "src": [{"t": "위키(영)", "u": "https://en.wikipedia.org/wiki/E2A_Architects"}, {"t": "E2A", "u": "https://www.e2a.ch/team/piet-eckert"}]}, {"k": "해외 작품으로 베를린 하인리히 뵐 재단(2007-08)과 taz 신문사 사옥(2015-18)이 있다.", "src": [{"t": "위키(영)", "u": "https://en.wikipedia.org/wiki/E2A_Architects"}]}]}, {"lb": "그래픽과의 관계", "ps": [{"k": "직접 연결은 찾지 못했다. 간접으로는 작품집 『Silent Form』(Park Books 2014) - 사진가 존 나이먼이 모형을 흑백으로 찍고, 신경생물학자 세미르 제키의 지각론 글을 실었다.", "src": [{"t": "E2A", "u": "https://www.e2a.ch/news/silent-form"}]}]}, {"lb": "ETH · EPFL 계보", "ps": [{"k": "두 사람 모두 ETH 졸업(피트 1994, 빔 1995). 피트는 2014-19년 멘드리지오 객원교수, 2020년부터 TU 도르트문트 정교수. ETH 강의 경력은 연도 미확인.", "src": [{"t": "위키(영)", "u": "https://en.wikipedia.org/wiki/E2A_Architects"}, {"t": "E2A", "u": "https://www.e2a.ch/team/piet-eckert"}]}]}, {"lb": "읽을 것", "ps": [{"k": "『Silent Form』, E2A · 존 나이먼 · 세미르 제키, Park Books 2014.", "src": [{"t": "E2A", "u": "https://www.e2a.ch/news/silent-form"}]}]}]}, {"p": "M4", "h": "헤르만 할러 · 할러 아틀리에", "who": "Hermann Haller 1880-1950 · 시 건축국장 헤르만 헤르터와 공동 · 1932(BauNetz는 1933)", "secs": [{"lb": "스위스 건축 · 미술에서의 위치", "ps": [{"k": "시는 이 아틀리에를 「목조로 지은 바우하우스 건축의 드문 유럽 사례」라 부른다. 시 보호 문화재다.", "src": [{"t": "취리히 시", "u": "https://www.stadt-zuerich.ch/de/aktuell/medienmitteilungen/2023/03/230306.html"}]}, {"k": "공동 설계자 헤르터는 신건축 운동을 지지한 시 건축국장이었다. 할러는 스위스 근대 조각의 창시자 가운데 하나로 꼽히고, 1934년 베네치아 비엔날레에 스위스 대표로 나갔다.", "src": [{"t": "위키(독) 아틀리에", "u": "https://de.wikipedia.org/wiki/Atelier_Hermann_Haller"}, {"t": "위키(독) 할러", "u": "https://de.wikipedia.org/wiki/Hermann_Haller_(Bildhauer)"}, {"t": "위키(영)", "u": "https://en.wikipedia.org/wiki/Hermann_Haller_(sculptor)"}]}]}, {"lb": "문화 간 영향", "ps": [{"k": "1898년 슈투트가르트에서 건축을 공부했고, 뮌헨에서 파울 클레를 만나 1901-02년 함께 이탈리아를 여행했다. 로마(1903-09)와 파리(1909-14)에서 로댕 · 마욜 · 부르델을 연구했다.", "src": [{"t": "위키(영)", "u": "https://en.wikipedia.org/wiki/Hermann_Haller_(sculptor)"}]}, {"k": "조각 이전에 건축을 공부했기에 작업실을 직접 설계할 수 있었다.", "src": [{"t": "위키(독) 아틀리에", "u": "https://de.wikipedia.org/wiki/Atelier_Hermann_Haller"}]}]}, {"lb": "수리 - 「할러가 방금 나간 듯이」", "ps": [{"k": "설계 2022-23, 공사 2024.01-2025.02, 145만 프랑. 기초 보강, 지붕 · 천창 교체. 원칙은 「할러가 방금 건물을 나간 듯이」.", "src": [{"t": "BauNetz 2025", "u": "https://www.baunetz.de/meldungen/Meldungen-Sanierung_von_Holzhausen_Zweifel_Architekten_in_Zuerich_10007169.html"}]}, {"k": "재개관은 2026년 6월 6일. 할러의 조각 원작은 보존 문제로 2028년 여름까지 전시하지 않는다 - 오늘 원작은 없다.", "src": [{"t": "취리히 시 2026", "u": "https://www.stadt-zuerich.ch/de/aktuell/medienmitteilungen/2026/05/wiedereroeffnung-atelier-hermann-haller-2026.html"}]}]}, {"lb": "그래픽과의 관계", "ps": [{"k": "직접 연결은 찾지 못했다. 재개관 전시 「.sculptr - Zwischen Screen und Material」이 3D 프린팅 · 스캔과 조각의 관계를 다룬다.", "src": [{"t": "취리히 시 2026", "u": "https://www.stadt-zuerich.ch/de/aktuell/medienmitteilungen/2026/05/wiedereroeffnung-atelier-hermann-haller-2026.html"}]}]}, {"lb": "ETH · EPFL 계보", "ps": [{"k": "할러는 ETH에서 배우거나 가르치지 않았다(건축은 슈투트가르트, 미술은 뮌헨). 1933년 명예박사는 취리히대학교.", "src": [{"t": "위키(영)", "u": "https://en.wikipedia.org/wiki/Hermann_Haller_(sculptor)"}]}]}, {"lb": "읽을 것", "ps": [{"k": "『archithese』 1995년 2호 「Hermann Herter, Stadtbaumeister von Zürich (1919-1942)」.", "src": [{"t": "archithese", "u": "https://archithese.ch/produktedetails/hermann-herter.html"}]}, {"k": "BauNetz 2025 수리 기사.", "src": [{"t": "BauNetz", "u": "https://www.baunetz.de/meldungen/Meldungen-Sanierung_von_Holzhausen_Zweifel_Architekten_in_Zuerich_10007169.html"}]}]}]}, {"p": "M5", "h": "에른스트 기젤 · 기젤 아틀리에 탑", "who": "Ernst Gisel 1922-2021 · 아틀리에하우스 부어슈트라세 8/10, 1953/54", "secs": [{"lb": "건물", "ps": [{"k": "전업 미술가를 위한 주거 8호와 작업실 12실. 1949년 조각가 오토 뮐러 · 오토 토이허와 화가 막스 트루니거가 조합을 세웠고, 건축가 알프레트 로트가 1948년 『Werk』에 쓴 글이 계기였다.", "src": [{"t": "위키(독)", "u": "https://de.wikipedia.org/wiki/Atelierhaus_Wuhrstrasse"}]}]}, {"lb": "스위스 건축에서의 위치", "ps": [{"k": "20세기 후반 스위스 건축의 가장 중요한 인물 가운데 하나로 꼽힌다. 모더니즘을 교조로 받지 않고 상황에 맞췄고, 「모든 집은 조각이다」라는 말을 남겼다.", "src": [{"t": "BauNetz", "u": "https://www.baunetz.de/meldungen/Meldungen-Zum_Tod_von_Ernst_Gisel_7611106.html"}]}, {"k": "루이지 스노치는 1993년 모노그래프에서 기젤의 핵심을 「집-도시」, 곧 도시적 감각으로 짚었다.", "src": [{"t": "espazium", "u": "https://www.espazium.ch/de/aktuelles/bekenntnis-zur-praxis-zum-tod-von-ernst-gisel"}]}, {"k": "취리히 주 문화재청은 이 예술가 집을 그의 가장 널리 알려진 작품으로 소개한다.", "src": [{"t": "취리히 주 문화재청", "u": "https://ad.zh.ch/ernst-gisel-architekt/"}]}]}, {"lb": "문화 간 영향", "ps": [{"k": "1942-44년 알프레트 로트 사무소에서 일했다.", "src": [ function setStatus(key,cls,extra){lastStat=[key,cls||"",extra||""];statEl.textContent=U(key)+(extra||"");statEl.className="stat"+(cls?" "+cls:"");}
function idleStatus(){if(dbMode==="off")setStatus(ED==="private"?"sLocal":"sDevice");else setStatus("sLocalWait");}
function push(path,retried){
  if(!db){idleStatus();return;}
  db.doc(path).set(clone(PATHS[path].get())).then(function(){setStatus("sSaved","ok",hhmm());})
   .catch(function(e){
     if(e&&e.code==="unavailable"&&!retried){setTimeout(function(){push(path,true);},1500+Math.random()*1500);}
     else{setStatus("sFail","err");}
   });
}
function touch(path){
  PATHS[path].get().updatedAt=Date.now();persistLocal();
  if(!db){idleStatus();return;}
  setStatus("sSaving");clearTimeout(timers[path]);timers[path]=setTimeout(function(){push(path);},900);
}
function pullAll(){
  if(!db)return;
  var jobs=Object.keys(PATHS).map(function(p){
    return db.doc(p).get().then(function(snap){
      var cur=PATHS[p].get();
      if(snap.exists){var d=clone(snap.data());if(stamp(d)>=stamp(cur)){PATHS[p].put(Object.assign(PATHS[p].blank(),d));}else{push(p);}}
      else if(stamp(cur)>0){push(p);}
    }).catch(function(){});
  });
  Promise.all(jobs).then(function(){persistLocal();rerender();if(statEl.className==="stat")setStatus("sConn","ok");});
}

function nextFor(s){

  if(today!==DAY)return null;
  for(var i=0;i<rows.length;i++){var r=rows[i],tm=r.t||r.x||r.m;var hm=tm.split(":");var v=(+hm[0])*60+(+hm[1]);if(v>=mins-10)return r;}
  return null;
}

/* ── 타임라인: 시각표로 추정한 지금 위치 (GPS 아님) ── */
var railRefs=[];
function toMin(x){var h=String(x||"").split(":");return h.length<2?NaN:(+h[0])*60+(+h[1]);}
function nowInfo(){
  var d=new Date(),today=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2),m=d.getHours()*60+d.getMinutes();
  try{var q=(location.search.match(/[?&]now=(\d{1,2}):?(\d{2})/)||[]);if(q[1]){return {m:(+q[1])*60+(+q[2]),rel:0};}}catch(e){}
  return {m:m,rel:today<DAY?-1:(today>DAY?1:0)};
}
function segsOf(s){
  var rows=SC[s].rows,out=[];
  rows.forEach(function(r){out.push({r:r,st:toMin(r.t||r.x||r.m)});});
  out.forEach(function(g,i){g.en=i+1<out.length?out[i+1].st:(toMin(SC[s].endAt)||g.st+60);});
  return out;
}
function segName(g){
  if(g.r.p)return t(P[g.r.p].nm);
  var tx=t(g.r.tx).replace(/<[^>]+>/g,""),cut=tx.split(" · ")[0];return U("railMove")+(cut.length>40?cut.slice(0,40)+"…":cut);
}
function paintRail(){
  if(!DATA.rail)return;
  var ni=nowInfo();
  ORD.forEach(function(s){
    var sg=segsOf(s);if(!sg.length)return;
    var m=ni.rel<0?-1e9:(ni.rel>0?1e9:ni.m),t0=sg[0].st,t1=sg[sg.length-1].en,ci=-1;
    sg.forEach(function(g,i){if(m>=g.st&&m<g.en)ci=i;});
    railRefs.forEach(function(o){
      if(o.s!==s)return;var g=sg[o.i],e=o.el;if(!g||!e)return;
      e.classList.remove("past","cur");var old=e.querySelector(".me");if(old)e.removeChild(old);
      if(m>=g.en)e.classList.add("past");
      else if(m>=g.st){e.classList.add("cur");e.style.setProperty("--f",String(Math.max(0,Math.min(1,(m-g.st)/Math.max(1,g.en-g.st)))));var me=document.createElement("span");me.className="me";e.appendChild(me);}
    });
    var dr=document.getElementById("dr-"+s);if(!dr)return;
    var pos=Math.max(0,Math.min(1,(m-t0)/Math.max(1,t1-t0))),where;
    var two=function(v){return ("0"+Math.floor(v/60)).slice(-2)+":"+("0"+(v%60)).slice(-2);};
    if(m<t0)where="<b>"+U("railBefore")+"</b> "+two(t0)+(ni.rel===0?" · "+(t0-m)+U("railMin"):"");
    else if(m>=t1)where="<b>"+U("railDone")+"</b>";
    else{var g=sg[ci],nx=sg[ci+1];where="<b>"+segName(g)+"</b>"+(nx?" · "+U("railNext")+" "+two(nx.st)+" "+segName(nx)+" · "+(nx.st-m)+U("railMin"):"");}
    dr.innerHTML='<div class="bar"><span class="done" style="width:'+(pos*100)+'%"></span><span class="me" style="left:'+(pos*100)+'%"></span></div>'+
      '<div class="ends"><span>'+two(t0)+'</span><span>'+two(t1)+'</span></div><div class="where">'+where+'</div><div class="gps">'+U("railGps")+'</div>';
  });
}

  st.ss.forEach(function(x,i){
    var li=el("li",((mk.s||[]).indexOf(i)>=0?"hit":""));li.tabIndex=0;li.setAttribute("role","button");
    li.appendChild(el("span","mk","○"));li.appendChild(el("span","tx",t(x)));
    function tog(){var h=(mk.s||[]).slice(),k=h.indexOf(i);if(k>=0)h.splice(k,1);else h.push(i);mk.s=h;li.classList.toggle("hit",k<0);touch("zh/checks-"+s);cnt();}
    li.addEventListener("click",tog);li.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tog();}});
    sul.appendChild(li);
  });
  ss.appendChild(sul);cx.appendChild(ss);cx.appendChild(cn);cnt();
  [["hand","handL","handA","hand"],["body","bodyL","bodyA","body"]].forEach(function(f){
    var w=el("div","fl2 "+f[3]);var id="fld-"+z+"-"+f[0];
    var lb=el("label",null,U(f[1]));lb.setAttribute("for",id);w.appendChild(lb);w.appendChild(el("span","ask",U(f[2])+U("onePlace")));
    var ta=el("textarea");ta.id=id;ta.rows=2;
    bindTA(ta,"zh/place-"+z,function(){return S.places[z][f[0]];},function(v){S.places[z][f[0]]=v;});
    w.appendChild(ta);cx.appendChild(w);
  });
  pg.appendChild(cx);
  var others=sc.filter(function(x){return x!==s;});
  if(others.length){
    var ot=el("div","else");ot.appendChild(el("div","k",U("elseK")));
    var oul=el("ul");others.forEach(function(x){var so=stopOf(x,z);oul.appendChild(el("li",null,"<b>"+x+" "+t(SC[x].tab)+" · "+so.t+"</b> — "+t(so.role)));});
    ot.appendChild(oul);pg.appendChild(ot);
  }
  PBB.appendChild(pg);PB.hidden=false;PBB.parentNode.scrollTop=0;
  PBB.querySelectorAll("textarea").forEach(fit);
}

/* ── 예약 · 말 · 준비 ── */
function buildPrep(){
  var sec=el("section");sec.id="t-prep";
  var m=el("div","mast");m.appendChild(el("h1",null,U("prepH1")));m.appendChild(el("p",null,U("prepP")));sec.appendChild(m);
  if(!DATA.only){
  sec.appendChild(el("div","k",U("wedK")));
  sec.appendChild(el("p","note",U("wedNote1")));
  sec.appendChild(el("p","note",U("wedNote2")));
  var pl=el("div","pills");var a=el("a","pill dark",U("openList"));a.href="https://openhouse-zuerich.org/liste/";a.target="_blank";a.rel="noopener";pl.appendChild(a);sec.appendChild(pl);
  }
  sec.appendChild(el("div","k",U("wordsK")));
  var gl=el("div","gl");WORDS.forEach(function(w){var d=el("div");d.appendChild(el("span","dw",w[0]));d.appendChild(el("span",null,t(w[1])));gl.appendChild(d);});sec.appendChild(gl);
  sec.appendChild(el("div","k",U("sayK")+'<span class="c">'+U("sayC")+"</span>"));
  SAY.forEach(function(x){var sy=el("div","say");sy.appendChild(el("div","l",x.q));sy.appendChild(el("div","kk",t(x)));if(LANG==="ko"&&x.r)sy.appendChild(el("div","u",U("readAs")+x.r));sec.appendChild(sy);});
  sec.appendChild(el("p","note",U("sayNote")));
  sec.appendChild(el("div","k",U("prepK")+'<span class="c">'+PREP.length+"</span>"));
  var ul=el("ul","ck");
  PREP.forEach(function(c){
    var li=el("li",S.prep[c.id]?"on":"");var id="prep-"+c.id;
    li.innerHTML='<input type="checkbox" id="'+id+'"'+(S.prep[c.id]?" checked":"")+'><label for="'+id+'">'+t(c.t)+"<span>"+t(c.s)+"</span></label>";
    li.querySelector("input").addEventListener("change",function(e){S.prep[c.id]=e.target.checked;li.className=e.target.checked?"on":"";touch("zh/prep");});
    ul.appendChild(li);
  });
  sec.appendChild(ul);
  main.appendChild(sec);sections.prep=sec;
}

/* ── 판정 ── */
function buildAfter(){
  var sec=el("section");sec.id="t-after";
  var m=el("div","mast");m.appendChild(el("h1",null,U("afterH1")));m.appendChild(el("p",null,U("afterP")));sec.appendChild(m);
  VQ.forEach(function(r){
    var w=el("div","rq"+(r.hand?" hand":""));w.appendChild(el("h3",null,t(r.q)));w.appendChild(el("p",null,t(r.sub)));
    var ta=el("textarea");ta.id="fld-v-"+r.id;ta.rows=r.hand?1:3;ta.setAttribute("aria-label",t(r.q));
    bindTA(ta,"zh/verdict",function(){return S.verdict[r.id];},function(v){S.verdict[r.id]=v;});
    w.appendChild(ta);sec.appendChild(w);
  });
  var p=el("div","pills");var ex=el("button","pill dark",U("exportBtn"));ex.type="button";ex.addEventListener("click",openExport);p.appendChild(ex);sec.appendChild(p);
  main.appendChild(sec);sections.after=sec;
}

/* ── 전부 텍스트로 ── */
function openExport(){
  var out=[U("expTitle"),U("expPicked")+((DATA.only||S.choice.pick)?(DATA.only||S.choice.pick)+" "+t(SC[DATA.only||S.choice.pick].tab):U("expNone")),""];
  ORD.forEach(function(s){
    var lines=[];
    stopsOf(s).forEach(function(r){
      var mk=S.checks[s].map[r.p]||{q:[],s:[]};
      if((mk.q||[]).length||(mk.s||[]).length){
        lines.push("["+r.p+"] "+t(P[r.p].nm)+" "+r.t+" — "+prog(s,r.p));
        (mk.q||[]).slice().sort(function(a,b){return a-b;}).forEach(function(i){lines.push("  ✓ "+parseQ(t(r.qs[i])).t.replace(/<[^>]+>/g,""));});
        (mk.s||[]).slice().sort(function(a,b){return a-b;}).forEach(function(i){lines.push("  ○ "+t(r.ss[i]));});
      }
    });
    if(lines.length){out.push("== "+s+" "+t(SC[s].title)+" ==");out=out.concat(lines);out.push("");}
  });
  var pl=[];PORD.forEach(function(z){var p=S.places[z];if((p.hand||"").trim()||(p.body||"").trim()){pl.push("["+z+"] "+t(P[z].nm));if((p.hand||"").trim())pl.push(U("expHand")+p.hand.trim());if((p.body||"").trim())pl.push(U("expBody")+p.body.trim());}});
  if(pl.length){out.push(U("expPlaces"));out=out.concat(pl);out.push("");}
  out.push(U("expVerdict"));VQ.forEach(function(r){out.push(t(r.q)+": "+((S.verdict[r.id]||"").trim()||"—"));});
  document.getElementById("exTitle").textContent=U("exportBtn");
  document.getElementById("copyBtn").textContent=U("copy");
  document.getElementById("closeBtn").textContent=U("close");
  document.getElementById("exportText").value=out.join("\n");
  document.getElementById("exportBox").hidden=false;
}
document.getElementById("closeBtn").addEventListener("click",function(){document.getElementById("exportBox").hidden=true;});
document.getElementById("copyBtn").addEventListener("click",function(){
  var ta=document.getElementById("exportText");ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(function(){setStatus("copied","ok");},function(){setStatus("longpress");});}
  else setStatus(ok?"copied":"longpress",ok?"ok":"");
});

/* ── 갱신 ── */
function updateChips(){
  chipRefs.forEach(function(c){
    var st=stopOf(c.s,c.z),n=nq(c.s,c.z),tot=st.qs.length+st.ss.length,sum=n[0]+n[1];
    c.el.textContent=sum+"/"+tot;c.el.className="chip"+(sum===tot?" full":(sum>0?" part":""));
  });
}
var curTab=DEF;
function paintChrome(){
  document.documentElement.lang=LANG;
  document.title=U("title");
  document.getElementById("topT").textContent=U("title");
  document.getElementById("topS").textContent=U("sub");
  document.getElementById("langBtn").textContent=LANG==="en"?"한국어":"EN";document.getElementById("langBtn").hidden=!!DATA.koOnly;
  document.getElementById("foot").innerHTML=U("footer");
  statEl.textContent=U(lastStat[0]||"loading")+(lastStat[2]||"");
  paintThemeBtn();
}
function rerender(){
  var y=window.scrollY;main.innerHTML="";sections={};chipRefs=[];
  fieldEls=fieldEls.filter(function(o){return PBB.contains(o.t);});
  railRefs=[];paintChrome();buildTabs();if(!DATA.only)buildCmp();ORD.forEach(buildScen);if(DATA.RN)buildRN();buildPrep();buildAfter();
  showTab(curTab,true);window.scrollTo(0,y);
  if(!PB.hidden&&curPlace){var ae=document.activeElement;if(!(ae&&PBB.contains(ae)&&ae.tagName==="TEXTAREA"))openPlace(curPlace,curScen);}
  fieldEls.forEach(function(o){if(o.t!==document.activeElement){var v=o.get()||"";if(o.t.value!==v)o.t.value=v;}fit(o.t);});
  updateChips();paintNow();paintRail();
}
function showTab(id,keep){
  if(!sections[id])id=DEF;curTab=id;
  Object.keys(sections).forEach(function(k){sections[k].hidden=(k!==id);});
  [].forEach.call(tabsEl.children,function(b){b.setAttribute("aria-selected",b.dataset.tab===id?"true":"false");});
  try{localStorage.setItem(TABKEY,id);}catch(e){}
  fieldEls.forEach(function(o){fit(o.t);});
  if(!keep)window.scrollTo(0,0);
}
document.getElementById("langBtn").addEventListener("click",function(){
  LANG=(LANG==="en"?"ko":"en");try{localStorage.setItem(LANGKEY,LANG);}catch(e){}rerender();
});
document.getElementById("themeBtn").addEventListener("click",function(){
  var nx=curTheme()==="dark"?"light":"dark";applyTheme(nx);try{localStorage.setItem(THEMEKEY,nx);}catch(e){}paintThemeBtn();
});

/* ── 시작 ── */
try{curTab=localStorage.getItem(TABKEY)||DEF;}catch(e){}
lastStat=["loading","",""];
rerender();
idleStatus();
setInterval(function(){paintNow();paintRail();},30000);
if(ED==="private"){

}
})();
</script>
