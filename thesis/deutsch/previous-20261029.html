/* V12: paper leaves its folder; ribbons are pulled from the bookmark. */
.paper-transition{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden;isolation:isolate}
.motion-snapshot{position:absolute;z-index:0;margin:0!important;pointer-events:none}
.paper-window{position:fixed;inset:0;z-index:1;pointer-events:none}
.paper-flight{position:fixed!important;margin:0!important;transform-origin:top left;will-change:transform,opacity;pointer-events:none;box-shadow:2px 7px 12px #27272726}
.folder-front{position:fixed!important;z-index:2;margin:0!important;transform-origin:center bottom;pointer-events:none;will-change:transform,opacity}
html[data-moving=true]{scroll-behavior:auto}
html[data-moving=true] .shell{pointer-events:none}
.ribbon-popover{top:-11px;filter:drop-shadow(1px 5px 3px #27272726);clip-path:inset(-12px -4px -12px -10px);outline:none;pointer-events:none}

.ribbon-popover[hidden]{display:none!important}
.punch{z-index:15}

@media(prefers-reduced-motion:reduce){.paper-flight,.folder-front,.ribbon{will-change:auto}}

 try{const raw=localStorage.getItem('study-files-v14:'+p+':data');if(raw===null)return {ok:true,exists:false,value:seed()};const value=JSON.parse(raw);if(!value||typeof value!=='object'||!value.de||!value.en||typeof value.de!=='object'||typeof value.en!=='object'||Array.isArray(value.de)||Array.isArray(value.en))return {ok:false};if(value.notes!==undefined&&(!value.notes||typeof value.notes!=='object'||Array.isArray(value.notes)))return {ok:false};if(!value.notes)value.notes={};return {ok:true,exists:true,value}}catch(e){return {ok:false}}

  const frames=open&&wasHidden?[from,{transform:`translate3d(${e.offsetWidth*.25}px,${-e.offsetTop*.55}px,0) rotate(0deg)`,clipPath:'inset(0 0 0 0)',offset:.55},to]:[from,to];

}

 const allSelectors=(pilot?{speaking:[['.pilot-listen'],['.pilot-dialogue']],writing:lesson.dataset.review==='true'?[['.pilot-transfer'],['.pilot-write']]:[['.pilot-write'],['.pilot-transfer']]}[view]:null)||{reading:[['.reading-paper'],['.translation-slip'],['.reading-quiz'],['.note-paper']],speaking:[['.loose-paper'],['.timer-paper',':scope>.save-status']],writing:[['.writing-paper'],['.reference-note'],['.week-write']],calendar:[['.month-paper'],['.daily-checks','.sticker-drawer'],['.daily-notes','.notes-entry'],['.sync-paper']]}[view];
 if(!allSelectors)return;
 const titles=[],selectors=allSelectors.filter((group,i)=>{const has=group.some(s=>lesson.querySelector(s));if(has)titles.push(pilot?(view==='speaking'?['대본 없이 듣기','두 차례 답하기'][i]:lesson.dataset.review==='true'?['새 상황 먼저','오늘의 쓰기'][i]:['오늘의 쓰기','새 상황 점검'][i]):folioTitles[view][i]);return has});if(!selectors.length)return;

}
function filteredFolioNotes(){const q=notesQuery.trim().toLocaleLowerCase();return allNotes().filter(n=>(notesLanguage==='all'||n.language===notesLanguage)&&(notesType==='all'||n.type===notesType)&&(!q||n.value.toLocaleLowerCase().includes(q)||n.date.includes(q)))}

function folioBoundary(direction){const surface=$('.folio-note-stage')||$('.recall-deck');if(surface&&!reducedMotion.matches)surface.animate([{transform:'none'},{transform:`translateX(${-direction*12}px)`},{transform:'none'}],{duration:180});}
function turnFolderNote(direction){

 if(view==='cards')return turnCard(direction);
 const total=view==='notes'?filteredFolioNotes().length:Number($('.folder-reader')?.dataset.noteTotal||0),index=folioPages[view]||0,next=index+direction;
 if(next<0||next>=total){folioBoundary(direction);return}

}
function scrollToFile(v){

async function switchFolder(v){

 if(reducedMotion.matches){day1FolderTransition=true;try{commitView(v);day1SavePosition();focusHeading()}finally{day1FolderTransition=false}return}
 const oldView=view,oldContent=$('.file-folder.is-open>.folder-content'),oldHeight=oldContent?.getBoundingClientRect().height||0,oldScroll=oldContent?.querySelector('.folder-reader')?.scrollTop||0,oldClone=oldContent?motionClone(oldContent):null;
 const startScroll=scrollY,shell=$('.shell');day1FolderTransition=true;navigationBusy=true;shell.inert=true;document.documentElement.dataset.moving='true';let raf=0;
 try{
  pause();stopSpeech();ribbonOpen=false;if(v==='cards')pilotRecallStart();if(v==='home'||v==='notes')noteReturn=false;view=v;render();
  const oldFolder=$('.file-folder[data-file="'+oldView+'"]'),incoming=$('.file-folder.is-open>.folder-content');
  const endHeight=incoming?.getBoundingClientRect().height||0;
  if(oldClone&&oldFolder){oldFolder.querySelector('.folder-content').replaceWith(oldClone);oldClone.hidden=false;oldClone.classList.add('is-folding');Object.assign(oldClone.style,{height:oldHeight+'px',minHeight:'0',padding:'0',flex:'none'});oldClone.querySelector('.folder-reader').style.height=oldHeight+'px';oldClone.querySelector('.folder-reader').scrollTop=oldScroll}
  if(incoming){incoming.classList.add('is-folding');incoming.querySelector('.folder-reader').style.height=endHeight+'px';incoming.style.height='0px'}
  // Animate the real folder heights together, so the intervening tabs slide with them.
  const duration=650,easing='cubic-bezier(.22,.72,.18,1)',moves=[];
  if(oldClone){moves.push(oldClone.animate([{height:oldHeight+'px'},{height:'0px'}],{duration,easing,fill:'both'}));const paper=oldClone.querySelector('.folder-reader');moves.push(paper.animate([{transform:'none',opacity:1},{transform:'translateY(-25px) scale(.97)',opacity:0}],{duration:430,easing,fill:'both'}))}
  if(incoming){moves.push(incoming.animate([{height:'0px'},{height:endHeight+'px'}],{duration,easing,fill:'both'}));moves.push(incoming.querySelector('.folder-reader').animate([{transform:'translateY(35px) scale(.97)',opacity:0},{transform:'none',opacity:1}],{duration:560,delay:90,easing,fill:'both'}))}
  navigationMoves=moves;const started=performance.now();
  const track=()=>{const t=Math.min(1,(performance.now()-started)/duration),ease=1-Math.pow(1-t,3);const target=v==='home'?0:Math.max(0,scrollY+$('.file-folder[data-file="'+v+'"]').getBoundingClientRect().top-8);window.scrollTo(0,startScroll+(target-startScroll)*ease);if(t<1)raf=requestAnimationFrame(track)};track();
  await Promise.allSettled(moves.map(a=>a.finished));
 }finally{
  cancelAnimationFrame(raf);navigationMoves.forEach(a=>a.cancel());navigationMoves=[];render();scrollToFile(v);shell.inert=false;navigationBusy=false;day1FolderTransition=false;delete document.documentElement.dataset.moving;day1SavePosition();focusHeading();
 }
}
function navigate(v,source){if(navigationBusy)return;if(v===view){if(source?.matches('.folder'))return switchFolder('home');return}return switchFolder(v)}
function nextFile(direction){
 if(day1Flow())return;
 const files=fileOrder.filter(v=>v!=='home'),at=files.indexOf(view),next=files[at+direction];if(at<0){return switchFolder('cards')}if(next)return switchFolder(next);

function turnCard(direction){

if(params.get('pilot')==='1')language='de';
pilotRecallStart();render();scrollToFile(view);initQuietScreen();
