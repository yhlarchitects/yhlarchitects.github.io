<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>로열층</title>
<meta name="description" content="16층에 사는 사람들 - 1~15회 대본">
<meta name="theme-color" content="#e8e6e1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:,">
<script>try{var t=localStorage.getItem("yhl-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-look",t)}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --desk:#e8e6e1; --paper:#fbfaf7; --ink:#262523; --mute:#7d7870; --hair:rgba(0,0,0,.07);
  --cover:#dfdcd5; --coverInk:#34322e; --coverMute:#77736b;
  --gut:rgba(40,36,30,.11); --shade:rgba(40,36,30,.22); --drop:rgba(40,36,30,.30);
  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  --pw:560px; --ph:792px; --pt:62px; --pb:58px; --px:52px; --fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-look="light"]){
    color-scheme:dark;
    --desk:#171716; --paper:#262523; --ink:#e3dfd7; --mute:#9b968d; --hair:rgba(255,255,255,.08);
    --cover:#4d4a45; --coverInk:#ece8e0; --coverMute:#b9b4ab;
    --gut:rgba(0,0,0,.34); --shade:rgba(0,0,0,.5); --drop:rgba(0,0,0,.6);
  }
}
:root[data-look="dark"]{
  color-scheme:dark;
  --desk:#171716; --paper:#262523; --ink:#e3dfd7; --mute:#9b968d; --hair:rgba(255,255,255,.08);
  --cover:#4d4a45; --coverInk:#ece8e0; --coverMute:#b9b4ab;
  --gut:rgba(0,0,0,.34); --shade:rgba(0,0,0,.5); --drop:rgba(0,0,0,.6);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* desk, stage, slots */
#desk{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#shift{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph);z-index:1}
.slot[hidden]{display:none}
.slot>.pg{box-shadow:0 1px 2px var(--hair),0 14px 30px -14px var(--drop)}

/* page */
.pg{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);box-sizing:border-box;overflow:hidden;
  background:var(--paper);color:var(--ink);font-size:var(--fs);line-height:1.68;font-family:var(--sans)}
.pg.paper.l::after,.pg.paper.r::after,.pg.inner.l::after,.pg.inner.r::after{content:"";position:absolute;top:0;bottom:0;width:42px;pointer-events:none}
.pg.l::after{right:0;background:linear-gradient(to left,var(--gut),rgba(0,0,0,0))}
.pg.r::after{left:0;background:linear-gradient(to right,var(--gut),rgba(0,0,0,0))}
.pg.solo::after{display:none}
.hd,.ft{position:absolute;left:var(--px);right:var(--px);display:flex;align-items:center;font-size:.7em;color:var(--mute);letter-spacing:.02em}
.hd{top:0;height:var(--pt);justify-content:space-between;gap:1em}
.ft{bottom:0;height:var(--pb);justify-content:center;font-variant-numeric:tabular-nums}
.pg.l .ft{justify-content:flex-start}
.pg.r .ft{justify-content:flex-end}
.pg.solo .ft{justify-content:center}
.bd{position:absolute;left:var(--px);right:var(--px);top:var(--pt);bottom:var(--pb);overflow:hidden;
  word-break:keep-all;overflow-wrap:anywhere;line-break:strict}

/* screenplay */
.bd>*{margin:.6em 0 0}
.bd .ep{font-weight:700;margin:0}
.ep .en{display:block;font-size:.78em;font-weight:500;color:var(--mute);letter-spacing:.08em}
.ep .et{display:block;font-size:1.42em;line-height:1.35;margin-top:.12em}
.bd .sc{font-size:1em;font-weight:700;margin-top:1.5em;line-height:1.5}
.bd .ep+.sc{margin-top:2.2em}
.bd .ac.li{padding-left:1em;text-indent:-1em}
.bd .ac.li.cn{text-indent:0}
.bd .no{font-size:.82em;line-height:1.62;color:var(--mute)}
.bd .ac.dg{white-space:pre;font-size:.86em;line-height:1.5;margin-top:0}
.bd .ac.dg:empty{height:.8em}
.bd .dl{display:grid;grid-template-columns:5em minmax(0,1fr);column-gap:.5em}
.dl .nm{font-weight:700;overflow-wrap:anywhere}
.dl .nm .ct{display:block;font-weight:400;font-size:.8em;color:var(--mute)}
.dl .tx p{margin:0}
.dl .pa,.dl .pi{color:var(--mute)}
.bd>:first-child{margin-top:0}

/* covers and front matter */
.pg.cover{background:var(--cover);color:var(--coverInk)}
.pg.cover.r{border-radius:0 3px 3px 0}
.pg.cover.l{border-radius:3px 0 0 3px}
.pg.cover.solo{border-radius:3px}
.cover .ct{position:absolute;left:13%;right:13%;top:22%}
.cover h1{margin:0;font-size:3.4em;line-height:1.15;font-weight:700;letter-spacing:.04em}
.cover .sub{margin:.7em 0 0;font-size:1.12em}
.cover .meta{margin:2.6em 0 0;font-size:.8em;color:var(--coverMute);letter-spacing:.02em}
.cover .au{position:absolute;left:13%;bottom:11%;margin:0;font-size:1em;letter-spacing:.14em}
.cover .bk{position:absolute;left:0;right:0;bottom:9%;margin:0;text-align:center;font-size:.72em;letter-spacing:.2em;color:var(--coverMute)}
.front .fm{position:absolute;left:var(--px);right:var(--px);top:30%}
.front .t{margin:0;font-size:1.7em;font-weight:700;letter-spacing:.04em}
.front .s{margin:.4em 0 0;color:var(--mute)}
.front .n{margin:3.2em 0 0;font-size:.86em;color:var(--mute);line-height:1.7}

/* turning */
.fx{position:absolute;top:0;width:var(--pw);height:var(--ph);z-index:5;pointer-events:none;transform-origin:50% 50%}
.fx-sh{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.fx-band{position:absolute;left:0;top:0;width:100px;height:100px;transform-origin:0 0;opacity:0;
  background:linear-gradient(90deg,var(--shade) 0,rgba(0,0,0,0) 100%),linear-gradient(90deg,var(--shade) 0,rgba(0,0,0,0) 40%),
  linear-gradient(90deg,rgba(0,0,0,.08) 0,rgba(0,0,0,0) 22%)}
.fx-leaf{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
.fx-flap{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;background:var(--paper);will-change:transform}
.fx-fs{position:absolute;left:0;top:0;width:100px;height:100px;transform-origin:0 0;
  background:linear-gradient(90deg,rgba(0,0,0,.2) 0,rgba(0,0,0,.09) 7%,rgba(0,0,0,.035) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.03) 100%)}
.fx.dk .fx-fs{background:linear-gradient(90deg,rgba(0,0,0,.32) 0,rgba(0,0,0,.11) 7%,rgba(255,255,255,.02) 40%,rgba(255,255,255,.045) 100%)}
.fx-bshade{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.04),rgba(0,0,0,.32))}
.pg.thru{opacity:.07}

/* bars */
.bar{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-left)) 0 max(12px,env(safe-area-inset-right));box-sizing:border-box}
#top{top:0;height:44px;justify-content:space-between}
#bot{bottom:0;height:52px;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.bar button{background:none;border:0;border-radius:6px;padding:6px 10px;font-size:14px;color:var(--mute);cursor:pointer;line-height:1.2}
.bar button:hover{background:var(--hair);color:var(--ink)}
.bar button:disabled{opacity:.35;cursor:default;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ttl{font-size:13px;color:var(--mute);letter-spacing:.12em}
#bPrev,#bNext{font-size:20px;padding:2px 12px}
#rng{width:min(38vw,300px);accent-color:var(--mute);margin:0}
#pn{min-width:7.5em;text-align:center;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

/* contents */
#toc{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(20,18,15,.32)}
#toc[hidden]{display:none}
.tin{background:var(--paper);color:var(--ink);width:min(440px,100%);max-height:100%;overflow:auto;border-radius:8px;
  padding:18px 18px 10px;box-sizing:border-box;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
.thd{display:flex;align-items:center;justify-content:space-between}
.thd h2{margin:0;font-size:15px;letter-spacing:.1em}
.thd button{background:none;border:0;border-radius:6px;padding:6px 10px;color:var(--mute);font-size:14px;cursor:pointer}
#tocList{list-style:none;margin:10px 0 0;padding:0}
#tocList button{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:.4em;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--hair);padding:9px 6px;font-size:15px;color:var(--ink);cursor:pointer}
#tocList button:hover{background:var(--hair)}
#tocList .tn{color:var(--mute);font-size:13px}
#tocList .tp{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}

#meas{position:absolute;left:-12000px;top:0;visibility:hidden;width:var(--pw);height:var(--ph);overflow:hidden}
</style>
</head>
<body>
<header id="top" class="bar">
  <button id="bToc" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="toc">차례</button>
  <span class="ttl" aria-hidden="true">로열층</span>
  <button id="bTheme" type="button" aria-label="밝기 바꾸기" aria-pressed="false">◐</button>
</header>
<main id="desk" role="region" aria-roledescription="책" aria-label="로열층 대본">
  <div id="stage"><div id="shift"><div id="slotL" class="slot"></div><div id="slotR" class="slot"></div></div></div>
</main>
<footer id="bot" class="bar">
  <button id="bPrev" type="button" aria-label="이전 쪽">‹</button>
  <input id="rng" type="range" min="0" max="0" value="0" step="1" aria-label="쪽 이동">
  <span id="pn" aria-hidden="true"></span>
  <button id="bNext" type="button" aria-label="다음 쪽">›</button>
</footer>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="toc" role="dialog" aria-modal="true" aria-labelledby="tocH" hidden>
  <div class="tin">
    <div class="thd"><h2 id="tocH">차례</h2><button id="tClose" type="button" aria-label="차례 닫기">닫기</button></div>
    <ol id="tocList"></ol>
  </div>
</div>
<div id="meas" aria-hidden="true"></div>
<template id="src">
<h3 class="sc fm">등장인물</h3>
<p class="ac li"><b>김지오</b> (32) 혜성맨션 하자보수 기사. 302호 김지우의 오빠. 누구에게나 「~습니다」. 부재와 치수로 말한다(단면·실측·준공년). 반말은 동생 지우에게만</p>
<p class="ac li"><b>김지우</b> (26) 302호에 살았다. 석 달 전 「전출」. 16층 2019.7.23의 방에 앉아 있다. 밝은 20대 동생 말. 「오빠, 봐」 「아 진짜」. 10회에서만 웃는 얼굴로 단정한다</p>
<p class="ac li"><b>오여사(오정림)</b> (71) 관리사무소 실세. 입주자대표회의. 서울 격식 노부인. 명령을 청유로, 질문이 아닌 질문. 같은 말을 두 번 한다</p>
<p class="ac li"><b>백경비</b> (60대) 경비. 30년째 매일 밤 16층 면회. 노트의 첫 칸이 처 윤순자. 충청 말. 「~믄」 「말어」 「고만」 「~구먼」. 짧고 느리다. 아내 이야기만 웃으며 현재형</p>
<p class="ac li"><b>한수린</b> (29) 입주민. 어릴 때 살다가 다시 왔다. 1998년 「전출」 한정목의 딸. 가벼운 서울 20대. 「~죠?」 「~거든요」. 질문을 받으면 멈춘다</p>
<p class="ac li"><b>관리소장</b> (60대) 관리소장. 겁이 많다. 전라 말. 「~혀」 「~니께」 「시방」. 올라가지 말라는 말만 한다</p>
<p class="ac li"><b>501호 사내(박만수)</b> (50대) 501호. 30년째 같은 민원. 억센 서울 반말. 「~잖아」 「~라니까」. 문장이 짧다</p>
<p class="ac li"><b>담당관</b> (30대) 경찰서 민원실. 관공서체. 「완료되어 있습니다」 「안내가 어렵습니다」</p>
<p class="ac li"><b>위원1·2·3</b> (50~60대) 입주자대표회의 위원. 같은 억양, 같은 박자. 위원2만 숫자를 읽는다</p>
<p class="ac li"><b>세입자</b> (40대) 지금의 302호. 수다스러운 아줌마 말. 「아이고」 「그쵸?」. 묻기 전에 말한다</p>
<p class="ac li"><b>안내방송</b> (-) 로비 스피커. 표준 억양의 안내 음성. 15회에서 무너진다</p>
<p class="ac li"><b>아버지(한정목)</b> (1998년의 40대) 수린의 아버지. 사원증을 목에 건 양복. 문틈 너머의 낮은 목소리. 「린아」</p>
<h3 class="sc">관계도</h3>
<p class="ac dg">302호</p>
<p class="ac dg">김지오 (하자보수 기사, 32)</p>
<p class="ac dg"> └─ 동생: 김지우 (26, 2026년 칸 「전출」, 16층 2019.7.23의 방)</p>
<p class="ac dg"></p>
<p class="ac dg">관리사무소</p>
<p class="ac dg">오여사 오정림 (71, 입주자대표회의) ─ 서약서 보증인 ─ 김지오</p>
<p class="ac dg"> ├─ 위원1·2·3 (같은 억양, 「통상 방식」)</p>
<p class="ac dg"> ├─ 관리소장 (「접수만 혀」)</p>
<p class="ac dg"> └─ 백경비 (노트, 1996년 첫 칸 윤순자 = 처) ─ 「고만 파」 ─ 김지오</p>
<p class="ac dg"></p>
<p class="ac dg">입주민</p>
<p class="ac dg">한수린 (29) ─ 아버지 한정목 (1998년 칸 「전출」, 16층 문 앞의 양복)</p>
<p class="ac dg">501호 박만수 ─ 601호 발소리 민원 30년 ─ 관리사무소</p>
<p class="ac dg">302호 세입자 ─ 「동생분, 매주 와요」 ─ 김지오</p>
<p class="ac dg"></p>
<p class="ac dg">밖</p>
<p class="ac dg">경찰서 담당관 ─ 「서류상 문제없습니다」 ─ 김지오</p>
<h2 class="ep" data-n="1"><span class="en">제1회</span> <span class="et">「마침 자리가 비어서」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">멈춘 영상통화 화면. 지우의 얼굴이 픽셀째 아래로 흘러내리는 중이다.</p>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="pa">(V.O., 끊기며)</p><p class="ln">우리 복도 끝에 문이 하나 더 있다?</p></div></div>
<p class="no">〔컷 - 통화 연결음과 함께 S#1으로. 같은 화면의 몇 초 전〕</p>
<h3 class="sc">S#1. 영상통화 화면 (INSERT) / 밤</h3>
<p class="no">〔세로 폰 화면 그대로 - 1회 오프닝은 화면비 연출 없이 시청자의 폰과 동일한 프레임〕</p>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="pa">(26, 화면 가득, 새 집을 빙 돌려 보여주며)</p><p class="ln">오빠, 봐. 해 들어오는 거. 이 가격에 이런 데 서울에 없어.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(E, 스피커 너머)</p><p class="ln">됐고. 관리비. 그런 데가 관리비로 뜯어.</p></div></div>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="ln">아 진짜 - <span class="pi">(웃다가 문득 카메라를 복도 쪽으로 돌린다)</span> 근데 오빠, 웃긴 거 하나. 우리 복도 끝에 문이 하나 더 있다?</p></div></div>
<p class="ac">카메라가 복도 끝을 비춘다. 어둑한 복도, 끝에 문 하나. 문 위 표시등이 느리게 깜박인다.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(E)</p><p class="ln">비상계단이겠지.</p></div></div>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="ln">비상계단은 반대쪽이고… <span class="pi">(화면이 지직, 픽셀이 흘러내린다)</span> 어? 오빠 들려? 야, 이거 왜 이-</p></div></div>
<p class="ac">화면 정지. 통화 종료음.</p>
<p class="no">〔VFX: 픽셀 붕괴가 아래로 「흘러내리는」 세로 글리치 - 이후 시리즈 전체에서 건물 개입의 시그니처로 반복〕</p>
<h3 class="sc">S#2. 경찰서 민원실 / 낮</h3>
<p class="ac">자막: 석 달 후</p>
<div class="dl" data-name="담당관"><div class="nm">담당관</div><div class="tx"><p class="pa">(모니터를 지오 쪽으로 돌린다)</p><p class="ln">김지우씨, 5월 20일자로 전출 신고 완료되어 있습니다. 전입지는 - 개인정보라 안내가 어렵습니다.</p></div></div>

<h3 class="sc">S#3. 경비실 / 밤</h3>
<p class="ac">자정. 지오, CCTV 모니터 앞. 백경비는 순찰 중인지 자리가 비었다.</p>
<p class="ac">엘리베이터 내부 화면 - 아무도 없다. 문이 스르르 닫힌다. 혼자 올라간다.</p>
<p class="ac">층 표시: 13… 14… 15… - 화면이 한 번 꿀렁이더니 - 16.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(모니터에 바짝 붙는다)</p></div></div>
<p class="ac">표시등이 16에서 멎어 있다. 3초. 화면 속 엘리베이터 문이 열린다 - 문밖은 새카만 어둠뿐.</p>
<p class="ac">그 어둠 속에서, 뭔가가 카메라 쪽으로 아주 천천히 다가온다.</p>
<p class="no">〔엔드컷: 지오의 등 뒤 - 꺼진 모니터 옆 유리창. 유리에 비친 경비실 밖, 창에 바짝 붙어 안을 들여다보는 실루엣 하나. 지오가 홱 돌아보는 순간 - 컷 아웃.〕</p>
<h2 class="ep" data-n="5"><span class="en">제5회</span> <span class="et">「전출 명단」</span></h2>
<h3 class="sc">S#1. 경비실 앞 / 밤</h3>
<p class="ac">유리 밖의 실루엣 - <b>백경비</b>다. 문을 열고 들어온다. 낮게 콧노래를 흥얼거리며, 말없이 모니터 전원을 뽑는다.</p>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln">밤에 그 화면, 보지 말어.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">방금 16층에서 문이 열렸습니다. 이 건물은 15층입니다.</p></div></div>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(커피를 따르며)</span> 열리지. 보는 사람한테는.</p></div></div>
<p class="ac">백경비, 지오의 얼굴을 오래 들여다본다. 그러다 - 웃는다.</p>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln">302호 김지우 오빠구먼. <span class="pi">(사이)</span> 걔 잘 있어. 아까도 봤어.</p></div></div>
<p class="ac">지오가 굳는다. 커피가 넘친다. 백경비는 따르던 손을 멈추지 않는다. 넘친 커피가 책상 끝에서 바닥으로 똑, 똑 떨어진다.</p>
<h3 class="sc">S#2. 경비실 안 / 밤</h3>
<p class="ac">백경비, 벽장 안쪽에서 낡은 대학노트를 꺼낸다. 표지에 아무것도 안 쓰여 있다.</p>
<p class="ac">펼친다 - 연도별로 칸이 나뉘고, 칸마다 이름. 이름마다 붉은 「전출」 도장.</p>
<p class="ac">1996. 1997. 1998. 1999…… 한 해에 하나씩. 어떤 해는 둘.</p>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(페이지를 넘기며, 흐뭇하게)</span> 내가 시작한 건 아니고. 이어 적는 거지. …빠진 해가 없어.</p></div></div>
<p class="ac">2026년 칸. 김지우.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(노트를 낚아챈다)</span> 이게 뭡니까. 우리 지우, 어디 있습니까.</p></div></div>
<p class="ac">백경비, 노트를 도로 가져간다. 지오에게는 눈길도 주지 않고, 구겨진 장부터 손바닥으로 천천히 편다.</p>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(조용히)</span> 고만 파. 파다 보믄 다음 칸이 자네여.</p></div></div>
<h3 class="sc">S#3. 경비실 안 / 밤 (이어서)</h3>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(노트에서 눈을 못 뗀다)</span> 이 명단, 뭡니까.</p></div></div>
<p class="ac">백경비, 대답 대신 맨 앞장을 편다. 1996년, 첫 칸.</p>
<p class="ac">윤순자. 색 바랜 볼펜 글씨 - 다른 이름들과 필적이 다르다. 떨리는 손으로 눌러 쓴 글씨.</p>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(이름을 손끝으로 쓰다듬는다)</span> …우리 집사람.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(백경비를 본다)</p></div></div>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(커피를 한 모금. 아무렇지 않게)</span> 삼십 년 됐지. 그 사람은 그대로고.</p></div></div>
<p class="ac">백경비가 보온병을 집으러 등을 돌린다. 지오, 폰을 꺼내 노트를 넘기며 찍는다. 한 장. 두 장. 셔터 소리.</p>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(등을 돌린 채)</span> 찍어. 다들 찍더라.</p></div></div>
<p class="no">〔엔드컷: 지오의 시선이 다시 2026년 칸으로. 김지우 - 그리고 그 아래, 도장 없이 연필로 흐리게 적힌 이름 하나가 초점에 잡힌다. 흐릿해서 읽히지 않는다. 컷 아웃.〕</p>
<h2 class="ep" data-n="6"><span class="en">제6회</span> <span class="et">「야반도주」</span></h2>
<h3 class="sc">S#1. 분리수거장 / 저녁</h3>
<p class="ac">박스를 접는 수린. 지오가 다가와 옆에서 캔 자루를 묶는다.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">저번에 엘리베이터에서… 인사가 늦었습니다. 하자보수 새로 온 김지오입니다.</p></div></div>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln"><span class="pi">(웃으며)</span> 아, 네. 한수린이요.</p></div></div>
<p class="ac">지오의 눈이 멎는다. 인서트 - 노트 2026년 칸, 연필로 흐린 세 글자. 한수린.</p>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln">근데 그날 저한테 뭐 물어보셨죠? 내가 뭘 잘못 대답한 것 같은 느낌이 자꾸 들거든요…</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(잠깐 보다가)</span> …아뇨. 아무것도.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">수린씨는 여기 오래 사셨습니까.</p></div></div>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln">어릴 때 살다가, 다시 왔어요. 이상하죠? 아빠가 없어진 집인데.</p></div></div>
<h3 class="sc">S#2. 분리수거장 / 저녁 (이어서)</h3>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">없어지셨다니…</p></div></div>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln"><span class="pi">(박스를 탁, 접으며 담담하게)</span> IMF 때요. 빚쟁이들 피해서 야반도주. …라고 엄마가 그랬어요. 근데 아빠가 도망간 다음 날에도 아빠 차가 주차장에 그대로 있었대요. 지금도 궁금해. 도망가는 사람이 차를 두고 가나?</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(주머니 속 - 몰래 찍어 둔 노트 사진을 꺼낼지 말지, 손이 망설인다)</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(사진을 내민다)</span> …이 이름, 아버님 성함 맞습니까.</p></div></div>
<p class="ac">수린이 본다. 1998년 칸. 한정목. 「전출」 도장.</p>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="pa">(정지 - 3회의 그 정지가 아니다. 이번엔 눈이 흔들린다)</p></div></div>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln"><span class="pi">(속삭이듯)</span> …아빠는, 도망간 게 아니에요?</p></div></div>
<p class="no">〔VFX: 수린의 동공에 노트 사진이 비치며 - 사진 속 「전출」 도장의 붉은 인주가 아주 살짝 번진다. 인지 필터에 간 첫 균열.〕</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(사진을 거둔다. 작업복 가슴주머니에서 명함 한 장을 꺼내 내민다)</span> …더 보셔야겠으면, 연락 주십시오. 하자보수 번호입니다.</p></div></div>
<p class="ac">수린이 명함을 받는다. 보지 않고 쥐기만 한다.</p>
<h3 class="sc">S#3. 계단실 / 저녁</h3>
<p class="ac">둘이 헤어져 각자 계단을 오른다. 카메라가 세로로 계단실을 훑어 올라간다 -</p>
<p class="ac">3층 계단참. 난간에 기대 서 있는 오여사. 손에 든 폰 화면 - 녹음 앱이 돌아가고 있다. 00:07:42.</p>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(아래를 내려다보며, 표정 없이)</span> …올해는 빠르네.</p></div></div>
<p class="no">〔엔드컷: 오여사가 녹음을 정지하고, 파일명을 입력한다. 「2026.08.21」. 저장. 그 위로 같은 형식의 파일이 줄줄이 - 「2025.09.03」 「2024.10.11」 「2023.08.30」…… 컷 아웃.〕</p>
<h2 class="ep" data-n="7"><span class="en">제7회</span> <span class="et">「장기수선충당금」</span></h2>
<h3 class="sc">S#1. 관리사무소 회의실 / 낮</h3>
<p class="ac">입주자대표회의. 위원 셋이 긴 테이블에. 지오는 구석에서 회의록 스캔 담당. 화이트보드: 「안건 3호 - 장기수선충당금 집행의 건」.</p>
<div class="dl" data-name="위원1"><div class="nm">위원1</div><div class="tx"><p class="ln">올해 벌써 하나 갔잖아.</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln">재건축 얘기가 도니까. 하나 더, 서두르자는 거지.</p></div></div>
<div class="dl" data-name="위원2"><div class="nm">위원2</div><div class="tx"><p class="ln"><span class="pi">(볼펜을 딸깍이며)</span> 후보는?</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(지오 쪽을 한 번 보고)</span> …추리는 중이에요.</p></div></div>
<p class="ac">서류 한 장이 위원들 손을 타고 돈다. 지오 앞을 지나는 순간 - 반쯤 보인다. 표 형식. 호수. 이름. 비고란에 「전세」 「전세」 「월세」.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(스캔하는 척, 시선은 서류에)</p></div></div>
<h3 class="sc">S#2. 회의실 / 낮 (이어서)</h3>
<div class="dl" data-name="위원3"><div class="nm">위원3</div><div class="tx"><p class="ln">충당금은 이번에도 그… 통상 방식으로?</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(말을 자르듯)</span> 통상 방식으로.</p></div></div>
<div class="dl" data-name="위원1"><div class="nm">위원1</div><div class="tx"><p class="ln"><span class="pi">(한숨)</span> 삼십 년을 해도 이건 영… <span class="pi">(오여사와 눈이 마주치자 입을 다문다)</span></p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(부드럽게)</span> 김위원. 98년에 옆 단지 반 토막 날 적에, 우리는 몇 프로 빠졌더라.</p></div></div>
<p class="ac">침묵. 볼펜 딸깍이는 소리만.</p>
<h3 class="sc">S#3. 회의실 / 낮 (이어서)</h3>
<p class="ac">회의 종료. 위원들이 서류를 챙긴다. 오여사가 지오를 부른다.</p>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln">지오씨. 601호 하자보수, 내일 올라가 줘요.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">…601호는 접수만 하라고 소장님이.</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(웃으며)</span> 소장은 겁이 많아서. 지오씨는 안 그럴 것 같은데. <span class="pi">(수첩을 펴지도 않고)</span> 한 시 반에 올라가요. 그때가 조용해요, 그 집은.</p></div></div>
<p class="ac">위원들이 하나씩 지오를 지나쳐 나간다.</p>
<div class="dl" data-name="위원1"><div class="nm">위원1</div><div class="tx"><p class="ln">수고해요.</p></div></div>
<div class="dl" data-name="위원2"><div class="nm">위원2</div><div class="tx"><p class="ln">수고해요.</p></div></div>
<p class="no">〔엔드컷: 같은 억양. 같은 높낮이. 같은 박자. 세 번째 위원이 지오 앞에서 입을 여는 순간 - 컷 아웃.〕</p>
<h2 class="ep" data-n="8"><span class="en">제8회</span> <span class="et">「1996년의 방」</span></h2>
<h3 class="sc">S#1. 601호 앞 / 낮</h3>
<p class="ac">지오, 공구가방을 메고 601호 앞. 초인종 - 여전히 고장. 노크.</p>
<p class="ac">문이 - 스르르, 혼자 열린다.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">…계십니까.</p></div></div>
<h3 class="sc">S#2. 601호 안 / 낮</h3>
<p class="ac">들어선다. 그리고 멈춘다.</p>
<p class="ac">브라운관 TV에서 흐르는 만화영화. 자개장. 벽걸이 달력 - 1996년 5월. 상 위에 김이 오르는 된장찌개. 반쯤 먹다 만 밥 두 공기.</p>
<p class="no">〔VFX: 창밖 풍경이 지금의 월정동이 아니다 - 저층 주택가, 공사 크레인, 1996년의 하늘〕</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(뒷걸음질)</p></div></div>
<p class="ac">돌아선다 - 현관이 없다. 방금 들어온 자리에 벽지뿐. 복도가 - 안쪽으로 길게, 더 길게 늘어나 있다.</p>
<p class="no">〔VFX: 세로 프레임의 소실점이 뒤로 미끄러지며 복도가 당겨진다 - 걸을수록 복도 끝 방문이 멀어지는 무한 복도〕</p>
<p class="ac">지오가 뛴다. 뛰어도 뛰어도 제자리. TV 만화영화 소리가 등 뒤에서 점점 커진다. 그 사이로 - 아이 웃음소리.</p>
<h3 class="sc">S#3. 601호 안 → 복도 / 낮</h3>
<p class="ac">그때 - 지오의 주머니에서 벨소리.</p>
<p class="no">〔VFX: 벨소리가 울릴 때마다 화면에 파문 - 늘어났던 복도가 파문을 따라 접히듯 줄어든다〕</p>
<p class="ac">벨소리를 향해 몸을 던지는 지오 - 문이 나타나고 - 복도 바닥에 나뒹군다. 601호 문이 등 뒤에서 쾅 닫힌다.</p>
<p class="ac">폰 화면: 모르는 번호. 그리고 그 위 시계 - 17:40.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(가쁜 숨)</span> …들어간 게 한 시 반인데.</p></div></div>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="pa">(F, 전화 너머)</p><p class="ln">지오씨? 두 시부터 몇 번을 걸었는데 왜 이제 받아요. …그 사진, 한 번만 더 봐야겠어요. 엄마는 아빠 얘기만 꺼내면 끊어요.</p></div></div>
<p class="no">〔엔드컷: 일어서는 지오의 등 뒤 - 닫힌 601호 문. 문 아래 틈으로, 안쪽에서 밖을 내다보는 눈 하나가 지나간다. 컷 아웃.〕</p>
<h2 class="ep" data-n="9"><span class="en">제9회</span> <span class="et">「어제도 왔었는데」</span></h2>
<h3 class="sc">S#1. 302호 앞 / 낮</h3>
<p class="ac">지우가 살던 집. 문패엔 새 이름. 지오, 초인종을 누르기 전에 복도 끝을 본다. 1회에 지우가 비췄던 자리. 문이 없다. 벽지뿐이다.</p>
<p class="ac">지오, 초인종을 누른다.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">관리사무소입니다. 보일러 배관 정기점검 나왔습니다.</p></div></div>
<div class="dl" data-name="세입자"><div class="nm">세입자</div><div class="tx"><p class="pa">(40대 여자, 문을 연다)</p><p class="ln">아이고 네, 들어오세요. 잘 오셨어요, 안방 쪽에서 밤마다 무슨 소리가 나 가지고. 우리 애 아빠는 못 듣는다는데 나만 들려요.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(복도 끝을 가리키며)</span> 저기, 문이 있지 않았습니까.</p></div></div>
<div class="dl" data-name="세입자"><div class="nm">세입자</div><div class="tx"><p class="ln">거기요? 원래 벽이었는데요. 그쵸?</p></div></div>
<h3 class="sc">S#2. 302호 안방 / 낮</h3>
<p class="ac">지오, 보일러 분배기를 여는 척하며 방을 훑는다. 동생이 살던 방. 새 가구, 새 커튼 - 그런데 벽지 한 귀퉁이가 들떠 있다.</p>
<p class="ac">세입자가 부엌으로 간 사이 - 들뜬 벽지를 살짝 젖힌다.</p>
<p class="ac">벽에 볼펜 글씨. 지우의 필체다.</p>
<p class="ac">「발소리는 위에서가 아니라 안에서 난다」</p>
<p class="ac">그 밑에 스케치 - 창문 없는 긴 복도. 문마다 명패 자리에 날짜. 마지막 문에 동그라미.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(손끝이 떨린다)</p></div></div>
<h3 class="sc">S#3. 302호 거실 / 낮</h3>
<div class="dl" data-name="세입자"><div class="nm">세입자</div><div class="tx"><p class="ln"><span class="pi">(차를 내오며)</span> 근데 기사님, 어디서 많이 뵌 것 같은데. 그쵸?</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(벽지를 원래대로 누르며)</span> …처음 뵙는 것 같습니다.</p></div></div>
<div class="dl" data-name="세입자"><div class="nm">세입자</div><div class="tx"><p class="ln">아 - <span class="pi">(손뼉)</span> 그 아가씨 오빠분이시구나! 어쩐지. 얼굴이 아주 닮았네.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(굳는다)</span> …네?</p></div></div>
<div class="dl" data-name="세입자"><div class="nm">세입자</div><div class="tx"><p class="ln">전에 여기 살던 아가씨. 어제도 왔었는데.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(찻잔을 내려놓는다)</span> 어제…요?</p></div></div>
<div class="dl" data-name="세입자"><div class="nm">세입자</div><div class="tx"><p class="ln"><span class="pi">(태연하게)</span> 동생분, 매주 와요. 자기가 살던 집이라고, 잠깐 둘러보고 가요. 참한 아가씨야.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">…그 사람, 어디서 온다고 합니까.</p></div></div>
<div class="dl" data-name="세입자"><div class="nm">세입자</div><div class="tx"><p class="ln"><span class="pi">(차를 홀짝, 아무렇지 않게)</span> 16층에서 내려온다던데.</p></div></div>
<p class="no">〔엔드컷: 지오의 얼굴에서 초점이 빠지고 - 배경의 거실 벽시계 초침이 멎는다. 째깍 소리만 한 박자 늦게 따라온다. 컷 아웃.〕</p>
<h2 class="ep" data-n="10"><span class="en">제10회</span> <span class="et">「2019년 7월 23일」</span></h2>
<h3 class="sc">S#1. 엘리베이터 안 / 밤</h3>
<p class="ac">폰 시계: 23:58. 지오, 버튼 판 앞에 서 있다. 16은 꺼져 있다.</p>
<p class="ac">23:59. 지오의 숨소리.</p>
<p class="ac">00:00.</p>
<p class="no">〔VFX: 16 버튼에 불이 - 켜지는 게 아니라 스며든다. 잉크가 물에 번지듯〕</p>
<p class="ac">지오가 누른다. 엘리베이터가 오른다. 13… 14… 15… 표시등이 잠시 캄캄해지고 -</p>
<p class="ac">16.</p>
<p class="ac">땡. 문이 열린다.</p>
<h3 class="sc">S#2. 16층 복도 / 밤</h3>
<p class="ac">창문 없는 복도가 세로 프레임 저 끝까지. 벽지도 바닥도 이 건물의 것인데 - 어딘가 물속 같다. 문마다 명패 자리에 날짜.</p>
<p class="ac">「1996.5.14」 「1998.11.2」 「1999.8.27」 「2003.2.11」……</p>
<p class="no">〔VFX: 각 문틈으로 각기 다른 계절의 빛이 새어 나온다 - 어떤 문 밑으론 여름 저녁의 주황, 어떤 문 밑으론 겨울 아침의 파랑〕</p>
<p class="ac">지오, 한 문 한 문 지나 걷는다. 그리고 - 멈춘다.</p>
<p class="ac">「2019.7.23」</p>
<p class="ac">지오가 아는 날짜다. 손잡이를 잡는 손이 떨린다.</p>
<h3 class="sc">S#3. 2019년 7월 23일의 방 / 밤 → 여름 저녁</h3>
<p class="ac">문이 열린다 - 매미 소리가 쏟아진다.</p>
<p class="ac">아파트 거실. 상 위에 수박. 선풍기가 고개를 젓는다. 젊은 <b>아버지</b>와 <b>어머니</b>가 마주 앉아 웃고 있고, 스물다섯의 <b>지오</b>가 수박씨를 뱉는다. 그리고 -</p>
<p class="ac">식탁에, 지금 나이 그대로의 <b>지우</b>가 앉아 있다.</p>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="ln"><span class="pi">(돌아보며, 아무렇지 않게)</span> 오빠 왜 왔어?</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(목이 멘다)</span> …지우야.</p></div></div>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="ln"><span class="pi">(수박 한 조각을 건네며 웃는다)</span> 이날 기억나지? 일주일 뒤에 엄마가 짐 싸. …나 여기가 좋아.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(들어서지 못하고 문턱에 선 채)</span> 지우야, 이건-</p></div></div>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="ln"><span class="pi">(말을 자르며, 여전히 웃는 얼굴로)</span> 알아. 그래도 좋아. 그게 왜 나빠?</p></div></div>
<div class="dl" data-name="어머니"><div class="nm">어머니</div><div class="tx"><p class="ln">지오야, 수박 더 먹어.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(문턱에서)</p><p class="ln">…어.</p></div></div>
<div class="dl" data-name="스물다섯 지오"><div class="nm">스물다섯 지오</div><div class="tx"><p class="pa">(동시에)</p><p class="ln">어.</p></div></div>
<p class="ac">두 목소리가 겹친다.</p>
<p class="ac">그때 - 식탁의 스물다섯 지오가 수박을 내려놓는다. 천천히 문 쪽으로 고개를 돌린다. 문턱의 지오를 빤히 본다.</p>
<div class="dl" data-name="스물다섯 지오"><div class="nm">스물다섯 지오</div><div class="tx"><p class="ln"><span class="pi">(문턱의 지오에게, 곧장)</span> 근데……</p></div></div>
<p class="no">〔VFX: 방 안의 모든 소리가 한 겹 가라앉는다. 매미 소리가 반 박자 늘어진다〕</p>
<div class="dl" data-name="스물다섯 지오"><div class="nm">스물다섯 지오</div><div class="tx"><p class="ln">형은 누구야?</p></div></div>
<p class="no">〔엔드컷: 젊은 부모가 동시에, 기계처럼 문 쪽으로 고개를 돌린다. 지우의 웃음이 떨어진다. 컷 아웃.〕</p>
<h2 class="ep" data-n="11"><span class="en">제11회</span> <span class="et">「식구」</span></h2>
<h3 class="sc">S#1. 2019년의 방 → 16층 복도 / 밤</h3>
<p class="ac">정적. 스물다섯 지오의 질문이 공중에 걸려 있다.</p>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="ln"><span class="pi">(벌떡 일어나며, 처음으로 다급하게)</span> 오빠, 나가. 지금.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(문턱 안으로 손을 뻗어 지우의 손목을 잡는다)</span> 같이 가.</p></div></div>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="ln">안 돼, 놔 - 놔!</p></div></div>
<p class="ac">지우를 문턱 밖으로 끌어내는 순간 - 지우가 비명을 지른다. 실체가 있는 비명이 아니라, 건물 전체가 함께 우는 소리.</p>
<p class="no">〔VFX: 복도 전체가 숨을 들이켜듯 수축했다 펴진다〕</p>
<p class="ac">복도의 모든 문이 - 일제히 열린다.</p>
<h3 class="sc">S#2. 16층 복도 / 밤</h3>
<p class="ac">문마다 사람이 서 있다. 문 안의 빛을 등져 얼굴은 보이지 않는다 - 파마머리, 교복, 연도마다 다른 옷 모양만. 가장 가까운 문에만 얼굴이 있다. 1998년의 양복 사내. 목에 건 사원증 - 한정목. 수린의 아버지다.</p>
<p class="no">〔제작 노트: 군중은 역광 실루엣. 얼굴을 생성하는 인물은 한정목 하나〕</p>
<p class="ac">수십 개의 그림자가 문턱에 서서, 말없이, 지오 쪽을 향한다. 적의는 없다. 보이는 눈은 한정목의 것뿐 - 안쓰러워하는 눈이다.</p>
<p class="ac">계단실 문이 열리며 백경비가 올라온다. 경비복이 아니다 - 다려 입은 양복, 빗어 넘긴 머리.</p>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(가쁜 숨, 낮고 단호하게)</span> 놔두고 내려가.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">아저씨-</p></div></div>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(지우의 손목을 잡은 지오의 손을 하나씩 편다)</span> 이렇게는 못 데리고 나가. 한 시 전에 내려가. 문 닫히믄 못 내려가.</p></div></div>
<p class="ac">지우가 뒷걸음질로 제 방에 돌아간다. 문이 닫히기 직전 -</p>
<div class="dl" data-name="지우"><div class="nm">지우</div><div class="tx"><p class="ln"><span class="pi">(문틈으로, 속삭임)</span> 오빠. …오지 마. 부탁이야.</p></div></div>
<p class="ac">백경비는 내려가지 않는다. 넥타이를 고쳐 매고, 복도 안쪽 「1996.5.14」 문으로 걸어간다. 문턱의 실루엣 하나가 그에게만 손을 내민다. 백경비가 그 손을 잡고 들어간다. 문이 닫힌다. 안에서 아까 그 콧노래가 - 두 사람 목소리로 새어 나온다.</p>
<h3 class="sc">S#3. 1층 로비 / 밤</h3>
<p class="ac">엘리베이터 문이 열린다. 로비 소파에 - 오여사와 위원 셋이 앉아 기다리고 있다. 새벽 한 시의 로비, 정장처럼 단정한 차림으로.</p>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(찻잔을 내려놓으며)</span> 다녀왔어요?</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(대답하지 않는다)</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(옆자리를 가리키며)</span> 앉아요. 봤으면 - 이제 식구네.</p></div></div>
<p class="ac">지오가 서 있자, 위원1이 서류철을 꺼내 테이블에 민다. 지오가 내려다본다.</p>
<p class="ac">근로계약서가 아니다. 「혜성맨션 입주민 서약서」. 서명란이 비어 있다.</p>
<p class="ac">오여사가 만년필 뚜껑을 연다. 지오가 보는 앞에서, 보증인란에 자기 이름을 적는다.</p>
<p class="no">〔엔드컷: 보증인란 클로즈업 - 아직 젖은 잉크, 「오정림」. 오여사가 만년필을 돌려 쥐고 지오 쪽으로 내민다. 컷 아웃.〕</p>
<h2 class="ep" data-n="12"><span class="en">제12회</span> <span class="et">「거래의 조건」</span></h2>
<h3 class="sc">S#1. 로비 / 밤</h3>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(서류를 밀어내며)</span> 동생을 데려가겠습니다.</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(찻잔을 든 채)</span> 가족 중에 여기 산 사람, 없다더니. <span class="pi">(사이)</span> 데려가서, 뭐라고 설명하려고. 저 애는 이제 이 벽 밖에선 하루를 못 있어요.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">…….</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(부드럽게)</span> 지오씨가 조용히만 있어 주면 - 밤에 올라가는 건 막지 않을게요. 백씨처럼. 매일.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">보러 가는 게 아니라, 데리고 나오겠습니다.</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(처음으로 웃음기가 사라진다)</span> 나오는 건 없어요. 삼십 년 동안 한 번도. 올라가는 것만 있지.</p></div></div>
<h3 class="sc">S#2. 로비 / 밤 (이어서)</h3>
<p class="ac">위원2가 파일을 편다. 그래프와 표.</p>
<div class="dl" data-name="위원2"><div class="nm">위원2</div><div class="tx"><p class="ln">혜성맨션 30년. 암 사망 0. 사고사 0. 자살 0. IMF 때 옆 단지 시세 마이너스 50, 혜성맨션 마이너스 2.</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln">건물이 받기만 한 게 아니에요. 지켜 줬지. 그 값이 - 일 년에 한 사람이에요. 아흔 세대에, 한 사람.</p></div></div>
<div class="dl" data-name="위원2"><div class="nm">위원2</div><div class="tx"><p class="ln"><span class="pi">(파일을 덮으며, 달래듯)</span> 걱정 마요. 가만히 있는 집은 한 번도 안 갔어.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(조용히, 오여사에게)</span> 그 한 사람이 당신 가족이어도 그렇게 말합니까.</p></div></div>
<p class="ac">오여사의 찻잔이 아주 미세하게 흔들린다. 위원1이 테이블 위의 서약서를 집어, 도로 서류철에 넣는다.</p>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(한 박자 늦게)</span> …그 얘긴 여기까지.</p></div></div>
<h3 class="sc">S#3. 로비 / 밤 (이어서)</h3>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(돌아선다)</span> 거절하겠습니다. 이 건물, 재건축 연한 찼습니다. 준공 95년, 올해로 31년.</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln"><span class="pi">(등 뒤에서, 다시 부드러워진 목소리)</span> 이 건물 고치자던 사람이 삼십 년에 다섯이었어요. 전부 무산됐지. 진단 신청서는 한 장도 못 나갔고.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(돌아보지 않고)</span> 그 다섯 사람은요.</p></div></div>
<div class="dl" data-name="오여사"><div class="nm">오여사</div><div class="tx"><p class="ln">이사 갔어요. 급하게.</p></div></div>
<p class="ac">정적. 위원1이 서류철을 안고 먼저 일어나 나간다. 위원2·3이 뒤따른다. 오여사만 찻잔을 든 채 남는다.</p>
<p class="no">〔엔드컷: 엘리베이터로 걸어가는 지오의 얼굴 - 백경비의 노트 페이지들이 플래시백으로 겹친다. 「전출」 「전출」 「전출」 「전출」 「전출」. 다섯 개의 붉은 도장이 세로로 쌓이며 - 컷 아웃.〕</p>
<h2 class="ep" data-n="13"><span class="en">제13회</span> <span class="et">「D등급」</span></h2>
<h3 class="sc">S#1. 지오의 방(직원 숙소) / 밤</h3>
<p class="ac">벽에 붙인 노트 사진들. 그 옆에 7회 회의 뒤 스캔 담당을 핑계로 빼낸 회의록 30년치. 지오가 회의록에서 추진 대표의 이름을 찾을 때마다 벽의 노트 사진을 짚는다. 같은 이름이 - 사진 속 노트에 있다. 이름 밑에 연도를 적는다.</p>
<p class="ac">1997 - 하자 소송 원고 대표. 첫 변론 3주 전 전출.</p>
<p class="ac">2004 - 외벽·배관 대수선. 발주 열흘 전 전출.</p>
<p class="ac">2015 - 세 층 올리는 수직증축 리모델링. 총회 전날 전출.</p>
<p class="ac">2019 - 리모델링 조합 재추진. 전출.</p>
<p class="ac">2023 - 재건축 준비위원회. 전출.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(사진들을 잇는 선을 긋는다)</span> …전부, 시작하기 직전.</p></div></div>
<p class="no">〔VFX: 벽에 붙은 사진·메모·선이 지오의 시점에서 건물 단면도로 재조립된다 - 15층 위 어둠에 덧그려지는 16층의 윤곽〕</p>
<h3 class="sc">S#2. 지오의 방 / 밤 (이어서)</h3>
<p class="ac">책상 위 - 하자 접수 태블릿이 진동한다. 한 번. 두 번. 연속으로.</p>
<p class="ac">화면: 901호 긴급. 704호 긴급. 1502호. 203호. 1101호. 302호. 605호…</p>
<p class="no">〔VFX: 접수 알림이 세로 화면을 폭포처럼 채우며 스크롤 - 90건. 마지막 줄에서 멈춘다: 「전 세대 호출」〕</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(태블릿을 든 채 굳는다)</p></div></div>
<h3 class="sc">S#3. 복도 / 밤</h3>
<p class="ac">지오가 방을 나선다. 복도의 모든 세대 문 옆 - 호출 표시등이 일제히 붉게 깜박인다. 층 전체가. 위층도. 아래층도.</p>
<p class="ac">전화벨. 관리소장이다.</p>
<div class="dl" data-name="관리소장"><div class="nm">관리소장</div><div class="tx"><p class="pa">(F, 갈라진 목소리)</p><p class="ln">지오씨, 시방 어디여. 사무실 전화가 다 - 다 자네만 찾어.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">…네?</p></div></div>
<div class="dl" data-name="관리소장"><div class="nm">관리소장</div><div class="tx"><p class="pa">(F)</p><p class="ln">아흔 세대가 전부. 하자보수 불러 달라고. 이름을 부름서.</p></div></div>
<p class="no">〔엔드컷: 복도의 가장 가까운 세대 문이 - 안에서 노크된다. 쿵. 쿵. 쿵. 안쪽에서 밖으로. 컷 아웃.〕</p>
<h2 class="ep" data-n="14"><span class="en">제14회</span> <span class="et">「벽이 귀야」</span></h2>
<h3 class="sc">S#1. 10층 복도 / 밤</h3>
<p class="ac">호출 표시등이 붉게 깜박이는 복도. 지오가 1004호 문을 연다 - 1996년의 거실. 닫는다. 1005호 - 같은 거실. 1006호 - 같은 거실, 같은 TV 소리.</p>
<p class="ac">지오, 벽에 등을 기대고 미끄러져 앉는다. 땀범벅. 손이 떨린다.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(숨을 고르며)</span> …지쳐 떨어질 때까지 부를 생각이야.</p></div></div>
<h3 class="sc">S#2. 전기실 / 밤</h3>
<p class="ac">수린이 차단기 판넬 앞에서 도면을 비춰 보고 있다. 문가에 지오가 벽을 짚고 주저앉아 있다.</p>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln"><span class="pi">(레버를 내리며)</span> 호출 시스템 전원, 여기죠.</p></div></div>
<p class="ac">철컥 - 복도의 붉은 표시등이 일제히 꺼진다. 정적.</p>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln"><span class="pi">(지오를 부축해 일으키며)</span> 일단 오늘은 끝. 끝이에요.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(수린을 본다)</span> …왜 돕습니까. 위험한 거 알면서.</p></div></div>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln"><span class="pi">(레버를 돌아보며)</span> 아빠 차요. 엄마가 십 년을 안 팔았어요. 돌아오면 타야 된다고. …그걸 알고 그냥 자요?</p></div></div>
<h3 class="sc">S#3. 전기실 / 밤 (이어서)</h3>
<p class="ac">둘이 전기실 문턱에 앉아 있다. 수린이 주머니에서 캔커피 두 개를 꺼낸다.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">안전진단. 연한 찬 건물은 진단에서 D등급 이하가 나오면 재건축 길이 열립니다. 이 건물은 삼십 년간 손대려는 걸 전부 막아 왔고요.</p></div></div>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln">막는 거면 막으면 되죠. 뭐가 무서운데요?</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(커피를 내려다보며)</span> 막는 방법이 사람이니까. …이번엔 우리가 먼저 움직입니다. 기둥 코어 세 군데, 샘플 떠서 진단업체에 보냅니다. D등급. 철거로 끝냅니다.</p></div></div>
<p class="ac">수린, 끄덕이지 않는다.</p>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln">아빠 꺼내고요. 그 다음에요.</p></div></div>
<p class="ac">둘의 머리 위 - 전기실 벽에 금 간 페인트가 소리 없이 벌어졌다, 닫힌다.</p>
<h3 class="sc">S#4. 수린의 방 / 밤 - 꿈</h3>
<p class="ac">어린 수린이 현관에서 아빠 구두를 안고 있다. 문틈으로 - 아버지의 목소리.</p>
<div class="dl" data-name="아버지"><div class="nm">아버지</div><div class="tx"><p class="pa">(V.O., 문틈에서)</p><p class="ln">린아. …들었어. 건물이 너희 계획을 들었어.</p></div></div>
<div class="dl" data-name="어린 수린"><div class="nm">어린 수린</div><div class="tx"><p class="ln"><span class="pi">(문틈에 귀를 대고)</span> 아빠?</p></div></div>
<div class="dl" data-name="아버지"><div class="nm">아버지</div><div class="tx"><p class="pa">(V.O.)</p><p class="ln">여긴 벽에 귀가 있는 게 아니야.</p></div></div>
<p class="no">〔엔드컷: 문틈의 어둠이 화면 가득 확대되며 -〕</p>
<div class="dl" data-name="아버지"><div class="nm">아버지</div><div class="tx"><p class="pa">(V.O.)</p><p class="ln">벽이, 귀야.</p></div></div>
<p class="no">〔수린, 침대에서 벌떡 - 숨을 몰아쉬는 얼굴에서 컷 아웃.〕</p>
<h2 class="ep" data-n="15"><span class="en">제15회</span> <span class="et">「건물이 말했다」</span></h2>
<h3 class="sc">S#1. 경비실 / 밤</h3>
<p class="ac">백경비가 둘을 불렀다. 테이블 위에 노트가 펼쳐져 있다. 보온병 커피 석 잔. 벽 못에 11회의 그 양복이 걸려 있다. 백경비는 그 콧노래를 낮게 흥얼거리고 있다.</p>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(콧노래를 멈추고)</span> 철거 얘기, 벽 안에서 하지 말어. <span class="pi">(사이)</span> …늦었겄지만.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln">아저씨는 삼십 년을 알고도 왜-</p></div></div>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(노트 첫 장을 쓸어 본다)</span> 1996년 봄. 집사람이 먼저 올라갔어. 나는 남았고. 경비를 하믄 밤마다 순찰을 도니께 - 밤마다 보러 가. <span class="pi">(웃는다)</span> 하루도 안 빠졌어, 삼십 년을.</p></div></div>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln"><span class="pi">(조용히)</span> …16층으로요.</p></div></div>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(끄덕인다)</span> 그 방은 우리 신혼여행 첫날 밤이거든. 문 열믄 이 노래가 나와. <span class="pi">(한 소절을 흥얼거린다)</span> 삼십 년을 매일 가도, 집사람은 나를 그날의 나로 봐. <span class="pi">(커피를 한 모금)</span> 늙은 나는 못 알아봐도 - 매일 새로 반해 주니, 그것도 복이지.</p></div></div>
<h3 class="sc">S#2. 경비실 / 밤 (이어서)</h3>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(어렵게)</span> 아저씨. 저희는 이 건물을 끝낼 겁니다.</p></div></div>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="pa">(커피잔을 내려놓는다. 오래 침묵)</p></div></div>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln">…부수믄, 16층 사람들은 어디로 가나.</p></div></div>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="pa">(입을 연다 - 닫는다)</p></div></div>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln">자네 동생은 아직 몸이 있어. 데리고 나오믄 돼. 근데 우리 집사람은. 저 위에 서른 명 넘는 사람들은. 몸이 여기 없는 사람들은 - 건물이 무너지믄, 어디로 가.</p></div></div>
<div class="dl" data-name="수린"><div class="nm">수린</div><div class="tx"><p class="ln">…우리 아빠도요?</p></div></div>
<p class="ac">백경비, 대답 대신 커피를 따른다.</p>
<div class="dl" data-name="지오"><div class="nm">지오</div><div class="tx"><p class="ln"><span class="pi">(한참 만에)</span> …모르겠습니다.</p></div></div>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(끄덕이며, 원망 없이)</span> 그려. …커피 식어.</p></div></div>
<p class="ac">백경비가 시계를 본다. 일어나 벽 못에서 양복을 내린다. 거울도 없이 넥타이를 맨다.</p>
<div class="dl" data-name="백경비"><div class="nm">백경비</div><div class="tx"><p class="ln"><span class="pi">(다정하게, 혼잣말처럼)</span> 열두 시네. 집사람 기다려.</p></div></div>
<h3 class="sc">S#3. 1층 로비 / 밤</h3>
<p class="ac">경비실을 나서는 둘. 그때 - 로비 천장 스피커가 직, 켜진다.</p>
<div class="dl" data-name="안내방송"><div class="nm">안내방송</div><div class="tx"><p class="pa">(여성 안내 음성, 표준 억양)</p><p class="ln">입주민 여러분께 알려드립니다. 오늘부로, 하자보수 기사 김지오씨는-</p></div></div>

      var q = reach(px, py, 0, cy0, w);
      q = reach(q[0], q[1], 0, h - cy0, Math.sqrt(w * w + h * h));
      px = q[0]; py = q[1];
    }
    var vx = w - px, vy = cy0 - py, len = Math.sqrt(vx * vx + vy * vy), ls = f.lb.style, fs = f.flap.style;
    if (len < 0.5) { ls[CP] = ""; fs[CP] = NONE; f.band.style.opacity = "0"; return; }
    var nx = vx / len, ny = vy / len, mx = (w + px) / 2, my = (cy0 + py) / 2, k = mx * nx + my * ny;
    ls[CP] = poly(cut(rect(0, -MARGIN, w + MARGIN, h + MARGIN), nx, ny, k));
    var a = 1 - 2 * nx * nx, b = -2 * nx * ny, c = 1 - 2 * ny * ny, e = 2 * k * nx, ff = 2 * k * ny;
    var lim = d.spread ? -w : 0;
    var fl = cut(cut(rect(0, 0, w, h), -nx, -ny, -k), -a, -b, e - lim);
    fs.transform = "matrix(" + r4(a) + "," + r4(b) + "," + r4(b) + "," + r4(c) + "," + r1(e) + "," + r1(ff) + ")";
    fs[CP] = poly(fl);
    var depth = 1;
    for (var i = 0; i < fl.length; i++) depth = Math.max(depth, fl[i][0] * nx + fl[i][1] * ny - k);
    var big = w + h, head = "translate(" + r1(mx) + "px," + r1(my) + "px) rotate(" + r4(Math.atan2(ny, nx) * 180 / Math.PI) +
      "deg) translate(0px," + (-big) + "px) scale(";
    f.fs.style.transform = head + r4(depth / 100) + "," + r4(big / 50) + ")";
    f.band.style.transform = head + r4((10 + Math.min(56, len * 0.3)) / 100) + "," + r4(big / 50) + ")";
    f.band.style.opacity = String(r4(Math.min(1, s * 3) * Math.min(1, (2 - s) * 3) * f.mult));
  }
  function boardFrame(d, w, h, p) {
    var f = d.fx, c = d.spread ? 1 - 2 * p : 1 - (d.dir > 0 ? p : 1 - p);
    var th = Math.acos(clamp(c, -1, 1)), deg = th * 180 / Math.PI;
    f.lb.style.transform = "perspective(" + Math.max(PERSP, Math.round(4.5 * w)) + "px) rotateY(" + r4(-deg) + "deg)";
    if (f.bk) { var past = deg > 90; f.fr.style.visibility = past ? "hidden" : ""; f.bk.style.visibility = past ? "" : "hidden"; }
    f.bs.style.opacity = String(r4(Math.sin(th) * (f.dark ? 0.5 : 0.42)));
    if (deg < 90) {
      f.band.style.transform = "translate(" + r1(w * Math.cos(th)) + "px,0px) scale(" + r4((16 + 70 * Math.sin(th)) / 100) + "," + r4(h / 100) + ")";
      f.band.style.opacity = String(r4(Math.min(1, deg / 12) * Math.max(0, 1 - deg / 90) * f.mult));
    } else f.band.style.opacity = "0";
  }
  function frame(d, p) {
    d.p = p;
    if (d.hard) boardFrame(d, S.W, S.H, p); else peelFrame(d, S.W, S.H, p);
  }
  function begin(dir, x, y) {
    if (!canTurn(dir)) return null;
    var vp = S.views[S.v], W = S.W, H = S.H, d = { dir: dir, p: 0, dy: 0, y0: y, spread: S.mode === "spread", hist: [] };
    if (d.spread) {
      d.leaf = dir > 0 ? vp[1] : vp[0]; d.back = d.leaf + dir; d.under = d.leaf + 2 * dir; d.mirror = dir < 0;
      d.x0 = dir > 0 ? x - W : W - x;
      setSlot(dir > 0 ? slotR : slotL, d.under);
    } else {
      var nv = S.views[S.v + dir][0];
      d.leaf = dir > 0 ? vp[0] : nv; d.under = dir > 0 ? nv : vp[0]; d.mirror = false; d.x0 = x;
      setSlot(slotR, d.under);

    build(d);
    frame(d, 0);
    return d;
  }
  function progress(d, x) {
    var xl = d.spread ? (d.dir > 0 ? x - S.W : S.W - x) : x;
    return d.spread || d.dir > 0 ? d.x0 - xl : xl - d.x0;
  }
  function dragMove(x, y, t) {
    var d = drag;
    if (!d || d.target !== undefined) return;
    var pp = progress(d, x);
    d.hist.push({ t: t, pp: pp });
    if (d.hist.length > 12) d.hist.shift();
    d.dy = y - d.y0;
    frame(d, clamp(pp / (d.spread ? 2 * S.W : S.W), 0, 1));
  }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function tween(from, to, ms, ease, step) {
    var my = ++token;
    return new Promise(function (res) {
      var t0 = 0;
      pend = res;
      function f(ts) {

        if (!t0) t0 = ts;
        var t = Math.min(1, (ts - t0) / ms), e = ease(t);
        step(from + (to - from) * e, e);
        if (t < 1) anim = requestAnimationFrame(f); else { anim = 0; pend = null; res(true); }
      }
      anim = requestAnimationFrame(f);
    });
  }
  function settle(d, go, full) {
    var target = go ? 1 : 0, dist = Math.abs(target - d.p), dy0 = d.dy || 0;
    var ms = full ? (d.spread ? 820 : 560) : Math.max(160, Math.min(560, dist * (d.spread ? 900 : 640)));
    d.target = target;
    return tween(d.p, target, ms, full ? easeInOut : easeOut, function (v, e) { d.dy = dy0 * (1 - e); frame(d, v); }).then(function (done) {
      if (!done) return;
      if (drag === d) drag = null;
      teardown(d);
      if (go) commit(S.v + d.dir); else showView(S.v);
    });
  }
  /* a new command while a page is still moving: land the moving page at once, then go on */
  function finishNow() {
    if (!drag) return;
    var d = drag, go = d.target === 1;
    token++;
    if (anim) cancelAnimationFrame(anim);
    anim = 0;
    var r = pend; pend = null; if (r) r(false);
    teardown(d); drag = null;
    if (go) commit(S.v + d.dir); else showView(S.v);
  }
  function fadeTo(v) {
    commit(v);
    try { shift.animate([{ opacity: 0.2 }, { opacity: 1 }], { duration: 200, easing: "ease-out" }); } catch (e) {}
  }
  function turn(dir) {
    finishNow();
    if (!canTurn(dir)) return Promise.resolve();
    if (reduced) { fadeTo(S.v + dir); return Promise.resolve(); }
    var W = S.W, x = S.mode === "spread" ? (dir > 0 ? 2 * W - 1 : 1) : (dir > 0 ? W - 1 : 1);
    var d = begin(dir, x, S.H * 0.92);
    if (!d) return Promise.resolve();
    drag = d;
    return settle(d, true, true);
  }
  function jump(v) {
    finishNow();
    v = clamp(v | 0, 0, S.views.length - 1);
    if (v === S.v) return Promise.resolve();
    if (Math.abs(v - S.v) === 1 && !reduced) return turn(v - S.v);
    fadeTo(v);
    return Promise.resolve();
  }
  function busy() { return !!drag || !!anim; }

  /* ================= layout ================= */
  function measureWindow() {
    var vw = WIN.innerWidth, vh = WIN.innerHeight, aw = vw - 2 * GAP, ah = vh - BAR_T - BAR_B - 8;
    var b = DES.book, c = DES.compact, s2 = Math.min(aw / (2 * b.w), ah / b.h), s1 = Math.min(aw / b.w, ah / b.h), L;
    if (vw > vh * 1.05 && s2 >= 0.62) L = { mode: "spread", dk: "book", sc: s2 };
    else if (s1 >= 0.85) L = { mode: "single", dk: "book", sc: s1 };
    else L = { mode: "single", dk: "compact", sc: Math.min(aw / c.w, ah / c.h) };
    L.sc = Math.min(L.sc, 1.7); L.vw = vw; L.ah = ah;
    return L;
  }
  function relayout(L, a) {
    var changed = L.mode !== S.mode || L.dk !== S.dk;
    if (changed) {
      if (a === undefined) a = anchor();
      S.mode = L.mode; S.dk = L.dk; S.book = getBook(L.dk); buildViews();
    }
    var d = DES[L.dk], sw = (S.mode === "spread" ? 2 : 1) * d.w;
    S.W = d.w; S.H = d.h; S.sc = L.sc;
    setVars(stage, d);
    stage.style.width = sw + "px"; stage.style.height = d.h + "px";
    var left = Math.round((L.vw - sw * L.sc) / 2), top = Math.round(BAR_T + 4 + (L.ah - d.h * L.sc) / 2);
    stage.style.transform = "translate(" + left + "px," + top + "px) scale(" + r4(L.sc) + ")";
    slotL.style.left = "0px"; slotR.style.left = (S.mode === "spread" ? d.w : 0) + "px";
    R.setAttribute("data-mode", S.mode);
    if (changed) S.v = viewForAnchor(a);
    S.v = clamp(S.v, 0, S.views.length - 1);
    showView(S.v); updateUI();
  }
  var rsT = 0;
  function onResize() {
    clearTimeout(rsT);
    rsT = setTimeout(function () {
      if (busy()) { onResize(); return; }
      relayout(measureWindow());
    }, 150);
  }

  /* ================= input ================= */
  function local(e) { var r = shift.getBoundingClientRect(); return { x: (e.clientX - r.left) / S.sc, y: (e.clientY - r.top) / S.sc }; }
  var pd = null;
  function tap(x) {
    if (S.mode === "spread") turn(x >= S.W ? 1 : -1);
    else turn(x < S.W * 0.35 ? -1 : 1);
  }
  desk.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || !toc.hidden) return;
    var pt = local(e);

  });
  desk.addEventListener("pointermove", function (e) {
    if (!pd || e.pointerId !== pd.id) return;

      var dir = S.mode === "spread" ? (pd.x0 >= S.W ? 1 : -1) : (dx < 0 ? 1 : -1);

      if (!canTurn(dir)) return;
      if (reduced) { pd.dir = dir; return; }

  function progressReduced(p, x) { return p.dir > 0 ? p.x0 - x : x - p.x0; }

    if (!pd || e.pointerId !== pd.id) return;
    var p = pd; pd = null;
    try { desk.releasePointerCapture(e.pointerId); } catch (err) {}

    if (!p.moved) { tap(local(e).x); return; }
    if (p.dir && !drag) { if ((p.last || 0) > 30) fadeTo(S.v + p.dir); return; }

    if (!d || d.target !== undefined) return;

      while (j > 0 && lastS.t - h[j].t < 80) j--;
      var dt = lastS.t - h[j].t;

  }
  desk.addEventListener("pointerup", release);
  desk.addEventListener("pointercancel", release);

  D.addEventListener("keydown", function (e) {
    if (!toc.hidden) {
      if (e.key === "Escape") { e.preventDefault(); closeToc(); }
      else if (e.key === "Tab") trapTab(e);
      return;
    }
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") && (e.key === " " || e.key === "Enter")) return;
    if (e.target && e.target.tagName === "INPUT" && e.key.indexOf("Arrow") === 0) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;

    if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); turn(1); }
    else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); turn(-1); }
    else if (k === "Home") { e.preventDefault(); jump(0); }
    else if (k === "End") { e.preventDefault(); jump(S.views.length - 1); }
  });
  bPrev.addEventListener("click", function () { turn(-1); });
  bNext.addEventListener("click", function () { turn(1); });
  rng.addEventListener("input", function () { jump(+rng.value); });

  /* contents */
  TOC.forEach(function (t) {
    var li = D.createElement("li"), b = D.createElement("button"), a = D.createElement("span"), m = D.createElement("span"), c = D.createElement("span");
    b.type = "button"; a.className = "tn"; m.className = "tt"; c.className = "tp";
    a.textContent = "제" + t.n + "회"; m.textContent = "「" + t.t + "」";
    b.appendChild(a); b.appendChild(m); b.appendChild(c);
    b.addEventListener("click", function () { closeToc(); jump(viewOf(S.book.epStart[t.n])); });
    li.appendChild(b); tocList.appendChild(li); t.tp = c;

  function openToc() { toc.hidden = false; bToc.setAttribute("aria-expanded", "true"); var f = tocList.querySelector("button"); if (f) f.focus(); }

  /* theme */

  WIN.addEventListener("resize", onResize);
  ready = true;

  /* test hook */

    get view() { return S.v; }, get viewCount() { return S.views.length; }, get pageCount() { return S.book.pages.length; },
    get contentCount() { return S.book.cc; },
    views: function () { return S.views.slice(); },
    pages: function () { return S.book.pages.map(function (p, i) { return { i: i, kind: p.kind, ep: p.ep || 0, folio: p.folio || 0, u: p.u }; }); },
    epStart: function () { return JSON.parse(JSON.stringify(S.book.epStart)); },
    viewOf: viewOf, renderPage: renderPage, go: jump, turn: turn, busy: busy,
    unitCount: UNITS.length

})();
