<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>명당</title>
<meta name="description" content="죽을 자리를 짓는다 - 1~15회 대본">
<meta name="theme-color" content="#e8e6e1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:,">
<script>try{var t=localStorage.getItem("yhl-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-look",t)}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --desk:#e8e6e1; --paper:#fbfaf7; --ink:#262523; --mute:#7d7870; --hair:rgba(0,0,0,.07);
  --cover:#dfdcd5; --coverInk:#34322e; --coverMute:#77736b;
  --gut:rgba(40,36,30,.11); --shade:rgba(40,36,30,.22); --drop:rgba(40,36,30,.30);
  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  --pw:560px; --ph:792px; --pt:62px; --pb:58px; --px:52px; --fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-look="light"]){
    color-scheme:dark;
    --desk:#171716; --paper:#262523; --ink:#e3dfd7; --mute:#9b968d; --hair:rgba(255,255,255,.08);
    --cover:#4d4a45; --coverInk:#ece8e0; --coverMute:#b9b4ab;
    --gut:rgba(0,0,0,.34); --shade:rgba(0,0,0,.5); --drop:rgba(0,0,0,.6);
  }
}
:root[data-look="dark"]{
  color-scheme:dark;
  --desk:#171716; --paper:#262523; --ink:#e3dfd7; --mute:#9b968d; --hair:rgba(255,255,255,.08);
  --cover:#4d4a45; --coverInk:#ece8e0; --coverMute:#b9b4ab;
  --gut:rgba(0,0,0,.34); --shade:rgba(0,0,0,.5); --drop:rgba(0,0,0,.6);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* desk, stage, slots */
#desk{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#shift{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph);z-index:1}
.slot[hidden]{display:none}
.slot>.pg{box-shadow:0 1px 2px var(--hair),0 14px 30px -14px var(--drop)}

/* page */
.pg{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);box-sizing:border-box;overflow:hidden;
  background:var(--paper);color:var(--ink);font-size:var(--fs);line-height:1.68;font-family:var(--sans)}
.pg.paper.l::after,.pg.paper.r::after,.pg.inner.l::after,.pg.inner.r::after{content:"";position:absolute;top:0;bottom:0;width:42px;pointer-events:none}
.pg.l::after{right:0;background:linear-gradient(to left,var(--gut),rgba(0,0,0,0))}
.pg.r::after{left:0;background:linear-gradient(to right,var(--gut),rgba(0,0,0,0))}
.pg.solo::after{display:none}
.hd,.ft{position:absolute;left:var(--px);right:var(--px);display:flex;align-items:center;font-size:.7em;color:var(--mute);letter-spacing:.02em}
.hd{top:0;height:var(--pt);justify-content:space-between;gap:1em}
.ft{bottom:0;height:var(--pb);justify-content:center;font-variant-numeric:tabular-nums}
.pg.l .ft{justify-content:flex-start}
.pg.r .ft{justify-content:flex-end}
.pg.solo .ft{justify-content:center}
.bd{position:absolute;left:var(--px);right:var(--px);top:var(--pt);bottom:var(--pb);overflow:hidden;
  word-break:keep-all;overflow-wrap:anywhere;line-break:strict}

/* screenplay */
.bd>*{margin:.6em 0 0}
.bd .ep{font-weight:700;margin:0}
.ep .en{display:block;font-size:.78em;font-weight:500;color:var(--mute);letter-spacing:.08em}
.ep .et{display:block;font-size:1.42em;line-height:1.35;margin-top:.12em}
.bd .sc{font-size:1em;font-weight:700;margin-top:1.5em;line-height:1.5}
.bd .ep+.sc{margin-top:2.2em}
.bd .ac.li{padding-left:1em;text-indent:-1em}
.bd .ac.li.cn{text-indent:0}
.bd .no{font-size:.82em;line-height:1.62;color:var(--mute)}
.bd .ac.dg{white-space:pre;font-size:.86em;line-height:1.5;margin-top:0}
.bd .ac.dg:empty{height:.8em}
.bd .dl{display:grid;grid-template-columns:5em minmax(0,1fr);column-gap:.5em}
.dl .nm{font-weight:700;overflow-wrap:anywhere}
.dl .nm .ct{display:block;font-weight:400;font-size:.8em;color:var(--mute)}
.dl .tx p{margin:0}
.dl .pa,.dl .pi{color:var(--mute)}
.bd>:first-child{margin-top:0}

/* covers and front matter */
.pg.cover{background:var(--cover);color:var(--coverInk)}
.pg.cover.r{border-radius:0 3px 3px 0}
.pg.cover.l{border-radius:3px 0 0 3px}
.pg.cover.solo{border-radius:3px}
.cover .ct{position:absolute;left:13%;right:13%;top:22%}
.cover h1{margin:0;font-size:3.4em;line-height:1.15;font-weight:700;letter-spacing:.04em}
.cover .sub{margin:.7em 0 0;font-size:1.12em}
.cover .meta{margin:2.6em 0 0;font-size:.8em;color:var(--coverMute);letter-spacing:.02em}
.cover .au{position:absolute;left:13%;bottom:11%;margin:0;font-size:1em;letter-spacing:.14em}
.cover .bk{position:absolute;left:0;right:0;bottom:9%;margin:0;text-align:center;font-size:.72em;letter-spacing:.2em;color:var(--coverMute)}
.front .fm{position:absolute;left:var(--px);right:var(--px);top:30%}
.front .t{margin:0;font-size:1.7em;font-weight:700;letter-spacing:.04em}
.front .s{margin:.4em 0 0;color:var(--mute)}
.front .n{margin:3.2em 0 0;font-size:.86em;color:var(--mute);line-height:1.7}

/* turning */
.fx{position:absolute;top:0;width:var(--pw);height:var(--ph);z-index:5;pointer-events:none;transform-origin:50% 50%}
.fx-sh{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.fx-band{position:absolute;left:0;top:0;width:100px;height:100px;transform-origin:0 0;opacity:0;
  background:linear-gradient(90deg,var(--shade) 0,rgba(0,0,0,0) 100%),linear-gradient(90deg,var(--shade) 0,rgba(0,0,0,0) 40%),
  linear-gradient(90deg,rgba(0,0,0,.08) 0,rgba(0,0,0,0) 22%)}
.fx-leaf{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
.fx-flap{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;background:var(--paper);will-change:transform}
.fx-fs{position:absolute;left:0;top:0;width:100px;height:100px;transform-origin:0 0;
  background:linear-gradient(90deg,rgba(0,0,0,.2) 0,rgba(0,0,0,.09) 7%,rgba(0,0,0,.035) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.03) 100%)}
.fx.dk .fx-fs{background:linear-gradient(90deg,rgba(0,0,0,.32) 0,rgba(0,0,0,.11) 7%,rgba(255,255,255,.02) 40%,rgba(255,255,255,.045) 100%)}
.fx-bshade{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.04),rgba(0,0,0,.32))}
.pg.thru{opacity:.07}

/* bars */
.bar{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-left)) 0 max(12px,env(safe-area-inset-right));box-sizing:border-box}
#top{top:0;height:44px;justify-content:space-between}
#bot{bottom:0;height:52px;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.bar button{background:none;border:0;border-radius:6px;padding:6px 10px;font-size:14px;color:var(--mute);cursor:pointer;line-height:1.2}
.bar button:hover{background:var(--hair);color:var(--ink)}
.bar button:disabled{opacity:.35;cursor:default;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ttl{font-size:13px;color:var(--mute);letter-spacing:.12em}
#bPrev,#bNext{font-size:20px;padding:2px 12px}
#rng{width:min(38vw,300px);accent-color:var(--mute);margin:0}
#pn{min-width:7.5em;text-align:center;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}

/* contents */
#toc{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(20,18,15,.32)}
#toc[hidden]{display:none}
.tin{background:var(--paper);color:var(--ink);width:min(440px,100%);max-height:100%;overflow:auto;border-radius:8px;
  padding:18px 18px 10px;box-sizing:border-box;box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
.thd{display:flex;align-items:center;justify-content:space-between}
.thd h2{margin:0;font-size:15px;letter-spacing:.1em}
.thd button{background:none;border:0;border-radius:6px;padding:6px 10px;color:var(--mute);font-size:14px;cursor:pointer}
#tocList{list-style:none;margin:10px 0 0;padding:0}
#tocList button{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:.4em;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--hair);padding:9px 6px;font-size:15px;color:var(--ink);cursor:pointer}
#tocList button:hover{background:var(--hair)}
#tocList .tn{color:var(--mute);font-size:13px}
#tocList .tp{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}

#meas{position:absolute;left:-12000px;top:0;visibility:hidden;width:var(--pw);height:var(--ph);overflow:hidden}

.cover .poster{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background:#0b0b0d;color:#f2efe9}
.poster img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.poster .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 58%,rgba(0,0,0,.75) 74%,rgba(0,0,0,.95) 88%,#000)}
.poster .tag{position:absolute;left:10%;right:10%;bottom:11%;margin:0;text-align:center;font-size:.8em;line-height:1.75;
  letter-spacing:.06em;color:rgba(242,239,233,.86);text-shadow:0 1px 8px rgba(0,0,0,.9)}
.poster .ttl{position:absolute;left:0;right:0;bottom:19.5%;text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.85)}
.poster .ttl h1{margin:0;font-size:4.3em;line-height:1;font-weight:800;letter-spacing:.14em;text-indent:.14em;color:#fff}
.poster .ttl .sub{margin:.85em 0 0;font-size:.98em;font-weight:500;letter-spacing:.32em;text-indent:.32em;color:rgba(242,239,233,.9)}
.poster .cred{position:absolute;left:8%;right:8%;bottom:3.6%;margin:0;text-align:center;font-size:.58em;line-height:1.8;
  letter-spacing:.14em;color:rgba(242,239,233,.55)}
.poster .cred b{font-weight:600;color:rgba(242,239,233,.8)}
</style>
</head>
<body>
<header id="top" class="bar">
  <button id="bToc" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="toc">차례</button>
  <span class="ttl" aria-hidden="true">명당</span>
  <button id="bTheme" type="button" aria-label="밝기 바꾸기" aria-pressed="false">◐</button>
</header>
<main id="desk" role="region" aria-roledescription="책" aria-label="명당 대본">
  <div id="stage"><div id="shift"><div id="slotL" class="slot"></div><div id="slotR" class="slot"></div></div></div>
</main>
<footer id="bot" class="bar">
  <button id="bPrev" type="button" aria-label="이전 쪽">‹</button>
  <input id="rng" type="range" min="0" max="0" value="0" step="1" aria-label="쪽 이동">
  <span id="pn" aria-hidden="true"></span>
  <button id="bNext" type="button" aria-label="다음 쪽">›</button>
</footer>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="toc" role="dialog" aria-modal="true" aria-labelledby="tocH" hidden>
  <div class="tin">
    <div class="thd"><h2 id="tocH">차례</h2><button id="tClose" type="button" aria-label="차례 닫기">닫기</button></div>
    <ol id="tocList"></ol>
  </div>
</div>
<div id="meas" aria-hidden="true"></div>
<template id="src">
<h3 class="sc fm">등장인물</h3>
<p class="ac li"><b>윤세리</b> (28) 온담건축 설계2팀 대리. 국풍 윤석규의 손녀. 서울 표준말. 명사 한 마디와 「~겠습니다」. 설명하지 않는다. 아버지 앞에서만 「아빠」</p>
<p class="ac li"><b>강이현</b> (34) 강산그룹 상무, 신사옥 TF장. 회장의 장남. 끝까지 존댓말. 각도·거리·시각을 먼저 말하고 끝을 「~인데요」로 띄운다. 어머니 이야기만 문장이 짧아진다</p>
<p class="ac li"><b>강도형</b> (68) 강산그룹 회장. 전원에게 하대. 숫자를 입에 안 올리고 사물과 비유로 명령한다. 「~나」「~지」「~게」</p>
<p class="ac li"><b>현묵</b> (63) 회장의 지관(풍수를 보고 집터·방향·날을 잡아 주는 사람). 윤석규의 제자였다. 회장 앞은 옛 격식 서울 말(「~올시다」「~더이다」). 세리와 단둘이면 전라 말이 샌다(「~제」「~것이여」)</p>
<p class="ac li"><b>윤병철</b> (56) 세리의 아버지. 택시 기사. 2006년 강산건설 공무과장. 서울 30년에 반쯤 깎인 경북 말. 「니」「~카더라」「묵었나」「몬」. 밥·약·일 세 단어로 산다</p>
<p class="ac li"><b>윤석규</b> (향년 76) 국풍(나라에서 손꼽던 풍수가). 회상으로만. 경북 북부 어른의 말. 「~습니더」「~믄」「~기라」「~데이」. 느리고, 한 번 말하면 다시 안 한다</p>
<p class="ac li"><b>민재경</b> (41) 온담건축 설계2팀장. 서울 직장 입말. 반말·반존대 섞임, 수다, 「~잖아」「~거든」. 견적팀과 야근이 말끝마다 붙는다</p>
<p class="ac li"><b>강이서</b> (31) 강산건설 사장. 회장의 차녀. 퍼센트와 비용으로만 말한다. 짧은 「~요」에 비아냥 한 토막</p>
<h3 class="sc">관계도</h3>
<p class="ac dg">윤씨 집</p>
<p class="ac dg">윤석규 (국풍, 2008년 사망)</p>
<p class="ac dg"> ├─ 아들: 윤병철 (택시 기사, 2006년 강산건설 공무과장)</p>
<p class="ac dg"> │    └─ 딸: 윤세리 (온담건축 설계 대리)</p>
<p class="ac dg"> └─ 제자: 현묵 (지금은 회장의 지관)</p>
<p class="ac dg"></p>
<p class="ac dg">강씨 집</p>
<p class="ac dg">강도형 (강산그룹 회장)</p>
<p class="ac dg"> ├─ 장남: 강이현 (신사옥 TF장, 2007년 램프 붕괴로 어머니를 잃음)</p>
<p class="ac dg"> └─ 차녀: 강이서 (강산건설 사장) ─ 현묵의 실제 주인</p>
<p class="ac dg"></p>
<p class="ac dg">두 집 사이</p>
<p class="ac dg">윤석규 ─ 2006년 부지 감정, 비보 요구 ─ 강도형 (비보를 지우고 이름을 기자에게 넘김)</p>
<p class="ac dg">윤병철 ─ 2006년 비보 삭제 품의서 기안 ─ 강도형 (소장 자리를 약속하고 지키지 않음)</p>
<p class="ac dg">윤세리 ─ 신사옥 설계 ─ 강도형 ─ 발주 ─ 민재경 (온담건축 설계2팀장, 세리의 상사)</p>
<p class="ac dg">윤세리 ─ 7.5도를 알아본 사람 ─ 강이현</p>
<p class="ac dg">현묵 ─ 시험과 협박 ─ 윤세리</p>
<h2 class="ep" data-n="1"><span class="en">제1회</span> <span class="et">「이 자리에 세우면」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">흙바닥에 놓인 패철(풍수가의 나침반). 바늘이 멈추지 않고 돈다. 주름진 손이 패철을 덮는다.</p>
<div class="dl" data-name="윤석규"><div class="nm">윤석규</div><div class="tx"><p class="pa">(V.O.)</p><p class="ln">이 자리에 세우믄 사람이 죽습니더.</p></div></div>
<p class="no">〔컷 - 바늘 소리가 끊기며 S#1으로〕</p>
<h3 class="sc">S#1. 공터 / 2006년, 낮</h3>
<p class="ac">자막: 2006년</p>
<p class="ac">측량 말뚝이 줄지어 박힌 공터. <b>윤석규</b>(74, 낡은 점퍼)가 무릎을 꿇고 패철을 땅에 내려놓았다. 뒤에 <b>강도형</b>(48, 강산그룹 부회장), 우산을 든 젊은 <b>현묵</b>(43).</p>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">첫 삽 뜰 날 받았고, 땅값 치렀소. 선생은 건물을 어느 쪽으로 앉힐지만 잡아 주시오.</p></div></div>
<div class="dl" data-name="윤석규"><div class="nm">윤석규</div><div class="tx"><p class="pa">(패철에서 눈을 떼지 않고)</p><p class="ln">이 자리에 세우믄 사람이 죽습니더.</p></div></div>
<p class="ac">강도형, 대답 대신 현묵에게서 우산을 받아 든다.</p>
<p class="no">〔VFX: 윤석규의 시선 - 흙 속으로 검은 물줄기 두 갈래가 들어와 X자로 엇갈린다. 이후 「수맥」 표현의 원형〕</p>
<h3 class="sc">S#2. 휴대전화 화면 (INSERT) / 2026년, 아침</h3>
<p class="ac">뉴스 속보. 유리 커튼월 고층 건물, 외벽 한 칸이 비어 있다. 바닥에 폴리스 라인.</p>
<div class="dl" data-name="앵커"><div class="nm">앵커</div><div class="tx"><p class="pa">(V.O.)</p><p class="ln">강산그룹 본사 외벽 유리가 떨어져 행인이 숨졌습니다. 2007년 상량식 날 지하 램프가 내려앉아 세 명이 숨진 뒤 두 번째 사망 사고입니다. 당시 검찰은 하청 현장소장 한 명을 기소했고, 그룹 임직원은 아무도 처벌받지 않았습니다.</p></div></div>

<p class="ac"><b>윤세리</b>(28)가 새 사원증을 목에 건다. 팀장 <b>민재경</b>(41)이 모니터를 돌린다.</p>

<p class="no">〔VFX: 세리의 시선 - 깃발 아래로 검은 물줄기 두 갈래가 X자로 엇갈린다. 1회 S#1 공터와 같은 모양〕</p>

<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">……그러네요.</p></div></div>

<p class="ac">설명회가 끝나고 팀들이 흩어진다. 현묵이 회장 차 쪽으로 걸어가다 세리 옆을 지난다. 걸음을 늦추지 않는다.</p>

<h2 class="ep" data-n="3"><span class="en">제3회</span> <span class="et">「수맥 위의 의자」</span></h2>

<div class="dl" data-name="민재경"><div class="nm">민재경</div><div class="tx"><p class="ln">발주처에서 지침 하나 더 내려왔다. 회장실은 이 좌표 위에 앉혀라. 회장님 지관, 그 풍수 보는 영감이 짚은 자리란다. 코어랑 정면으로 부딪치는데, 이걸 어쩌라고.</p></div></div>

<h3 class="sc">S#3. 강산그룹 구사옥 회장실 / 밤</h3>
<p class="ac">창밖으로 폴리스 라인이 아직 남아 있다. 강도형이 세 설계사무소의 참가 서류를 넘긴다. 현묵은 창가에 서 있다.</p>

<p class="ac">강도형, 창가에 등을 돌리고 선 현묵을 한 번 본다. 현묵은 돌아보지 않는다.</p>

<h2 class="ep" data-n="4"><span class="en">제4회</span> <span class="et">「청룡」</span></h2>
<h3 class="sc">S#1. 한강 둔치 벤치 / 이른 아침</h3>
<p class="ac">현묵과 세리가 한 사람 몫을 띄우고 앉아 있다. 서로 보지 않는다.</p>

<div class="dl" data-name="현묵"><div class="nm">현묵</div><div class="tx"><p class="ln">돕긴 누가 도와. 받을 게 있응께 온 거제.</p></div></div>

<p class="ac">현묵이 둑길로 올라간다. 둑길 위에 검은 차 한 대가 서 있다. 현묵이 다가가자 뒷좌석 창이 손가락 두 마디만큼 내려온다. 태블릿을 쥔 손 하나가 보인다. 손만.</p>

<p class="ac">세리, 휴대전화로 검색한다. 기사 한 줄 - 「강산 장남 강이현 상무, 신사옥 TF장 맡아」. 사진 속 이현은 웃지 않는다.</p>

<h3 class="sc">S#2. 온담건축 설계2팀 / 낮</h3>
<p class="ac">발주처 중간 점검. 이현과 TF 직원 둘. 민재경이 화면을 넘긴다.</p>
<div class="dl" data-name="민재경"><div class="nm">민재경</div><div class="tx"><p class="ln">배치 축은 한강 조망 따라 정남에서 7.5도 틀었고요. 여기까진 지난 보고 그대롭니다.</p></div></div>
<p class="ac">이현, 수첩에 숫자를 적어 계산한다. 볼펜이 멈춘다.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">교각 사이로 조망을 열면 12도가 나와요. 어제 제가 재 봤는데요. 7.5는 어디서 나온 숫자죠.</p></div></div>
<p class="ac">민재경이 세리를 본다.</p>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">저층부 일조 때문입니다.</p></div></div>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">일조면 반대로 돌려야죠. 북서로.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">그쪽으로 돌리면 뒤 능선을 3미터 더 깎습니다. 깎는 흙 양은 12쪽입니다.</p></div></div>
<p class="ac">이현, 12쪽을 넘긴다. 말이 없다. 다음 장, 단면도. 꼭대기 층 회장실.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">회장실은 지침대로네요.</p></div></div>
<p class="ac">이현, 세리를 한 번 본다.</p>
<h3 class="sc">S#3. 복도, 엘리베이터 앞 / 낮</h3>
<p class="ac">점검이 끝나고 TF 직원들은 계단으로 먼저 내려간다. 엘리베이터를 기다리던 이현이 돌아선다. 세리와 둘.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">7.5도. 24방위 한 칸이 15도니까, 딱 두 방위 사이 금이죠. 옛날 사람들은 거기를 공망이라고 불렀다던데요. 어느 방위 복도 안 드는 빈자리.</p></div></div>
<p class="ac">세리, 표정이 없다.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">누구한테 배웠어요, 이 각도.</p></div></div>
<p class="no">〔엔드컷: 엘리베이터가 도착해 문이 열린 채 기다린다. 이현은 타지 않는다. 문이 혼자 닫힌다. 컷 아웃.〕</p>
<h2 class="ep" data-n="5"><span class="en">제5회</span> <span class="et">「비보」</span></h2>
<h3 class="sc">S#1. 복도 / 낮 (이어서)</h3>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">할아버지요. 지관이셨어요.</p></div></div>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">지금도 하세요?</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">돌아가셨습니다.</p></div></div>
<p class="ac">이현, 엘리베이터 버튼을 다시 누른다.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">내일 아홉 시에 구사옥 지하 안전진단이 있어요. 같이 가죠. 눈이 하나 더 필요해서요.</p></div></div>
<h3 class="sc">S#2. 온담건축 설계2팀 / 밤</h3>
<p class="ac">세리가 진입 동선을 그린다. 큰길에서 정문까지 한 줄로 곧게.</p>
<div class="dl" data-name="민재경"><div class="nm">민재경</div><div class="tx"><p class="pa">(지나가다 화면을 보고)</p><p class="ln">오, 의전 동선 시원하다. 회장님들 이런 거 환장해. 차에서 내려서 정문까지 한 번도 안 꺾이는 거.</p></div></div>
<p class="no">〔VFX: 세리의 시선 - 도면 위 곧은 진입로가 활시위를 떠난 화살의 궤적으로 겹쳐 정문 한가운데에 꽂힌다〕</p>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="pa">(작게)</p><p class="ln">……정문을 찌르네요.</p></div></div>
<div class="dl" data-name="민재경"><div class="nm">민재경</div><div class="tx"><p class="ln">응?</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">아닙니다.</p></div></div>
<p class="ac">세리, 오른손을 책상 아래로 내려 쥔다.</p>
<h3 class="sc">S#3. 이현의 차 안 / 낮</h3>
<p class="ac">다음 날. 이현이 운전한다. 조수석의 세리는 무릎 위에 구사옥 도면철을 올려놓았다. 라디오는 꺼져 있다.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">할아버지 감정, 틀린 적 있어요?</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">한 번도 없다고 하셨어요.</p></div></div>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">본인 말씀으로요?</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">네.</p></div></div>
<p class="ac">이현, 웃음 비슷한 숨을 내쉰다. 앞유리 너머로 유리 한 칸이 비어 있는 강산 본사가 다가온다.</p>
<h3 class="sc">S#4. 구사옥 지하 2층, 진입 램프 / 낮</h3>
<p class="ac">빈 주차장. 기둥마다 균열 조사 번호 스프레이. 지하 2층은 사고 뒤 폐쇄됐다. 이현이 손전등을 들고 앞서 걷는다.</p>
<p class="ac">램프 중간 기둥 하나에 마른 국화 한 다발이 끈으로 묶여 있다. 이현, 그 기둥을 보지 않고 지나간다.</p>
<p class="ac">세리가 걸음을 멈추고 패철을 꺼낸다. 바늘이 떨다가 램프 옹벽 한쪽을 가리켜 멈춘다.</p>
<p class="ac">세리, 옹벽에 손을 댄다. 콘크리트 이음매가 갈라져 있다. 휴대전화 불빛을 틈에 들이댄다.</p>
<p class="no">〔엔드컷: 갈라진 콘크리트 안쪽, 돌에 새긴 두 글자 「裨補」(비보, 모자란 땅을 메운다는 뜻). 그 아래 붉은 낙관 「石圭」. 세리의 입술이 소리 없이 움직인다 - 할아버지. 컷 아웃.〕</p>
<h2 class="ep" data-n="6"><span class="en">제6회</span> <span class="et">「소방차 회전반경」</span></h2>
<h3 class="sc">S#1. 구사옥 램프 / 낮 (이어서)</h3>
<p class="ac">이현이 돌아온다. 세리가 손바닥으로 틈을 가린다.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">뭐 있어요?</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">철근이 나왔네요. 피복이 얕아요.</p></div></div>
<p class="ac">이현, 손전등을 국화 묶인 기둥 쪽으로 잠깐 돌렸다가 내린다.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">2007년 상량식 날, 여기가 내려앉았어요. 셋이 죽었어요. 하나는 우리 엄마고.</p></div></div>
<p class="ac">세리, 틈을 가린 손을 내리지 않는다.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">아버지는 다음 날 지관 탓을 했어요. 난 열다섯이었고. 그 말 그대로 믿었죠, 한참.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">지금은요.</p></div></div>
<p class="ac">이현, 대답 대신 기둥의 끈을 고쳐 묶는다. 국화 잎이 바스러져 바닥에 떨어진다.</p>
<p class="ac">기둥 아래, 마른 다발과 따로 흰 국화 한 송이가 놓여 있다. 아직 마르지 않았다.</p>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">……누가 왔다 갔네요.</p></div></div>
<p class="ac">이현은 그 한 송이를 집지 않는다. 손전등을 끈다.</p>
<h3 class="sc">S#2. 온담건축 설계2팀 / 밤</h3>
<p class="ac">민재경의 화면에 소방 협의 회신. 「동측 진입로 소방차 회전반경 미달」.</p>
<div class="dl" data-name="민재경"><div class="nm">민재경</div><div class="tx"><p class="ln">능선을 깎든가, 진입을 서쪽으로 돌리든가. 둘 중 하나 골라, 오늘 안에.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">서쪽은 경사 18퍼센트라 소방차가 못 올라갑니다. 동쪽을 깎죠.</p></div></div>
<div class="dl" data-name="민재경"><div class="nm">민재경</div><div class="tx"><p class="ln">그래, 깎자. 물량 오늘 안에 넘겨. 견적팀 김 차장이 나만 보면 한숨부터 쉬어.</p></div></div>
<p class="ac">세리, 능선 시작점에 커서를 대고 멈춘다. 휴대전화에 문자. 강이현: 「오늘 고마웠어요. 철근 건은 보고서 7항에 넣을게요.」</p>
<p class="ac">세리, 휴대전화를 엎어 놓는다. 동쪽 능선을 따라 깎아 낼 선을 긋는다.</p>
<p class="no">〔VFX: 세리의 시선 - 동쪽 능선에 길게 누운 푸른 용의 옆구리가 그 선을 따라 소리 없이 갈라진다. 용이 고개를 돌려 세리 쪽을 본다〕</p>
<p class="ac">세리, 손을 편다. 생명선이 두 마디 더 짧아져 있다.</p>
<h3 class="sc">S#3. 세리의 집, 부엌 / 새벽</h3>
<p class="ac">식탁 위에 반쯤 남은 밥그릇. 병철의 의자가 뒤로 밀려 있다. 세리의 휴대전화가 진동한다.</p>
<div class="dl" data-name="간호사"><div class="nm">간호사</div><div class="tx"><p class="pa">(F)</p><p class="ln">윤병철 환자분 보호자 맞으세요? 강산의료원 응급실인데요. 지금 오실 수 있으세요?</p></div></div>
<p class="no">〔엔드컷: 식탁 위 병철의 약병. 뚜껑이 열려 있고 비어 있다. 컷 아웃.〕</p>
<h2 class="ep" data-n="7"><span class="en">제7회</span> <span class="et">「맥을 끊다」</span></h2>
<h3 class="sc">S#1. 강산의료원 복도 / 낮</h3>
<p class="ac">휴대전화 화면. 발신번호 표시 제한, 문자 한 줄.</p>
<p class="ac">「청룡, 잘 깎았다.」</p>
<p class="ac">세리가 화면을 끄려는 순간, 한 줄이 더 온다.</p>
<p class="ac">「아버지 심장은 좀 어떠시고.」</p>
<p class="ac">화면을 쥔 세리. 자판기 앞, 동전을 넣다 만 손. 자판기에서 캔이 떨어진다. 세리는 꺼내지 않는다.</p>
<h3 class="sc">S#2. 강산의료원 병실 / 낮</h3>
<p class="ac">병철이 코에 산소줄을 꽂고 누워 있다. 흉부외과 <b>의사</b>가 차트를 넘긴다.</p>
<div class="dl" data-name="의사"><div class="nm">의사</div><div class="tx"><p class="ln">관상동맥 세 개가 다 좁아요. 스텐트로는 안 되고, 우회술 가야 합니다.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">언제요.</p></div></div>
<div class="dl" data-name="의사"><div class="nm">의사</div><div class="tx"><p class="ln">지금은 심장이 수술을 못 버텨요. 약으로 두 달 올리고 날 잡읍시다.</p></div></div>
<p class="ac">의사가 나간다. 병철이 입원 약정서에 서명한다. 「철」의 마지막 획이 칸 밖으로 길게 내려간다.</p>
<p class="ac">병실 창밖으로 한강, 그 너머 옥녀봉이 작게 보인다.</p>
<h3 class="sc">S#3. 병실 / 밤</h3>
<p class="ac">병철이 잠들어 있다. 보호자 의자의 세리, 무릎 위 노트북. 코어 블록을 끌어 언덕마루로 옮긴다. 산에서 내려온 빛의 줄기가 고이는 자리 바로 뒤, 줄기가 들어오는 목.</p>
<p class="ac">휴대전화에 민재경의 메시지: 「코어 위치 좋다!! 암반 2.4미터. 기초비 줄겠네. 견적팀한테 자랑 좀 하자.」</p>
<p class="no">〔VFX: 코어 기둥이 언덕마루에 박히는 순간, 비탈을 내려오던 빛의 줄기가 코어 앞에서 끊겨 사방으로 흩어진다〕</p>
<p class="ac">세리, 노트북을 받친 손을 편다. 또 한 마디.</p>
<h3 class="sc">S#4. 병실 / 밤</h3>
<p class="ac">병철이 눈을 뜬다. 고개를 돌려 화면을 본다. 위성사진, 강 굽이, 봉우리 하나.</p>
<div class="dl" data-name="병철"><div class="nm">병철</div><div class="tx"><p class="ln">옥녀봉이네, 저거.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">아세요?</p></div></div>
<p class="ac">병철, 손을 뻗어 노트북을 덮는다.</p>
<div class="dl" data-name="병철"><div class="nm">병철</div><div class="tx"><p class="ln">그 땅은 그리지 마라.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">일이에요.</p></div></div>
<div class="dl" data-name="병철"><div class="nm">병철</div><div class="tx"><p class="ln">딴 일 해라.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">아빠는 택시 하면서 강산 근처는 손님 있어도 안 갔잖아요. 왜요?</p></div></div>
<p class="ac">병철, 오래 숨을 쉰다. 산소줄이 흔들린다.</p>
<div class="dl" data-name="병철"><div class="nm">병철</div><div class="tx"><p class="ln">내 강산에서 일했다. 니 할배 감정 받을 때.</p></div></div>
<p class="no">〔엔드컷: 덮인 노트북 틈으로 화면 빛이 샌다. 병철은 천장을 본다. 컷 아웃.〕</p>
<h2 class="ep" data-n="8"><span class="en">제8회</span> <span class="et">「거문고」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">노을 속, 산 위에 길고 낮은 상자의 윤곽.</p>
<p class="no">〔컷 - S#1으로〕</p>
<h3 class="sc">S#1. 온담건축 설계2팀 / 낮</h3>
<p class="ac">모형 테이블. 사원이 매스 모형에 지붕을 붙인다. 길고 낮은 몸통, 한쪽 끝으로 내려가는 지붕.</p>
<div class="dl" data-name="민재경"><div class="nm">민재경</div><div class="tx"><p class="ln">매스 설명, 한 줄로. 심사위원 집중력은 삼십 초야.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">옥녀봉은 옥녀가 거문고를 타는 형국입니다. 건물이 거문고고, 입면 루버가 줄입니다.</p></div></div>
<div class="dl" data-name="민재경"><div class="nm">민재경</div><div class="tx"><p class="pa">(모형을 한 바퀴 돌며)</p><p class="ln">지관이 좋아하겠다. 난 모르겠고.</p></div></div>
<h3 class="sc">S#2. 강산그룹 대회의실 / 낮</h3>

<p class="no">〔엔드컷: 지우개 가루를 털어 낸 자리에서 연필선이 종이 안쪽부터 배어 나오듯 다시 진해진다. 컷 아웃.〕</p>
<h2 class="ep" data-n="13"><span class="en">제13회</span> <span class="et">「2차 심사」</span></h2>
<h3 class="sc">S#0. 미리보기 (2초)</h3>
<p class="ac">모형 지붕 위에 패철이 놓인다. 바늘이 돈다.</p>
<p class="no">〔컷 - S#1으로〕</p>
<h3 class="sc">S#1. 강산그룹 대회의실 / 낮</h3>
<p class="ac">긴 테이블. 강도형, 이현, 강산건설 사장 <b>강이서</b>(31), 외부 심사위원 셋. 현묵은 벽 쪽 의자에 앉아 있다. 테이블 가운데 거문고 매스 모형. 세리가 리모컨을 쥔다.</p>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">옥녀봉의 기운은 북쪽 산에서 내려와 이 언덕마루에 고입니다. 건물은 산을 등지고 강을 봅니다.</p></div></div>
<div class="dl" data-name="외부 심사위원"><div class="nm">외부 심사위원</div><div class="tx"><p class="ln">코어를 언덕마루에 박으셨네. 암반이 얕으니 기초는 싸게 먹히겠고.</p></div></div>
<div class="dl" data-name="강이서"><div class="nm">강이서</div><div class="tx"><p class="ln">근데 총공사비는 상대 안보다 6퍼센트 높아요. 기초에서 아끼고 절토에서 다 까먹었어요.</p></div></div>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">진입로 절토는 중간 점검 때 제가 승인했습니다. 소방 협의 사항이라 못 줄여요.</p></div></div>
<p class="ac">강도형이 지팡이로 바닥을 한 번 짚는다. 모두 입을 다문다.</p>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">윤 대리라고 했나. 자네는 풍수를 믿나.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">땅은 그은 대로 사람을 앉힌다고 배웠습니다.</p></div></div>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">누구한테.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">제 도면을 처음 본 사람한테요.</p></div></div>
<p class="ac">강도형, 모형의 꼭대기 층을 손가락으로 쓸어 본다. 회장실 자리.</p>
<h3 class="sc">S#2. 대회의실 / 낮</h3>
<p class="ac">강도형이 현묵을 본다.</p>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">지관 의견.</p></div></div>
<p class="ac">현묵이 일어나 모형 앞으로 온다. 패철을 모형 지붕 위에 올려놓는다. 바늘이 멈출 때까지 기다린다.</p>
<div class="dl" data-name="현묵"><div class="nm">현묵</div><div class="tx"><p class="ln">앉힌 방향 좋습니다. 회장님 자리, 더 좋지요.</p></div></div>
<p class="ac">현묵이 손가락으로 모형의 동쪽 절토면을 짚는다.</p>
<div class="dl" data-name="현묵"><div class="nm">현묵</div><div class="tx"><p class="ln">한 군데. 청룡이 잘렸습니다. 맏아들을 치는 배치올시다.</p></div></div>
<p class="ac">회의실이 조용해진다. 강이서가 펜을 내려놓는다.</p>
<div class="dl" data-name="현묵"><div class="nm">현묵</div><div class="tx"><p class="ln">이 능선 깎는 선은 TF장께서 승인하셨지요.</p></div></div>
<p class="no">〔엔드컷: 강도형이 천천히 고개를 돌려 이현을 본다. 이현은 세리 쪽을 보지 않는다. 컷 아웃.〕</p>
<h2 class="ep" data-n="14"><span class="en">제14회</span> <span class="et">「표석」</span></h2>
<h3 class="sc">S#1. 대회의실 앞 복도 / 낮</h3>
<p class="ac">TF 직원이 이현 앞에 손을 내민다.</p>
<div class="dl" data-name="TF 직원"><div class="nm">TF 직원</div><div class="tx"><p class="ln">회장님 지시입니다. TF는 오늘부로 강이서 사장님이 맡으십니다. 출입증은 제가 회수하겠습니다.</p></div></div>
<p class="ac">이현이 목에 건 출입증을 벗어 준다. 직원이 간다. 세리가 이현 앞에 선다.</p>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">제 선입니다.</p></div></div>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">알아요.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">그 자리에서 말씀하셨어야죠.</p></div></div>
<div class="dl" data-name="이현"><div class="nm">이현</div><div class="tx"><p class="ln">그럼 대리님이 빠지잖아요. 그 안, 끝까지 가요. 삽 뜨는 날까지.</p></div></div>
<p class="ac">이현이 엘리베이터에 탄다. 문이 닫힌다.</p>
<p class="ac">복도 끝 유리문 너머. 현묵이 회장 차를 지나쳐 뒤에 선 검은 차에 오른다. 창이 짙어 안이 보이지 않는다.</p>
<p class="ac">세리, 그 차가 떠날 때까지 본다.</p>
<h3 class="sc">S#2. 구사옥 지하 진입로 폐쇄 가림막 / 밤</h3>
<p class="ac">세리가 공구 가방을 메고 가림막 앞에 선다. 손바닥을 편다. 생명선이 손바닥 가운데에서 멈춰 있다. 주먹을 쥐고, 가림막 틈으로 들어간다.</p>
<h3 class="sc">S#3. 구사옥 지하 램프 / 밤</h3>
<p class="ac">세리가 정과 망치로 옹벽 틈을 넓힌다. 콘크리트 조각이 떨어지고 표석 윗면이 드러난다. 「裨補」. 그 아래로 작은 글씨가 몇 줄 더 있다.</p>
<p class="ac">세리가 휴대전화 불빛을 비추려는 순간, 램프 위쪽에서 지팡이 소리가 내려온다. 한 걸음씩.</p>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">그 돌, 내가 덮으라 했어.</p></div></div>
<p class="ac">세리, 정을 쥔 채 돌아선다. 강도형이 국화 묶인 기둥 앞에서 멈춘다. 기울어진 꽃다발을 손끝으로 바로 세운다.</p>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="pa">(꽃을 보며)</p><p class="ln">윤 선생 손녀.</p></div></div>
<p class="no">〔엔드컷: 세리의 손에서 정이 미끄러져 바닥에 떨어진다. 쇳소리가 램프를 따라 길게 울린다. 컷 아웃.〕</p>
<h2 class="ep" data-n="15"><span class="en">제15회</span> <span class="et">「길일」</span></h2>
<h3 class="sc">S#1. 구사옥 지하 램프 / 밤 (이어서)</h3>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">명단 첫날 봤네. 윤세리. 윤 선생이 마당에서 부르던 이름이야.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">그런데 왜 두셨습니까.</p></div></div>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">흉한 자리 그릴 줄 아는 손이 명당도 그리는 법이야.</p></div></div>
<p class="ac">강도형, 지팡이 끝으로 표석을 두 번 두드린다.</p>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">자네 할아버지는 끝까지 안 그려 줬지.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">그려 드렸습니다. 회장님이 지우셨죠.</p></div></div>
<p class="ac">강도형, 잠깐 말이 없다.</p>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">그래서 이번엔 안 지워. 자네가 그은 선은 한 줄도.</p></div></div>
<div class="dl" data-name="세리"><div class="nm">세리</div><div class="tx"><p class="ln">청룡이 잘린 안입니다.</p></div></div>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="ln">그래서 아들을 뺐지. 없는 놈은 안 맞아.</p></div></div>
<p class="ac">강도형이 램프를 올라간다. 지팡이 소리가 멀어진다.</p>
<div class="dl" data-name="강도형"><div class="nm">강도형</div><div class="tx"><p class="pa">(돌아보지 않고)</p><p class="ln">결과는 내일 나가네.</p></div></div>
<h3 class="sc">S#2. 온담건축 설계2팀 / 낮</h3>
<p class="ac">팀원들이 한 모니터 앞에 모여 있다. 메일 제목: 「강산그룹 신사옥 지명설계공모 심사 결과 안내」. 본문 첫 줄 - 당선: 온담건축사사무소.</p>
<p class="ac">박수. 민재경이 세리의 어깨를 잡는다.</p>
<div class="dl" data-name="민재경"><div class="nm">민재경</div><div class="tx"><p class="ln">윤 대리! 네 배치가 이긴 거야, 이거. 야, 다들 들었지?</p></div></div>
<p class="ac">세리, 고개만 숙인다. 책상 아래에서 손바닥을 편다. 생명선은 손바닥 가운데에서 멈춰 있다.</p>
<p class="ac">휴대전화에 메시지 한 줄. 강이현: 「축하해요. 아버지가 대리님 이름을 두 번 불렀어요.」</p>
<p class="ac">세리, 답장을 쓰다가 지운다.</p>
<h3 class="sc">S#3. 온담건축 비상계단 / 낮</h3>
<p class="ac">세리가 혼자 계단참에 앉는다. 휴대전화가 연달아 두 번 진동한다.</p>
<p class="ac">첫 번째. 강산의료원: 「윤병철 님 관상동맥우회술 일정이 확정되었습니다. 11월 3일 오전 9시.」</p>
<p class="ac">두 번째. 강산그룹: 「신사옥 부지 개토제(첫 삽)에 모십니다. 날짜는 현묵 선생이 잡으셨습니다. 11월 3일 오전 11시.」</p>
<div class="dl" data-name="병철"><div class="nm">병철</div><div class="tx"><p class="pa">(V.O.)</p><p class="ln">첫 삽 뜨던 그 시각에.</p></div></div>
<p class="no">〔엔드컷: 두 알림이 화면에 위아래로 겹쳐 있다. 같은 날짜 두 줄. 세리의 엄지가 그 사이에서 멈춘다. 컷 아웃.〕</p>

<script>
(function () {

  function setVars(el, d) {

    s.setProperty("--pb", d.pb + "px"); s.setProperty("--px", d.px + "px"); s.setProperty("--fs", d.fs + "px");
  }

  /* ================= pagination ================= */
  function lineStarts(p) {
    var w = D.createTreeWalker(p, NodeFilter.SHOW_TEXT), n, off = 0, res = [], r = D.createRange();
    while ((n = w.nextNode())) {
      var s = n.data;
      for (var i = 0; i < s.length; i++) {
        var ch = s.charCodeAt(i);
        if (ch === 32 || ch === 10 || ch === 9 || ch === 13 || ch === 160) continue;
        r.setStart(n, i); r.setEnd(n, i + 1);

        if (!last || b.top > last.top + 2) res.push({ off: off + i, top: b.top, bottom: b.bottom });
        else if (b.bottom > last.bottom) last.bottom = b.bottom;
      }
      off += s.length;
    }
    return res;
  }
  /* split element p at a text offset; inline markup that straddles the cut is cloned on both sides */
  function cutAt(p, off) {

    while ((n = w.nextNode())) {
      if (acc + n.data.length > off) { tn = n; ti = off - acc; break; }
      acc += n.data.length;
    }
    var r = D.createRange(), h = p.cloneNode(false), t = p.cloneNode(false);
    r.setStart(p, 0); r.setEnd(tn, ti); h.appendChild(r.cloneContents());
    r.setStart(tn, ti); r.setEnd(p, p.childNodes.length); t.appendChild(r.cloneContents());
    t.classList.add("cn");

  }
  function contName(dl) {
    var nm = div("nm"), a = D.createElement("span"), b = D.createElement("span");
    a.className = "x"; a.textContent = dl.getAttribute("data-name");
    b.className = "x ct"; b.textContent = "(계속)";
    nm.appendChild(a); nm.appendChild(b);
    return nm;
  }

  function paginate(dk) {
    var d = DES[dk];
    setVars(meas, d);
    meas.innerHTML = '<div class="pg paper r"><div class="hd"><span>명당</span><span>제1회</span></div><div class="bd"></div><div class="ft">1</div></div>';
    var body = meas.querySelector(".bd"), limit = body.clientHeight, out = [], ep = 0, cur;
    function top0() { return body.getBoundingClientRect().top; }
    function limAbs() { return top0() + limit + 0.5; }
    function fits() { var l = body.lastElementChild; return !l || l.getBoundingClientRect().bottom <= limAbs(); }
    function fresh() { cur = { kind: "text", ep: ep }; }

      while (body.firstChild) ns.push(body.removeChild(body.firstChild));

    }
    function tryHead(h) { body.appendChild(h); var ok = fits(); body.removeChild(h); return ok; }
    /* action and notes: at least two lines on each side, otherwise the paragraph moves whole */
    function splitTop(node) {
      body.appendChild(node);
      var lines = lineStarts(node), L = lines.length, lim = limAbs(), m = 0;
      for (var i = 0; i < L; i++) if (lines[i].bottom <= lim) m = i + 1;
      body.removeChild(node);
      if (L < 4) return null;
      for (m = Math.min(m, L - 2); m >= 2; m--) {
        var pr = cutAt(node, lines[m].off);
        if (tryHead(pr[0])) return pr;
      }
      return null;
    }
    /* dialogue: the cue never leaves without its first spoken line; any part keeps one line or more */
    function splitDl(node) {
      body.appendChild(node);
      var lim = limAbs(), kids = Array.prototype.slice.call(node.querySelector(".tx").children), first = !node.hasAttribute("data-c");
      var all = kids.map(lineStarts), fl = 0, k0 = 0, m0 = 0, i;
      for (i = 0; i < kids.length; i++) if (!kids[i].classList.contains("pa")) { fl = i; break; }

      body.removeChild(node);
      if (k0 >= kids.length) return null;
      for (i = 0; i < all[k0].length; i++) if (all[k0][i].bottom <= lim) m0 = i + 1;
      for (var k = k0; k >= 0; k--) {
        var len = all[k].length, mStart = k === k0 ? Math.min(m0, len - 1) : len - 1;

          h.appendChild(node.querySelector(".nm").cloneNode(true));
          for (j = 0; j < k; j++) htx.appendChild(kids[j].cloneNode(true));
          if (m > 0) { var pr = cutAt(kids[k], all[k][m].off); htx.appendChild(pr[0]); ttx.appendChild(pr[1]); }
          else ttx.appendChild(kids[k].cloneNode(true));
          for (j = k + 1; j < kids.length; j++) ttx.appendChild(kids[j].cloneNode(true));
          h.appendChild(htx);
          t.setAttribute("data-c", "1"); t.appendChild(contName(node)); t.appendChild(ttx);
          if (tryHead(h)) return [h, t];
        }
      }
      return null;
    }
    function isHead(e) { return e && (e.classList.contains("sc") || e.classList.contains("ep")); }
    function place(node) {
      for (var guard = 0; guard < 60; guard++) {
        body.appendChild(node);
        if (fits()) return;
        body.removeChild(node);

        if (sp) { body.appendChild(sp[0]); flush(); node = sp[1]; continue; }
        if (!body.firstChild) { body.appendChild(node); flush(); return; }

  /* ================= views ================= */

  function viewOf(i) {

  /* test hook */
  WIN.__royal = {
    get ready() { return ready; }, get mode() { return S.mode; }, get design() { return S.dk; }, get scale() { return S.sc; },
    get view() { return S.v; }, get viewCount() { return S.views.length; }, get pageCount() { return S.book.pages.length; },
    get contentCount() { return S.book.cc; },
    views: function () { return S.views.slice(); },
    pages: function () { return S.book.pages.map(function (p, i) { return { i: i, kind: p.kind, ep: p.ep || 0, folio: p.folio || 0, u: p.u }; }); },
    epStart: function () { return JSON.parse(JSON.stringify(S.book.epStart)); },
    viewOf: viewOf, renderPage: renderPage, go: jump, turn: turn, busy: busy,
    unitCount: UNITS.length
  };
})();
