<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<style>
/* 토리노 세 갈래 — 「파리 답사 수첩」의 지면을 이어받는다
   오프화이트 지면 · 순흑 잉크 · 헤어라인 · 답사(손으로 재는 칸)는 노랑
   안 구분: 1안 하늘 · 2안 민트 · 3안 노랑 (파리 수첩의 세 칠을 그대로 빌림) */
:root{
  --paper:#f6f5f0; --card:#fffefa; --ink:#12120f; --mute:#5c5b54; --hair:#d6d4cc; --rule:#12120f;
  --gy:#e7e6e0; --gy2:#cfcdc4; --chip:#12120f;
  --o1:#c9e6f2; --o2:#a8efc6; --o3:#f2f06a;
  --warn:#a8341c; --ok:#17744a;
  --r:"YDIYGO320","-윤고딕320","Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  --b:"YDIYGO330","-윤고딕330",var(--r);
  --h:"YDIYGO350","-윤고딕350",var(--r);
  --n:"Helvetica Neue",Helvetica,Arial,var(--r);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1d1d1b; --card:#262624; --ink:#ecebe6; --mute:#b6b4ac; --hair:#3a3a36; --rule:#ecebe6;
    --gy:#31312d; --gy2:#4a4a45; --warn:#f0917a; --ok:#7fd6a4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1d1d1b; --card:#262624; --ink:#ecebe6; --mute:#b6b4ac; --hair:#3a3a36; --rule:#ecebe6;
  --gy:#31312d; --gy2:#4a4a45; --warn:#f0917a; --ok:#7fd6a4; color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--r);font-size:15px;line-height:24px;word-break:keep-all;overflow-wrap:anywhere}
.row,.sec,.citybar{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 110px)}
b,strong{font-family:var(--b);font-weight:400}
button{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.n{font-family:var(--n);font-variant-numeric:tabular-nums}

/* 고정 머리 · 탭 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);
  margin-inline:-16px;padding-inline:16px;height:48px;display:flex;align-items:center;gap:10px}
.top .t{font-family:var(--h);font-size:16px;white-space:nowrap}
.top .s{font-family:var(--n);font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.themebtn{margin-left:auto;flex:0 0 auto;appearance:none;border:1px solid var(--hair);background:transparent;border-radius:999px;
  padding:2px 11px;font-size:12px;line-height:18px;color:var(--mute);cursor:pointer}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:29;background:var(--paper);border-bottom:1px solid var(--hair);
  margin-inline:-16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;appearance:none;border:1px solid var(--hair);background:transparent;color:var(--mute);
  border-radius:999px;padding:4px 13px;font-size:13px;line-height:19px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab .dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--chip)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] .dot{border-color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* 머리말 */
.mast{padding:26px 0 6px;max-width:760px}
.mast h1{font-family:var(--h);font-size:30px;line-height:37px;letter-spacing:-.01em;text-wrap:balance}
.mast p{color:var(--mute);font-size:14px;line-height:23px;margin-top:8px;max-width:62ch}
.k{font-family:var(--h);font-size:12px;line-height:18px;letter-spacing:.06em;color:var(--mute);
  border-top:1px solid var(--rule);padding-top:6px;margin:34px 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.k .c{font-family:var(--n);letter-spacing:0}
.lede{font-size:15px;line-height:25px;max-width:68ch}
.note{font-size:13px;line-height:21px;color:var(--mute);max-width:72ch}
.note b{color:var(--ink)}
p+p{margin-top:10px}

/* 칩 */
.chip{display:inline-block;font-family:var(--n);font-size:11px;line-height:17px;padding:1px 9px;border-radius:999px;background:var(--gy);color:var(--ink);white-space:nowrap}
.chip.o1{background:var(--o1);color:var(--chip)} .chip.o2{background:var(--o2);color:var(--chip)} .chip.o3{background:var(--o3);color:var(--chip)}
.chip.warn{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.chip.ok{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--hair);color:var(--mute)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px;border:1px solid var(--chip)}
.sw.o1{background:var(--o1)} .sw.o2{background:var(--o2)} .sw.o3{background:var(--o3)}

/* 표 */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--rule);margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px;line-height:20px}
th,td{text-align:left;vertical-align:top;padding:9px 10px 9px 0;border-bottom:1px solid var(--hair)}
th{font-family:var(--h);font-weight:400;font-size:11px;line-height:16px;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
td .sub{display:block;font-size:11px;line-height:17px;color:var(--mute)}
.tbl.wide table{min-width:1040px}
.tbl.wide table.fit{min-width:0}
.tbl.mid table{min-width:720px}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;background:var(--paper);z-index:1;padding-right:12px}
.num{font-family:var(--n);font-variant-numeric:tabular-nums;white-space:nowrap}
.rank{font-family:var(--n);font-size:20px;line-height:24px}

/* 요약 카드 줄 */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .hd{display:flex;align-items:center;gap:8px}
.card .nm{font-family:var(--h);font-size:17px;line-height:24px}
.card .big{font-family:var(--n);font-size:26px;line-height:30px;font-variant-numeric:tabular-nums}
.card .big small{font-size:12px;color:var(--mute);margin-left:4px}
.card .ln{font-size:13px;line-height:20px;color:var(--mute)}
.card .ln b{color:var(--ink)}
.card button{align-self:flex-start;margin-top:auto}

/* 버튼 */
.pill{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;
  padding:5px 13px;font-size:13px;line-height:19px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pill.dark{background:var(--ink);color:var(--paper)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.seg button{appearance:none;border:1px solid var(--hair);background:transparent;color:var(--mute);border-radius:999px;padding:4px 12px;font-size:13px;line-height:19px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-family:var(--b)}

/* 안 머리 */
.ohead{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start;padding-top:22px}
.ohead h1{font-family:var(--h);font-size:28px;line-height:35px;letter-spacing:-.01em;text-wrap:balance;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ohead .thesis{font-size:15px;line-height:25px;margin-top:8px;max-width:60ch}
.flights{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.fl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px;line-height:20px}
.fl .d{font-family:var(--n);color:var(--mute);font-size:12px}
.fl .w{font-family:var(--n);font-variant-numeric:tabular-nums}
.fl .v{display:block;color:var(--mute);font-size:12px;line-height:18px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* 타임라인 + 이야기 */
.ov{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;margin-top:6px}
.days{display:flex;gap:6px;margin:18px 0 6px;flex-wrap:wrap}
.row{width:100%;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:baseline;
  padding:10px 0;border:0;border-bottom:1px solid var(--hair);background:transparent;text-align:left;color:var(--ink)}
button.row{cursor:pointer}
button.row:hover .nm{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.row .t{font-family:var(--n);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.row .t i{display:block;font-style:normal;font-size:11px;opacity:.8}
.row .nm{font-family:var(--b);font-size:15px;line-height:22px}
.row .nm i{display:block;font-style:normal;font-family:var(--r);font-size:12px;line-height:18px;color:var(--mute)}
.row.move .nm,.row.fly .nm,.row.rest .nm{font-family:var(--r);font-size:14px;color:var(--mute)}
.row[aria-expanded="true"]{background:var(--card)}
.row .tag{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-self:start;align-items:flex-start;padding-top:2px;max-width:132px}
.row .tag .chip{flex:0 0 auto}
.chip.survey{background:var(--o3);color:var(--chip)}
.chip.story{background:transparent;box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--rule);padding-top:8px;margin-top:6px}
.dayhead b{font-family:var(--h);font-size:17px}
.dayhead span{font-size:12px;color:var(--mute)}
.panel{min-width:0}
.panel .empty{border:1px dashed var(--hair);border-radius:10px;padding:18px;color:var(--mute);font-size:13px;line-height:21px}
.story{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:16px 16px 12px}
.inl{padding:0 0 12px;border-bottom:1px solid var(--hair)}
.inl .story{border-radius:0 0 10px 10px;border-top:0}
.story .city{font-family:var(--n);font-size:11px;letter-spacing:.06em;color:var(--mute)}
.story h3{font-family:var(--h);font-size:20px;line-height:27px;margin-top:2px;text-wrap:balance}
.story .loc{font-size:12px;line-height:18px;color:var(--mute);margin-top:2px}
.story .refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.story .refs button{appearance:none;border:0;cursor:pointer}
.facets{margin-top:12px;display:flex;flex-direction:column}
.facet{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--hair)}
.facet .lb{font-family:var(--h);font-size:12px;line-height:22px;color:var(--mute)}
.facet .tx{font-size:14px;line-height:23px}
.facet.g .lb{color:var(--ink)}
.facet.g .tx{background:var(--o2);color:var(--chip);border-radius:6px;padding:4px 8px;margin:-4px -8px}
.src{margin-top:10px;font-size:11px;line-height:17px;color:var(--mute);overflow-wrap:anywhere}
.src a{color:var(--mute)}
.src li{list-style:none;margin-top:2px}
.unv{margin-top:8px;font-size:12px;line-height:19px;color:var(--warn)}
.close{appearance:none;border:0;background:transparent;color:var(--mute);font-size:12px;cursor:pointer;float:right;padding:2px 0 6px 10px}

/* 소논문 */
.essay{max-width:720px;margin-top:8px}
.essay h2{font-family:var(--h);font-size:26px;line-height:34px;letter-spacing:-.01em;text-wrap:balance;margin-top:18px}
.essay .by{font-size:12px;color:var(--mute);margin-top:6px}
.abs{margin-top:16px;background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:14px 16px}
.abs .lb{font-family:var(--h);font-size:11px;letter-spacing:.06em;color:var(--mute)}
.abs p{font-size:14px;line-height:23px;margin-top:4px}
.sec{margin-top:26px}
.sec h3{font-family:var(--h);font-size:18px;line-height:26px;text-wrap:balance;display:flex;gap:8px;align-items:baseline}
.sec h3 .no{font-family:var(--n);font-size:12px;color:var(--mute)}
.sec p{font-size:15px;line-height:27px;margin-top:10px}
.sec .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sec .links button{appearance:none;cursor:pointer;border:0}
.ref{margin-top:28px;border-top:1px solid var(--rule);padding-top:8px;font-size:11px;line-height:18px;color:var(--mute);overflow-wrap:anywhere}
.ref ol{padding-left:18px}
.ref a{color:var(--mute)}

/* 도표 */
.chart{margin-top:10px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:620px}
.chart text{font-family:var(--n);font-size:11px;fill:var(--mute)}
.chart .lab{fill:var(--ink);font-size:12px}
.chart .axis{stroke:var(--hair);stroke-width:1}
.chart .dayline{stroke:var(--rule);stroke-width:1}
.chart .k-air{fill:var(--mute)} .chart .k-sleep{fill:var(--gy)} .chart .k-home{fill:var(--gy)}
.chart .k-o1{fill:var(--o1)} .chart .k-o2{fill:var(--o2)} .chart .k-turin{fill:var(--o3)}
.chart .k-survey{fill:var(--o3);stroke:var(--ink);stroke-width:1.6}
.chart .k-bar1{fill:var(--ink)} .chart .k-bar2{fill:var(--gy2)} .chart .k-bar3{fill:var(--mute)}
.chart .cap{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3}
.chart .capt{fill:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
.lg-air{background:var(--mute)} .lg-sleep{background:var(--gy);box-shadow:inset 0 0 0 1px var(--hair)} .lg-o1{background:var(--o1)} .lg-o2{background:var(--o2)} .lg-turin{background:var(--o3)} .lg-survey{background:var(--o3);box-shadow:inset 0 0 0 1.6px var(--ink)}
.lg-bar1{background:var(--ink)} .lg-bar2{background:var(--gy2)} .lg-bar3{background:var(--mute)}

/* 파리 속도 */
.pace{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px}
.pace div{border-top:1px solid var(--hair);padding-top:8px}
.pace .v{font-family:var(--n);font-size:24px;line-height:30px;font-variant-numeric:tabular-nums}
.pace .l{font-size:12px;line-height:19px;color:var(--mute)}

/* 추천 */
.verdict{margin-top:18px;background:var(--o3);color:var(--chip);border-radius:12px;padding:18px 18px 16px;max-width:760px}
.verdict .lb{font-family:var(--h);font-size:12px;letter-spacing:.06em}
.verdict h2{font-family:var(--h);font-size:24px;line-height:32px;margin-top:4px;text-wrap:balance}
.verdict p{font-size:14px;line-height:23px;margin-top:8px}
.steps{counter-reset:s;max-width:760px}
.steps li{list-style:none;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--hair);font-size:14px;line-height:23px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--n);font-size:12px;color:var(--mute);line-height:23px}
.bul{max-width:760px}
.bul li{list-style:none;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px;line-height:23px}
.bul li b{font-family:var(--b)}

.gtip{font-size:12px;line-height:19px;color:var(--mute);min-height:19px;margin-top:6px}
.citybar{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.citybar .lb{font-size:12px;color:var(--mute);margin-right:2px}
.citybar button{appearance:none;cursor:pointer;border:0}
.alt{margin-top:14px;background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:14px 16px;max-width:760px}
.alt h4{font-family:var(--h);font-weight:400;font-size:15px;line-height:22px}
.alt ul{margin-top:6px}
.alt li{list-style:none;font-size:13px;line-height:21px;padding:4px 0;border-top:1px solid var(--hair)}
.miss{margin-top:8px;font-size:12px;line-height:19px;color:var(--mute)}
.mail{white-space:pre-wrap;font-size:13px;line-height:21px;background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;margin-top:6px;max-width:760px}
footer{border-top:1px solid var(--rule);margin-top:40px;padding-top:10px;font-size:11px;line-height:18px;color:var(--mute);max-width:760px}

@media (min-width:980px){
  .ov{grid-template-columns:minmax(0,1fr) 420px}
  .panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 124px);overflow:auto;padding-bottom:12px}
}
@media (max-width:820px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .ohead{grid-template-columns:minmax(0,1fr)}
  .pace{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .tabs{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent);padding-right:28px}
}
@media (max-width:430px){
  .tab .tl{display:none}
  .tab{padding:4px 10px}
}
@media (max-width:400px){
  .mast h1{font-size:25px;line-height:32px}
  .ohead h1{font-size:24px;line-height:31px}
  .top .s{display:none}
  .row{grid-template-columns:46px minmax(0,1fr) auto;gap:8px}
  .facet{grid-template-columns:64px minmax(0,1fr)}
  .essay h2{font-size:23px;line-height:31px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <span class="t">토리노 세 갈래</span><span class="s" id="topsub"></span>
    <button class="themebtn" id="themebtn" type="button" aria-label="화면 밝기 바꾸기">자동</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="보기"></nav>
  <main id="main"><noscript><p class="note" style="padding:20px 0">이 페이지는 스크립트가 켜져 있어야 탭이 보인다.</p></noscript></main>
  <footer id="foot"></footer>

(피나코테카·카사 피아트·피스타 500) · 관광청 기준","k":"site","s":"tr-lingotto"},{"t":"13:00","p":"이탈리 링고토에서 점심","m":"8~23시 · 안의 카르파노 박물관 무료(개방 시각 미확인)","k":"food","s":"tr-eataly"},{"t":"14:30","p":"카리냐노 궁의 붉은 벽돌 정면","m":"카리냐노 광장 쪽의 구아리니 곡면 — 함부르크 칠레하우스와 짝(소논문 5절)","k":"walk","s":"tr-carignano"},{"t":"15:00","e":"16:20","p":"팔라초 마다마 — 새 전시 「도시의 몸」","m":"10~18시 · 리버티에서 모더니티까지 패션과 예술 1884~1961 · 10/15 개막(지역 언론 기준, 공식은 「10월」) · 특별전 요금 미확인 · 선택","k":"site","c":[["선택","line"]],"s":"tr-madama"},{"t":"16:45","p":"숙소에서 짐 찾기 → 포르타 누오바 플립코 정류장","m":"체크아웃 때 맡겨 둔 짐 · 정류장 Piazza Carlo Felice 18","k":"move"},{"t":"17:15","p":"플립코 버스 → 토리노 공항","m":"시내 발 22:30까지 30분 간격 · 약 30분","k":"move"},{"t":"19:10","e":"23:10","p":"토리노 → 프랑크푸르트 → 바젤","m":"환승 1시간 40분","k":"fly"},{"t":"23:31","p":"버스 50 → 바젤 SBB → 트램 2","m":"23:57 바디셔 반호프 · 놓치면 23:51 버스(00:27 도착), 00:11 버스(00:42 도착) · 그 뒤는 택시","k":"move"}],"after":"시간이 늘면 몰레를 엘리베이터만(약 30분)으로 줄이거나 팔라초 마다마를 뺀다. 17:15 버스는 고정. 빠지는 것: 헤리티지 허브(주말은 가이드 투어만, 영어는 10:30뿐이라 답사·몰레와 겹친다), 카사 몰리노, 금요일 토리노."}],"essay":{"title":"두 개의 붉은 곡면 — 함부르크 콘토어하우스에서 토리노 카리냐노까지","by":"2026-09-22 조사 자료 기준","abs":"1안은 금요일을 함부르크에 쓰고 비행기 네 편(프랑크푸르트·함부르크·뮌헨을 거쳐)을 타고 금요일 23:15에 토리노에 내린다(숙소 00:30). 함부르크는 상인의 집에서 사무만 떼어 낸 근대 업무 유형(콘토어하우스)과 벽돌 표현주의, 그리고 바젤의 헤르초크 앤 드 뫼롱이 벽돌 창고 위에 얹은 유리 결정을 걸어서 닿는 거리 안에 모아 둔 도시다. 이 글은 칠레하우스(1922~24)의 뱃머리 벽돌과 구아리니의 팔라초 카리냐노(1679년 설계) 물결치는 벽돌 정면을 한 쌍으로 놓고, 약 240년을 사이에 둔 두 곡면이 벽돌이라는 재료에 대해 무엇을 말하는지 묻는다. 대가는 분명하다. 토리노는 약 22시간으로 줄고, 2인 항공은 CHF 1,725다.","secs":[{"h":"왜 금요일 비행이 네 번인가","p":["함부르크와 토리노 사이에는 직항이 없다. 토리노 공항 공식 시간표의 출발지 목록에 함부르크가 없고, 9월 22일에 10월 16일 날짜로 조회한 구글 항공에서도 모든 편이 뮌헨·프랑크푸르트·바르셀로나·암스테르담 등을 한 번 더 거쳤다. 그래서 1안의 금요일은 바젤→프랑크푸르트→함부르크, 함부르크→뮌헨→토리노, 네 번의 이착륙이다.","함부르크 공항은 셴겐 안에서 오면 여권 심사가 없고 S1 전철로 중앙역까지 25분이다. 09:05에 내려 18:45 편을 타면, 공항이 권하는 「출발 2시간 전 도착」을 지킬 때 시내에서 쓸 수 있는 시간은 약 6시간 20분(09:40~16:00)이다. 3안보다 항공만 CHF 1,212 더 드는 6시간 20분이다."],"refs":[]},{"h":"창고의 도시에서 사무소의 도시로","p":["1881년 함부르크가 독일 관세동맹 편입에 합의하자 면세 구역이 자유항으로 좁혀졌고, 그 창고 지구로 슈파이허슈타트가 1883~1927년에 지어졌다. 착공 전 약 2만 4천 명이 쫓겨났다(함부르크 관광청 수치, 위키는 2만 명 이상). 1888년 10월 29일 개장했다.","창고 옆에서 일만 하는 건물, 콘토어하우스가 태어났다. 주거·창고·사무를 한 채에 겸하던 상인의 집에서 사무만 떼어 낸 유형이다. 첫 사례는 마르틴 할러의 도펜호프(1885~86)다. 1892년 콜레라가 과밀 골목의 위험을 드러낸 뒤, 1909년부터 건축감독 프리츠 슈마허 아래에서 지금의 콘토어하우스 지구가 철거·재개발됐다. 도심이 「사는 곳」에서 「일하는 곳」으로 바뀐 전환이다. 칠레하우스(1922~24, 프리츠 회거)는 칠레 초석 무역상의 돈으로 올덴부르크 클링커 벽돌 480만 장을 썼고, 두 길이 예각으로 만나는 모서리를 뱃머리로 만들었다. 두 지구는 2015년 함께 세계유산이 됐다."],"refs":["h-speicher","h-chile"]},{"h":"벽돌 위의 유리 — 바젤 사무소의 함부르크","p":["카이슈파이허 A는 베르너 칼모르겐이 1963~66년에 코코아 자루의 하중을 견디도록 지은 부두 창고다. 헤르초크 앤 드 뫼롱은 이 창고의 속을 비우고 벽돌 외벽을 남긴 뒤, 보강한 기초 위에 같은 평면으로 콘서트홀을 얹었고, 2017년 1월 11일 문을 열었다. 아래는 닫힌 벽돌, 위는 반사하는 유리, 그 이음매가 공연 표 없이 플라자 입장권(10월 5일부터 1인 5유로)만으로 올라가는 37m 높이의 공공 테라스다.","정현이 볼 것은 유리 패널마다 인쇄된 점 무늬다. 인쇄 망점의 원리가 건축 크기로 커진 셈이라, 가까이에서 점의 밀도가 자리마다 다른지, 멀리서 반사로 어떻게 합쳐지는지 두 거리에서 비교할 수 있다. 연호에게는 사는 도시 바젤의 사무소가 남의 도시 항구에 남긴 작업을 보는 시간이다."],"refs":["h-elbphil"]},{"h":"인쇄와 잡지의 도시","p":["함부르크 공예미술관(1874년 설립)의 그래픽·포스터 소장품은 약 40만 점이다. 정치·여행 포스터부터 서체 디자인, 기업 디자인, 초기 컬러 인쇄와 실크스크린, 초기 테크노 플라이어까지 걸쳐 있고, 그 일부가 2층 교체 전시로 늘 공개된다(10월 주제는 미확인). 베르너 판톤이 1969년 슈피겔 옛 사옥에 만든 주황색 구내식당이 통째로 옮겨져 있다(10/16 공개 여부는 미확인).","이 도시는 슈피겔·디 차이트·그루너 운트 야르의 도시이고, 1833년 겐치 운트 하이제 활자 주조소가 세워진 곳이다. 1안에서 정현이 얻는 것이 가장 분명한 자리다."],"refs":["h-mkg","h-hanse"]},{"h":"토리노의 붉은 곡면 — 카리냐노와 칠레하우스","p":["일요일 오후 토리노에서 1안만의 짝을 맞춘다. 팔라초 카리냐노는 테아티노회 수학자 구아리니가 1679년에 설계한 붉은 벽돌의 물결치는 정면을 카리냐노 광장 쪽에 가졌다. 1848년 이 궁의 무도회장이 사르데냐 왕국 하원이 되었고, 1861년 3월 17일 안뜰의 임시 회의장에서 이탈리아 통일이 선포되었다. 니체는 1888년 이 궁의 뒤편, 카를로 알베르토 광장 쪽 19세기 정면을 마주 보는 방(청소·구두닦이 포함 월 25프랑)에서 편지를 썼다.","두 정면은 모두 벽돌을 휘게 한다. 하나는 기하학자가 타원과 곡선으로 궁정의 얼굴을 만들었고, 다른 하나는 표현주의 건축가가 클링커 벽돌로 초석 무역상의 뱃머리를 만들었다. 둘 다 권력과 돈이 도시를 향해 내민 얼굴이라는 점에서 같고, 쌓는 재료로 곡면을 만든다는 점에서 같다 — 이것은 해석이다. 이 짝은 금요일 한낮에 칠레하우스를 본 사람만 일요일 오후에 볼 수 있다."],"refs":["tr-carignano","h-chile"]},{"h":"대가","p":["토리노에서 깨어 있는 시간은 약 22시간이다(3안 약 31시간 반). 체르토사 답사 시각은 3안과 같은 토요일 오전이지만, 전날 00:30에 숙소에 들어가 짧게 자고 나선다. 헤리티지 허브(주말은 가이드 투어만, 영어 10:30)와 카사 몰리노가 빠진다. 2인 항공은 CHF 1,725로 3안의 3.4배다."],"refs":[]}],"src":["https://www.aeroportoditorino.it/en/tofly/flights/timetable","https://www.hamburg.com/visitors/sights/architecture/speicherstadt-19324","https://en.wikipedia.org/wiki/Chilehaus","https://de.wikipedia.org/wiki/Kontorhaus","https://www.herzogdemeuron.com/projects/230-elbphilharmonie-hamburg/","https://www.elbphilharmonie.de/en/plaza","https://www.mkg-hamburg.de/en/collection/graphics-and-posters","https://www.museorisorgimentotorino.it/en/palazzo-carignano/","http://www.thenietzschechannel.com/correspondence/ger/nlett1888g.htm"]},"cost":{"air2":1725,"hotel2":290,"local2":31},"cities":["h-hanse","tr-city"]},{"id":"o2","no":"2안","name":"카타니아에서 하루 묵기","short":"카타니아","thesis":"금요일 아침 시칠리아의 카타니아에 내려 하루를 묵고, 토요일 10:00 비행기로 토리노에 들어간다. 공항에서 두오모 아래까지 버스 15분, 4유로. 1693년 지진 뒤 용암석으로 다시 그은 바로크 도시, 조반카를로 데 카를로가 대학으로 바꾼 베네딕토회 수도원, 아침 생선시장이 있다. 그 수도원이 다음 날 체르토사 답사의 비교 대상이 된다.","card":{"big":"1,029","bigUnit":"CHF · 2인 합계","lines":["토리노 <b>약 18시간<\/b> · 카타니아 약 13시간","비행 4회 · 표 3장","토리노 도착 <b>토 12:00<\/b>"]},"stats":[{"t":"2인 항공 CHF 747","c":"o2"},{"t":"카타니아 약 13시간"},{"t":"토리노 약 18시간"},{"t":"표 3장 · 가방 제한","c":"warn"}],"flights":[{"d":"10.16 금","w":"06:45 바젤 → 08:55 카타니아","v":"이지젯 DS1117 · 2인 CHF 148 · 기본 운임(큰 기내가방 불포함)"},{"d":"10.17 토","w":"10:00 카타니아 → 12:00 토리노","v":"라이언에어 · 2인 CHF 83 · 기본 운임"},{"d":"10.18 일","w":"19:10 토리노 → 23:10 바젤","v":"루프트한자 편도 · 2인 CHF 516 · 프랑크푸르트 환승 1시간 40분"}],"flightNote":"표가 세 장이다. 가방 추가 요금은 조회하지 않았다. 10월 16일 이탈리아 교통부 파업 등록부에 「이지젯 에어라인스 리미티드 승무원 24시간」 파업이 있다 — 바젤발 편명 DS는 이지젯 스위스라 직접 대상이 아닐 가능성이 크지만, 예약 전에 운항사를 확인한다. 토요일 카타니아발 토리노행은 이 밖에 06:15(위즈에어)·16:10·19:20 편이 있다.","gantt":[[4,4.67,"sleep","잠"],[4.67,9.75,"air","공항 · 비행 · 알리버스"],[9.75,21.5,"o2","카타니아 09:45~21:30"],[21.5,30.83,"sleep","잠"],[30.83,31.83,"o2","생선시장 아침"],[31.83,37.5,"air","택시 · 비행 · 공항 열차 · 지하철"],[37.5,38.25,"turin","콜레뇨 점심"],[38.25,41.25,"survey","체르토사 답사 14:15~17:15"],[41.25,47,"turin","링고토 · 이탈리 · 숙소"],[47,56.5,"sleep","잠"],[56.5,65.25,"turin","왕궁 · 산 로렌초 · 몰레 · 카리냐노"],[65.25,71.95," 리노."}],"screen":{"title":"경유 도시 심사 — 금요일 바젤발·토요일 토리노행 직항이 공식 시간표로 확인된 20곳(추정 2곳 별도) 중 10곳","cols":["도시","금 바젤 → / 토 → 토리노","공항 → 도심","건축","기쁨","숨은 명소","그래픽","2인 항공(세 구간)","판정"],"rows":[["<b>카타니아<\/b>","06:45 → 08:55 / 10:00 → 12:00","버스 15분 · 4유로","9","9","8","4","CHF 747","<b>선택<\/b> — 데 카를로의 수도원, 용암석 바로크, 유바라와 같은 로마 폰타나 학파 · 10/16 이지젯 파업 등록(DS 편 해당 여부 확인)"],["칼리아리","07:30 → 09:20 / 09:25 → 10:50","열차 6분 · 1.30유로","7","7","8","5","CHF 858","차점 — 사르데냐 왕국(수도 토리노), 링고토 구조를 설계한 사르데냐 출신 엔지니어 포르케두"],["프랑크푸르트","14:30 → 15:30 / 12:20 → 13:40","전철 12분","8","6","7","9","CHF 722(루프트한자 한 장, 귀국 포함)","정현 몫이 가장 크다 · 예상 밖의 기쁨이 약하다"],["암스테르담","06:30 · 10:15 / 09:30 → 11:15","열차 17분","9","6","5","8","구간 조회만 CHF 1,000 넘음","토요일 토리노행이 한 편 · 비싸다"],["바르셀로나","10:05 → / 07:20 → 08:50대","버스 30~35분","9","6","5","7","CHF 821","누구나 아는 도시 · 과밀"],["런던","06:00(히드로) / 스탠스테드·루턴 출발","히드로 익스프레스 21분","9","7","5","8","조회 안 함","도착·출발 공항이 다르다 · 전자여행허가(ETA) 필요"],["뮌헨","13:05 → / 08:05 → 09:15","전철 40분","8","6","5","7","조회 안 함","공항이 멀다 · 금요일 반나절"],["로마","18:35 한 편 / 09:10 → 10:30","열차 32분","8","5","5","6","조회 안 함","금요일 밤뿐 · 10/16 이지젯 파업 등록(DS 편 해당 여부 확인)"],["티라나","14:25 → / 16:40 → 18:45","버스 30~40분 · 시간당 1대","7","7","6","4","조회 안 함","토리노 도착이 저녁 — 답사가 일요일로 · 토요일 편 공식 재확인 못 함"],["파리","10:35 → / 08:15 → 09:40","위성 터미널 셔틀 + RER","9","6","4","7","조회 안 함","9월에 다녀왔다 · 파리의 시간 부족을 되풀이"]],"note":"점수는 10점 만점, 공식 운영 정보와 현장 동선을 보고 매겼다. 함부르크는 토리노 직항이 없어 이 표에 들 수 없다(1안). 칼리아리는 공항에서 시내까지의 시간(열차 6분 대 버스 15분)과 그래픽(5 대 4)에서, 프랑크푸르트는 그래픽에서 카타니아보다 낫다.","colw":[90,170,140,40,40,56,48,150,280]},"essay":{"title":"수도원의 두 갈래 — 카타니아 베네딕토회에서 콜레뇨 체르토사로","by":"2026-09-22 조사 자료 기준","abs":"2안은 금요일을 시칠리아의 카타니아에서 보내고 토요일 낮 비행기로 토리노에 들어간다. 경유 도시는 연호가 정한 세 기준 — 공항이 가깝고, 건축이 흥미롭거나 예상 밖의 기쁨이 있고, 유명하지 않아도 알찬 곳 — 으로 골랐다. 금요일 바젤발 직항과 토요일 토리노행 직항이 공식 시간표로 확인된 20개 도시에서 열 곳을 매겨, 카타니아가 기쁨에서 홀로 앞섰고 건축은 최고점(9점)을 네 도시와 나눴다. 이 글의 요지는 한 쌍의 수도원이다. 카타니아의 산 니콜로 라레나 베네딕토회 수도원은 1866년 국가에 몰수되고 1977년 대학이 되어 조반카를로 데 카를로의 손으로 다시 읽혔다. 콜레뇨의 체르토사는 정신병원을 거쳐 시청·보건청·대학 강의실·공연장이 나눠 쓰는 공원이 되었다. 같은 대형 수도원 유형이 한쪽은 대학 하나의 집으로, 한쪽은 여러 기관이 나눠 쓰는 공원으로 갔다 — 금요일의 수도원이 토요일 답사의 비교군이 된다. 두 도시는 한 학파로도 이어진다. 재건된 카타니아의 얼굴(대성당 정면·코끼리 분수)을 만든 바카리니와 토리노의 유바라는 모두 로마 카를로 폰타나 학파의 계보에 있다. 대가는 표 세 장, 저가항공 가방 제한, 토리노 약 18시간이다.","secs":[{"h":"왜 카타니아인가","p":["금요일 바젤발 직항과 토요일 토리노행 직항이 모두 있는 도시는 공식 시간표로 확인된 것만 20곳이었다(바젤 공항 출발편 페이지와 토리노 공항 시간표 대조, 티라나·크라쿠프는 추정). 그중 열 곳을 공항 접근·건축·예상 밖의 기쁨·숨은 명소·그래픽으로 매겼다. 카타니아는 알리버스로 두오모 아래까지 15분(4유로), 건축 9점, 기쁨 9점, 숨은 명소 8점, 그래픽 4점이다.","칼리아리는 공항이 더 가깝고(열차 6분) 「사르데냐 왕국」이라는 토리노와의 연결이 선명했다. 프랑크푸르트는 정현 몫이 가장 컸다. 그래도 연호가 정한 「건축이 흥미롭거나 전혀 예상치 못한 기쁨」에서 카타니아가 두 곳을 앞섰고, 그 수도원이 이번 답사의 중심 대상과 같은 유형이라는 점이 결정적이었다."],"refs":[]},{"h":"1693년 이후의 직선","p":["1693년 1월 대지진으로 카타니아 인구 약 2만 명 가운데 1만 6천 명이 죽었다(위키 수치). 란차 공작이 이끈 위원회가 1694년 6월 28일 새 계획을 승인했다 — 「거리는 모두 직선으로, 넓고 여유 있게」. 크로치페리 거리는 그 위에 18세기에 만들어진 약 410m 길이로, 성당 넷이 한 거리의 벽면을 이룬다. 2002년 「발 디 노토 후기 바로크 도시군」으로 세계유산이 됐다.","재료가 이 도시의 얼굴이다. 검은 용암석과 흰 석회암. 우르시노 성(1239, 프리드리히 2세)은 1669년 용암이 둘러싸 주변 지면이 약 10m 높아졌다 — 대지 레벨 자체가 바뀐 건물이다. 벽돌은 아니지만 쌓는 재료에 관심 있는 건축가에게 이만큼 재료가 도시 전체를 규정하는 곳은 드물다."],"refs":["k-crociferi","k-ursino","k-duomo"]},{"h":"수도원이 대학이 되기까지","p":["산 니콜로 라레나 베네딕토회 수도원은 1558년 짓기 시작해 1669년 용암을 버텼고, 1693년 지진 뒤에는 지하층과 그 위층(primo piano) 일부만 남았다. 1702년부터 재건이 시작돼 18세기 내내 이어졌다. 1866년 통일 이탈리아의 교회재산 몰수법으로 국가에 넘어갔고 1977년 카타니아 대학이 인수했다.","데 카를로는 1980년 처음 현장을 보고 1983년 마스터플랜(프로제토 구이다)을 맡아 2005년 세상을 떠날 때까지 손을 댔다. 복원 전체는 30년 넘게 이어졌다. 마구간을 강의실로, 두 회랑 사이에 열람동 마니카 폰테(다리 동)를, 1669년 용암 위의 노비치 정원에 분수와 나선계단을. 그의 원칙은 「보존과 설계 사이에 분리는 없다」였다. 2008년 시칠리아 주정부는 이 복원을 「현대건축 작품」으로 지정했다 — 옛 건물을 고친 일이 그 자체로 현대건축으로 인정받은 예다. 데 카를로는 팀 텐의 일원이었다.","영어 가이드 투어는 매일 있고 온라인 예약이 필수다(10유로). 회차 시각은 날짜별 예약 화면에서 정해지니 10월 16일 15시 무렵 회차를 미리 산다. 투어는 회랑, 로마 주택 유적이 있는 16세기 지하층, 노비치 정원, 18세기 부엌을 돈다. 바카리니가 설계한 부엌 아래 저장고는 기초 없이 용암석 위에 바로 앉힌 격자 구조다."],"refs":["k-benedettini"]},{"h":"같은 유형, 다른 운명","p":["콜레뇨 체르토사는 1641년 사보이 섭정 크리스틴 드 프랑스가 세운 카르투지오회 수도원이고, 1852~53년 왕립 정신병원이 되었다. 1977년 시가 담장의 첫 구간을 헐었고(바잘리아 법보다 한 해 앞선다), 1978년 바잘리아 법이 뒤따랐다. 카타니아에서는 대학 하나가 수도원 몸체 전체를 맡아 데 카를로에게 다시 읽게 했다. 콜레뇨는 병원을 거친 뒤 시청·보건청·대학 강의실·공연장이 나눠 쓰는 공원이 됐다.","금요일에 데 카를로가 닫힌 회랑을 어떻게 도시에 열었는지 — 새 통로를 어디에 뚫고, 어느 방을 누구에게 줬는지 — 를 보고 토요일 체르토사에 서면, 같은 질문을 담장과 대회랑과 빗살형 병동에 던질 수 있다. 어디가 문턱이었고 어디가 지금 열려 있나. 토요일 답사에 비교할 눈 하나를 더 얹는 셈이다(해석)."],"refs":["k-benedettini","tr-certosa"]},{"h":"한 학파, 두 도시","p":["1713년 위트레흐트 조약으로 사보이의 비토리오 아메데오 2세가 시칠리아를 얻고 처음으로 왕이 되었다. 1713년 12월 24일 팔레르모 대성당에서 대관했다. 1714년 7월 메시나에서 메시나 출신 필리포 유바라가 왕궁 확장안으로 발탁되어 수석 건축가로 임명됐고, 9월 1일 팔레르모를 떠나 가을에 토리노에 닿았다(선서는 12월 14일). 그 뒤 유바라는 수페르가, 팔라초 마다마 정면, 스투피니지를 지었고, 콜레뇨 체르토사의 확장과 정문도 그의 설계로 전한다(정문은 1737년 건립).","카타니아 대성당 정면과 코끼리 분수, 산 줄리아노 성당, 베네딕토회 수도원 부엌을 만든 조반 바티스타 바카리니는 1720년대에 로마에서 공부했고, 이탈리아 쪽 사전은 그를 카를로 폰타나 학파로 분류한다. 유바라는 1704년부터 그 폰타나에게 직접 배웠다. 폰타나는 1714년에 죽었으니, 두 사람은 한 스승을 모신 동문이 아니라 같은 로마 학파의 두 세대다. 폰타나는 스위스 티치노 출신이다. 사보이는 1720년 시칠리아를 사르데냐와 맞바꿨지만, 그 왕관은 시칠리아에서 시작됐다. 일요일 오후 토리노 카리냐노 극장 앞에서는 카타니아 사람 조반니 베르가의 「카발레리아 루스티카나」가 1884년 1월 14일 여기서 초연됐다는 사실을 한 번 더 만난다."],"refs":["k-duomo","tr-carignano"]},{"h":"대가","p":["표가 세 장이다(이지젯, 라이언에어, 루프트한자). 앞 편이 틀어지면 뒤 편은 보호받지 못하지만 금요일 1박이 완충이 된다. 기본 운임은 큰 기내가방이 빠져 있다. 에트나 화산재로 카타니아 공항이 닫히는 날이 있고, 10월 16일에는 이탈리아 이지젯 승무원 파업이 등록되어 있다(바젤발 DS 편 해당 여부는 확인 필요).","토리노에서 깨어 있는 시간은 약 18시간이다(3안 약 31시간 반). 헤리티지 허브의 미우라, 카사 몰리노, 팔라초 마다마 새 전시가 빠진다."],"refs":[]}],"src":["https://www.euroairport.com/","https://www.aeroportoditorino.it/en/tofly/flights/timetable","https://www.amts.ct.it/alibus","https://it.wikipedia.org/wiki/Terremoto%20del%20Val%20di%20Noto%20del%201693","https://it.wikipedia.org/wiki/Via%20dei%20Crociferi","https://it.wikipedia.org/wiki/Castello%20Ursino","https://www.monasterodeibenedettini.it/il-monastero/","https://www.monasterodeibenedettini.it/giancarlo-de-carlo-monastero/","https://www.monasterodeibenedettini.it/en/guided-tours/visit-to-the-benedictine-monastery/","https://it.wikipedia.org/wiki/Giancarlo%20De%20Carlo","https://it.wikipedia.org/wiki/Certosa%20reale%20di%20Collegno","https://it.wikipedia.org/wiki/Giovanni%20Battista%20Vaccarini","https://it.wikipedia.org/wiki/Giovanni%20Verga","https://scioperi.mit.gov.it/mit2/public/scioperi"]},"cost":{"air2":747,"hotel2":260,"local2":22},"alt":{"title":"경유 1박을 가장 무난하게 — 프랑크푸르트 1박 요약","lines":["금 14:30 바젤 → 15:30 프랑크푸르트 · 토 12:20 → 13:40 토리노 · 일 19:10 → 23:10 바젤 — 루프트한자 한 장, 2인 CHF 722(9/22). 경로가 3안과 같은 바젤–프랑크푸르트–토리노다.","금: 공항에서 중앙역까지 전철 12분 → 응용미술관(화·목~일 10~18시, 14유로 · 프랑크푸르트 부엌 · 그래픽 전시 「On Display」 8/21~11/8) → 오펜바흐 클링스포어 박물관(금 14~21시, 금요일 무료 · 체코 북아트 9/4~11/29).","토 아침: IG 파르벤 하우스 — 옛 시립 정신병원 자리에 선 대학(외부) → 12:20 비행. 에른스트 마이 하우스(프랑크푸르트 부엌 견본주택)는 금요일 휴관·토 12~17시라 이 일정으로는 안을 못 본다.","토리노 도착 13:40 — 답사는 토요일 오후, 링고토 지붕은 빠질 수 있다. 예상 밖의 기쁨은 약하고(6점), 정현 몫은 가장 크다(그래픽 9점)."]},"cities":["k-city","tr-city"]},{"id":"o3","no":"3안","name":"곧장 토리노","short":"곧장","thesis":"경유 도시 없이 금요일 13:30 토리노에 내려 사흘을 한 도시에만 쓴다. 파리에서 잰 속도(하루 큰 곳 둘)로 반나절마다 주인공 건물 하나를 두고, 체르토사 답사의 핵심 항목을 토요일 오전에 몰고 모자라면 오후로 늘린다. 같은 편을 1인씩 두 장 사고, 연호 표는 9/22 조회 CHF 216.","card":{"big":"818","bigUnit":"CHF · 2인 합계","lines":["토리노 깨어 있는 시간 <b>약 31시간 반<\/b>","비행 4회 · 같은 편 1인씩 두 장","토리노 도착 <b>금 13:30<\/b>"]},"stats":[{"t":"2인 항공 약 CHF 513","c":"o3"},{"t":"토리노 약 31시간 반"},{"t":"토리노 도착 금 13:30"},{"t":"가는 길·오는 길 환승 1번씩","c":"ok"}],"flights":[{"d":"10.16 금","w":"06:00 바젤 → 13:30 토리노","v":"루프트한자·에어 돌로미티 · 프랑크푸르트 환승 5시간 10분"},{"d":"10.18 일","w":"19:10 토리노 → 23:10 바젤","v":"에어 돌로미티·루프트한자 · 프랑크푸르트 환승 1시간 40분"}],"flightNote":"9/22 조회: 2인 한 번에 CHF 513(루프트한자, 1인 기내가방 1개 무료, 위탁 0~80프랑), 1인 CHF 216. 2인 값이 1인의 두 배보다 81프랑 많다는 것은 216 좌석이 하나뿐일 수 있다는 뜻이다 — 연호 먼저 사면 정현 표는 약 297(역산, 추정)이 될 수 있고, 합계는 어느 쪽이든 약 513. 금 14:30 → 18:20(프랑크푸르트 1시간 30분) 편도 1인 216프랑부터(2인 503부터)다. 이 편이면 새벽 기상이 없어지는 대신 금요일 오후와 헤리티지 허브(평일 자유 관람)가 빠진다 — 주말 영어 투어는 10:30뿐. 같은 조합이 9/14에는 1인 187.06이었다.","gantt":[[4,4.25,"sleep","잠"],[4.25,14.67,"air","공항 · 비행 · 프랑크푸르트 5시간 10분 · 열차"],[14.67,23,"turin","헤리티지 허브 · 링고토 지붕 · 이탈리"],[23,32.5,"sleep","잠"],[32.5,34.25,"turin","비체린 · 지하철"],[34.25,37.75,"survey","체르토사 답사 10:15~13:45"],[37.75,47,"turin","산 로렌초 · 성
