전 요금 미확인","k":"site","s":"tr-madama"},{"t":"16:00","p":"카리냐노 궁의 붉은 벽돌 정면","m":"카리냐노 광장 쪽의 구아리니 곡면 · 1848년 사르데냐 왕국 하원 · 1861년 통일 선포","k":"walk","s":"tr-carignano"},{"t":"16:20","p":"카를로 알베르토 가 6번지 — 니체의 집","m":"니체의 방은 카리냐노 궁 뒤편 19세기 정면을 마주 봤다 · 1888년 10월 18일 편지 「가장 순수한 10월의 빛」 — 날짜가 이번 여행과 겹친다","k":"walk","s":"tr-nietzsche"},{"t":"16:45","p":"숙소에서 짐 찾기 → 포르타 누오바 플립코 정류장","m":"체크아웃 때 맡겨 둔 짐 · 정류장 Piazza Carlo Felice 18","k":"move"},{"t":"17:15","p":"플립코 버스 → 토리노 공항","m":"시내 발 22:30까지 30분 간격 · 온라인 3.99유로부터 · 약 30분","k":"move"},{"t":"19:10","e":"23:10","p":"토리노 → 프랑크푸르트 → 바젤","m":"환승 1시간 40분","k":"fly"},{"t":"23:31","p":"버스 50 → 바젤 SBB → 트램 2","m":"23:57 바디셔 반호프 · 놓치면 23:51 버스(00:27 도착), 00:11 버스(00:42 도착) · 그 뒤는 택시","k":"move"}],"after":"셋째 칸(팔라초 마다마)은 빠져도 되는 자리다. 카사 몰리노 회차가 오후로 잡히면 마다마를 오전으로 바꾼다."}],"essay":{"title":"느린 눈을 위한 격자 — 토리노를 한 도시로만 읽는 사흘","by":"2026-09-22 조사 자료 기준","abs":"파리 사흘의 기록에서 처음 계획의 21곳(다음 날로 넘긴 곳은 한 번만 셈) 가운데 간 곳은 6곳이고, 오르세는 당일 고친 계획의 145분이 210분이 됐다. 이 글은 그 속도를 고칠 결함이 아니라 답사의 방법으로 보고, 토리노를 한 도시로만 읽을 때 무엇이 가능한지 네 겹으로 따진다 — 로마 식민도시의 격자와 포르티코, 구아리니의 빛의 기계와 링고토의 속도의 기계, 네비올로와 올리베티로 이어지는 활자와 바젤의 관계, 수도원에서 정신병원을 거쳐 공원이 된 체르토사. 결론은 단순하다. 사흘을 한 도시에 쓰면 반나절마다 주인공 건물 하나를 두고도 체르토사 답사의 핵심 항목을 토요일 오전에 몰고, 모자라면 오후로 늘릴 여유가 남는다. 대가는 경유 도시가 주는 새로움이다.","secs":[{"h":"파리가 남긴 숫자","p":["파리(9/8~10)의 처음 계획에는 21곳이 있었고(다음 날로 넘긴 6곳은 한 번만 셈) 그중 간 곳은 6곳이다. 9/8은 계획 7곳 중 3곳에 계획 밖 2곳, 9/9는 계획 10곳 중 1곳에 계획 밖 오르세, 9/10은 계획 10곳 중 2곳에 계획 밖 오스테를리츠 역. 다음 날로 넘긴 6곳 중 4곳은 끝내 못 갔다.","계획과 실제가 둘 다 적힌 곳은 셋이다. 오장팡 60분→90분, 오르세 145분(당일 고친 계획)→210분, 유리의 집은 예약 회차 110분 그대로. 늘어난 두 곳의 공통점은 집주인이 옥상 침실까지 문을 열었거나, 그림을 보러 간 자리에서 건물이 주인공이 됐다는 것이다.","그래서 이 안은 하루를 「큰 곳 둘」로 자르고 셋째는 빠져도 되는 자리에 둔다. 속도를 올리는 대신 도시를 줄인다. 다만 이 수치는 동행이 섞인 날(오장팡 3인, 오르세는 동행과 갈라져 따로)을 포함한 연호의 속도이고, 정현과 둘이 움직인 기록은 아직 없다."],"refs":[]},{"h":"격자를 걷는 속도","p":["토리노 도심의 직교 격자는 아우구스투스 시대 식민도시 율리아 아우구스타 타우리노룸(대략 기원전 25~15년)의 틀이고, 포르타 팔라티나가 그 북문이다. 사보이는 1563년 수도를 샹베리에서 옮긴 뒤 이 격자를 1620년 남쪽(산 카를로 광장), 1673년 동쪽으로 늘렸다. 동쪽의 비아 포는 격자에 비스듬히 그어진 예외의 길이다.","포르티코의 길이는 관광청이 18km, 뮤제오토리노가 12km 이상으로 셈법이 다르다. 니체는 1888년 4월 20일 편지에 20,020m, 「행군 두 시간」이라고 적었고, 이 도시를 「내가 가능한 첫 장소」라 불렀다. 10월 18일 편지에는 포 강을 따라 한 시간 이어지는 가로수길을 오후마다 걷는다고, 「가장 순수한 10월의 빛」이라고 썼다 — 이번 여행과 날짜가 겹친다.","지붕 덮인 보도가 끊기지 않는 도시는 느린 사람에게 유리하다. 비가 와도 걷기가 끊기지 않는다. 니체는 바젤 대학 교수였고, 1889년 1월 토리노에서 쓰러진 뒤 바젤의 정신과 병원으로 옮겨졌다. 바젤에서 온 두 사람은 이 길을 조금 다르게 걷게 된다."],"refs":["tr-porticoes","tr-nietzsche"]},{"h":"빛의 기계와 속도의 기계","p":["테아티노회 수학자 구아리니는 1666년 토리노에 왔다(뮤제오토리노는 도시에 머문 기간을 14년으로 적는다). 성의 경당의 돔은 엇갈린 아치 6단이 원근법처럼 작아지는 육각형을 쌓고 꼭대기에 12각 돌 별을 띄운다. 1997년 4월 화재로 크게 부서졌고 2018년 9월 27일 다시 열렸다. 산 로렌초(1668~1680)의 돔은 토요일 15:30부터 볼 수 있다.","250년 뒤의 링고토(1916~1923, 마테트루코)는 원료를 아래로 넣고 완성차를 위로 올려 옥상 트랙에서 달리게 했다. 르 코르뷔지에가 『건축을 향하여』에서 다룬 공장이다. 1982년 멈춘 뒤 렌초 피아노가 1991~2003년에 바꿨고, 2021년 지붕 트랙은 정원 「피스타 500」이 됐다. 아래에서 위로 흐르는 생산과, 아래에서 올려다보는 빛 — 두 수직 기계를 한 주말에 나란히 보는 것이 이 안의 중심축이다(해석).","연호가 좋아하는 1960~72년 GT 비례의 이탈리아 쪽 갈래는 이 공장 도시의 카로체리아에서 그려졌다. 베르토네의 마르첼로 간디니가 그린 미우라는 1965년 11월 토리노 모터쇼에 섀시로 먼저 나왔다. 미우라 S(출처 표기 1967년식)는 마우토가 아니라 미라피오리 헤리티지 허브의 ASI 베르토네 컬렉션(2026년 봄 공개, 66대)에 있고, 금요일 자유 관람으로 본다."],"refs":["tr-sanlorenzo","tr-sindone","tr-lingotto","tr-heritage"]},{"h":"활자의 두 도시, 그리고 바젤","p":["헬베티카는 1957년 바젤 옆 뮌헨슈타인의 하스 주조소에서 「노이에 하스 그로테스크」로 나왔다. 같은 시기 토리노의 네비올로 주조소에서는 노바레세가 마이크로그라마(1951 또는 1952, 부티와 함께)와 유로스타일(1962)을 냈다. 브라운관과 비행기 창의 둥근 사각형을 글자로 옮긴 서체다. 포르마(1968)를 「네비올로가 헬베티카에 내놓은 답」이라 부르는 것은 DJR의 설명이고, 아이 매거진은 명시적 응답을 렉타로 본다.","토리노 광역권 이브레아의 올리베티 로고타입 가운데 1934년 판(산티 샤빈스키 — 1904년 바젤 출생)과 1970년 개정(발터 발머 — 리스탈 출생, 바젤 공예학교)이 모두 바젤 사람 손에서 나왔다. 정현에게 이 여행은 바젤 디자인 학교의 계보가 이탈리아 기업의 얼굴이 된 길을 거꾸로 걷는 일이다.","네비올로는 1978년에 문을 닫았고 매트릭스 대부분은 1980년대에 팔려 독일 다름슈타트에 있어 토리노에서 직접 볼 곳은 없다. 그래픽의 선은 도시 표면에서 찾는다 — 포르타 수사 앞 아르만도 테스타의 퓐테메스 조형물(「신테지 59」, 2015), 몰레 안의 포스터 소장품, 몰레 돔 위 마리오 메르츠의 붉은 네온 피보나치 수열(「숫자의 비행」, 2000)."],"refs":["tr-mole","tr-sintesi","tr-einaudi"]},{"h":"수도원, 정신병원, 공원","p":["콜레뇨 체르토사는 1641년 사보이 섭정 크리스틴 드 프랑스가 세운 카르투지오회 수도원이다. 유바라 설계로 전하는 정문(1737년 건립), 70×54m에 돌기둥 112개의 대회랑(1719). 1852~53년 왕립 정신병원이 되었고 1864~1900년 빗살형 병동이 늘어섰다. 1977년 콜레뇨 시가 담장의 첫 구간을 헐었고, 1978년 5월 13일 바잘리아 법(법률 180호)이 뒤따랐다. 은둔, 격리, 개방의 세 겹이다.","답사는 두 가지를 현장에 대 본다 — 회랑·장벽·출입구의 연결과 시선, 그리고 지형과 식생, 시민의 실제 이용. 여기에 조명과 동선 재질, 맞은편 새 도서관 공사, 남은 담장을 더한다.","지하철 M1 종점 페르미 역이 공원 옆이다. 3안은 답사를 토요일 10:15~13:45에 두고, 모자라면 14:30까지 늘리고, 원하면 토요일 밤 조명을 30분 다시 본다. 1안에서는 자정 도착 다음 날 아침, 2안에서는 비행 직후 오후가 된다."],"refs":["tr-certosa"]},{"h":"무엇을 담고 무엇을 두고 가나","p":["사흘은 금요일 오후(헤리티지 허브 → 링고토 지붕 → 이탈리), 토요일(체르토사 → 산 로렌초 → 성의 경당 → 포르티코), 일요일(몰레 → 카사 몰리노 → 팔라초 마다마 → 카리냐노와 니체의 집)로 짜인다. 파리의 속도로 계산하면 일요일 셋째는 빠질 수 있다.","사흘에 들어가지 않는 것 — 이브레아(올리베티, 토·일 10:00·15:00 공인 투어), 수페르가, 베나리아(「근대인의 아틀리에」 10/2부터 — 종료일은 자료마다 11/14·2027년 2/14로 다름, 연호의 파리 아틀리에 유형 연구와 닿는 전시), 리볼리 성.","비용은 세 안 중 가장 낮다(2인 항공 약 CHF 513). 새벽 4시대 기상과 프랑크푸르트 5시간 10분 대기가 대가다. 그 5시간은 선택에 따라 옛 정신병원 자리에 선 프랑크푸르트 대학을 보는 3시간이 된다 — 그날은 링고토 지붕을 뺀다."],"refs":["tr-mollino","tr-madama","f-igfarben"]}],"src":["파리 답사 기록 — 계획과 실기록 1~3일차(2026-09-08~10)","https://www.museotorino.it/view/s/7c1fa563b1a44e38962b9ac8e2126fd8","https://turismotorino.org/en/visit/territory/torino-metropoli/torino/10-good-reasons-to-visit-torino","http://www.thenietzschechannel.com/correspondence/ger/nlett1888g.htm","https://en.wikipedia.org/wiki/Friedrich%20Nietzsche","https://www.museotorino.it/view/s/e701566395bc4ff2a4b24d1752a4af2a","https://museireali.beniculturali.it/en/chapel-holy-shroud/","https://www.rpbw.com/project/lingotto-factory-conversion","https://www.lamborghini.com/en-en/news/lamborghini-miura-first-supercar-history","https://www.autotecnica.org/collezione-asi-bertone-heritage-hub-stellantis/","https://en.wikipedia.org/wiki/Helvetica","https://productiontype.com/article/the-nebiolo-foundry-turin-1880-1978","https://djr.com/forma","https://eyemagazine.com/feature/article/the-nebiolo-legacy","https://www.archiviograficaitaliana.com/designers/65/xantischawinsky","https://a-g-i.org/design/revision-of-the-olivetti-logotype","https://www.comune.collegno.to.it/area%5Ftematica/cultura-e-turismo/luoghi-della-cultura/area-della-certosa/","https://it.wikipedia.org/wiki/Legge%20Basaglia","https://www.logohistories.com/p/olivetti-logo-1971-walter-ballmer","https://www.museotorino.it/view/s/b73c5bc067884251a140f6edccc6423d","https://www.museotorino.it/view/s/d2b8f5aba6ff4fe4ac96143d1e66af2f","https://ticket.museoauto.com/heritage-hub/","https://fontstand.com/news/essays/unveiling-nebiolos-history/"]},"cost":{"air2":513,"hotel2":290,"local2":15},"cities":["tr-city","f-igfarben"]}],"rec":{"title":"최종 추천","label":"추천","head":"3안, 곧장 토리노. 같은 편을 1인씩 두 장 산다.","body":["경유 도시 없이 금요일 13:30에 토리노에 내리고, 가는 길·오는 길 모두 프랑크푸르트에서 한 번씩만 갈아탄다. 같은 편 1인 왕복이 9/22 조회 CHF 216이다.","토리노에서 깨어 있는 시간이 약 31시간 반으로 1안(약 22)·2안(약 18)보다 9~13시간 길다. 파리에서 잰 속도로 치면 그 차이가 큰 곳 두세 곳이다(표의 7곳 대 5곳·4곳). 2인 합계도 CHF 약 820으로 2안보다 약 210, 1안보다 약 1,230 적다.","경유 도시의 새로움은 3안이 치르는 대가다. 06:00 편을 고르면 프랑크푸르트 환승 5시간 10분 중 옛 정신병원 자리에 선 대학을 잠깐 볼 수는 있지만, 그날 토리노에서는 헤리티지 허브 하나만 남기고 링고토 지붕을 뺀다. 1·2안의 매력(함부르크의 포스터, 카타니아의 수도원)은 소논문에 남겨 두었다."],"blocks":[{"h":"예약 순서","c":"오늘부터","steps":["출발 편을 고른다 — 06:00 편: 새벽 4시대 기상, 첫 대중교통이면 공항 05:12 도착(출발 48분 전 — 택시를 미리 부르는 게 안전), 첫 편을 놓치면 돌아오는 편까지 취소될 수 있다, 대신 금요일 오후 헤리티지 허브. 14:30 편: 새벽 기상 없음, 9/14에 먼저 봐 둔 조합, 대신 금요일 오후와 헤리티지 허브(평일 자유 관람)가 빠진다.","구글 항공에서 연호 1인 왕복을 먼저 루프트한자 화면으로 결제한다(9/22 06:00 편 CHF 216 · 14:30 편 216부터).","연호 결제 직후 정현 1인 왕복을 같은 편으로 다시 조회해 산다 — 216 좌석이 하나뿐이면 약 297(추정).","카사 몰리노 — cm@carlomollino.org 로 일요일 오전 2인 영어 투어 요청(1인 50유로, 최대 6명, 2시간). 아래 문안.","헤리티지 허브 — 금요일 자유 관람 15:30 회차(14~17시, 마지막 입장 16:00, 15유로)를 ticket.museoauto.com에서. 선택 시각 30분 전까지 살 수 있으니 착륙을 보고 사도 된다. 토·일은 가이드 투어만이고 영어는 10:30 한 번이다.","몰레 — 일요일 입장권을 하루 전까지 온라인으로(박물관+엘리베이터 23유로).","숙소 — 포르타 누오바와 카스텔로 광장 사이 2박, 2인 1실 1박 CHF 139~151(구글 호텔 9/22, 계산은 145)."],"mail":[{"h":"카사 몰리노 예약 메일(영어) — 보내기 전에 아래 한글로 내용을 확인","text":"Dear Museo Casa Mollino,\n\nWe would like to book a guided visit in English for two people on Sunday, 18 October 2026, ideally at 11:30 (any morning slot would also suit us).\n\nWe are an architect and a graphic designer based in Basel. Could you please confirm the available time and the price per person?\n\nThank you very much.\n\nKind regards,\nYeonho Lee"},{"h":"한글 대역(문단 1:1)","text":"몰리노의 집 박물관 담당자께,\n\n2026년 10월 18일 일요일에 두 사람 영어 가이드 방문을 예약하고 싶습니다. 가능하면 11시 30분이면 좋겠고, 오전 회차라면 어느 시각이든 괜찮습니다.\n\n저희는 바젤에 사는 건축가와 그래픽 디자이너입니다. 가능한 시각과 1인 요금을 알려 주시겠습니까?\n\n감사합니다.\n\n이연호 드림"}]},{"h":"2안·1안을 고른다면","list":["<b>2안 카타니아<\/b> — 표 세 장을 따로 산다. 베네딕토회 수도원 영어 투어(15시 무렵 회차)를 온라인으로 예약한다(10유로). 이지젯 가방 규정(기본 운임은 좌석 밑 가방 하나)을 먼저 보고, 10/16 이탈리아 이지젯 승무원 파업이 DS 편에 해당하는지, 라이언에어 비EU 여권 서류 확인이 필요한지 확인한다.","<b>1안 함부르크<\/b> — 세 구간 묶음(2인 1,725)은 여행사 판매라 변경·환불이 항공사 직판보다 까다로울 수 있다. 엘프필하모니 플라자는 10/5부터 1인 5유로, 시간 지정 예매. 함부르크 공항은 출발 2시간 전 도착을 권한다."]},{"h":"확인하지 못한 것","list":["토리노 공항 열차(SFM A)의 시각과 주말 운행 시각, 도심 역→페르미의 공식 소요 시간","체르토사 공원 개방 시간 — 주최측 질의응답은 24시간, 시 공식 공지는 없음","피스타 500 — 관광청은 화~일 10~19시(마지막 입장 18:30)·통합권 12유로로 적는다. 실내 전시는 10/30 개막 전 교체기","카사 몰리노 회차 시각, 물라사노 영업 시간, 카르파노 박물관 개방 시각","토리노 그래픽 데이즈 2026 날짜 — 공식 도메인이 열리지 않았다","택시 요금(카타니아 공항, 미라피오리·링고토 구간)과 저가항공 가방 추가 요금"]}]},"stories":{"tr-certosa":{"title":"체르토사 공원 — 콜레뇨 왕립 카르투지오 수도원","short":"체르토사 답사","local":"Parco della Certosa · Certosa Reale di Collegno","city":"콜레뇨","f":{"history":"1641 창건 → 1648 안눈치아타 성당 착공 → 1719 대회랑 → 1737 유바라 정문 → 1802 나폴레옹기 수도회 이탈 → 1816 재개 → 1852~1853 왕립 정신병원 → 1864~1900 빗살형 병동 건설 → 1977 시가 담장 일부 철거·개방 → 1978 바잘리아 법(법률 180호) → 폐쇄 완료 연도는 출처별로 1980년대 / 1980-12-31 재단 해산 / 1998 기사로 엇갈림 → 현재 공원·문화·대학·보건 시설.","humanities":"공모 요강은 「Smemorato di Collegno(스메모라토 디 콜레뇨, 콜레뇨의 기억상실자)」 사건으로 이곳이 이탈리아 국민적 상상 속에 들어갔다고 쓴다. 사건 연도(1926으로 알려짐)는 이번에 웹으로 재확인하지 않았다.","people":"프랑코 바살리아(Franco Basaglia)는 1961년 고리치아 정신병원에서 환자 결박을 거부했고, 1968년 『부정된 제도』(L'istituzione negata)를 냈으며, 1971~1979년 트리에스테 정신보건을 이끌었다. 1978년 법 180호의 실제 기초자는 브루노 오르시니였다. 바살리아는 1980년 8월 29일 베네치아에서 숨졌다.","architecture":"요강의 표현으로는 카르투지오회 유형의 강한 정체성, 즉 「linear buildings, arcaded courtyards, axial relationships, and a clear spatial hierarchy」(선형 건물, 아케이드 중정, 축 관계, 뚜렷한 공간 위계)다. 대회랑은 70×54 m에 돌기둥 112개이고, 원래 수도사 독방 15개로 이어졌으며 1855년 뒤 병동으로 바뀌었다(시 공식). 19세기 후반 병동은 빗살(pettine)형으로 배치됐다(문화부 문서고 안내). 산업 건축으로는 라반데리아 아 바포레(증기 세탁소, 루이지 페놀리오 1870~1875)가 있다. 벽돌 조적과 유리·철골 세부는 현장에서 확인할 대상이며 문헌으로 검증하지 않았다.","philosophy":"바살리아는 1964년 「환자 치료의 첫걸음은 자유로의 복귀」라고 말했다. 이 땅에 「힐링 가든」이라는 말을 쓴다면 그 기준은 식재만이 아니라 출입과 자유여야 한다는 요구로 읽힌다(해석). 니체 역시 토리노를 「내가 가능한 첫 장소」라 부르며 장소를 건강의 조건으로 다뤘고, 그 자신은 1889년 1월 바젤의 정신과 병원으로 옮겨졌다.","genesis":"1978년 5월 13일 법 180호(바살리아 법)로 이탈리아는 정신병원을 닫고 공공 정신보건 서비스로 옮겼으며, 완전 폐쇄는 1994년 이후 마무리됐다. 콜레뇨의 담장은 그보다 1년 앞선 1977년에 헐렸다. 옛 세탁장은 지금 현대무용 레지던시 센터가 되었다.","civilizationalShift":"은둔(수도원) → 격리(정신병원) → 개방(시민 공원)의 세 겹. 1977년 시의 담장 철거가 1978년 국법보다 앞섰다는 점이 핵심 사실이다(이탈리아어 위키백과: 「il Comune abbatte un primo tratto del muro di cinta per aprire il complesso al pubblico」).","artMovement":"라반데리아 아 바포레는 현대무용 창작·연구 레지던시로 운영된다. 1973년 트리에스테 정신병원에서 나온 「마르코 카발로」(Marco Cavallo, 말 마르코) 프로젝트는 바살리아 개혁을 상징하는 예술 행동이다.","graphicLink":"정현 쪽 연결점(사실만): 이 공모는 EU의 「Sleeping Beauty – Nature Meets Bauhaus」와 New European Bauhaus(신유럽 바우하우스) 틀 안에 있다(요강). 공모 브랜딩 자체가 바우하우스 계보를 표방하므로 바젤 디자인 학교 계열 디자이너가 볼 거리가 된다. 콜레뇨 시는 유바라 정문을 「Simbolo della Città(도시의 상징)」로 부른다(시 공식). 시 문장·사인 체계 같은 그래픽 자료는 조사하지 않았다(미확인)."},"src":["https://www.comune.collegno.to.it/area%5Ftematica/cultura-e-turismo/luoghi-della-cultura/area-della-certosa/","https://it.wikipedia.org/wiki/Certosa%20reale%20di%20Collegno","https://cartedalegare.cultura.gov.it/guida-agli-archivi/piemonte/ospedali-psichiatrici-di-torino/la-storia","https://it.wikipedia.org/wiki/Legge%20Basaglia","https://archivi.polodel900.it/scheda/oai:polo900.it:256188%5Fmanicomio-addio-la-chiusura-definitiva-dellospedale-psichiatrico-di-collegno-1998","https://www.comune.collegno.to.it/area%5Ftematica/ambiente-e-verde/il-verde-di-collegno/verde-pubblico/parco-generale-carlo-alberto-dalla-chiesa/","https://it.wikipedia.org/wiki/Collegno","https://it.wikipedia.org/wiki/Legge%5FBasaglia","https://en.wikipedia.org/wiki/Franco%5FBasaglia","https://www.lavanderiaavapore.eu/","http://www.thenietzschechannel.com/correspondence/ger/nlett1888g.htm","https://en.wikipedia.org/wiki/Friedrich%5FNietzsche"],"unv":["정신병원 최종 폐쇄 연도: 위키백과 「1980년대」, 문화부 문서고 안내 「1980-12-31 토리노 정신병원 재단 해산」, 폴로 델 노베첸토 기사 제목 「1998년 최종 폐쇄」가 서로 다르다","개원 연도 1852와 1853의 차이(시·위키백과는 1853, 일부 자료는 1852)","콜레뇨 시 공원 페이지는 체르토사를 「monastero benedettino(베네딕토회 수도원)」라고 적었다. 같은 시의 체르토사 페이지와 위키백과는 카르투지오회(certosini)이므로 공원 페이지 쪽 오기로 보인다","공원 개방 시간: 주최측 질의응답의 「24/7」 외에 시의 공식 공지는 찾지 못했다","도심 역에서 Fermi까지의 공식 소요 시간(GTT는 전 구간 약 25분만 공표, 17분은 rome2rio 비공식 값)","Fermi 역에서 개입 구역까지 걷는 거리와 시간","공원 내 건물(도서관, 라반데리아 아 바포레, 8번 병동 도서관) 개방 시간","제대로 된 답사 한 바퀴에 걸리는 시간 — 공식 자료 없음","스메모라토 사건 연도(1926), 바로크 양식 명칭, 벽돌·철골 등 재료 세부","수도원 창건 연도(17세기로 알려짐)와 후원자.","유바라 설계로 알려진 정문(OSM 지도에 Portale Juvarra로 표기)의 연대.","공원의 공식 명칭(Parco della Certosa인지 다른 이름인지).","「마르코 카발로」 조형물의 색과 제작자.","『부정된 제도』의 출판사(에이나우디로 알려짐).","병원 최대 수용 인원."]},"tr-sanlorenzo":{"title":"산 로렌초 성당 — 구아리니의 돔","short":"산 로렌초","local":"Real Chiesa di San Lorenzo · Guarino Guarini, 1668~1680","city":"토리노","f":{"history":"에마누엘레 필리베르토가 성 라우렌시오 축일에 벌어진 1557년 생캉탱(San Quintino) 전투 승리 뒤 서원했고, 1562년 기존 작은 성당을 고쳐 성 라우렌시오에게 봉헌했다. 구아리니는 1668년부터 작업해 1680년 5월 12일 직접 미사를 집전하며 봉헌했다.","humanities":"","people":"구아리노 구아리니가 설계와 시공을 모두 맡았고 봉헌 미사도 집전했다. 그는 1668년 공국 기술자로 임명되었다.","architecture":"피아차 카스텔로(성 광장)의 대칭을 깨지 않으려고 파사드를 두지 않아, 광장에서는 평범한 건물처럼 지나치기 쉽다. 돔은 교차하는 리브가 8각 별을 만들고 가운데 팔각형이 열리며, 8개의 타원창이 빛을 들인다. 랜턴까지 약 50m다. 현장에서는 돔 아래 정중앙에 서서 리브 사이로 보이는 상부 랜턴의 겹침 구조를 확인할 것.","philosophy":"8이라는 수는 세례당과 부활에 연결된 상징수로 쓰였다. 구아리니에게 수학은 장식이 아니라 신학의 문법이었다.","genesis":"구아리니의 도면은 사후 1686년 본문 없이 도판집으로 먼저 나왔고, 1737년 토리노 잔프란체스코 메레스(Gianfrancesco Mairesse)에서 『민간 건축(Architettura civile)』으로 출간되었다. 경매 도록에 따르면 편집은 베르나르도 안토니오 비토네(Bernardo Antonio Vittone)가 맡았다.","civilizationalShift":"전쟁 승리의 서원 교회가 왕궁 광장에 '얼굴 없는' 모습으로 놓인 것은, 군사 국가가 종교와 예술로 정당성을 치장한 바로크 궁정 문화의 전형이다.","artMovement":"피에몬테 바로크(구아리니).","graphicLink":"『민간 건축』(1737) 도판권에는 구아리니 도면을 새긴 동판화가 실렸다(경매 도록은 79장으로 기술). 취리히 연방공대 도서관(ETH-Bibliothek) 소장본이 e-rara에 퍼블릭 도메인으로 공개되어 있어, 바젤에서 출발 전에 두 사람이 도판 조판과 기하 작도를 미리 넘겨 볼 수 있다."},"src":["https://it.wikipedia.org/wiki/Chiesa%20di%20San%20Lorenzo%20(Torino)","https://www.museotorino.it/view/s/b73c5bc067884251a140f6edccc6423d","https://www.e-rara.ch/doi/10.3931/e-rara-31","https://www.the-saleroom.com/it-it/auction-catalogues/bolaffi-ambassador-auctions/catalogue-id-srbol10012/lot-478f9126-2417-4474-a110-a43e0036eb30"],"unv":["도판 79장, 비토네 편집, 1686년 도판집 선행 출간은 경매·고서 자료 기준이며 e-rara 페이지에서는 확인되지 않았다.","춘분에 성당 안에 빛이 들어오는 현상이 있다는 보도가 있으나 확인하지 못했다."]},"tr-sindone":{"title":"성의 경당","short":"성의 경당","local":"Cappella della Sindone · Guarino Guarini · 왕궁 박물관군","city":"토리노","f":{"history":"1563년 에마누엘레 필리베르토(Emanuele Filiberto)가 사보이아 공국 수도를 샹베리(Chambéry)에서 토리노로 옮겼고, 1578년 9월 성의(Sindone, 예수의 수의로 공경되는 아마포)를 샹베리 생트샤펠에서 토리노로 가져왔다. 명분은 페스트 서원을 지키려 밀라노에서 걸어오는 대주교 카를로 보로메오(Carlo Borromeo)의 길을 줄여 주는 것이었다. 경당은 1656년 계획, 1657년 착공 뒤 1667년부터 구아리니가 돔을 올렸고, 1997년 4월 11~12일 밤 화재 뒤 2018년 9월 27일 다시 열렸다.","humanities":"보로메오는 1578년 10월 6일 일요일 동행 14명과 밀라노를 떠나 나흘을 걸어 토리노에 왔고, 1584년까지 세 번 더 성의를 보러 왔다. 수도 이전 15년 뒤 가져온 성유물은 새 수도에 종교적 정통성을 붙이는 장치였다. 지금은 왕궁 박물관(Musei Reali) 입장권으로 들어간다.","people":"구아리노 구아리니(Guarino Guarini, 1624 모데나~1683 밀라노)는 테아티노회 수도사이자 수학자로 1666년 토리노에 와 14년만 머물렀다. 경당 초안은 아스카니오 비토치와 카를로 디 카스텔라몬테의 1610년 타원안, 베르나르디노 콰드리의 1657년 원형안을 거쳤다. 1694년 안토니오 베르톨라(Antonio Bertola)가 이중 제단을 설계했다.","architecture":"구아리니는 기존 원통 몸체 위에 안쪽으로 기운 큰 아치 셋을 얹고, 그 위에 엇갈린 아치 6단을 쌓아 육각형이 원근법적으로 작아지며 꼭대기의 12각 돌 별로 수렴하게 했다. 내부는 프라보사(Frabosa)산 검은 대리석과 금동 주두다. 현장에서는 바닥에서 올려다보며 아치 단수를 직접 세어 보고, 위로 갈수록 창에서 들어오는 빛이 어떻게 밝아지는지 볼 것.","philosophy":"왕궁 박물관 설명은 이 경당의 핵심을 빛의 기여로 보고, 구아리니가 만든 것을 서구 건축에 비교 대상이 없는 투명한 건축이라 부른다. 수학자인 사제가 계산으로 만든 신비, 즉 구조가 곧 상징이 되는 건축으로 읽을 만하다.","genesis":"경당은 공작궁(지금의 왕궁)과 산 조반니 대성당(Duomo)을 잇는 공작 가문의 경당으로 지어졌다. 성유물을 궁정 안에 두고 교회와 맞물린 정치 건축이다. 성의는 1993년 대성당으로 옮겨졌다.","civilizationalShift":"성유물을 새 수도로 옮겨 권력의 정통성을 세운 대항종교개혁기 절대왕정의 도시 전략이다. 1898년에는 같은 성의가 사진과 만나 신앙의 대상이 기록과 과학의 대상으로도 바뀌었다.","artMovement":"피에몬테 바로크(구아리니).","graphicLink":"1898년 5월 말 성의 공개 때 변호사이자 아마추어 사진가 세콘도 피아(Secondo Pia)가 처음으로 성의를 촬영했고, 음화 건판에서 오히려 양화처럼 선명한 얼굴이 떠올랐다. 공식 성의 사이트는 5월 29일로 적고 다른 자료는 28일 밤으로 적는다. 이미지가 반전될 때 정보가 드러난다는 이 사건은 사진·인쇄의 네거티브 개념을 설명하는 극적인 사례다."},"src":["https://www.museotorino.it/view/s/b410be712adb462ca3d65153dba03c64","https://www.chiesadimilano.it/news/arte-cultura/san-carlo-pellegrino-alla-sindone-33074.html","https://museireali.beniculturali.it/en/chapel-holy-shroud/","https://www.museotorino.it/view/s/e701566395bc4ff2a4b24d1752a4af2a","https://www.museotorino.it/view/s/b73c5bc067884251a140f6edccc6423d","https://www.sindone.it/en/2019/l%E2%80%99oggetto-racconta-%E2%80%93-le-fotografie-della-sindone"],"unv":["성의 이전의 정확한 날짜(1578년 9월 14일이라는 설명)는 교구 기사에서 '1578년 9월'까지만 확인했다.","수도 이전의 정확한 날짜(1563년 2월 7일이라는 설명)는 공식 원문으로 확인하지 못했다.","세콘도 피아 촬영일 5월 28일과 29일이 자료마다 다르다.","음화에서 양화 같은 상이 떠올랐다는 세부 묘사는 공식 성의 페이지가 아니라 2차 자료 기반이다."]},"tr-carignano":{"title":"카리냐노 궁","short":"카리냐노 궁","local":"Palazzo Carignano · Guarino Guarini","city":"토리노","f":{"history":"1679년 구아리니가 사보이아카리냐노 가문의 에마누엘레 필리베르토(1628~1709)를 위해 설계했다. 카를로 알베르토와 이탈리아 초대 국왕 비토리오 에마누엘레 2세가 이 궁에서 태어났다. 1848년 무도회장이 사르데냐 왕국 하원(Parlamento Subalpino, 알프스 아래 의회) 회의장이 되었고, 1861년 3월 17일 안뜰에 가설한 임시 하원에서 이탈리아 통일이 선포되었다.","humanities":"토리노는 1861~1865년 이탈리아 첫 수도였다. 1938년부터 주층(piano nobile)에 이탈리아 국립 리소르지멘토 박물관(Museo Nazionale del Risorgimento Italiano)이 30개 전시실로 운영된다.","people":"구아리노 구아리니, 사보이아카리냐노 공 에마누엘레 필리베르토. 19세기 피아차 카를로 알베르토 쪽 증축은 G. 볼라티가 D. 페리의 1863년 도면을 바탕으로 1864~1871년 지었다.","architecture":"광장 쪽 정면은 중앙의 타원 아트리움이 곡면을 밀어내고, 붉은 벽돌을 거대 오더 필라스터로 정리했다. 대칭 곡선 계단 두 개가 주층으로 오른다. 현장에서는 벽돌 면에 바짝 다가가 성형 벽돌 장식과 줄눈의 정밀도를 보고, 뒤편 피아차 카를로 알베르토 쪽 19세기 정면으로 돌아가 두 시대의 정면을 비교할 것.","philosophy":"박물관은 1848년 하원 회의장을 '유럽에 남은 유일한 1848년 원형 의회장'으로 소개한다. 바로크 귀족 궁의 무도회장이 의회가 된 것은 궁정 사회가 대의 정치로 넘어가는 순간을 공간으로 보여 준다.","genesis":"박물관은 이 궁의 영감을 베르니니의 루브르 계획안으로 설명한다. 19세기 증축은 이탈리아 의회를 위해 지었지만 1871년 완공 무렵 수도는 이미 옮겨 간 뒤였고, 뮤제오토리노는 의회장의 사용이 제한적이었다고 적는다.","civilizationalShift":"왕조 국가에서 국민국가로. 지역 왕가의 궁에서 선포된 통일은 사르데냐 왕국의 정치 질서를 이탈리아 전체로 확장한 사건이다.","artMovement":"피에몬테 바로크(구아리니의 벽돌 바로크), 뒤편은 19세기 증축.","graphicLink":""},"src":["https://www.museorisorgimentotorino.it/en/palazzo-carignano/","https://www.museotorino.it/view/s/626afe674cf94760881325345648e4c6","https://www.museotorino.it/view/s/b73c5bc067884251a140f6edccc6423d","https://www.museotorino.it/view/s/4980ddd6a5c7485891adce0330965eec"],"unv":["증축 설계자 볼라티·페리의 이름(주세페·도메니코)은 원문에서 이니셜로만 확인했다.","새 이탈리아 의회장이 '한 번도 쓰이지 않았다'는 흔한 설명은 확인하지 못했고, 뮤제오토리노는 '제한적 사용'으로만 적는다."]},"tr-porticoes":{"title":"포 거리와 포르티코","short":"포르티코","local":"Via Po · portici","city":"토리노","f":{"history":"1673년 10월 23일 카를로 에마누엘레 2세가 포 강 쪽 두 번째 확장의 첫 돌을 놓았고, 아메데오 디 카스텔라몬테(Amedeo di Castellamonte, 1613~1683)가 감독했다. 비아 포는 성(지금의 팔라초 마다마)에서 강의 다리까지 직교 격자에 비스듬히 그어진 길이다. 1942년 12월 8일과 1943년 7월 13일 폭격 피해를 입었다.","humanities":"토리노 관광청은 도시의 포르티치를 18km로 소개하며 쇼핑과 산책의 무대로 내세우고, 뮤제오토리노는 12km 이상의 선형 체계로 기록한다. 가장 좁은 주랑은 피아차 팔라초 디 치타(1756)의 4m 남짓, 가장 넓은 것은 피아차 산 카를로의 7.5m다.","people":"아메데오 디 카스텔라몬테. 19세기 포르티치는 주세페 프리치(Giuseppe Frizzi)가 1825년 착수한 피아차 비토리오 베네토, 카를로 프로미스가 1850년부터 설계한 피아차 카를로 펠리체와 코르소 비토리오 에마누엘레 2세, 1864~1865년의 피아차 스타투토로 이어졌다.","architecture":"정사각 단면의 상업용 주랑 위로 주층 두 개를 올린 균일한 정면이 기본 단위다. 19세기 포르티치에는 교차로 위를 주층 높이에서 건너는 '테라스 육교(cavalcavia a terrazza)'가 더해졌다. 현장에서는 비아 포를 걸으며 교차로마다 주랑이 어떻게 끊기거나 이어지는지, 그리고 끝의 피아차 비토리오 베네토에서 강 쪽으로 열리는 장면을 볼 것.","philosophy":"뮤제오토리노는 연속된 정렬을 '도시에 행사된 통제의 선명한 표시'라고 쓴다. 비와 눈을 피하는 편의가 곧 왕권의 질서였다는 이중성이 토리노 포르티치의 핵심이다.","genesis":"관광청은 17세기 궁정 건축가들이 거처·교회·극장·상점 사이를 보호된 통로로 잇도록 설계했다고 설명한다. 이 모델이 19세기 광장들과 1930년대 비아 로마까지 이어져 서로 다른 시대의 건축을 하나의 보도로 묶었다.","civilizationalShift":"군주가 설계한 연속 공공 공간이 이후 시민의 산책·상업 문화의 무대가 된 전환이다.","artMovement":"17세기 바로크 계획도시에서 19세기, 1930년대까지 여러 시대의 주랑이 이어진다.","graphicLink":""},"src":["https://www.museotorino.it/view/s/16934284d47c4e52b99056c754ee3d19","https://www.museotorino.it/view/s/c32ae422d6e240ef86875669b4d7ab31","https://turismotorino.org/en/visit/territory/torino-metropoli/torino/10-good-reasons-to-visit-torino"],"unv":["18km 가운데 12~12.5km가 끊김 없이 이어진다는 수치는 관광·언론 자료에만 있고, 뮤제오토리노는 전체를 12km 이상으로 적어 셈법이 다르다.","비아 포 주랑 1,250m 연속 구간이라는 수치는 확인하지 못했다.","주랑이 왕이 비를 맞지 않고 포 강까지 걷기 위해 만들어졌다는 속설은 공식 출처로 확인하지 못했다."]},"tr-madama":{"title":"팔라초 마다마","short":"팔라초 마다마","local":"Palazzo Madama · 시립 고미술관","city":"토리노","f":{"history":"로마 성문에서 출발해 중세 요새, 아카이아 공(principi d'Acaja)의 성, 17~18세기 두 '마다마 레알레(Madama Reale, 섭정 모후)'의 거처가 된 층위 건물이다. 유바라는 두 번째 마다마 레알레 마리아 조반나 바티스타 디 사보이아 느무르를 위해 1718~1721년 정면과 대계단을 지었다. 1848년부터 사르데냐 왕국 상원, 1861~1864년 이탈리아 상원이었고, 궁 공식 사이트는 1934년(시 사이트는 1933년)부터 시립 고대미술관이라고 적는다.","humanities":"상원의 마지막 회의(1864년 12월 9일)는 수도를 토리노에서 피렌체로 옮기는 법을 통과시켰다. 상원의원은 국왕이 사보이아 귀족 가운데 종신 임명했다. 미술관은 1987년부터 약 20년 닫혔다가 2006년 12월 다시 열렸다.","people":"필리포 유바라, 마리아 조반나 바티스타 디 사보이아 느무르, 1402년 무렵 정원을 넓힌 아카이아 공 루도비코.","architecture":"정면 주재료는 발레 디 수사의 키아노코(Chianocco) 대리석, 조각과 장식 화병은 브로사스코(Brossasco) 대리석, 기단은 바이에(Vaie) 편마암이다. 유바라는 빛이 통과하는 '투명한 격자' 같은 정면을 만들었고, 대계단은 더 큰 계획에서 유일하게 완성된 부분이다. 현장에서는 광장 쪽 유바라 정면을 본 뒤 뒤편으로 돌아 중세 성의 벽돌 탑과 만나는 이음매를 볼 것.","philosophy":"하나의 건물이 2천 년을 덧쓴 양피지다. 유바라의 정면은 중세 성을 지우지 않고 그 앞에 무대 막을 세운 것에 가깝다.","genesis":"유바라 계획은 앞부분만 완성된 뒤 중단되었고, 그 결과 바로크 정면과 중세 성이 공존하는 지금의 모습이 생겼다. 정면은 토리노의 상징 이미지 가운데 하나가 되었다.","civilizationalShift":"방어(요새)에서 과시(궁)로, 다시 대의(상원)와 공공(미술관)으로 기능이 옮겨 간 과정이 권력 형식의 변화를 한 건물에 요약한다.","artMovement":"후기 바로크(유바라).","graphicLink":"'보물의 탑(Torre dei Tesori)'에 장 드 베리 공의 『노트르담 매우 아름다운 기도서(Très Belles Heures de Notre-Dame)』, 일명 『토리노-밀라노 기도서』가 있고 일부 세밀화는 얀 반 에이크에게 귀속된다. 2019년 이후 비공개였다가 2025년 5월 23일~9월 8일 전시에서 다시 공개되었으니, 10월 방문 때 공개 여부를 사전에 확인해야 한다."},"src":["https://www.palazzomadamatorino.it/it/evento/restauro-della-facciata-juvarriana/","https://www.palazzomadamatorino.it/en/palazzo-madama/the-palace/","https://www.comune.torino.it/vivere-comune/luoghi/palazzo-madama-museo-civico-darte-antica","https://www.palazzomadamatorino.it/it/news/le-tres-belles-heures-de-notre-dame-e-le-miniature-di-jan-van-eyck","https://www.museotorino.it/view/s/4980ddd6a5c7485891adce0330965eec","https://www.museotorino.it/view/s/36dc33a851cd43ce89ece4c28de18259"],"unv":["미술관 개관 연도가 궁 사이트(1934)와 시 사이트(1933)에서 다르다.","상원 개원일 1848년 5월 8일은 검색 요약에만 있고 뮤제오토리노 본문에는 연도만 있다.","2026년 10월 기도서 공개 여부."]},"tr-mole":{"title":"몰레 안토넬리아나","short":"몰레","local":"Mole Antonelliana · 국립영화박물관","city":"토리노","f":{"history":"건축가 알레산드로 안토넬리(Alessandro Antonelli, 1798~1888)의 이 건물을 니체는 1888년 12월 30일 편지 초안에서 「아마도 지금까지 지어진 가장 천재적인 건물」이라 불렀고, 그해 안토넬리의 장례식에 참석했다고 적었다. 2000년 토리노의 빛 축제 「루치 다르티스타」(Luci d'Artista, 예술가의 빛)를 위해 마리오 메르츠가 돔 곡면에 붉은 네온 피보나치 수열 「일 볼로 데이 누메리」(Il volo dei numeri, 숫자의 비행)를 달았다. 임시 설치였던 이 작품은 영구 작품이 되었다.","humanities":"영화박물관은 1941년 마리아 아드리아나 프롤로(Maria Adriana Prolo)의 발상으로 시작해 토리노 영화 산업의 기록을 모았고, 1958년부터 팔라초 키아블레세에 있다가 몰레로 옮겼다. 소장품은 325만 점이 넘는다(사진 250만, 포스터·광고 54만, 필름 3만4천여 점 등).","people":"건축가 안토넬리와 감독 파스트로네, 작가 단눈치오. 이탈라 필름의 전신은 1905년 카를로 로시와 윌리엄 렘메르트가 세운 회사다. 「카비리아」로 데뷔한 괴력의 인물 마치스테는 이후 이탈리아 검투 영화의 긴 계보를 이었다.","architecture":"건물 한가운데를 지나는 유리 파노라마 엘리베이터가 85m 높이의 전망 테라스까지 올라가며 돔 안쪽을 통과한다. 1층의 '템플 홀(Aula del Tempio)'은 거대한 빈 공간으로 남아 있다. 현장에서는 엘리베이터 안에서 돔 안쪽의 벽돌 구조를 올려다보고, 테라스에서 도시 격자와 슈페르가를 한 화면에 잡아 볼 것.","philosophy":"니체는 이 건물에 「아직 이름이 없다」며 「이 사람을 보라」(Ecce homo)라는 이름을 붙이고, 마음속으로 그 주위에 거대한 빈 공간을 세웠다고 썼다. 메르츠에게 피보나치 수열은 생성과 성장의 보편 원리였다. 한 사람은 건물에 자기 책의 이름을, 다른 한 사람은 성장의 규칙을 입혔다.","genesis":"「카비리아」는 카메라 달리를 쓴 트래킹 숏을 개척해 '카비리아 숏'이라 불렸다. 이탈라 필름에서 시작된 토리노 영화 산업은 로마로 중심이 옮겨 가기 전 이탈리아의 '첫 영화 수도' 시기를 이룬다.","civilizationalShift":"문화부의 현대미술 장소 안내는 피보나치를 이탈리아에 아라비아 숫자를 들여온 중세 토스카나 수학자로 소개한다. 회당으로 계획된 건물이 셈의 숫자를 머리에 이고 있다는 것은 도시의 상징이 종교에서 계산과 성장의 언어로 옮겨 간 장면으로 읽을 수 있다(해석).","artMovement":"「카비리아」는 리비우스, 플로베르의 『살람보』, 살가리의 소설을 바탕으로 제2차 포에니 전쟁을 그린 무성 역사극이다. 단눈치오의 문학과 초기 대작 영화 장르가 만난 지점이다.","graphicLink":"영화박물관의 포스터·광고물 소장품이 54만 점이고, 몰레 안 '포스터 갤러리(Poster Gallery)'가 무성영화부터 최근작까지 포스터로 시각 취향·그래픽디자인·광고 포스터의 변천을 보여 준다. 정현에게는 이 건물에서 가장 오래 머물 곳이다. 이탈리아 2센트 유로 동전 뒷면도 몰레다."},"src":["https://www.museocinema.it/en/mole-antonelliana","https://www.museocinema.it/it/collezioni","https://www.museocinema.it/it/museo-e-fondazione-ma-prolo/fondazione-maria-adriana-prolo","https://numistoria.altervista.org/blog/?p=25495","https://www.museocinema.it/en","https://www.italia.it/en/piedmont/things-to-do/film-locations-turin","https://en.wikipedia.org/wiki/Cabiria","https://en.wikipedia.org/wiki/Itala%5FFilm","http://www.thenietzschechannel.com/correspondence/ger/nlett1888g.htm","https://www.museotorino.it/view/s/d2b8f5aba6ff4fe4ac96143d1e66af2f","https://luoghidelcontemporaneo.cultura.gov.it/en/esplora/il-volo-dei-numeri%5Fen/","https://en.wikipedia.org/wiki/Mario%5FMerz","https://en.wikipedia.org/wiki/The%5FNostalgia%5Fof%5Fthe%5FInfinite"],"unv":["시가 몰레를 '국민 통일 기념물'로 삼으려 매입했다는 설명은 웹 요약에만 있고 박물관 페이지는 매입만 적는다.","착공 연도 1863년(박물관 페이지는 1862년 설계).","2센트 동전 디자이너(루치아나 데 시모니라는 설명)는 조폐국 원문으로 확인하지 못했다.","포스터 갤러리의 2026년 10월 전시 구성.","박물관 개관 연도(2000년)는 검색 요약으로만 보았고, 공식 페이지는 1996~1999년 개조만 적는다.","몰록 신상 외의 「카비리아」 원본 세트가 몇 점 남아 있는지는 확인하지 못했다.","니체 편지에는 안토넬리 장례식이 「이번 11월」로 적혀 있으나 안토넬리의 사망일과 대조하지 못했다.","「숫자의 비행」의 설치 면(돔의 어느 쪽)과 점등 시간은 확인하지 못했다.","몰레의 건축 연대·높이 등 건축 정보는 이 조사 범위 밖이라 확인하지 않았다."]},"tr-mollino":{"title":"카사 몰리노","short":"카사 몰리노","local":"Museo Casa Mollino · Via Napione 2","city":"토리노","f":{"history":"비아 나피오네 2번지, 1888년 빌라 아본도(Villa Avondo) 1층의 아파트를 몰리노가 1960~1968년 자신을 위해 꾸몄다. 1973년 몰리노 사망 뒤 기술자 알도 반도니가 1999년까지 사무실로 썼고, 1999년 풀비오·나폴레오네 페라리가 박물관으로 만들었다. 방문은 예약제로만 가능하다(전화 011 8129868).","humanities":"몰리노는 이 집에서 하룻밤도 자지 않았다고 전해진다. nss 매거진은 이 집을 이집트 건축가 카(Kha)와 아내 메리트의 무덤에서 영감을 받은 '사적인 피라미드'로 설명하고, 벽을 덮은 나비(여성과 사후의 재생), 배 모양의 19세기 침대, 표범·얼룩말 무늬를 그 상징 체계로 든다.","people":"카를로 몰리노, 풀비오 페라리(Fulvio Ferrari), 나폴레오네 페라리, 알도 반도니.","architecture":"포 강 변, 피아차 비토리오 베네토와 강 사이에 있다. 현장에서는 창 밖 강 풍경과 실내의 거울·무늬 면이 서로를 어떻게 비추는지, 그리고 가구 곡선이 여성 신체에서 왔다는 설명을 직접 확인해 볼 것.","philosophy":"살기 위한 기계가 아니라 죽음 이후를 위한 무대로서의 집이다. 기능주의 주류와 정반대 방향의 입장이다.","genesis":"페라리 부자가 연구와 복원으로 아파트를 원래 상태에 가깝게 되돌렸다.","civilizationalShift":"","artMovement":"","graphicLink":"몰리노는 사진가이기도 했다. 1943년에 쓰고 1949년 토리노 키안토레(Chiantore)에서 낸 『암실에서 온 메시지(Il messaggio dalla camera oscura)』는 사진사·이론·미학을 엮은 책으로, 몰리노 자신의 사진과 만 레이·스타이컨·웨스턴 등의 작품을 실었다. 서지 판매 자료는 이를 20세기 이탈리아 최고의 사진집 가운데 하나로 꼽는다."},"src":["https://www.carlomollino.org/museo-casa-mollino/about-contacts","https://www.nssmag.com/en/pills/19997/casa-mollino","https://camera.to/incontri/messaggio-dalla-camera-oscura-libro/","https://www.harpersbooks.com/pages/books/24577/carlo-mollino/il-messaggio-dalla-camera-oscura-with-3-photographs"],"unv":["관람료와 인원 제한이 자료마다 다르다(30유로·5명 대 50유로·6명). 공식 사이트는 접속이 막혀 직접 확인하지 못했다.","몰리노가 하룻밤도 자지 않았다는 이야기는 전언이다.","2026년 10월 16~18일 예약 가능 여부."]},"tr-lingotto":{"title":"링고토 — 옥상 트랙과 피스타 500","short":"링고토 지붕","local":"Lingotto · La Pista 500 · Pinacoteca Agnelli","city":"토리노","f":{"history":"피아트가 1916년 착공해 1923년 5월 연 자동차 공장으로, 1936년형 토폴리노 등 80개 차종을 만들었다. 1982년 란치아 델타를 마지막으로 생산을 멈췄다. 1984년 아이디어 공모를 거쳐 1985년 렌초 피아노 빌딩 워크숍이 전환 설계를 맡았다. 1991~2003년 세 단계에 걸쳐 전시장, 회의장, 호텔, 상업시설, 폴리테크니코(토리노 공과대학) 자동차공학 캠퍼스를 넣었고, 2002년 9월 20일 피나코테카 개관으로 마무리했다. 2026년 9월 19일~10월 28일에는 화~일 10:00~19:00에 열며(월 휴관) 통합권 12유로로 피나코테카, 카사 피아트, 피스타 500에 모두 들어갈 수 있다.","humanities":"르 코르뷔지에가 『건축을 향하여(Vers une architecture)』에 이 공장을 실어 '산업이 보여 주는 가장 인상적인 광경', '도시계획의 지침'이라 불렀다. 옥상 트랙은 「마피오소(Mafioso, 1962)」와 「이탈리안 잡(The Italian Job, 1969)」의 촬영지다.","people":"공장 설계는 조반니 아녤리가 고용한 구조기술자 자코모 마테트루코다. 전환 설계는 렌초 피아노, 옥상 정원 마스터플랜은 베네데토 카메라나, 식재 설계는 크리스티아나 루스파(조르디노 세그레토)가 맡았다. 피나코테카에는 조반니와 마렐라 아녤리(Giovanni e Marella Agnelli) 부부가 기증한 약 20점의 걸작이 있다.","architecture":"길이 500m, 5층의 철근콘크리트 모듈 구조로, RPBW는 이 건물을 '모듈형 철근콘크리트 건설의 첫 사례'라고 부른다. 원료가 1층으로 들어가 층마다 조립되며 위로 올라갔고, 완성차는 옥상의 경사진 뱅크 트랙에서 시험 주행한 뒤 콘크리트 리브가 드러난 나선 램프로 내려왔다. 현장에서는 트랙 끝 곡선부의 뱅크 경사, 나선 램프의 리브, 트랙 위 34m 높이에 얹힌 피아노의 강철 상자 '스크리뇨(Scrigno, 보석함)', 유리 구체 회의실 '볼라(Bolla, 거품)'를 한 시야에 담아 볼 것.","philosophy":"생산 공정이 곧 건물 단면이 된 건물이다. 공정의 흐름이 형태를 정하고, 지붕은 덮개가 아니라 마지막 공정인 시험 주행의 장소가 된다. 피아노의 전환은 '공장을 다목적 센터로 되살리되 건축적 정체성을 유지한다'는 두 목표를 내걸었다.","genesis":"스카이스크레이퍼 뮤지엄의 설명으로는 마테트루코가 포드식 조립 방식을 염두에 두고 설계했다. 피아트는 1939년 단층 수평형 미라피오리로 생산 중심을 옮겼고, 링고토는 1982년 문을 닫은 뒤 복합문화시설이 되었다. 맞은편 카르파노 공장이 2007년 이탈리로 바뀌면서, 링고토 일대 전체가 탈산업 재생의 무대가 되었다.","civilizationalShift":"이탈리아 자동차 산업이 대량생산 체제로 들어서는 문턱에 지어졌고, 1980년대 이후 공장이 문화·소비 공간으로 바뀌는 탈산업화의 상징이 되었다. 한 건물에 20세기 산업 문명의 시작과 끝이 함께 새겨져 있다.","artMovement":"르 코르뷔지에의 선언서를 통해 근대건축 운동의 도상이 되었다. 옥상 정원에는 니나 바이어(Nina Beier), 발리 엑스포트(VALIE EXPORT) 등의 현대미술 설치가 놓여 있다(카메라나 스튜디오 발표 기준).","graphicLink":"통합권에 포함된 '카사 피아트'에서 피아트 브랜드 전시를 볼 수 있다(전시 구성은 확인 못함). 「이탈리안 잡」 미니 추격의 마지막 무대가 이 트랙이라, 영화 스틸과 같은 구도를 현장에서 맞춰 보며 장면을 되짚을 수 있다."},"src":["https://en.wikipedia.org/wiki/Lingotto","https://www.rpbw.com/project/lingotto-factory-conversion","https://old.skyscraper.org/EXHIBITIONS/VERTICAL%5FURBAN%5FFACTORY/fiat.php","https://www.turinguide.eu/the-lingotto-plant-in-turin-an-iconic-building-of-the-citys-industrial-heritage/?lang=en","https://www.gardensillustrated.com/gardens/international/lingotto-fiat-factory-rooftop-garden","https://www.camerana.com/en/news/apertura-lapista500/","https://turismotorino.org/en/visit/things-to-do-and-things-to-see/museums-and-heritage/pinacoteca-agnelli","https://atlantearchitetturacontemporanea.cultura.gov.it/en/lingotto-torino/","https://www.museotorino.it/view/s/2da9c2e6c07446ed89d7480f08820cae","https://www.pinacoteca-agnelli.it/visit/foundation/history/","https://www.artribune.com/arti-visive/arte-contemporanea/2021/10/giardino-pensile-lingotto-torino-fondazione-maeght/","https://bct.comune.torino.it/ufficio-studi-locali-e-digitalizzazione-conservativa/nascita-e-sviluppo-del-complesso-di-torino"],"unv":["옥상 트랙 길이: 출처마다 다르다(가든스 일러스트레이티드 1.2km, 스카이스크레이퍼 뮤지엄 '약 1km', 위키백과 요약 1,500m). 정확한 수치는 확인하지 못했다.","피스타 500 정원의 개장 연도와 요금: 카메라나 스튜디오 발표는 2022년 5월 27일 개장과 입장료 2유로를 적고 있으나, 투리즈모 토리노의 2026년 가을 정보는 통합권 12유로다. 현재 단독 입장이 가능한지는 확인하지 못했다.","조반니 아녤리가 디트로이트 하일랜드 파크(Highland Park)의 포드 공장을 직접 방문한 일이 설계에 영향을 주었다는 통설은 원문으로 확인하지 못했다.","카사 피아트의 전시 내용은 확인하지 못했다.","스크리뇨의 면적 450㎡와 트랙 위 34m라는 수치는 2차 자료 기준이다.","트랙 전체 길이가 자료마다 다르다(약 1km, 1.2km, 약 1.5km). 그래서 RPBW의 직선 구간 수치만 적었다.","르코르뷔지에 인용의 원출처 연도(뮤제오토리노는 1924년 『건축을 향하여』라고 적는데 초판은 1923년이다).","자동차 박람회 링고토 개최 기간(1984~2000)은 검색 요약 기준이다."]},"tr-eataly":{"title":"이탈리 링고토 — 옛 카르파노 공장","short":"이탈리","local":"Eataly Lingotto · Museo Carpano","city":"토리노","f":{"history":"링고토 북쪽 맞은편에 20세기 초 지어진 카르파노 베르무트 공장이다. 1909년 첫 설계, 1923년 주세페 벨리아(Giuseppe Bellia) 설계의 증축, 1927~1929년 정면 파사드, 1942년 카를로 샤르보네(Carlo Charbonnet)의 증축, 1943년 연합군 폭격, 1946년 재건을 거쳐 1996년까지 가동했다. 2007년 1월 27일 첫 이탈리 매장으로 다시 문을 열었다.","humanities":"카르파노의 이야기는 1786년 카스텔로 광장 가게에서 안토니오 베네데토 카르파노가 첫 베르무트를 만든 데서 시작한다(광장에 명판이 있다). 이탈리는 슬로푸드와 협업하며, 좋은 음식을 한 지붕 아래 합리적 가격으로 모은다는 2002년 구상을 여기서 처음 실험했다.","people":"오스카 파리네티(이탈리 창업자). 전환 설계는 토리노의 네고치오 블루 아르키테티 아소차티가 맡았다. 박물관 서사의 출발점은 안토니오 베네데토 카르파노(1764~1815)다.","architecture":"뮤제오토리노는 공장 안뜰을 재해석해 건물 안에 도시 같은 통로를 만든 점을 들어, 이곳을 토리노에서 가장 성공한 산업 전환 가운데 하나로 평가한다. 1층 위 카르파노 박물관은 옛 문서고와 약초 추출·배합·보관실이던 방을 쓴다. 350㎡의 '두첸토 홀(Sala dei Duecento, 이백인의 방)'과 퓐테메스 로고를 본뜬 바 코너가 있는 170㎡의 '퓐테메스 홀'로 나뉜다. 현장에서는 매장 동선 속에 남은 공장 안뜰의 윤곽과 박물관의 약초 향 전시 여섯 개를 볼 것.","philosophy":"공장의 물류 동선을 시장의 산책 동선으로 바꾼 전환이다. 먹는 일을 교육과 문화로 끌어올린 슬로푸드의 논리가 소매 공간으로 번역되었다.","genesis":"약초 가게의 약용주가 공장 생산 브랜드가 되었다가, 공장이 문을 닫은 뒤 그 건물이 '느린 음식'의 시장이 되었다. 카르파노 생산은 지금 밀라노의 프라텔리 브랑카 증류소에서 이어진다.","civilizationalShift":"산업 생산 공간이 미식과 소비 문화 공간으로 바뀌는 탈산업 전환이다. 패스트푸드에 맞선 '느림'이 상업 모델이 되는 순간이기도 하다.","artMovement":"","graphicLink":"카르파노 박물관에는 아르만도 테스타가 만든 '킹 베르무트' 광고 캠페인이 걸려 있다. 카보우르(Cavour), 비토리오 에마누엘레 2세 같은 사보이아 가문 인물과 함께 등장한다. 구 하나가 반구 위에 놓인 퓐테메스 로고를 바 코너의 형태로 옮긴 방에서, 로고가 공간 디자인이 되는 순간을 볼 수 있다. 입장은 무료이고 가이드 투어와 시음은 incomingtorino@eataly.it로 예약한다."},"src":["https://www.museotorino.it/view/s/69dc222841e44050ad534471ba92bff5","https://turismotorino.org/en/visit/things-to-do-and-things-to-see/museums-and-heritage/museo-carpano","https://en.wikipedia.org/wiki/Eataly","https://www.brancadistillerie.com/en/its-turin-vermouth-time/","https://en.wikipedia.org/wiki/Antonio%5FBenedetto%5FCarpano"],"unv":["카르파노 박물관의 요일별 개방 시간은 공식 페이지에 없어 확인하지 못했다.","카르파노가 아페리티보를 '발명'했다는 것은 위키백과의 서술이자 통설이다. 1차 사료로는 확인하지 못했다."]},"tr-heritage":{"title":"헤리티지 허브 — ASI 베르토네 컬렉션","short":"헤리티지 허브","local":"Stellantis Heritage HUB · Mirafiori, Via Plava 80","city":"토리노","f":{"history":"1939년 5월 15일 무솔리니가 참석한 가운데 문을 연 피아트 미라피오리 공장이다. 실제 생산은 전후에 시작되었다. 1943년 3월 파업과 1969년 '뜨거운 가을'의 무대였고, 2026년에도 부분 가동 중이다. 옛 기계 공장 '오피치나 81' 안의 헤리티지 허브(15,000㎡)에 피아트, 란치아, 아바르트 등 약 300대가 있으며, 2026년 3월 31일부터 ASI 베르토네 컬렉션 66대가 함께 전시된다.","humanities":"미라피오리는 이탈리아 노동운동의 상징 공간이다. 위키백과는 1943년 3월 5일 파업을 파시즘 체제 아래 첫 대규모 노동자 봉기로 기록한다. 개장식에서 무솔리니의 물음에 5만 명 가운데 수백 명만 답했다는 일화도 전한다(퍼스트온라인 기사 검색 요약).","people":"공장 설계는 피아트 건설부의 비토리오 보나데 보티노다. 컬렉션 쪽에는 누초 베르토네, 마르첼로 간디니, 조르제토 주지아로, 그리고 이후 베르토네 디자이너 루치아노 담브로시오(Luciano D'Ambrosio), 줄리아노 비아시오(Giuliano Biasio), 마이크 로빈슨(Mike Robinson)이 있다.","architecture":"링고토처럼 5층을 오르내리는 수직 흐름 대신, 모든 공정을 단층에 나란히 펼치고 부서를 수평으로 관리하는 배치다. 현장에서는 오피치나 81의 넓은 단층 홀을 링고토의 나선 램프와 머릿속으로 겹쳐 보며, 대량생산이 건물의 높이 대신 땅의 넓이를 요구하게 된 차이를 느껴 볼 것.","philosophy":"수직에서 수평으로 옮겨 간 전환이다. 흐름을 한 건물에 쌓던 방식에서 흐름을 대지 위에 펼치는 방식으로 바뀌었다.","genesis":"일솔레24오레는 미라피오리를 '이탈리아 최초의 대형 포드식 공장'으로, 독일 볼프스부르크와 같은 시기의 대중 자동차화 프로젝트로 설명한다. 링고토는 이 공장에 밀려 1982년 문을 닫았다. 헤리티지 허브는 생산 공장의 일부를 회사 기억의 저장고로 바꾼 곳이다.","civilizationalShift":"파시즘기의 자급자족 경제와 대중 자동차화, 전후 경제 기적과 노동 투쟁, 그리고 전기차 전환과 탈산업화까지, 20세기 이탈리아 산업 문명의 거의 전 과정이 한 부지에 겹쳐 있다.","artMovement":"연호가 좋아하는 1960~72년 GT 비례를 가장 밀도 높게 볼 수 있는 곳이다. 1963 알파 로메오 줄리아 스프린트, 1967 람보르기니 미우라 S, 1970 람보르기니 에스파다, 1970 피아트 디노 쿠페가 있고, 이어지는 쐐기형 계보로 1975 란치아 스트라토스와 1977 피아트 X1/9도 볼 수 있다.","graphicLink":"미우라라는 이름은 스페인 투우 목장주 돈 에두아르도 미우라 페르난데스의 투우 혈통에서 왔다. 이것이 람보르기니의 황소 이름 전통을 열었으니, 제품 네이밍이 브랜드 체계가 된 사례로 정현과 함께 볼 만하다. 베르토네의 스타일링 모델과 쇼카는 당시 모터쇼 포스터와 카탈로그 이미지의 원본이었다."},"src":["https://en.ilsole24ore.com/art/mirafiori-factory-fiat-symbol-fordism-tests-new-industrial-plan-AI35vH5C","https://en.wikipedia.org/wiki/Fiat%5FMirafiori","https://turismotorino.org/en/visit/things-to-do-and-things-to-see/museums-and-heritage/stellantis-heritage-hub","https://www.autotecnica.org/collezione-asi-bertone-heritage-hub-stellantis/","https://www.ildossier.it/la-collezione-asi-bertone-e-tornata-a-torino/","https://www.media.stellantis.com/em-en/heritage/press/the-prestigious-asi-bertone-collection-returns-to-turin-to-the-heritage-hub","https://www.lamborghini.com/en-en/news/lamborghini-miura-first-supercar-history","https://www.firstonline.info/en/fiat-80-years-ago,-mirafiori-was-born-as-a-symbol/"],"unv":["미라피오리의 최대 고용 인원은 출처마다 크게 달라(일솔레 최대 7만 명, 위키백과 2012년 1만 8천 명) 적지 않았다.","스텔란티스 공식 페이지는 접근이 막혀(403) 헤리티지 허브의 가이드 투어 시간과 요금을 투리즈모 토리노 페이지로만 확인했다. 10월 16~18일 실제 투어 잔여석도 확인하지 못했다.","베르토네 컬렉션 66대가 모두 상설 전시되는지, 방문 시점에 교체되는 차량이 있는지는 확인하지 못했다.","개장식 일화(5만 명 중 수백 명만 응답)는 검색 요약으로만 보았고 퍼스트온라인 원문은 접근이 막혀(403) 대조하지 못했다."]},"tr-sintesi":{"title":"신테지 59 — 아르만도 테스타의 퓐테메스","short":"신테지 59","local":"Sintesi 59 · Piazza XVIII Dicembre","city":"토리노","f":{"history":"2015년 10월 26일 옛 포르타 수사 역사와 새 역사 진입로 사이, 18 디쳄브레 광장에 세워진 높이 약 5m의 강철 조형물이다. 검은 구가 검은 반구 위에 놓인 모습으로, 카르파노 베르무트 퓐테메스의 도상이다. 제막에는 당시 시장 피에로 파시노(Piero Fassino)와 테스타의 아들 마르코 테스타(Marco Testa)가 참석했다.","humanities":"퓐테메스는 피에몬테 방언으로 '한 점 반'이라는 뜻이다. 제조사 설명으로는 단맛 한 점에 쓴맛 반 점을 가리킨다. 퓐테메스는 1870년에 나온 베르무트다(토리노지 기준).","people":"아르만도 테스타(1917~1992)는 토리노 태생으로, 비글리아르디 파라비아 인쇄학교에서 화가 에치오 데리코에게 배웠다. 1937년 첫 포스터 공모에서 수상했고 1946년 스튜디오를 열었으며, 1956년 TV 광고 전문 대행사로 전환했다. 1958년 로마 올림픽 공식 포스터를 만들었다.","architecture":"","philosophy":"아들 마르코는 아버지가 '땅에 발을 단단히 딛고 있어야 머리를 구름 속에 둘 수 있다'고 말했다고 회고했다. 구와 반구 두 도형만으로 맛의 비율을 요약한 극단적 환원이다.","genesis":"1959년 테스타가 뉴욕 출장에서 본 일본 인형에서 착상한 회화 스케치를 퓐테메스 캠페인에 가져왔다. 광고 도상은 2015년 도시의 공공 조형물로 '예술로 돌아왔다'(무제이 레알리 전시 설명).","civilizationalShift":"광고가 대중매체 시대의 공공 예술이 된 사례다. 상업 이미지가 도시 기념물의 지위를 얻었다.","artMovement":"2018~2019년 무제이 레알리 전시 '아르만도 테스타의 모든 이즘'은 1940~90년대의 포스터, 드로잉, 회화, 조각 100여 점으로 그를 여러 예술 사조와 겹쳐 읽었다.","graphicLink":"정현을 위한 핵심 장소다. 로고 하나(구와 반구)가 포스터와 TV 광고를 거쳐 카르파노 박물관 퓐테메스 홀의 바 인테리어, 그리고 5m 공공 조형물로 매체를 바꿔 가며 살아남은 과정을 한 도시에서 따라갈 수 있다. 테스타의 다른 대표작으로는 디제스티보 안토네토(Antonetto), 라바짜 파울리스타 커피, 라인스의 파란 하마 피포가 있다. 같은 이름의 지하철 1호선 18 디쳄브레 역이 있다."},"src":["https://www.torinoggi.it/2023/06/03/amp/argomenti/attualita-8/articolo/punt-e-mes-in-piazza-xviii-dicembre-il-monumento-sintesi-59-la-storia-e-il-significato.html","https://www.quotidianopiemontese.it/2015/10/27/inaugurata-a-porta-susa-sintesi-59-lopera-di-armando-testa-che-lancio-il-punt-e-mes/","https://arte.sky.it/archivio/2015/11/scultura-sintesi-59-armando-testa-porta-susa-torino","https://www.museotorino.it/view/s/da9f05e650c540f992bf604fa38e43f2","https://www.museireali.beniculturali.it/events/tutti-gli-ismi-di-armando-testa/","https://en.wikipedia.org/wiki/Punt%5Fe%5FMes","https://en.wikipedia.org/wiki/Turin%5FMetro"],"unv":["퓐테메스 도상의 연도: 토리노지는 1959년 스케치로 적고, 다른 요약은 1960년 라벨로 적는다.","인형을 본 도시: 토리노지는 뉴욕, 다른 검색 요약은 샌프란시스코 차이나타운으로 적는다.","토리노에서 테스타 작업을 상설로 볼 수 있는 전시장이나 아카이브는 찾지 못했다. 2025년 11월~2026년 5월 회고전은 시에나에서 열렸다(검색 요약).","지하철역 출구에서 조형물까지의 정확한 거리는 확인하지 못했다."]},"tr-einaudi":{"title":"에이나우디의 출발지","short":"에이나우디","local":"Via dell'Arcivescovado 7","city":"토리노","f":{"history":"옛 수도원 건물로, 사회당 기관지 『아반티!』 피에몬테판이 있던 자리에 그람시의 『로르디네 누오보』(L'Ordine Nuovo, 신질서) 편집실이 들어섰다. 1949년 4월 27일 「기억하는 토리노」(Torino memore) 명의의 명판이 붙었다. 같은 건물에서 1933년 11월 출판사 에이나우디(Einaudi)가 출발했다.","humanities":"『신질서』는 1919년 5월 1일 주간지로 창간돼 공장평의회의 신문이 되었고, 1921년 1월 1일 일간지로 바뀌었다. 톨리아티는 편집진 전원이 큰 방 두 개에서 일했다고 회고했다. 1933년 이곳에서 시작한 에이나우디는 리체오 다첼리오(Liceo D'Azeglio) 출신 청년들의 출판사였다.","people":"줄리오 에이나우디(1912년생), 초대 편집장 레오네 긴츠부르그, 체사레 파베세, 노르베르토 보비오, 마시모 밀라. 뒤이어 이탈로 칼비노, 엘리오 비토리니, 나탈리아 긴츠부르그가 합류했다. 디자인 쪽으로는 브루노 무나리, 막스 후버, 알베 스타이너, 기술책임자 오레스테 몰리나가 있었다.","architecture":"옛 수도원 건물을 신문사와 출판사가 차례로 쓴 곳이다. 현장에서는 벽의 1949년 명판을 찾아 신문 제호가 명판에 어떻게 새겨졌는지 읽어 볼 것.","philosophy":"로고 타조는 파올로 조비오의 1559년 『군사와 사랑의 문장(紋章)에 관한 대화』에서 왔다. 입에 못을 문 타조와 모토 'spiritus durissima coquit(정신은 가장 단단한 것도 삭인다)'가 인내와 전략적 기다림을 뜻한다. 보비오는 이 타조를 '한 번도 모래에 머리를 묻지 않은 타조'라고 했다.","genesis":"타조 문장은 에이나우디가 마지막 편집인이던 잡지 『라 쿨투라(La Cultura)』에서 물려받았다. 이 잡지는 1935년 파시즘 정권에 의해 폐간되었다(검색 요약).","civilizationalShift":"수도원에서 사회주의 신문으로, 다시 반파시스트 출판사로 이어진 건물의 용도는 종교 공간이 대중 정치와 대중 독서의 공간으로 바뀐 20세기 이탈리아를 요약한다.","artMovement":"전후 이탈리아 모더니즘 북디자인이다.","graphicLink":"무나리는 1960년 피콜라 비블리오테카 에이나우디(PBE)에 흰 바탕 위 검은 사각과 색 사각을 올린 체계를 만들었다. 누오보 폴리테크니코에는 흰 면 위에 떠 있는 빨간 사각 하나, 1962년 개편한 우니베르살레에는 빨간 선 다섯 줄을 썼고, 1969년 페이퍼백스와 1971년 칼비노가 기획한 첸토파지네도 그의 작업이다. 1964년 막스 후버와 함께 만든 '시 컬렉션(일명 흰 책)'은 표지 아래 3분의 2에 시구를 넣고 가는 검은 선으로 저자와 제목을 나누는 형식이며, 지금까지 그대로다. 몰리나는 에이나우디용으로 가라몬드 시몬치니 서체를 골랐다. 이 건물에서 볼 것은 외관 정도이고, 표지 체계는 서점에서 실물을 넘겨 보는 편이 정현에게 실질적이다."},"src":["https://www.einaudi.it/la-casa-editrice/","https://mole24.it/2026/03/08/giulio-einaudi/","https://editoria.letteratura.it/8685-2/","https://www.doppiozero.com/il-libro-al-centro-leinaudi-e-la-grafica","https://www.adi-design.org/grafica-e-libri-i-coralli-di-einaudi.html","https://iltorinese.it/2025/08/20/via-dellarcivescovado-gramsci-einaudi/","https://archivi.polodel900.it/scheda/oai:polo900.it:134528%5Fla-lapide-sulla-casa-di-via-arcivescovado-dove-era-la-sede-de-lordine-nuovo-torino-s-d","https://en.wikipedia.org/wiki/L%27Ordine%5FNuovo","https://en.wikipedia.org/wiki/Italo%5FCalvino","https://it.wikipedia.org/wiki/Quaderni%5Fdel%5Fcarcere"],"unv":["비아 아르치베스코바도 7번지의 개설일, 그람시 건물, 폭격 피해는 검색 결과 요약으로만 보았고 원문과 대조하지 못했다. 현재 건물이 원래 건물인지, 기념 명판이 있는지도 확인하지 못했다.","에이나우디 본사와 기록물이 일반에 공개되는지는 확인하지 못했다.","무나리와 에이나우디의 관계 시작 시점: 한 출처는 1960년이라 하면서 1950년대 '사지(Saggi)' 표지를 언급하고, 도피오제로는 1957년 '이 제토니(I gettoni)' 작업을 적는다.","누오보 폴리테크니코 총서의 시작 연도는 확인하지 못했다.","번지수 7번지는 검색 결과 요약 기준이며 명판 사진으로 확인하지 못했다.","에이나우디 창립일은 자료마다 1933년 11월 13일과 15일로 다르다.","에이나우디가 이 건물에 머문 기간과 이후 이전 주소는 확인하지 못했다.","1975년 제라타나 비판본의 출판사는 이번 조사에서 확인하지 못했다."]},"tr-nietzsche":{"title":"니체의 집과 카를로 알베르토 광장","short":"니체의 집","local":"Via Carlo Alberto 6","city":"토리노","f":{"history":"니체는 1888년 4월 5일부터 6월 5일까지, 그리고 9월 21일부터 1889년 1월 초까지 이 건물에 세 들어 살았다. 1888년 10월 30일 편지에 방에서 카리냐노 궁(Palazzo Carignano), 카를로 알베르토 광장, 그 너머 푸른 언덕이 보이고 청소와 구두닦이까지 포함해 월 25프랑이라고 적었다. 1889년 1월 3일 이 일대에서 쓰러졌고, 1월 8일 저녁 바젤에서 온 친구 오버베크가 그를 찾아 바젤 정신과 병원으로 데려갔다.","humanities":"편지는 이 동네의 저녁을 구체적으로 남긴다. 봄에는 옆의 카리냐노 극장(Teatro Carignano)에서 「카르멘」이 두 달간 공연돼 「토리노 전체가 카르멘화됐다」고 썼고, 12월에는 방을 나서면 내려다보이는 갈레리아 수발피나(Galleria Subalpina)에서 매일 밤 「세비야의 이발사」가 연주되는 가운데 신문을 받아 들고 아이스크림을 먹는다고 적었다. 커피 한 주전자 20첸테시모, 팁을 받지 않는 도시라는 계산까지 적혀 있다.","people":"집주인은 신문 가판대를 하던 다비데 피노(Davide Fino)였고, 그의 아내 칸디다(Candida)는 쓰러지기 전 며칠 밤 니체가 큰 소리로 노래하고 피아노를 쳤다고 오버베크에게 전했다. 토리노를 권한 사람은 작곡가 친구 하인리히 쾨젤리츠(Heinrich Köselitz, 필명 페터 가스트)였고, 니체는 1888년 4월 7일 「당신 충고가 내 마음에 꼭 맞았다」고 답했다. 바젤의 프란츠 오버베크(Franz Overbeck), 야코프 부르크하르트가 마지막 편지들을 받은 사람들이다.","architecture":"니체가 본 토리노는 「17세기 궁정 도시」였다: 초라한 교외가 없고 도시 전체가 노랑이나 적갈색으로 통일돼 있다고 썼다(1888년 4월 7일). 회랑에 대해서는 변덕스러운 기후에 필요한 장치이면서 「넓어서 사람을 짓누르지 않는다」고 평했고, 4월 20일 편지에는 회랑(portici)의 총연장을 20,020미터, 걸어서 두 시간이라고 적었다(니체 자신이 적은 수치). 현장에서는 6번지 회랑 아래 명판을 읽고, 광장 건너 카리냐노 궁의 광장 쪽 정면, 그리고 니체가 방을 나서며 내려다봤다는 갈레리아 수발피나의 입구를 차례로 보면 편지 속 동선이 겹친다.","philosophy":"4월 20일 편지의 핵심 문장은 토리노가 「내가 가능한 첫 번째 장소」라는 것이다: 공기가 건조하고 명랑해 「반신처럼 소화한다」고 썼다. 장소·기후·소화를 사유의 조건으로 다루는 이 태도가 가을의 자서전 『이 사람을 보라』(Ecce Homo)로 이어진다. 10월 18일 부르크하르트에게는 「인류의 역사를 두 동강 낸다」고 쓸 만큼 고양돼 있었다.","genesis":"봄 체류에서 「음악에 관한 작은 팸플릿」, 즉 『바그너의 경우』가 나왔다(여름 편지에 「토리노에서 썼다」고 명시). 가을에는 실스마리아에서 쓴 『우상의 황혼』 서문에 「토리노, 1888년 9월 30일」을 달았고, 『안티크리스트』를 「가치 전도」의 제1권이라 불렀으며, 『이 사람을 보라』, 『니체 대 바그너』, 『디오니소스 송가』를 여기서 마무리했다. 『이 사람을 보라』는 1908년에야 출간됐다.","civilizationalShift":"이 방에서 완성된 『안티크리스트』 원고 표제는 「가치 전도 — 기독교에 대한 저주」였다. 19세기 유럽의 도덕과 종교를 정면으로 청산하려던 기획이 이탈리아 궁정 도시의 회랑 아래에서, 광기 직전 몇 달 동안 쓰였다는 점이 이 장소의 무게다.","artMovement":"데 키리코는 1939년 글에서 토리노의 「밀폐된 아름다움」을 처음 발견한 사람이 니체였다고 쓰고, 니체가 이 도시의 가을 아름다움을 견디지 못해 광기에 빠졌다고 서술했다. 형이상학 회화(pittura metafisica)가 스스로를 니체의 토리노에 잇대어 설명한 문서다.","graphicLink":"니체 사후 1908년 인젤(Insel) 출판사판 『이 사람을 보라』는 벨기에 디자이너 앙리 반 데 벨데(Henry van de Velde)가 장정했다. 광기의 편지들에 「디오니소스」와 「십자가에 못 박힌 자」로 번갈아 서명한 것은 서명이 곧 정체성 선언이 된 극단적 사례로, 로고와 서명의 관계를 생각하는 정현에게 읽을거리가 된다. 12월 편지에 매일 받아 읽는다고 적은 신문 『주르날 데 데바』(Journal des Débats)도 그의 테이블 위 인쇄물이었다."},"src":["http://www.thenietzschechannel.com/correspondence/ger/nlett1888g.htm","http://www.thenietzschechannel.com/correspondence/eng/nlett-1888.htm","https://www.taurinews.it/nietzsche-a-torino/","https://www.piemonteitalia.eu/en/curiosita/nietzsche-turin","https://www.existenz.us/volumes/Vol.3-1Khazaee.pdf","https://lareviewofbooks.org/blog/essays/nietzsches-horse/","https://en.wikipedia.org/wiki/Friedrich%5FNietzsche","https://en.wikipedia.org/wiki/Twilight%5Fof%5Fthe%5FIdols","https://en.wikipedia.org/wiki/Ecce%5FHomo%5F(book)","https://fondazionedechirico.org/wp-content/uploads/2019/06/461-466-Metafisica-34-G.deChirico-Paola-Levi-Montalcini.pdf"],"unv":["월세: 니체 편지는 봉사 포함 월 25프랑, 피에몬테 관광 포털과 토리노 블로그는 30리라로 적는다. 편지를 따랐다.","6번지 명판의 원문과 설치 연도(탄생 100주년인 1944년으로 보임)를 명판 사진이나 시 공식 자료로 확인하지 못했다.","『이 사람을 보라』의 집필 시작일(44번째 생일 1888년 10월 15일)과 종료일을 이번 조사에서 1차 자료로 확인하지 못했다.","살았던 층수는 확인하지 못했다.","4월 20일 쾨젤리츠 편지는 니체 채널 페이지 머리글에 「니차」로 표기돼 있으나 본문은 토리노에서 쓴 내용이다. 날짜·장소 표기는 비판본으로 재확인이 필요하다.","쓰러진 정확한 장소(카를로 알베르토·산 카를로·카리냐노 광장)는 자료마다 다르다.","갈레리아 수발피나의 건축 연대와 설계자는 확인하지 못했다."]},"tr-bicerin":{"title":"카페 알 비체린","short":"알 비체린","local":"Al Bicerin · Piazza della Consolata 5","city":"토리노","f":{"history":"1763년 콘솔라타 성당(Santuario della Consolata) 앞 광장에 문을 연 카페로, 커피·초콜릿·크림을 한 잔에 층지게 담는 음료 「비체린」(bicerin, 피에몬테 말로 「작은 잔」)이 여기서 만들어졌다고 전한다. 18세기 음료 「바바레이자」(bavarèisa)가 조상이며, 2001년 피에몬테 전통 농식품(PAT)으로 등록됐다.","humanities":"옛날에는 커피와 크림(푸르 에 피오르), 커피와 초콜릿(푸르 에 바르바), 「조금씩 다」(운 포크 드 투트)의 세 가지로 팔았고 마지막이 표준이 되었다. 카페 설명에 따르면 사순절 금식 중에도 뜨거운 초콜릿은 음식으로 치지 않아 미사 뒤에 마셨다. 움베르토 에코는 2010년 소설 『프라하의 묘지』에 이 카페를 비중 있게 등장시켰다.","people":"카페는 카부르 백작의 테이블을 보여 주고, 알렉상드르 뒤마·헤밍웨이·피카소 등이 애호했다는 이야기가 전하지만 대부분 구전이다.","architecture":"대리석 상판 테이블, 거울을 끼운 목재 벽판(보저리), 주철 기둥과 기둥머리, 여러 맛의 사탕 병을 진열한 카운터가 19세기 실내를 이룬다. 현장에서는 주철 기둥과 거울 벽판이 작은 공간을 어떻게 넓어 보이게 하는지 볼 것.","philosophy":"","genesis":"비체린의 도시에 원두를 섞는 블렌딩을 내세운 라바차(Lavazza)가 1895년 루이지 라바차의 비아 산 톰마소(Via San Tommaso) 10번지 식료품점에서 출발했다. 니체도 1888년 편지에 토리노의 커피 한 주전자 20첸테시모, 아이스크림 30첸테시모를 「최고의 문화」라며 적었고, 토리노 카페 문화가 「어지러울 만큼 높은 경지」라고 썼다.","civilizationalShift":"커피와 카카오라는 원거리 교역품이 성당 앞 광장의 일상 의례로 정착하고, 사순절 규율과 타협하는 관습까지 만들어 낸 장소다.","artMovement":"","graphicLink":"토리노 커피의 시각 언어는 광고가 만든 부분이 크다. 토리노 출신 아르만도 테스타(Armando Testa)는 식자공 출신으로 비칠리아르디-파라비아 인쇄학교에서 배웠고, 1960년 올림픽 공식 로고를 만들었으며, 텔레비전 광고 프로그램 「카로셀로」(Carosello)에서 라바차 등을 맡았다. 1965~1971년 토리노 공과대학에서 디자인과 활자 조판을 가르쳤다."},"src":["https://www.bicerin.it/","https://it.wikipedia.org/wiki/Bicerin","https://en.wikipedia.org/wiki/Lavazza","https://en.wikipedia.org/wiki/Armando%5FTesta","http://www.thenietzschechannel.com/correspondence/ger/nlett1888g.htm","http://www.thenietzschechannel.com/correspondence/eng/nlett-1888.htm"],"unv":["창업자 이름과 현재 실내의 제작 연도.","카부르·뒤마·헤밍웨이·피카소 애호담.","정확한 번지(5번지로 알려짐)."]},"tr-mulassano":{"title":"카페 물라사노","short":"물라사노","local":"Caffè Mulassano · Piazza Castello 15","city":"토리노","f":{"history":"1907년 카스텔로 광장(Piazza Castello) 15번지에 문을 연 카페로, 기술자 안토니오 반도네 디 코르테밀리아(Antonio Vandone di Cortemilia)가 리버티(아르누보) 양식으로 설계했다. 1925년 새 주인 안젤라 데미켈리스와 오노리노 네비올로 부부가 토스트와 트라메치노(tramezzino, 삼각 샌드위치)를 선보였다고 한다.","humanities":"트라메치노라는 이름은 흔히 가브리엘레 단눈치오가 지었다고 하지만, 이 말을 처음 실은 1935년 사전은 시인의 이름 옆에 물음표를 붙였다. 베네치아의 여러 바도 원조를 주장하고, 첫 조리법은 1936년 8월 『라 쿠치나 이탈리아나』에 실렸다. 원조 논쟁 자체가 토리노 카페 문화의 일부다.","people":"데미켈리스·네비올로 부부, 이름의 전설 속 단눈치오. 왕과 왕비가 들러 붉은 벨벳 커튼으로 자리를 가렸다는 이야기가 전한다.","architecture":"피에몬테산·누미디아산 고급 대리석, 청동 장식, 꽃무늬, 격자 천장, 필요하면 옮길 수 있게 만든 목공 가구가 작은 정사각형 실내를 채운다. 계산할 사람을 정하는 바늘 하나짜리 「미친 시계」와 카운터에 붙은 청동 급수대를 직접 찾아볼 것.","philosophy":"데 키리코는 1939년 글에서 가을이면 토리노의 동상들이 받침대에서 내려와 「그 유명한 카스텔로 광장」에 모여 영원한 우정의 노래를 부른다고 상상했다: 라그랑주, 가리발디, 베르디, 비토리오 에마누엘레 2세가 그 모임의 인물이다. 물라사노는 바로 그 광장에 있다.","genesis":"영국식 작은 티 샌드위치를 이탈리아식으로 바꾼 것이 이 카페의 트라메치노라고 위키백과는 정리한다.","civilizationalShift":"","artMovement":"1907년 리버티 양식 카페 실내이며, 1971년 다리오 아르젠토의 영화 「회색 벨벳 위의 네 마리 파리」의 촬영지다. 데 키리코의 형이상학적 토리노 서술이 이 광장을 무대로 삼는다.","graphicLink":"카페 밖에 영업 중임을 알리는 등이 달려 있다: 글자 간판 이전의 신호 체계로 볼 만한 장치다. 리버티 양식의 꽃무늬 장식은 20세기 초 포스터와 레터링의 시대 양식과 같은 계열이다."},"src":["https://it.wikipedia.org/wiki/Caff%C3%A8%5FMulassano","https://it.wikipedia.org/wiki/Tramezzino","https://fondazionedechirico.org/wp-content/uploads/2019/06/461-466-Metafisica-34-G.deChirico-Paola-Levi-Montalcini.pdf"],"unv":["왕실 방문 일화.","트라메치노 도입 연도는 1925년과 1926년으로 자료 안에서도 엇갈린다."]},"h-mkg":{"title":"함부르크 공예미술관","short":"MKG","local":"Museum für Kunst und Gewerbe Hamburg","city":"함부르크","f":{"history":"1874년 9월 15일 런던 V&A를 본보기로 세운, 독일어권에서 다섯 번째 공예미술관이다. 칼 요한 크리스티안 치머만(Carl Johann Christian Zimmermann)이 설계한 건물(1873~75)에 1876~77년에 문을 열었다(개관 연도는 독어·영어 위키가 다르게 적음). 1943년 폭격 피해를 입고 1959년 재건됐다. 주소는 중앙역 바로 옆 Steintorplatz.","humanities":"초대 관장 유스투스 브링크만(Justus Brinckmann, 1915년까지 재임)이 박물관의 교육 사명을 세웠다. 1900년 파리 만국박람회에서 대거 사들인 작품으로 세계적인 유겐트슈틸(아르누보) 컬렉션을 만들었다. 사진 소장품도 7만 5천 점이 넘는다.","people":"유스투스 브링크만, 베르너 판톤(Verner Panton, 슈피겔 구내식당 1969), 디터 람스(Dieter Rams, 작업 공간 전시), 사진가 한스 한젠(Hans Hansen, 11월 1일까지 개인전).","architecture":"건물 자체보다 전시 방식이 볼거리다. 판톤의 주황색 슈피겔 식당은 실내 전체가 통째로 옮겨져 있어, 공간 하나가 하나의 작품인 경우다.","philosophy":"산업 시대 시민에게 좋은 형태를 가르치려던 19세기 공예미술관 운동(V&A 모델)의 산물이다.","genesis":"","civilizationalShift":"수공예가 산업 생산으로 넘어가던 시기에 박물관을 디자인 교육 기관으로 삼으려던 흐름을 대표한다.","artMovement":"유겐트슈틸(아르누보), 표현주의, 바우하우스 디자인 오브제.","graphicLink":"그래픽·포스터 컬렉션은 약 40만 점이다. 정치·문화·여행 포스터, 서체 디자인, 제품 광고, 기업 디자인, 초기 컬러 인쇄와 실크스크린, 페미니즘 포스터, 초기 테크노 플라이어까지 있다. 2층에서 교체 전시로 늘 공개하며, 10월 9일부터 Drawer Discoveries #4: Dance가 열린다. 이번 함부르크 일정에서 정현에게 가장 밀도가 높은 곳이다."},"src":["https://www.mkg-hamburg.de/en/visit","https://www.mkg-hamburg.de/en/collection/graphics-and-posters","https://www.mkg-hamburg.de/en/exhibitions","https://de.wikipedia.org/wiki/Museum%20f%C3%BCr%20Kunst%20und%20Gewerbe%20Hamburg","https://en.wikipedia.org/wiki/Museum%20f%C3%BCr%20Kunst%20und%20Gewerbe%20Hamburg"],"unv":["판톤 식당과 람스 작업 공간이 10월 16·18일에 실제 공개 중인지","2층 그래픽 교체 전시의 10월 주제"]},"h-chile":{"title":"콘토어하우스 지구와 칠레하우스","short":"칠레하우스","local":"Kontorhausviertel · Chilehaus","city":"함부르크","f":{"history":"1892년 콜레라 대유행이 과밀 빈민가의 위험을 드러낸 뒤 이 구역이 철거·재개발됐다. 1909년부터 건축감독을 맡은 프리츠 슈마허(Fritz Schumacher)가 대형 사무소 건물 계획을 관철했고, 부르하르트 광장(Burchardplatz)이 그 중심이 됐다. 첫 완공작은 막스 바흐(Max Bach)의 미라마르 하우스(1921~22)다. 칠레하우스는 1922~1924년에 지어졌고(위키는 1921년 착공), 2015년 7월 5일 유네스코 세계유산이 됐다.","humanities":"건축주 헨리 B. 슬로먼(Henry B. Sloman)은 칠레산 초석(질산염) 무역으로 부를 쌓았고, 건물 이름도 거기서 왔다. 지금은 부동산 회사, 백화점, 피아노 상점이 입주해 있고 안뜰에 카페와 상점이 있다.","people":"프리츠 회거(Fritz Höger, 칠레하우스 설계, 스프링켄호프 공동 설계), 한스·오스카 게르손(Hans und Oskar Gerson) 형제(스프링켄호프 1927~43), 조각가 리하르트 쿠욀(Richard Kuöhl, 계단실과 파사드 조각), 루돌프 클로프하우스(Rudolf Klophaus, 지구 내 여러 건물).","architecture":"칠레하우스는 10층 건물로, 약 6,000 m² 대지에 짙은 올덴부르크 벽돌 480만 장을 썼다. 현장에서 볼 것: (1) Pumpenstraße와 Niedernstraße가 예각으로 만나는 모서리의 '뱃머리', (2) 고온에서 구워 단단하고 날씨에 따라 색이 달라지는 클링커 벽돌 표면, (3) 계단실의 쿠욀 조각. 엘베 강에 가까운 지반 때문에 지하를 밀봉했고, 난방 설비는 건물 안에서 뜰 수 있는 케이슨에 넣었다(외부에서는 보이지 않음). 스프링켄호프는 안뜰 세 개를 둘러싼, 당대 함부르크 최대의 사무소 단지였다.","philosophy":"콘토어하우스는 오직 사무 공간만을 위한 건물 유형이다. 주거, 창고, 사무가 한 채에 섞여 있던 상인의 집을 해체하고 일을 전용 건물로 분리한, 근대 기능 분리의 산물이다.","genesis":"독일 최초의 콘토어하우스는 마르틴 할러(Martin Haller)의 도펜호프(Dovenhof, 1885~86)로, 북미 사무소 건물을 본보기로 삼았다. 철골·콘크리트 구조로 평면과 채광을 자유롭게 했고, 파터노스터(쉬지 않고 도는 순환식 엘리베이터)로 층을 이었으며, 후기에는 벽돌 외피를 입었다. 함부르크에는 약 250채가 전쟁을 넘겨 남았다.","civilizationalShift":"도심이 사는 곳에서 일하는 곳으로 바뀌는 전환, 곧 업무 전용 도심의 탄생을 보여준다. 콜레라라는 위생 위기가 도시 구조 개편의 방아쇠가 됐다.","artMovement":"벽돌 표현주의(Backsteinexpressionismus). 칠레하우스는 회거의 대표작이자 클링커 벽돌 표현주의의 가장 중요한 건물 가운데 하나로 꼽힌다.","graphicLink":"확인된 조형 요소는 쿠욀의 계단실·파사드 조각이다. 입구마다 건물 이름이 어떤 글자꼴로 새겨져 있는지는 미리 확인하지 못했으니 현장에서 사진으로 모아 둘 것. 콘토어(Kontor)는 한자동맹의 해외 상관을 가리키던 말과 같은 단어로, 장부와 상업 서식을 다루던 사무 세계를 가리킨다."},"src":["https://en.wikipedia.org/wiki/Chilehaus","https://www.hamburg.com/visitors/sights/architecture/chilehaus-19326","https://en.wikipedia.org/wiki/Kontorhaus%20District","https://de.wikipedia.org/wiki/Kontorhaus","https://en.wikipedia.org/wiki/Hanseatic%20League"],"unv":["입구별 건물명 글자 표기의 실제 모습","도펜호프(1885~86)가 지금도 남아 있는지 — 확인 못함","안뜰 카페·상점 운영 시간"]},"h-speicher":{"title":"슈파이허슈타트","short":"슈파이허슈타트","local":"Speicherstadt","city":"함부르크","f":{"history":"1881년 함부르크가 독일 관세동맹 편입에 합의하면서 관세 면제 구역이 자유항으로 좁혀졌고, 그 자유항의 창고지구로 1883~1927년에 건설됐다. 착공 전 약 24,000명이 쫓겨나고 집 약 1,100채가 헐렸다(위키는 2만 명 이상). 1888년 10월 29일 빌헬름 2세가 개장했다. 2차대전 폭격으로 절반가량 파괴됐다가 1967년 재건이 끝났다. 2015년 7월 5일 콘토어하우스 지구와 함께 유네스코 세계유산이 됐고, 자유무역지대 지위는 2013년 1월 1일 폐지됐다.","humanities":"코코아, 커피, 차, 향신료, 선박용품, 전자제품을 보관했다. 2005년 무렵에는 세계 동양 카펫 생산량의 약 3분의 1을 이곳 업체들이 취급했다(위키). 창고 도시의 탄생은 동시에 기존 주민의 대규모 강제 이주의 역사다.","people":"기술자 프란츠 안드레아스 마이어(Franz Andreas Meyer)가 네오고딕 벽돌 외피의 미학을 설계했다.","architecture":"길이 1,500 m, 폭 250 m, 면적 26 ha, 바닥면적 63만 m²로, 참나무 말뚝 기초 위에 선 창고 단지로는 세계 최대다. 네오고딕 붉은 벽돌 외피에 작은 탑, 벽감, 유약 테라코타 장식을 달았다. 현장에서는 물의 성(Wasserschloss, 1905~07)이 두 수로 사이 좁은 필지를 어떻게 풀었는지, 같은 창고의 수로 쪽 정면과 길 쪽 정면이 어떻게 다른지 비교해 볼 것.","philosophy":"","genesis":"관세동맹 편입(1881)에서 자유항 설정, 창고 수요를 거쳐 슈파이허슈타트가 생겼다. 이 창고지구와 1892년 콜레라 이후의 재개발이 도심을 단일 기능의 업무 지구로 바꾸는 데 힘을 보탰고, 그 흐름이 바로 북쪽의 콘토어하우스 지구로 이어졌다(독일어 위키 '콘토어하우스').","civilizationalShift":"독자 관세권을 가진 도시국가 함부르크가 독일 제국의 관세체계로 편입되는 전환(1881, 1888)을 물리적으로 기록한 장소다.","artMovement":"역사주의 네오고딕 벽돌 건축.","graphicLink":"주소가 알파벳 블록 체계다. 미니어처 원더랜드의 공식 주소부터 'Kehrwieder 2-4/Block D'다. 파사드에서 블록 문자와 옛 창고 회사 이름이 어떤 글자꼴로 표기돼 있는지 사진으로 수집해 둘 것. 산업 시설의 표기 체계를 모은 자료가 된다."},"src":["https://en.wikipedia.org/wiki/Speicherstadt","https://www.hamburg.com/visitors/sights/architecture/speicherstadt-19324","https://www.hamburg-greeter.de/en/sights/downtown/warehouse-district/","https://de.wikipedia.org/wiki/Kontorhaus","https://www.miniatur-wunderland.com/"],"unv":["파사드에 블록 문자가 실제로 어떻게 표기돼 있는지 — 현장 확인 필요","쫓겨난 인원: hamburg.com 약 24,000명, 위키 2만 명 이상 — 출처마다 다름"]},"h-elbphil":{"title":"엘프필하모니와 카이슈파이허 A","short":"엘프필하모니","local":"Elbphilharmonie · Kaispeicher A","city":"함부르크","f":{"history":"카이슈파이허 A는 베르너 칼모르겐(Werner Kallmorgen)이 1963~1966년에 지은 부두 창고다. 코코아 콩 자루 수천 개의 하중을 받도록 설계됐고 20세기 말 무렵까지 창고로 쓰였다. 헤르초크 앤 드 뫼롱은 2001~2003년 콘셉트, 2004~2014년 설계, 2006~2016년 시공을 거쳐 이 창고 위에 콘서트홀을 얹었고, 2017년 1월 11일 개관했다. 최고 높이는 108 m.","humanities":"코코아를 쌓아 두던 항구 창고 위에 음악당이 올라가면서 같은 자리가 물류의 공간에서 공공 여가의 공간으로 바뀌었다. 플라자는 공연 표가 없어도 오를 수 있는 37 m 높이의 공공 테라스다. 공연 표가 있으면 공연 2시간 전부터 입장할 수 있다.","people":"베르너 칼모르겐(창고, 1963~66)과 바젤 사무소 헤르초크 앤 드 뫼롱(콘서트홀). 두 사람이 사는 바젤의 사무소가 함부르크 항구에 남긴 작품이라는 점이 이번 답사와 직접 이어지는 고리다.","architecture":"현장에서 눈으로 볼 것: (1) 82 m 곡선 에스컬레이터 '튜브'(약 2.5분)가 벽돌 창고 몸체를 뚫고 올라가는 방식, (2) 37 m 플라자에서 아래 닫힌 벽돌 몸체와 위 유리 몸체가 만나는 수평 이음매, (3) 일부는 곡면이고 일부는 도려낸 유리 패널, (4) 지붕 오목면을 덮은 두 가지 크기의 '스팽글'. 대공연장은 무대를 객석이 둘러싸는 '빈야드(포도밭)'형이지만 공연 표가 있어야 볼 수 있다. H&dM은 이 건물을 '거대한 무지갯빛 결정'이라 부른다.","philosophy":"기존 창고를 허물지 않고 받침대로 삼아, 옛것은 무겁고 닫힌 벽돌로, 새것은 가볍고 반사하는 유리로 대비시켰다. 두 몸체 사이의 이음매를 누구에게나 열린 새 공공 공간(플라자)으로 만든 것이 설계자가 밝힌 핵심 논리다.","genesis":"코코아 하중을 견디던 튼튼한 창고 구조가 새 콘서트홀을 떠받칠 수 있었기에 가능했던 계획이다. 개관 후에는 옛 항만 부지 220 ha를 재개발한 하펜시티 전체의 상징이 됐다.","civilizationalShift":"도심 부두가 항만 기능을 잃은 자리를 문화·주거 지구로 바꾸는 탈산업 수변 전환의 상징이다. 저장 인프라가 공공 문화 인프라로 바뀐 사례다.","artMovement":"","graphicLink":"유리 패널마다 점 패턴이 인쇄돼 있다(H&dM 설명의 printed dot patterns). 인쇄 망점(하프톤) 원리가 건축 스케일로 커진 사례로 볼 수 있다. 플라자에서 유리에 바짝 다가가 점의 밀도가 위치마다 다른지, 멀리서 보면 반사로 어떻게 합쳐지는지 두 거리에서 비교해 볼 것."},"src":["https://www.herzogdemeuron.com/projects/230-elbphilharmonie-hamburg/","https://www.elbphilharmonie.de/en/plaza","https://archeyes.com/hamburgs-elbphilharmonie-a-masterpiece-by-herzog-de-meuron-architects/","https://en.wikipedia.org/wiki/HafenCity"],"unv":["유리 패널 1,100장, 장당 비용 — 2차 검색 요약에만 있고 원문 확인 실패","창고에 차·담배도 보관했다는 설 — 검색 요약에만 있음","엘프필하모니 시각 아이덴티티(로고) 디자이너 — 확인 못함"]},"h-hanse":{"title":"자유 한자 도시 함부르크","short":"한자 도시","local":"Freie und Hansestadt Hamburg","city":"함부르크","f":{"history":"1241년 뤼베크와 맺은 동맹이 한자동맹의 전신으로 꼽힌다. 1842년 5월 5일 Deichstraße에서 시작된 대화재는 8일 아침까지 타면서 구시가의 약 3분의 1(함부르크 위키는 약 4분의 1)을 태웠다. 51명이 숨지고(소방관 22명 포함) 약 2만 명이 집을 잃었으며, 주택 1,700채와 니콜라이 교회 첨탑, 옛 시청이 무너졌다. 1888년 함부르크는 브레멘과 함께 마지막으로 독일 관세동맹에 들어갔다.","humanities":"한자동맹의 해외 상관(Kontor)은 런던 스틸야드, 브뤼헤, 베르겐, 노브고로드의 페터호프에 있었다. 마지막 한자 회의는 1669년에 열렸다. 함부르크와 브레멘은 지금도 공식 명칭에 '자유 한자 도시'를 쓴다.","people":"윌리엄 린들리(William Lindley, 영국 기술자). 대화재 이후 재건과 근대화를 이끌었다.","architecture":"대화재 이후 목조 건축이 금지되고 방화벽과 내화 박공이 의무가 됐으며 도로가 넓어졌다. 도심에서 벽돌과 석조가 주조를 이루는 거리 풍경은 이 규정과 이어져 있다(해석).","philosophy":"","genesis":"대화재로 쏟아진 막대한 보험 청구가 1846년 최초의 재보험사 쾰른 재보험(Kölnische Rückversicherungs-Gesellschaft) 설립을 촉발했다. 국제 모금으로 약 700만 마르크가 모였다.","civilizationalShift":"중세 도시동맹(한자)에서 근대 도시 재건(1842), 국민국가 관세체계 편입(1888)으로 이어지는 도시국가의 근대화 경로다. 대화재는 재보험이라는 금융 제도를 낳았다.","artMovement":"","graphicLink":"함부르크에는 북독일방송(NDR), 출판·인쇄 기업 그루너 운트 야르(Gruner + Jahr), 슈피겔, 디 차이트(Die Zeit)가 있다. 활자 주조소 겐치 운트 하이제(Genzsch & Heyse)는 1833년 요한 아우구스트 겐치(Johann August Genzsch)가 함부르크에 세웠다. Friedrich Bauer Grotesk, Heyse(1924), Genzsch Antiqua, Römische Antiqua(미국에서 MacFarland, Bradford라는 이름으로 판매), Alte Schwabacher를 냈고, 1963년 문을 닫은 뒤 바우어, 베르톨트, 슈템펠 계열로 흡수됐다."},"src":["https://en.wikipedia.org/wiki/Hamburg","https://en.wikipedia.org/wiki/Hanseatic%20League","https://en.wikipedia.org/wiki/Great%20fire%20of%20Hamburg","https://en.wikipedia.org/wiki/Genzsch%20%26%20Heyse","https://en.wikipedia.org/wiki/Der%20Spiegel"],"unv":["'독일 잡지 수도'라는 표현의 공식 출처 — 확인된 것은 위 언론사들이 함부르크에 있다는 사실까지","겐치 운트 하이제와 오토 후프(Otto Hupp)의 관계 — 영문 위키에 언급 없음, 독일어 원문 열람 실패","겐치 운트 하이제 옛 공장 자리를 지금 볼 수 있는지"]},"f-igfarben":{"title":"IG 파르벤 하우스 — 옛 정신병원 자리의 대학","short":"프랑크푸르트 3시간","local":"IG-Farben-Haus · Goethe-Universität Campus Westend","city":"프랑크푸르트","f":{"history":"1864년 이 자리에 시립 정신병원이 문을 열었고, 시민들은 이를 「광인의 성(Irrenschloss)」이라 불렀다. 알츠하이머가 1888년부터 이 병원에서 일했고 1901년 환자 아우구스테 데터를 관찰해 1906년 11월 3일 튀빙겐 학회에서 발표했다. 1928~1931년 화학 대기업 IG 파르벤의 본사가 들어섰고, 1945~1952년 아이젠하워 사령부가 쓰던 이 건물에서 1948년 「프랑크푸르트 문서」가 전달되어 서독 수립으로 이어졌다. 대학이 1996년 인수했고 덴마크의 디싱+바이틀링(Dissing+Weitling)이 개보수해 2001년 10월 26일 다시 열었다.","humanities":"병원 원장 하인리히 호프만은 1844년 크리스마스에 세 살 아들 카를 필리프에게 줄 그림책을 만들었고, 이것이 1845년 가명 「라이메리히 킨더립(Reimerich Kinderlieb)」으로 나온 『더벅머리 페터(Struwwelpeter)』다. 호프만은 정신질환을 의학의 대상으로 다루며 이 병원을 이끌었다. 지금 건물에는 인문학부와 프리츠 바우어 연구소(Fritz Bauer Institut)가 있다.","people":"건축가 한스 푈치히(Hans Poelzig), 원장 하인리히 호프만, 알로이스 알츠하이머와 환자 아우구스테 데터, 드와이트 아이젠하워, 그리고 노르베르트 볼하임(Norbert Wollheim). 볼하임은 부나-모노비츠(Buna-Monowitz) 수용소의 강제노동자였고, 1950년 IG 파르벤을 상대로 소송을 내 1953년 1심에서 이겼다. 1957년 합의로 강제노동 생존자 수천 명에게 3천만 마르크가 지급되었다.","architecture":"푈치히는 1928년 제한 공모에서 파울 보나츠(Paul Bonatz), 에른스트 마이 등을 제쳤다. 길이 250 m, 7층 본동에 완만하게 휜 중앙 복도가 있고 여기에 날개 여섯 개가 붙는다. 철골 4,600 t 위에 칸슈타트 트래버틴(Cannstatter Travertin) 33,000 m²를 붙였고, 순환식 엘리베이터 파테르노스터가 9개 층 중 7개 층을 잇는다. 현장에서는 휜 정면을 따라 걸으며 수평 창 띠가 곡면에서 어떻게 이어지는지, 트래버틴 판의 줄눈과 두께를 손으로 확인할 것.","philosophy":"한 필지의 쓰임이 돌봄, 이윤, 점령, 학문으로 차례로 바뀌었다. 2008년 11월 2일 문을 연 노르베르트 볼하임 기념관(Norbert Wollheim Memorial)은 전쟁 전, 나치 시기, 전후라는 세 시간 층을 생존자들의 삶 이야기와 엮어, 이 건물을 기억의 장소로 다시 읽게 한다.","genesis":"기념관은 건물과 한 몸인 설치 작품으로 기획되었다. 무료 독일어 해설 투어가 매달 셋째 토요일에 있고, 2026년 10월 17일 15:00에 건물 아래 프리츠-노이마르크 길(Fritz-Neumark-Weg)의 볼하임 파빌리온 앞에서 모인다. 예약은 필요 없지만 12:25 비행기와 겹친다.","civilizationalShift":"바이마르 공화국에서 지은 가장 큰 건물이었고 1950년대까지 유럽에서 가장 큰 사무 단지였다. 19세기의 도시 밖 정신병원이 20세기 대기업의 관리 기계로, 다시 전후 배상과 민주주의의 장소로 바뀐 과정이 한 부지에 겹쳐 있다.","artMovement":"신즉물주의(Neue Sachlichkeit) 건축으로 분류된다. 연못 곁에는 프리츠 클림슈(Fritz Klimsch)의 님프 조각 「Am Wasser(물가에서)」가 있다.","graphicLink":""},"src":["https://de.wikipedia.org/wiki/IG-Farben-Haus","https://en.wikipedia.org/wiki/IG%5FFarben%5FBuilding","https://www.struwwelpeter-museum.de/heinrich-hoffmann-2/","https://en.wikipedia.org/wiki/Alois%5FAlzheimer","https://en.wikipedia.org/wiki/Norbert%5FWollheim","https://www.fritz-bauer-institut.de/veranstaltungen/veranstaltung/norbert-wollheim-memorial-10-2026"],"unv":["토요일 건물 내부 개방 여부와 시간","1864년 병원 건물과 지금 건물의 정확한 위치 관계(같은 필지라는 것까지만 확인)","파테르노스터를 일반 방문자가 탈 수 있는지","알츠하이머와 병원 관계에 대한 공식(대학·병원) 출처 — 위키백과로만 확인"]},"k-benedettini":{"title":"산 니콜로 라레나 베네딕토회 수도원","short":"베네딕토회 수도원","local":"Monastero dei Benedettini · Giancarlo De Carlo, 1983~","city":"카타니아","f":{"history":"1558년 카시노회(Cassinese) 베네딕토 수도사들이 짓기 시작해 1578년 미완성 상태로 들어갔다. 1669년 3월 시작된 에트나 분화의 용암이 4월 말 도시 성벽에 닿으며 부속 성당을 부쉈지만 수도원은 버텼다. 1693년 1월 대지진 때는 지하층과 1층 일부만 남았다. 1702년 재건이 시작됐고, 1866년 국가에 몰수됐다가 1977년 카타니아 대학교가 인수했다.","humanities":"페데리코 데 로베르토(Federico De Roberto)의 『총독들(I Vicerè)』(1894)은 카타니아 귀족 우체다 가문이 1855~1882년 통일 전후를 어떻게 넘기는지 그린 소설인데, 이 수도원이 무대로 나온다. 지금은 인문학부(DiSUM)가 쓰고 있어, 몰수된 수도원이 인문학의 집이 됐다.","people":"재건은 안드레아 아마토(Andrea Amato, 1702년~)가 시작했다. 1738~1747년에는 프란체스코 바탈리아(Francesco Battaglia)와 조반 바티스타 바카리니가 확장을 맡았고, 성당 돔은 스테파노 이타르(Stefano Ittar)가 1780년에 완성했다. 조반카를로 데 카를로(1919 제노바~2005 밀라노)는 1980년 처음 현장을 보고 1983년 마스터플랜(Progetto Guida)을 의뢰받았다. 그의 읽기를 도운 사람으로 역사가 주세페 자리초(Giuseppe Giarrizzo), 미술사가 비토 리브란도(Vito Librando), 건축가 안토니노 레오나르디(Antonino Leonardi)가 꼽힌다.","architecture":"서쪽 회랑은 카라라 대리석 열주 때문에 원래 「대리석 회랑(Chiostro dei Marmi)」이라 불렸다. 바카리니가 설계한 부엌 아래 저장고 「벤트레(Ventre, 배)」는 기초 없이 용암석 위에 바로 앉힌 격자 구조다. 데 카를로는 마구간을 강의실로 바꾸고, 두 회랑 사이에 열람동 마니카 폰테를 놓고, 노비치 정원에 분수와 나선계단을 넣고, 자기 이름이 붙은 강당을 만들었다. 성당 산 니콜로 라레나는 「시칠리아의 작은 성베드로」를 꿈꿨지만 정면이 미완성으로 남았다.","philosophy":"데 카를로의 원칙은 「보존과 설계 사이에 분리는 없다(Non c'è separazione fra conservazione e progettazione)」였다. 전통에 대한 관심이 모방으로, 혁신에 대한 관심이 피상으로 흐르지 않도록 둘 사이를 계속 오가야 한다고 했다. 그는 건물을 여러 시대의 층이 읽히는 「서사적 텍스트(testo narrativo)」로 다뤘다.","genesis":"1558년 스페인 부왕 후안 데 라 세르다(Juan de la Cerda) 시절 착공했다. 첫 수도원의 중심은 대리석 열주 회랑 하나였다. 지진 뒤 1702년 재건은 이전보다 더 기념비적인 배치로 규모를 키웠다.","civilizationalShift":"신에게 바친 공동체의 집이 1866년 통일 국가의 몰수법으로 국유가 됐다. 부엌 공간만 해도 천문대, 실험실, 창고로 쪼개 쓰였다. 1977년 대학이 된 뒤 2008년 시칠리아 주정부가 이 복원을 「현대건축 작품(Opera di Architettura Contemporanea)」으로 지정했다. 옛 건물을 고친 일이 그 자체로 현대건축으로 인정받은 사례다.","artMovement":"재건부는 시칠리아 후기 바로크이고, 2002년 유네스코 「발 디 노토 후기 바로크 도시군」에 포함됐다. 데 카를로는 1952~1960년 팀 텐(Team 10) 멤버로 CIAM 회의에 참여했고, 사용자 참여를 설계에 들인 선구자로 꼽힌다. 바로크 몸체 위에 전후 이탈리아 건축의 비판적 계보가 겹쳐 있다.","graphicLink":"데 카를로의 수도원 프로젝트는 2004년 파리 퐁피두 센터에서 전시됐다. 수도원 안 파브리카 박물관(Museo della Fabbrica, 공사의 박물관)은 2000년 문을 열었고 복원 도면과 사진 아카이브를 관리한다. 도면이 곧 전시물인 셈이다. 부엌 한가운데 화덕은 비에트리(Vietri) 도자 타일로 장식되어 있다."},"src":["https://www.monasterodeibenedettini.it/il-monastero/","https://www.monasterodeibenedettini.it/giancarlo-de-carlo-monastero/","https://www.monasterodeibenedettini.it/museo-della-fabbrica/","https://www.monasterodeibenedettini.it/en/giancarlo-de-carlo-for-the-benedictine-monastery/","https://it.wikipedia.org/wiki/Monastero%20dei%20Benedettini%20(Catania)","https://it.wikipedia.org/wiki/Giancarlo%20De%20Carlo","https://it.wikipedia.org/wiki/I%20Vicer%C3%A8"],"unv":["바카리니가 참여를 시작한 해가 출처마다 다르다: 공식 사이트는 부엌 설계를 1739년부터, 위키는 바카리니 항목에서 1743년부터, 수도원 항목에서 1738~1747년 확장으로 적는다","1693년 지진 규모가 공식 사이트 7.7, 위키 7.32로 다르다(본문에는 넣지 않음)","1669년 용암층 높이 12m는 수도원 공식 사이트의 수치로, 다른 출처와 대조하지 못했다","금요일에 데 카를로의 어느 방(강당, 마니카 폰테)이 실제로 열려 있는지","공식 사이트에 언급된 별도의 「데 카를로 코스(Percorso De Carlo)」 일정","건축가 이름이 공식 사이트와 위키에서 갈린다(아마토의 이름 등)"]},"k-crociferi":{"title":"크로치페리 거리","short":"크로치페리","local":"Via dei Crociferi","city":"카타니아","f":{"history":"1693년 1월 9~11일 지진으로 카타니아 인구 약 2만 명 가운데 1만 6천 명이 죽었다(위키 수치). 재건 총괄 주세페 란차 카마스트라 공작(Giuseppe Lanza, duca di Camastra)이 이끈 위원회가 1694년 6월 28일 새 도시계획을 승인했고, 크로치페리 거리는 그 위에 18세기에 만들어졌다. 2002년 유네스코 세계유산에 포함됐다.","humanities":"거리 시작점인 산 프란체스코 다시시 광장의 그라비나 크루일라스 궁(Palazzo Gravina Cruyllas)에서 1801년 11월 3일 작곡가 빈첸초 벨리니(Vincenzo Bellini)가 태어났다. 1930년 5월 5일 이 집이 벨리니 시립박물관으로 문을 열 때 사보이 왕 비토리오 에마누엘레 3세가 참석했다.","people":"란차 공작은 군사 기술자 카를로스 데 그루넨베르그(Carlos de Grunenbergh), 예수회 건축가 안젤로 이탈리아(Angelo Italia) 등과 계획을 짰다. 거리의 백미인 산 줄리아노 성당(Chiesa di San Giuliano, 1740~1748)은 바카리니 작이다. 바카리니(1702 팔레르모~1768 밀라초)는 로마의 카를로 폰타나 문하에서 배우고 1730년 무렵 시칠리아로 돌아왔다.","architecture":"약 410m 길이다. 두 수녀원을 잇는 산 베네데토 아치(Arco di San Benedetto) 아래로 들어서면 산 베네데토 성당, 대계단 두 개로 오르는 산 프란체스코 보르자 성당, 열주 회랑을 가진 예수회 콜레조(Collegio dei Gesuiti), 산 줄리아노 성당, 산 카밀로 성당이 이어지고, 끝에 빌라 체라미(Villa Cerami, 대학 법학부)가 있다. 성당 네 곳이 한 거리의 벽면을 이뤄, 개별 건물보다 거리 전체가 하나의 건축으로 읽힌다.","philosophy":"1694년 계획의 원칙은 「거리는 모두 직선으로, 넓고 여유 있게, 같은 성격의 다른 거리와 교차하도록」이었다. 재난 뒤 도시를 다시 긋는 합리적 격자 위에 바로크의 원근 무대를 입혔다.","genesis":"","civilizationalShift":"지진으로 지워진 도시가 위원회가 승인한 문서, 곧 1694년 계획에 따라 직선 가로망으로 다시 그어졌다. 도시 형태가 자연 발생이 아니라 행정 결정으로 정해진 순간이다.","artMovement":"시칠리아 후기 바로크다. 로마의 카를로 폰타나 학파가 바카리니를 통해 카타니아로 옮겨왔다.","graphicLink":"거리 시작점 그라비나 크루일라스 궁에 에밀리오 그레코 박물관(Museo Emilio Greco)이 있다. 1994년 조각가 그레코가 직접 개관했고, 1955~1992년의 석판화와 에칭 150점을 건다(연작 「코미아티(Commiati, 작별)」 25점 포함). 이 거리 일대에서 확인된 유일한 인쇄 매체 전시다."},"src":["https://it.wikipedia.org/wiki/Via%20dei%20Crociferi","https://it.wikipedia.org/wiki/Terremoto%20del%20Val%20di%20Noto%20del%201693","https://it.wikipedia.org/wiki/Giuseppe%20Lanza%20(duca%20di%20Camastra)","https://it.wikipedia.org/wiki/Giovanni%20Battista%20Vaccarini","https://it.wikipedia.org/wiki/Museo%20civico%20belliniano","https://it.wikipedia.org/wiki/Museo%20Emilio%20Greco%20(Catania)"],"unv":["산 베네데토 아치가 세워진 해","산 베네데토 성당이 금요일 10:00~17:00에 연다는 정보(위키보야지 2차 출처)","에밀리오 그레코 박물관의 개관 시간과 요일","1694년 계획의 목적이 피난로 확보였다는 통설(본문에는 넣지 않음)"]},"k-ursino":{"title":"우르시노 성","short":"우르시노 성","local":"Castello Ursino, 1239","city":"카타니아","f":{"history":"신성로마황제이자 시칠리아 왕 프리드리히 2세(Federico II di Svevia)의 명으로 1239년 착공해 1250년까지 지었다. 1296~1415년 아라곤 왕들의 거처였고 시칠리아 의회도 이곳에서 열렸다. 1669년 4월 16일 에트나 용암이 성을 둘러싸 주변 지면이 약 10m 높아졌고, 1693년 지진이 다시 피해를 냈다. 1932년 시가 사들여 복원했고, 1934년 10월 20일부터 시립박물관이다.","humanities":"박물관에는 비스카리 가문과 베네딕토회 수도원의 컬렉션이 있다. 오후에 볼 수도원의 옛 소장품이 이 성으로 옮겨와 있는 것이다. 1492년 유대인 추방과 관련된 비문과 문서도 있다(영문 위키).","people":"설계자로 리카르도 다 렌티니(Riccardo da Lentini)가 전해진다.","architecture":"정사각 평면의 모서리마다 원형 탑이 하나씩 있고, 원래는 각 변 가운데에도 탑이 있었다(지금 2개 남음). 1669년 용암이 주변 지면을 끌어올려 성은 지금 솟아오른 땅 속에 앉은 모습이다. 대지 레벨 자체가 바뀐 건물이라 측량하는 눈으로 볼 만하다.","philosophy":"","genesis":"","civilizationalShift":"왕의 요새가 1934년 시민의 박물관이 됐고, 몰수된 수도원의 소장품이 공공 컬렉션으로 흘러들었다. 1669년의 용암은 사람이 아니라 화산이 도시 지형을 다시 그린 사건이다.","artMovement":"슈바벤 왕조 시기의 고딕 성채(위키 표현).","graphicLink":""},"src":["https://it.wikipedia.org/wiki/Castello%20Ursino","https://en.wikipedia.org/wiki/Castello%20Ursino","https://en.wikivoyage.org/wiki/Catania"],"unv":["성이 원래 바닷가 절벽 위에 있었다는 통설(이번에 읽은 출처로는 확인 못 함)","개관 시간과 요금(위키보야지 2차 출처만 있음, 시청 사이트는 접속 거부)","영문 위키가 소장품으로 적은 엘 그레코·카라바조 작품이 실제로 전시 중인지"]},"k-duomo":{"title":"생선시장 · 포르타 우체다 · 두오모 광장","short":"생선시장과 두오모","local":"La Pescheria · Porta Uzeda · Piazza del Duomo","city":"카타니아","f":{"history":"생선시장은 알론초 디 베네데토 광장(Piazza Alonzo di Benedetto) 일대, 마리나 아치(Archi della Marina)를 마주한 16세기 터널 아래에 선다. 적어도 19세기 초부터 생선 좌판이 이 자리를 차지했다. 원래 작은 어항이던 곳을 메워 광장으로 만들었다.","humanities":"대성당 안에는 1876년 10월 23일 파리 페르라셰즈 묘지에서 옮겨온 벨리니의 유해와, 조반 바티스타 타사라(Giovanni Battista Tassara)가 만든 기념비가 있다.","people":"바카리니가 대성당 정면(1734~1761)과 코끼리 분수(Fontana dell'Elefante)를 만들었다. 분수는 고대 용암석 코끼리 조각 위에 이집트풍 오벨리스크를 얹은 것이다.","architecture":"대성당은 1086~1094년 노르만 백작 루제로 1세(Ruggero I)의 후원으로 로마 목욕탕 폐허 위에 지어졌다. 1693년 지진 뒤 후진부와 정면만 남았고, 커다란 용암석 블록으로 쌓은 노르만 후진은 대주교관 안뜰에서 지금도 보인다. 광장 아래 4~5세기 로마 목욕탕 테르메 아킬리아네에는 교차 볼트 중앙실과 포도 덩굴 무늬 채색 스투코가 남아 있다.","philosophy":"","genesis":"시장 옆 포르타 우체다는 1695년에 세운 문이다. 지금은 교구 박물관 테라스로 그 위를 걸으며 「바로크 도시와 에트나와 바다」를 한 번에 내려다본다(박물관 설명).","civilizationalShift":"로마 목욕탕 위에 노르만 성당이, 그 위에 바로크 정면과 광장이 있다. 한 지점에 세 시대가 수직으로 겹쳐 있다. 메운 어항 자리에서는 지금도 아침마다 생선이 팔린다.","artMovement":"대성당 정면은 바카리니의 시칠리아 후기 바로크다.","graphicLink":""},"src":["https://it.wikipedia.org/wiki/Pescheria%20di%20Catania","https://it.wikipedia.org/wiki/Cattedrale%20di%20Sant%27Agata%20(Catania)","https://it.wikipedia.org/wiki/Terme%20Achilliane","https://it.wikipedia.org/wiki/Giovanni%20Battista%20Vaccarini","http://museodiocesanocatania.com/page/it-IT/3/terrazze-panoramiche","https://www.museodiocesanocatania.com/"],"unv":["생선시장의 정확한 개장·폐장 시각","교구 박물관의 2026년 10월 개관 시간과 테라스 요금(사이트에는 2025년 여름 시간만 있음)","테르메 아킬리아네를 10월에 실제로 볼 수 있는지(위키: 일요일 휴무, 요청 시 유료, 이력상 폐쇄가 잦았음)","코끼리 분수를 만든 해"]},"k-teatro":{"title":"카타니아 로마 극장","short":"로마 극장","local":"Teatro Romano di Catania","city":"카타니아","f":{"history":"그리스 시대 극장 자리를 2세기에 로마식으로 크게 다시 지었다(하드리아누스의 자금이었을 수 있다는 설이 있다). 발굴은 1773년, 1884년, 1919~1920년, 1950년대, 1980~1981년, 1998~2008년, 2014~2015년에 걸쳐 여러 번 이뤄졌다.","humanities":"","people":"","architecture":"관람석(카베아) 지름은 98m이고, 한 학자는 수용 인원을 7천 명으로 추정했다. 크고 네모난 용암석 블록으로 지었고, 동쪽에 소극장 오데온(Odeon)이 붙어 있다. 수백 년 동안 그 위에 집이 들어섰고, 18세기의 카사 델란드로네(Casa dell'Androne) 같은 건물이 지금도 관람석을 감싸고 있다.","philosophy":"","genesis":"","civilizationalShift":"공공의 극장이 중세와 근대에 주택의 기초가 됐다가 발굴로 다시 드러났다. 유적 위에서 자란 도시의 단면을 한눈에 보는 곳이다.","artMovement":"","graphicLink":""},"src":["https://it.wikipedia.org/wiki/Teatro%20romano%20di%20Catania","https://en.wikivoyage.org/wiki/Catania"],"unv":["개관 시간과 요금(위키보야지 2차 출처만 있음, 주정부 사이트는 찾지 못함)","18세기 집들 내부를 관람 동선으로 볼 수 있는지"]},"k-pupi":{"title":"오페라 데이 푸피와 시칠리아 수레","short":"인형극과 수레","local":"Opera dei pupi · carretto siciliano — 특정 장소가 아닌 전통","city":"카타니아","f":{"history":"오페라 데이 푸피는 2001년 유네스코 「인류 구전 및 무형유산 걸작」으로 선정됐고, 2008년 인류무형유산 대표목록에 등재됐다. 동부의 카타니아 유파와 서부의 팔레르모 유파가 갈린다.","humanities":"무대 이야기는 샤를마뉴와 오를란도의 기사 이야기(카롤링거 연작)다. 같은 이야기가 수레 옆판 그림에도 그려져, 인형극과 수레가 하나의 이야기 세계를 공유한다.","people":"카타니아 유파의 초기 혁신가로 가에타노 크리미(Gaetano Crimi, 1807~1877)와 조반니 그라소(Giovanni Grasso, 1792~1863)가 꼽힌다.","architecture":"카타니아식 극장은 깊이보다 폭이 넓다. 인형을 조종하는 사람은 배경막 뒤 높은 다리 위에 선다. 인형은 110~130cm에 약 30kg이고, 무게를 버티도록 무릎이 굽지 않는다. 팔레르모 인형은 약 90cm에 5~10kg이다.","philosophy":"","genesis":"수레는 19세기부터 20세기 중반 자동차가 퍼질 때까지 일하던 운반 수단이었다.","civilizationalShift":"동력화로 일하는 수레가 사라지면서, 수레는 운반 도구에서 시칠리아를 상징하는 민속 이미지로 바뀌었다.","artMovement":"","graphicLink":"카타니아식 공연 광고판(cartelli)은 포장지에 템페라로 그리고, 제목 종이를 떼어 바꿀 수 있게 했다. 팔레르모식은 캔버스를 8칸으로 나눠 장면을 이어 그렸다. 카타니아식 수레는 에트나 용암 같은 붉은 바탕에 원근과 음영을 넣었고, 팔레르모식은 노란 바탕에 원색 기하 무늬를 쓴다. 용암석 건축의 검정과 수레의 붉은색을 정현에게 한 쌍의 색 체계로 보여 줄 수 있다."},"src":["https://it.wikipedia.org/wiki/Opera%20dei%20pupi","https://it.wikipedia.org/wiki/Carretto%20siciliano"],"unv":["2026년 10월 16일 금요일에 카타니아 시내에서 인형극 공연이나 상설 인형 전시를 볼 수 있는 곳(나폴리 형제 인형극단 Fratelli Napoli 사이트는 내용이 읽히지 않음)","카타니아 시내에 수레를 상설 전시하는 곳(확인된 수레 박물관은 아치 산탄토니오, 브론테, 테라시니, 비토리아 등 시외)"]},"tr-city":{"title":"토리노 — 도시 전체","short":"토리노","local":"Torino","city":"토리노","f":{"history":"아우구스투스 시대 식민도시 율리아 아우구스타 타우리노룸(대략 기원전 25~15년)의 직교 격자 위에 선 도시다. 1563년 에마누엘레 필리베르토가 사보이 수도를 샹베리에서 옮겼고 1578년 성의를 들여왔다. 1620년 남쪽, 1673년 동쪽으로 계획 확장을 했고, 1861~1865년 이탈리아의 첫 수도였다.","humanities":"1933년 문을 연 에이나우디 출판사(파베세·나탈리아 긴츠부르그·칼비노가 편집자로 일했다), 1919년 그람시의 『신질서』, 코르소 레 움베르토 75번지에서 평생을 산 프리모 레비. 20세기 이탈리아의 글과 생각이 도심 몇 블록 안에서 나왔다.","people":"구아리니, 유바라, 안토넬리, 링고토의 마테트루코, 몰리노, 가베티와 이솔라, 노바레세, 아르만도 테스타, 그리고 1888년의 니체.","architecture":"직교 격자와 포르티코(관광청 18km, 뮤제오토리노 12km 이상), 구아리니의 기하학 돔, 유바라의 도시 무대, 안토넬리의 벽돌 한계(몰레 167m), 네르비의 페로시멘토(토리노 에스포지치오니 1948), 링고토의 옥상 트랙이 한 도시에 겹친다.","philosophy":"니체는 1888년 이 도시를 「내가 가능한 첫 장소」라 불렀다. 데 키리코는 1939년 글에서 토리노를 「가장 깊고, 가장 수수께끼 같고, 가장 불안한 도시」라 부르고, 그 아름다움을 처음 알아챈 사람이 니체라고 썼다.","genesis":"샹베리에서 옮겨 온 궁정과 성의가 도시를 수도로 만들었고, 수도 기능을 잃은 뒤(1865) 자동차 공장이 도시를 다시 만들었다. 링고토(1923 개장)와 미라피오리(1939 개장)가 그 두 단계다.","civilizationalShift":"궁정 도시에서 통일 국가의 첫 수도로, 포드식 공장 도시로, 1982년 링고토가 멈춘 뒤 문화·서비스 도시로. 이탈리아 근대화의 단계를 한 도시가 차례로 겪었다.","artMovement":"바로크(구아리니·유바라), 리버티(1902 토리노 국제장식미술박람회), 미래파(필리아·디울게로프의 산토팔라토 1931), 아르테 포베라(1967년 셀란트, 토리노 갤러리들이 무대).","graphicLink":"네비올로 주조소(1880~1978)의 마이크로그라마·유로스타일·포르마, 아르만도 테스타의 광고, 에이나우디 표지(무나리·후버·슈타이너), 이브레아 올리베티 로고타입의 두 바젤 사람(샤빈스키 1934 · 발머 1970). 몰레 돔 위 메르츠의 피보나치 네온까지, 글자가 도시 표면에 올라온 도시다."},"src":["https://www.museotorino.it/view/s/7c1fa563b1a44e38962b9ac8e2126fd8","https://www.museotorino.it/view/s/b410be712adb462ca3d65153dba03c64","https://www.museotorino.it/view/s/4fa556f473b348e4b39656f8e4116701","https://www.museorisorgimentotorino.it/en/palazzo-carignano/","http://www.thenietzschechannel.com/correspondence/ger/nlett1888g.htm","https://fondazionedechirico.org/wp-content/uploads/2019/06/461-466-Metafisica-34","https://www.einaudi.it/la-casa-editrice/","https://en.wikipedia.org/wiki/L%27Ordine%20Nuovo","https://www.rpbw.com/project/lingotto-factory-conversion","https://productiontype.com/article/the-nebiolo-foundry-turin-1880-1978","https://a-g-i.org/design/revision-of-the-olivetti-logotype","https://it.wikipedia.org/wiki/Taverna%20del%20Santopalato","https://en.wikipedia.org/wiki/Arte%20Povera","https://it.wikipedia.org/wiki/Annibale%20Rigotti"],"unv":["포르티코 길이는 셈법에 따라 12km 이상~18km","리버티 박람회의 전시 범위는 이번에 따로 조사하지 않았다"]},"k-city":{"title":"카타니아 — 도시 전체","short":"카타니아","local":"Catania","city":"카타니아","f":{"history":"1669년 에트나 용암이 도시 성벽에 닿았고, 1693년 1월 대지진으로 인구 약 2만 명 가운데 1만 6천 명이 죽었다(위키 수치). 1694년 6월 28일 승인된 계획으로 곧고 넓은 거리의 도시가 다시 그어졌고, 2002년 「발 디 노토 후기 바로크 도시군」으로 세계유산이 됐다.","humanities":"작곡가 벨리니가 1801년 이 도시에서 태어났다. 베르가의 「카발레리아 루스티카나」는 1884년 토리노 카리냐노 극장에서 초연됐고, 데 로베르토의 소설 『총독들』(1894)은 베네딕토회 수도원을 무대로 삼았다.","people":"재건 위원회를 이끈 란차 카마스트라 공작, 대성당 정면과 코끼리 분수의 바카리니, 벨리니, 베르가, 수도원을 다시 읽은 조반카를로 데 카를로.","architecture":"검은 용암석과 흰 석회암의 후기 바로크. 크로치페리 거리 약 410m에 성당 넷이 한 벽면을 이루고, 1239년 우르시노 성은 1669년 용암에 둘러싸여 주변 지면이 약 10m 높아졌다. 로마 극장은 18세기 집들이 관람석을 감싸고 있다.","philosophy":"데 카를로의 원칙 「보존과 설계 사이에 분리는 없다」 — 옛 건물을 여러 시대의 층이 읽히는 서사로 다뤘다.","genesis":"화산과 지진이 두 번 지운 도시가 위원회 문서(1694년 계획)로 다시 그어졌다. 도시의 꼴이 행정 결정으로 정해진 드문 예다.","civilizationalShift":"1713년 위트레흐트 조약으로 사보이가 시칠리아를 얻어 처음 왕이 되었고(1720년 사르데냐와 맞바꿈), 1860년 국민투표로 토리노의 왕국에 편입됐다. 1866년 교회재산 몰수로 수도원이 국가로, 1977년 대학으로 넘어갔다.","artMovement":"시칠리아 후기 바로크(로마 카를로 폰타나 학파의 바카리니), 그리고 팀 텐의 데 카를로가 얹은 전후 이탈리아 건축의 비판적 계보.","graphicLink":"카타니아 유파 인형극(오페라 데이 푸피)의 공연 광고판은 포장지에 템페라로 그리고, 카타니아식 수레는 에트나 용암 같은 붉은 바탕을 쓴다. 용암석 도시의 검정과 수레의 빨강을 한 쌍의 색으로 볼 수 있다. 시내에서 확인된 인쇄 전시는 에밀리오 그레코 판화관뿐이다."},"src":["https://it.wikipedia.org/wiki/Terremoto%20del%20Val%20di%20Noto%20del%201693","https://it.wikipedia.org/wiki/Via%20dei%20Crociferi","https://it.wikipedia.org/wiki/Castello%20Ursino","https://it.wikipedia.org/wiki/Museo%20civico%20belliniano","https://it.wikipedia.org/wiki/Giovanni%20Verga","https://it.wikipedia.org/wiki/I%20Vicer%C3%A8","https://www.monasterodeibenedettini.it/giancarlo-de-carlo-monastero/","https://it.wikipedia.org/wiki/Plebiscito%20delle%20province%20siciliane%20del%201860","https://it.wikipedia.org/wiki/Opera%20dei%20pupi","https://it.wikipedia.org/wiki/Carretto%20siciliano"],"unv":["시내 인형극 공연·수레 상설 전시처","에밀리오 그레코 판화관 개관 시간"]}}};
</script>
<script>
(function(){
"use strict";
var D=DATA, S=D.stories, O=D.options;
var mq=window.matchMedia("(min-width:980px)");
var state={tab:"cmp",opt:"o3",day:{},essay:"o3",open:null};
try{var sv=JSON.parse(localStorage.getItem("turin-three-v1")||"{}");if(sv&&sv.tab){state.tab=sv.tab;state.opt=sv.opt||state.opt;state.essay=sv.essay||state.essay;state.day=sv.day||{};}}catch(e){}
function save(){try{localStorage.setItem("turin-three-v1",JSON.stringify({tab:state.tab,opt:state.opt,essay:state.essay,day:state.day}));}catch(e){}}
function el(t,c,h){var x=document.createElement(t);if(c)x.className=c;if(h!=null)x.innerHTML=h;return x;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function opt(id){for(var i=0;i<O.length;i++)if(O[i].id===id)return O[i];return O[0];}
function chf(v){return "CHF "+Math.round(v).toLocaleString("ko-KR");}
function krw(v){return Math.round(v/1000).toLocaleString("ko-KR")+"천 원";}

/* 테마 */
var tb=document.getElementById("themebtn"), themes=["auto","light","dark"], tnames={auto:"자동",light:"밝게",dark:"어둡게"};
var theme="auto";try{theme=localStorage.getItem("yhl-theme")||"auto";}catch(e){}
function applyTheme(){if(theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",theme);tb.textContent=tnames[theme];}
tb.addEventListener("click",function(){theme=themes[(themes.indexOf(theme)+1)%3];try{localStorage.setItem("yhl-theme",theme);}catch(e){}applyTheme();});
applyTheme();

document.getElementById("topsub").textContent=D.meta.sub;

/* 탭 */
var TABS=[{id:"cmp",h:"한눈에"}].concat(O.map(function(o){return {id:o.id,h:esc(o.no)+'<span class="tl"> '+esc(o.short)+'</span>',dot:o.id};})).concat([{id:"essay",h:"소논문"},{id:"rec",h:"추천"}]);
var tabsEl=document.getElementById("tabs"), main=document.getElementById("main");
TABS.forEach(function(t){
  var b=el("button","tab",(t.dot?'<span class="dot" style="background:var(--'+t.dot+')"></span>':"")+t.h);
  b.type="button";b.setAttribute("role","tab");b.dataset.tab=t.id;
  b.addEventListener("click",function(){go(t.id);});
  tabsEl.appendChild(b);
});
function go(tab,optId,dayId,rowKey){
  state.tab=tab;
  if(optId)state.opt=optId;
  if(O.some(function(o){return o.id===tab;}))state.opt=tab;
  if(dayId)state.day[state.opt]=dayId;
  state.open=rowKey||null;
  save();render();
  if(rowKey){setTimeout(function(){var r=document.querySelector('[data-key="'+rowKey+'"]');if(r)r.scrollIntoView({block:"center"});},30);}
  else window.scrollTo(0,0);
}
function render(){
  [].forEach.call(tabsEl.children,function(b){b.setAttribute("aria-selected",b.dataset.tab===state.tab?"true":"false");});
  main.innerHTML="";
  if(state.tab==="cmp")renderCmp();
  else if(state.tab==="essay")renderEssay();
  else if(state.tab==="rec")renderRec();
  else renderOpt(opt(state.tab));
}

/* ── 한눈에 ── */
function renderCmp(){
  var C=D.compare;
  var m=el("div","mast");
  m.appendChild(el("h1",null,esc(C.title)));
  m.appendChild(el("p",null,C.lede));
  main.appendChild(m);

  /* 세 장 */
  var cards=el("div","cards");
  O.forEach(function(o){
    var c=el("div","card");
    c.appendChild(el("div","hd",'<span class="chip '+o.id+'">'+esc(o.no)+'</span><span class="nm">'+esc(o.name)+'</span>'));
    c.appendChild(el("div","big",esc(o.card.big)+"<small>"+esc(o.card.bigUnit)+"</small>"));
    o.card.lines.forEach(function(l){c.appendChild(el("div","ln",l));});
    var b=el("button","pill","이 안 열기");b.type="button";b.addEventListener("click",function(){go(o.id);});c.appendChild(b);
    cards.appendChild(c);
  });
  main.appendChild(cards);

  /* 한 장 표 */
  main.appendChild(el("div","k",esc(C.table.title)+'<span class="c">'+esc(C.table.stamp)+'</span>'));
  main.appendChild(tableEl(C.table,"wide"));
  if(C.table.note)main.appendChild(el("p","note",C.table.note));

  /* 스케줄 */
  main.appendChild(el("div","k","스케줄 비교 — 금 04시부터 일 24시까지<span class=\"c\">68시간</span>"));
  main.appendChild(el("p","note",C.ganttNote));
  main.appendChild(gantt());
  main.appendChild(el("div","legend",'<span><i class="lg-air"></i>비행·공항·이동</span><span><i class="lg-o1"></i>함부르크</span><span><i class="lg-o2"></i>'+esc(opt("o2").short)+'</span><span><i class="lg-turin"></i>토리노</span><span><i class="lg-survey"></i>체르토사 답사</span><span><i class="lg-sleep"></i>잠</span>'));
  main.appendChild(tableEl(C.hours,"mid"));

  /* 가격 */
  main.appendChild(el("div","k","가격 비교 — 2인 합계<span class=\"c\">CHF</span>"));
  main.appendChild(el("p","note",C.priceNote));
  main.appendChild(priceChart());
  main.appendChild(el("div","legend",'<span><i class="lg-bar1"></i>항공 2인</span><span><i class="lg-bar2"></i>숙박 2박(1실)</span><span><i class="lg-bar3"></i>공항·시내 이동 2인</span>'));
  main.appendChild(tableEl(C.price,"mid"));

  /* 여정 */
  main.appendChild(el("div","k","여정 비교 — 어디를 언제 보나<span class=\"c\">"+C.matrix.rows.length+"곳</span>"));
  main.appendChild(el("p","note",C.matrixNote));
  main.appendChild(tableEl(C.matrix,"mid"));

  /* 파리 */
  var P=D.pace;
  main.appendChild(el("div","k",esc(P.title)+'<span class="c">2026-09-08~10</span>'));
  var pc=el("div","pace");
  P.stats.forEach(function(s){pc.appendChild(el("div",null,'<div class="v">'+esc(s.v)+'</div><div class="l">'+s.l+'</div>'));});
  main.appendChild(pc);
  P.paras.forEach(function(t){main.appendChild(el("p","note",t));});
}
function tableEl(T,cls){
  var w=el("div","tbl "+(cls||""));
  var t=el("table"),th=el("thead"),tr=el("tr");
  T.cols.forEach(function(c,i){var h=el("th",null,esc(c));if(T.colw&&T.colw[i])h.style.minWidth=T.colw[i]+"px";tr.appendChild(h);});
  th.appendChild(tr);t.appendChild(th);
  var tb=el("tbody");
  T.rows.forEach(function(r){
    var row=el("tr");

/* 스케줄 도표 */
function gantt(){
  var W=680,L=64,R=10,top=24,bh=26,gap=16,H=top+O.length*(bh+gap)+14;
  var x0=4,x1=72,sx=function(h){return L+(h-x0)/(x1-x0)*(W-L-R);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="세 안의 사흘 시간표 막대">';
  [[4,"금"],[24,"토"],[48,"일"]].forEach(function(d){var x=sx(Math.max(d[0],x0));s+='<text x="'+(x+3)+'" y="12" class="lab">'+d[1]+'</text>';});
  for(var h=6;h<=72;h+=6){var x=sx(h);if(h%24===0)s+='<line class="dayline" x1="'+x+'" y1="16" x2="'+x+'" y2="'+(H-10)+'"/>';else s+='<line class="axis" x1="'+x+'" y1="18" x2="'+x+'" y2="'+(H-10)+'"/><text x="'+(x-6)+'" y="'+(H)+'">'+(h%24)+'</text>';}
  O.forEach(function(o,i){
    var y=top+i*(bh+gap);
    s+='<text x="0" y="'+(y+bh/2+4)+'" class="lab">'+esc(o.no)+' '+esc(o.short)+'</text>';
    o.gantt.forEach(function(g){
      var a=sx(Math.max(g[0],x0)),b=sx(Math.min(g[1],x1));if(b<=a)return;
      s+='<rect class="k-'+g[2]+'" data-t="'+esc(o.no+" · "+(g[3]||""))+'" x="'+a.toFixed(1)+'" y="'+y+'" width="'+(b-a).toFixed(1)+'" height="'+bh+'" rx="2" style="cursor:pointer"><title>'+esc(g[3]||"")+'</title></rect>';
    });
  });
  s+='</svg>';
  var box=el("div"),w=el("div","chart"),tip=el("div","gtip","막대를 누르면 그 구간 설명이 여기에 뜬다.");w.innerHTML=s;
  w.addEventListener("click",function(e){var t=e.target&&e.target.getAttribute&&e.target.getAttribute("data-t");if(t)tip.textContent=t;});
  box.appendChild(w);box.appendChild(tip);return box;
}
/* 가격 도표 */
function priceChart(){
  var W=680,L=64,R=90,top=8,bh=22,gap=18,H=top+O.length*(bh+gap)+22;
  var max=0;O.forEach(function(o){var t=o.cost.air2+o.cost.hotel2+o.cost.local2;if(t>max)max=t;});
  max=Math.ceil(max/250)*250;
  var sx=function(v){return L+v/max*(W-L-R);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="세 안의 2인 비용 막대">';
  for(var v=0;v<=max;v+=250){var x=sx(v);s+='<line class="axis" x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+(H-16)+'"/><text x="'+(x-10)+'" y="'+(H-2)+'">'+v+'</text>';}
  O.forEach(function(o,i){
    var y=top+i*(bh+gap),acc=0;
    s+='<text x="0" y="'+(y+bh/2+4)+'" class="lab">'+esc(o.no)+' '+esc(o.short)+'</text>';
    [["air2","bar1","항공 2인"],["hotel2","bar2","숙박"],["local2","bar3","공항·시내 이동"]].forEach(function(p){
      var v=o.cost[p[0]];var a=sx(acc),b=sx(acc+v);
      s+='<rect class="k-'+p[1]+'" x="'+a.toFixed(1)+'" y="'+y+'" width="'+Math.max(0,b-a).toFixed(1)+'" height="'+bh+'"><title>'+p[2]+' CHF '+Math.round(v)+'</title></rect>';acc+=v;
    });
    s+='<text x="'+(sx(acc)+6)+'" y="'+(y+bh/2+4)+'" class="lab">'+Math.round(acc).toLocaleString("ko-KR")+'</text>';
  });
  s+='</svg>';
  var w=el("div","chart");w.innerHTML=s;return w;
}

function storyEl(sid,optId,side){

function findRow(o,sid){
  for(var i=0;i<o.days.length;i++){var d=o.days[i];for(var j=0;j<d.rows.length;j++){if(d.rows[j].s===sid)return {day:d.id,dtab:d.tab,t:d.rows[j].t,key:o.id+"-"+d.id+"-"+j};}}
  return null;
}
function findAny(sid){for(var i=0;i<O.length;i++){var r=findRow(O[i],sid);if(r){r.o=O[i];return r;}}return null;}
