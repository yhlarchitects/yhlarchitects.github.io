<script>(()=>{
'use strict';
const root=document.getElementById('notebook');
const page=document.getElementById('page');
const data=JSON.parse(document.getElementById('lesson-data').textContent);
const storageKey='language-notebook-design-v1';
const lessonDate='2026-10-01';
const sections=[['structure','구조'],['reading','읽기'],['cards','카드'],['speaking','말하기'],['writing','쓰기']];

const course={
 structure:{title:'문장 구조',goal:'Ich와 bin의 자리, 형태를 먼저 확인합니다.'},
 reading:{title:'원문 읽기',goal:'이웃과의 대화에서 배운 문장을 읽습니다.'},
 cards:{title:'문장 카드',goal:'읽은 대화에 나온 표현을 떠올립니다.'},
 speaking:{title:'듣기·말하기',goal:'대화를 듣고 자신의 이름으로 답합니다.'},
 writing:{title:'한 문장 쓰기',goal:'강좌 접수 상황에 맞춰 직접 씁니다.'}
};
const validViews=['home',...sections.map(x=>x[0]),'calendar','notes'];
let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')||{};}catch{}
let person=['yeonho','junghyun'].includes(saved.person)?saved.person:'yeonho';
let view=validViews.includes(location.hash.slice(1))?location.hash.slice(1):'home';
let cardIndex=0,flipped=false,rate=.9,quizAnswers={},readingAnswers={};
let timerId=null,timerRemaining=60,toastTimer=null,draftTimer=null;
let calendarMonth=9,calendarYear=2026,selectedDate=lessonDate;
let speechActive=false,speechGeneration=0;
const state=()=>{if(!saved[person]||typeof saved[person]!=='object')saved[person]={};const s=saved[person];s.done=s.done&&typeof s.done==='object'?s.done:{};s.seen=Array.isArray(s.seen)?s.seen:[];s.notes=s.notes&&typeof s.notes==='object'?s.notes:{};return s;};
const lesson=()=>person==='junghyun'?data.junghyun:data.base;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){saved.person=person;try{localStorage.setItem(storageKey,JSON.stringify(saved));return true;}catch{toast('이 브라우저에서는 저장할 수 없습니다.');return false;}}
function toast(message){const e=document.querySelector('.toast');e.textContent=message;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3000);}
function count(){return ['cards','reading','speaking','writing'].filter(k=>state().done[k]).length;}
function complete(key){state().done[key]=true;persist();updateChrome();}
function cancelSpeech(){speechGeneration++;if('speechSynthesis'in window)window.speechSynthesis.cancel();speechActive=false;}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function lessonStamp(){return `<div class="lesson-stamp"><a class="lesson-date" data-lesson-date href="#calendar" aria-label="10월 1일 학습 달력 열기" lang="de">1. Oktober 2026</a><span class="lesson-topic">${esc(lesson().theme)}</span></div>`;}
function header(n,title,subtitle=''){return `<div class="page-top"><div class="kicker">${lessonStamp()}</div><h1>${title}</h1>${subtitle?`<p>${subtitle}</p>`:''}</div>${tabs()}`;}
function tabs(){return `<nav class="study-tabs" aria-label="학습 항목">${sections.map(([id,label])=>`<a href="#${id}" ${view===id?'aria-current="page"':''}>${label}</a>`).join('')}</nav>`;}
function next(){return '';}
function updateChrome(){document.getElementById('person').value=person;document.querySelectorAll('[data-view]').forEach(a=>{if(a.dataset.view===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
function home(){const s=state();return `<div class="home-spread"><section class="cover"><div class="kicker">${lessonStamp()}</div><div class="home-expression"><div class="expression-label">학습 문장</div><h1 class="home-sentence" lang="de"><span>Ich bin</span><span>neu hier.</span></h1><p class="sentence-meaning">저는 이곳에 새로 왔어요.</p></div></section><section class="home-index" aria-label="학습 순서"><div class="index-heading">학습 순서</div><nav class="course-list">${sections.map(([id])=>`<a href="#${id}" class="course-row"><span class="course-title">${course[id].title}</span><span class="course-goal">${course[id].goal}</span>${s.done[id]?'<span class="course-state">완료</span>':''}</a>`).join('')}</nav></section></div>`;}
function cards(){const c=lesson().cards[cardIndex];return header('01','문장 카드','카드를 누르면 뜻이 보입니다.')+`<div class="study-content"><div class="two-pages"><section><div class="card-topline"><span>인사와 이름</span><span>${String(cardIndex+1).padStart(2,'0')} / ${String(lesson().cards.length).padStart(2,'0')}</span></div><button type="button" class="flashcard" id="flip-card" data-flipped="${flipped}" aria-label="${flipped?'독일어 표현 보기':'한국어 뜻 보기'}" aria-pressed="${flipped}"><span class="card-tag">${flipped?'뜻 / BEDEUTUNG':'표현 / AUSDRUCK'}</span><span class="card-main ${flipped?'ko':''}" ${flipped?'':'lang="de"'}>${esc(flipped?c.ko:c.de)}</span><span class="card-bottom"><span>${flipped?'한 번 더 눌러 표현 보기':'눌러서 뜻 확인하기'}</span></span></button><div class="card-controls"><button type="button" data-card="-1" ${cardIndex===0?'disabled':''} aria-label="이전 카드">이전</button><span>${String(cardIndex+1).padStart(2,'0')} / ${String(lesson().cards.length).padStart(2,'0')}</span><button type="button" data-card="1" ${cardIndex===lesson().cards.length-1?'disabled':''} aria-label="다음 카드">다음</button></div></section><aside class="empty-side"><div><div class="rule-line"><div class="label">문장 속에서는</div><p class="example" lang="de">${esc(c.exde)}</p><p class="translation">${esc(c.exko)}</p></div>${c.note?`<div class="rule-line"><div class="label">참고</div><p class="small-copy">${esc(c.note)}</p></div>`:''}<div class="memory-controls"><button type="button" data-memory="again" ${!flipped?'disabled':''}>한 번 더 볼게요</button><button type="button" data-memory="known" ${!flipped?'disabled':''}>기억했어요</button></div><div class="progress-row"><span>뜻을 확인한 표현</span><span>${state().seen.length} / 5</span></div></div>${next('reading','다음 학습 원문 읽기')}</aside></div></div>`;}

function structure(){const s=lesson().structure;return header('01','왜 Ich 뒤에 bin이 올까요?')+`<div class="study-content"><section class="structure-sheet"><p class="structure-first-rule">${esc(s.rules[0])}</p><h2 class="structure-equation" lang="de"><span class="blue">Ich</span> <span class="red">bin</span><br><span>neu hier.</span></h2><div class="structure-grid">${s.skeleton.slots.map((slot,i)=>`<div class="slot"><strong lang="de" class="${i===0?'blue':i===1?'red':''}">${esc(slot.de)}</strong><span>${esc(slot.role)}</span><small>${esc(slot.note)}</small></div>`).join('')}</div></section><div class="two-pages"><section><ol class="structure-rules">${s.rules.slice(1).map(r=>`<li>${esc(r)}</li>`).join('')}</ol><div class="rule-line" style="margin-top:24px"><h2 class="section-label">영어와 비교</h2><p class="english-pair"><span lang="en">I am.</span><span lang="de">Ich bin.</span></p><p class="small-copy">${esc(s.english)}</p></div></section><aside><h2 class="section-label">형태</h2><dl class="forms-list">${s.forms.map(f=>`<div><dt lang="de">${esc(f.de)}</dt><dd>${esc(f.why)}</dd></div>`).join('')}</dl></aside></div></div>`;}

function calendar(){const monthTitle=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(calendarYear,calendarMonth,1)));const offset=(new Date(Date.UTC(calendarYear,calendarMonth,1)).getUTCDay()+6)%7;const days=new Date(Date.UTC(calendarYear,calendarMonth+1,0)).getUTCDate();const s=state();let cells=Array(offset).fill('<span class="day empty" aria-hidden="true"></span>');for(let day=1;day<=days;day++){const date=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const hasNote=!!s.notes[date];cells.push(`<button type="button" class="day ${selectedDate===date?'selected':''} ${hasNote?'has-note':''}" data-date="${date}" aria-pressed="${selectedDate===date}" aria-label="${calendarMonth+1}월 ${day}일${hasNote?', 저장한 문장 있음':''}">${day}</button>`);}while(cells.length%7)cells.push('<span class="day empty" aria-hidden="true"></span>');const isLesson=selectedDate===lessonDate;return `<div class="page-top archive-top"><h1>학습 달력</h1></div><div class="study-content"><div class="two-pages"><section><div class="calendar-tools"><button type="button" data-month="-1" aria-label="이전 달">이전 달</button><h2 lang="de">${esc(monthTitle)}</h2><button type="button" data-month="1" aria-label="다음 달">다음 달</button></div><div class="calendar-grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<span class="weekday" lang="de">${d}</span>`).join('')}${cells.join('')}</div></section><aside><div class="section-label">선택한 날</div><h2 class="record-date" lang="de">${Number(selectedDate.slice(8))}. ${esc(new Intl.DateTimeFormat('de-DE',{month:'long',timeZone:'UTC'}).format(new Date(selectedDate+'T00:00:00Z')))}</h2><div class="record-detail">${isLesson?`<p>인사와 이름 · ${count()} / 4 완료</p>${[['cards','문장 카드'],['reading','원문 읽기'],['speaking','소리 내기'],['writing','한 문장 쓰기']].map(([id,label])=>`<div class="record-item"><span>${label}</span><span>${s.done[id]?'완료':'아직'}</span></div>`).join('')}`:'<p>아직 남긴 기록이 없어요.</p>'}${s.notes[selectedDate]?`<p class="record-note" lang="de">${esc(s.notes[selectedDate])}</p>`:''}</div>${isLesson?next('writing','이날의 문장 이어 쓰기'):next('home','시작 화면으로')}</aside></div></div>`;}
function noteEntries(search=''){const entries=Object.entries(state().notes).map(([date,text])=>({date,text,kind:'writing'}));if(state().readingMemo)entries.push({date:lessonDate,text:state().readingMemo,kind:'reading'});const filtered=entries.filter(x=>typeof x.text==='string'&&x.text.toLocaleLowerCase().includes(search.toLocaleLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return filtered.length?filtered.map(({date,text,kind})=>`<article class="note-entry"><header><span>${esc(date.replaceAll('-','.'))}</span><span>${kind==='reading'?'읽기 메모':'한 문장 쓰기'}</span></header><p ${kind==='writing'?'lang="de"':'class="memo-copy"'}>${esc(text)}</p><a href="#${kind}">${kind==='reading'?'읽기 메모':'이 문장'} 이어 쓰기</a></article>`).join(''):'<p class="small-copy" style="padding:24px 0">검색한 문장이 없어요.</p>';}

function continuation(){const i=sections.findIndex(([id])=>id===view);if(i<0)return '';const target=sections[i+1]?.[0]||'notes';const item=course[target]||{title:'내 문장·메모',goal:'작성한 문장과 메모를 확인합니다.'};return `<section class="lesson-continuation"><div class="continuation-copy"><p class="continuation-label">${target==='notes'?'학습 기록':'다음 학습'}</p><h2>${item.title}</h2><p>${item.goal}</p></div><a class="continue-link" href="#${target}">${target==='notes'?'저장한 문장 보기':item.title+' 이어가기'}</a></section>`;}

function flip(){flipped=!flipped;if(flipped&&!state().seen.includes(cardIndex)){state().seen.push(cardIndex);if(state().seen.length===lesson().cards.length)complete('cards');else persist();}render();document.getElementById('flip-card').focus({preventScroll:true});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('flip-card').animate([{transform:'perspective(900px) rotateY(-8deg)',opacity:.7},{transform:'perspective(900px) rotateY(0)',opacity:1}],{duration:220,easing:'ease-out'});}

function getVoice(){if(!('speechSynthesis'in window))return null;const list=window.speechSynthesis.getVoices().filter(v=>/^de[-_]/i.test(v.lang));const score=v=>(/^de[-_]DE$/i.test(v.lang)?100:0)+(/premium|siri/i.test(v.name+' '+v.voiceURI)?30:/enhanced|natural|neural|wavenet|online/i.test(v.name+' '+v.voiceURI)?20:/eloquence/i.test(v.name+' '+v.voiceURI)?-20:0)+(v.localService?10:0)+(v.default?1:0);return list.sort((a,b)=>score(b)-score(a))[0]||null;}

function listen(){if(speechActive){cancelSpeech();const b=document.getElementById('listen');if(b)b.innerHTML='대화 듣기';return;}const voice=getVoice();if(!voice){toast('기기에 독일어 음성이 있어야 들을 수 있어요.');return;}cancelSpeech();const generation=speechGeneration;const utterance=new SpeechSynthesisUtterance(lesson().practice.listen.text_de);utterance.lang='de-DE';utterance.voice=voice;utterance.rate=rate;const restore=()=>{if(generation!==speechGeneration)return false;speechActive=false;const b=document.getElementById('listen');if(b)b.innerHTML='대화 듣기';return true;};utterance.onend=restore;utterance.onerror=e=>{if(!restore())return;if(e.error==='canceled'||e.error==='interrupted')return;updateVoiceStatus();toast('음성을 재생하지 못했어요.');};speechActive=true;window.speechSynthesis.speak(utterance);const b=document.getElementById('listen');if(b)b.innerHTML='재생 멈추기';}

function bind(){

function setMenuOpen(open,restoreFocus=true){

 }else{

function setupMenu(){
