let view=validViews.includes(location.hash.slice(1))?location.hash.slice(1):'home';
let cardIndex=0,flipped=false,rate=.9,quizAnswers={},readingAnswers={};
let timerId=null,timerRemaining=60,toastTimer=null,draftTimer=null;
let calendarMonth=9,calendarYear=2026,selectedDate=lessonDate;
let speechActive=false,speechGeneration=0;
const state=()=>{if(!saved[person]||typeof saved[person]!=='object')saved[person]={};const s=saved[person];s.done=s.done&&typeof s.done==='object'?s.done:{};s.seen=Array.isArray(s.seen)?s.seen:[];s.notes=s.notes&&typeof s.notes==='object'?s.notes:{};return s;};
const lesson=()=>person==='junghyun'?data.junghyun:data.base;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){saved.person=person;try{localStorage.setItem(storageKey,JSON.stringify(saved));return true;}catch{toast('이 브라우저에서는 저장할 수 없습니다.');return false;}}
function toast(message){const e=document.querySelector('.toast');e.textContent=message;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3000);}
function count(){return ['cards','reading','speaking','writing'].filter(k=>state().done[k]).length;}
function complete(key){state().done[key]=true;persist();updateChrome();}
function cancelSpeech(){speechGeneration++;if('speechSynthesis'in window)window.speechSynthesis.cancel();speechActive=false;}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function lessonStamp(){return `<div class="lesson-stamp"><a class="lesson-date" data-lesson-date href="#calendar" aria-label="10월 1일 학습 달력 열기" lang="de">1. Oktober 2026 <span aria-hidden="true">↗</span></a><span class="lesson-topic">${esc(lesson().theme)}</span></div>`;}

function tabs(){return `<nav class="study-tabs" aria-label="학습 항목">${sections.map(([id,label])=>`<a href="#${id}" ${view===id?'aria-current="page"':''}>${label}</a>`).join('')}</nav>`;}

function updateChrome(){document.getElementById('person').value=person;document.querySelectorAll('[data-view]').forEach(a=>{if(a.dataset.view===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
function home(){const s=state();return `<div class="home-spread"><section class="cover"><div class="kicker">${lessonStamp()}<span>10분</span></div><div class="home-expression"><div class="expression-label">학습 문장</div><h1 class="home-sentence" lang="de"><span>Ich bin</span><span>neu hier.</span></h1><p class="sentence-meaning">저는 이곳에 새로 왔어요.</p></div><a class="sentence-structure" href="#structure"><span>문장 구조 보기</span><span aria-hidden="true">↗</span></a></section><section class="home-index" aria-label="학습 항목"><div class="index-heading"><span>학습 항목</span><span>${count()} / 4</span></div><div class="index-grid">${[['cards','Aa','문장 카드','표현 5개'],['reading','≡','원문 읽기','대화'],['speaking','〰','듣기·말하기','대화 연습'],['writing','[ ]','한 문장 쓰기','작문']].map(([id,glyph,label,meta])=>`<a class="index-tile" href="#${id}"><span class="symbol" aria-hidden="true">${glyph}</span><span class="tile-label"><span>${label}</span><small>${s.done[id]?'완료 ✓':meta}</small></span></a>`).join('')}</div></section></div>`;}
function cards(){const c=lesson().cards[cardIndex];return header('01','문장 카드','카드를 누르면 뜻이 보입니다.')+`<div class="study-content"><div class="two-pages"><section><div class="card-topline"><span>인사와 이름</span><span>${String(cardIndex+1).padStart(2,'0')} / ${String(lesson().cards.length).padStart(2,'0')}</span></div><button type="button" class="flashcard" id="flip-card" data-flipped="${flipped}" aria-label="${flipped?'독일어 표현 보기':'한국어 뜻 보기'}" aria-pressed="${flipped}"><span class="card-tag">${flipped?'뜻 / BEDEUTUNG':'표현 / AUSDRUCK'}</span><span class="card-main ${flipped?'ko':''}" ${flipped?'':'lang="de"'}>${esc(flipped?c.ko:c.de)}</span><span class="card-bottom"><span>${flipped?'한 번 더 눌러 표현 보기':'눌러서 뜻 확인하기'}</span><span class="flip-sign" aria-hidden="true">↻</span></span></button><div class="card-controls"><button type="button" data-card="-1" ${cardIndex===0?'disabled':''} aria-label="이전 카드">←</button><span>${String(cardIndex+1).padStart(2,'0')} / ${String(lesson().cards.length).padStart(2,'0')}</span><button type="button" data-card="1" ${cardIndex===lesson().cards.length-1?'disabled':''} aria-label="다음 카드">→</button></div></section><aside class="empty-side"><div><div class="rule-line"><div class="label">문장 속에서는</div><p class="example" lang="de">${esc(c.exde)}</p><p class="translation">${esc(c.exko)}</p></div>${c.note?`<div class="rule-line"><div class="label">참고</div><p class="small-copy">${esc(c.note)}</p></div>`:''}<div class="memory-controls"><button type="button" data-memory="again" ${!flipped?'disabled':''}>한 번 더 볼게요</button><button type="button" data-memory="known" ${!flipped?'disabled':''}>기억했어요</button></div><div class="progress-row"><span>뜻을 확인한 표현</span><span>${state().seen.length} / 5</span></div></div>${next('reading','다음 장 · 원문 읽기')}</aside></div></div>`;}
function reading(){const r=lesson().reading.layers[0];const lines=r.lines;const blocks=[lines.slice(1,4),lines.slice(4,7),lines.slice(7,9),lines.slice(9,10),lines.slice(10,12),lines.slice(12)];return header('02','원문 읽기','대화를 읽고 이름과 성을 구별하세요.')+`<div class="study-content"><div class="two-pages"><article class="reading-text" lang="de"><p>${esc(lines[0])} / A1</p>${blocks.map(b=>`<p>${b.map(esc).join('<br>')}</p>`).join('')}<div lang="ko" class="small-copy">자체 작성 교재 · Im Treppenhaus</div></article><aside><div class="section-label">낱말 풀이</div><dl class="gloss-list">${r.gloss.map(g=>`<div><dt lang="de">${esc(g.de)}</dt><dd>${esc(g.ko)}</dd></div>`).join('')}</dl><details><summary>읽은 내용을 확인해요</summary>${r.tasks.map((q,i)=>`<section class="quiz"><h3>${esc(q.prompt)}</h3><div class="quiz-options">${q.options.map((o,j)=>`<button type="button" data-reading-quiz="${i}" data-option="${j}" aria-pressed="${readingAnswers[i]===j}">${esc(o)}</button>`).join('')}</div><div class="quiz-feedback" aria-live="polite">${readingAnswers[i]===undefined?'':readingAnswers[i]===q.answer?'맞아요.':'대화를 다시 살펴보세요.'}</div></section>`).join('')}<button class="action-button wide" id="finish-reading" ${r.tasks.every((q,i)=>readingAnswers[i]===q.answer)?'':'disabled'}>${state().done.reading?'읽기 완료 ✓':'읽기 마쳤어요'}</button></details><details><summary>읽으며 떠오른 생각</summary><textarea class="reading-memo" id="reading-memo" aria-label="읽기 메모" placeholder="기억하고 싶은 표현을 남겨요.">${esc(state().readingMemo||'')}</textarea><button class="action-button" id="save-reading">메모 저장</button></details>${next('structure','다음 장 · 문장의 구조')}</aside></div></div>`;}
function structure(){const s=lesson().structure;return header('03','왜 Ich 뒤에 bin이 올까요?')+`<div class="study-content"><section class="structure-sheet"><div class="kicker"><span>문장 구성</span><span lang="de">SATZBAU</span></div><h2 class="structure-equation" lang="de"><span class="blue">Ich</span> <span class="red">bin</span><br><span>neu hier.</span></h2><div class="structure-grid">${s.skeleton.slots.map((slot,i)=>`<div class="slot"><strong lang="de" class="${i===0?'blue':i===1?'red':''}">${esc(slot.de)}</strong><span>${esc(slot.role)}</span><small>${esc(slot.note)}</small></div>`).join('')}</div><p class="structure-note">${esc(s.rules[0])}</p></section><div class="two-pages"><section><ol class="structure-rules">${s.rules.slice(1).map(r=>`<li>${esc(r)}</li>`).join('')}</ol><div class="rule-line" style="margin-top:24px"><div class="label">영어와 나란히</div><p class="english-pair" lang="en">I am. <span aria-hidden="true">↔</span> <span lang="de">Ich bin.</span></p><p class="small-copy">${esc(s.english)}</p></div></section><aside><div class="section-label">형태</div><dl class="forms-list">${s.forms.map(f=>`<div><dt lang="de">${esc(f.de)}</dt><dd>${esc(f.why)}</dd></div>`).join('')}</dl></aside></div>${next('speaking','다음 장 · 소리 내기')}</div>`;}
function speaking(){const l=lesson().practice.listen,d=lesson().practice.dialogue;return header('04','듣기·말하기','먼저 듣고 이름과 성을 고르세요.')+`<div class="study-content"><div class="two-pages"><section><div class="sound-sheet"><div class="kicker"><span>먼저 듣기</span><span>이름과 성</span></div><div class="sound-symbol" aria-hidden="true">〰</div><button class="action-button" id="listen"><span>${speechActive?'재생 멈추기':'대화 듣기'}</span><span aria-hidden="true">${speechActive?'Ⅱ':'▷'}</span></button><div class="rate-picker"><span>읽는 빠르기</span>${[.75,.9,1].map(r=>`<button type="button" data-rate="${r}" aria-label="${r}배속" aria-pressed="${rate===r}">${r}×</button>`).join('')}</div><p class="voice-status" id="voice-status"></p><details><summary>대본 펼치기</summary><p class="model-text" lang="de">${esc(l.text_de)}</p></details></div>${l.checks.map((q,i)=>`<section class="quiz"><h3>${esc(q.prompt_ko)}</h3><div class="quiz-options">${q.options.map((o,j)=>`<button type="button" data-listen-quiz="${i}" data-option="${j}" aria-pressed="${quizAnswers[i]===j}">${esc(o)}</button>`).join('')}</div><p class="quiz-feedback" aria-live="polite">${quizAnswers[i]===undefined?'':quizAnswers[i]===q.answer?esc(q.why_ko):'다시 듣고 골라 보세요.'}</p></section>`).join('')}</section><aside><div class="section-label">대화 연습</div><p class="small-copy">${esc(d.situation_ko)}</p><p class="dialogue-quote" lang="de">${esc(d.turns[0].partner_de)}</p><p class="dialogue-cue">${esc(d.turns[0].cue_ko)}</p><div class="timer"><span class="timer-value" id="timer-value">${formatTime(timerRemaining)}</span><div class="timer-buttons"><button id="timer-toggle">${timerId?'잠시 멈춤':'연습 시작'}</button><button id="timer-reset">처음부터</button></div></div><p class="small-copy">1분 동안 인사와 이름을 소리 내어 말해 보세요.</p><details><summary>본보기 확인하기</summary><p class="model-text" lang="de">${esc(d.turns[0].model_de)}</p></details><details><summary>한 번 더 대화하기</summary><p class="dialogue-quote" lang="de">${esc(d.turns[1].partner_de)}</p><p class="dialogue-cue">${esc(d.turns[1].cue_ko)}</p><details><summary>이 대화의 본보기</summary><p class="model-text" lang="de">${esc(d.turns[1].model_de)}</p></details></details>${next('writing','다음 장 · 한 문장 쓰기')}</aside></div></div>`;}
function writing(){const w=lesson().practice.transfer,s=state();return header('05','한 문장 쓰기')+`<div class="study-content"><div class="two-pages"><section><div class="section-label">새로운 상황</div><p class="write-prompt">${esc(w.prompt_ko)}</p><div class="writing-sheet"><textarea id="writing-input" lang="de" aria-label="나의 독일어 문장" placeholder="Guten Tag!" spellcheck="false">${esc(s.draft??s.notes[lessonDate]??'')}</textarea></div><div class="write-meta"><span>앞의 문장을 보지 않고 적어 보세요.</span><span id="char-count">${(s.draft??s.notes[lessonDate]??'').length}자</span></div><div class="writing-actions"><span class="save-status" id="save-status" role="status">${s.notes[lessonDate]?'저장한 문장이 있습니다.':''}</span><button type="button" class="action-button solid" id="save-writing">문장 저장</button></div></section><aside><div class="section-label">내 문장 확인하기</div><ul class="writing-checks">${w.success_ko.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><details><summary>쓴 다음 본보기 확인하기</summary><p class="model-text" lang="de">${esc(w.model_de)}</p></details>${next('notes','내가 남긴 문장 모아보기')}</aside></div></div>`;}
function calendar(){const monthTitle=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(calendarYear,calendarMonth,1)));const offset=(new Date(Date.UTC(calendarYear,calendarMonth,1)).getUTCDay()+6)%7;const days=new Date(Date.UTC(calendarYear,calendarMonth+1,0)).getUTCDate();const s=state();let cells=Array(offset).fill('<span class="day empty" aria-hidden="true"></span>');for(let day=1;day<=days;day++){const date=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const hasNote=!!s.notes[date];cells.push(`<button type="button" class="day ${selectedDate===date?'selected':''} ${hasNote?'has-note':''}" data-date="${date}" aria-pressed="${selectedDate===date}" aria-label="${calendarMonth+1}월 ${day}일${hasNote?', 저장한 문장 있음':''}">${day}</button>`);}while(cells.length%7)cells.push('<span class="day empty" aria-hidden="true"></span>');const isLesson=selectedDate===lessonDate;return `<div class="page-top archive-top"><h1>학습 달력</h1></div><div class="study-content"><div class="two-pages"><section><div class="calendar-tools"><button type="button" data-month="-1" aria-label="이전 달">←</button><h2 lang="de">${esc(monthTitle)}</h2><button type="button" data-month="1" aria-label="다음 달">→</button></div><div class="calendar-grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<span class="weekday" lang="de">${d}</span>`).join('')}${cells.join('')}</div></section><aside><div class="section-label">선택한 날</div><h2 class="record-date" lang="de">${Number(selectedDate.slice(8))}. ${esc(new Intl.DateTimeFormat('de-DE',{month:'long',timeZone:'UTC'}).format(new Date(selectedDate+'T00:00:00Z')))}</h2><div class="record-detail">${isLesson?`<p>인사와 이름 · ${count()} / 4 완료</p>${[['cards','문장 카드'],['reading','원문 읽기'],['speaking','소리 내기'],['writing','한 문장 쓰기']].map(([id,label])=>`<div class="record-item"><span>${label}</span><span>${s.done[id]?'완료 ✓':'아직'}</span></div>`).join('')}`:'<p>아직 남긴 기록이 없어요.</p>'}${s.notes[selectedDate]?`<p class="record-note" lang="de">${esc(s.notes[selectedDate])}</p>`:''}</div>${isLesson?next('writing','이날의 문장 이어 쓰기'):next('home','시작 화면으로')}</aside></div></div>`;}
function noteEntries(search=''){const entries=Object.entries(state().notes).map(([date,text])=>({date,text,kind:'writing'}));if(state().readingMemo)entries.push({date:lessonDate,text:state().readingMemo,kind:'reading'});const filtered=entries.filter(x=>typeof x.text==='string'&&x.text.toLocaleLowerCase().includes(search.toLocaleLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return filtered.length?filtered.map(({date,text,kind})=>`<article class="note-entry"><header><span>${esc(date.replaceAll('-','.'))}</span><span>${kind==='reading'?'읽기 메모':'한 문장 쓰기'}</span></header><p ${kind==='writing'?'lang="de"':'class="memo-copy"'}>${esc(text)}</p><a href="#${kind}">${kind==='reading'?'읽기 메모':'이 문장'} 이어 쓰기 ↗</a></article>`).join(''):'<p class="small-copy" style="padding:24px 0">검색한 문장이 없어요.</p>';}
function notes(){const has=Object.keys(state().notes).length>0||!!state().readingMemo;return `<div class="page-top archive-top"><h1>내 문장·메모</h1></div><div class="study-content">${has?`<label><span class="sr-only">문장·메모 검색</span><input class="note-search" id="note-search" type="search" placeholder="문장·메모 검색"></label><div id="note-entries">${noteEntries()}</div>`:`<section class="empty-notes"><span class="symbol" aria-hidden="true">[ ]</span><h2>저장한 문장·메모가 없습니다.</h2><a class="chapter-next" href="#writing" style="width:100%"><span>한 문장 쓰기</span><span aria-hidden="true">↗</span></a></section>`}</div>`;}
function render(focus=false){const map={home,cards,reading,structure,speaking,writing,calendar,notes};page.innerHTML=map[view]();updateChrome();bind();if(view==='speaking')updateVoiceStatus();if(focus){window.scrollTo({top:0,behavior:'instant'});page.focus({preventScroll:true});}}
function go(id){if(!validViews.includes(id))id='home';setMenuOpen(false,false);if(id!==view){stopTimer();cancelSpeech();}view=id;render(true);}
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.getElementById('person').addEventListener('change',e=>{if(draftTimer){clearTimeout(draftTimer);draftTimer=null;persist();}stopTimer();cancelSpeech();person=e.target.value;cardIndex=0;flipped=false;timerRemaining=60;quizAnswers={};readingAnswers={};persist();render();});
function flip(){flipped=!flipped;if(flipped&&!state().seen.includes(cardIndex)){state().seen.push(cardIndex);if(state().seen.length===lesson().cards.length)complete('cards');else persist();}render();document.getElementById('flip-card').focus({preventScroll:true});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('flip-card').animate([{transform:'perspective(900px) rotateY(-8deg)',opacity:.7},{transform:'perspective(900px) rotateY(0)',opacity:1}],{duration:220,easing:'ease-out'});}
function moveCard(delta){cardIndex=Math.max(0,Math.min(lesson().cards.length-1,cardIndex+delta));flipped=false;render();}
function formatTime(s){return '0'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updateTimer(){const t=document.getElementById('timer-value'),b=document.getElementById('timer-toggle');if(t)t.textContent=formatTime(timerRemaining);if(b)b.textContent=timerId?'잠시 멈춤':'연습 시작';}
function toggleTimer(){if(timerId){stopTimer();updateTimer();return;}if(timerRemaining===0)timerRemaining=60;timerId=setInterval(()=>{timerRemaining--;if(timerRemaining<=0){stopTimer();complete('speaking');toast('소리 내기 연습을 마쳤어요.');}updateTimer();},1000);updateTimer();}
function getVoice(){if(!('speechSynthesis'in window))return null;const list=window.speechSynthesis.getVoices().filter(v=>/^de[-_]/i.test(v.lang));const score=v=>(/^de[-_]DE$/i.test(v.lang)?100:0)+(/premium|siri/i.test(v.name+' '+v.voiceURI)?30:/enhanced|natural|neural|wavenet|online/i.test(v.name+' '+v.voiceURI)?20:/eloquence/i.test(v.name+' '+v.voiceURI)?-20:0)+(v.localService?10:0)+(v.default?1:0);return list.sort((a,b)=>score(b)-score(a))[0]||null;}
function updateVoiceStatus(){const el=document.getElementById('voice-status');if(!el)return;const voice=getVoice();el.textContent=voice?'이 기기의 음성 · '+voice.name:'이 기기에서 독일어 음성을 찾지 못했어요.';}
function listen(){if(speechActive){cancelSpeech();const b=document.getElementById('listen');if(b)b.innerHTML='<span>대화 듣기</span><span aria-hidden="true">▷</span>';return;}const voice=getVoice();if(!voice){toast('기기에 독일어 음성이 있어야 들을 수 있어요.');return;}cancelSpeech();const generation=speechGeneration;const utterance=new SpeechSynthesisUtterance(lesson().practice.listen.text_de);utterance.lang='de-DE';utterance.voice=voice;utterance.rate=rate;const restore=()=>{if(generation!==speechGeneration)return false;speechActive=false;const b=document.getElementById('listen');if(b)b.innerHTML='<span>대화 듣기</span><span aria-hidden="true">▷</span>';return true;};utterance.onend=restore;utterance.onerror=e=>{if(!restore())return;if(e.error==='canceled'||e.error==='interrupted')return;updateVoiceStatus();toast('음성을 재생하지 못했어요.');};speechActive=true;window.speechSynthesis.speak(utterance);const b=document.getElementById('listen');if(b)b.innerHTML='<span>재생 멈추기</span><span aria-hidden="true">Ⅱ</span>';}
if('speechSynthesis'in window)window.speechSynthesis.addEventListener('voiceschanged',updateVoiceStatus);
function bind(){
 document.getElementById('flip-card')?.addEventListener('click',flip);
 const card=document.getElementById('flip-card');if(card){let down=null,suppress=false;card.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});card.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){suppress=true;moveCard(dx<0?1:-1);}});card.addEventListener('pointercancel',()=>down=null);card.addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopImmediatePropagation();suppress=false;}},true);}
 document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>moveCard(Number(b.dataset.card)));
 document.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>{if(b.dataset.memory==='again'){flipped=false;render();document.getElementById('flip-card').focus({preventScroll:true});return;}toast('표현을 확인했어요.');if(cardIndex<lesson().cards.length-1)moveCard(1);else{if(state().seen.length===lesson().cards.length)complete('cards');location.hash='reading';}});
 document.querySelectorAll('[data-reading-quiz]').forEach(b=>b.onclick=()=>{const openMemos=document.querySelector('#reading-memo')?.value;readingAnswers[b.dataset.readingQuiz]=Number(b.dataset.option);render();const detail=document.querySelector('details');detail.open=true;if(openMemos!==undefined)document.getElementById('reading-memo').value=openMemos;});
 document.getElementById('finish-reading')?.addEventListener('click',()=>{complete('reading');toast('원문 읽기를 마쳤어요.');location.hash='structure';});
 document.getElementById('save-reading')?.addEventListener('click',()=>{const text=document.getElementById('reading-memo').value.trim();if(!text){toast('메모를 먼저 적어 주세요.');return;}state().readingMemo=text;if(persist())toast('읽기 메모를 저장했어요.');});
 document.querySelectorAll('[data-listen-quiz]').forEach(b=>b.onclick=()=>{quizAnswers[b.dataset.listenQuiz]=Number(b.dataset.option);const q=lesson().practice.listen.checks[Number(b.dataset.listenQuiz)],parent=b.closest('.quiz');parent.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));parent.querySelector('.quiz-feedback').textContent=Number(b.dataset.option)===q.answer?q.why_ko:'다시 듣고 골라 보세요.';});
 document.getElementById('listen')?.addEventListener('click',listen);
 document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{rate=Number(b.dataset.rate);cancelSpeech();document.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('listen').innerHTML='<span>대화 듣기</span><span aria-hidden="true">▷</span>';});
 document.getElementById('timer-toggle')?.addEventListener('click',toggleTimer);
 document.getElementById('timer-reset')?.addEventListener('click',()=>{stopTimer();timerRemaining=60;updateTimer();});
 const input=document.getElementById('writing-input');if(input)input.addEventListener('input',()=>{const value=input.value;state().draft=value;document.getElementById('char-count').textContent=value.length+'자';document.getElementById('save-status').textContent='쓰는 중';clearTimeout(draftTimer);draftTimer=setTimeout(()=>{const ok=persist();const status=document.getElementById('save-status');if(ok&&status)status.textContent='초안을 보관했어요.';},450);});
 document.getElementById('save-writing')?.addEventListener('click',()=>{const text=input.value.trim();if(!text){toast('문장을 먼저 적어 주세요.');input.focus();return;}state().notes[lessonDate]=text;state().draft=text;state().done.writing=true;if(persist()){document.getElementById('save-status').textContent='문장을 남겼어요. ✓';toast('문장을 저장했어요.');}});
 document.getElementById('note-search')?.addEventListener('input',e=>document.getElementById('note-entries').innerHTML=noteEntries(e.target.value));
 document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{calendarMonth+=Number(b.dataset.month);if(calendarMonth<0){calendarMonth=11;calendarYear--;}if(calendarMonth>11){calendarMonth=0;calendarYear++;}const day=Math.min(Number(selectedDate.slice(8)),new Date(Date.UTC(calendarYear,calendarMonth+1,0)).getUTCDate());selectedDate=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;render();});
 document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render();});
}
window.addEventListener('pagehide',()=>{if(draftTimer)persist();stopTimer();cancelSpeech();});
const mobileMenu=matchMedia('(max-width: 800px)');
let menuOpen=false,menuScrollY=0;
const drawer=document.getElementById('study-menu');
const menuButton=document.getElementById('menu-toggle');
const backdrop=document.getElementById('menu-backdrop');
const book=document.querySelector('.book');
function setMenuOpen(open,restoreFocus=true){
 open=!!open&&mobileMenu.matches;
 if(open===menuOpen)return;
 menuOpen=open;root.dataset.menuOpen=String(open);menuButton.setAttribute('aria-expanded',String(open));backdrop.hidden=!open;
 if(open){
  menuScrollY=window.scrollY;
  document.body.style.overflow='hidden';document.body.style.position='fixed';document.body.style.top=-menuScrollY+'px';document.body.style.left='0';document.body.style.right='0';
  drawer.inert=false;drawer.removeAttribute('aria-hidden');drawer.setAttribute('role','dialog');drawer.setAttribute('aria-modal','true');book.inert=true;
  requestAnimationFrame(()=>{if(menuOpen)document.getElementById('menu-close').focus({preventScroll:true});});
 }else{
  book.inert=false;document.body.style.overflow='';document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';
  drawer.inert=mobileMenu.matches;drawer.removeAttribute('role');drawer.removeAttribute('aria-modal');if(mobileMenu.matches)drawer.setAttribute('aria-hidden','true');else drawer.removeAttribute('aria-hidden');
  window.scrollTo({top:menuScrollY,behavior:'instant'});if(restoreFocus&&mobileMenu.matches)menuButton.focus({preventScroll:true});
 }
}
function setupMenu(){
 const layout=()=>{setMenuOpen(false,false);drawer.inert=mobileMenu.matches;if(mobileMenu.matches)drawer.setAttribute('aria-hidden','true');else drawer.removeAttribute('aria-hidden');};
 layout();mobileMenu.addEventListener('change',layout);
 menuButton.addEventListener('click',()=>setMenuOpen(true));
 document.getElementById('menu-close').addEventListener('click',()=>setMenuOpen(false));
 backdrop.addEventListener('click',()=>setMenuOpen(false));
 drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setMenuOpen(false,a.hash==='#'+view)));
 document.addEventListener('keydown',e=>{
  if(!menuOpen)return;
  if(e.key==='Escape'){e.preventDefault();setMenuOpen(false);return;}
  if(e.key!=='Tab')return;
  const items=[...drawer.querySelectorAll('a,button,select')].filter(el=>!el.disabled&&el.getClientRects().length);
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 });
 page.addEventListener('click',e=>{if(!e.target.closest('[data-lesson-date]'))return;selectedDate=lessonDate;calendarYear=2026;calendarMonth=9;});
}

setupMenu();
render();
})();
</script>
</body>
</html>
