<div id="notebook" data-view="home">
  <aside class="spine" id="study-menu" aria-label="학습 메뉴">
    <div class="spine-head">
      <div class="menu-brand"><a class="wordmark" href="#home" aria-label="Deutsch 시작 화면"><span class="dots" aria-hidden="true"><i></i><i></i></span><span lang="de">Deutsch</span></a><button type="button" id="menu-close" class="menu-close" aria-label="메뉴 닫기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
      <label class="person-select"><span class="sr-only">학습자</span><select id="person"><option value="yeonho">연호</option><option value="junghyun">정현</option></select></label>
    </div>
    <nav class="chapter-list" aria-label="전체 학습 메뉴">
      <a href="#home" data-view="home"><span class="nav-label">시작</span></a>

<script>(()=>{

let view=validViews.includes(location.hash.slice(1))?location.hash.slice(1):'home';

function reading(){
 const r=lesson().reading.layers[0],lines=r.lines;
 const blocks=[[lines[0]],lines.slice(1,4),lines.slice(4,7),lines.slice(7,9),lines.slice(9,10),lines.slice(10,12),lines.slice(12)];
 const normalized=x=>' '+x.normalize('NFC').toLocaleLowerCase('de-DE').replace(/[^\p{L}\p{N}]+/gu,' ').trim()+' ';
 const glossBlocks=blocks.map(()=>[]),unmatched=[];
 r.gloss.forEach(g=>{const match=blocks.findIndex(b=>normalized(b.join(' ')).includes(normalized(g.de)));if(match<0)unmatched.push(g);else glossBlocks[match].push(g);});

}
function structure(){const s=lesson().structure;return header('01','문장 구조')+`<div class="study-content"><section class="content-section explanation-block first-rule"><h2 class="section-label">핵심 규칙</h2><p class="structure-first-rule explanation-tier">${esc(s.rules[0])}</p></section><div class="structure-sheet"><section class="content-section example-block"><h2 class="section-label">예문</h2><p class="structure-equation example-tier" lang="de"><span class="blue">Ich</span> <span class="red">bin</span><br><span>neu hier.</span></p></section><section class="content-section"><h2 class="section-label">문장 구조</h2><div class="structure-grid">${s.skeleton.slots.map((slot,i)=>`<div class="slot"><strong lang="de" class="example-tier ${i===0?'blue':i===1?'red':''}">${esc(slot.de)}</strong><span class="content-label">${esc(slot.role)}</span><small class="explanation-tier">${esc(slot.note)}</small></div>`).join('')}</div></section></div><div class="two-pages"><div><section class="content-section explanation-block"><h2 class="section-label">규칙 적용</h2><h3 class="content-label">왜 Ich 뒤에 bin이 올까요?</h3><ol class="structure-rules explanation-tier">${s.rules.slice(1).map(r=>`<li>${esc(r)}</li>`).join('')}</ol></section><section class="rule-line content-section explanation-block"><h2 class="section-label">영어와 비교</h2><p class="english-pair example-tier"><span lang="en">I am.</span><span lang="de">Ich bin.</span></p><p class="small-copy explanation-tier">${esc(s.english)}</p></section></div><aside class="content-section"><h2 class="section-label">낱말·형태 해설</h2><dl class="forms-list">${s.forms.map(f=>`<div class="form-note"><dt class="example-tier" lang="de">${esc(f.de)}</dt><dd class="explanation-tier">${esc(f.why)}</dd></div>`).join('')}</dl></aside></div></div>`;}
function speaking(){const l=lesson().practice.listen,d=lesson().practice.dialogue;return header('04','듣기·말하기','대화를 듣고, 같은 상황에서 직접 답하세요.')+`<div class="study-content"><div class="two-pages"><section class="content-section"><div class="sound-sheet"><h2 class="section-label">듣기</h2><p class="listen-prompt explanation-tier">${esc(l.prompt_ko)}</p><button class="action-button" id="listen">${speechActive?'재생 멈추기':'대화 듣기'}</button><div class="rate-picker"><span>빠르기</span>${[.75,.9,1].map(r=>`<button type="button" data-rate="${r}" aria-label="${r}배속" aria-pressed="${rate===r}">${r}배</button>`).join('')}</div><p class="voice-status explanation-tier" id="voice-status"></p><button type="button" class="text-toggle" data-reveal="transcript" data-show-label="대본 보기" data-hide-label="대본 닫기" aria-expanded="false" aria-controls="listen-transcript">대본 보기</button><div id="listen-transcript" class="answer-content example-block" hidden><h3 class="content-label">대본</h3><p class="model-text example-tier" lang="de">${esc(l.text_de)}</p></div></div><section class="content-section listening-checks"><h2 class="section-label">듣기 확인</h2>${l.checks.map((q,i)=>`<section class="quiz"><h3 class="content-label">${esc(q.prompt_ko)}</h3><div class="quiz-options">${q.options.map((o,j)=>`<button type="button" data-listen-quiz="${i}" data-option="${j}" aria-pressed="${quizAnswers[i]===j}">${esc(o)}</button>`).join('')}</div><p class="quiz-feedback explanation-tier" aria-live="polite">${quizAnswers[i]===undefined?'':quizAnswers[i]===q.answer?esc(q.why_ko):'다시 듣고 골라 보세요.'}</p></section>`).join('')}</section></section><aside class="content-section"><h2 class="section-label">말해보기</h2><div class="explanation-block"><div class="content-label">상황</div><p class="small-copy explanation-tier">${esc(d.situation_ko)}</p></div><div class="timer"><span class="timer-value" id="timer-value">${formatTime(timerRemaining)}</span><div class="timer-buttons"><button id="timer-toggle">${timerId?'잠시 멈춤':'1분 연습 시작'}</button><button id="timer-reset">처음부터</button></div></div>${d.turns.map((turn,i)=>`<section class="dialogue-turn" data-turn="${i}"><h3 class="content-label">${i===0?'인사와 이름 말하기':'이름과 성 구별하기'}</h3><div class="example-block"><div class="content-label">상대방의 말</div><p class="dialogue-quote example-tier" lang="de">${esc(turn.partner_de)}</p></div><div class="explanation-block"><div class="content-label">내가 할 말</div><p class="dialogue-cue explanation-tier">${esc(turn.cue_ko)}</p></div><button type="button" class="text-toggle" data-reveal="model-${i}" data-show-label="답한 뒤 본보기 보기" data-hide-label="본보기 닫기" aria-expanded="false" aria-controls="dialogue-model-${i}">답한 뒤 본보기 보기</button><div id="dialogue-model-${i}" class="answer-content example-block" hidden><div class="content-label">답변 본보기</div><p class="model-text example-tier" lang="de">${esc(turn.model_de)}</p></div></section>`).join('')}</aside></div></div>`;}
function writing(){const w=lesson().practice.transfer,s=state();return header('05','한 문장 쓰기')+`<div class="study-content"><div class="two-pages"><section class="content-section"><section class="writing-instructions explanation-block"><h2 class="section-label">새로운 상황</h2><p class="write-prompt explanation-tier">${esc(w.prompt_ko)}</p></section><section class="content-section"><h2 class="section-label">내 문장</h2><p class="writing-instruction explanation-tier">앞의 문장을 보지 않고 적어 보세요.</p><div class="writing-sheet"><textarea id="writing-input" class="example-tier" lang="de" aria-label="나의 독일어 문장" placeholder="Guten Tag!" spellcheck="false">${esc(s.draft??s.notes[lessonDate]??'')}</textarea></div><div class="write-meta"><span id="char-count">${(s.draft??s.notes[lessonDate]??'').length}자</span></div><div class="writing-actions"><span class="save-status" id="save-status" role="status">${s.notes[lessonDate]?'저장한 문장이 있습니다.':''}</span><button type="button" class="action-button solid" id="save-writing">문장 저장</button></div></section></section><aside class="content-section"><h2 class="section-label">내 문장 확인하기</h2><ul class="writing-checks explanation-tier">${w.success_ko.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><button type="button" class="text-toggle" data-reveal="writing-model" data-show-label="쓴 뒤 본보기 보기" data-hide-label="본보기 닫기" aria-expanded="false" aria-controls="writing-model">쓴 뒤 본보기 보기</button><div id="writing-model" class="answer-content example-block" hidden><h3 class="content-label">문장 본보기</h3><p class="model-text example-tier" lang="de">${esc(w.model_de)}</p></div></aside></div></div>`;}
function calendar(){const monthTitle=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(calendarYear,calendarMonth,1)));const offset=(new Date(Date.UTC(calendarYear,calendarMonth,1)).getUTCDay()+6)%7;const days=new Date(Date.UTC(calendarYear,calendarMonth+1,0)).getUTCDate();const s=state();let cells=Array(offset).fill('<span class="day empty" aria-hidden="true"></span>');for(let day=1;day<=days;day++){const date=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const hasNote=!!s.notes[date];cells.push(`<button type="button" class="day ${selectedDate===date?'selected':''} ${hasNote?'has-note':''}" data-date="${date}" aria-pressed="${selectedDate===date}" aria-label="${calendarMonth+1}월 ${day}일${hasNote?', 저장한 문장 있음':''}">${day}</button>`);}while(cells.length%7)cells.push('<span class="day empty" aria-hidden="true"></span>');const isLesson=selectedDate===lessonDate;return `<div class="page-top archive-top"><h1>학습 달력</h1></div><div class="study-content"><div class="two-pages"><section><div class="calendar-tools"><button type="button" data-month="-1" aria-label="이전 달">이전 달</button><h2 lang="de">${esc(monthTitle)}</h2><button type="button" data-month="1" aria-label="다음 달">다음 달</button></div><div class="calendar-grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<span class="weekday" lang="de">${d}</span>`).join('')}${cells.join('')}</div></section><aside><div class="section-label">선택한 날</div><h2 class="record-date" lang="de">${Number(selectedDate.slice(8))}. ${esc(new Intl.DateTimeFormat('de-DE',{month:'long',timeZone:'UTC'}).format(new Date(selectedDate+'T00:00:00Z')))}</h2><div class="record-detail">${isLesson?`<p>인사와 이름 · ${count()} / 4 완료</p>${[['cards','문장 카드'],['reading','원문 읽기'],['speaking','소리 내기'],['writing','한 문장 쓰기']].map(([id,label])=>`<div class="record-item"><span>${label}</span><span>${s.done[id]?'완료':'아직'}</span></div>`).join('')}`:'<p>아직 남긴 기록이 없어요.</p>'}${s.notes[selectedDate]?`<p class="record-note" lang="de">${esc(s.notes[selectedDate])}</p>`:''}</div>${isLesson?next('writing','이날의 문장 이어 쓰기'):next('home','시작 화면으로')}</aside></div></div>`;}
function noteEntries(search=''){const entries=Object.entries(state().notes).map(([date,text])=>({date,text,kind:'writing'}));if(state().readingMemo)entries.push({date:lessonDate,text:state().readingMemo,kind:'reading'});const filtered=entries.filter(x=>typeof x.text==='string'&&x.text.toLocaleLowerCase().includes(search.toLocaleLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return filtered.length?filtered.map(({date,text,kind})=>`<article class="note-entry"><header><span>${esc(date.replaceAll('-','.'))}</span><span>${kind==='reading'?'읽기 메모':'한 문장 쓰기'}</span></header><p ${kind==='writing'?'lang="de"':'class="memo-copy"'}>${esc(text)}</p><a href="#${kind}">${kind==='reading'?'읽기 메모':'이 문장'} 이어 쓰기</a></article>`).join(''):'<p class="small-copy note-search-empty">검색한 문장이 없어요.</p>';}
function notes(){const has=Object.keys(state().notes).length>0||!!state().readingMemo;return `<div class="page-top archive-top"><h1>내 문장·메모</h1></div><div class="study-content">${has?`<label><span class="sr-only">문장·메모 검색</span><input class="note-search" id="note-search" type="search" placeholder="문장·메모 검색"></label><div id="note-entries">${noteEntries()}</div>`:`<section class="empty-notes"><h2>저장한 문장·메모가 없습니다.</h2><a class="chapter-next" href="#writing" style="width:100%"><span>한 문장 쓰기</span></a></section>`}</div>`;}
function continuation(){const i=sections.findIndex(([id])=>id===view);if(i<0)return '';const target=sections[i+1]?.[0]||'notes';const item=course[target]||{title:'내 문장·메모',goal:'작성한 문장과 메모를 확인합니다.'};return `<section class="lesson-continuation"><div class="continuation-copy"><p class="continuation-label">${target==='notes'?'학습 기록':'다음 학습'}</p><h2>${item.title}</h2><p>${item.goal}</p></div><a class="continue-link" href="#${target}">${target==='notes'?'저장한 문장 보기':item.title+' 이어가기'}</a></section>`;}
function render(focus=false){const map={home,cards,reading,structure,speaking,writing,calendar,notes};root.dataset.view=view;page.innerHTML=map[view]()+continuation()+(sections.some(([id])=>id===view)?tabs():'');updateChrome();bind();if(view==='speaking')updateVoiceStatus();if(focus){window.scrollTo({top:0,behavior:'instant'});page.focus({preventScroll:true});}}
function go(id){if(!validViews.includes(id))id='home';setMenuOpen(false,false);const changed=id!==view;if(changed){stopTimer();cancelSpeech();}view=id;render(true);if(changed&&!matchMedia('(prefers-reduced-motion: reduce)').matches)page.animate([{opacity:.45,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'ease-out'});}
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.getElementById('person').addEventListener('change',e=>{if(draftTimer){clearTimeout(draftTimer);draftTimer=null;persist();}stopTimer();cancelSpeech();person=e.target.value;cardIndex=0;flipped=false;timerRemaining=60;quizAnswers={};readingAnswers={};persist();render();});
function flip(){flipped=!flipped;if(flipped&&!state().seen.includes(cardIndex)){state().seen.push(cardIndex);if(state().seen.length===lesson().cards.length)complete('cards');else persist();}render();document.getElementById('flip-card').focus({preventScroll:true});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('flip-card').animate([{transform:'perspective(900px) rotateY(-8deg)',opacity:.7},{transform:'perspective(900px) rotateY(0)',opacity:1}],{duration:220,easing:'ease-out'});}
function moveCard(delta){cardIndex=Math.max(0,Math.min(lesson().cards.length-1,cardIndex+delta));flipped=false;render();}
function formatTime(s){return '0'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updateTimer(){const t=document.getElementById('timer-value'),b=document.getElementById('timer-toggle');if(t)t.textContent=formatTime(timerRemaining);if(b)b.textContent=timerId?'잠시 멈춤':'1분 연습 시작';}
function toggleTimer(){if(timerId){stopTimer();updateTimer();return;}if(timerRemaining===0)timerRemaining=60;timerId=setInterval(()=>{timerRemaining--;if(timerRemaining<=0){stopTimer();complete('speaking');toast('소리 내기 연습을 마쳤어요.');}updateTimer();},1000);updateTimer();}
function getVoice(){if(!('speechSynthesis'in window))return null;const list=window.speechSynthesis.getVoices().filter(v=>/^de[-_]/i.test(v.lang));const score=v=>(/^de[-_]DE$/i.test(v.lang)?100:0)+(/premium|siri/i.test(v.name+' '+v.voiceURI)?30:/enhanced|natural|neural|wavenet|online/i.test(v.name+' '+v.voiceURI)?20:/eloquence/i.test(v.name+' '+v.voiceURI)?-20:0)+(v.localService?10:0)+(v.default?1:0);return list.sort((a,b)=>score(b)-score(a))[0]||null;}
function updateVoiceStatus(){const el=document.getElementById('voice-status');if(!el)return;const voice=getVoice();el.textContent=voice?'이 기기의 음성 · '+voice.name:'이 기기에서 독일어 음성을 찾지 못했어요.';}
function listen(){if(speechActive){cancelSpeech();const b=document.getElementById('listen');if(b)b.innerHTML='대화 듣기';return;}const voice=getVoice();if(!voice){toast('기기에 독일어 음성이 있어야 들을 수 있어요.');return;}cancelSpeech();const generation=speechGeneration;const utterance=new SpeechSynthesisUtterance(lesson().practice.listen.text_de);utterance.lang='de-DE';utterance.voice=voice;utterance.rate=rate;const restore=()=>{if(generation!==speechGeneration)return false;speechActive=false;const b=document.getElementById('listen');if(b)b.innerHTML='대화 듣기';return true;};utterance.onend=restore;utterance.onerror=e=>{if(!restore())return;if(e.error==='canceled'||e.error==='interrupted')return;updateVoiceStatus();toast('음성을 재생하지 못했어요.');};speechActive=true;window.speechSynthesis.speak(utterance);const b=document.getElementById('listen');if(b)b.innerHTML='재생 멈추기';}
if('speechSynthesis'in window)window.speechSynthesis.addEventListener('voiceschanged',updateVoiceStatus);
function bind(){
 document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{const panel=document.getElementById(b.getAttribute('aria-controls'));const open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(open));panel.hidden=!open;b.textContent=open?b.dataset.hideLabel:b.dataset.showLabel;});
 document.getElementById('flip-card')?.addEventListener('click',flip);
 const card=document.getElementById('flip-card');if(card){let down=null,suppress=false;card.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});card.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){suppress=true;moveCard(dx<0?1:-1);}});card.addEventListener('pointercancel',()=>down=null);card.addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopImmediatePropagation();suppress=false;}},true);}
 document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>moveCard(Number(b.dataset.card)));
 document.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>{if(b.dataset.memory==='again'){flipped=false;render();document.getElementById('flip-card').focus({preventScroll:true});return;}toast('표현을 확인했어요.');if(cardIndex<lesson().cards.length-1)moveCard(1);else{if(state().seen.length===lesson().cards.length)complete('cards');location.hash='speaking';}});
 document.querySelectorAll('[data-reading-quiz]').forEach(b=>b.onclick=()=>{const openMemos=document.querySelector('#reading-memo')?.value;readingAnswers[b.dataset.readingQuiz]=Number(b.dataset.option);render();if(openMemos!==undefined)document.getElementById('reading-memo').value=openMemos;});
 document.getElementById('finish-reading')?.addEventListener('click',()=>{complete('reading');toast('원문 읽기를 마쳤어요.');location.hash='cards';});
 document.getElementById('save-reading')?.addEventListener('click',()=>{const text=document.getElementById('reading-memo').value.trim();if(!text){toast('메모를 먼저 적어 주세요.');return;}state().readingMemo=text;if(persist())toast('읽기 메모를 저장했어요.');});
 document.querySelectorAll('[data-listen-quiz]').forEach(b=>b.onclick=()=>{quizAnswers[b.dataset.listenQuiz]=Number(b.dataset.option);const q=lesson().practice.listen.checks[Number(b.dataset.listenQuiz)],parent=b.closest('.quiz');parent.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));parent.querySelector('.quiz-feedback').textContent=Number(b.dataset.option)===q.answer?q.why_ko:'다시 듣고 골라 보세요.';});
 document.getElementById('listen')?.addEventListener('click',listen);
 document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{rate=Number(b.dataset.rate);cancelSpeech();document.querySelectorAll('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('listen').innerHTML='대화 듣기';});
 document.getElementById('timer-toggle')?.addEventListener('click',toggleTimer);
 document.getElementById('timer-reset')?.addEventListener('click',()=>{stopTimer();timerRemaining=60;updateTimer();});
 const input=document.getElementById('writing-input');if(input)input.addEventListener('input',()=>{const value=input.value;state().draft=value;document.getElementById('char-count').textContent=value.length+'자';document.getElementById('save-status').textContent='쓰는 중';clearTimeout(draftTimer);draftTimer=setTimeout(()=>{const ok=persist();const status=document.getElementById('save-status');if(ok&&status)status.textContent='초안을 보관했어요.';},450);});
 document.getElementById('save-writing')?.addEventListener('click',()=>{const text=input.value.trim();if(!text){toast('문장을 먼저 적어 주세요.');input.focus();return;}state().notes[lessonDate]=text;state().draft=text;state().done.writing=true;if(persist()){document.getElementById('save-status').textContent='문장을 저장했습니다.';toast('문장을 저장했어요.');}});
 document.getElementById('note-search')?.addEventListener('input',e=>document.getElementById('note-entries').innerHTML=noteEntries(e.target.value));
 document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{calendarMonth+=Number(b.dataset.month);if(calendarMonth<0){calendarMonth=11;calendarYear--;}if(calendarMonth>11){calendarMonth=0;calendarYear++;}const day=Math.min(Number(selectedDate.slice(8)),new Date(Date.UTC(calendarYear,calendarMonth+1,0)).getUTCDate());selectedDate=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;render();});
 document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render();});
}
window.addEventListener('pagehide',()=>{if(draftTimer)persist();stopTimer();cancelSpeech();});
const mobileMenu=matchMedia('(max-width: 800px)');
let menuOpen=false,menuScrollY=0;
const drawer=document.getElementById('study-menu');
const menuButton=document.getElementById('menu-toggle');
const backdrop=document.getElementById('menu-backdrop');
const book=document.querySelector('.book');
function setMenuOpen(open,restoreFocus=true){
 open=!!open&&mobileMenu.matches;
 if(open===menuOpen)return;
 menuOpen=open;root.dataset.menuOpen=String(open);menuButton.setAttribute('aria-expanded',String(open));backdrop.hidden=!open;
 if(open){
  menuScrollY=window.scrollY;
  document.body.style.overflow='hidden';document.body.style.position='fixed';document.body.style.top=-menuScrollY+'px';document.body.style.left='0';document.body.style.right='0';
  drawer.inert=false;drawer.removeAttribute('aria-hidden');drawer.setAttribute('role','dialog');drawer.setAttribute('aria-modal','true');book.inert=true;
  requestAnimationFrame(()=>{if(menuOpen)document.getElementById('menu-close').focus({preventScroll:true});});
 }else{
  book.inert=false;document.body.style.overflow='';document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';
  drawer.inert=mobileMenu.matches;drawer.removeAttribute('role');drawer.removeAttribute('aria-modal');if(mobileMenu.matches)drawer.setAttribute('aria-hidden','true');else drawer.removeAttribute('aria-hidden');
  window.scrollTo({top:menuScrollY,behavior:'instant'});if(restoreFocus&&mobileMenu.matches)menuButton.focus({preventScroll:true});
 }
}
function setupMenu(){
 const layout=()=>{setMenuOpen(false,false);drawer.inert=mobileMenu.matches;if(mobileMenu.matches)drawer.setAttribute('aria-hidden','true');else drawer.removeAttribute('aria-hidden');};
 layout();mobileMenu.addEventListener('change',layout);
 menuButton.addEventListener('click',()=>setMenuOpen(true));
 document.getElementById('menu-close').addEventListener('click',()=>setMenuOpen(false));
 backdrop.addEventListener('click',()=>setMenuOpen(false));
 drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setMenuOpen(false,a.hash==='#'+view)));
 document.addEventListener('keydown',e=>{
  if(!menuOpen)return;
  if(e.key==='Escape'){e.preventDefault();setMenuOpen(false);return;}
  if(e.key!=='Tab')return;
  const items=[...drawer.querySelectorAll('a,button,select')].filter(el=>!el.disabled&&el.getClientRects().length);
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 });
 page.addEventListener('click',e=>{if(!e.target.closest('[data-lesson-date]'))return;selectedDate=lessonDate;calendarYear=2026;calendarMonth=9;});
}

setupMenu();
render();
})();
</script>
