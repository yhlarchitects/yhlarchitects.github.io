<style>
/* Letters are Univers 55 outlines. One size for both lines: YHLA spans the width, the mail's baseline sits on the bottom edge */
:root{--f:min(37.5vw,67vh);color-scheme:light}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f6f5f0;color:#000}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;overflow:hidden;font-size:var(--f);line-height:1}
.paint{position:absolute;left:0;top:0;width:100%;height:300%;background:#f6f5f0;will-change:transform}
.word{position:absolute;left:0;top:0;font-size:1em;color:#000;transition:color .5s linear}
.word svg{display:block;width:2.6670em;height:0.7220em;fill:currentColor;overflow:visible}
.mail{position:absolute;left:0;right:0;top:calc(100% - 0.7410em);height:0.9310em;display:block;color:#000;cursor:pointer;transition:color .5s linear}
.track{display:flex;width:max-content;will-change:transform}
.track svg{display:block;flex:none;width:11.6330em;height:0.9310em;fill:currentColor;overflow:visible}
.hide{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* colour button: the half-filled circle at the top right, sized and placed in em like the reference mark */
.dot{position:absolute;top:0;right:0;font:inherit;width:max(48px,.16em);height:max(48px,.16em);border:0;border-radius:0;background:none;color:#000;
  cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;transition:color .5s linear}
.dot svg{position:absolute;top:.0065em;right:.0165em;width:max(14px,.097em);height:max(14px,.097em);display:block;overflow:visible}
.mail:focus-visible{outline:3px solid currentColor;outline-offset:-6px}
.dot:focus-visible{outline:2px solid currentColor;outline-offset:-4px}
</style>

<script>
(function(){
  var WORDW=2.6670,CAP=0.7240,UNITW=11.6330,COPY='<svg viewBox="0 -741 11633 931"><use href="#unit"/></svg>';
  var root=document.documentElement,stage=document.getElementById("stage"),paint=document.getElementById("paint"),
      word=document.getElementById("word"),mail=document.getElementById("mail"),track=document.getElementById("track"),
      dot=document.getElementById("dot"),meta=document.getElementById("themeColor");
  var SPEED=.4,PERIOD=5000,SWEEP=2000,FLIP=800,GAP=.77;
  var F=0,unit=0,x=0,v=0,last=null,timer=null,settle=null;
  var cur=[246,245,240],curInk="#000",prev=cur,prevInk=curInk,autoT0=-1e9;

  /* layout: the colour field is the whole window */
  function layout(){
    var W=stage.clientWidth,H=stage.clientHeight,old=unit;
    F=Math.min(W/WORDW,H/(CAP+GAP));
    stage.style.fontSize=F+"px";
    unit=UNITW*F;
    var n=Math.ceil(W/unit)+2;
    if(track.children.length!==n){var s="";for(var i=0;i<n;i++)s+=COPY;track.innerHTML=s;}
    if(old>0)x=x/old*unit;
    while(x<=-unit)x+=unit;
    put();
  }
  function put(){track.style.transform="translate3d("+x.toFixed(2)+"px,0,0)";}

  /* the mail flows slowly to the left, without end */
  function frame(t){
    if(last!==null){
      var dt=Math.min(.05,(t-last)/1000);
      v+=(SPEED-v)*Math.min(1,dt*2);
      x-=v*F*dt;
      if(unit>0)while(x<=-unit)x+=unit;
      put();
    }
    last=t;
    requestAnimationFrame(frame);
  }

  /* colour */
  function hsl(h,s,l){
    s/=100;l/=100;var a=s*Math.min(l,1-l);
    function f(n){var k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));}
    return [Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4))];
  }
  function hueOf(c){
    var r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h;
    if(d<.02)return null;
    if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;
    h*=60;return h<0?h+360:h;
  }
  function lin(u){u/=255;return u<=.04045?u/12.92:Math.pow((u+.055)/1.055,2.4);}
  /* white or all-black, whichever reads better on the colour */
  function inkOf(c){var L=.2126*lin(c[0])+.7152*lin(c[1])+.0722*lin(c[2]);return (L+.05)/.05>=1.05/(L+.05)?"#000":"#fff";}
  function hex(c){return "#"+c.map(function(u){return ("0"+u.toString(16)).slice(-2);}).join("");}
  function flip(c){return c.map(function(u){return 255-u;});}
  function apart(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d;}
  function neon(){
    var h0=hueOf(cur),h,i=0;
    do{h=Math.random()*360;i++;}while(h0!==null&&apart(h,h0)<70&&i<24);
    return hsl(h,85+Math.random()*15,54+Math.random()*12);
  }
  function grad(a,b,oklch){return "linear-gradient("+(oklch?"in oklch ":"")+"to bottom,"+a+" 33.34%,"+b+" 66.66%)";}
  function delay(el,ms){el.style.transitionDelay=ms+"ms";}
  /* the new colour pours in from the top with a gradient edge */
  function sweep(next,dur,ink){
    var a=hex(next),b=hex(cur);
    ink=ink||inkOf(next);
    clearTimeout(settle);
    paint.style.transition="none";
    paint.style.backgroundImage=grad(a,b,false);
    paint.style.backgroundImage=grad(a,b,true);
    paint.style.transform="translate3d(0,-66.666%,0)";
    void paint.offsetWidth;
    paint.style.transition="transform "+dur+"ms cubic-bezier(.45,0,.25,1)";
    delay(dot,Math.round(dur*.25));delay(word,Math.round(dur*.4));delay(mail,Math.round(dur*.62));
    paint.style.transform="translate3d(0,0,0)";
    word.style.color=mail.style.color=dot.style.color=ink;
    settle=setTimeout(function(){root.style.backgroundColor=document.body.style.backgroundColor=a;meta.setAttribute("content",a);},dur);
    prev=cur;prevInk=curInk;cur=next;curInk=ink;
  }
  function later(ms){clearTimeout(timer);timer=setTimeout(step,ms);}
  function step(){sweep(neon(),SWEEP);autoT0=performance.now();later(PERIOD);}
  /* colour button: the complement of the colour on screen, and the letters turn over with it.
     In the first half of a pour the old colour still holds most of the window, so that one counts. */
  dot.addEventListener("click",function(){
    if(performance.now()-autoT0<SWEEP*.5){cur=prev;curInk=prevInk;}
    autoT0=-1e9;
    sweep(flip(cur),FLIP,curInk==="#000"?"#fff":"#000");
    later(PERIOD+2000);
  });

  var pending=false;
  window.addEventListener("resize",function(){if(pending)return;pending=true;requestAnimationFrame(function(){pending=false;layout();});});
  layout();
  requestAnimationFrame(frame);
  later(1000);
})();
</script>
