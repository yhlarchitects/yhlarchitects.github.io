name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install image tools
        run: python -m pip install -r tools/requirements.txt
      - name: Build photo catalog and website
        run: python tools/build-site.py --output site-dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist
      - name: Wait for the uploaded site to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages"
          for i in $(seq 1 40); do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$url" | python -c "import json,sys;print(json.load(sys.stdin).get('total_count',0))")
            if [ "$n" -ge 1 ]; then echo "listed after $i checks"; sleep 10; exit 0; fi
            sleep 3
          done
          echo "artifact not listed yet, trying deploy anyway"
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
